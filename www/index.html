//  MODUL 13b: NPC-EINWOHNER-KI - ANKUNFT & BEWEGUNG (KORRIGIERT)
// =========================================================================

function getNeededBuildersNPC() {
  let needed = 0;
  for (let b of npcBuildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleNpcArrival(v, home) {
  if (v.state === 'movingToResource' && v.resourceTarget) {
    const node = cachedNpcResourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.ready && node.claimedBy === v.id) {
      // Ressource abholen
      if (node.type === 'grain') npcResources.grain += 1;
      else if (node.type === 'wood') npcResources.wood += 1;
      else if (node.type === 'stone') npcResources.stone += 1;

      // NODE ENTFERNEN - jetzt erst wenn abgeholt!
      const idx = npcResourceNodes.indexOf(node);
      if (idx !== -1) { 
        npcResourceNodes.splice(idx, 1);
        refreshNpcResourceCache();
        markDirty('villagers');
      }
      v.carrying = node.type; 
      v.deliveryTarget = null;
    } else {
      // Node nicht mehr verfügbar oder nicht ready -> zurücksetzen
      v.state = 'idle';
      v.resourceTarget = null;
      v.hasTask = false;
      // Wenn node existiert aber nicht ready, Claim aufheben
      if (node && node.claimedBy === v.id) {
        node.claimedBy = null;
      }
      return;
    }
    v.resourceTarget = null;
    v.state = 'returningHome';

    // === LAGER SUCHEN - CACHE AKTUALISIEREN ===
    refreshLagerCache();

    // === NUR ZUM LAGER GEHEN ===
    let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);

    // === FALLBACK: DIREKT IN NPCBUILDINGS SUCHEN ===
    if (!lager) {
      // Direkt in npcBuildings nach einem Lager suchen
      for (let b of npcBuildings) {
        if (b.type === 'lager') {
          lager = b;
          break;
        }
      }
    }

    if (lager) {
      v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
      v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
      // === KEIN LAGER = NPC GAME OVER ===
      v.alive = false;
      v.carrying = null;
      v.state = 'idle';
      v.hasTask = false;
      // NPC hat kein Lager mehr - er kann nicht mehr überleben
      // Aber wir geben ihm eine letzte Chance: Er baut ein neues Lager
      showTemporaryMessage('🤖 NPC hat kein Lager mehr! Versucht zu überleben...', '#ff6b6b');
      // Versuche ein neues Lager zu bauen
      const pos = findLagerPosition ? findLagerPosition() : findStandardPosition('lager', true);
      if (pos && npcCanAfford('lager')) {
        npcDeductCost('lager');
        const b = new Building(nextBuildingId++, 'lager', pos.x, pos.y, true);
        b.isUnderConstruction = true; b.constructionTimer = 0; b.constructionProgress = 0; b.waitingForBuilder = true;
        npcBuildings.push(b); assignNpcBuilderToConstruction(b.id);
        showTemporaryMessage('🤖 NPC baut neues Lager!', '#9b59b6');
        markDirty('villagers');
      } else {
        // NPC kann kein Lager bauen -> Game Over für NPC (Spieler gewinnt)
        showTemporaryMessage('🤖 NPC SIEDLUNG ZUSAMMENGEBROCHEN!', '#ff0000');
        // Alle NPC-Gebäude werden zu Spieler-Gebäuden (Sieg)
        for (let nb of npcBuildings) {
          nb.isNPC = false;
          nb.id = nextBuildingId++;
          buildings.push(nb);
        }
        npcBuildings = [];
        npcVillagers = [];
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
        document.getElementById('gameOverSub').textContent = 'NPC hat kein Lager - Du hast gewonnen!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
      }
    }
  } else if (v.state === 'returningHome' && v.carrying) {
    v.carrying = null; 
    v.state = 'idle'; 
    v.resourceTarget = null; 
    v.hasTask = false; 
    v.deliveryTarget = null;
    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
    v.targetX = homePos.x; 
    v.targetY = homePos.y;
  }
}


// =========================================================================
//  MODUL 13c: NPC-EINWOHNER-KI – KOMPLETT OPTIMIERT (VOLLSTÄNDIG)
// =========================================================================

// =========================================================================
//  MODUL 13c: NPC-EINWOHNER-KI - HAUPTLOGIK (KOMPLETT)
// =========================================================================

let lastNPCVillagerHitTime = 0;
// =======================================
// ============================================================
//  WASM-WRAPPER FÜR NPC VILLAGER BEWEGUNG
// ============================================================
function moveNpcVillagersWithWasm(npcVillagers, dt) {
    if (!wasmLoaded || !wasmExports || typeof wasmExports.moveNpcVillagersBatch !== 'function') {
        return false;
    }
    
    const count = npcVillagers.length;
    if (count === 0) return true;
    
    try {
        const x = new Float32Array(count);
        const y = new Float32Array(count);
        const targetX = new Float32Array(count);
        const targetY = new Float32Array(count);
        const speeds = new Float32Array(count);
        const alive = new Uint8Array(count);
        
        let aliveCount = 0;
        for (let i = 0; i < count; i++) {
            const v = npcVillagers[i];
            x[i] = v.x || 0;
            y[i] = v.y || 0;
            targetX[i] = v.targetX || 0;
            targetY[i] = v.targetY || 0;
            speeds[i] = v.speed || 70;
            alive[i] = v.alive ? 1 : 0;
            if (v.alive) aliveCount++;
        }
        
        if (aliveCount === 0) return true;
        
        wasmExports.moveNpcVillagersBatch(x, y, targetX, targetY, speeds, alive, count, dt);
        
        for (let i = 0; i < count; i++) {
            if (alive[i]) {
                const v = npcVillagers[i];
                v.x = x[i];
                v.y = y[i];
            }
        }
        return true;
    } catch(e) {
        console.warn('⚠️ WASM-NPC-Villager Fehler:', e.message);
        return false;
    }
}

// ============================================================
//  KOMPLETTE updateNPCVillagers() - MIT WASM-UNTERSTÜTZUNG
// ============================================================
function updateNPCVillagers(dt) {
    // ===== NEU: WASM-BEWEGUNG FÜR NPC =====
    const wasmMovementDone = moveNpcVillagersWithWasm(npcVillagers, dt);
    
    // ===== 1. CACHES NUR BEI BEDARF LADEN =====
    if (npcCacheNeedsRefresh) {
        refreshNpcVillagerCache();
        npcCacheNeedsRefresh = false;
    }
    if (cachedNpcResourceNodesDirty) {
        refreshNpcResourceCache();
        cachedNpcResourceNodesDirty = false;
    }
    if (lagerCacheDirty) {
        refreshLagerCache();
        lagerCacheDirty = false;
    }

    // ===== 2. NODE-CLAIMS BEREINIGEN =====
    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // ===== 3. TURM-RESERVIERUNGEN BEREINIGEN =====
    for (let tower of npcBuildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of npcVillagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    // ===== 4. CONSTRUCTION SITES BEREINIGEN =====
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (!site.isNPC) continue;
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_npc_', ''));
            const grenze = npcGrenzen.find(g => g.id === grenzeId);
            if (grenze) {
                const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
                if (!builder) {
                    grenze.builder = null;
                    grenze.waitingForBuilder = true;
                    delete constructionSites[key];
                }
            }
            continue;
        }
        const building = npcBuildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // ===== 5. CAPTURE-TARGETS BEREINIGEN =====
    for (let v of npcVillagers) {
        if (v.alive && v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    // ===== 6. NODE-CLAIMS ERNEUT PRÜFEN =====
    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // ===== 7. VILLAGER-LISTE AKTUALISIEREN =====
    npcVillagers = cachedNpcVillagers.slice();

    // ===== 8. TURM-ÜBERFÜLLE AUSGLEICHEN =====
    for (let building of npcBuildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            npcResources.stone += overflow;
        }
    }

    // ===== 9. BENÖTIGTE BAUER =====
    const neededBuilders = getNeededBuildersNPC();
    const freeForTasks = cachedNpcFreeVillagers.slice(neededBuilders);

    // ===== 10. STEIN-PRIORITÄT =====
    const now = performance.now() / 1000;
    const stonePriority = (now - lastNPCVillagerHitTime < 10);
    const hasGrainNodes = cachedNpcResourceNodes.some(n => n.type === 'grain' && !n.claimedBy);
    const grainPriority = (npcResources.grain < 50 && hasGrainNodes);

    // ===== 11. STEIN-LIEFERUNGEN =====
    const towersNeedingStone = npcBuildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = getCachedFreeVillagers('npc');

    const totalFree = freeForStone.length;
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && npcResources.stone > 0 && totalFree > 0) {
        const currentlyDelivering = cachedNpcVillagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, npcResources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || npcResources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                
                const towerX = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const towerY = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const searchRange = Math.max(CONFIG.CELL_SIZE * 10, 300);
                
                const nearestVillagers = findNearestVillagersWithFallback(
                    towerX, towerY, searchRange, canSend, 'npc'
                );
                
                for (let closestVillager of nearestVillagers) {
                    if (npcResources.stone <= 0) break;
                    if (closestVillager.hasTask || closestVillager.isDeliveringStone) continue;
                    if (!closestVillager.alive) continue;
                    
                    tower.reservedStone += 1;
                    npcResources.stone -= 1;
                    const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE, true);
                    if (lager) {
                        closestVillager.towerTarget = tower;
                        closestVillager.state = 'movingToLagerForStone';
                        closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.hasTask = true;
                        closestVillager.isDeliveringStone = true;
                        closestVillager.stoneToDeliver = 1;
                        closestVillager.hasReservedStone = true;
                        closestVillager.carrying = 'stone';
                        markFreeVillagerCacheDirty('npc');
                    } else {
                        npcResources.stone += 1;
                        tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                    }
                }
            }
        }
    }

    // ===== 12. FREIE VILLAGER FÜR RESSOURCEN =====
    const freeForTasksAfterStone = cachedNpcFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const readyNodesWithFields = cachedNpcResourceNodes.filter(node => 
        !node.claimedBy && 
        node.ready &&
        node.fields && 
        node.fields.length > 0
    );

    const allReadyNodes = readyNodesWithFields;

    // ===== 13. RESSOURCEN-ZUWEISUNG =====
    if (allReadyNodes.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            let sortedNodes = allReadyNodes;
            if (grainPriority) {
                sortedNodes = [...allReadyNodes].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...allReadyNodes].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            }

            for (let node of sortedNodes) {
                if (node.claimedBy) continue;
                
                const hasUnharvestedFields = node.fields.some(f => !f.harvested);
                if (!hasUnharvestedFields) {
                    node.ready = false;
                    node.timer = 0;
                    node.claimedBy = null;
                    for (let f of node.fields) {
                        f.harvested = false;
                        f.harvestTimer = 0;
                        f.isBeingHarvested = false;
                    }
                    markDirty('villagers');
                    continue;
                }

                const nextField = node.fields.find(f => !f.harvested);
                if (!nextField) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - nextField.x * CONFIG.CELL_SIZE, v.y - nextField.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'harvestingField';
                    closestVillager.isHarvesting = true;
                    closestVillager.harvestBuildingId = node.buildingId;
                    closestVillager.harvestFieldIndex = node.fields.indexOf(nextField);
                    closestVillager.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                    
                    nextField.isBeingHarvested = true;
                }
            }
        }
    }

    // ===== 14. HAUPT-VILLAGER-LOOP =====
    const npcsToUpdate = cachedNpcVillagers.slice();

    for (let v of npcsToUpdate) {
        const home = npcBuildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        // ---- 14a. ATTACK CHECK ----
        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // ---- 14b. CAPTURE MOVEMENT ----
        if (v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            
            // ===== BEWEGUNG NUR WENN KEIN WASM =====
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
            continue;
        }

        // ---- 14c. ATTACK MOVEMENT ----
        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
            continue;
        }

        // ---- 14d. HARVESTING ----
        if (v.state === 'harvestingField' && v.isHarvesting) {
            let node = npcResourceNodes.find(n => n.buildingId === v.harvestBuildingId);
            
            if (!node || !node.fields || node.fields.length === 0) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            if (!node.ready) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                v.resourceTarget = null;
                node.claimedBy = null;
                continue;
            }
            
            const fieldIndex = v.harvestFieldIndex;
            if (fieldIndex === undefined || fieldIndex >= node.fields.length) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            const field = node.fields[fieldIndex];
            const targetX = field.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const targetY = field.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            v.targetX = targetX;
            v.targetY = targetY;
            
            if (!wasmMovementDone) {
                moveVillagerInline(v, targetX, targetY, dt);
            }
            
            if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                field.harvestTimer += dt;
                
                if (field.harvestTimer >= 0.25) {
                    field.harvested = true;
                    field.isBeingHarvested = false;
                    field.harvestTimer = 0;
                    createHarvestEffect(targetX, targetY, 1);
                    
                    if (!v.harvestedCount) v.harvestedCount = 0;
                    v.harvestedCount += 1;
                    
                    const allHarvested = node.fields.every(f => f.harvested);
                    
                    if (allHarvested) {
                        v.carrying = node.type;
                        v.carryingCount = v.harvestedCount;
                        v.isHarvesting = false;
                        v.state = 'returningHome';
                        v.hasTask = true;
                        v.resourceTarget = null;
                        v.harvestedCount = 0;
                        
                        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
                        if (lager) {
                            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const homeBuilding = npcBuildings.find(b => b.id === v.homeId);
                            if (homeBuilding) {
                                v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                v.state = 'idle';
                                v.hasTask = false;
                                v.carrying = null;
                                v.carryingCount = 0;
                                continue;
                            }
                        }
                        
                        node.ready = false;
                        node.timer = 0;
                        node.claimedBy = null;
                        for (let f of node.fields) {
                            f.harvested = false;
                            f.harvestTimer = 0;
                            f.isBeingHarvested = false;
                        }
                        
                        markDirty('villagers');
                        continue;
                    } else {
                        const nextField = node.fields.find(f => !f.harvested);
                        if (nextField) {
                            nextField.isBeingHarvested = true;
                            nextField.harvestTimer = 0;
                            v.harvestFieldIndex = node.fields.indexOf(nextField);
                            v.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                        } else {
                            v.carrying = node.type;
                            v.carryingCount = v.harvestedCount;
                            v.isHarvesting = false;
                            v.state = 'returningHome';
                            v.hasTask = true;
                            v.resourceTarget = null;
                            v.harvestedCount = 0;
                            
                            let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
                            if (lager) {
                                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                const homeBuilding = npcBuildings.find(b => b.id === v.homeId);
                                if (homeBuilding) {
                                    v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                    v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                } else {
                                    v.state = 'idle';
                                    v.hasTask = false;
                                    v.carrying = null;
                                    v.carryingCount = 0;
                                    continue;
                                }
                            }
                            
                            node.ready = false;
                            node.timer = 0;
                            node.claimedBy = null;
                            for (let f of node.fields) {
                                f.harvested = false;
                                f.harvestTimer = 0;
                                f.isBeingHarvested = false;
                            }
                            
                            markDirty('villagers');
                            continue;
                        }
                    }
                }
            }
            continue;
        }

        // ---- 14e. BUILDING ----
        if (v.isBuilding && v.buildingTarget) {
            const building = npcBuildings.find(b => b.id === v.buildingTarget);
            const grenze = npcGrenzen.find(g => g.id === v.buildingTarget);
            
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                continue;
            } else if (grenze && grenze.isUnderConstruction) {
                const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        // ---- 14f. ATTACKING ----
        if (v.isAttacking) continue;

        // ---- 14g. STONE DELIVERY ----
        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
                if (lager) {
                    const targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetX = targetX;
                    v.targetY = targetY;
                    if (!wasmMovementDone) {
                        moveVillagerInline(v, targetX, targetY, dt);
                    }
                    
                    if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && npcBuildings.includes(v.towerTarget) && 
                            !v.towerTarget.isUnderConstruction && 
                            v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const altTower = findNearestNPCTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                            if (altTower) {
                                if (v.towerTarget) {
                                    v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                                }
                                altTower.reservedStone += toDeliver;
                                v.towerTarget = altTower;
                                v.carrying = 'stone';
                                v.stoneToDeliver = toDeliver;
                                v.state = 'deliveringStoneToTower';
                                v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                npcResources.stone += toDeliver;
                                if (v.towerTarget) {
                                    v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                                }
                                v.state = 'idle';
                                v.hasTask = false;
                                v.isDeliveringStone = false;
                                v.towerTarget = null;
                                v.stoneToDeliver = 0;
                                v.hasReservedStone = false;
                                v.carrying = null;
                            }
                        }
                    }
                } else {
                    npcResources.stone += (v.stoneToDeliver || 0);
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                
                if (!tower || !npcBuildings.includes(tower) || 
                    tower.isUnderConstruction || 
                    tower.stoneAmmo >= tower.maxStoneAmmo) {
                    const altTower = findNearestNPCTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                    if (altTower) {
                        if (tower) {
                            tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                        }
                        altTower.reservedStone += (v.stoneToDeliver || 0);
                        v.towerTarget = altTower;
                        v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    } else {
                        npcResources.stone += (v.stoneToDeliver || 0);
                        if (tower) {
                            tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                        }
                        v.carrying = null;
                        v.state = 'idle';
                        v.hasTask = false;
                        v.isDeliveringStone = false;
                        v.towerTarget = null;
                        v.stoneToDeliver = 0;
                        v.hasReservedStone = false;
                    }
                    continue;
                }
                
                const targetX = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                
                if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            npcResources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                }
                continue;
            }
        }

        // ---- 14h. RETURNING HOME ----
        if (v.state === 'returningHome' && v.carrying) {
            const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
            if (lager) {
                const targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                
                if (Math.abs(v.x - targetX) < 5 && Math.abs(v.y - targetY) < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') npcResources.grain += count;
                    else if (v.carrying === 'wood') npcResources.wood += count;
                    else if (v.carrying === 'stone') npcResources.stone += count;
                    else if (v.carrying === 'fish') npcResources.fish = (npcResources.fish || 0) + count;
                    
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                    
                    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                    v.targetX = homePos.x;
                    v.targetY = homePos.y;
                    
                    markDirty('villagers');
                    continue;
                }
            } else {
                const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                  y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                v.targetX = homePos.x;
                v.targetY = homePos.y;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, homePos.x, homePos.y, dt);
                }
                
                if (Math.abs(v.x - homePos.x) < 5 && Math.abs(v.y - homePos.y) < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') npcResources.grain += count;
                    else if (v.carrying === 'wood') npcResources.wood += count;
                    else if (v.carrying === 'stone') npcResources.stone += count;
                    else if (v.carrying === 'fish') npcResources.fish = (npcResources.fish || 0) + count;
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                }
                continue;
            }
            continue;
        }

        // ---- 14i. CARRYING CHECK ----
        if (v.carrying !== null && !v.isDeliveringStone && v.state !== 'returningHome') {
            v.state = 'returningHome';
            const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, 
                                          v.resourceTarget ? v.resourceTarget.y : home.gridY, true);
            if (lager) {
                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            } else {
                v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            }
            v.resourceTarget = null;
        }

        // ---- 14j. MOVING TO RESOURCE ----
        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedNpcResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        // ---- 14k. IDLE MOVEMENT ----
        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                             y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { 
                v.targetX = homePos.x;
                v.targetY = homePos.y; 
            }
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
        }

        // ---- 14l. MOVEMENT EXECUTION ----
        if (v.state === 'movingToResource' || v.state === 'returningHome' || 
            v.state === 'idle' || v.state === 'movingToLagerForStone') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY, true);
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
        }
    }

    // ===== 15. CACHE BEREINIGEN - NUR BEI ECHTEN ÄNDERUNGEN =====
    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of npcBuildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of npcVillagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    // ===== 16. CACHE DIRTY NUR BEI ECHTEN ÄNDERUNGEN =====
    const currentFreeCount = npcVillagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;
    
    if (currentFreeCount !== cachedNpcFreeVillagers.length) {
        cachedFreeVillagersNpcDirty = true;
    }
    
    if (npcVillagers.length !== cachedNpcVillagers.length) {
        npcCacheNeedsRefresh = true;
        villagerGridDirtyNpc = true;
    }
    
    // KEIN markDirty('villagers') mehr!
}

// ===== DRACHEN SPAWNEN =====
function spawnDragon() {

        case 2: x = margin; y = margin + Math.random() * (WORLD_HEIGHT - margin * 2); break;
        case 3: x = WORLD_WIDTH - margin; y = margin + Math.random() * (WORLD_HEIGHT - margin * 2); break;

}

let npcAttackProtectionTimer = 0;
let npcAttackProtectionActive = true;
let npcAttackProtectionMessageShown = false;

// ===== FEINDE SPAWNEN (MIT GRUPPENANGRIFF) =====

let enemyDivisor = 2; // Standard: Normal (÷2)

function spawnEnemies() {
    // ===== ERST BEI 12 EINWOHNERN SPAWNEN =====
    const playerPopulation = villagers.filter(v => v.alive).length;
    if (playerPopulation < 12) return;
    
    // ===== MAXIMALE FEINDE BERECHNEN =====
    let maxEnemies;
    
    if (enemyDivisor === -1) {
        // Extrem: doppelte Gegner (Bevölkerung × 2)
        maxEnemies = playerPopulation * 2;
    } else if (enemyDivisor < 1 && enemyDivisor > 0) {
        // Bei 0.5: Bevölkerung ÷ 0.5 = ×2
        maxEnemies = Math.floor(playerPopulation / enemyDivisor);
    } else {
        // Normal: Bevölkerung ÷ Divisor (1, 2, 10, 20)
        maxEnemies = Math.floor(playerPopulation / enemyDivisor);
    }
    
    // Mindestens 1 Gegner
    if (maxEnemies < 1) maxEnemies = 1;
    
    // Performance-Schutz
    if (maxEnemies > CONFIG.MAX_ENEMIES) maxEnemies = CONFIG.MAX_ENEMIES;
    
    const currentEnemies = enemies.filter(e => e.alive).length;
    const toSpawn = Math.min(maxEnemies - currentEnemies, CONFIG.MAX_SPAWN_PER_FRAME);
    
    if (toSpawn <= 0) return;
    
    // ===== BESTIMME ZIEL (MITTELPUNKT DER SIEDLUNG) =====
    const center = getSettlementCenter('player');
    const centerWorldX = center.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const centerWorldY = center.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    
    // ===== ZUFÄLLIGEN PROZENTSATZ FÜR SUPER-ENEMIES (5-15%) =====
    const superChance = 0.05 + Math.random() * 0.10;
    
    for (let i = 0; i < toSpawn; i++) {
        // ===== FEINDE SPAWNEN AM RAND DER KARTE =====
        const side = Math.floor(Math.random() * 4);
        let x, y;
        const margin = 50;
        switch(side) {
            case 0: x = margin + Math.random() * (WORLD_WIDTH - margin * 2); y = margin; break;
            case 1: x = margin + Math.random() * (WORLD_WIDTH - margin * 2); y = WORLD_HEIGHT - margin; break;
            case 2: x = margin; y = margin + Math.random() * (WORLD_HEIGHT - margin * 2); break;
            case 3: x = WORLD_WIDTH - margin; y = margin + Math.random() * (WORLD_HEIGHT - margin * 2); break;
        }
        
        // ===== SUPER-ENEMY ENTSCHEIDEN =====
        const isSuper = Math.random() < superChance;
        const enemy = new Enemy(nextEnemyId++, x, y, isSuper);
        
        // ===== ZIEL FÜR DEN FEIND BESTIMMEN =====
        let targetX, targetY;
        
        if (SPLIT_SCREEN || NETWORK_MODE) {
            // Split-Modus: Nächstes Spieler-Zentrum
            const centerPlayer2 = getSettlementCenter('player2');
            const centerWorldX2 = centerPlayer2.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const centerWorldY2 = centerPlayer2.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            
            const distToP1 = Math.hypot(x - centerWorldX, y - centerWorldY);
            const distToP2 = Math.hypot(x - centerWorldX2, y - centerWorldY2);
            
            if (distToP1 <= distToP2) {
                targetX = centerWorldX;
                targetY = centerWorldY;
            } else {
                targetX = centerWorldX2;
                targetY = centerWorldY2;
            }
        } else {
            // Einzelmodus: NPC-Zentrum
            const centerNpc = getSettlementCenter(null);
            const centerWorldX2 = centerNpc.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const centerWorldY2 = centerNpc.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            
            const distToP1 = Math.hypot(x - centerWorldX, y - centerWorldY);
            const distToNpc = Math.hypot(x - centerWorldX2, y - centerWorldY2);
            
            if (distToP1 <= distToNpc) {
                targetX = centerWorldX;
                targetY = centerWorldY;
            } else {
                targetX = centerWorldX2;
                targetY = centerWorldY2;
            }
        }
        
        enemy.targetX = targetX;
        enemy.targetY = targetY;
        enemies.push(enemy);
    }
    
    // ===== GROSSANGRIFF PRÜFEN =====
    const aliveEnemies = enemies.filter(e => e.alive);
    if (aliveEnemies.length >= CONFIG.ENEMY_GROUP_ATTACK_THRESHOLD) {
        for (let e of aliveEnemies) {
            e.isGroupAttack = true;
        }
        showTemporaryMessage(`⚔️ GROSSANGRIFF! ${aliveEnemies.length} Feinde stürmen!`, '#ff4444', true);
        SoundFX.playIfVisible(centerWorldX, centerWorldY, 'enemyDeath');
    }
    
    combatGridDirtyEnemy = true;
}

// ===== DRACHEN UPDATE =====
function updateDragons(dt) {
    // ===== SPAWN-TIMER =====
    if (!dragons.some(d => d.alive)) {
        dragonSpawnTimer += dt;
        
        // ===== GESAMTBEVÖLKERUNG BERECHNEN =====
        let totalPopulation = villagers.filter(v => v.alive).length;
        
        if (SPLIT_SCREEN || NETWORK_MODE) {
            totalPopulation += player2Villagers.filter(v => v.alive).length;
        } else {
            totalPopulation += npcVillagers.filter(v => v.alive).length;
        }
        
        // ===== DRACHE ERSCHEINT BEI 100+ EINWOHNERN =====
        if (totalPopulation >= 100 && dragonSpawnTimer >= dragonSpawnInterval) {
            dragonSpawnTimer = 0;
            dragonSpawnInterval = 300 + Math.random() * 300;
            spawnDragon();
        }
    }
    
    const dragon = dragons.find(d => d.alive);
    if (!dragon) return;
    
    if (dragon.shootCooldown > 0) {
        dragon.shootCooldown -= dt;
    }
    
    // ===== ZIEL FINDEN =====
    let allBuildings = [];
    if (SPLIT_SCREEN) {
        allBuildings = [...buildings, ...player2Buildings];
    } else {
        allBuildings = [...buildings, ...npcBuildings];
    }
    
    let nearestBuilding = null;
    let nearestDist = Infinity;
    
    for (let b of allBuildings) {
        if (b.isUnderConstruction) continue;
        const bx = b.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const by = b.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const d = Math.hypot(dragon.x - bx, dragon.y - by);
        if (d < nearestDist) {
            nearestDist = d;
            nearestBuilding = b;
        }
    }
    
    if (!nearestBuilding) return;
    
    const targetX = nearestBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const targetY = nearestBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const distToTarget = Math.hypot(dragon.x - targetX, dragon.y - targetY);
    
    // ===== DRACHEN-ROTATION (IN FLUGRICHTUNG) =====
    const angle = Math.atan2(targetY - dragon.y, targetX - dragon.x);
    dragon.rotation = angle;
    
    if (distToTarget <= dragon.range) {
        dragon.state = 'attacking';
        dragon.targetX = targetX;
        dragon.targetY = targetY;
        
        if (dragon.shootCooldown <= 0) {
            dragon.shootCooldown = dragon.shootInterval;
            
            dragonProjectiles.push({
                x: dragon.x,
                y: dragon.y,
                targetX: targetX,
                targetY: targetY,
                speed: 150,
                building: nearestBuilding,
                life: 0,
                maxLife: 2.0
            });
            
            SoundFX.playIfVisible(dragon.x, dragon.y, 'towerShoot');
            markDirty('projectiles');
        }
    } else {
        dragon.state = 'moving';
        dragon.targetX = targetX;
        dragon.targetY = targetY;
        
        const dx = targetX - dragon.x;
        const dy = targetY - dragon.y;
        const distance = Math.hypot(dx, dy);
        
        if (distance > 2) {
            const step = Math.min(distance, dragon.speed * dt);
            dragon.x += (dx / distance) * step;
            dragon.y += (dy / distance) * step;
        }
    }
    
    markDirty('enemies');
}

// ===== DRACHEN-PROJEKTILE UPDATE =====
// ===== DRACHEN-PROJEKTILE UPDATE =====
function updateDragonProjectiles(dt) {
    for (let i = dragonProjectiles.length - 1; i >= 0; i--) {
        const p = dragonProjectiles[i];
        p.life += dt;
        
        // ===== ZU LANG UNTERWEGS =====
        if (p.life > p.maxLife) {
            createExplosion(p.targetX, p.targetY);
            dragonProjectiles.splice(i, 1);
            continue;
        }
        
        // ===== ZUM ZIEL BEWEGEN =====
        const dx = p.targetX - p.x;
        const dy = p.targetY - p.y;
        const distance = Math.hypot(dx, dy);
        
        if (distance < 10) {
            // ===== TREFFER! GEBÄUDE ZERSTÖREN =====
            const building = p.building;
            if (building) {
                const bx = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const by = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                
                // ===== 1. ALLE EINWOHNER BEREINIGEN, DIE MIT DIESEM GEBÄUDE ZU TUN HABEN =====
                cleanupBuildingDependencies(building);
                
                // ===== 2. GEBÄUDE ZERSTÖREN =====
                if (building.playerId === 'player' || building.playerId === undefined) {
                    const idx = buildings.indexOf(building);
                    if (idx !== -1) {
                        createExplosion(bx, by);
                        buildings.splice(idx, 1);
                        showTemporaryMessage('🐉 Drache hat ein Gebäude zerstört!', '#ff4444', true);
                        markDirty('buildings');
                    }
                } else if (building.playerId === 'player2') {
                    const idx = player2Buildings.indexOf(building);
                    if (idx !== -1) {
                        createExplosion(bx, by);
                        player2Buildings.splice(idx, 1);
                        showTemporaryMessage('🐉 Drache hat ein Gebäude (P2) zerstört!', '#ff4444', true);
                        markDirty('buildings');
                    }
                } else if (building.isNPC) {
                    const idx = npcBuildings.indexOf(building);
                    if (idx !== -1) {
                        createExplosion(bx, by);
                        npcBuildings.splice(idx, 1);
                        showTemporaryMessage('🐉 Drache hat ein NPC-Gebäude zerstört!', '#ff4444', true);
                        markDirty('buildings');
                    }
                }
                
                // ===== 3. CACHES ZURÜCKSETZEN =====
                markDirty('villagers');
                markPlayerCacheDirty();
                markPlayer2CacheDirty();
                markNpcCacheDirty();
            }
            
            createExplosion(p.x, p.y);
            dragonProjectiles.splice(i, 1);
            continue;
        }
        
        // ===== PROJEKTIL BEWEGEN =====
        const step = Math.min(distance, p.speed * dt);
        p.x += (dx / distance) * step;
        p.y += (dy / distance) * step;
    }
}

// ===== ALLE EINWOHNER BEREINIGEN, DIE MIT EINEM GEBÄUDE ZU TUN HABEN =====
// ===== ALLE EINWOHNER BEREINIGEN, DIE MIT EINEM GEBÄUDE ZU TUN HABEN =====
function cleanupBuildingDependencies(building) {
    if (!building) return;
    
    const buildingId = building.id;
    const gridX = building.gridX;
    const gridY = building.gridY;
    const playerId = building.playerId || 'player';
    const isNPC = building.isNPC || false;
    
    // ===== 1. EINWOHNER LISTEN BESTIMMEN =====
    let villagersList = [];
    let resourcesRef = null;
    let resourceNodesRef = null;
    let buildingsRef = null;
    
    if (isNPC) {
        villagersList = npcVillagers;
        resourcesRef = npcResources;
        resourceNodesRef = npcResourceNodes;
        buildingsRef = npcBuildings;
    } else if (playerId === 'player2') {
        villagersList = player2Villagers;
        resourcesRef = player2Resources;
        resourceNodesRef = player2ResourceNodes;
        buildingsRef = player2Buildings;
    } else {
        villagersList = villagers;
        resourcesRef = resources;
        resourceNodesRef = resourceNodes;
        buildingsRef = buildings;
    }
    
    // ===== 2. WENN ES EIN HAUS IST - ALLE BEWOHNER STERBEN =====
    if (building.type === 'haus') {
        const residents = villagersList.filter(v => v.alive && v.homeId === buildingId);
        for (let v of residents) {
            // Ressourcen freigeben
            if (v.resourceTarget) {
                const node = resourceNodesRef.find(r => r.id === v.resourceTarget.id);
                if (node && node.claimedBy === v.id) node.claimedBy = null;
                v.resourceTarget = null;
            }
            if (v.carrying === 'stone') {
                resourcesRef.stone += 1;
                v.carrying = null;
            } else if (v.carrying === 'grain') {
                resourcesRef.grain += 1;
                v.carrying = null;
            } else if (v.carrying === 'wood') {
                resourcesRef.wood += 1;
                v.carrying = null;
            } else if (v.carrying === 'fish') {
                resourcesRef.fish = (resourcesRef.fish || 0) + 1;
                v.carrying = null;
            }
            if (v.hasReservedStone && v.towerTarget) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                v.hasReservedStone = false;
                v.towerTarget = null;
                v.stoneToDeliver = 0;
            }
            if (v.isBuilding && v.buildingTarget) {
                const building2 = buildingsRef.find(b => b.id === v.buildingTarget);
                if (building2 && building2.isUnderConstruction) {
                    building2.builder = null;
                    building2.waitingForBuilder = true;
                }
                v.isBuilding = false;
                v.buildingTarget = null;
            }
            v.alive = false;
            moveToDeadList(v, 'dragon_attack');
        }
        // Nach dem Töten aus der Liste entfernen
        if (isNPC) {
            npcVillagers = npcVillagers.filter(v => v.alive);
        } else if (playerId === 'player2') {
            player2Villagers = player2Villagers.filter(v => v.alive);
        } else {
            villagers = villagers.filter(v => v.alive);
        }
    }
    
    // ===== 3. ALLE ANDEREN EINWOHNER DURCHGEHEN (NUR TASKS CLEANUP) =====
    for (let v of villagersList) {
        if (!v.alive) continue;
        let needsCleanup = false;
        
        // ===== 3a. BAUMEISTER =====
        if (v.isBuilding && v.buildingTarget === buildingId) {
            v.isBuilding = false;
            v.buildingTarget = null;
            v.buildingProgress = 0;
            needsCleanup = true;
        }
        
        // ===== 3b. RESSOURCEN-SAMMLER =====
        if (v.resourceTarget) {
            const node = resourceNodesRef.find(r => r.id === v.resourceTarget.id);
            if (node && node.buildingId === buildingId) {
                v.resourceTarget = null;
                if (node.claimedBy === v.id) node.claimedBy = null;
                needsCleanup = true;
            }
        }
        
        // ===== 3c. ERNTE-STATUS =====
        if (v.isHarvesting && v.harvestBuildingId === buildingId) {
            v.isHarvesting = false;
            v.harvestBuildingId = null;
            v.harvestFieldIndex = 0;
            needsCleanup = true;
        }
        
        // ===== 3d. GETRAGENE RESSOURCEN ZURÜCKGEBEN =====
        if (v.carrying && (v.state === 'returningHome' || v.state === 'harvestingField')) {
            if (v.deliveryTarget && v.deliveryTarget.x === gridX && v.deliveryTarget.y === gridY) {
                if (v.carrying === 'grain') resourcesRef.grain += 1;
                else if (v.carrying === 'wood') resourcesRef.wood += 1;
                else if (v.carrying === 'stone') resourcesRef.stone += 1;
                else if (v.carrying === 'fish') resourcesRef.fish = (resourcesRef.fish || 0) + 1;
                v.carrying = null;
                v.carryingCount = 0;
                v.deliveryTarget = null;
                needsCleanup = true;
            }
        }
        
        // ===== 3e. STEIN-LIEFERUNG =====
        if (v.isDeliveringStone && v.towerTarget === building) {
            v.isDeliveringStone = false;
            v.towerTarget = null;
            v.stoneToDeliver = 0;
            v.hasReservedStone = false;
            if (v.carrying === 'stone') {
                resourcesRef.stone += 1;
                v.carrying = null;
            }
            needsCleanup = true;
        }
        
        // ===== 3f. EROBERUNG =====
        if (v.captureTargetId === buildingId) {
            v.captureTargetId = null;
            v.capturingBuilding = null;
            v.captureTimer = 0;
            needsCleanup = true;
        }
        
        // ===== 3g. BEWEGUNG ZU DIESEM GEBÄUDE =====
        const targetGridX = Math.floor(v.targetX / CONFIG.CELL_SIZE);
        const targetGridY = Math.floor(v.targetY / CONFIG.CELL_SIZE);
        if (targetGridX === gridX && targetGridY === gridY) {
            if (v.state === 'movingToResource' || v.state === 'movingToCapture') {
                needsCleanup = true;
            }
        }
        
        // ===== 3h. WENN CLEANUP NÖTIG =====
        if (needsCleanup) {
            v.state = 'idle';
            v.hasTask = false;
            v.isAttacking = false;
            v.attackTarget = null;
            v.combatCooldown = 0;
        }
    }
    
    // ===== 4. HAUS-RESIDENTS AKTUALISIEREN (FALLBACK) =====
    if (building.type === 'haus') {
        building.residents = 0;
    }
    
    // ===== 5. CONSTRUCTION SITES BEREINIGEN =====
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.isGrenze) continue;
        const siteBuildingId = parseInt(key);
        if (siteBuildingId === buildingId) {
            delete constructionSites[key];
        }
    }
    
    // ===== 6. CAPTURE TIMERS BEREINIGEN =====
    const captureKey = isNPC ? `capture_${buildingId}` : `capture_${playerId}_${buildingId}`;
    if (captureTimers[captureKey]) {
        delete captureTimers[captureKey];
    }
    
    // ===== 7. RESSOURCEN-NODES BEREINIGEN =====
    for (let i = resourceNodesRef.length - 1; i >= 0; i--) {
        const node = resourceNodesRef[i];
        if (node.buildingId === buildingId) {
            if (node.claimedBy) {
                const villager = villagersList.find(v => v.id === node.claimedBy);
                if (villager) {
                    villager.resourceTarget = null;
                    villager.state = 'idle';
                    villager.hasTask = false;
                }
            }
            resourceNodesRef.splice(i, 1);
        }
    }
    
    // ===== 8. FISCH-NODES BEREINIGEN =====
    if (building.type === 'fischerhütte') {
        let fishNodesRef = isNPC ? npcFishNodes : (playerId === 'player2' ? player2FishNodes : fishNodes);
        for (let i = fishNodesRef.length - 1; i >= 0; i--) {
            const node = fishNodesRef[i];
            if (node.buildingId === buildingId) {
                if (node.claimedBy) {
                    const villager = villagersList.find(v => v.id === node.claimedBy);
                    if (villager) {
                        villager.resourceTarget = null;
                        villager.state = 'idle';
                        villager.hasTask = false;
                    }
                }
                fishNodesRef.splice(i, 1);
            }
        }
    }
    
    // ===== 9. BRENNENDE GEBÄUDE ENTFERNEN =====
    const fireKey = isNPC ? `fire_npc_${buildingId}` : `fire_${playerId}_${buildingId}`;
    if (burningBuildings[fireKey]) {
        delete burningBuildings[fireKey];
    }
    
    // ===== 10. CACHES DIRTY SETZEN =====
    if (isNPC) {
        npcCacheNeedsRefresh = true;
        cachedFreeVillagersNpcDirty = true;
        cachedNpcResourceNodesDirty = true;
    } else if (playerId === 'player2') {
        cacheNeedsRefreshP2 = true;
        cachedFreeVillagersP2Dirty = true;
        cachedPlayer2ResourceNodesDirty = true;
    } else {
        cacheNeedsRefresh = true;
        cachedFreeVillagersDirty = true;
        cachedResourceNodesDirty = true;
    }
    
    markDirty('villagers');
    markDirty('buildings');
}

// ===== EXPLOSION ERSTELLEN =====


function createExplosion(x, y) {
    explosions.push({
        x: x,
        y: y,
        timer: 0,
        maxTimer: 1.0,
        size: 0,
        maxSize: 60,
        particles: []
    });
    
    // ===== PARTIKEL FÜR EXPLOSION =====
    for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 100;
        explosions[explosions.length - 1].particles.push({
            x: x + (Math.random() - 0.5) * 10,
            y: y + (Math.random() - 0.5) * 10,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 20,
            life: 0.3 + Math.random() * 0.5,
            maxLife: 0.3 + Math.random() * 0.5,
            color: ['#ff4400', '#ff8800', '#ffcc00', '#ff2200'][Math.floor(Math.random() * 4)]
        });
    }
    
    SoundFX.playIfVisible(x, y, 'destroy');
    markDirty('effects');
}

// ===== EXPLOSIONEN UPDATE =====
function updateExplosions(dt) {
    for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        exp.timer += dt;
        exp.size = (exp.timer / exp.maxTimer) * exp.maxSize;
        
        // ===== PARTIKEL AKTUALISIEREN =====
        for (let p of exp.particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.98;
            p.vy *= 0.98;
            p.life -= dt;
        }
        
        if (exp.timer >= exp.maxTimer) {
            explosions.splice(i, 1);
        }
    }
}

// ===== EXPLOSIONEN ZEICHNEN =====
function drawExplosions(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    for (let exp of explosions) {
        if (exp.x < viewLeftPx || exp.x > viewRightPx || exp.y < viewTopPx || exp.y > viewBottomPx) continue;
        
        // ===== EXPLOSIONS-BILD =====
        if (explosionImage && explosionImage.complete && explosionImage.naturalWidth > 0) {
            const size = exp.size;
            const alpha = 1 - (exp.timer / exp.maxTimer);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.drawImage(explosionImage, exp.x - size/2, exp.y - size/2, size, size);
            ctx.restore();
        }
        
        // ===== PARTIKEL =====
        for (let p of exp.particles) {
            if (p.life <= 0) continue;
            const alpha = Math.max(0, p.life / p.maxLife);
            const size = Math.max(0.5, 2 + (1 - alpha) * 6);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }
}

function updateEnemies(dt) {
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    // ===== NPC-ANGRIFFSSCHUTZ =====
    if (!SPLIT_SCREEN) {
        const npcPopulation = npcVillagers.filter(v => v.alive).length;
        
        if (npcPopulation > 12) {
            npcAttackProtectionTimer += dt;
            const remaining = Math.max(0, Math.ceil(30 - npcAttackProtectionTimer));
            if (remaining > 0 && remaining % 5 === 0) {
                showTemporaryMessage(`🛡️ NPC-Schutz: ${remaining}s verbleibend (${Math.floor(npcPopulation)} Einwohner)`, '#ffd966');
            }
            if (npcAttackProtectionTimer >= 30) {
                npcAttackProtectionActive = false;
                if (!npcAttackProtectionMessageShown) {
                    npcAttackProtectionMessageShown = true;
                    showTemporaryMessage('⚔️ NPC-Schutz aufgehoben! Feinde greifen jetzt an!', '#ff4444');
                }
            }
        } else {
            if (!npcAttackProtectionActive) {
                showTemporaryMessage('🕊️ NPC hat weniger als 12 Einwohner - Schutz aktiviert', '#44ff44');
            }
            npcAttackProtectionTimer = 0;
            npcAttackProtectionActive = true;
            npcAttackProtectionMessageShown = false;
        }
    }

    // ===== ALLE LEBENDEN VILLAGER =====
    const allVillagers = [];
    for (let v of villagers) {
        if (v.alive) allVillagers.push(v);
    }
    if (SPLIT_SCREEN || NETWORK_MODE) {
        for (let v of player2Villagers) {
            if (v.alive) allVillagers.push(v);
        }
    }
    if (!SPLIT_SCREEN) {
        if (!npcAttackProtectionActive) {
            for (let v of npcVillagers) {
                if (v.alive) allVillagers.push(v);
            }
        }
    }

    if (allVillagers.length === 0 && enemies.some(e => e.alive)) {
        enemies = [];
        enemiesHaveCleared = true;
        npcAttackProtectionTimer = 0;
        npcAttackProtectionActive = true;
        npcAttackProtectionMessageShown = false;
        combatGridDirtyEnemy = true;
        return;
    }
    if (allVillagers.length > 0 && enemiesHaveCleared) enemiesHaveCleared = false;

    if (combatGridDirtyEnemy) {
        rebuildCombatGridEnemy();
    }

    // ===== MITTELPUNKTE FÜR ALLE SPIELER BERECHNEN =====
    const centerPlayer1 = getSettlementCenter('player');
    const centerWorldX1 = centerPlayer1.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const centerWorldY1 = centerPlayer1.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    
    let centerWorldX2 = centerWorldX1;
    let centerWorldY2 = centerWorldY1;
    
    if (SPLIT_SCREEN || NETWORK_MODE) {
        const centerPlayer2 = getSettlementCenter('player2');
        centerWorldX2 = centerPlayer2.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        centerWorldY2 = centerPlayer2.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    } else {
        const centerNpc = getSettlementCenter(null);
        centerWorldX2 = centerNpc.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        centerWorldY2 = centerNpc.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    }

    for (let enemy of enemies) {
        if (!enemy.alive) continue;

        if (enemy.killCount >= 2) {
            enemy.alive = false;
            continue;
        }

        if (allVillagers.length === 0) {
            enemy.targetVillager = null;
            continue;
        }

        if (enemy.searchCounter === undefined) enemy.searchCounter = 0;
        if (enemy.lastTarget === undefined) enemy.lastTarget = null;

        const searchRange = CONFIG.ENEMY_ATTACK_RADIUS;
        enemy.searchCounter++;

        if (enemy.searchCounter % 5 === 0 || !enemy.lastTarget) {
            const nearbyVillagers = [];
            
            const p1Nearby = getPlayerVillagersInRange(enemy.x, enemy.y, searchRange);
            for (let v of p1Nearby) {
                if (v.alive) nearbyVillagers.push(v);
            }
            
            if (SPLIT_SCREEN || NETWORK_MODE) {
                const p2Nearby = getPlayer2VillagersInRange(enemy.x, enemy.y, searchRange);
                for (let v of p2Nearby) {
                    if (v.alive) nearbyVillagers.push(v);
                }
            }
            
            if (!SPLIT_SCREEN && !npcAttackProtectionActive) {
                const npcNearby = getNpcVillagersInRange(enemy.x, enemy.y, searchRange);
                for (let v of npcNearby) {
                    if (v.alive) nearbyVillagers.push(v);
                }
            }

            if (nearbyVillagers.length > 0) {
                let closestVillager = null;
                let closestDistSq = Infinity;
                for (let v of nearbyVillagers) {
                    if (!v.alive) continue;
                    const d2 = dist2(enemy, v);
                    if (d2 < closestDistSq) {
                        closestDistSq = d2;
                        closestVillager = v;
                    }
                }
                enemy.lastTarget = closestVillager;
            } else {
                enemy.lastTarget = null;
                
                const distToP1 = Math.hypot(enemy.x - centerWorldX1, enemy.y - centerWorldY1);
                const distToP2 = Math.hypot(enemy.x - centerWorldX2, enemy.y - centerWorldY2);
                
                if (distToP1 <= distToP2) {
                    enemy.targetX = centerWorldX1;
                    enemy.targetY = centerWorldY1;
                } else {
                    enemy.targetX = centerWorldX2;
                    enemy.targetY = centerWorldY2;
                }
            }
        }

        let targetX = enemy.targetX;
        let targetY = enemy.targetY;
        
        if (enemy.lastTarget && enemy.lastTarget.alive) {
            const target = enemy.lastTarget;
            const d2 = dist2(enemy, target);
            const d = Math.sqrt(d2);

            if (d < 8) {
                // ===== PRÜFUNG: Ist das Ziel noch am Leben? =====
                if (!target.alive) {
                    enemy.lastTarget = null;
                    enemy.targetVillager = null;
                    continue;
                }

                const isNPC = target.isNPC || false;
                const isPlayer2 = (target.playerId === 'player2');

                // ===== SICHERE TÖTUNG: Nur töten wenn Ziel noch lebt =====
                if (target.alive) {
                    if (isNPC) {
                        const home = npcBuildings.find(b => b.id === target.homeId);
                        if (home && home.residents > 0) home.residents -= 1;
                        if (target.carrying === 'stone' || target.hasReservedStone) {
                            npcResources.stone += (target.stoneToDeliver || 0);
                            if (target.towerTarget) {
                                target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                            }
                        }
                        if (target.carrying === 'grain') npcResources.grain += 1;
                        if (target.carrying === 'wood') npcResources.wood += 1;
                        if (target.resourceTarget) {
                            const node = npcResourceNodes.find(r => r.id === target.resourceTarget.id);
                            if (node && node.claimedBy === target.id) node.claimedBy = null;
                            target.resourceTarget = null;
                        }
                        if (target.isBuilding && target.buildingTarget) {
                            const building = npcBuildings.find(b => b.id === target.buildingTarget);
                            if (building && building.isUnderConstruction) {
                                building.builder = null;
                                building.waitingForBuilder = true;
                            }
                            target.isBuilding = false;
                            target.buildingTarget = null;
                        }
                        killNpcVillager(target, 'enemy');
                        createHitEffect(target.x, target.y, false);
                        SoundFX.playIfVisible(target.x, target.y, 'villagerDie');
                        showTemporaryMessage('💀 NPC-Einwohner von Feind getötet!', '#ff6b6b');
                    } else if (isPlayer2) {
                        const home = player2Buildings.find(b => b.id === target.homeId);
                        if (home && home.residents > 0) home.residents -= 1;
                        if (target.carrying === 'stone' || target.isDeliveringStone) {
                            player2Resources.stone += (target.stoneToDeliver || 0);
                            if (target.towerTarget) {
                                target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                            }
                        }
                        if (target.carrying === 'grain') player2Resources.grain += 1;
                        if (target.carrying === 'wood') player2Resources.wood += 1;
                        if (target.resourceTarget) {
                            const node = player2ResourceNodes.find(r => r.id === target.resourceTarget.id);
                            if (node && node.claimedBy === target.id) node.claimedBy = null;
                            target.resourceTarget = null;
                        }
                        if (target.isBuilding && target.buildingTarget) {
                            const building = player2Buildings.find(b => b.id === target.buildingTarget);
                            if (building && building.isUnderConstruction) {
                                building.builder = null;
                                building.waitingForBuilder = true;
                            }
                            target.isBuilding = false;
                            target.buildingTarget = null;
                        }
                        killVillagerPlayer2(target, 'enemy');
                        createHitEffect(target.x, target.y, false);
                        SoundFX.playIfVisible(target.x, target.y, 'villagerDie');
                        showTemporaryMessage('💀 Spieler 2 Einwohner von Feind getötet!', '#ff6b6b');
                    } else {
                        const home = buildings.find(b => b.id === target.homeId);
                        if (home && home.residents > 0) home.residents -= 1;
                        if (target.carrying === 'stone' || target.isDeliveringStone) {
                            resources.stone += (target.stoneToDeliver || 0);
                            if (target.towerTarget) {
                                target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                            }
                        }
                        if (target.carrying === 'grain') resources.grain += 1;
                        if (target.carrying === 'wood') resources.wood += 1;
                        if (target.resourceTarget) {
                            const node = resourceNodes.find(r => r.id === target.resourceTarget.id);
                            if (node && node.claimedBy === target.id) node.claimedBy = null;
                            target.resourceTarget = null;
                        }
                        if (target.isBuilding && target.buildingTarget) {
                            const building = buildings.find(b => b.id === target.buildingTarget);
                            if (building && building.isUnderConstruction) {
                                building.builder = null;
                                building.waitingForBuilder = true;
                            }
                            target.isBuilding = false;
                            target.buildingTarget = null;
                        }
                        killVillager(target, 'enemy');
                        createHitEffect(target.x, target.y, false);
                        SoundFX.playIfVisible(target.x, target.y, 'villagerDie');
                        showTemporaryMessage('💀 Einwohner von Feind getötet!', '#ff6b6b');
                    }
                }

                enemy.killCount += 1;
                enemy.lastTarget = null;
                enemy.targetVillager = null;
                markDirty('enemies');
                continue;
            } else {
                targetX = target.x;
                targetY = target.y;
            }
        }

        if (targetX !== undefined && targetY !== undefined) {
            const dx = targetX - enemy.x;
            const dy = targetY - enemy.y;
            const distance = Math.hypot(dx, dy);
            
            if (distance > 2) {
                const speed = enemy.isSuper ? 35 : 45;
                const speedMultiplier = enemy.isGroupAttack ? 0.9 : 1.0;
                const step = Math.min(distance, speed * speedMultiplier * dt);
                enemy.x += (dx / distance) * step;
                enemy.y += (dy / distance) * step;
            }
        }
    }


}

let enemyGrid = new Map();
let enemyGridDirty = true;
const ENEMY_GRID_SIZE = 100;

function rebuildEnemyGrid() {
    enemyGrid.clear();
    for (let e of enemies) {
        if (!e.alive) continue;
        const key = getGridKey(e.x, e.y);
        if (!enemyGrid.has(key)) {
            enemyGrid.set(key, []);
        }
        enemyGrid.get(key).push(e);
    }
    enemyGridDirty = false;
}

function getEnemiesInViewport(viewLeft, viewRight, viewTop, viewBottom) {
    if (enemyGridDirty) {
        rebuildEnemyGrid();
    }
    
    const result = [];
    const startKey = getGridKey(viewLeft, viewTop);
    const endKey = getGridKey(viewRight, viewBottom);
    const [startCX, startCY] = startKey.split(',').map(Number);
    const [endCX, endCY] = endKey.split(',').map(Number);
    
    for (let cx = startCX - 1; cx <= endCX + 1; cx++) {
        for (let cy = startCY - 1; cy <= endCY + 1; cy++) {
            const key = cx + ',' + cy;
            const cells = enemyGrid.get(key);
            if (cells) {
                for (let e of cells) {
                    if (!e.alive) continue;
                    if (e.x >= viewLeft && e.x <= viewRight && 
                        e.y >= viewTop && e.y <= viewBottom) {
                        result.push(e);
                    }
                }
            }
        }
    }
    return result;
}

function markEnemyGridDirty() {
    enemyGridDirty = true;
}
