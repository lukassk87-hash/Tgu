let messageRotationTimer = 0;
let messageIsFlipped = false;

function showTemporaryMessage(msg, color = '#fff', urgent = false) {
    if (urgent) {
        messageQueue = [];
        isMessageActive = false;
        if (messageHideTimeout) {
            clearTimeout(messageHideTimeout);
            messageHideTimeout = null;
        }
        tempMessage = msg;
        tempMessageColor = color;
        tempMessageTimer = 3.0;
        if (tempMessageElement) {
            tempMessageElement.textContent = msg;
            tempMessageElement.style.color = color;
            tempMessageElement.style.opacity = '1';
            if (SPLIT_SCREEN) {
                messageIsFlipped = false;
                messageRotationTimer = 0;
                tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
                tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
            }
        }
        isMessageActive = true;
        return;
    }
    messageQueue.push({ msg, color });
    if (!isMessageActive) {
        displayNextMessage();
    }
}

function displayNextMessage() {
    if (messageHideTimeout) {
        clearTimeout(messageHideTimeout);
        messageHideTimeout = null;
    }
    if (messageQueue.length === 0) {
        isMessageActive = false;
        if (tempMessageElement) {
            tempMessageElement.style.opacity = '0';
        }
        return;
    }
    isMessageActive = true;
    const next = messageQueue.shift();
    tempMessage = next.msg;
    tempMessageColor = next.color;
    tempMessageTimer = 3.0;
    if (tempMessageElement) {
        tempMessageElement.textContent = next.msg;
        tempMessageElement.style.color = next.color;
        tempMessageElement.style.opacity = '1';
        if (SPLIT_SCREEN) {
            messageIsFlipped = false;
            messageRotationTimer = 0;
            tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
            tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
        }
    }
}

function updateMessageDisplay(dt) {
    if (!tempMessageElement) return;
    if (tempMessageTimer <= 0 && isMessageActive) {
        tempMessageElement.style.opacity = '0';
        isMessageActive = false;
        if (messageHideTimeout) clearTimeout(messageHideTimeout);
        messageHideTimeout = setTimeout(() => {
            messageHideTimeout = null;
            displayNextMessage();
        }, 300);
        return;
    }
    if (tempMessageTimer <= 0) return;
    if (!SPLIT_SCREEN) return;
    messageRotationTimer += dt;
    if (messageRotationTimer >= 1.5) {
        messageRotationTimer = 0;
        messageIsFlipped = !messageIsFlipped;
        const rotation = messageIsFlipped ? 180 : 0;
        tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg)`;
        tempMessageElement.style.transition = 'transform 0.5s ease';
        tempMessageElement.style.transform += ' scale(1.05)';
        setTimeout(() => {
            if (tempMessageElement && tempMessageTimer > 0) {
                tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg) scale(1)`;
            }
        }, 150);
    }
}

// ===== SPLIT-START: Gebäude platzieren =====
function placeSplitStartBuilding(player, type, gx, gy) {
    const isPlayer1 = (player === 'player1');
    const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);

    if (NETWORK_MODE) {
        if (isPlayer1 && gy > gridLimit) {
            showTemporaryMessage('❌ Host darf nur im oberen Drittel bauen!', '#ff6b6b');
            return false;
        }
        if (!isPlayer1 && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Client darf nur im unteren Drittel bauen!', '#ff6b6b');
            return false;
        }
    } else if (SPLIT_SCREEN) {
        if (isPlayer1 && gy > gridLimit) {
            showTemporaryMessage('❌ Spieler 1 darf nur im oberen Drittel bauen!', '#ff6b6b');
            return false;
        }
        if (!isPlayer1 && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b');
            return false;
        }
    }

    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    // ===== GRENZKONTROLLE =====
    if (type === 'grenze') {
        const g = new Grenzkontrolle(
            isPlayer1 ? nextGrenzeId++ : player2NextGrenzeId++,
            gx, gy,
            isPlayer1 ? 'player' : 'player2',
            false
        );
        g.isUnderConstruction = false;
        g.constructionProgress = 1;
        g.radius = CONFIG.GRENZE_RADIUS;
        
        if (isPlayer1) {
            grenzen.push(g);
            camera.x = g.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            camera.y = g.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        } else {
            player2Grenzen.push(g);
            cameraPlayer2.x = g.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            cameraPlayer2.y = g.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        }
        
        markDirty();
        renderDirty = true;
        return true;
    }

    // ===== LAGER / HAUS =====
    const playerId = isPlayer1 ? 'player' : 'player2';
    if (!isWithinBuildRadius(gx, gy, playerId)) {
        showTemporaryMessage(`❌ ${type} muss innerhalb der Grenzkontrolle liegen!`, '#ff6b6b');
        return false;
    }

    const building = new Building(
        isPlayer1 ? nextBuildingId++ : player2NextBuildingId++,
        type,
        gx, gy,
        false,
        isPlayer1 ? 'player' : 'player2'
    );
    
    building.isUnderConstruction = false;
    building.constructionProgress = 1;
    building.constructionTimer = CONFIG.BUILD_TIME;
    
    if (type === 'haus') {
        building.residents = 6;
        building.maxResidents = 6;
        building.maxProductionTime = 30;
        building.baseMaxProductionTime = 30;
    }

    if (isPlayer1) {
        buildings.push(building);
        camera.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        camera.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
        player2Buildings.push(building);
        cameraPlayer2.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        cameraPlayer2.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    }

    if (type === 'haus') {
        for (let i = 0; i < 6; i++) {
            if (isPlayer1) {
                spawnVillager(building.id);
            } else {
                spawnVillagerPlayer2(building.id);
            }
        }
    }
    
    markDirty(villagers);
    renderDirty = true;
    return true;
}

function advanceSplitStart() {
    const phases = [
        'player1_grenze',
        'player1_lager',
        'player1_haus',
        'player2_grenze',
        'player2_lager',
        'player2_haus'
    ];
    const currentIndex = phases.indexOf(splitStartPhase);
    if (currentIndex === phases.length - 1) {
        splitStartPhase = null;
        gameStarted = true;
        gameReady = true;
        showTemporaryMessage('🎮 Spiel gestartet! Beide Spieler sind bereit!', '#2ecc71', true);
        return;
    }
    splitStartPhase = phases[currentIndex + 1];
    const nextPlayer = splitStartPhase.startsWith('player1') ? 'Spieler 1' : 'Spieler 2';
    const nextType = splitStartPhase.includes('grenze') ? 'Grenzkontrolle' :
                     splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const color = splitStartPhase.includes('grenze') ? '#9b59b6' : '#ffd966';
    showTemporaryMessage(`👉 ${nextPlayer} platziere dein ${nextType} (kostenlos)`, color, true);
}

// ===== NETZWERK-START =====
function advanceNetworkStart() {
    if (!IS_HOST) return;

    const phases = [
        'player1_grenze',
        'player1_lager',
        'player1_haus',
        'player2_grenze',
        'player2_lager',
        'player2_haus'
    ];
    const currentIndex = phases.indexOf(splitStartPhase);

    if (currentIndex === -1) {
        splitStartPhase = 'player1_grenze';
        showTemporaryMessage('👉 Host platziere deine Grenzkontrolle (oberes Drittel)', '#9b59b6', true);
        sendStartPhaseToClient();
        return;
    }

    if (currentIndex === phases.length - 1) {
        splitStartPhase = null;
        gameStarted = true;
        gameReady = true;
        sendStartPhaseToClient();
        showTemporaryMessage('🎮 Netzwerk-Spiel gestartet!', '#2ecc71', true);
        return;
    }

    splitStartPhase = phases[currentIndex + 1];
    const nextPlayer = splitStartPhase.startsWith('player1') ? 'Host' : 'Client';
    const nextType = splitStartPhase.includes('grenze') ? 'Grenzkontrolle' :
                     splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const area = splitStartPhase.startsWith('player1') ? 'oberes Drittel' : 'unteres Drittel';
    const color = splitStartPhase.includes('grenze') ? '#9b59b6' : '#ffd966';

    showTemporaryMessage(`👉 ${nextPlayer} platziere dein ${nextType} (${area})`, color, true);
    sendStartPhaseToClient();
}

function sendStartPhaseToClient() {
    if (!IS_HOST || !networkConn) return;
    try {
        networkConn.send(JSON.stringify({
            type: 'start_phase',
            phase: splitStartPhase,
            gameStarted: gameStarted || false
        }));
    } catch(e) {
        console.warn('Fehler beim Senden der Phase:', e);
    }
}

function handleStartPhase(data) {
    if (IS_HOST) return;

    splitStartPhase = data.phase;
    gameStarted = data.gameStarted || false;

    if (splitStartPhase === 'waiting_for_host') {
        showTemporaryMessage('📥 Warte auf Host...', '#ffd966', true);
        return;
    }

    if (splitStartPhase === null && gameStarted) {
        gameReady = true;
        showTemporaryMessage('🎮 Spiel gestartet!', '#2ecc71', true);
        return;
    }

    const isPlayer1Phase = splitStartPhase.startsWith('player1');
    const nextType = splitStartPhase.includes('grenze') ? 'Grenzkontrolle' :
                     splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const area = isPlayer1Phase ? 'oberes Drittel' : 'unteres Drittel';
    const color = splitStartPhase.includes('grenze') ? '#9b59b6' : '#ffd966';

    if (!isPlayer1Phase) {
        showTemporaryMessage(`👉 Du (Client) platziere dein ${nextType} (${area})`, color, true);
        gameReady = true;
    } else {
        showTemporaryMessage(`⏳ Warte auf Host (${nextType})...`, color, true);
        gameReady = false;
    }
}

// ===== AKTUALISIERTE GAME LOOP =====
// ===== GAME LOOP (VOLLSTÄNDIG) =====
let gameReady = false;

// =========================================================================
//  GAME LOOP - KOMPLETT NEU ERSTELLT
// =========================================================================

function gameLoop(now) {
    let dt = (now - lastTimestamp) / 1000;
    if (dt > 0.2) dt = 0.016;
    if (dt < 0.001) dt = 0.001;
    lastTimestamp = now;
    dt *= gameSpeed;

    // ===== 1. NACHRICHTEN AKTUALISIEREN =====
    updateMessageDisplay(dt);

    if (gameStarted) {
        // ===== 2. BAUBESCHRÄNKUNG PRÜFEN =====
        const elapsed = (performance.now() / 1000) - gameStartTime;
        if (elapsed >= BUILD_RESTRICTION_DURATION && buildingRestrictionActive) {
            buildingRestrictionActive = false;
            showTemporaryMessage('🏗️ Baubeschränkung aufgehoben!', '#44ff44');
        }

        // ===== 3. NETZWERK-MODUS: CLIENT-ONLY UPDATES =====
        if (NETWORK_MODE && !IS_HOST) {
            // Client aktualisiert nur seine eigenen Daten
            updateEconomyPlayer2(dt);
            updateVillagersPlayer2(dt);
            updateConstructionPlayer2(dt);
            updatePlayer2ResourceNodes(dt);
            updateTowersPlayer2Only(dt);
            updateProjectiles(dt);
            updateHitEffects(dt);
            updateEnemiesClientOnly(dt);
            updateCombatAndCaptureClient(dt);
        } else {
            // ===== HOST / EINZELMODUS: VOLLSTÄNDIGE AKTUALISIERUNG =====

            // ---- 3.1 FEINDE SPAWNEN ----
            spawnTimer += dt;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                spawnInterval = 90 + Math.random() * 160;
                spawnEnemies();
            }

            // ---- 3.2 WIRTSCHAFT ----
            updateEconomyPlayer1(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateEconomyPlayer2(dt);
            }
            if (!SPLIT_SCREEN && !NETWORK_MODE && npcStarted) {
                updateEconomyNPC(dt);
            }
            
            // ---- 3.3 RESSOURCEN-NODES ----
            updateResourceNodes(dt);
            if (!SPLIT_SCREEN && !NETWORK_MODE && npcStarted) {
                updateNpcResourceNodes(dt);
            }
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updatePlayer2ResourceNodes(dt);
            }
            
            // ---- 3.4 BRENNENDE GEBÄUDE ----
            updateBurningBuildings(dt);

            // ---- 3.5 EINWOHNER ----
            updateVillagers(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateVillagersPlayer2(dt);
            }
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                updateNPCVillagers(dt);
            }

            // ---- 3.6 CONSTRUCTION ----
            updateConstruction(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateConstructionPlayer2(dt);
            }
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                updateNpcConstruction(dt);
            }

            // ---- 3.7 NPC LOGIK (NUR EINZELMODUS) ----
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                updateNPC(dt);
            }

            // ---- 3.8 KAMPF & EROBERUNG ----
            updateCombatAndCapture(dt);
            
            // ---- 3.9 TÜRME ----
            updateTowers(dt);
            
            // ---- 3.10 PROJEKTILE ----
            updateProjectiles(dt);
            
            // ---- 3.11 HIT-EFFEKTE ----
            updateHitEffects(dt);

            // ---- 3.12 FEINDE ----
            if (!NETWORK_MODE || IS_HOST) {
                updateEnemies(dt);
            } else {
                updateEnemiesClientOnly(dt);
            }


updateDragons(dt);
updateDragonProjectiles(dt);
updateExplosions(dt);

            // ---- 3.13 NETZWERK SYNC (NUR HOST) ----
            if (NETWORK_MODE && IS_HOST) {
                syncTimer += dt;
                if (syncTimer >= 0.5) {
                    syncTimer = 0;
                    sendDeltaSnapshot();
                }
                if (gameSpeedMultiplier !== window._lastSentSpeed) {
                    window._lastSentSpeed = gameSpeedMultiplier;
                    if (networkConn) {
                        networkConn.send(JSON.stringify({
                            type: 'speed_update',
                            speed: gameSpeedMultiplier
                        }));
                    }
                }
            }
        }

        // ---- 3.14 GAME OVER PRÜFUNG ----
        if (gameReady) {
            checkGameOver();
        }

        // ---- 3.15 UI AKTUALISIEREN ----
        updateUI();
        if (window.updateModeDisplay) window.updateModeDisplay();
        
        // Render-Flags setzen
        renderDirtyBuildings = true;
        renderDirtyVillagers = true;
        renderDirtyEnemies = true;
        renderDirtyProjectiles = true;
        renderDirtyEffects = true;
        renderDirtyUI = true;
    }

    // ---- 4. ZEICHNEN ----
    draw();

    // ---- 5. NACHRICHTEN-TIMER ----
    if (tempMessageTimer > 0) {
        tempMessageTimer -= dt;
    }

    // ---- 6. NÄCHSTER FRAME ----
    requestAnimationFrame(gameLoop);
}

// =========================================================================
//  FEHLENDE FUNKTIONEN FÜR CLIENT-MODUS
// =========================================================================

function updateEnemiesClientOnly(dt) {
    // Client aktualisiert nur die Feinde, die er vom Host bekommt
    // Die Feinde werden vom Host synchronisiert
    for (let enemy of enemies) {
        if (!enemy.alive) continue;
        // Feinde bewegen sich nur, wenn sie vom Host gesteuert werden
        // Client führt nur Animationen aus
    }
    markEnemyGridDirty();
}

function updateCombatAndCaptureClient(dt) {
    // Client führt keine eigenen Kampfberechnungen durch
    // Erhält Kampf-Status vom Host
    // Nur lokale Effekte werden angezeigt
    for (let key in captureTimers) {
        const timer = captureTimers[key];
        timer.timer += dt;
        if (timer.timer > CONFIG.CAPTURE_TIME + CONFIG.CAPTURE_TIMEOUT) {
            delete captureTimers[key];
        }
    }
}

// ===== NUR INITIALE STARTGEBÄUDE ZEICHNEN =====
function drawStartBuildings(ctx, viewLeft, viewRight, viewTop, viewBottom, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    // Nur Grenzkontrollen und Gebäude, die während der Startphase platziert wurden
    let startBuildings = [];
    
    // Grenzkontrollen (wurden vor gameStarted platziert)
    for (let g of grenzen) {
        startBuildings.push({...g, isGrenze: true, isNPC: false, playerId: 'player', owner: 'player'});
    }
    
    // Gebäude (wurden vor gameStarted platziert - normalerweise nur Lager und Haus)
    for (let b of buildings) {
        // Nur Gebäude die VOR gameStarted gebaut wurden (keine normalen Gebäude)
        // Wir erkennen sie daran, dass sie nicht isUnderConstruction sind und keine Produktionsgebäude sind
        if (!b.isUnderConstruction && (b.type === 'lager' || b.type === 'haus')) {
            startBuildings.push({...b, isGrenze: false, owner: 'player'});
        }
    }
    
    // NPC-Startgebäude (falls vorhanden)
    for (let b of npcBuildings) {
        if (!b.isUnderConstruction && (b.type === 'lager' || b.type === 'haus')) {
            startBuildings.push({...b, isGrenze: false, owner: 'npc'});
        }
    }
    for (let g of npcGrenzen) {
        startBuildings.push({...g, isGrenze: true, isNPC: true, playerId: null, owner: 'npc'});
    }

    // Zeichnen
    for (let b of startBuildings) {
        if (b.gridX < viewLeft || b.gridX >= viewRight || b.gridY < viewTop || b.gridY >= viewBottom) continue;
        const x = b.gridX * CONFIG.CELL_SIZE;
        const y = b.gridY * CONFIG.CELL_SIZE;

        if (b.isGrenze) {
            const ownerKey = b.owner === 'npc' || b.isNPC ? 'blau' : 'rot';
            const imgKey = `grenze-${ownerKey}`;
            const img = buildingImages[imgKey];
            
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            } else {
                let color = b.owner === 'npc' || b.isNPC ? '#2980b9' : '#c0392b';
                ctx.fillStyle = color;
                ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                ctx.strokeStyle = b.owner === 'npc' || b.isNPC ? '#1a5276' : '#7f1d1d';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚩', x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
            }
            continue;
        }

        // Normales Gebäude (Lager oder Haus)
        let ownerKey = 'rot';
        if (b.owner === 'npc' || b.isNPC) ownerKey = 'blau';
        
        const imgKey = `${b.type}-${ownerKey}`;
        const img = buildingImages[imgKey];
        
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        } else {
            let color = getBuildingColor(b.type, b.owner === 'player' ? 'player' : b.playerId);
            if (b.owner === 'npc' || b.isNPC) color = getNPCBuildingColor(b.type);
            ctx.fillStyle = color;
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            ctx.strokeStyle = b.owner === 'npc' ? '#9b59b6' : '#111';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
        
        // Bei Haus die Einwohner anzeigen
        if (b.type === 'haus') {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`${b.residents}/${b.maxResidents}`, x + 4, y + 4);
        }
    }
}

// =========================================================================
//  MODUL 23: SOUND-EFFEKTE – ERWEITERT FÜR GRENZKONTROLLE
// =========================================================================

const SoundFX = (() => {
  let audioCtx = null;
  
  function getCtx() {
    if (!audioCtx) { 
      audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  
  function isVisible(worldX, worldY) {
    const left = camera.x - (canvas.width / 2) / camera.zoom;
    const right = camera.x + (canvas.width / 2) / camera.zoom;
    const top = camera.y - (canvas.height / 2) / camera.zoom;
    const bottom = camera.y + (canvas.height / 2) / camera.zoom;
    return worldX >= left && worldX <= right && worldY >= top && worldY <= bottom;
  }
  
  function play(freq, duration, type = 'square', vol = 0.1) {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type; 
      osc.frequency.value = freq; 
      gain.gain.value = vol;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain); 
      gain.connect(ctx.destination); 
      osc.start(); 
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }
  
  return {
    playIfVisible(worldX, worldY, type) {
      if (!isVisible(worldX, worldY)) return;
      switch(type) {
        case 'build': play(220, 0.15, 'square', 0.08); break;
        case 'capture': play(440, 0.2, 'triangle', 0.1); break;
        case 'hit': play(150, 0.1, 'sawtooth', 0.12); break;
        case 'enemyDeath': play(80, 0.3, 'sawtooth', 0.15); break;
        case 'towerShoot': play(880, 0.08, 'square', 0.06); break;
        case 'upgrade': play(660, 0.15, 'triangle', 0.1); break;
        case 'destroy': play(100, 0.25, 'sawtooth', 0.15); break;
        case 'villagerDie': play(200, 0.15, 'square', 0.1); break;
        // ===== NEU: GRENZKONTROLLE SOUNDS =====
        case 'grenzeBuild': 
          play(180, 0.2, 'sine', 0.08); 
          setTimeout(() => play(280, 0.15, 'sine', 0.06), 150);
          break;
        case 'grenzeUpgrade': 
          play(300, 0.1, 'sine', 0.1);
          setTimeout(() => play(400, 0.1, 'sine', 0.08), 100);
          setTimeout(() => play(500, 0.15, 'sine', 0.06), 200);
          break;
        case 'grenzeDestroy': 
          play(120, 0.3, 'sawtooth', 0.12);
          setTimeout(() => play(80, 0.2, 'sawtooth', 0.1), 150);
          break;
        case 'harvest': 
          play(600, 0.05, 'sine', 0.05);
          setTimeout(() => play(800, 0.05, 'sine', 0.04), 50);
          break;
      }
    }
  };
})();

        const prodBuildings = buildings.filter(b => 
            !b.isUnderConstruction && 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz')
        );
        prodBuildings.forEach(b => {
            console.log(`  ${b.type} id=${b.id} pos=(${b.gridX},${b.gridY}) fieldCount=${b.fieldCount} ${b.isUnderConstruction ? '❌ IM BAU' : '✅ FERTIG'}`);
        });
        console.log('=====================================');
        return;
    }
    
    resourceNodes.forEach((node, i) => {
        const progress = node.maxTimer > 0 ? (node.timer / node.maxTimer * 100) : 0;
        const status = node.ready ? '✅ READY' : '⏳ LÄUFT';
        console.log(`  [${i}] id=${node.id} type=${node.type} pos=(${node.x},${node.y})`);
        console.log(`       timer=${node.timer.toFixed(2)}/${node.maxTimer} (${progress.toFixed(1)}%) ${status}`);
        console.log(`       claimedBy=${node.claimedBy || 'frei'} fields=${node.fields ? node.fields.length : 0}`);
        
        if (node.fields && node.fields.length > 0) {
            const harvested = node.fields.filter(f => f.harvested).length;
            console.log(`       Felder: ${harvested}/${node.fields.length} geerntet`);
            node.fields.forEach((f, fi) => {
                console.log(`         [${fi}] (${f.x},${f.y}) harvested=${f.harvested} isBeingHarvested=${f.isBeingHarvested}`);
            });
        }
    });
    
    console.log('📊 resourceNodeByPosition Größe:', resourceNodeByPosition.size);
    let syncProblems = 0;
    for (let [key, node] of resourceNodeByPosition) {
        const inList = resourceNodes.some(n => n.id === node.id);
        if (!inList) {
            console.log(`  ❌ SYNC-PROBLEM: ${key} → node ${node.id} ist in Map aber NICHT in resourceNodes!`);
            syncProblems++;
        }
    }
    if (syncProblems === 0) console.log('  ✅ Alle Nodes sind synchron');
    
    console.log('=====================================');
}

// ===== TIMER-PRÜFUNG ALLE 2 SEKUNDEN =====
let lastTimerCheck = 0;
function checkTimers() {
    if (!gameStarted) return;
    
    const now = performance.now() / 1000;
    if (now - lastTimerCheck < 2) return;
    lastTimerCheck = now;
    
    if (resourceNodes.length === 0) return;
    
    console.log(`⏱️ TIMER-CHECK (${new Date().toLocaleTimeString()}):`);
    resourceNodes.forEach((node, i) => {
        if (node.maxTimer > 0) {
            const progress = (node.timer / node.maxTimer * 100);
            const status = node.ready ? '✅' : '⏳';
            console.log(`  ${status} Node ${i}: ${node.timer.toFixed(2)}/${node.maxTimer} = ${progress.toFixed(1)}%`);
            
            if (node.timer > node.maxTimer && !node.ready) {
                console.log(`  ⚠️⚠️⚠️ ACHTUNG: Timer ${node.timer} > maxTimer ${node.maxTimer} aber ready=false!`);
                console.log(`  Grund: Felder werden nicht komplett geerntet!`);
                if (node.fields) {
                    const harvested = node.fields.filter(f => f.harvested).length;
                    console.log(`  Felder: ${harvested}/${node.fields.length} geerntet`);
                }
            }
        }
    });
}
