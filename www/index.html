function drawWorldSplit(cam, playerId) {
    const c = cam || camera;
    const viewWidth = canvas.width / c.zoom;
    const viewHeight = canvas.height / c.zoom;
    const margin = 0.1;
    
    const viewLeft = Math.max(0, Math.floor((c.x - viewWidth * (0.5 + margin)) / CONFIG.CELL_SIZE) - 2);
    const viewRight = Math.min(CONFIG.GRID_WIDTH, Math.ceil((c.x + viewWidth * (0.5 + margin)) / CONFIG.CELL_SIZE) + 2);
    const viewTop = Math.max(0, Math.floor((c.y - viewHeight * (0.5 + margin)) / CONFIG.CELL_SIZE) - 2);
    const viewBottom = Math.min(CONFIG.GRID_HEIGHT, Math.ceil((c.y + viewHeight * (0.5 + margin)) / CONFIG.CELL_SIZE) + 2);
    
    const viewLeftPx = viewLeft * CONFIG.CELL_SIZE;
    const viewRightPx = viewRight * CONFIG.CELL_SIZE;
    const viewTopPx = viewTop * CONFIG.CELL_SIZE;
    const viewBottomPx = viewBottom * CONFIG.CELL_SIZE;

    const isPlayer1 = (playerId === 'player');
    const shouldRotate = isPlayer1 && SPLIT_SCREEN;

    // ===== 1. TERRAIN (EINMALIG GERENDERTES CANVAS) =====
    if (terrainCanvas) {
        ctx.drawImage(terrainCanvas, 0, 0);
    }

    // ===== 2. GITTER =====
    const showGrid = (playerId === 'player' && selectedBuildingType !== null && gameStarted) ||
                     (playerId === 'player2' && selectedBuildingTypeP2 !== null && gameStarted);
    
    if (showGrid) {
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 0.5;
        for (let i = viewLeft; i <= viewRight; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CONFIG.CELL_SIZE, viewTop * CONFIG.CELL_SIZE);
            ctx.lineTo(i * CONFIG.CELL_SIZE, viewBottom * CONFIG.CELL_SIZE);
            ctx.stroke();
        }
        for (let j = viewTop; j <= viewBottom; j++) {
            ctx.beginPath();
            ctx.moveTo(viewLeft * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
            ctx.lineTo(viewRight * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
            ctx.stroke();
        }
    }

    // ===== 3. GEISTER =====
    drawGhosts(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);

    // ===== 4. GRENZEN =====
    drawGrenzenRotated(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx, playerId, shouldRotate);

    // ===== 5. BAU-VORSCHAU =====
    if (playerId === 'player') {
        if (gameStarted && pendingBuild && selectedBuildingType) {
            const px = pendingBuild.gx * CONFIG.CELL_SIZE;
            const py = pendingBuild.gy * CONFIG.CELL_SIZE;
            const isInRadius = isWithinBuildRadius(pendingBuild.gx, pendingBuild.gy, 'player');
            const isValid = isInRadius || selectedBuildingType === 'grenze';
            ctx.fillStyle = isValid ? 'rgba(255,255,0,0.2)' : 'rgba(255,0,0,0.2)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = isValid ? '#ffd966' : '#ff0000';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
            if (!isValid && selectedBuildingType !== 'grenze') {
                ctx.fillStyle = 'rgba(255,0,0,0.7)';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⚠️ Außerhalb Radius!', px + CONFIG.CELL_SIZE/2, py - 4);
            }
        }
    } else if (playerId === 'player2') {
        if (gameStarted && pendingBuildP2 && selectedBuildingTypeP2) {
            const px = pendingBuildP2.gx * CONFIG.CELL_SIZE;
            const py = pendingBuildP2.gy * CONFIG.CELL_SIZE;
            const isInRadius = isWithinBuildRadius(pendingBuildP2.gx, pendingBuildP2.gy, 'player2');
            const isValid = isInRadius || selectedBuildingTypeP2 === 'grenze';
            ctx.fillStyle = isValid ? 'rgba(255,165,0,0.2)' : 'rgba(255,0,0,0.2)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = isValid ? '#ff8a65' : '#ff0000';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
        }
    }

    // ===== 6. RESSOURCEN-FELDER =====
    if (gameStarted) {
        if (SPLIT_SCREEN) {
            drawResourceFields(ctx, 'player', viewLeft, viewRight, viewTop, viewBottom);
            drawResourceFields(ctx, 'player2', viewLeft, viewRight, viewTop, viewBottom);
        } else if (playerId === 'player') {
            drawResourceFields(ctx, 'player', viewLeft, viewRight, viewTop, viewBottom);
        } else if (playerId === 'player2') {
            drawResourceFields(ctx, 'player2', viewLeft, viewRight, viewTop, viewBottom);
        }
    }

    // ===== 7. RESSOURCEN-NODES =====
    if (SPLIT_SCREEN) {
        drawResourceNodesRotated(ctx, resourceNodes, viewLeft, viewRight, viewTop, viewBottom, showGrid, false, shouldRotate);
        drawResourceNodesRotated(ctx, player2ResourceNodes, viewLeft, viewRight, viewTop, viewBottom, showGrid, false, shouldRotate);
    } else {
        let nodesToDraw = [];
        let isNPC = false;
        if (playerId === 'player') {
            nodesToDraw = resourceNodes;
        } else if (playerId === 'player2') {
            nodesToDraw = player2ResourceNodes;
        } else {
            nodesToDraw = npcResourceNodes;
            isNPC = true;
        }
        drawResourceNodesRotated(ctx, nodesToDraw, viewLeft, viewRight, viewTop, viewBottom, showGrid, isNPC, shouldRotate);
    }

    // ===== 8. GEBÄUDE =====
    let allBuildings = [];
    if (SPLIT_SCREEN) {
        allBuildings.push(...buildings.map(b => ({...b, isGrenze: false, owner: 'player'})));
        allBuildings.push(...grenzen.map(g => ({...g, isGrenze: true, isNPC: false, playerId: 'player', owner: 'player'})));
        allBuildings.push(...player2Buildings.map(b => ({...b, isGrenze: false, owner: 'player2'})));
        allBuildings.push(...player2Grenzen.map(g => ({...g, isGrenze: true, isNPC: false, playerId: 'player2', owner: 'player2'})));
    } else if (playerId === 'player') {
        allBuildings.push(...buildings.map(b => ({...b, isGrenze: false, owner: 'player'})));
        allBuildings.push(...grenzen.map(g => ({...g, isGrenze: true, isNPC: false, playerId: 'player', owner: 'player'})));
        allBuildings.push(...npcBuildings.map(b => ({...b, isGrenze: false, owner: 'npc'})));
        allBuildings.push(...npcGrenzen.map(g => ({...g, isGrenze: true, isNPC: true, playerId: null, owner: 'npc'})));
    } else if (playerId === 'player2') {
        allBuildings.push(...player2Buildings.map(b => ({...b, isGrenze: false, owner: 'player2'})));
        allBuildings.push(...player2Grenzen.map(g => ({...g, isGrenze: true, isNPC: false, playerId: 'player2', owner: 'player2'})));
    }

    for (let b of allBuildings) {
        if (b.gridX < viewLeft || b.gridX >= viewRight || b.gridY < viewTop || b.gridY >= viewBottom) continue;
        const x = b.gridX * CONFIG.CELL_SIZE;
        const y = b.gridY * CONFIG.CELL_SIZE;

        // ===== GRENZKONTROLLE =====
        if (b.isGrenze) {
            const ownerKey = b.isNPC ? 'blau' : (b.playerId === 'player2' ? 'blau' : 'rot');
            const imgKey = `grenze-${ownerKey}`;
            const img = buildingImages[imgKey];
            
            if (b.isUnderConstruction) {
                const progress = b.constructionProgress || 0;
                ctx.strokeStyle = '#8B6914';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y + CONFIG.CELL_SIZE);
                ctx.lineTo(x + CONFIG.CELL_SIZE, y + CONFIG.CELL_SIZE);
                ctx.stroke();
                
                if (img && img.complete && img.naturalWidth > 0) {
                    const clipHeight = CONFIG.CELL_SIZE * progress;
                    const clipY = y + CONFIG.CELL_SIZE - clipHeight;
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, clipY, CONFIG.CELL_SIZE, clipHeight);
                    ctx.clip();
                    ctx.globalAlpha = 0.7 + progress * 0.3;
                    if (shouldRotate) {
                        ctx.save();
                        ctx.translate(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
                        ctx.rotate(Math.PI);
                        ctx.drawImage(img, -CONFIG.CELL_SIZE/2, -CONFIG.CELL_SIZE/2, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                        ctx.restore();
                    } else {
                        ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                    }
                    ctx.globalAlpha = 1;
                    ctx.restore();
                }
            } else {
                if (img && img.complete && img.naturalWidth > 0) {
                    if (shouldRotate) {
                        ctx.save();
                        ctx.translate(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
                        ctx.rotate(Math.PI);
                        ctx.drawImage(img, -CONFIG.CELL_SIZE/2, -CONFIG.CELL_SIZE/2, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                        ctx.restore();
                    } else {
                        ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                    }
                }
            }
            
            if (b.level > 1 && showGrid && !b.isUnderConstruction) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                if (shouldRotate) {
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(`Lv${b.level}`, x + CONFIG.CELL_SIZE - 4, y + CONFIG.CELL_SIZE - 4);
                } else {
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(`Lv${b.level}`, x + 4, y + 4);
                }
            }
            continue;
        }

        // ===== NORMALE GEBÄUDE =====
        if (b.beingCaptured && b.captureProgress > 0) {
            const flashSpeed = 8;
            const flashValue = Math.sin(performance.now() / 1000 * flashSpeed) * 0.5 + 0.5;
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 + flashValue * 0.5})`;
            ctx.lineWidth = 2 + flashValue * 2;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(x - 1, y - 1, CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE + 2);
            ctx.setLineDash([]);
            ctx.globalAlpha = 0.4 + flashValue * 0.4;
        }

        let ownerKey = 'rot';
        if (b.isNPC || b.playerId === 'player2') ownerKey = 'blau';
        const imgKey = `${b.type}-${ownerKey}`;
        const img = buildingImages[imgKey];
        
        if (b.isUnderConstruction) {
            const progress = b.constructionProgress || 0;
            ctx.strokeStyle = '#8B6914';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y + CONFIG.CELL_SIZE);
            ctx.lineTo(x + CONFIG.CELL_SIZE, y + CONFIG.CELL_SIZE);
            ctx.stroke();
            
            if (img && img.complete && img.naturalWidth > 0) {
                const clipHeight = CONFIG.CELL_SIZE * progress;
                const clipY = y + CONFIG.CELL_SIZE - clipHeight;
                ctx.save();
                ctx.beginPath();
                ctx.rect(x, clipY, CONFIG.CELL_SIZE, clipHeight);
                ctx.clip();
                ctx.globalAlpha = 0.7 + progress * 0.3;
                if (shouldRotate) {
                    ctx.save();
                    ctx.translate(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
                    ctx.rotate(Math.PI);
                    ctx.drawImage(img, -CONFIG.CELL_SIZE/2, -CONFIG.CELL_SIZE/2, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                    ctx.restore();
                } else {
                    ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                }
                ctx.globalAlpha = 1;
                ctx.restore();
            }
        } else {
            if (img && img.complete && img.naturalWidth > 0) {
                if (shouldRotate) {
                    ctx.save();
                    ctx.translate(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
                    ctx.rotate(Math.PI);
                    ctx.drawImage(img, -CONFIG.CELL_SIZE/2, -CONFIG.CELL_SIZE/2, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                    ctx.restore();
                } else {
                    ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                }
            }

            if (b.level > 1 && !b.isUnderConstruction && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (shouldRotate) {
                    ctx.save();
                    ctx.translate(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
                    ctx.rotate(Math.PI);
                    ctx.fillText(b.level, 0, 0);
                    ctx.restore();
                } else {
                    ctx.fillText(b.level, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
                }
            }

            if (!b.isUnderConstruction) {
                if (b.type === 'haus' && showGrid) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 10px sans-serif';
                    if (shouldRotate) {
                        ctx.save();
                        ctx.translate(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
                        ctx.rotate(Math.PI);
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(`${b.residents}/${b.maxResidents}`, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'top';
                        ctx.fillText(`${b.residents}/${b.maxResidents}`, x + 4, y + 4);
                    }
                }
                
                if (b.type === 'wachturm' && showGrid) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 9px sans-serif';
                    if (shouldRotate) {
                        ctx.save();
                        ctx.translate(x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
                        ctx.rotate(Math.PI);
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(`${b.stoneAmmo}/${b.maxStoneAmmo}`, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'top';
                        ctx.fillText(`${b.stoneAmmo}/${b.maxStoneAmmo}`, x + 4, y + 4);
                    }
                }
            }
        }

        // ===== TOWER STATUS =====
        if (b.type === 'wachturm' && !b.isUnderConstruction) {
            drawTowerStatus(ctx, b, x, y, CONFIG.CELL_SIZE);
        }
    }

    // ===== 9. BRENNENDE GEBÄUDE =====
    drawBurningBuildingsRotated(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx, shouldRotate);

    // ===== 10. TURM-REICHWEITEN =====
    if (showTowerRange) {
        let towers = [];
        if (SPLIT_SCREEN) {
            towers = [...buildings.filter(b => b.type === 'wachturm'), ...player2Buildings.filter(b => b.type === 'wachturm')];
        } else if (playerId === 'player') {
            towers = buildings.filter(b => b.type === 'wachturm');
        } else if (playerId === 'player2') {
            towers = player2Buildings.filter(b => b.type === 'wachturm');
        }
        for (let tower of towers) {
            if (tower.isUnderConstruction) continue;
            if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
            const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,0,0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,0,0.3)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // ===== 11. PROJEKTILE =====
    for (let p of projectiles) {
        if (p.x < viewLeftPx || p.x > viewRightPx || p.y < viewTopPx || p.y > viewBottomPx) continue;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.targetX, p.targetY);
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // ===== 12. HIT-EFFEKTE =====
    for (let effect of hitEffects) {
        if (effect.x < viewLeftPx || effect.x > viewRightPx || effect.y < viewTopPx || effect.y > viewBottomPx) continue;
        for (let p of effect.particles) {
            if (p.life <= 0) continue;
            const alpha = Math.max(0, p.life / p.maxLife);
            const size = Math.max(0.5, 2 + (1 - alpha) * 4);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color || `rgb(255,${Math.floor(50 * alpha)},${Math.floor(50 * alpha)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = p.color || '#ff0000';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }

    // ===== 13. EINWOHNER =====
    let villagersToDraw = [];
    if (SPLIT_SCREEN) {
        villagersToDraw = [...villagers, ...player2Villagers];
    } else if (playerId === 'player') {
        villagersToDraw = villagers;
    } else if (playerId === 'player2') {
        villagersToDraw = player2Villagers;
    }

    for (let v of villagersToDraw) {
        if (!v.alive) continue;
        
        if (v.state === 'idle') {
            let home = null;
            if (v.isNPC) {
                home = npcBuildings.find(b => b.id === v.homeId);
            } else if (v.playerId === 'player2') {
                home = player2Buildings.find(b => b.id === v.homeId);
            } else {
                home = buildings.find(b => b.id === v.homeId);
            }
            if (home) {
                const homeX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const homeY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const distToHome = Math.hypot(v.x - homeX, v.y - homeY);
                if (distToHome < 10) continue;
            }
        }
        
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            let drawPlayerId = 'player';
            if (v.isNPC) drawPlayerId = 'npc';
            else if (v.playerId === 'player2') drawPlayerId = 'player2';
            drawRotatedVillager(ctx, v, drawPlayerId, v.x, v.y, CONFIG.CELL_SIZE, shouldRotate);
        }
    }

    // ===== 14. FEINDE =====
    for (let e of enemies) {
        if (!e.alive) continue;
        if (e.x < viewLeftPx || e.x > viewRightPx || e.y < viewTopPx || e.y > viewBottomPx) continue;
        
        const imgKey = e.isSuper ? 'zombie-super' : 'zombie';
        const img = enemyImages[imgKey];
        const size = e.isSuper ? CONFIG.CELL_SIZE * 0.9 : CONFIG.CELL_SIZE * 0.7;
        
        if (img && img.complete && img.naturalWidth > 0) {
            if (shouldRotate) {
                ctx.save();
                ctx.translate(e.x, e.y + 6);
                ctx.rotate(Math.PI);
                ctx.drawImage(img, -size/2, -size/2, size, size);
                ctx.restore();
            } else {
                ctx.drawImage(img, e.x - size/2, e.y - size/2 + 6, size, size);
            }
        } else {
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.isSuper ? 8 : 5, 0, Math.PI * 2);
            ctx.fillStyle = e.isSuper ? '#ff00ff' : '#e74c3c';
            ctx.fill();
            ctx.strokeStyle = e.isSuper ? '#880088' : '#922b21';
            ctx.lineWidth = e.isSuper ? 2 : 1;
            ctx.stroke();
        }
        
        if (e.isSuper && e.hits < e.maxHits) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (shouldRotate) {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.rotate(Math.PI);
                ctx.fillText(`${e.maxHits - e.hits}`, 0, -12);
                ctx.restore();
            } else {
                ctx.fillText(`${e.maxHits - e.hits}`, e.x, e.y - 12);
            }
        }
    }

    // ===== 15. DRACHEN =====
    drawDragons(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    drawDragonProjectiles(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    drawExplosions(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
}


function drawSingleScreen() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    // ===== VIEWPORT BERECHNEN =====
    const viewLeft = Math.max(0, Math.floor((camera.x - canvas.width / 2 / camera.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewRight = Math.min(CONFIG.GRID_WIDTH, Math.ceil((camera.x + canvas.width / 2 / camera.zoom) / CONFIG.CELL_SIZE) + 2);
    const viewTop = Math.max(0, Math.floor((camera.y - canvas.height / 2 / camera.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewBottom = Math.min(CONFIG.GRID_HEIGHT, Math.ceil((camera.y + canvas.height / 2 / camera.zoom) / CONFIG.CELL_SIZE) + 2);
    
    const viewLeftPx = viewLeft * CONFIG.CELL_SIZE;
    const viewRightPx = viewRight * CONFIG.CELL_SIZE;
    const viewTopPx = viewTop * CONFIG.CELL_SIZE;
    const viewBottomPx = viewBottom * CONFIG.CELL_SIZE;

    // ===== 1. TERRAIN (EINMALIG GERENDERTES CANVAS) =====
    if (terrainCanvas) {
        ctx.drawImage(terrainCanvas, 0, 0);
    }

    // ===== 2. GITTERLINIEN =====
    const isPlacingStartBuilding = !gameStarted && pendingStartBuild !== null;
    const isPlacingNormalBuilding = gameStarted && selectedBuildingType !== null;
    const showGrid = isPlacingStartBuilding || isPlacingNormalBuilding;
    
    if (showGrid) {
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 0.5;
        for (let i = viewLeft; i <= viewRight; i++) {
            const x = i * CONFIG.CELL_SIZE;
            ctx.beginPath();
            ctx.moveTo(x, viewTop * CONFIG.CELL_SIZE);
            ctx.lineTo(x, viewBottom * CONFIG.CELL_SIZE);
            ctx.stroke();
        }
        for (let j = viewTop; j <= viewBottom; j++) {
            const y = j * CONFIG.CELL_SIZE;
            ctx.beginPath();
            ctx.moveTo(viewLeft * CONFIG.CELL_SIZE, y);
            ctx.lineTo(viewRight * CONFIG.CELL_SIZE, y);
            ctx.stroke();
        }
    }

    // ===== 3. GRENZEN =====
    drawGrenzen(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    renderDirtyGrenze = false;

    // ===== 4. RESSOURCEN-FELDER =====
    if (gameStarted) {
        drawResourceFields(ctx, 'player', viewLeft, viewRight, viewTop, viewBottom);
        drawResourceFields(ctx, 'npc', viewLeft, viewRight, viewTop, viewBottom);
    }

    // ===== 5. GEBÄUDE =====
    if (renderDirtyBuildings) {
        drawAllBuildings(ctx, viewLeft, viewRight, viewTop, viewBottom, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
        renderDirtyBuildings = false;
    } else if (!gameStarted) {
        drawStartBuildings(ctx, viewLeft, viewRight, viewTop, viewBottom, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    }

    // ===== 6. RESSOURCEN-NODES =====
    drawGhosts(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    drawResourceNodes(ctx, resourceNodes, viewLeft, viewRight, viewTop, viewBottom, showGrid, false);
    drawResourceNodes(ctx, npcResourceNodes, viewLeft, viewRight, viewTop, viewBottom, showGrid, true);

    // ===== 7. TURM-REICHWEITE =====
    if (showTowerRange) {
        drawTowerRanges(ctx, viewLeft, viewRight, viewTop, viewBottom);
    }

    // ===== 8. PROJEKTILE =====
    if (renderDirtyProjectiles) {
        drawProjectiles(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
        renderDirtyProjectiles = false;
    }

    // ===== 9. HIT-EFFEKTE =====
    if (renderDirtyEffects) {
        drawHitEffects(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
        renderDirtyEffects = false;
    }

    // ===== 10. EINWOHNER =====
    if (renderDirtyVillagers) {

    }

    // ===== 12. DRACHEN =====
    drawDragons(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    drawDragonProjectiles(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    drawExplosions(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);

    // ===== 13. BRENNENDE GEBÄUDE =====
    drawBurningBuildings(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);

    ctx.restore();
    
    // ===== 14. BAU-VORSCHAU =====
    if (selectedBuildingType && pendingBuild) {
        const worldX = pendingBuild.gx * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const worldY = pendingBuild.gy * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        
        const screenX = (worldX - camera.x) * camera.zoom + canvas.width / 2;
        const screenY = (worldY - camera.y) * camera.zoom + canvas.height / 2;
        
        const size = CONFIG.CELL_SIZE * camera.zoom;
        const px = screenX - size / 2;
        const py = screenY - size / 2;
        
        if (px + size > 0 && px < canvas.width && py + size > 0 && py < canvas.height) {
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(px, py, size, size);
            
            ctx.strokeStyle = 'rgba(255,215,0,0.8)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, size, size);
            ctx.setLineDash([]);
        }
    }
    
    // ===== 15. UI =====
    if (renderDirtyUI) {
        updateUI();
        renderDirtyUI = false;
    }
}

function drawSplitScreen() {

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, canvas.height / 2);
    ctx.clip();
    ctx.translate(canvas.width / 2, canvas.height / 4);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);
    drawWorldSplit(camera, 'player');
    ctx.restore();
    
    // Trennlinie
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(0, canvas.height / 2 - 1, canvas.width, 2);

// ===== HILFSFUNKTION: Prüft ob Touch in oberer Hälfte ist =====
function isInTopHalf(y) {
    return y < canvas.height / 2;
}

// ===== SPLIT-SCREEN KOORDINATENUMRECHNUNG =====
function screenToWorldSplit(sx, sy, cam, isTopHalf) {
    const adjustedY = isTopHalf ? sy : sy - canvas.height / 2;
    const adjustedHeight = canvas.height / 2;
    return {
        x: (sx - canvas.width/2) / cam.zoom + cam.x,
        y: (adjustedY - adjustedHeight/2) / cam.zoom + cam.y
    };
}

// ===== EINZELMODUS KOORDINATENUMRECHNUNG =====
function screenToWorld(sx, sy, cam = null) {
    const c = cam || camera;
    return {
        x: (sx - canvas.width/2) / c.zoom + c.x,
        y: (sy - canvas.height/2) / c.zoom + c.y
    };
}

// ===== TOUCH START =====
function handleTouchStart(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        touches[t.identifier] = {
            x: t.clientX - rect.left,
            y: t.clientY - rect.top,
            startX: t.clientX - rect.left,
            startY: t.clientY - rect.top
        };
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 2) {
        isPanning = false;
        lastPinchDist = Math.hypot(
            activeTouches[1].x - activeTouches[0].x,
            activeTouches[1].y - activeTouches[0].y
        );
    }
}

// ===== TOUCH MOVE =====
function handleTouchMove(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        touches[t.identifier] = {
            x: t.clientX - rect.left,
            y: t.clientY - rect.top
        };
    });
    activeTouches = Object.values(touches);

    if (activeTouches.length === 2) {
        isPanning = false;
        const p1 = activeTouches[0];
        const p2 = activeTouches[1];

        if (SPLIT_SCREEN) {
            const p1IsTop = isInTopHalf(p1.y);
            const p2IsTop = isInTopHalf(p2.y);
            if (p1IsTop !== p2IsTop) {
                lastPinchDist = 0;
                markDirty();
                return;
            }
        }

        const newDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

        if (lastPinchDist > 0) {
            const scale = newDist / lastPinchDist;
            if (SPLIT_SCREEN) {
                const isTop = isInTopHalf(mid.y);
                if (isTop) {
                    const before = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.x += before.x - after.x;
                    camera.y += before.y - after.y;
                } else {
                    const before = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.zoom = Math.min(cameraPlayer2.maxZoom, Math.max(cameraPlayer2.minZoom, cameraPlayer2.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.x += before.x - after.x;
                    cameraPlayer2.y += before.y - after.y;
                }
            } else {
                const before = screenToWorld(mid.x, mid.y, camera);
                camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                const after = screenToWorld(mid.x, mid.y, camera);
                camera.x += before.x - after.x;
                camera.y += before.y - after.y;
            }
        }
        lastPinchDist = newDist;
        markDirty();

    } else if (activeTouches.length === 1 && isPanning) {
        const p = activeTouches[0];
        const dx = p.x - panStart.x;
        const dy = p.y - panStart.y;
        if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
            hasMoved = true;
        }
        if (hasMoved) {
            if (SPLIT_SCREEN) {
                const startY = panStart.y;
                if (isInTopHalf(startY)) {
                    camera.x -= (p.x - panStart.x) / camera.zoom;
                    camera.y -= (p.y - panStart.y) / camera.zoom;
                } else {
                    cameraPlayer2.x -= (p.x - panStart.x) / cameraPlayer2.zoom;
                    cameraPlayer2.y -= (p.y - panStart.y) / cameraPlayer2.zoom;
                }
            } else {
                camera.x -= (p.x - panStart.x) / camera.zoom;
                camera.y -= (p.y - panStart.y) / camera.zoom;
            }
            panStart = { ...p };
            markDirty();
        }
    }
}

// ===== TOUCH END =====
function handleTouchEnd(e) {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => {
        delete touches[t.identifier];
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 0 && isPanning && !hasMoved) {
        const touchX = panStart.x;
        const touchY = panStart.y;
        let world;
        let playerId = 'player';
        if (SPLIT_SCREEN) {
            const isTop = isInTopHalf(touchY);
            if (isTop) {
                world = screenToWorldSplit(touchX, touchY, camera, true);
                playerId = 'player';
            } else {
                world = screenToWorldSplit(touchX, touchY, cameraPlayer2, false);
                playerId = 'player2';
            }
        } else {
            world = screenToWorld(touchX, touchY, camera);
            playerId = 'player';
        }
        const gx = Math.floor(world.x / CONFIG.CELL_SIZE);
        const gy = Math.floor(world.y / CONFIG.CELL_SIZE);
        if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
            handleTap(playerId, gx, gy);
        }
    }
    if (activeTouches.length === 0) {
        isPanning = false;
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
    }
}

// ===== TAP VERARBEITUNG (VOLLSTÄNDIG) =====
// ===== TAP VERARBEITUNG (VOLLSTÄNDIG) =====
function handleTap(playerId, gx, gy) {

    // ===== NETZWERK-START =====
    if (NETWORK_MODE && splitStartPhase && !gameStarted) {
        const isPlayer1Phase = splitStartPhase.startsWith('player1');
        const isGrenzePhase = splitStartPhase.includes('grenze');

        if (IS_HOST && !isPlayer1Phase) {
            showTemporaryMessage('❌ Jetzt ist der Client dran!', '#ff6b6b', true);
            return;
        }
        if (!IS_HOST && isPlayer1Phase) {
            showTemporaryMessage('❌ Jetzt ist der Host dran!', '#ff6b6b', true);
            return;
        }

        if (IS_HOST && playerId !== 'player') {
            showTemporaryMessage('❌ Du bist der Host - nutze deine Kamera!', '#ff6b6b', true);
            return;
        }
        if (!IS_HOST && playerId !== 'player') {
            showTemporaryMessage('❌ Du bist der Client - nutze deine Kamera!', '#ff6b6b', true);
            return;
        }

        const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
        if (isPlayer1Phase && gy > gridLimit) {
            showTemporaryMessage('❌ Host darf nur im oberen Drittel bauen!', '#ff6b6b', true);
            return;
        }
        if (!isPlayer1Phase && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Client darf nur im unteren Drittel bauen!', '#ff6b6b', true);
            return;
        }

        if (isCellOccupied(gx, gy)) {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
            return;
        }

        let type = 'grenze';
        if (splitStartPhase.includes('lager')) type = 'lager';
        else if (splitStartPhase.includes('haus')) type = 'haus';

        const typeDisplay = type === 'grenze' ? '🚩 Grenzkontrolle' : type === 'lager' ? '📦 Lager' : '🏠 Haus';
        const playerDisplay = isPlayer1Phase ? 'Host' : 'Client';

        pendingSplitStart = {
            gx, gy,
            player: isPlayer1Phase ? 'player1' : 'player2',
            type: type,
            isNetwork: true
        };

        dialogNeedsRotation = false;
        dialogIsUrgent = true;

        document.getElementById('confirmText').textContent = `${typeDisplay} an dieser Stelle für ${playerDisplay} platzieren?`;
        document.getElementById('costDisplay').textContent = '✅ Startgebäude - kostenlos';
        document.getElementById('effectDisplay').textContent = type === 'grenze' ? 'Ermöglicht das Bauen in diesem Bereich' : '6 Einwohner (beim Haus)';
        document.getElementById('confirmDialog').style.display = 'block';
        applyDialogRotation();
        window._pendingSplitStart = true;
        return;
    }

    // ===== SPLIT-START =====
    if (SPLIT_SCREEN && splitStartPhase && !gameStarted) {
        const isPlayer1Phase = splitStartPhase.startsWith('player1');
        const currentPlayer = isPlayer1Phase ? 'player' : 'player2';
        if (playerId !== currentPlayer) {
            showTemporaryMessage(`❌ Jetzt ist ${isPlayer1Phase ? 'Spieler 1' : 'Spieler 2'} dran!`, '#ff6b6b', true);
            return;
        }

        const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
        if (isPlayer1Phase && gy > gridLimit) {
            showTemporaryMessage('❌ Spieler 1 darf nur im oberen Drittel bauen!', '#ff6b6b', true);
            return;
        }
        if (!isPlayer1Phase && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b', true);
            return;
        }

        if (isCellOccupied(gx, gy)) {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
            return;
        }

        let type = 'grenze';
        if (splitStartPhase.includes('lager')) type = 'lager';
        else if (splitStartPhase.includes('haus')) type = 'haus';

        const typeDisplay = type === 'grenze' ? '🚩 Grenzkontrolle' : type === 'lager' ? '📦 Lager' : '🏠 Haus';
        const playerDisplay = isPlayer1Phase ? 'Spieler 1' : 'Spieler 2';

        pendingSplitStart = { gx, gy, player: isPlayer1Phase ? 'player1' : 'player2', type: type };

        dialogNeedsRotation = isPlayer1Phase;
        dialogIsUrgent = true;

        document.getElementById('confirmText').textContent = `${typeDisplay} an dieser Stelle für ${playerDisplay} platzieren?`;
        document.getElementById('costDisplay').textContent = '✅ Startgebäude - kostenlos';
        document.getElementById('effectDisplay').textContent = type === 'grenze' ? 'Ermöglicht das Bauen in diesem Bereich' : '6 Einwohner (beim Haus)';
        document.getElementById('confirmDialog').style.display = 'block';
        applyDialogRotation();
        window._pendingSplitStart = true;
        return;
    }

    // ===== EINZELMODUS START =====
    if (!gameStarted && !SPLIT_SCREEN) {
        if (!isCellOccupied(gx, gy, null, playerId)) {
            // ===== NEU: GRENZKONTROLLE ZUERST =====
            if (startPhase === 'grenze') {
                pendingStartBuild = { gx, gy, type: 'grenze' };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = '🚩 Grenzkontrolle an dieser Stelle platzieren? (kostenlos)';
                document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
                document.getElementById('effectDisplay').textContent = 'Ermöglicht das Bauen in diesem Bereich';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingStartType = 'grenze';
                return;
            } else if (startPhase === 'lager') {
                pendingStartBuild = { gx, gy, type: 'lager' };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = '📦 Lager an dieser Stelle platzieren? (kostenlos)';
                document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
                document.getElementById('effectDisplay').textContent = 'Dein erstes Lager';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingStartType = 'lager';
                return;
            } else if (startPhase === 'haus') {
                pendingStartBuild = { gx, gy, type: 'haus' };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = '🏠 Haus an dieser Stelle platzieren? (kostenlos)';
                document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
                document.getElementById('effectDisplay').textContent = 'Dein erstes Haus mit 6 Einwohnern';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingStartType = 'haus';
                return;
            }
        } else {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
        }
        return;
    }

    // ===== SPIELER 1 (player) =====
    if (playerId === 'player') {

        // ===== CLIENT (Spieler 2 im Netzwerk-Modus) =====
        if (NETWORK_MODE && !IS_HOST) {
            if (destroyModeP2) {
                const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
                const grenze = player2Grenzen.find(g => g.gridX === gx && g.gridY === gy);
                if (grenze) {
                    pendingDestroyP2 = { gx, gy, isGrenze: true };
                    dialogNeedsRotation = false;
                    dialogIsUrgent = true;
                    document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle (P2) wirklich abreissen?`;
                    document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                    document.getElementById('effectDisplay').textContent = '';
                    document.getElementById('confirmDialog').style.display = 'block';
                    applyDialogRotation();
                    window._pendingDestroyP2 = true;
                    return;
                } else if (building) {
                    pendingDestroyP2 = { gx, gy, isGrenze: false };
                    dialogNeedsRotation = false;
                    dialogIsUrgent = true;
                    document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (P2) wirklich abreissen?`;
                    document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                    document.getElementById('effectDisplay').textContent = '';
                    document.getElementById('confirmDialog').style.display = 'block';
                    applyDialogRotation();
                    window._pendingDestroyP2 = true;
                    return;
                }
                showTemporaryMessage('❌ Kein Gebäude zum Abreissen gefunden!', '#ff6b6b', true);
                return;
            }

            if (upgradeModeP2) {
                const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
                // ===== GRENZ-UPGRADE ENTFERNT (NUR FÜR GEBÄUDE) =====
                if (building && building.level < 3) {
                    pendingUpgradeP2 = { building, isGrenze: false, gx, gy };
                    const { cost, effect } = getUpgradeCostAndEffect(building);
                    dialogNeedsRotation = false;
                    dialogIsUrgent = true;
                    document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (P2) auf Stufe ${building.level + 1} upgraden?`;
                    document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone > 0 ? cost.stone + '🪨' : ''}`;
                    document.getElementById('effectDisplay').textContent = `Effekt: ${effect.desc}`;
                    document.getElementById('confirmDialog').style.display = 'block';
                    applyDialogRotation();
                    window._pendingUpgradeP2 = true;
                    return;
                }
                showTemporaryMessage('❌ Kein Gebäude zum Upgraden gefunden!', '#ff6b6b', true);
                upgradeModeP2 = false;
                document.getElementById('upgradeBtnSplit2').classList.remove('active');
                return;
            }

            if (selectedBuildingTypeP2) {
                if (pendingBuildP2 && pendingBuildP2.gx === gx && pendingBuildP2.gy === gy) {
                    if (startConstructionPlayer2(selectedBuildingTypeP2, pendingBuildP2.gx, pendingBuildP2.gy)) {
                        pendingBuildP2 = null;
                        showTemporaryMessage(`🔨 ${selectedBuildingTypeP2} wird gebaut... (10s)`, '#ffd966', true);
                    }
                } else {
                    pendingBuildP2 = { gx, gy };
                }
                return;
            }
            return;
        }

        // ===== HOST / EINZELMODUS / SPLIT =====

        // Abriss-Modus
        if (destroyMode) {
            const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
            const grenze = grenzen.find(g => g.gridX === gx && g.gridY === gy);
            if (grenze) {
                pendingDestroy = { gx, gy, isGrenze: true };
                dialogNeedsRotation = SPLIT_SCREEN;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle (Level ${grenze.level}) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingDestroy = true;
                return;
            } else if (building) {
                pendingDestroy = { gx, gy, isGrenze: false };
                dialogNeedsRotation = SPLIT_SCREEN;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (Level ${building.level}) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingDestroy = true;
                return;
            }
            showTemporaryMessage('❌ Kein Gebäude zum Abreissen gefunden!', '#ff6b6b', true);
            return;
        }

        // ===== UPGRADE-MODUS (NUR FÜR GEBÄUDE, KEINE GRENZEN MEHR) =====
        if (upgradeMode) {
            const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
            // ===== GRENZ-UPGRADE ENTFERNT (NUR FÜR GEBÄUDE) =====
            if (building && building.level < 3) {
                pendingUpgrade = { building, isGrenze: false, gx, gy };
                const { cost, effect } = getUpgradeCostAndEffect(building);
                dialogNeedsRotation = SPLIT_SCREEN;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} auf Stufe ${building.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone > 0 ? cost.stone + '🪨' : ''}`;
                document.getElementById('effectDisplay').textContent = `Effekt: ${effect.desc}`;
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingUpgrade = true;
                return;
            }
            showTemporaryMessage('❌ Kein Gebäude zum Upgraden gefunden!', '#ff6b6b', true);
            upgradeMode = false;
            document.getElementById('upgradeBtn').classList.remove('active');
            return;
        }

        // Bau-Modus
        if (selectedBuildingType) {
            if (pendingBuild && pendingBuild.gx === gx && pendingBuild.gy === gy) {
                if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
                    pendingBuild = null;
                    showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966', true);
                }
            } else {
                pendingBuild = { gx, gy };
            }
            return;
        }
    }

    // ===== SPIELER 2 (player2) - NUR SPLIT-SCREEN =====
    if (playerId === 'player2' && SPLIT_SCREEN) {
        if (destroyModeP2) {
            const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
            const grenze = player2Grenzen.find(g => g.gridX === gx && g.gridY === gy);
            if (grenze) {
                pendingDestroyP2 = { gx, gy, isGrenze: true };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle (P2) wirklich abreissen?`;

                window._pendingDestroyP2 = true;

            } else if (building) {
                pendingDestroyP2 = { gx, gy, isGrenze: false };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (P2) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingDestroyP2 = true;
                return;
            }
            showTemporaryMessage('❌ Kein Gebäude zum Abreissen gefunden!', '#ff6b6b', true);
            return;
        }

        // ===== UPGRADE-MODUS P2 (NUR FÜR GEBÄUDE, KEINE GRENZEN MEHR) =====
        if (upgradeModeP2) {
            const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
            // ===== GRENZ-UPGRADE ENTFERNT (NUR FÜR GEBÄUDE) =====
            if (building && building.level < 3) {
                pendingUpgradeP2 = { building, isGrenze: false, gx, gy };

        }

        if (selectedBuildingTypeP2) {

        const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
        if (resources.wood >= cost.wood && resources.stone >= cost.stone) {
            pendingUpgrade = { building: grenze, isGrenze: true, gx: grenze.gridX, gy: grenze.gridY };

            document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle auf Stufe ${grenze.level + 1} upgraden?`;

            document.getElementById('effectDisplay').textContent = `Effekt: Radius ${grenze.radius} → ${effect.radius || grenze.radius + 5} Zellen`;
            dialog.style.display = 'block';
            window._pendingGrenzeUpgrade = true;
            window._pendingGrenzeUpgradeId = grenze.id;

            showTemporaryMessage('❌ Nicht genug Ressourcen für Upgrade!', '#ff6b6b');

}

// ===== HANDLE CONFIRM YES =====
function handleConfirmYes() {
// ===== HAUPTMENÜ =====
if (window._pendingMainMenu) {
    window._pendingMainMenu = false;
    document.getElementById('confirmDialog').style.display = 'none';
    dialogNeedsRotation = false;
    dialogIsUrgent = false;
    location.reload();
    return;
}
    // ===== SPLIT-START / NETZWERK-START =====
    if (window._pendingSplitStart && pendingSplitStart) {
        if (NETWORK_MODE) {
            if (IS_HOST) {
                const isPlayer1Phase = splitStartPhase.startsWith('player1');
                if (isPlayer1Phase) {
                    const success = placeSplitStartBuilding('player1', pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy);
                    if (success) {
                        advanceNetworkStart();
                        sendDeltaSnapshot();
                        const typeName = pendingSplitStart.type === 'grenze' ? 'Grenzkontrolle' : pendingSplitStart.type;
                        showTemporaryMessage(`✅ Host ${typeName} platziert!`, pendingSplitStart.type === 'grenze' ? '#9b59b6' : '#2ecc71', true);
                        markDirty();
                        renderDirty = true;
                    }
                }
            } else {
                const isPlayer1Phase = splitStartPhase.startsWith('player1');
                if (!isPlayer1Phase) {
                    const success = placeSplitStartBuilding('player2', pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy);
                    if (success) {
                        const building = pendingSplitStart.type === 'grenze' ?
                            player2Grenzen.find(b => b.gridX === pendingSplitStart.gx && b.gridY === pendingSplitStart.gy) :
                            player2Buildings.find(b => b.gridX === pendingSplitStart.gx && b.gridY === pendingSplitStart.gy);
                        const action = {
                            type: 'build_start_building',
                            player: 'player2',
                            buildingType: pendingSplitStart.type,
                            gridX: pendingSplitStart.gx,
                            gridY: pendingSplitStart.gy,
                            resources: {
                                grain: player2Resources.grain,
                                wood: player2Resources.wood,
                                stone: player2Resources.stone
                            },
                            buildingId: building ? building.id : null,
                            isGrenze: pendingSplitStart.type === 'grenze'
                        };
                        window.sendNetworkAction(action);
                        const typeName = pendingSplitStart.type === 'grenze' ? 'Grenzkontrolle' : pendingSplitStart.type;
                        showTemporaryMessage(`✅ ${typeName} platziert! Warte auf Host...`, pendingSplitStart.type === 'grenze' ? '#d7bde2' : '#2ecc71', true);
                        markDirty();
                        renderDirty = true;
                    }
                }
            }
            pendingSplitStart = null;
            window._pendingSplitStart = false;
            document.getElementById('confirmDialog').style.display = 'none';
            dialogNeedsRotation = false;
            dialogIsUrgent = false;
            
            return;
        }

        if (SPLIT_SCREEN) {
            if (placeSplitStartBuilding(pendingSplitStart.player, pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy)) {
                pendingSplitStart = null;
                window._pendingSplitStart = false;
                advanceSplitStart();
            } else {
                pendingSplitStart = null;
                window._pendingSplitStart = false;
            }
            document.getElementById('confirmDialog').style.display = 'none';
            dialogNeedsRotation = false;
            dialogIsUrgent = false;
            markDirty();
            return;
        }
    }

// ===== EINZELMODUS START GRENZKONTROLLE =====
if (window._pendingStartType === 'grenze' && pendingStartBuild) {
    const g = new Grenzkontrolle(nextGrenzeId++, pendingStartBuild.gx, pendingStartBuild.gy, 'player', false);
    g.isUnderConstruction = false;
    g.constructionProgress = 1;
    g.radius = CONFIG.GRENZE_RADIUS;
    grenzen.push(g);
    
    camera.x = g.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    camera.y = g.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    
    startPhase = 'lager';
    pendingStartBuild = null;
    window._pendingStartType = null;
    
    showTemporaryMessage('✅ Grenzkontrolle platziert! Jetzt Lager platzieren (innerhalb des Radius)', '#9b59b6', true);
    document.getElementById('confirmDialog').style.display = 'none';
    dialogNeedsRotation = false;
    dialogIsUrgent = false;
    
    // ===== HIER FEHLT: SOFORT NEU ZEICHNEN! =====
    markDirty();
    renderDirtyBuildings = true;  // ← DAS FEHLTE!
    renderDirtyGrenze = true;     // ← Auch Grenzen neu zeichnen!
    
    return;
}

// ===== EINZELMODUS START LAGER =====
if (window._pendingStartType === 'lager' && pendingStartBuild) {
    const isInRadius = isWithinBuildRadius(pendingStartBuild.gx, pendingStartBuild.gy, 'player');
    if (!isInRadius) {
        showTemporaryMessage('❌ Lager muss innerhalb des Grenzkontroll-Radius liegen!', '#ff6b6b', true);
        pendingStartBuild = null;
        window._pendingStartType = null;
        document.getElementById('confirmDialog').style.display = 'none';
        return;
    }
    
    const lager = new Building(nextBuildingId++, 'lager', pendingStartBuild.gx, pendingStartBuild.gy, false);
    lager.isUnderConstruction = false;
    lager.constructionProgress = 1;
    buildings.push(lager);
    startPhase = 'haus';
    pendingStartBuild = null;
    window._pendingStartType = null;
    showTemporaryMessage('✅ Lager platziert! Jetzt Haus platzieren', '#ffd966', true);
    document.getElementById('confirmDialog').style.display = 'none';
    dialogNeedsRotation = false;
    dialogIsUrgent = false;
    markDirty();
    return;
}

// ===== EINZELMODUS START HAUS =====
if (window._pendingStartType === 'haus' && pendingStartBuild) {
    const isInRadius = isWithinBuildRadius(pendingStartBuild.gx, pendingStartBuild.gy, 'player');
    if (!isInRadius) {
        showTemporaryMessage('❌ Haus muss innerhalb des Grenzkontroll-Radius liegen!', '#ff6b6b', true);
        pendingStartBuild = null;
        window._pendingStartType = null;
        document.getElementById('confirmDialog').style.display = 'none';
        return;
    }
    
    const haus = new Building(nextBuildingId++, 'haus', pendingStartBuild.gx, pendingStartBuild.gy, false);
    haus.isUnderConstruction = false;
    haus.constructionProgress = 1;
    haus.residents = 6;
    haus.maxResidents = 6;
    haus.maxProductionTime = 30;
    haus.baseMaxProductionTime = 30;
    buildings.push(haus);
    for (let i = 0; i < 6; i++) {
        spawnVillager(haus.id);
    }
    gameStarted = true;
    pendingStartBuild = null;
    window._pendingStartType = null;
    startPhase = 'grenze';
    
    if (!SPLIT_SCREEN) {
        initNPC();
    }
    
    showTemporaryMessage('🎮 Spiel gestartet! 6 Einwohner warten auf Befehle!', '#2ecc71', true);
    document.getElementById('confirmDialog').style.display = 'none';
    dialogNeedsRotation = false;
    dialogIsUrgent = false;
    markDirty();
    return;
}


    // ===== ZERSTÖRUNG SPIELER 1 =====
    if (window._pendingDestroy && pendingDestroy) {
        if (pendingDestroy.isGrenze) {
            if (destroyGrenze(pendingDestroy.gx, pendingDestroy.gy)) {
                pendingDestroy = null;
                destroyMode = false;
                document.getElementById('destroyBtn').classList.remove('active');
                showTemporaryMessage('💀 Grenzkontrolle abgerissen', '#ff6b6b', true);
            }
        } else if (destroyBuilding(pendingDestroy.gx, pendingDestroy.gy)) {
            pendingDestroy = null;
            destroyMode = false;
            document.getElementById('destroyBtn').classList.remove('active');
            showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b', true);
        }
        window._pendingDestroy = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty('buildings');
        return;
    }

    // ===== ZERSTÖRUNG SPIELER 2 =====
    if (window._pendingDestroyP2 && pendingDestroyP2) {
        if (pendingDestroyP2.isGrenze) {
            if (destroyGrenzePlayer2(pendingDestroyP2.gx, pendingDestroyP2.gy)) {
                pendingDestroyP2 = null;
                destroyModeP2 = false;
                document.getElementById('destroyBtnSplit2').classList.remove('active');
                showTemporaryMessage('💀 Grenzkontrolle (P2) abgerissen', '#ff6b6b', true);
            }
        } else if (destroyBuildingPlayer2(pendingDestroyP2.gx, pendingDestroyP2.gy)) {
            pendingDestroyP2 = null;
            destroyModeP2 = false;
            document.getElementById('destroyBtnSplit2').classList.remove('active');
            showTemporaryMessage('💀 Gebäude (P2) abgerissen', '#ff6b6b', true);
        }
        window._pendingDestroyP2 = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== UPGRADE SPIELER 1 =====
    if (window._pendingUpgrade && pendingUpgrade) {
        if (pendingUpgrade.isGrenze) {
            const grenze = grenzen.find(g => g.id === pendingUpgrade.building.id);
            if (grenze && upgradeGrenze(grenze)) {
                showTemporaryMessage(`⬆️ Grenzkontrolle auf Stufe ${grenze.level} upgrade!`, '#9b59b6', true);
                pendingUpgrade = null;
            }
        } else {
            const building = pendingUpgrade.building;
            if (upgradeBuilding(building)) {
                showTemporaryMessage(`⬆️ Upgrade auf Stufe ${building.level} erfolgreich!`, '#ffd966', true);
                pendingUpgrade = null;
            }
        }
        window._pendingUpgrade = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== UPGRADE SPIELER 2 =====
    if (window._pendingUpgradeP2 && pendingUpgradeP2) {
        if (pendingUpgradeP2.isGrenze) {
            const grenze = player2Grenzen.find(g => g.id === pendingUpgradeP2.building.id);
            if (grenze && upgradeGrenzePlayer2(grenze)) {
                showTemporaryMessage(`⬆️ Grenzkontrolle (P2) auf Stufe ${grenze.level} upgrade!`, '#d7bde2', true);
                pendingUpgradeP2 = null;
            }
        } else {
            const building = pendingUpgradeP2.building;
            if (upgradeBuildingPlayer2(building)) {
                showTemporaryMessage(`⬆️ Upgrade (P2) auf Stufe ${building.level} erfolgreich!`, '#ffd966', true);
                pendingUpgradeP2 = null;
            }
        }
        window._pendingUpgradeP2 = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== BAU SPIELER 1 =====
    if (pendingBuild && selectedBuildingType) {
        if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
            pendingBuild = null;
            showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== BAU SPIELER 2 =====
    if (pendingBuildP2 && selectedBuildingTypeP2) {
        if (startConstructionPlayer2(selectedBuildingTypeP2, pendingBuildP2.gx, pendingBuildP2.gy)) {
            pendingBuildP2 = null;
            showTemporaryMessage(`🔨 ${selectedBuildingTypeP2} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

// ===== IN handleConfirmYes() EINFÜGEN =====
// ===== NACH DER GEBÄUDE-EROBERUNG =====

// ===== GRENZ-EROBERUNG BESTÄTIGEN =====
if (window._pendingGrenzeCapture) {
    const grenze = window._pendingGrenzeCapture.grenze;
    const fromPlayer = window._pendingGrenzeCapture.fromPlayer;
    const toPlayer = window._pendingGrenzeCapture.toPlayer;
    
    if (transferGrenze(grenze, fromPlayer, toPlayer)) {
        const playerName = toPlayer === 'player' ? 'Spieler 1' : 
                          toPlayer === 'player2' ? 'Spieler 2' : 'NPC';
        showTemporaryMessage(`🚩 Grenzkontrolle wurde von ${playerName} erobert!`, '#9b59b6', true);
        SoundFX.playIfVisible(grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, 
                             grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, 'capture');
        markDirty();
    }
    window._pendingGrenzeCapture = null;
    document.getElementById('confirmDialog').style.display = 'none';
    return;
}

    // ===== HAUPTMENÜ =====
    if (window._pendingMainMenu) {
        window._pendingMainMenu = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        location.reload();
        return;
    }

    // ===== FALLBACK =====
    document.getElementById('confirmDialog').style.display = 'none';
    dialogNeedsRotation = false;
    dialogIsUrgent = false;
}

// Diese Funktion wird in handleTap() aufgerufen, wenn ein Gebäude angetippt wird
function handleBuildingTap(playerId, gx, gy) {
    // ===== SPIELER 1 =====
    if (playerId === 'player') {
        // Prüfe ob Grenzkontrolle
        const grenze = grenzen.find(g => g.gridX === gx && g.gridY === gy);
        if (grenze) {
            if (upgradeMode && grenze.level < 3) {
                const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
                pendingUpgrade = { building: grenze, isGrenze: true, gx: gx, gy: gy };
                document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle auf Stufe ${grenze.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone}🪨`;
                document.getElementById('effectDisplay').textContent = `Effekt: Radius ${grenze.radius} → ${effect.radius || grenze.radius + 5} Zellen`;
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingUpgrade = true;
                return true;
            }
            if (destroyMode) {
                pendingDestroy = { gx, gy, isGrenze: true };
                document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle (Level ${grenze.level}) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingDestroy = true;
                return true;
            }
            // Info anzeigen
            const owner = grenze.isNPC ? 'NPC' : 'Spieler';
            const captureStatus = grenze.beingCaptured ? ` (wird erobert: ${Math.round(grenze.captureProgress * 100)}%)` : '';
            showTemporaryMessage(`🚩 ${owner} Grenzkontrolle (Level ${grenze.level}, Radius: ${grenze.radius} Zellen)${captureStatus}`, '#9b59b6', true);
            return true;
        }
        
        // Normales Gebäude (wie gehabt)
        const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
        if (building) {
            // ... bestehende Logik ...
        }
    }
    
    // ===== SPIELER 2 =====
    if (playerId === 'player2' && SPLIT_SCREEN) {
        const grenze = player2Grenzen.find(g => g.gridX === gx && g.gridY === gy);
        if (grenze) {
            if (upgradeModeP2 && grenze.level < 3) {
                const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
                pendingUpgradeP2 = { building: grenze, isGrenze: true, gx: gx, gy: gy };
                document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle (P2) auf Stufe ${grenze.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone}🪨`;
                document.getElementById('effectDisplay').textContent = `Effekt: Radius ${grenze.radius} → ${effect.radius || grenze.radius + 5} Zellen`;
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingUpgradeP2 = true;
                return true;
            }
            if (destroyModeP2) {
                pendingDestroyP2 = { gx, gy, isGrenze: true };
                document.getElementById('confirmText').textContent = `🚩 Grenzkontrolle (P2) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingDestroyP2 = true;
                return true;
            }
            const captureStatus = grenze.beingCaptured ? ` (wird erobert: ${Math.round(grenze.captureProgress * 100)}%)` : '';
            showTemporaryMessage(`🚩 Spieler 2 Grenzkontrolle (Level ${grenze.level}, Radius: ${grenze.radius} Zellen)${captureStatus}`, '#d7bde2', true);
            return true;
        }
        
        // Normales Gebäude (wie gehabt)
        const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
        if (building) {
            // ... bestehende Logik ...
        }
    }
    
    // ===== NPC (nur Einzelmodus) =====
    if (!SPLIT_SCREEN && !NETWORK_MODE) {
        const npcGrenze = npcGrenzen.find(g => g.gridX === gx && g.gridY === gy);
        if (npcGrenze) {
            const captureStatus = npcGrenze.beingCaptured ? ` (wird erobert: ${Math.round(npcGrenze.captureProgress * 100)}%)` : '';
            showTemporaryMessage(`🤖 NPC Grenzkontrolle (Level ${npcGrenze.level}, Radius: ${npcGrenze.radius} Zellen)${captureStatus}`, '#4a235a', true);
            return true;
        }
        
        const npcBuilding = npcBuildings.find(b => b.gridX === gx && b.gridY === gy);
        if (npcBuilding) {
            // ... bestehende Logik ...
        }
    }
    
    return false;
}

function setupToggleButton() {

        toggleBtn.style.zIndex = '21';

    const speedBtn = document.getElementById('splitSpeedBtn');
    const menuBtn = document.getElementById('splitMainMenuBtn');

    if (rangeBtn) {
        const newRangeBtn = rangeBtn.cloneNode(true);
        rangeBtn.parentNode.replaceChild(newRangeBtn, rangeBtn);

            this.style.textShadow = showTowerRange ? '0 0 12px rgba(255,215,0,0.6)' : 'none';

                               showTowerRange ? '#ffd966' : 'rgba(255,255,255,0.5)');
            markDirty();
        });
        newRangeBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            this.click();
        }, { passive: false });
    }

    if (speedBtn) {
        const newSpeedBtn = speedBtn.cloneNode(true);
        speedBtn.parentNode.replaceChild(newSpeedBtn, speedBtn);
        
        newSpeedBtn.addEventListener('click', function() {
            if (gameSpeedMultiplier === 1) {
                gameSpeedMultiplier = 2;
                gameSpeed = 2;
                this.textContent = '⏩';
                this.style.color = '#ffd966';
                this.style.textShadow = '0 0 12px rgba(255,215,0,0.6)';
                showTemporaryMessage('⏱️ 2x GESCHWINDIGKEIT (beide Spieler)', '#ffd966');
            } else if (gameSpeedMultiplier === 2) {
                gameSpeedMultiplier = 3;
                gameSpeed = 3;
                this.textContent = '⏩⏩';
                this.style.color = '#ff6b6b';
                this.style.textShadow = '0 0 12px rgba(255,68,68,0.6)';
                showTemporaryMessage('⏱️ 3x GESCHWINDIGKEIT (beide Spieler)', '#ff6b6b');
            } else {
                gameSpeedMultiplier = 1;
                gameSpeed = 1;
                this.textContent = '⏱️';
                this.style.color = 'rgba(255,255,255,0.8)';
                this.style.textShadow = 'none';
                showTemporaryMessage('⏱️ 1x GESCHWINDIGKEIT', '#44ff44');
            }
            markDirty();
        });
        newSpeedBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            this.click();
        }, { passive: false });
    }

    if (menuBtn) {
        const newMenuBtn = menuBtn.cloneNode(true);
        menuBtn.parentNode.replaceChild(newMenuBtn, menuBtn);
        
        newMenuBtn.addEventListener('click', function() {
            document.getElementById('confirmText').textContent = '❌ Wirklich zum Hauptmenü?';
            document.getElementById('costDisplay').textContent = 'Das Spiel wird neu gestartet!';
            document.getElementById('effectDisplay').textContent = '⚠️ Alle Fortschritte gehen verloren!';
            document.getElementById('confirmDialog').style.display = 'block';
            window._pendingMainMenu = true;
        });
        newMenuBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            this.click();
        }, { passive: false });
    }
}

    if (!modeDisplay) {
        modeDisplay = document.createElement('div');
        modeDisplay.id = 'modeDisplay';
        modeDisplay.style.cssText = `
            position: absolute;
            top: 45px;
            right: 8px;
            z-index: 15;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #eee;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            font-family: 'Segoe UI', system-ui, sans-serif;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        `;
        document.getElementById('game-container').appendChild(modeDisplay);
    }
