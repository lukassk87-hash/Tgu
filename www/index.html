                    markNpcCacheDirty();
                }
            } else if (npcResources.grain <= 0 && totalNPCAlive > 0) {
                h.growthTimer = 0;
            }
        });

        // FISCHERHÜTTEN: Fisch produzieren
        const fischerhütten = npcBuildings.filter(b => 
            b.type === 'fischerhütte' && !b.isUnderConstruction
        );

        for (let b of fischerhütten) {
            b.fishProductionTimer = (b.fishProductionTimer || 0) + dt;
            const interval = 30 / (b.level || 1);
            if (b.fishProductionTimer >= interval) {
                b.fishProductionTimer -= interval;
                npcResources.fish = (npcResources.fish || 0) + 1;
                markDirty('buildings');
            }
        }

        // FISCH-VERBRAUCH FÜR RESSOURCEN-GEBÄUDE
        const resourceBuildings = npcBuildings.filter(b => 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && 
            !b.isUnderConstruction
        );

        for (let b of resourceBuildings) {
            if (b.fishStorage === undefined) b.fishStorage = 0;
            if (b.maxFishStorage === undefined) b.maxFishStorage = 3;
            if (b.fishConsumeTimer === undefined) b.fishConsumeTimer = 0;
            if (b.hasFishBonus === undefined) b.hasFishBonus = false;
            if (b.fishBonusTimer === undefined) b.fishBonusTimer = 0;
            if (b.fishConsumeInterval === undefined) b.fishConsumeInterval = 18;

            b.fishConsumeTimer += dt;
            if (b.fishConsumeTimer >= b.fishConsumeInterval) {
                b.fishConsumeTimer -= b.fishConsumeInterval;
                if (b.fishStorage > 0) {
                    b.fishStorage--;
                    b.hasFishBonus = true;
                    b.fishBonusTimer = 0;
                } else {
                    b.hasFishBonus = false;
                    b.fishBonusTimer += b.fishConsumeInterval;
                }
            }

            if (npcResources.fish > 0 && b.fishStorage < b.maxFishStorage) {
                const needed = b.maxFishStorage - b.fishStorage;
                const toAdd = Math.min(needed, npcResources.fish);
                b.fishStorage += toAdd;
                npcResources.fish -= toAdd;
            }

            let fishMultiplier = 1.0;
            if (b.fishStorage >= 3) {
                fishMultiplier = 1.5;
                b.hasFishBonus = true;
            } else if (b.fishStorage === 0 && b.fishBonusTimer > 60) {
                fishMultiplier = 0.75;
                b.hasFishBonus = false;
            } else {
                fishMultiplier = 1.0;
                b.hasFishBonus = false;
            }
            
            const baseTime = b.baseMaxProductionTime || 30;
            const levelMultiplier = b.level || 1;
            b.maxProductionTime = (baseTime / levelMultiplier) * (1 / fishMultiplier);
            
            const node = npcResourceNodes.find(n => n.buildingId === b.id);
            if (node) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = b.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }

        // GETREIDE-BILANZ ALLE 30 SEKUNDEN
        npcGrainCheckTimer += dt;
        if (npcGrainCheckTimer >= 30) {
            const grainNow = npcResources.grain;
            npcGrainBalance = grainNow - npcGrainStart;
            npcGrainStart = grainNow;
            npcGrainCheckTimer = 0;
        }
    }
}

    }

    if (!SPLIT_SCREEN && npcStarted) {

}

// ===== HILFSFUNKTION: VILLAGER IN REICHWEITE FINDEN (MIT FALLBACK) =====
function findNearestVillagerWithFallback(x, y, range, playerType = 'player') {
    // 1. ZUERST GRID VERWENDEN
    let gridResult = null;
    let gridDistSq = Infinity;
    const rangeSq = range * range;
    
    if (playerType === 'player') {
        if (villagerGridDirtyPlayer) {
            rebuildVillagerGridPlayer();
        }
        
        const keys = getNeighborGridKeys(x, y, range);
        for (let key of keys) {
            const cells = villagerGridPlayer.get(key);
            if (cells) {
                for (let v of cells) {
                    if (!v.alive) continue;
                    if (v.state !== 'idle' || v.carrying !== null || v.hasTask || v.isAttacking || v.isBuilding) continue;
                    const dx = v.x - x;
                    const dy = v.y - y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < rangeSq && d2 < gridDistSq) {
                        gridDistSq = d2;
                        gridResult = v;
                    }
                }
            }
        }
    } else if (playerType === 'player2') {
        if (villagerGridDirtyPlayer2) {
            rebuildVillagerGridPlayer2();
        }
        
        const keys = getNeighborGridKeys(x, y, range);
        for (let key of keys) {
            const cells = villagerGridPlayer2.get(key);
            if (cells) {
                for (let v of cells) {
                    if (!v.alive) continue;
                    if (v.state !== 'idle' || v.carrying !== null || v.hasTask || v.isAttacking || v.isBuilding) continue;
                    const dx = v.x - x;
                    const dy = v.y - y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < rangeSq && d2 < gridDistSq) {
                        gridDistSq = d2;
                        gridResult = v;
                    }
                }
            }
        }
    } else if (playerType === 'npc') {
        if (villagerGridDirtyNpc) {
            rebuildVillagerGridNpc();
        }
        
        const keys = getNeighborGridKeys(x, y, range);
        for (let key of keys) {
            const cells = villagerGridNpc.get(key);
            if (cells) {
                for (let v of cells) {
                    if (!v.alive) continue;
                    if (v.state !== 'idle' || v.carrying !== null || v.hasTask || v.isAttacking || v.isBuilding) continue;
                    const dx = v.x - x;
                    const dy = v.y - y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < rangeSq && d2 < gridDistSq) {
                        gridDistSq = d2;
                        gridResult = v;
                    }
                }
            }
        }
    }
    
    // 2. WENN GRID EINEN VILLAGER GEFUNDEN HAT → ZURÜCKGEBEN
    if (gridResult) {
        return gridResult;
    }
    
    // 3. FALLBACK: STANDARDSUCHE (NUR WENN GRID NICHTS GEFUNDEN HAT)
    let fallbackResult = null;
    let fallbackDistSq = Infinity;
    
    let villagersToSearch = [];
    if (playerType === 'player') {
        villagersToSearch = villagers;
    } else if (playerType === 'player2') {
        villagersToSearch = player2Villagers;
    } else if (playerType === 'npc') {
        villagersToSearch = npcVillagers;
    }
    
    for (let v of villagersToSearch) {
        if (!v.alive) continue;
        if (v.state !== 'idle' || v.carrying !== null || v.hasTask || v.isAttacking || v.isBuilding) continue;
        const dx = v.x - x;
        const dy = v.y - y;
        const d2 = dx * dx + dy * dy;
        if (d2 < rangeSq && d2 < fallbackDistSq) {
            fallbackDistSq = d2;
            fallbackResult = v;
        }
    }
    
    // 4. WENN FALLBACK EINEN VILLAGER GEFUNDEN HAT → ZURÜCKGEBEN
    if (fallbackResult) {
        // Grid als dirty markieren, damit es beim nächsten Mal aktualisiert wird
        if (playerType === 'player') {
            villagerGridDirtyPlayer = true;
        } else if (playerType === 'player2') {
            villagerGridDirtyPlayer2 = true;
        } else if (playerType === 'npc') {
            villagerGridDirtyNpc = true;
        }
        return fallbackResult;
    }
    
    // 5. KEIN VILLAGER GEFUNDEN
    return null;
}

    const rangeSq = range * range;

                    const dx = v.x - x;
                    const dy = v.y - y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < rangeSq) {
                        gridCandidates.push({ villager: v, distSq: d2 });
                    }
                }
            }
        }
        
        // Nach Distanz sortieren
        gridCandidates.sort((a, b) => a.distSq - b.distSq);
        
        // Die nächsten 'count' Villager nehmen
        for (let i = 0; i < Math.min(count, gridCandidates.length); i++) {
            results.push(gridCandidates[i].villager);
        }
        
        // Wenn wir genug gefunden haben → zurückgeben
        if (results.length >= count) {
            return results;
        }
    } else if (playerType === 'player2') {
        if (villagerGridDirtyPlayer2) {
            rebuildVillagerGridPlayer2();
        }
        
        const keys = getNeighborGridKeys(x, y, range);
        const gridCandidates = [];
        
        for (let key of keys) {

            if (cells) {

                    if (v.state !== 'idle' || v.carrying !== null || v.hasTask || v.isAttacking || v.isBuilding) continue;
                    const dx = v.x - x;
                    const dy = v.y - y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < rangeSq) {
                        gridCandidates.push({ villager: v, distSq: d2 });
                    }
                }
            }
        }
        
        gridCandidates.sort((a, b) => a.distSq - b.distSq);
        
        for (let i = 0; i < Math.min(count, gridCandidates.length); i++) {
            results.push(gridCandidates[i].villager);
        }
        
        if (results.length >= count) {
            return results;
        }
    } else if (playerType === 'npc') {
        if (villagerGridDirtyNpc) {
            rebuildVillagerGridNpc();
        }
        
        const keys = getNeighborGridKeys(x, y, range);
        const gridCandidates = [];
        
        for (let key of keys) {
            const cells = villagerGridNpc.get(key);
            if (cells) {
                for (let v of cells) {
                    if (!v.alive) continue;
                    if (v.state !== 'idle' || v.carrying !== null || v.hasTask || v.isAttacking || v.isBuilding) continue;
                    const dx = v.x - x;
                    const dy = v.y - y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < rangeSq) {
                        gridCandidates.push({ villager: v, distSq: d2 });
                    }
                }
            }
        }
        
        gridCandidates.sort((a, b) => a.distSq - b.distSq);
        
        for (let i = 0; i < Math.min(count, gridCandidates.length); i++) {
            results.push(gridCandidates[i].villager);
        }
        
        if (results.length >= count) {
            return results;
        }
    }
    
    // 2. FALLBACK: STANDARDSUCHE (NUR WENN GRID NICHT GENUG GEFUNDEN HAT)
    const remaining = count - results.length;
    if (remaining <= 0) return results;
    
    let villagersToSearch = [];
    if (playerType === 'player') {
        villagersToSearch = villagers;
    } else if (playerType === 'player2') {
        villagersToSearch = player2Villagers;
    } else if (playerType === 'npc') {
        villagersToSearch = npcVillagers;
    }
    
    const fallbackCandidates = [];
    
    for (let v of villagersToSearch) {
        if (!v.alive) continue;
        if (v.state !== 'idle' || v.carrying !== null || v.hasTask || v.isAttacking || v.isBuilding) continue;
        // Überspringe bereits gefundene Villager
        if (results.includes(v)) continue;
        const dx = v.x - x;
        const dy = v.y - y;
        const d2 = dx * dx + dy * dy;
        if (d2 < rangeSq) {
            fallbackCandidates.push({ villager: v, distSq: d2 });
        }
    }
    
    fallbackCandidates.sort((a, b) => a.distSq - b.distSq);
    
    for (let i = 0; i < Math.min(remaining, fallbackCandidates.length); i++) {
        results.push(fallbackCandidates[i].villager);
    }
    
    // Grid als dirty markieren, damit es beim nächsten Mal aktualisiert wird
    if (playerType === 'player') {
        villagerGridDirtyPlayer = true;
    } else if (playerType === 'player2') {
        villagerGridDirtyPlayer2 = true;
    } else if (playerType === 'npc') {
        villagerGridDirtyNpc = true;
    }
    
    return results;
}

// ===== HILFSFUNKTION: NACHBAR-GRID-KEYS =====
function getNeighborGridKeys(x, y, range) {
    const cx = Math.floor(x / VILLAGER_GRID_SIZE);
    const cy = Math.floor(y / VILLAGER_GRID_SIZE);
    const radius = Math.ceil(range / VILLAGER_GRID_SIZE) + 1;
    const keys = [];
    for (let dx = -radius; dx <= radius; dx++) {
        for (let dy = -radius; dy <= radius; dy++) {
            keys.push((cx + dx) + ',' + (cy + dy));
        }
    }
    return keys;
}

    // ===== KORRIGIERT: Berechne die Zelle aus der Mitte =====
    const gx = Math.floor((v.x) / CONFIG.CELL_SIZE);
    const gy = Math.floor((v.y) / CONFIG.CELL_SIZE);
    return isWater(gx, gy);
}


function moveVillagerInline(v, targetX, targetY, dt) {
    const dx = targetX - v.x;
    const dy = targetY - v.y;
    const distance = Math.hypot(dx, dy);
    
    if (distance < 1) {
        v.x = targetX;
        v.y = targetY;
        return true;
    }
    
    const step = Math.min(distance, v.speed * dt);
    v.x += (dx / distance) * step;
    v.y += (dy / distance) * step;
    return false;
}

    // ===== 12. STEIN-LIEFERUNGEN =====
    const towersNeedingStone = buildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = getCachedFreeVillagers('player');

    const totalFree = freeForStone.length;
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && resources.stone > 0 && totalFree > 0) {
        const currentlyDelivering = cachedPlayerVillagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, resources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || resources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                
                const towerX = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const towerY = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const searchRange = Math.max(CONFIG.CELL_SIZE * 10, 300);
                
                const nearestVillagers = findNearestVillagersWithFallback(
                    towerX, towerY, searchRange, canSend, 'player'
                );
                
                for (let closestVillager of nearestVillagers) {
                    if (resources.stone <= 0) break;
                    if (closestVillager.hasTask || closestVillager.isDeliveringStone) continue;
                    if (!closestVillager.alive) continue;
                    
                    tower.reservedStone += 1;
                    resources.stone -= 1;
                    const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE);
                    if (lager) {
                        closestVillager.towerTarget = tower;
                        closestVillager.state = 'movingToLagerForStone';
                        closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.hasTask = true;
                        closestVillager.isDeliveringStone = true;
                        closestVillager.stoneToDeliver = 1;
                        closestVillager.hasReservedStone = true;
                        closestVillager.carrying = 'stone';
                    } else {
                        resources.stone += 1;
                        tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                    }
                }
            }
        }
    }

    // ===== 13. FREIE VILLAGER FÜR RESSOURCEN =====
    const freeForTasksAfterStone = cachedPlayerFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const readyNodesWithFields = cachedPlayerResourceNodes.filter(node => 
        !node.claimedBy && 
        node.ready &&
        node.fields && 
        node.fields.length > 0
    );

    const allReadyNodes = readyNodesWithFields;

    // ===== 14. RESSOURCEN-ZUWEISUNG =====
    if (allReadyNodes.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            const buildRadius = getBuildRadius('player');
            let nodesInRadius = allReadyNodes.filter(node => {
                const nodeWorldX = node.x;
                const nodeWorldY = node.y;
                return isWithinBuildRadius(nodeWorldX, nodeWorldY, 'player');
            });

            if (nodesInRadius.length === 0) {
                nodesInRadius = allReadyNodes;
            }

            let sortedNodes = nodesInRadius;
            if (grainPriority) {
                sortedNodes = [...nodesInRadius].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...nodesInRadius].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            }

            for (let node of sortedNodes) {
                if (node.claimedBy) continue;
                
                const hasUnharvestedFields = node.fields.some(f => !f.harvested);
                if (!hasUnharvestedFields) {
                    node.ready = false;
                    node.timer = 0;
                    node.claimedBy = null;
                    for (let f of node.fields) {
                        f.harvested = false;
                        f.harvestTimer = 0;
                        f.isBeingHarvested = false;
                    }
                    continue;
                }

                const nextField = node.fields.find(f => !f.harvested);
                if (!nextField) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - nextField.x * CONFIG.CELL_SIZE, v.y - nextField.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'harvestingField';
                    closestVillager.isHarvesting = true;
                    closestVillager.harvestBuildingId = node.buildingId;
                    closestVillager.harvestFieldIndex = node.fields.indexOf(nextField);
                    closestVillager.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                    
                    nextField.isBeingHarvested = true;
                }
            }
        }
    }

    // ===== 15. HAUPT-VILLAGER-LOOP =====
    const villagersToUpdate = cachedVillagers.slice();

    for (let v of villagersToUpdate) {
        const home = buildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        // ---- 15a. ATTACK CHECK ----
        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // ---- 15b. CAPTURE MOVEMENT ----
        if (v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            if (!SPLIT_SCREEN) {
                targetBuilding = npcBuildings.find(b => b.id === v.captureTargetId);
                if (!targetBuilding) {
                    targetGrenze = npcGrenzen.find(g => g.id === v.captureTargetId);
                }
            }
            if (!targetBuilding && SPLIT_SCREEN) {
                targetBuilding = player2Buildings.find(b => b.id === v.captureTargetId);
                if (!targetBuilding) {
                    targetGrenze = player2Grenzen.find(g => g.id === v.captureTargetId);
                }
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            
            // ===== BEWEGUNG NUR WENN KEIN WASM =====
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
            continue;
        }

        // ---- 15c. ATTACK MOVEMENT ----
        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
            continue;
        }

        // ---- 15d. HARVESTING ----
        if (v.state === 'harvestingField' && v.isHarvesting) {
            let node = resourceNodes.find(n => n.buildingId === v.harvestBuildingId);
            
            if (!node || !node.fields || node.fields.length === 0) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            if (!node.ready) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                v.resourceTarget = null;
                node.claimedBy = null;
                continue;
            }
            
            const fieldIndex = v.harvestFieldIndex;
            if (fieldIndex === undefined || fieldIndex >= node.fields.length) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            const field = node.fields[fieldIndex];
            const targetX = field.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const targetY = field.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            v.targetX = targetX;
            v.targetY = targetY;
            
            if (!wasmMovementDone) {
                moveVillagerInline(v, targetX, targetY, dt);
            }
            
            if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                field.harvestTimer += dt;
                
                if (field.harvestTimer >= 0.25) {
                    field.harvested = true;
                    field.isBeingHarvested = false;
                    field.harvestTimer = 0;
                    createHarvestEffect(targetX, targetY, 1);
                    
                    if (!v.harvestedCount) v.harvestedCount = 0;
                    v.harvestedCount += 1;
                    
                    const allHarvested = node.fields.every(f => f.harvested);
                    
                    if (allHarvested) {
                        v.carrying = node.type;
                        v.carryingCount = v.harvestedCount;
                        v.isHarvesting = false;
                        v.state = 'returningHome';
                        v.hasTask = true;
                        v.resourceTarget = null;
                        v.harvestedCount = 0;
                        
                        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player');
                        if (lager) {
                            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const homeBuilding = buildings.find(b => b.id === v.homeId);
                            if (homeBuilding) {
                                v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                v.state = 'idle';
                                v.hasTask = false;
                                v.carrying = null;
                                v.carryingCount = 0;
                                continue;
                            }
                        }
                        
                        node.ready = false;
                        node.timer = 0;
                        node.claimedBy = null;
                        for (let f of node.fields) {
                            f.harvested = false;
                            f.harvestTimer = 0;
                            f.isBeingHarvested = false;
                        }
                        
                        continue;
                    } else {
                        const nextField = node.fields.find(f => !f.harvested);
                        if (nextField) {
                            nextField.isBeingHarvested = true;
                            nextField.harvestTimer = 0;
                            v.harvestFieldIndex = node.fields.indexOf(nextField);
                            v.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                        } else {
                            v.carrying = node.type;
                            v.carryingCount = v.harvestedCount;
                            v.isHarvesting = false;
                            v.state = 'returningHome';
                            v.hasTask = true;
                            v.resourceTarget = null;
                            v.harvestedCount = 0;
                            
                            let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player');
                            if (lager) {
                                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                const homeBuilding = buildings.find(b => b.id === v.homeId);
                                if (homeBuilding) {
                                    v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                    v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                } else {
                                    v.state = 'idle';
                                    v.hasTask = false;
                                    v.carrying = null;
                                    v.carryingCount = 0;
                                    continue;
                                }
                            }
                            
                            node.ready = false;
                            node.timer = 0;
                            node.claimedBy = null;
                            for (let f of node.fields) {
                                f.harvested = false;
                                f.harvestTimer = 0;
                                f.isBeingHarvested = false;
                            }
                            
                            continue;
                        }
                    }
                }
            }
            continue;
        }

        // ---- 15e. BUILDING ----
        if (v.isBuilding && v.buildingTarget) {
            const building = buildings.find(b => b.id === v.buildingTarget);
            const grenze = grenzen.find(g => g.id === v.buildingTarget);
            
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                continue;
            } else if (grenze && grenze.isUnderConstruction) {
                const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        // ---- 15f. ATTACKING ----
        if (v.isAttacking) continue;

        // ---- 15g. STONE DELIVERY ----
        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                if (lager) {
                    const targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetX = targetX;
                    v.targetY = targetY;
                    if (!wasmMovementDone) {
                        moveVillagerInline(v, targetX, targetY, dt);
                    }
                    
                    if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && buildings.includes(v.towerTarget) && 
                            !v.towerTarget.isUnderConstruction && 
                            v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            resources.stone += toDeliver;
                            if (v.towerTarget) {
                                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                            }
                            v.state = 'idle';
                            v.hasTask = false;
                            v.isDeliveringStone = false;
                            v.towerTarget = null;
                            v.stoneToDeliver = 0;
                            v.hasReservedStone = false;
                            v.carrying = null;
                        }
                    }
                } else {
                    resources.stone += (v.stoneToDeliver || 0);
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                
                if (!tower || !buildings.includes(tower) || 
                    tower.isUnderConstruction || 
                    tower.stoneAmmo >= tower.maxStoneAmmo) {
                    resources.stone += (v.stoneToDeliver || 0);
                    if (tower) {
                        tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    continue;
                }
                
                const targetX = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                
                if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            resources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                }
                continue;
            }
        }

        // ---- 15h. RETURNING HOME ----
        if (v.state === 'returningHome' && v.carrying) {
            const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player');
            if (lager) {
                const targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                
                if (Math.abs(v.x - targetX) < 5 && Math.abs(v.y - targetY) < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') resources.grain += count;
                    else if (v.carrying === 'wood') resources.wood += count;
                    else if (v.carrying === 'stone') resources.stone += count;
                    else if (v.carrying === 'fish') resources.fish = (resources.fish || 0) + count;
                    
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                    
                    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                    v.targetX = homePos.x;
                    v.targetY = homePos.y;
                    
                    continue;
                }
            } else {
                const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                  y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                v.targetX = homePos.x;
                v.targetY = homePos.y;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, homePos.x, homePos.y, dt);
                }
                
                if (Math.abs(v.x - homePos.x) < 5 && Math.abs(v.y - homePos.y) < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') resources.grain += count;
                    else if (v.carrying === 'wood') resources.wood += count;
                    else if (v.carrying === 'stone') resources.stone += count;
                    else if (v.carrying === 'fish') resources.fish = (resources.fish || 0) + count;
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                }
                continue;
            }
            continue;
        }

        // ---- 15i. CARRYING CHECK ----
        if (v.carrying !== null && !v.isDeliveringStone && v.state !== 'returningHome') {
            v.state = 'returningHome';
            const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, 
                                          v.resourceTarget ? v.resourceTarget.y : home.gridY);
            if (lager) {
                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            } else {
                v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            }
            v.resourceTarget = null;
        }

        // ---- 15j. MOVING TO RESOURCE ----
        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedPlayerResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        // ---- 15k. IDLE MOVEMENT ----
        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                             y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { 
                v.targetX = homePos.x;
                v.targetY = homePos.y; 
            }
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
        }

        // ---- 15l. MOVEMENT EXECUTION ----
        if (v.state === 'movingToResource' || v.state === 'returningHome' || 
            v.state === 'idle' || v.state === 'movingToLagerForStone') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY);
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
        }
    }

    // ===== 16. CACHE BEREINIGEN - NUR BEI ECHTEN ÄNDERUNGEN =====
    const currentFreeCount = villagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;
    
    if (currentFreeCount !== cachedPlayerFreeVillagers.length) {
        cachedFreeVillagersDirty = true;
    }
    
    if (villagers.length !== cachedPlayerVillagers.length) {
        cacheNeedsRefresh = true;
        villagerGridDirtyPlayer = true;
    }
}

//  Exakte Kopie von Modul 12a, aber mit player2-Variablen

let player2CacheVersion = 0;
let cachedPlayer2FreeCount = -1;


function refreshPlayer2VillagerCache() {
    const aliveVillagers = player2Villagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    if (cachedPlayer2AliveIds.size === aliveCount && cachedPlayer2FreeCount === freeCount && cacheNeedsRefreshP2 === false) {
        return;
    }

    try {
        cachedPlayer2Villagers = aliveVillagers;
        cachedPlayer2AliveIds = aliveIds;
        cachedPlayer2FreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedPlayer2FreeCount = cachedPlayer2FreeVillagers.length;
        cacheNeedsRefreshP2 = false;
    } catch(e) {
        cachedPlayer2Villagers = [];
        cachedPlayer2FreeVillagers = [];
        cachedPlayer2AliveIds = new Set();
        cachedPlayer2FreeCount = 0;
    }
}

function refreshPlayer2ResourceCache() {
    try {
        cachedPlayer2ResourceNodes = player2ResourceNodes.slice();
        cachedPlayer2AvailableNodes = cachedPlayer2ResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedPlayer2ResourceNodes = [];
        cachedPlayer2AvailableNodes = [];
    }
}


function markPlayer2CacheDirty() {
    cacheNeedsRefreshP2 = true;
    villagerGridDirtyPlayer2 = true;
    combatGridDirtyPlayer2 = true;
    cachedFreeVillagersP2Dirty = true; // NEU
}

//  MODUL 12.5b: EINWOHNER-KI (Spieler 2) - ANKUNFT & BEWEGUNG
//  Exakte Kopie von Modul 12b, aber mit player2-Variablen
// =========================================================================

function getNeededBuildersSpieler2() {
  let needed = 0;
  for (let b of player2Buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleArrivalPlayer2(v, home) {
    if (v.state === 'movingToResource' && v.resourceTarget) {
        const node = cachedPlayer2ResourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.ready && node.claimedBy === v.id) {
            // Ressource abholen
            if (node.type === 'grain') player2Resources.grain += 1;
            else if (node.type === 'wood') player2Resources.wood += 1;
            else if (node.type === 'stone') player2Resources.stone += 1;

            // NODE ZURÜCKSETZEN, NICHT LÖSCHEN!
            const originalNode = player2ResourceNodes.find(r => r.id === node.id);
            if (originalNode) {
                originalNode.timer = 0;
                originalNode.ready = false;
                originalNode.claimedBy = null;
            }
            
            v.carrying = node.type;
            v.deliveryTarget = null;
            refreshPlayer2ResourceCache();
            markDirty('villagers');
        } else {
            v.state = 'idle';
            v.resourceTarget = null;
            v.hasTask = false;
            if (node && node.claimedBy === v.id) {
                node.claimedBy = null;
            }
            return;
        }
        v.resourceTarget = null;
        v.state = 'returningHome';

        refreshLagerCache();

        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');

        if (!lager) {
            for (let b of player2Buildings) {
                if (b.type === 'lager') {
                    lager = b;
                    break;
                }
            }
        }

        if (lager) {
            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        } else {
            v.alive = false;
            v.carrying = null;
            v.state = 'idle';
            v.hasTask = false;
            showTemporaryMessage('💀 KEIN LAGER FÜR SPIELER 2!', '#ff0000');
            gameOver = true;
            document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
            document.getElementById('gameOverSub').textContent = 'Spieler 2 hat kein Lager - Spieler 1 gewinnt!';
            document.getElementById('gameOverOverlay').style.display = 'flex';
            return;
        }
    } else if (v.state === 'returningHome' && v.carrying) {
        v.carrying = null;
        v.state = 'idle';
        v.resourceTarget = null;
        v.hasTask = false;
        v.deliveryTarget = null;
        const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                          y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
        v.targetX = homePos.x;
        v.targetY = homePos.y;
    }
}
