<!DOCTYPE html>
<html lang="de">
<head>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Siedlungsspiel - Mit Grenzkontrolle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: #1a2a1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #2d3e2b;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border-radius: 40px;
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            z-index: 20;
            justify-content: space-evenly;
            width: min(90vw, 600px);
        }
        .tool-btn {
            width: 55px;
            height: 55px;
            min-width: 0;
            flex: 1 1 0;
            max-width: 66px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: #2c3a2a;
            color: white;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        @media (max-width: 380px) {
            .tool-btn {
                width: auto;
                height: 50px;
                font-size: 18px;
                max-width: 58px;
            }
            .toolbar {
                padding: 6px 6px;
                gap: 4px;
                width: 95vw;
            }
        }
        .tool-btn.active {
            border: 3px solid #ffd966;
            box-shadow: 0 0 22px #f0b323;
            transform: scale(1.1);
            background: #3d5035;
        }
        .tool-btn.haus {
            background: #c0392b;
        }
        .tool-btn.lager {
            background: #2980b9;
        }
        .tool-btn.bauer {
            background: #27ae60;
        }
        .tool-btn.holzfaeller {
            background: #6b4c3b;
        }
        .tool-btn.steinmetz {
            background: #5d6d7e;
        }
        .tool-btn.wachturm {
            background: #7d6608;
        }
        /* ===== NEU: GRENZKONTROLLE ===== */
        .tool-btn.grenze {
            background: #9b59b6;
        }
        .tool-btn.grenze.player2 {
            background: #d7bde2;
            color: #2c3e50;
        }
        .tool-btn.grenze.npc {
            background: #4a235a;
        }
        .tool-btn.deselect {
            background: #2c3e50;
            font-size: 20px;
        }
        .tool-btn.upgrade-btn {
            background: #8e44ad;
            font-size: 16px;
        }
        .tool-btn.upgrade-btn.active {
            border-color: #ff66ff;
            box-shadow: 0 0 22px #ff66ff;
        }
        .tool-btn.destroy-btn {
            background: #e74c3c;
            font-size: 16px;
        }
        .tool-btn.destroy-btn.active {
            border-color: #ff0000;
            box-shadow: 0 0 22px #ff0000;
        }
        .cost-badge {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: #222;
            color: #ffd966;
            font-size: 6px;
            padding: 2px 4px;
            border-radius: 8px;
            white-space: nowrap;
            font-weight: normal;
        }

        /* ===== STATS ===== */
        .stats {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #eee;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 20;
            display: flex;
            flex-direction: row;
            gap: 6px;
            border: 1px solid #555;
            align-items: center;
            white-space: nowrap;
        }
        .stats span {
            font-weight: bold;
            color: #ffd966;
        }

        /* ===== DIALOGE ===== */
        .confirm-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 20px;
            border-radius: 20px;
            z-index: 30;
            text-align: center;
            display: none;
            border: 2px solid #ffd966;
            min-width: 200px;
        }
        .confirm-dialog button {
            background: #ffd966;
            color: black;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .confirm-dialog button.cancel {
            background: #c0392b;
            color: white;
        }
        .confirm-dialog .cost-display {
            color: #ffd966;
            font-size: 14px;
            margin: 8px 0;
        }
        .confirm-dialog .effect-display {
            color: #66ff66;
            font-size: 13px;
            margin: 4px 0;
        }

        /* ===== GAME OVER ===== */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .game-over-overlay h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .game-over-overlay .sub {
            font-size: 24px;
            opacity: 0.8;
        }
        .game-over-overlay .restart-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            background: #ffd966;
            color: black;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .game-over-overlay .restart-btn:hover {
            transform: scale(1.1);
        }

        /* ===== START-DIALOG ===== */
        .difficulty-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 24px;
            border-radius: 20px;
            z-index: 50;
            text-align: center;
            border: 2px solid #ffd966;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .difficulty-dialog h2 {
            font-size: 22px;
            margin: 0;
        }
        .difficulty-dialog select,
        .difficulty-dialog input {
            padding: 8px;
            border-radius: 10px;
            background: #2c3a2a;
            color: white;
            border: 1px solid #ffd966;
            font-size: 14px;
            width: 100%;
        }
        .difficulty-dialog label {
            font-size: 14px;
            color: #ccc;
        }
        .difficulty-dialog button {
            background: #ffd966;
            color: black;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- ===== START-DIALOG ===== -->
    <div class="difficulty-dialog" id="difficultyDialog">
        <h2>⚙️ Spielstart</h2>
        <div style="display:flex; flex-direction:column; gap:8px; text-align:left;">
            <label>Spielmodus</label>
            <select id="modeSelect">
                <option value="single">🧑‍🌾 Einzelspieler (vs NPC)</option>
                <option value="split">👥 2 Spieler (Split-Screen)</option>
                <option value="network">🌐 Netzwerk (Host/Client)</option>
            </select>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; text-align:left;">
            <label>Kartengröße</label>
            <select id="mapSizeSelect">
                <option value="1">🟩 Normal (80x80)</option>
                <option value="2">🟧 Groß (160x160)</option>
            </select>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; text-align:left;">
            <label>Schwierigkeit (nur Einzelspieler)</label>
            <select id="difficultySelect">
                <option value="easy">🟢 Einfach</option>
                <option value="hard">🔴 Schwer</option>

        </div>

            <label>Start-Ressourcen</label>
            <div style="display:flex; gap:8px;">
                <div style="flex:1;">
                    <span style="font-size:12px; color:#aaa;">🌾 Getreide</span>
                    <input id="startGrain" type="number" value="10" min="0" max="999">
                </div>
                <div style="flex:1;">
                    <span style="font-size:12px; color:#aaa;">🪵 Holz</span>
                    <input id="startWood" type="number" value="10" min="0" max="999">
                </div>
                <div style="flex:1;">
                    <span style="font-size:12px; color:#aaa;">🪨 Stein</span>
                    <input id="startStone" type="number" value="0" min="0" max="999">
                </div>
            </div>
        </div>
        <button id="startGameBtn">🎮 Spiel starten</button>
    </div>

    <!-- ===== CANVAS ===== -->
    <canvas id="gameCanvas"></canvas>

    <!-- ===== GAME OVER ===== -->
    <div class="game-over-overlay" id="gameOverOverlay">
        <h1 id="gameOverTitle">🎉 SIEG!</h1>
        <div class="sub" id="gameOverSub">Du hast alle NPC-Gebäude erobert!</div>
        <button class="restart-btn" id="restartBtn">🔄 Neues Spiel</button>
        <button class="restart-btn" id="continueBtn" style="background:#2ecc71; margin-top:10px;">▶️ Weiterspielen</button>
    </div>

    <!-- ===== CONFIRM DIALOG ===== -->
    <div class="confirm-dialog" id="confirmDialog">
        <div id="confirmText" style="font-size:18px; margin-bottom:8px;">Aktion bestätigen</div>
        <div class="cost-display" id="costDisplay"></div>
        <div class="effect-display" id="effectDisplay"></div>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:16px;">
            <button id="confirmYes">✅ Ja</button>
            <button id="confirmNo" class="cancel">❌ Nein</button>
        </div>
    </div>

    <!-- ===== STATS: Spieler 1 ===== -->
    <div class="stats" id="statsDisplay" style="top:8px; left:8px; right:8px; width:auto; background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; border:none; padding:4px 8px;">
        <span style="color:#ffd966;">👤</span>
        <span>🌾<b id="grainCount">0</b></span>
        <span>🪵<b id="woodCount">0</b></span>
        <span>🪨<b id="stoneCount">0</b></span>
        <span>👥<b id="popCount">0</b></span>
        <span>🧑‍🌾<b id="freeCount">0</b></span>
        <span>🟣<b id="grenzeCount">0</b></span>
    </div>

    <!-- ===== STATS: NPC ===== -->
    <div class="stats" id="npcStatsDisplay" style="top:40px; left:8px; right:8px; width:auto; background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; border:none; padding:4px 8px;">
        <span style="color:#9b59b6;">🤖</span>
        <span>🌾<b id="npcGrainCount">0</b></span>
        <span>🪵<b id="npcWoodCount">0</b></span>
        <span>🪨<b id="npcStoneCount">0</b></span>
        <span>👥<b id="npcPopCount">0</b></span>
        <span>🏠<b id="npcBuildingCount">0</b></span>
    </div>

    <!-- ===== STATS: Split-Screen Spieler 1 ===== -->
    <div class="stats" id="statsSplitPlayer" style="top:8px; left:8px; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#eee; padding:4px 10px; border-radius:16px; font-size:12px; z-index:20; border:1px solid rgba(255,255,255,0.1);">
        <span style="color:#4fc3f7;">👤</span>
        <span>🌾<b id="grainSplitPlayer">0</b></span>
        <span>🪵<b id="woodSplitPlayer">0</b></span>
        <span>🪨<b id="stoneSplitPlayer">0</b></span>
        <span>👥<b id="popSplitPlayer">0</b></span>
        <span>🧑‍🌾<b id="freeSplitPlayer">0</b></span>
        <span>🟣<b id="grenzeSplitPlayer">0</b></span>
    </div>

    <!-- ===== STATS: Split-Screen Spieler 2 ===== -->
    <div class="stats" id="statsSplitPlayer2" style="bottom:64px; top:auto; left:8px; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#eee; padding:4px 10px; border-radius:16px; font-size:12px; z-index:20; border:1px solid rgba(255,255,255,0.1);">
        <span style="color:#ff8a65;">👤2</span>
        <span>🌾<b id="grainSplitPlayer2">0</b></span>
        <span>🪵<b id="woodSplitPlayer2">0</b></span>
        <span>🪨<b id="stoneSplitPlayer2">0</b></span>
        <span>👥<b id="popSplitPlayer2">0</b></span>
        <span>🧑‍🌾<b id="freeSplitPlayer2">0</b></span>
        <span>🟣<b id="grenzeSplitPlayer2">0</b></span>
    </div>

    <!-- ===== TOOLBAR: Einzelmodus (unten) ===== -->
    <div class="toolbar" id="toolbarRow1" style="bottom:76px;">
        <button class="tool-btn haus" data-type="haus"><span>🏠</span><span class="cost-badge">3🪵</span></button>
        <button class="tool-btn lager" data-type="lager"><span>📦</span><span class="cost-badge">10🪵10🪨</span></button>
        <button class="tool-btn bauer" data-type="bauer"><span>🌾</span><span class="cost-badge">5🪵</span></button>
        <button class="tool-btn holzfaeller" data-type="holzfaeller"><span>🪓</span><span class="cost-badge">2👥</span></button>
        <!-- NEU: Grenzkontrolle -->
        <button class="tool-btn grenze" data-type="grenze"><span>🟣</span><span class="cost-badge">6👥</span></button>
    </div>
    <div class="toolbar" id="toolbarRow2" style="bottom:16px;">
        <button class="tool-btn steinmetz" data-type="steinmetz"><span>⛏️</span><span class="cost-badge">2👥5🪵</span></button>
        <button class="tool-btn wachturm" data-type="wachturm"><span>🏹</span><span class="cost-badge">15🪵</span></button>
        <button class="tool-btn deselect" id="deselectBtn">✖</button>
        <button class="tool-btn upgrade-btn" id="upgradeBtn">⬆️</button>
        <button class="tool-btn destroy-btn" id="destroyBtn">💀</button>
    </div>

    <!-- ===== TOOLBAR: Split-Screen Spieler 1 (oben) ===== -->
    <div class="toolbar" id="toolbarSplitPlayer" style="top:56px; bottom:auto; display:none; position:absolute; left:50%; transform:translateX(-50%); background:transparent; border-radius:30px; padding:4px 6px; gap:4px; z-index:20; justify-content:center; width:min(85vw, 480px);">
        <button class="tool-btn haus" data-type="haus" data-player="player"><span>🏠</span><span class="cost-badge">3🪵</span></button>
        <button class="tool-btn lager" data-type="lager" data-player="player"><span>📦</span><span class="cost-badge">10🪵10🪨</span></button>
        <button class="tool-btn bauer" data-type="bauer" data-player="player"><span>🌾</span><span class="cost-badge">5🪵</span></button>
        <button class="tool-btn holzfaeller" data-type="holzfaeller" data-player="player"><span>🪓</span><span class="cost-badge">2👥</span></button>
        <button class="tool-btn steinmetz" data-type="steinmetz" data-player="player"><span>⛏️</span><span class="cost-badge">2👥5🪵</span></button>
        <button class="tool-btn wachturm" data-type="wachturm" data-player="player"><span>🏹</span><span class="cost-badge">15🪵</span></button>
        <!-- NEU: Grenzkontrolle (Spieler 1) -->
        <button class="tool-btn grenze" data-type="grenze" data-player="player"><span>🟣</span><span class="cost-badge">6👥</span></button>
    </div>

    <!-- ===== TOOLBAR: Split-Screen Spieler 2 (unten) ===== -->
    <div class="toolbar" id="toolbarSplitPlayer2" style="bottom:16px; display:none; position:absolute; left:50%; transform:translateX(-50%); background:transparent; border-radius:30px; padding:4px 6px; gap:4px; z-index:20; justify-content:center; width:min(85vw, 480px);">
        <button class="tool-btn haus" data-type="haus" data-player="player2"><span>🏠</span><span class="cost-badge">3🪵</span></button>
        <button class="tool-btn lager" data-type="lager" data-player="player2"><span>📦</span><span class="cost-badge">10🪵10🪨</span></button>
        <button class="tool-btn bauer" data-type="bauer" data-player="player2"><span>🌾</span><span class="cost-badge">5🪵</span></button>
        <button class="tool-btn holzfaeller" data-type="holzfaeller" data-player="player2"><span>🪓</span><span class="cost-badge">2👥</span></button>
        <button class="tool-btn steinmetz" data-type="steinmetz" data-player="player2"><span>⛏️</span><span class="cost-badge">2👥5🪵</span></button>
        <button class="tool-btn wachturm" data-type="wachturm" data-player="player2"><span>🏹</span><span class="cost-badge">15🪵</span></button>
        <!-- NEU: Grenzkontrolle (Spieler 2 - Helllila) -->
        <button class="tool-btn grenze player2" data-type="grenze" data-player="player2"><span>🟣</span><span class="cost-badge">6👥</span></button>
    </div>

    <!-- ===== SPLIT-EXTRA BUTTONS ===== -->
    <div id="splitExtra" style="display:none;">
        <button class="tool-btn deselect" id="deselectBtnSplit" style="position:absolute; top:116px; right:8px; z-index:21; width:36px; height:36px; font-size:16px; border-radius:18px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2); color:white;">✖</button>
        <button class="tool-btn upgrade-btn" id="upgradeBtnSplit" style="position:absolute; top:156px; right:8px; z-index:21; width:36px; height:36px; font-size:14px; border-radius:18px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2); color:white;">⬆️</button>
        <button class="tool-btn destroy-btn" id="destroyBtnSplit" style="position:absolute; top:196px; right:8px; z-index:21; width:36px; height:36px; font-size:14px; border-radius:18px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2); color:white;">💀</button>
        <button class="tool-btn deselect" id="deselectBtnSplit2" style="position:absolute; bottom:76px; right:8px; z-index:21; width:36px; height:36px; font-size:16px; border-radius:18px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2); color:white;">✖</button>
        <button class="tool-btn upgrade-btn" id="upgradeBtnSplit2" style="position:absolute; bottom:116px; right:8px; z-index:21; width:36px; height:36px; font-size:14px; border-radius:18px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2); color:white;">⬆️</button>
        <button class="tool-btn destroy-btn" id="destroyBtnSplit2" style="position:absolute; bottom:156px; right:8px; z-index:21; width:36px; height:36px; font-size:14px; border-radius:18px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2); color:white;">💀</button>
    </div>

    <!-- ===== TOGGLE BUTTON ===== -->
    <button id="toggleToolbarBtn" style="position:absolute; bottom:130px; right:10px; z-index:21; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; width:30px; height:30px; font-size:16px;">▲</button>

    <!-- ===== SPLIT-GLOBALE BUTTONS ===== -->
    <div id="splitGlobalControls" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); z-index:25; display:none; gap:8px; background:transparent; padding:4px 8px; border-radius:0; border:none; box-shadow:none;">
        <button id="splitRangeBtn" style="background:transparent; color:rgba(255,255,255,0.7); border:none; border-radius:4px; padding:2px 6px; font-size:14px; cursor:pointer; transition:all 0.2s; line-height:1;">🎯</button>
        <button id="splitSpeedBtn" style="background:transparent; color:rgba(255,255,255,0.7); border:none; border-radius:4px; padding:2px 6px; font-size:14px; cursor:pointer; transition:all 0.2s; line-height:1;">⏱️</button>
        <button id="splitMainMenuBtn" style="background:transparent; color:rgba(255,255,255,0.4); border:none; border-radius:4px; padding:2px 6px; font-size:12px; cursor:pointer; transition:all 0.2s; line-height:1; border-left:1px solid rgba(255,255,255,0.15);">✕</button>
    </div>

</div>


<script>
// =========================================================================
//  MODUL 1: KONFIGURATION & KONSTANTEN – KOMPLETT MIT NEUEN WERTEN
// =========================================================================

// NPC Hausbau - Getreidebilanz und Cooldown
// ===== NPC HAUSBAU - GETREIDEBILANZ UND COOLDOWN =====
let npcGrainStart = 0;
let npcGrainBalance = 0;
let npcGrainCheckTimer = 0;
let npcLastHouseBuildTime = 0;
const NPC_HOUSE_COOLDOWN = 15; // VORHER: 30 (REDUZIERT)

// ===== NPC GRENZ-COOLDOWN =====
let npcGrenzeCooldown = 0;
let npcGrenzeCooldownMax = 20; // VORHER: 90 (REDUZIERT)

// ===== NPC GRENZSTATUS-VARIABLEN (NUR NOCH IDLE) =====
let npcGrenzeCheckTimer = 0;

function loadVillagerImages() {

function drawVillager(ctx, v, playerId, x, y, cellSize) {
    if (!v.alive) return;
    
    let color = 'rot';
    if (playerId === 'player2' || v.isNPC) color = 'blau';
    
    let type = 'idle';
    
    if (v.isAttacking || v.state === 'attacking' || v.state === 'movingToCapture') {
        type = 'krieger';
    } else if (v.isBuilding || v.state === 'building') {
        type = 'baumeister';
    } else if (v.state === 'deliveringStoneToTower') {
        // ===== NUR STEINTRÄGER WENN ER WIRKLICH STEIN TRÄGT =====
        if (v.carrying === 'stone') {
            type = 'steintraeger';
        } else {
            type = 'idle';
        }
    } else if (v.state === 'movingToLagerForStone') {
        // ===== AUF DEM WEG ZUM LAGER → KEIN STEIN → IDLE =====
        type = 'idle';
    } else if (v.state === 'harvestingField' || v.state === 'returningHome') {
        if (v.carrying === 'grain' || (v.resourceTarget && v.resourceTarget.type === 'grain')) {
            type = 'bauer';
        } else if (v.carrying === 'wood' || (v.resourceTarget && v.resourceTarget.type === 'wood')) {
            type = 'holzfaeller';
        } else if (v.carrying === 'stone' || (v.resourceTarget && v.resourceTarget.type === 'stone')) {
            type = 'steinmetz';
        }
    } else if (v.state === 'movingToResource') {
        type = 'idle';
    }
    
    const key = `${type}-${color}`;
    const img = villagerImages[key];
    
    const size = cellSize * 0.7;
    const offset = (cellSize - size) / 2;
    const yOffset = 3;
    
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x + offset, y + offset + yOffset, size, size);
    } else {
        let fallbackColor = color === 'rot' ? '#c0392b' : '#2980b9';
        ctx.beginPath();
        ctx.arc(x + cellSize/2, y + cellSize/2 + yOffset, 4, 0, Math.PI * 2);
        ctx.fillStyle = fallbackColor;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }
}

let terrainMap = [];

function generateTerrain() {
  terrainMap = [];
  for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
    const row = [];
    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
      const val = Math.random();
      let terrainType;
      if (val < 0.50) terrainType = 0;
      else if (val < 0.75) terrainType = 1;
      else terrainType = 2;
      if (x > 0 && y > 0) {
        const left = row[x-1];
        const up = terrainMap[y-1] ? terrainMap[y-1][x] : -1;
        if (left !== -1 && up !== -1 && left === up && Math.random() < 0.7) {
          terrainType = left;
        }
      }
      row.push(terrainType);
    }
    terrainMap.push(row);
  }
  let counts = [0,0,0];
  for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
      counts[terrainMap[y][x]]++;
    }
  }
  const total = CONFIG.GRID_WIDTH * CONFIG.GRID_HEIGHT;
  if (Math.abs(counts[0]/total - 0.50) > 0.10 ||
      Math.abs(counts[1]/total - 0.25) > 0.10 ||
      Math.abs(counts[2]/total - 0.25) > 0.10) {
    generateTerrain();
  }
}

function getTerrainType(gx, gy) {
  if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
    return terrainMap[gy][gx];
  }
  return -1;
}

function getTerrainColor(type) {
  switch(type) {
    case 0: return '#c9b87a';
    case 1: return '#7a9a5a';
    case 2: return '#9aa8b5';
    default: return '#4a6b3a';
  }
}

function getTerrainEmoji(type) {
  switch(type) {
    case 0: return '🌾';
    case 1: return '🌲';
    case 2: return '🪨';
    default: return '';
  }
}

function isResourceFieldAvailable(gx, gy, type) {
  const terrain = getTerrainType(gx, gy);
  if (terrain === -1) return false;
  if (type === 'grain' && terrain === 0) return true;
  if (type === 'wood' && terrain === 1) return true;
  if (type === 'stone' && terrain === 2) return true;
  return false;
}

function countResourcesAround(gx, gy, type) {
  let count = 0;
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (isResourceFieldAvailable(nx, ny, type)) count++;
    }
  }
  return count;
}

// ===== 3. PRÜFT OB EIN GEBÄUDE INNERHALB EINER GRENZE STEHT =====
function isBuildingInsideGrenze(building) {
    let allGrenzen = [];
    
    if (building.isNPC) {
        allGrenzen = npcGrenzen;
    } else if (building.playerId === 'player2') {
        allGrenzen = player2Grenzen;
    } else {
        allGrenzen = grenzen;
    }
    
    for (let g of allGrenzen) {
        if (!g.isActive) continue;
        const dist = Math.hypot(building.gridX - g.gridX, building.gridY - g.gridY);
        if (dist <= g.radius) {
            return true;
        }
    }
    return false;
}

// ===== 4. PRÜFT ALLE GEBÄUDE AUF BRAND =====
function checkBuildingsForFire() {
    const allBuildings = [];
    
    // Spieler 1 Gebäude (auch Baustellen!)
    for (let b of buildings) {
        allBuildings.push({
            building: b,
            playerId: 'player',
            isNPC: false,
            isGrenze: false,
            id: b.id,
            gridX: b.gridX,
            gridY: b.gridY,
            isUnderConstruction: b.isUnderConstruction
        });
    }
    
    // Spieler 2 Gebäude (auch Baustellen!)
    for (let b of player2Buildings) {
        allBuildings.push({
            building: b,
            playerId: 'player2',
            isNPC: false,
            isGrenze: false,
            id: b.id,
            gridX: b.gridX,
            gridY: b.gridY,
            isUnderConstruction: b.isUnderConstruction
        });
    }
    
    // NPC Gebäude (auch Baustellen!)
    for (let b of npcBuildings) {
        allBuildings.push({
            building: b,
            playerId: null,
            isNPC: true,
            isGrenze: false,
            id: b.id,
            gridX: b.gridX,
            gridY: b.gridY,
            isUnderConstruction: b.isUnderConstruction
        });
    }
    
    // Jedes Gebäude prüfen (auch Baustellen!)
    for (let entry of allBuildings) {
        const building = entry.building;
        const key = `fire_${entry.playerId || 'npc'}_${entry.id}`;
        
        // ===== BAUSTELLEN WERDEN JETZT AUCH GEPRÜFT! =====
        // (KEIN continue mehr bei isUnderConstruction)
        
        // Ist das Gebäude innerhalb einer Grenze?
        const insideGrenze = isBuildingInsideGrenze(building);
        
        if (!insideGrenze) {
            // Gebäude ist AUßERHALB der Grenze -> Brand starten
            if (!burningBuildings[key]) {
                burningBuildings[key] = new BuildingFire(entry.id, entry.playerId);
                burningBuildings[key].isNPC = entry.isNPC;
                burningBuildings[key].isGrenze = entry.isGrenze;
                burningBuildings[key].isUnderConstruction = entry.isUnderConstruction;
                
                const typeName = entry.isUnderConstruction ? 'Baustelle' : building.type;
                showTemporaryMessage(`🔥 ${typeName} brennt!`, '#ff6b6b', true);
                SoundFX.playIfVisible(
                    building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                    building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                    'destroy'
                );
            }
        } else {
            // Gebäude ist INNERHALB der Grenze -> Brand löschen
            if (burningBuildings[key]) {
                delete burningBuildings[key];
            }
        }
    }
    
    // Auch Grenzkontrollen prüfen
    checkGrenzenForFire();
}

// ===== 5. PRÜFT GRENZKONTROLLEN AUF BRAND =====
function checkGrenzenForFire() {
    const allGrenzen = [];
    
    // Spieler 1 Grenzen
    for (let g of grenzen) {
        allGrenzen.push({
            grenze: g,
            playerId: 'player',
            isNPC: false,
            id: g.id,
            gridX: g.gridX,
            gridY: g.gridY
        });
    }
    
    // Spieler 2 Grenzen
    for (let g of player2Grenzen) {
        allGrenzen.push({
            grenze: g,
            playerId: 'player2',
            isNPC: false,
            id: g.id,
            gridX: g.gridX,
            gridY: g.gridY
        });
    }
    
    // NPC Grenzen
    for (let g of npcGrenzen) {
        allGrenzen.push({
            grenze: g,
            playerId: null,
            isNPC: true,
            id: g.id,
            gridX: g.gridX,
            gridY: g.gridY
        });
    }
    
    for (let entry of allGrenzen) {
        const grenze = entry.grenze;
        const key = `fire_grenze_${entry.playerId || 'npc'}_${entry.id}`;
        
        if (grenze.isUnderConstruction) continue;
        
        // Prüfe ob Grenze innerhalb einer anderen Grenze steht
        let insideOtherGrenze = false;
        let allGrenzenList = [];
        
        if (entry.playerId === 'player') {
            allGrenzenList = grenzen.filter(g => g.id !== grenze.id);
        } else if (entry.playerId === 'player2') {
            allGrenzenList = player2Grenzen.filter(g => g.id !== grenze.id);
        } else {
            allGrenzenList = npcGrenzen.filter(g => g.id !== grenze.id);
        }
        
        for (let g of allGrenzenList) {
            if (!g.isActive) continue;
            const dist = Math.hypot(grenze.gridX - g.gridX, grenze.gridY - g.gridY);
            if (dist <= g.radius) {
                insideOtherGrenze = true;
                break;
            }
        }
        
        if (!insideOtherGrenze) {
            // Grenze ist außerhalb -> Brand starten
            if (!burningBuildings[key]) {
                burningBuildings[key] = new BuildingFire(entry.id, entry.playerId);
                burningBuildings[key].isNPC = entry.isNPC;
                burningBuildings[key].isGrenze = true;
                showTemporaryMessage(`🔥 Grenzkontrolle brennt!`, '#ff6b6b', true);
                SoundFX.playIfVisible(
                    grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                    grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                    'destroy'
                );
            }
        } else {
            if (burningBuildings[key]) {
                delete burningBuildings[key];
            }
        }
    }
}

// ===== 6. BRAND AKTUALISIEREN =====
function updateBurningBuildings(dt) {
    const keysToRemove = [];
    
    for (let key in burningBuildings) {
        const fire = burningBuildings[key];
        fire.burnTimer += dt;
        
        // Partikel aktualisieren
        for (let p of fire.particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 10 * dt;
            p.life -= dt;
            if (p.life <= 0) {
                p.x = (Math.random() - 0.5) * 20;
                p.y = (Math.random() - 0.5) * 20;
                p.vx = (Math.random() - 0.5) * 20;
                p.vy = -10 - Math.random() * 30;
                p.life = 0.5 + Math.random() * 0.5;
                p.maxLife = p.life;
                p.size = 2 + Math.random() * 4;
            }
        }
        
        // Nach 10 Sekunden Gebäude zerstören
        if (fire.burnTimer >= fire.maxBurnTime) {
            keysToRemove.push(key);
            
            // Gebäude zerstören
            if (fire.isGrenze) {
                // Grenze zerstören (wie gehabt)
                const parts = key.split('_');
                const playerId = parts[1];
                const grenzeId = parseInt(parts[2]);
                
                if (playerId === 'player') {
                    const idx = grenzen.findIndex(g => g.id === grenzeId);
                    if (idx !== -1) {
                        const g = grenzen[idx];
                        // Baumeister freigeben
                        if (g.builder) {
                            const builder = villagers.find(v => v.id === g.builder);
                            if (builder) {
                                builder.isBuilding = false;
                                builder.buildingTarget = null;
                                builder.state = 'idle';
                                builder.hasTask = false;
                            }
                        }
                        grenzen.splice(idx, 1);
                        showTemporaryMessage('💀 Grenzkontrolle abgebrannt!', '#ff6b6b', true);
                    }
                } else if (playerId === 'player2') {
                    const idx = player2Grenzen.findIndex(g => g.id === grenzeId);
                    if (idx !== -1) {
                        const g = player2Grenzen[idx];
                        if (g.builder) {
                            const builder = player2Villagers.find(v => v.id === g.builder);
                            if (builder) {
                                builder.isBuilding = false;
                                builder.buildingTarget = null;
                                builder.state = 'idle';
                                builder.hasTask = false;
                            }
                        }
                        player2Grenzen.splice(idx, 1);
                        showTemporaryMessage('💀 Grenzkontrolle (P2) abgebrannt!', '#ff6b6b', true);
                    }
                } else {
                    const idx = npcGrenzen.findIndex(g => g.id === grenzeId);
                    if (idx !== -1) {
                        const g = npcGrenzen[idx];
                        if (g.builder) {
                            const builder = npcVillagers.find(v => v.id === g.builder);
                            if (builder) {
                                builder.isBuilding = false;
                                builder.buildingTarget = null;
                                builder.state = 'idle';
                                builder.hasTask = false;
                            }
                        }
                        npcGrenzen.splice(idx, 1);
                        showTemporaryMessage('💀 NPC Grenzkontrolle abgebrannt!', '#ff6b6b', true);
                    }
                }
            } else {
                // Normales Gebäude oder Baustelle zerstören
                const parts = key.split('_');
                const playerId = parts[1];
                const buildingId = parseInt(parts[2]);
                
                if (playerId === 'player') {
                    const idx = buildings.findIndex(b => b.id === buildingId);
                    if (idx !== -1) {
                        const b = buildings[idx];
                        // Capture-Timer löschen
                        const captureKey = 'capture_' + b.id;
                        if (captureTimers[captureKey]) delete captureTimers[captureKey];
                        
                        // ===== BAUSTELLE ODER FERTIGES GEBÄUDE? =====
                        if (b.isUnderConstruction) {
                            // Baustelle - Baumeister freigeben
                            if (b.builder) {
                                const builder = villagers.find(v => v.id === b.builder);
                                if (builder) {
                                    builder.isBuilding = false;
                                    builder.buildingTarget = null;
                                    builder.state = 'idle';
                                    builder.hasTask = false;
                                }
                            }
                            // Aus dem Array entfernen
                            const idx2 = buildings.indexOf(b);
                            if (idx2 !== -1) buildings.splice(idx2, 1);
                            // Construction Site bereinigen
                            if (constructionSites[b.id]) delete constructionSites[b.id];
                            showTemporaryMessage('💀 Baustelle abgebrannt!', '#ff6b6b', true);
                        } else {
                            destroyBuilding(b.gridX, b.gridY);
                            showTemporaryMessage('💀 Gebäude abgebrannt!', '#ff6b6b', true);
                        }
                    }
                } else if (playerId === 'player2') {
                    const idx = player2Buildings.findIndex(b => b.id === buildingId);
                    if (idx !== -1) {
                        const b = player2Buildings[idx];
                        const captureKey = 'capture_p2_' + b.id;
                        if (captureTimers[captureKey]) delete captureTimers[captureKey];
                        
                        if (b.isUnderConstruction) {
                            if (b.builder) {
                                const builder = player2Villagers.find(v => v.id === b.builder);
                                if (builder) {
                                    builder.isBuilding = false;
                                    builder.buildingTarget = null;
                                    builder.state = 'idle';
                                    builder.hasTask = false;
                                }
                            }
                            const idx2 = player2Buildings.indexOf(b);
                            if (idx2 !== -1) player2Buildings.splice(idx2, 1);
                            if (constructionSites[b.id]) delete constructionSites[b.id];
                            showTemporaryMessage('💀 Baustelle (P2) abgebrannt!', '#ff6b6b', true);
                        } else {
                            destroyBuildingPlayer2(b.gridX, b.gridY);
                            showTemporaryMessage('💀 Gebäude (P2) abgebrannt!', '#ff6b6b', true);
                        }
                    }
                } else {
                    const idx = npcBuildings.findIndex(b => b.id === buildingId);
                    if (idx !== -1) {
                        const b = npcBuildings[idx];
                        const captureKey = 'capture_' + b.id;
                        if (captureTimers[captureKey]) delete captureTimers[captureKey];
                        
                        if (b.isUnderConstruction) {
                            if (b.builder) {
                                const builder = npcVillagers.find(v => v.id === b.builder);
                                if (builder) {
                                    builder.isBuilding = false;
                                    builder.buildingTarget = null;
                                    builder.state = 'idle';
                                    builder.hasTask = false;
                                }
                            }
                            const idx2 = npcBuildings.indexOf(b);
                            if (idx2 !== -1) npcBuildings.splice(idx2, 1);
                            if (constructionSites[b.id]) delete constructionSites[b.id];
                            showTemporaryMessage('💀 NPC Baustelle abgebrannt!', '#ff6b6b', true);
                        } else {
                            npcDestroyBuilding(b.gridX, b.gridY);
                            showTemporaryMessage('💀 NPC Gebäude abgebrannt!', '#ff6b6b', true);
                        }
                    }
                }
            }
            
            markDirty();
        }
    }
    
    // Abgebrannte Gebäude aus der Liste entfernen
    for (let key of keysToRemove) {
        delete burningBuildings[key];
    }
}

// ===== 7. BRAND ZEICHNEN (SICHER) =====
function drawBurningBuilding(ctx, fire, x, y, cellSize, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    const centerX = x + cellSize / 2;
    const centerY = y + cellSize / 2;
    
    if (centerX < viewLeftPx || centerX > viewRightPx || centerY < viewTopPx || centerY > viewBottomPx) return;
    if (!fire || !fire.particles) return;
    
    // Flammen zeichnen (Flamme SVG)
    const flameImg = document.getElementById('flameImg');
    if (flameImg && flameImg.complete && flameImg.naturalWidth > 0) {
        const scale = 0.8 + Math.sin(performance.now() / 1000 * 3 + fire.burnTimer) * 0.2;
        const size = Math.max(1, cellSize * 0.6 * scale);
        ctx.save();
        ctx.translate(centerX, centerY - cellSize * 0.2);
        ctx.drawImage(flameImg, -size/2, -size/2, size, size);
        ctx.restore();
    } else {
        // Fallback: Flammen-Emoji
        ctx.font = `${Math.max(10, cellSize * 0.6)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔥', centerX, centerY - cellSize * 0.2);
    }
    
    // Rauchpartikel zeichnen (Pixelqualm)
    const alpha = Math.min(1, Math.max(0, fire.burnTimer / fire.maxBurnTime));
    for (let p of fire.particles) {
        if (!p) continue;
        
        // Sicherstellen dass lifeRatio zwischen 0 und 1 ist
        const lifeRatio = Math.max(0, Math.min(1, p.life / p.maxLife));
        
        // Radius berechnen - NIE negativ!
        const sizeMultiplier = 1 + (1 - lifeRatio) * 2;
        const size = Math.max(0.5, (p.size || 2) * sizeMultiplier);
        
        const px = centerX + (p.x || 0) + (Math.random() - 0.5) * 2;
        const py = centerY + (p.y || 0) - cellSize * 0.3 + (1 - lifeRatio) * 30;
        
        // Alpha niemals negativ
        const particleAlpha = Math.max(0, lifeRatio * 0.4 * alpha);
        if (particleAlpha > 0.01) {
            ctx.globalAlpha = particleAlpha;
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(px, py, Math.max(0.1, size), 0, Math.PI * 2);
            ctx.fill();
            
            // Heller Rauch
            const lightAlpha = Math.max(0, lifeRatio * 0.2 * alpha);
            if (lightAlpha > 0.01) {
                ctx.fillStyle = '#ccc';
                ctx.globalAlpha = lightAlpha;
                ctx.beginPath();
                ctx.arc(px - 2, py - 3, Math.max(0.1, size * 0.7), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
    
    ctx.globalAlpha = 1;
}

function loadFlameImage() {
    const img = new Image();
    img.id = 'flameImg';
    img.src = 'images/flame.svg';

    const existing = document.getElementById('flameImg');
    if (existing) {
        existing.parentNode.removeChild(existing);
    }
    document.body.appendChild(img);
}

// Prüft ob eine Position innerhalb des Bau-Radius liegt
function isWithinBuildRadius(gx, gy, playerId = 'player') {
  let allGrenzen = [];
  
  if (playerId === 'player') {
    allGrenzen = grenzen;
  } else if (playerId === 'player2') {
    allGrenzen = player2Grenzen;
  } else if (playerId === null) { // NPC
    allGrenzen = npcGrenzen;
  }
  
  // Wenn keine Grenzkontrolle existiert, ist Bauen erlaubt
  if (allGrenzen.length === 0) {
    // Bei NPC: Wenn keine Grenze, nur in der Nähe des ersten Gebäudes bauen
    if (playerId === null) {
      const firstBuilding = npcBuildings[0];
      if (firstBuilding) {
        const dist = Math.hypot(gx - firstBuilding.gridX, gy - firstBuilding.gridY);
        return dist <= 10; // Notfall-Radius
      }
    }
    return true;
  }
  
  // Prüfe ob Position innerhalb mindestens einer Grenzkontrolle liegt
  for (let g of allGrenzen) {
    if (!g.isActive) continue;
    const dist = Math.hypot(gx - g.gridX, gy - g.gridY);
    if (dist <= g.radius) {
      return true;
    }
  }
  return false;
}

// ===== SETTLEMENT CENTER FÜR ALLE SPIELER =====
function getSettlementCenter(playerId = 'player') {
  let allGrenzen = [];
  let buildingsList = [];
  
  if (playerId === 'player') {
    allGrenzen = grenzen;
    buildingsList = buildings;
  } else if (playerId === 'player2') {
    allGrenzen = player2Grenzen;
    buildingsList = player2Buildings;
  } else if (playerId === null) {
    // NPC
    allGrenzen = npcGrenzen;
    buildingsList = npcBuildings;
  }
  
  // Wenn Grenzkontrollen existieren, deren Durchschnitt nehmen
  if (allGrenzen.length > 0) {
    let sumX = 0, sumY = 0;
    let activeCount = 0;
    for (let g of allGrenzen) {
      if (!g.isActive) continue;
      sumX += g.gridX;
      sumY += g.gridY;
      activeCount++;
    }
    if (activeCount > 0) {
      return { x: sumX / activeCount, y: sumY / activeCount };
    }
  }
  
  // Fallback: erstes Lager oder Haus
  const firstBuilding = buildingsList.find(b => b.type === 'lager' || b.type === 'haus');
  if (firstBuilding) {
    return { x: firstBuilding.gridX, y: firstBuilding.gridY };
  }
  
  // Letzter Fallback: Kartenmitte
  return { x: CONFIG.GRID_WIDTH / 2, y: CONFIG.GRID_HEIGHT / 2 };
}

function assignBuilderToGrenzePlayer2(grenzeId) {
    const grenze = player2Grenzen.find(g => g.id === grenzeId);
    if (!grenze) return false;
    if (!grenze.isUnderConstruction) return false;
    if (grenze.builder) return true;
    
    const freeVillagers = player2Villagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        grenze.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = grenze.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    grenze.builder = builder.id;
    grenze.waitingForBuilder = false;
    constructionSites[`grenze_player2_${grenze.id}`] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: false,
        isGrenze: true,
        playerId: 'player2'
    };
    markDirty();
    return true;
}


function destroyGrenzePlayer2(gx, gy) {
    const idx = player2Grenzen.findIndex(g => g.gridX === gx && g.gridY === gy);
    if (idx === -1) return false;
    
    const grenze = player2Grenzen[idx];
    if (grenze.builder) {
        const builder = player2Villagers.find(v => v.id === grenze.builder);
        if (builder) {
            builder.isBuilding = false;
            builder.buildingTarget = null;
            builder.state = 'idle';
            builder.hasTask = false;
        }
    }
    player2Grenzen.splice(idx, 1);
    markDirty();
    return true;
}

function upgradeGrenzePlayer2(grenze) {
    const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
    if (player2Resources.wood < cost.wood || player2Resources.stone < cost.stone) {
        showTemporaryMessage('❌ Nicht genug Ressourcen für Upgrade!', '#ff6b6b');
        return false;
    }
    player2Resources.wood -= cost.wood;
    player2Resources.stone -= cost.stone;
    
    grenze.level += 1;
    grenze.radius = effect.radius || (CONFIG.GRENZE_RADIUS + (grenze.level - 1) * 5);
    
    showTemporaryMessage(`⬆️ Grenzkontrolle (P2) Radius: ${grenze.radius} Zellen (Stufe ${grenze.level})`, '#d7bde2', true);
    markDirty();
    return true;
}


function getBuildRadius(playerId = 'player') {
  let allGrenzen = [];
  let maxRadius = 0;
  
  if (playerId === 'player') {
    allGrenzen = grenzen;
  } else if (playerId === 'player2') {
    allGrenzen = player2Grenzen;
  } else if (playerId === null) {
    allGrenzen = npcGrenzen;
  }
  
  for (let g of allGrenzen) {
    if (!g.isActive) continue;
    if (g.radius > maxRadius) maxRadius = g.radius;
  }
  
  return maxRadius;
}

// ===== GET OUTER GRENZE MIT GLÄTTUNG (KORREKT) =====
function getOuterGrenze(grenzenList) {
    if (!grenzenList || grenzenList.length === 0) return null;
    
    // ===== 1. ALLE ZELLEN SAMMELN =====
    const covered = new Set();
    
    for (let g of grenzenList) {
        if (!g.isActive) continue;
        const radius = Math.floor(g.radius);
        
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                const dist = Math.hypot(dx, dy);
                if (dist > g.radius) continue;
                
                const gx = g.gridX + dx;
                const gy = g.gridY + dy;
                if (gx < 0 || gx >= CONFIG.GRID_WIDTH || gy < 0 || gy >= CONFIG.GRID_HEIGHT) continue;
                
                covered.add(`${gx},${gy}`);
            }
        }
    }
    
    if (covered.size === 0) return null;
    
    // ===== 2. RANDZELLEN FINDEN =====
    const borderPoints = [];
    const neighbors = [
        { dx: 1, dy: 0 },
        { dx: -1, dy: 0 },
        { dx: 0, dy: 1 },
        { dx: 0, dy: -1 }
    ];
    
    for (let key of covered) {
        const [gx, gy] = key.split(',').map(Number);
        
        let hasOutsideNeighbor = false;
        for (let n of neighbors) {
            const nx = gx + n.dx;
            const ny = gy + n.dy;
            if (!covered.has(`${nx},${ny}`)) {
                hasOutsideNeighbor = true;
                break;
            }
        }
        
        if (hasOutsideNeighbor) {
            const wx = gx * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const wy = gy * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            borderPoints.push({ x: wx, y: wy });
        }
    }
    
    if (borderPoints.length < 4) return null;
    
    // ===== 3. PUNKTE NACH WINKEL SORTIEREN =====
    let sumX = 0, sumY = 0;
    for (let p of borderPoints) {
        sumX += p.x;
        sumY += p.y;
    }
    const cx = sumX / borderPoints.length;
    const cy = sumY / borderPoints.length;
    
    borderPoints.sort((a, b) => {
        const angleA = Math.atan2(a.y - cy, a.x - cx);
        const angleB = Math.atan2(b.y - cy, b.x - cx);
        return angleA - angleB;
    });
    
    // ===== 4. PUNKTE REDUZIEREN (zu nah beieinander) =====
    const minDist = CONFIG.CELL_SIZE * 0.15;
    const filtered = [];
    for (let p of borderPoints) {
        let tooClose = false;
        for (let f of filtered) {
            if (Math.hypot(p.x - f.x, p.y - f.y) < minDist) {
                tooClose = true;
                break;
            }
        }
        if (!tooClose) filtered.push(p);
    }
    
    if (filtered.length < 4) return null;
    
    // ===== 5. GLÄTTUNG (NUR VISUELL, WERTE BLEIBEN KORREKT) =====
    const smoothedPoints = smoothPoints(filtered, 1);
    
    return {
        type: 'path',
        points: smoothedPoints,
        // Original-Punkte für Debug/Logik falls benötigt
        _original: filtered
    };
}

// ===== GLÄTTUNGS-FUNKTION (NUR VISUELL) =====
function smoothPoints(points, iterations = 1) {
    if (points.length < 4) return points;
    
    let result = points.map(p => ({ x: p.x, y: p.y }));
    
    for (let iter = 0; iter < iterations; iter++) {
        const newPoints = [];
        const n = result.length;
        
        for (let i = 0; i < n; i++) {
            const prev = result[(i - 1 + n) % n];
            const curr = result[i];
            const next = result[(i + 1) % n];
            const next2 = result[(i + 2) % n];
            
            // Catmull-Rom ähnliche Glättung (sanft)
            const smoothX = 0.125 * prev.x + 0.375 * curr.x + 0.375 * next.x + 0.125 * next2.x;
            const smoothY = 0.125 * prev.y + 0.375 * curr.y + 0.375 * next.y + 0.125 * next2.y;
            
            newPoints.push({ x: smoothX, y: smoothY });
        }
        result = newPoints;
    }
    
    return result;
}

function transferGrenze(grenze, fromPlayer, toPlayer) {
    // 1. Aus altem Array entfernen
    if (fromPlayer === 'player') {
        const idx = grenzen.indexOf(grenze);
        if (idx !== -1) grenzen.splice(idx, 1);
    } else if (fromPlayer === 'player2') {
        const idx = player2Grenzen.indexOf(grenze);
        if (idx !== -1) player2Grenzen.splice(idx, 1);
    } else if (fromPlayer === 'npc') {
        const idx = npcGrenzen.indexOf(grenze);
        if (idx !== -1) npcGrenzen.splice(idx, 1);
    }
    
    // 2. Besitzer aktualisieren
    grenze.playerId = toPlayer === 'npc' ? null : toPlayer;
    grenze.isNPC = (toPlayer === 'npc');
    grenze.beingCaptured = false;
    grenze.captureProgress = 0;
    grenze.capturedBy = null;
    
    // 3. In neues Array einfügen
    if (toPlayer === 'player') {
        grenzen.push(grenze);
    } else if (toPlayer === 'player2') {
        player2Grenzen.push(grenze);
    } else if (toPlayer === 'npc') {
        npcGrenzen.push(grenze);
    }
    
    // 4. Bauarbeiter zurücksetzen falls vorhanden
    if (grenze.builder) {
        let builder = null;
        if (fromPlayer === 'player') {
            builder = villagers.find(v => v.id === grenze.builder);
        } else if (fromPlayer === 'player2') {
            builder = player2Villagers.find(v => v.id === grenze.builder);
        } else if (fromPlayer === 'npc') {
            builder = npcVillagers.find(v => v.id === grenze.builder);
        }
        if (builder) {
            builder.isBuilding = false;
            builder.buildingTarget = null;
            builder.state = 'idle';
            builder.hasTask = false;
        }
        grenze.builder = null;
        grenze.waitingForBuilder = false;
    }
    
    // 5. Construction Site bereinigen
    const siteKey = `grenze_${grenze.id}`;
    if (constructionSites[siteKey]) {
        delete constructionSites[siteKey];
    }
    const siteKeyNpc = `grenze_npc_${grenze.id}`;
    if (constructionSites[siteKeyNpc]) {
        delete constructionSites[siteKeyNpc];
    }
    
    markDirty();
    return true;
}

// ===== PRÜFUNGEN AUF BELEGTE ZELLEN =====
function isCellOccupied(gx, gy, ignoreId = null, playerId = null) {
  const allBuildings = [];
  if (playerId === null || playerId === 'player') {
    allBuildings.push(...buildings);
    allBuildings.push(...grenzen);
  }
  if (playerId === null || playerId === 'player2') {
    allBuildings.push(...player2Buildings);
    allBuildings.push(...player2Grenzen);
  }
  if (playerId === null) {
    allBuildings.push(...npcBuildings);
    allBuildings.push(...npcGrenzen);
  }
  return allBuildings.some(b => b.gridX === gx && b.gridY === gy && b.id !== ignoreId);
}

function isFieldClaimedByResourceNode(gx, gy) {
  for (let node of resourceNodes) { if (node.x === gx && node.y === gy) return true; }
  for (let node of player2ResourceNodes) { if (node.x === gx && node.y === gy) return true; }
  for (let node of npcResourceNodes) { if (node.x === gx && node.y === gy) return true; }
  return false;
}

// ===== NACHBARZELLEN FÜR PRODUKTIONSGEBÄUDE =====
function getNeighborCells(gx, gy, range = 1) {
  const cells = [];
  for (let dx = -range; dx <= range; dx++) {
    for (let dy = -range; dy <= range; dy++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (nx >= 0 && nx < CONFIG.GRID_WIDTH && ny >= 0 && ny < CONFIG.GRID_HEIGHT) {
        cells.push({ x: nx, y: ny });
      }
    }
  }
  return cells;
}

// ===== FELDFUNKTIONEN =====
function getBauerFields(bauer) {
  return getNeighborCells(bauer.gridX, bauer.gridY, 1)
    .filter(c => !isCellOccupied(c.x, c.y, bauer.id, bauer.playerId) && isResourceFieldAvailable(c.x, c.y, 'grain'));
}

function canAfford(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return true;
  const free = getFreeVillagers();
  switch(type) {
    case 'haus': return resources.wood >= 3;
    case 'lager': return resources.wood >= 10 && resources.stone >= 10;
    case 'bauer': return resources.wood >= 5;
    case 'holzfaeller': return free >= 2;
    case 'steinmetz': return resources.wood >= 5 && free >= 2;
    case 'wachturm': return resources.wood >= 15;
    case 'grenze': return free >= CONFIG.GRENZE_COST_VILLAGERS;
    default: return true;
  }
}

function deductCost(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return;
  switch(type) {
    case 'haus': resources.wood -= 3; break;
    case 'lager': resources.wood -= 10; resources.stone -= 10; break;
    case 'bauer': resources.wood -= 5; break;
    case 'holzfaeller': break;
    case 'steinmetz': resources.wood -= 5; break;
    case 'wachturm': resources.wood -= 15; break;
    case 'grenze': break; // Kosten sind Einwohner, werden separat abgezogen
  }
  let einwohnerKosten = 0;
  if (type === 'holzfaeller') einwohnerKosten = 2;
  else if (type === 'steinmetz') einwohnerKosten = 2;
  else if (type === 'grenze') einwohnerKosten = CONFIG.GRENZE_COST_VILLAGERS;
  if (einwohnerKosten > 0) removeFreeVillagers(einwohnerKosten);
  markDirty();
}

function removeFreeVillagers(count) {
  let removed = 0;
  for (let v of villagers) {
    if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
      v.alive = false;
      const home = buildings.find(b => b.id === v.homeId);
      if (home && home.residents > 0) home.residents -= 1;
      removed++;
    }
  }
  villagers = villagers.filter(v => v.alive);
  markDirty();
}

// ===== BAUMEISTER ZUWEISEN (SPIELER 1) =====
function assignBuilderToConstruction(buildingId) {
    const building = buildings.find(b => b.id === buildingId);
    if (!building) return false;
    if (!building.isUnderConstruction) return false;
    if (building.builder) return true;
    
    const freeVillagers = villagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        building.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = building.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    building.builder = builder.id;
    building.waitingForBuilder = false;
    constructionSites[building.id] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: false,
        isGrenze: false
    };
    markDirty();
    return true;
}
