function handleNpcArrival(v, home) {
  if (v.state === 'movingToResource' && v.resourceTarget) {
    const node = npcResourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.ready && node.claimedBy === v.id) {
      if (node.type === 'grain') npcResources.grain += 1;
      else if (node.type === 'wood') npcResources.wood += 1;
      else if (node.type === 'stone') npcResources.stone += 1;
      const idx = npcResourceNodes.indexOf(node);
      if (idx !== -1) { npcResourceNodes.splice(idx, 1); }
      v.carrying = node.type; v.deliveryTarget = null;
    }
    v.resourceTarget = null;
    v.state = 'returningHome';
    const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
    if (lager) {
      v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
      v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
      v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    }
  } else if (v.state === 'returningHome' && v.carrying) {
    v.carrying = null; v.state = 'idle'; v.resourceTarget = null; v.hasTask = false; v.deliveryTarget = null;
    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
    v.targetX = homePos.x; v.targetY = homePos.y;
  }
}

// Berechnet, wie viele freie NPC-Einwohner für wartende Baustellen benötigt werden
function getNeededBuildersNPC() {
  let needed = 0;
  for (let b of npcBuildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      let req = 1;
      if (b.type === 'holzfaeller') req = 2;
      else if (b.type === 'steinmetz') req = 2;
      needed += req + 1;
    }
  }
  return needed;
}

    }
    
    if (v.carrying !== null && !v.isDeliveringStone) {
      if (v.state !== 'returningHome') { v.state = 'returningHome'; const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY, true); if (lager) { v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' }; v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; } else { v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; } v.resourceTarget = null; }
      const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy); if (distance < 3) { v.x = v.targetX; v.y = v.targetY; if (v.state === 'returningHome') handleNpcArrival(v, home); } else if (distance > 0) { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
      return;
    }
    
    const availableNodes = getAvailableNpcResourceNodes();
    if (availableNodes.length > 0) {
      const freeForResource = freeForTasks.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
      if (freeForResource.length > 0) {
        let assignedVillagers = [];
        for (let node of availableNodes) {
          if (node.claimedBy) continue;
          let closestVillager = null, closestDist = Infinity;
          for (let v of freeForResource) {
            if (assignedVillagers.includes(v)) continue;
            const d = Math.hypot(v.x - node.x * CONFIG.CELL_SIZE, v.y - node.y * CONFIG.CELL_SIZE);
            if (d < closestDist) { closestDist = d; closestVillager = v; }
          }
          if (closestVillager) {
            assignedVillagers.push(closestVillager);
            node.claimedBy = closestVillager.id;
            closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
            closestVillager.state = 'movingToResource';
            closestVillager.targetX = node.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            closestVillager.targetY = node.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            closestVillager.hasTask = true; closestVillager.deliveryTarget = null; closestVillager.isDeliveringStone = false;
          }
        }
      }
    }
    
    // === NPC STEIN-LIEFERAUFTRÄGE (BEDARFSGERECHT) – NUR mit freeForTasks ===
    const npcDeliveringStone = npcVillagers.filter(v => v.isDeliveringStone && v.alive && !v.isAttacking);
    const npcTowersNeedingStone = npcBuildings.filter(b => b.type === 'wachturm' && b.stoneAmmo < b.maxStoneAmmo);
    let npcFreeForStone = freeForTasks.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
    
    if (npcTowersNeedingStone.length > 0 && npcResources.stone > 0 && npcFreeForStone.length > 0) {
      for (let tower of npcTowersNeedingStone) {
        if (npcResources.stone <= 0) break;
        
        const alreadyOnTheWay = npcVillagers.filter(v => v.isDeliveringStone && v.towerTarget === tower && v.alive && !v.isAttacking).length;
        const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
        const toSend = Math.min(needed, Math.max(0, needed - alreadyOnTheWay + 2));
        
        if (toSend <= 0) continue;
        
        const canSend = Math.min(toSend, npcFreeForStone.length, npcResources.stone);
        
        for (let i = 0; i < canSend; i++) {
          if (npcResources.stone <= 0) break;
          
          let closestVillager = null, closestDist = Infinity;
          for (let v of npcFreeForStone) {
            if (v.hasTask || v.isDeliveringStone) continue;
            const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
            if (d < closestDist) { closestDist = d; closestVillager = v; }
          }
          
          if (closestVillager) {
            tower.reservedStone += 1;
            npcResources.stone -= 1;
            const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE, true);
            if (lager) {
              closestVillager.state = 'movingToLagerForStone';
              closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
              closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
              closestVillager.hasTask = true; closestVillager.isDeliveringStone = true;
              closestVillager.towerTarget = tower; closestVillager.stoneToDeliver = 1;
              closestVillager.hasReservedStone = true;
              npcFreeForStone = npcFreeForStone.filter(v => v.id !== closestVillager.id);
            }
          }
        }
        break;
      }
    }
    
    if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
      const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
      if (dist(v, homePos) > 5) { v.targetX = homePos.x; v.targetY = homePos.y; }
    }
    
    if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
      if (v.state === 'idle' && v.hasTask) { const lager = findNearestLager(home.gridX, home.gridY, true); if (lager) { v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; } }
      const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy); if (distance < 3) { v.x = v.targetX; v.y = v.targetY; if (v.state === 'movingToResource' || v.state === 'returningHome') handleNpcArrival(v, home); } else if (distance > 0) { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
    }
  });
}

// =========================================================================
//  MODUL 14: FEINDE
// =========================================================================
function spawnEnemies() {
  if (enemiesHaveCleared) return;
  const totalPop = villagers.filter(v => v.alive).length;
  if (totalPop < 12) return;
  const currentEnemyCount = enemies.filter(e => e.alive).length;
  const maxEnemies = getMaxEnemies();
  const maxSpawn = Math.max(0, maxEnemies - currentEnemyCount);
  if (maxSpawn <= 0) return;
  const packSize = Math.min(maxSpawn, CONFIG.MAX_SPAWN_PER_FRAME);
  const eliteChance = totalPop >= 200 ? 0.20 : 0.10;
  for (let i = 0; i < packSize; i++) {
    let ex, ey;
    const side = Math.floor(Math.random() * 4);
    switch(side) {
      case 0: ex = Math.random() * WORLD_WIDTH; ey = 0; break;
      case 1: ex = WORLD_WIDTH; ey = Math.random() * WORLD_HEIGHT; break;
      case 2: ex = Math.random() * WORLD_WIDTH; ey = WORLD_HEIGHT; break;
      case 3: ex = 0; ey = Math.random() * WORLD_HEIGHT; break;
    }
    enemySpawnCounter++;
    const isSuper = (Math.random() < eliteChance);
    enemies.push(new Enemy(nextEnemyId++, ex, ey, isSuper));
  }
}

function updateEnemies(dt) {
  const allVillagers = [...villagers.filter(v => v.alive), ...npcVillagers.filter(v => v.alive)];
  
  if (allVillagers.length === 0 && enemies.some(e => e.alive)) {
    enemies = []; enemiesHaveCleared = true; return;
  }
  if (allVillagers.length > 0 && enemiesHaveCleared) enemiesHaveCleared = false;
  
  enemies.filter(e => e.alive).forEach(enemy => {
    if (enemy.killCount >= 2) { enemy.alive = false; return; }
    const allVillagersNow = [...villagers.filter(v => v.alive), ...npcVillagers.filter(v => v.alive)];
    if (allVillagersNow.length === 0) return;
    let closestVillager = null, closestDist = Infinity;
    for (let v of allVillagersNow) {
      const d = dist({x: enemy.x, y: enemy.y}, {x: v.x, y: v.y});
      if (d < closestDist) { closestDist = d; closestVillager = v; }
    }
    if (!closestVillager) { enemy.targetVillager = null; return; }
    enemy.targetVillager = closestVillager;
    const target = enemy.targetVillager;
    if (!target || !target.alive) { enemy.targetVillager = null; return; }
    const d = dist({x: enemy.x, y: enemy.y}, {x: target.x, y: target.y});
    if (d < 8) {
      // Ziel töten
      if (!target.isNPC) {
        killVillager(target);
      } else {
        const home = npcBuildings.find(b => b.id === target.homeId);
        if (home && home.residents > 0) home.residents -= 1;
        if (target.carrying === 'stone' || target.hasReservedStone) {
          npcResources.stone += (target.stoneToDeliver || 0);
          if (target.towerTarget) {
            target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
          }
        }
        target.alive = false;
      }
      enemy.killCount += 1;
      enemy.targetVillager = null;
    } else {
      const step = Math.min(d, enemy.speed * dt);
      enemy.x += (target.x - enemy.x) / d * step;
      enemy.y += (target.y - enemy.y) / d * step;
    }
  });
  
  enemies = enemies.filter(e => e.alive);
  villagers = villagers.filter(v => v.alive);
  npcVillagers = npcVillagers.filter(v => v.alive);
}

// =========================================================================
//  MODUL 15: TÜRME & SCHÜSSE
// =========================================================================
function updateTowers(dt) {
  buildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction && b.stoneAmmo > 0).forEach(tower => {
    tower.shootCooldown -= dt;
    if (tower.shootCooldown > 0) return;
    const tx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const ty = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    
    let targets = [...enemies.filter(e => e.alive), ...npcVillagers.filter(v => v.alive)];
    let closestTarget = null;
    let closestDist = Infinity;
    for (let target of targets) {
      const d = dist({x: tx, y: ty}, {x: target.x, y: target.y});
      if (d <= CONFIG.TOWER_RANGE * CONFIG.CELL_SIZE && d < closestDist) {
        closestDist = d;
        closestTarget = target;
      }
    }
    if (closestTarget) {
      tower.stoneAmmo -= 1;
      tower.shootCooldown = tower.baseFireRate || 1.0;
      const isNPCVillager = npcVillagers.some(v => v.id === closestTarget.id && v.alive);
      projectiles.push({
        x: tx, y: ty,
        targetX: closestTarget.x, targetY: closestTarget.y,
        speed: 300, target: closestTarget,
        isNPCVillager: isNPCVillager
      });
      if (tower.doubleShot) {
        let secondTarget = null;
        let secondDist = Infinity;
        for (let target of targets) {
          if (target === closestTarget) continue;
          const d = dist({x: tx, y: ty}, {x: target.x, y: target.y});
          if (d <= CONFIG.TOWER_RANGE * CONFIG.CELL_SIZE && d < secondDist) {
            secondDist = d;
            secondTarget = target;
          }
        }
        if (secondTarget && tower.stoneAmmo > 0) {
          tower.stoneAmmo -= 1;
          const isNPCVillager2 = npcVillagers.some(v => v.id === secondTarget.id && v.alive);
          projectiles.push({
            x: tx, y: ty,
            targetX: secondTarget.x, targetY: secondTarget.y,
            speed: 300, target: secondTarget,
            isNPCVillager: isNPCVillager2
          });
        }
      }
    }
  });
  
  npcBuildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction && b.stoneAmmo > 0).forEach(tower => {
    tower.shootCooldown -= dt;
    if (tower.shootCooldown > 0) return;
    const tx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const ty = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    
    let targets = [...enemies.filter(e => e.alive), ...villagers.filter(v => v.alive)];
    let closestTarget = null;
    let closestDist = Infinity;
    for (let target of targets) {
      const d = dist({x: tx, y: ty}, {x: target.x, y: target.y});
      if (d <= CONFIG.TOWER_RANGE * CONFIG.CELL_SIZE && d < closestDist) {
        closestDist = d;
        closestTarget = target;
      }
    }
    if (closestTarget) {
      tower.stoneAmmo -= 1;
      tower.shootCooldown = tower.baseFireRate || 1.0;
      const isPlayerVillager = villagers.some(v => v.id === closestTarget.id && v.alive);
      projectiles.push({
        x: tx, y: ty,
        targetX: closestTarget.x, targetY: closestTarget.y,
        speed: 300, target: closestTarget,
        isPlayerVillager: isPlayerVillager
      });
    }
  });
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (!p.target || !p.target.alive) { projectiles.splice(i, 1); continue; }
    p.targetX = p.target.x; p.targetY = p.target.y;
    const dx = p.targetX - p.x, dy = p.targetY - p.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 10) {
      if (p.isNPCVillager || p.isPlayerVillager) {
        if (!p.target.isNPC) {
          killVillager(p.target);
        } else {
          const home = npcBuildings.find(b => b.id === p.target.homeId);
          if (home && home.residents > 0) home.residents -= 1;
          if (p.target.carrying === 'stone' || p.target.hasReservedStone) {
            npcResources.stone += (p.target.stoneToDeliver || 0);
            if (p.target.towerTarget) {
              p.target.towerTarget.reservedStone = Math.max(0, p.target.towerTarget.reservedStone - (p.target.stoneToDeliver || 0));
            }
          }
          p.target.alive = false;
        }
        createHitEffect(p.targetX, p.targetY, false, false);
        if (p.isPlayerVillager) {
          showTemporaryMessage('🏹 Dein Einwohner wurde von NPC-Turm getroffen!', '#ff6b6b');
        }
      } else {
        p.target.hits += 1;
        if (p.target.hits >= p.target.maxHits) {
          createHitEffect(p.targetX, p.targetY, p.target.isSuper);
          p.target.alive = false;
        } else {
          createHitEffect(p.targetX, p.targetY, false, true);
        }
      }
      projectiles.splice(i, 1);
    } else {
      const step = Math.min(distance, p.speed * dt);
      p.x += (dx/distance) * step; p.y += (dy/distance) * step;
    }
  }
}

function createHitEffect(x, y, isSuper = false, isPartial = false) {
  const particles = [];
  const count = isSuper ? 60 : (isPartial ? 15 : 30 + Math.floor(Math.random() * 20));
  const colors = isSuper ? ['#ff00ff','#ff66ff','#ff99ff'] : ['#ff0000','#ff4400','#ff8800'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (isSuper ? 60 : 30) + Math.random() * (isSuper ? 100 : 80);
    particles.push({
      x: x + (Math.random()-0.5)*6, y: y + (Math.random()-0.5)*6,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.3 + Math.random()*0.4, maxLife: 0.3 + Math.random()*0.4,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  hitEffects.push({ x, y, particles, life: 0.8, maxLife: 0.8 });
}

function updateHitEffects(dt) {
  for (let i = hitEffects.length - 1; i >= 0; i--) {
    const effect = hitEffects[i];
    effect.life -= dt;
    for (let p of effect.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.98; p.vy *= 0.98;
      p.life -= dt;
    }
    if (effect.life <= 0) hitEffects.splice(i, 1);
  }
}

// =========================================================================
//  MODUL 16a: NPC-HILFSFUNKTIONEN (Terrain, Position, Platzierung)
// =========================================================================

function isActiveResourceField(gx, gy) {
  for (let node of resourceNodes) { if (node.x === gx && node.y === gy) return true; }
  for (let node of npcResourceNodes) { if (node.x === gx && node.y === gy) return true; }
  const terrainHere = getTerrainType(gx, gy);
  if (terrainHere === -1) return false;
  const allBuildings = [...buildings, ...npcBuildings];
  for (let b of allBuildings) {
    if (b.type !== 'bauer' && b.type !== 'holzfaeller' && b.type !== 'steinmetz') continue;
    const d = Math.hypot(gx - b.gridX, gy - b.gridY);
    if (d <= 1.5 && d > 0) {
      const resourceType = b.type === 'bauer' ? 'grain' : b.type === 'holzfaeller' ? 'wood' : 'stone';
      const terrainMatch = (resourceType === 'grain' && terrainHere === 0) || (resourceType === 'wood' && terrainHere === 1) || (resourceType === 'stone' && terrainHere === 2);
      if (terrainMatch) return true;
    }
  }
  return false;
}

function isPositionValidForNPC(gx, gy, type, isLager = false) {
  if (gx < 1 || gx >= CONFIG.GRID_WIDTH - 1 || gy < 1 || gy >= CONFIG.GRID_HEIGHT - 1) return false;
  if (isCellOccupied(gx, gy)) return false;
  if (isActiveResourceField(gx, gy)) return false;
  const terrainHere = getTerrainType(gx, gy);
  if (terrainHere === -1) return false;
  if (type === 'lager' || type === 'haus' || type === 'wachturm') { if (terrainHere === 1 || terrainHere === 2) return false; }
  if (type === 'bauer' && terrainHere !== 0) return false;
  if (type === 'holzfaeller' && terrainHere !== 1) return false;
  if (type === 'steinmetz' && terrainHere !== 2) return false;
  
  // Mindestanzahl passender Ressourcenfelder (3)
  if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
    const resourceType = type === 'bauer' ? 'grain' : type === 'holzfaeller' ? 'wood' : 'stone';
    if (countResourcesAround(gx, gy, resourceType) < CONFIG.NPC_MIN_RESOURCES) return false;
  }
  
  // Gleiche Ressourcengebäude: Mindestabstand 2 Bauplätze
  if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
    for (let b of npcBuildings) {
      if (b.type === type && !b.isUnderConstruction) {
        const d = Math.hypot(gx - b.gridX, gy - b.gridY);
        if (d <= 2) return false;
      }
    }
  }
  
  if (isLager) { for (let b of npcBuildings) { if (b.type === 'lager' && Math.hypot(gx - b.gridX, gy - b.gridY) < CONFIG.NPC_MIN_LAGER_DIST) return false; } }
  return true;
}

function findWarPosition(type) {
  const towers = npcBuildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction);
  if (towers.length > 0) {
    let bestPos = null, bestScore = -Infinity;
    let searchRadius = CONFIG.TOWER_RANGE;
    const maxRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);
    while (searchRadius <= maxRadius) {
      for (let tower of towers) {
        for (let attempt = 0; attempt < 50; attempt++) {
          const gx = tower.gridX - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          const gy = tower.gridY - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          if (gx < 0 || gx >= CONFIG.GRID_WIDTH || gy < 0 || gy >= CONFIG.GRID_HEIGHT) continue;
          if (!isPositionValidForNPC(gx, gy, type, false)) continue;
          const d = Math.hypot(gx - tower.gridX, gy - tower.gridY);
          let score = 50 - d;
          let nearbyTowers = 0;
          for (let t2 of towers) {
            if (Math.hypot(gx - t2.gridX, gy - t2.gridY) <= CONFIG.TOWER_RANGE) nearbyTowers++;
          }
          score += nearbyTowers * 10;
          if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
        }
      }
      if (bestPos) return bestPos;
      searchRadius += 5;
    }
  }
  return findBestNPCPosition(type, false);
}

function findStandardPosition(type, isLager) {
  let bestPos = null, bestScore = -Infinity;
  if (npcBuildings.length === 0) return null;
  const npcPositions = npcBuildings.map(b => ({ x: b.gridX, y: b.gridY }));
  const maxSearchRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);

  if (type === 'haus') {
    const resourceBuildings = npcBuildings.filter(b =>
      (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && !b.isUnderConstruction
    );
    const existingHouses = npcBuildings.filter(b => b.type === 'haus' && !b.isUnderConstruction);

    let searchRadius = CONFIG.NPC_MAX_BUILD_DIST;
    while (searchRadius <= maxSearchRadius) {
      for (let center of npcPositions) {
        for (let attempt = 0; attempt < 50; attempt++) {
          const gx = center.x - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          const gy = center.y - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          if (!isPositionValidForNPC(gx, gy, type, false)) continue;

          let score = 0;
          for (let rb of resourceBuildings) {
            const d = Math.hypot(gx - rb.gridX, gy - rb.gridY);
            if (d <= 1) {
              score += 30;
              let houseAdjacent = false;
              for (let h of existingHouses) { if (Math.hypot(rb.gridX - h.gridX, rb.gridY - h.gridY) <= 1) { houseAdjacent = true; break; } }
              if (!houseAdjacent) score += 20;
            } else if (d <= 2) { score += 15; } else if (d <= 3) { score += 5; }
          }
          for (let b of npcBuildings) { if (b.type === 'lager' && Math.hypot(gx - b.gridX, gy - b.gridY) <= 3) score += 10; }
          let minDist = Infinity; for (let b of npcBuildings) { const d = Math.hypot(gx - b.gridX, gy - b.gridY); if (d < minDist) minDist = d; }
          if (minDist <= 1) score += 15; if (minDist <= 2) score += 10;
          if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
        }
      }
      if (bestPos) return bestPos;
      searchRadius += 5;
    }
    return null;
  }

  let searchRadius = isLager ? 5 : CONFIG.NPC_MAX_BUILD_DIST;
  while (searchRadius <= maxSearchRadius) {
    for (let center of npcPositions) {
      for (let attempt = 0; attempt < 50; attempt++) {
        const gx = center.x - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        const gy = center.y - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        if (!isPositionValidForNPC(gx, gy, type, isLager)) continue;
        let minDistToNPC = Infinity, totalDist = 0, houseCount = 0;
        for (let b of npcBuildings) { const d = Math.hypot(gx - b.gridX, gy - b.gridY); if (d < minDistToNPC) minDistToNPC = d; if (b.type === 'haus' && d <= 2) houseCount++; totalDist += d; }
        const avgDist = totalDist / npcBuildings.length;
        let score = (10 - avgDist) * 10;
        if (isLager) { score += (15 - avgDist) * 5; }
        else if (type === 'wachturm') { let coveredBuildings = 0; for (let b of npcBuildings) { if (b.type === 'wachturm') continue; if (Math.hypot(gx - b.gridX, gy - b.gridY) <= CONFIG.TOWER_RANGE) coveredBuildings++; } score += coveredBuildings * 12; if (minDistToNPC <= 2) score += 15; if (minDistToNPC <= 3) score += 10; }
        else { const resourceType = type === 'bauer' ? 'grain' : type === 'holzfaeller' ? 'wood' : 'stone'; score += countResourcesAround(gx, gy, resourceType) * 20; if (minDistToNPC <= 1) score += 25; if (minDistToNPC <= 2) score += 15; if (minDistToNPC <= 3) score += 10; }
        if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
      }
    }
    if (bestPos) return bestPos;
    searchRadius += 5;
  }
  return null;
}

function findBestTowerPosition() {
  let bestPos = null;
  let bestScore = -Infinity;
  if (npcBuildings.length === 0) return null;

  const buildingsToProtect = npcBuildings.filter(b => b.type !== 'wachturm' && !b.isUnderConstruction);
  const resourceNodesToProtect = npcResourceNodes.filter(n => n.ready || n.timer > 0);

  const protectionSet = new Set();
  for (let b of buildingsToProtect) {
    for (let dx = -3; dx <= 3; dx++) {
      for (let dy = -3; dy <= 3; dy++) {
        const nx = b.gridX + dx, ny = b.gridY + dy;
        if (nx >= 0 && nx < CONFIG.GRID_WIDTH && ny >= 0 && ny < CONFIG.GRID_HEIGHT) {
          protectionSet.add(`${nx},${ny}`);
        }
      }
    }
  }
  for (let n of resourceNodesToProtect) {
    for (let dx = -3; dx <= 3; dx++) {
      for (let dy = -3; dy <= 3; dy++) {
        const nx = n.x + dx, ny = n.y + dy;
        if (nx >= 0 && nx < CONFIG.GRID_WIDTH && ny >= 0 && ny < CONFIG.GRID_HEIGHT) {
          protectionSet.add(`${nx},${ny}`);
        }
      }
    }
  }

  const allPoints = Array.from(protectionSet).map(s => {
    const [gx, gy] = s.split(',').map(Number);
    return { gx, gy };
  });

  const existingTowers = npcBuildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction);

  const coverageMap = new Map();
  for (let pt of allPoints) {
    let covered = 0;
    for (let tower of existingTowers) {
      if (Math.hypot(pt.gx - tower.gridX, pt.gy - tower.gridY) <= CONFIG.TOWER_RANGE) covered++;
    }
    coverageMap.set(`${pt.gx},${pt.gy}`, covered);
  }

  let minCoverage = Infinity;
  for (let covered of coverageMap.values()) { if (covered < minCoverage) minCoverage = covered; }
  if (minCoverage === Infinity) minCoverage = 0;

  const npcPositions = npcBuildings.map(b => ({ x: b.gridX, y: b.gridY }));
  const maxSearchRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);
  let searchRadius = CONFIG.NPC_MAX_BUILD_DIST;
  
  while (searchRadius <= maxSearchRadius) {
    for (let center of npcPositions) {
      for (let attempt = 0; attempt < 80; attempt++) {
        const gx = center.x - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        const gy = center.y - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        if (!isPositionValidForNPC(gx, gy, 'wachturm', false)) continue;

        let newCoveredMin = 0;
        for (let pt of allPoints) {
          const current = coverageMap.get(`${pt.gx},${pt.gy}`) || 0;
          if (current === minCoverage && Math.hypot(gx - pt.gx, gy - pt.gy) <= CONFIG.TOWER_RANGE) newCoveredMin++;
        }
        let totalCovered = 0;
        for (let pt of allPoints) { if (Math.hypot(gx - pt.gx, gy - pt.gy) <= CONFIG.TOWER_RANGE) totalCovered++; }

        let score = newCoveredMin * 100 + totalCovered * 10;
        let minDistToNPC = Infinity;
        for (let b of npcBuildings) { const d = Math.hypot(gx - b.gridX, gy - b.gridY); if (d < minDistToNPC) minDistToNPC = d; }
        if (minDistToNPC <= 2) score += 20;
        if (minDistToNPC <= 3) score += 10;

        if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
      }
    }
    if (bestPos) return bestPos;
    searchRadius += 5;
  }

  return null;
}

function findBestNPCPosition(type, isLager = false) {
  if (type === 'wachturm') return findBestTowerPosition();
  return findStandardPosition(type, isLager);
}

// =========================================================================
//  MODUL 16b: NPC-RESSOURCEN & KOSTEN (Abfragen, Bezahlen, Zählen)
// =========================================================================

function getNPCBuildingCounts() {
  const counts = { haus: 0, bauer: 0, holzfaeller: 0, steinmetz: 0, wachturm: 0, lager: 0 };
  for (let b of npcBuildings) { if (counts[b.type] !== undefined) counts[b.type]++; }
  return counts;
}

function npcNeedsLager() {
  const resourceBuildings = npcBuildings.filter(b => 
    (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && !b.isUnderConstruction
  );
  const allLagers = npcBuildings.filter(b => b.type === 'lager' && !b.isUnderConstruction);
  
  if (allLagers.length === 0) return true;
  
  for (let res of resourceBuildings) {
    let nearestLagerDist = Infinity;
    for (let lager of allLagers) {
      const d = Math.hypot(res.gridX - lager.gridX, res.gridY - lager.gridY);
      if (d < nearestLagerDist) nearestLagerDist = d;
    }
    if (nearestLagerDist > 25) return true;
  }
  
  return false;
}

function findLagerPosition() {
  const resourceBuildings = npcBuildings.filter(b => 
    (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && !b.isUnderConstruction
  );
  const allLagers = npcBuildings.filter(b => b.type === 'lager' && !b.isUnderConstruction);
  
  if (resourceBuildings.length === 0) return null;
  
  // Kein Lager: beim ersten Ressourcengebäude bauen
  if (allLagers.length === 0) {
    return findStandardPositionNear(resourceBuildings[0].gridX, resourceBuildings[0].gridY, 'lager', true);
  }
  
  // Das am weitesten entfernte Ressourcengebäude finden (nur wenn > 25 Raster)
  let farthestRes = null;
  let farthestDist = 0;
  for (let res of resourceBuildings) {
    let nearestDist = Infinity;
    for (let lager of allLagers) {
      const d = Math.hypot(res.gridX - lager.gridX, res.gridY - lager.gridY);
      if (d < nearestDist) nearestDist = d;
    }
    if (nearestDist > farthestDist && nearestDist > 25) {
      farthestDist = nearestDist;
      farthestRes = res;
    }
  }
  
  if (!farthestRes) return null;
  
  // Startradius = halbe Distanz zum nächsten Lager (mindestens 15)
  const startRadius = Math.max(15, Math.floor(farthestDist / 2));
  return findStandardPositionNearWithRadius(farthestRes.gridX, farthestRes.gridY, 'lager', true, startRadius);
}

function findStandardPositionNear(centerX, centerY, type, isLager) {
  return findStandardPositionNearWithRadius(centerX, centerY, type, isLager, 10);
}

function findStandardPositionNearWithRadius(centerX, centerY, type, isLager, startRadius) {
  let bestPos = null;
  let bestScore = -Infinity;
  const maxSearchRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);
  
  let searchRadius = startRadius;
  while (searchRadius <= maxSearchRadius) {
    for (let attempt = 0; attempt < 50; attempt++) {
      const gx = centerX - searchRadius + Math.floor(Math.random() * searchRadius * 2);
      const gy = centerY - searchRadius + Math.floor(Math.random() * searchRadius * 2);
      if (!isPositionValidForNPC(gx, gy, type, isLager)) continue;
      
      const d = Math.hypot(gx - centerX, gy - centerY);
      let score = 50 - d;
      let minDist = Infinity;
      for (let b of npcBuildings) {
        const bd = Math.hypot(gx - b.gridX, gy - b.gridY);
        if (bd < minDist) minDist = bd;
      }
      if (minDist <= 2) score += 20;
      if (minDist <= 4) score += 10;
      if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
    }
    if (bestPos) return bestPos;
    searchRadius += 10;
  }
  return null;
}

function npcCanAfford(type) {
  const free = getNPCFreeVillagers();
  switch(type) {
    case 'haus':       return npcResources.wood >= 3;
    case 'lager':      return npcResources.wood >= 10 && npcResources.stone >= 10;
    case 'bauer':      return npcResources.wood >= 5;
    case 'holzfaeller': return free >= 2;
    case 'steinmetz':  return npcResources.wood >= 5 && free >= 2;
    case 'wachturm':   return npcResources.wood >= 15;
    default:           return false;
  }
}

function npcCanAffordUpgrade(building) {
  const { cost } = getUpgradeCostAndEffect(building);
  return npcResources.wood >= cost.wood && npcResources.stone >= cost.stone;
}

function npcUpgradeBuilding(building) {
  const { cost, effect } = getUpgradeCostAndEffect(building);
  if (npcResources.wood < cost.wood || npcResources.stone < cost.stone) return false;
  npcResources.wood -= cost.wood; npcResources.stone -= cost.stone;
  building.level += 1;
  if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
    building.maxProductionTime = building.baseMaxProductionTime / building.level;
    const fields = building.type === 'bauer' ? getBauerFields(building) : building.type === 'holzfaeller' ? getHolzfaellerFields(building) : getSteinmetzFields(building);
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    for (let node of npcResourceNodes) { const key = node.x + ',' + node.y; if (fieldSet.has(key) && node.type === building.productionType) { const progress = node.timer / node.maxTimer; node.maxTimer = building.maxProductionTime; node.timer = progress * node.maxTimer; } }
  }
  if (building.type === 'wachturm') { if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate; if (effect.doubleShot) building.doubleShot = true; }
  else if (building.type === 'haus') { building.maxResidents = effect.residents || 8; }
  return true;
}

function npcDeductCost(type) {
  switch(type) {
    case 'haus':       npcResources.wood -= 3; break;
    case 'lager':      npcResources.wood -= 10; npcResources.stone -= 10; break;
    case 'bauer':      npcResources.wood -= 5; break;
    case 'holzfaeller': break;
    case 'steinmetz':  npcResources.wood -= 5; break;
    case 'wachturm':   npcResources.wood -= 15; break;
  }

  let einwohnerKosten = 0;
  if (type === 'holzfaeller') einwohnerKosten = 2;
  else if (type === 'steinmetz') einwohnerKosten = 2;
  if (einwohnerKosten > 0) npcRemoveFreeVillagers(einwohnerKosten);
}

function npcRemoveFreeVillagers(count) {
  let removed = 0;
  for (let v of npcVillagers) {
    if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
      v.alive = false;
      const home = npcBuildings.find(b => b.id === v.homeId);
      if (home && home.residents > 0) home.residents -= 1;
      removed++;
    }
  }
  npcVillagers = npcVillagers.filter(v => v.alive);
}

// =========================================================================
//  MODUL 16c: NPC-HAUPTLOGIK (Init, Quoten, Update, Kriegsmodus)
// =========================================================================

function initNPC() {
  if (npcStarted) return;
  if (!gameStarted) return;
  const playerLager = buildings.find(b => b.type === 'lager');
  const playerHaus = buildings.find(b => b.type === 'haus');
  if (!playerLager || !playerHaus) return;
  npcResources.grain = 10; npcResources.wood = 10; npcResources.stone = 0;
  let startX, startY; let found = false;
  for (let attempt = 0; attempt < 200; attempt++) {
    const corners = [{ x: 5 + Math.floor(Math.random() * 15), y: 5 + Math.floor(Math.random() * 15) }, { x: CONFIG.GRID_WIDTH - 5 - Math.floor(Math.random() * 15), y: 5 + Math.floor(Math.random() * 15) }, { x: 5 + Math.floor(Math.random() * 15), y: CONFIG.GRID_HEIGHT - 5 - Math.floor(Math.random() * 15) }, { x: CONFIG.GRID_WIDTH - 5 - Math.floor(Math.random() * 15), y: CONFIG.GRID_HEIGHT - 5 - Math.floor(Math.random() * 15) }];
    const corner = corners[Math.floor(Math.random() * corners.length)]; startX = corner.x; startY = corner.y;
    if (!isCellOccupied(startX, startY) && !isActiveResourceField(startX, startY) && Math.hypot(startX - playerLager.gridX, startY - playerLager.gridY) > CONFIG.NPC_START_DIST) { found = true; break; }
  }
  if (!found) { for (let attempt = 0; attempt < 100; attempt++) { startX = 5 + Math.floor(Math.random() * (CONFIG.GRID_WIDTH - 10)); startY = 5 + Math.floor(Math.random() * (CONFIG.GRID_HEIGHT - 10)); if (!isCellOccupied(startX, startY) && !isActiveResourceField(startX, startY) && Math.hypot(startX - playerLager.gridX, startY - playerLager.gridY) > CONFIG.NPC_START_DIST) { found = true; break; } } }
  if (!found) { startX = 70; startY = 70; }
  npcStartPosition = { x: startX, y: startY };
  const lager = new Building(nextBuildingId++, 'lager', startX, startY, true); lager.isUnderConstruction = false; lager.constructionProgress = 1; npcBuildings.push(lager);
  const haus = new Building(nextBuildingId++, 'haus', startX + 1, startY, true); haus.isUnderConstruction = false; haus.constructionProgress = 1; haus.residents = 1; haus.maxResidents = 6; npcBuildings.push(haus);
  const v = new Villager(nextVillagerId++, haus.id, true); v.x = haus.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; v.y = haus.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; v.targetX = v.x; v.targetY = v.y; v.npcHomeLager = lager; npcVillagers.push(v);
  npcStarted = true; showTemporaryMessage('🤖 NPC-Siedlung gestartet!', '#9b59b6');
}

function npcQuotasMet(houses) {
  const counts = getNPCBuildingCounts();
  const farms = counts.bauer || 0;
  const woodcutters = counts.holzfaeller || 0;
  const stonemasons = counts.steinmetz || 0;
  const towers = counts.wachturm || 0;
  return farms >= houses && woodcutters >= Math.ceil(houses * 2.5) && stonemasons >= houses * 2 && towers >= houses * 2;
}

function updateNPC(dt) {
  initNPC();
  if (!npcStarted) return;

  if (npcWarMode) {
    npcWarModeTimer -= dt;
    if (npcWarModeTimer <= 0) {
      npcWarMode = false;
      npcWarModeTimer = 0;
      npcWarBuildIndex = 0;
    }
  }

  if (npcWarMode) {
    npcTimer += dt;
    if (npcTimer < CONFIG.NPC_BUILD_INTERVAL) return;
    npcTimer = 0;

    const nextType = npcWarBuildOrder[npcWarBuildIndex % npcWarBuildOrder.length];
    if (npcCanAfford(nextType)) {
      const pos = findWarPosition(nextType);
      if (pos) {
        npcDeductCost(nextType);
        const b = new Building(nextBuildingId++, nextType, pos.x, pos.y, true);
        b.isUnderConstruction = true; b.constructionTimer = 0; b.constructionProgress = 0; b.waitingForBuilder = true;
        npcBuildings.push(b); 
        assignNpcBuilderToConstruction(b.id);
        npcWarBuildIndex++;
        if (npcWarBuildIndex >= npcWarBuildOrder.length) npcWarBuildIndex = 0;
      }
    }
    return;
  }

  npcTimer += dt;
  if (npcTimer < CONFIG.NPC_BUILD_INTERVAL) return;
  npcTimer = 0;

  const counts = getNPCBuildingCounts();
  const houses = Math.max(1, counts.haus || 0);
  const farms = counts.bauer || 0;
  const woodcutters = counts.holzfaeller || 0;
  const stonemasons = counts.steinmetz || 0;
  const towers = counts.wachturm || 0;

  const needs = [];
  let builtTower = false;

  // Grundbedürfnisse
  if (npcNeedsLager() && npcCanAfford('lager')) needs.push({ type: 'lager', priority: 30 });
  if (farms === 0 && npcCanAfford('bauer')) needs.push({ type: 'bauer', priority: 25 });
  if (woodcutters < 2 && npcCanAfford('holzfaeller')) needs.push({ type: 'holzfaeller', priority: 23 });
  if (woodcutters >= 2 && stonemasons === 0 && npcCanAfford('steinmetz')) needs.push({ type: 'steinmetz', priority: 22 });
  if (woodcutters >= 2 && towers === 0 && npcCanAfford('wachturm')) needs.push({ type: 'wachturm', priority: 21 });

  // Quoten (Bauern = 1 pro Haus)
  const targetWood = Math.max(2, Math.ceil(houses * 2.5));
  const targetStone = Math.max(1, houses * 2);
  const targetTowers = Math.max(1, houses * 2);
  const targetFarms = Math.max(1, houses);

  if (woodcutters < targetWood && npcCanAfford('holzfaeller')) needs.push({ type: 'holzfaeller', priority: 18 });
  if (stonemasons < targetStone && npcCanAfford('steinmetz')) needs.push({ type: 'steinmetz', priority: 17 });
  if (towers < targetTowers && npcCanAfford('wachturm')) needs.push({ type: 'wachturm', priority: 19 });
  if (farms < targetFarms && npcCanAfford('bauer')) needs.push({ type: 'bauer', priority: 16 });

  // Haus nur wenn alle anderen Bedarfe gedeckt sind (keine harte Grenze mehr)
  if (needs.length === 0 && npcQuotasMet(houses) && npcCanAfford('haus')) {
    needs.push({ type: 'haus', priority: 10 });
  }

  needs.sort((a, b) => b.priority - a.priority);

  for (let need of needs) {
    let pos;
    if (need.type === 'lager') {
      pos = findLagerPosition ? findLagerPosition() : findStandardPosition(need.type, true);
    } else {
      pos = findBestNPCPosition(need.type, false);
    }
    if (pos) {
      npcDeductCost(need.type);
      const b = new Building(nextBuildingId++, need.type, pos.x, pos.y, true);
      b.isUnderConstruction = true; b.constructionTimer = 0; b.constructionProgress = 0; b.waitingForBuilder = true;
      npcBuildings.push(b); 
      assignNpcBuilderToConstruction(b.id);
      if (need.type === 'wachturm') builtTower = true;
      break;
    }
  }

  if (builtTower) {
    const now = performance.now() / 1000;
    if (now - npcLastUpgradeTime >= 600) {
      const upgradeableTypes = ['steinmetz', 'wachturm', 'bauer', 'holzfaeller', 'haus', 'lager'];
      for (let type of upgradeableTypes) {
        const buildingsOfType = npcBuildings.filter(b => b.type === type && !b.isUnderConstruction && b.level < 3);
        for (let b of buildingsOfType) {
          if (npcCanAffordUpgrade(b)) { npcUpgradeBuilding(b); npcLastUpgradeTime = now; break; }
        }
      }
    }
  }
}

// =========================================================================
//  MODUL 17: GAME OVER PRÜFUNG (mit Weiterspielen-Unterstützung)
// =========================================================================
function checkGameOver() {
  if (!npcStarted) return;
  
  if (!gameOver && !continueAfterVictory) {
    if (npcBuildings.length === 0) {
      gameOver = true;
      document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
      document.getElementById('gameOverSub').textContent = 'Du hast alle NPC-Gebäude erobert!';
      document.getElementById('gameOverOverlay').style.display = 'flex';
      return;
    }
    
    if (buildings.length === 0) {
      gameOver = true;
      document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
      document.getElementById('gameOverSub').textContent = 'Deine Siedlung wurde vollständig zerstört!';
      document.getElementById('gameOverOverlay').style.display = 'flex';
      return;
    }
  }
}

// =========================================================================
//  MODUL 18: RENDERER - KOMPLETT
// =========================================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  // Terrain zeichnen
  for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
      const type = terrainMap[y][x];
      ctx.fillStyle = getTerrainColor(type);
      ctx.fillRect(x * CONFIG.CELL_SIZE, y * CONFIG.CELL_SIZE, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillText(getTerrainEmoji(type), x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2);
    }
  }

  // Gitter
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= CONFIG.GRID_WIDTH; i++) {
    ctx.beginPath(); ctx.moveTo(i * CONFIG.CELL_SIZE, 0); ctx.lineTo(i * CONFIG.CELL_SIZE, WORLD_HEIGHT); ctx.stroke();
  }
  for (let j = 0; j <= CONFIG.GRID_HEIGHT; j++) {
    ctx.beginPath(); ctx.moveTo(0, j * CONFIG.CELL_SIZE); ctx.lineTo(WORLD_WIDTH, j * CONFIG.CELL_SIZE); ctx.stroke();
  }

  // Startphase-Anzeige
  if (!gameStarted) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const phaseText = startPhase === 'lager' ? '📦 Lager (kostenlos)' : '🏠 Haus (kostenlos)';
    ctx.fillText(`👉 Platziere dein ${phaseText}`, WORLD_WIDTH/2, 50);
    ctx.font = '20px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('Tippe auf eine freie Zelle', WORLD_WIDTH/2, 90);
    
    if (pendingStartBuild) {
      const px = pendingStartBuild.gx * CONFIG.CELL_SIZE, py = pendingStartBuild.gy * CONFIG.CELL_SIZE;
      ctx.fillStyle = 'rgba(255,255,0,0.3)';
      ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
      ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 3; ctx.setLineDash([4,4]);
      ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE); ctx.setLineDash([]);
    }
  }

  // Bau-Vorschau
  if (gameStarted && pendingBuild && selectedBuildingType) {
    const px = pendingBuild.gx * CONFIG.CELL_SIZE, py = pendingBuild.gy * CONFIG.CELL_SIZE;
    ctx.fillStyle = 'rgba(255,255,0,0.2)';
    ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
    ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
    ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE); ctx.setLineDash([]);
    if (selectedBuildingType === 'bauer' || selectedBuildingType === 'holzfaeller' || selectedBuildingType === 'steinmetz') {
      const neighbors = getNeighborCells(pendingBuild.gx, pendingBuild.gy, 1);
      const resourceType = selectedBuildingType === 'bauer' ? 'grain' : selectedBuildingType === 'holzfaeller' ? 'wood' : 'stone';
      for (let n of neighbors) {
        if (!isCellOccupied(n.x, n.y) && isResourceFieldAvailable(n.x, n.y, resourceType)) {
          ctx.fillStyle = 'rgba(0,255,0,0.25)';
          ctx.fillRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
          ctx.strokeStyle = 'rgba(0,255,0,0.5)'; ctx.lineWidth = 1;
          ctx.strokeRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
      }
    }
  }

  // Upgrade-Vorschau
  if (gameStarted && pendingUpgrade) {
    const px = pendingUpgrade.gx * CONFIG.CELL_SIZE, py = pendingUpgrade.gy * CONFIG.CELL_SIZE;
    ctx.fillStyle = 'rgba(255,0,255,0.25)';
    ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
    ctx.strokeStyle = '#ff66ff'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
    ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE); ctx.setLineDash([]);
  }

  // Abriss-Vorschau
  if (gameStarted && pendingDestroy) {
    const px = pendingDestroy.gx * CONFIG.CELL_SIZE, py = pendingDestroy.gy * CONFIG.CELL_SIZE;
    ctx.fillStyle = 'rgba(255,0,0,0.25)';
    ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
    ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
    ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE); ctx.setLineDash([]);
  }

  // Spieler-Ressourcen-Nodes
  if (gameStarted) {
    for (let node of resourceNodes) {
      const x = node.x * CONFIG.CELL_SIZE, y = node.y * CONFIG.CELL_SIZE;
      let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
      ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(icon, x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2 - 2);
      const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
      const ratio = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = node.ready ? '#2ecc71' : '#f39c12';
      ctx.fillRect(barX, barY, barW * ratio, barH);
      ctx.strokeStyle = '#555'; ctx.lineWidth = 0.5; ctx.strokeRect(barX, barY, barW, barH);
      if (node.ready) {
        ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
      }
    }
  }

  // NPC-Ressourcen-Nodes
  if (gameStarted) {
    for (let node of npcResourceNodes) {
      const x = node.x * CONFIG.CELL_SIZE, y = node.y * CONFIG.CELL_SIZE;
      let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
      ctx.fillStyle = 'rgba(155, 89, 182, 0.15)';
      ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
      ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(icon, x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2 - 2);
      const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
      const ratio = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = node.ready ? '#66ff66' : '#f39c12';
      ctx.fillRect(barX, barY, barW * ratio, barH);
      ctx.strokeStyle = '#555'; ctx.lineWidth = 0.5; ctx.strokeRect(barX, barY, barW, barH);
      if (node.ready) {
        ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
      }
    }
  }

  // Gebäude zeichnen
  const allBuildings = [...buildings, ...npcBuildings];
  allBuildings.forEach(b => {
    const x = b.gridX * CONFIG.CELL_SIZE, y = b.gridY * CONFIG.CELL_SIZE;
    
    // === EROBERUNGS-FLACKERN ===
    if (b.beingCaptured && b.captureProgress > 0) {
      const flashSpeed = 8;
      const flashValue = Math.sin(performance.now() / 1000 * flashSpeed) * 0.5 + 0.5;
      const progress = b.captureProgress;
      
      ctx.strokeStyle = b.capturedBy === 'player' ? 
        `rgba(255, 215, 0, ${0.5 + flashValue * 0.5})` : 
        `rgba(255, 0, 0, ${0.5 + flashValue * 0.5})`;
      ctx.lineWidth = 2 + flashValue * 2;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(x - 1, y - 1, CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE + 2);
      ctx.setLineDash([]);
      
      const barX = x;
      const barY = y - 8;
      const barW = CONFIG.CELL_SIZE;
      const barH = 4;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = b.capturedBy === 'player' ? '#ffd966' : '#ff4444';
      ctx.fillRect(barX, barY, barW * progress, barH);
      
      ctx.globalAlpha = 0.4 + flashValue * 0.4;
    }
    
    let alpha = ctx.globalAlpha;
    let color = b.isNPC ? getNPCBuildingColor(b.type) : getBuildingColor(b.type);
    
    if (b.isUnderConstruction) {
      const progress = b.constructionProgress || 0;
      alpha = 0.2 + progress * 0.8;
    }
    
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
    ctx.globalAlpha = 1;
    
    ctx.strokeStyle = b.isNPC ? '#9b59b6' : '#111';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
    
    if (b.level > 1 && !b.isUnderConstruction) {
      ctx.fillStyle = 'white';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.level, x + CONFIG.CELL_SIZE/2, y + CONFIG.CELL_SIZE/2);
    }
    
    if (!b.isUnderConstruction) {
      if (b.type === 'haus') {
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(`${b.residents}/${b.maxResidents}`, x + 4, y + 4);
      } else if (b.type === 'wachturm') {
        ctx.fillStyle = 'white';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(`${b.stoneAmmo}/${b.maxStoneAmmo}`, x + 4, y + 4);
        if (b.doubleShot) {
          ctx.fillStyle = '#ff66ff';
          ctx.font = 'bold 8px sans-serif';
          ctx.fillText('✧2', x + 28, y + 28);
        }
      }
    }
    
    if (b.isUnderConstruction) {
      const progress = b.constructionProgress || 0;
      const barX = x + 4;
      const barY = y + CONFIG.CELL_SIZE - 8;
      const barW = CONFIG.CELL_SIZE - 8;
      const barH = 4;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#ffd966';
      ctx.fillRect(barX, barY, barW * progress, barH);
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(barX, barY, barW, barH);
    }
  });

  // Turm-Reichweite
  buildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction).forEach(tower => {
    const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    ctx.beginPath();
    ctx.arc(cx, cy, CONFIG.TOWER_RANGE * CONFIG.CELL_SIZE, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,0,0.05)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,0,0.2)';
    ctx.lineWidth = 1; ctx.stroke();
  });

  // Projektile
  for (let p of projectiles) {
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.targetX, p.targetY);
    ctx.strokeStyle = 'rgba(255,255,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffdd44'; ctx.fill();
    ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
  }

  // Treffer-Effekte
  for (let effect of hitEffects) {
    for (let p of effect.particles) {
      if (p.life <= 0) continue;
      const alpha = Math.max(0, p.life / p.maxLife);
      const size = Math.max(0.5, 2 + (1 - alpha) * 4);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color || `rgb(255,${Math.floor(50*alpha)},${Math.floor(50*alpha)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = p.color || '#ff0000'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  // Spieler-Einwohner
  villagers.filter(v => v.alive).forEach(v => {
    let color = '#1a1a1a';
    if (v.carrying === 'grain') color = '#f39c12';
    else if (v.carrying === 'wood') color = '#8b5a2b';
    else if (v.carrying === 'stone') color = '#7f8c8d';
    else if (v.isBuilding) color = '#ffd966';
    else if (v.isAttacking) color = '#ff4444';
    ctx.beginPath();
    ctx.arc(v.x, v.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.6; ctx.stroke();
  });

  // NPC-Einwohner
  npcVillagers.filter(v => v.alive).forEach(v => {
    let color = '#66ccff';
    if (v.carrying === 'grain') color = '#66ff66';
    else if (v.carrying === 'wood') color = '#ff9966';
    else if (v.carrying === 'stone') color = '#ffcc66';
    else if (v.isBuilding) color = '#ffd966';
    else if (v.isAttacking) color = '#ff4444';
    ctx.beginPath();
    ctx.arc(v.x, v.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 1.5; ctx.stroke();
  });

  // Feinde
  enemies.filter(e => e.alive).forEach(e => {
    ctx.beginPath(); ctx.arc(e.x, e.y, e.isSuper ? 8 : 5, 0, Math.PI * 2);
    ctx.fillStyle = e.isSuper ? '#ff00ff' : '#e74c3c'; ctx.fill();
    ctx.strokeStyle = e.isSuper ? '#880088' : '#922b21';
    ctx.lineWidth = e.isSuper ? 2 : 1; ctx.stroke();
    if (e.isSuper && e.hits < e.maxHits) {
      ctx.fillStyle = 'white'; ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${e.maxHits - e.hits}`, e.x, e.y - 12);
    }
  });

  ctx.restore();
}

//  MODUL 20: TOUCH-EVENTS
// =========================================================================
function getTouchPos(touch) {
  const rect = canvas.getBoundingClientRect();
  return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
}

// =========================================================================
//  MODUL 21: TOOLBAR – KOMPLETT (mit Toggle und Continue-Button, 2-zeilig)
// =========================================================================
function setupUI() {
  document.querySelectorAll('.tool-btn[data-type]').forEach(btn => {
    const handler = (e) => {
      e.stopPropagation(); e.preventDefault();
      if (upgradeMode) { upgradeMode = false; document.getElementById('upgradeBtn').classList.remove('active'); }
      if (destroyMode) { destroyMode = false; document.getElementById('destroyBtn').classList.remove('active'); }
      const type = btn.dataset.type;
      if (selectedBuildingType === type) {
        selectedBuildingType = null; btn.classList.remove('active'); pendingBuild = null;
      } else {
        document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active'));
        selectedBuildingType = type; btn.classList.add('active'); pendingBuild = null;
      }
    };
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', handler);
  });

  document.getElementById('deselectBtn').addEventListener('click', (e) => {
    e.stopPropagation(); e.preventDefault();
    selectedBuildingType = null; pendingBuild = null; upgradeMode = false; destroyMode = false;
    document.getElementById('upgradeBtn').classList.remove('active');
    document.getElementById('destroyBtn').classList.remove('active');
    document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active'));
  });
  document.getElementById('deselectBtn').addEventListener('touchend', (e) => {
    e.stopPropagation(); e.preventDefault();
    selectedBuildingType = null; pendingBuild = null; upgradeMode = false; destroyMode = false;
    document.getElementById('upgradeBtn').classList.remove('active');
    document.getElementById('destroyBtn').classList.remove('active');
    document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active'));
  });

  document.getElementById('upgradeBtn').addEventListener('click', (e) => {
    e.stopPropagation(); e.preventDefault();
    if (destroyMode) { destroyMode = false; document.getElementById('destroyBtn').classList.remove('active'); }
    upgradeMode = !upgradeMode;
    document.getElementById('upgradeBtn').classList.toggle('active');
    if (upgradeMode) { selectedBuildingType = null; pendingBuild = null;
      document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active')); }
  });
  document.getElementById('upgradeBtn').addEventListener('touchend', (e) => {
    e.stopPropagation(); e.preventDefault();
    if (destroyMode) { destroyMode = false; document.getElementById('destroyBtn').classList.remove('active'); }
    upgradeMode = !upgradeMode;
    document.getElementById('upgradeBtn').classList.toggle('active');
    if (upgradeMode) { selectedBuildingType = null; pendingBuild = null;
      document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active')); }
  });

  document.getElementById('destroyBtn').addEventListener('click', (e) => {
    e.stopPropagation(); e.preventDefault();
    if (upgradeMode) { upgradeMode = false; document.getElementById('upgradeBtn').classList.remove('active'); }
    destroyMode = !destroyMode;
    document.getElementById('destroyBtn').classList.toggle('active');
    if (destroyMode) { selectedBuildingType = null; pendingBuild = null;
      document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active')); }
  });
  document.getElementById('destroyBtn').addEventListener('touchend', (e) => {
    e.stopPropagation(); e.preventDefault();
    if (upgradeMode) { upgradeMode = false; document.getElementById('upgradeBtn').classList.remove('active'); }
    destroyMode = !destroyMode;
    document.getElementById('destroyBtn').classList.toggle('active');
    if (destroyMode) { selectedBuildingType = null; pendingBuild = null;
      document.querySelectorAll('.tool-btn[data-type]').forEach(b => b.classList.remove('active')); }
  });

  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  const newConfirmYes = confirmYes.cloneNode(true);
  const newConfirmNo = confirmNo.cloneNode(true);
  confirmYes.parentNode.replaceChild(newConfirmYes, confirmYes);
  confirmNo.parentNode.replaceChild(newConfirmNo, confirmNo);

  newConfirmYes.addEventListener('click', function(e) {
    e.preventDefault();
    if (window._pendingStartType === 'lager' && pendingStartBuild) {
      const lager = new Building(nextBuildingId++, 'lager', pendingStartBuild.gx, pendingStartBuild.gy, false);
      lager.isUnderConstruction = false; lager.constructionProgress = 1;
      buildings.push(lager);
      startPhase = 'haus'; pendingStartBuild = null; window._pendingStartType = null;
      showTemporaryMessage('✅ Lager platziert! Jetzt Haus platzieren', '#ffd966');
      document.getElementById('confirmDialog').style.display = 'none';
      return;
    }
    if (window._pendingStartType === 'haus' && pendingStartBuild) {
      const haus = new Building(nextBuildingId++, 'haus', pendingStartBuild.gx, pendingStartBuild.gy, false);
      haus.isUnderConstruction = false; haus.constructionProgress = 1; haus.residents = 1;
      haus.maxProductionTime = 30; haus.baseMaxProductionTime = 30;
      buildings.push(haus); spawnVillager(haus.id);
      gameStarted = true; pendingStartBuild = null; window._pendingStartType = null; startPhase = 'lager';
      resources.grain = 10; resources.wood = 10; resources.stone = 0;
      showTemporaryMessage('🎮 Spiel gestartet! Viel Erfolg!', '#2ecc71');
      document.getElementById('confirmDialog').style.display = 'none';
      return;
    }
    if (pendingDestroy) {
      if (destroyBuilding(pendingDestroy.gx, pendingDestroy.gy)) {
        pendingDestroy = null; destroyMode = false;
        document.getElementById('destroyBtn').classList.remove('active');
        showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b');
      }
    } else if (pendingUpgrade) {
      const building = pendingUpgrade.building;
      if (upgradeBuilding(building)) {
        showTemporaryMessage(`⬆️ Upgrade auf Stufe ${building.level} erfolgreich!`, '#ffd966');
        pendingUpgrade = null;
      }
    } else if (pendingBuild && selectedBuildingType) {
      if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
        pendingBuild = null;
        showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966');
      }
    }
    document.getElementById('confirmDialog').style.display = 'none';
  });
  newConfirmYes.addEventListener('touchend', (e) => { e.preventDefault(); newConfirmYes.click(); });

  newConfirmNo.addEventListener('click', function(e) {
    e.preventDefault();
    if (window._pendingStartType) { window._pendingStartType = null; pendingStartBuild = null; }
    pendingDestroy = null; pendingUpgrade = null; pendingBuild = null;
    document.getElementById('confirmDialog').style.display = 'none';
  });
  newConfirmNo.addEventListener('touchend', (e) => { e.preventDefault(); newConfirmNo.click(); });

  document.getElementById('restartBtn').addEventListener('click', () => location.reload());

  document.getElementById('continueBtn').addEventListener('click', () => {
    gameOver = false;
    continueAfterVictory = true;
    document.getElementById('gameOverOverlay').style.display = 'none';
    showTemporaryMessage('▶️ Spiel läuft weiter', '#2ecc71');
  });

  // Toggle-Button für BEIDE Toolbar-Zeilen
  const toolbarRow1 = document.getElementById('toolbarRow1');
  const toolbarRow2 = document.getElementById('toolbarRow2');
  const toggleBtn = document.getElementById('toggleToolbarBtn');
  toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (toolbarRow1.style.display === 'none') {
      toolbarRow1.style.display = 'flex';
      toolbarRow2.style.display = 'flex';
      toggleBtn.textContent = '▲';
    } else {
      toolbarRow1.style.display = 'none';
      toolbarRow2.style.display = 'none';
      toggleBtn.textContent = '▼';
    }
  });
  toggleBtn.addEventListener('touchend', (e) => {
    e.stopPropagation(); e.preventDefault();
    if (toolbarRow1.style.display === 'none') {
      toolbarRow1.style.display = 'flex';
      toolbarRow2.style.display = 'flex';
      toggleBtn.textContent = '▲';
    } else {
      toolbarRow1.style.display = 'none';
      toolbarRow2.style.display = 'none';
      toggleBtn.textContent = '▼';
    }
  });
}


// =========================================================================
//  MODUL 22: INIT & GAME-LOOP
// =========================================================================
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function showTemporaryMessage(msg, color = '#fff') {
  tempMessage = msg;
  tempMessageColor = color;
  tempMessageTimer = 3.0;
}

function init() {
  const canvas = document.getElementById('gameCanvas');
  window.canvas = canvas;
  window.ctx = canvas.getContext('2d');
  
  window.grainSpan = document.getElementById('grainCount');
  window.popSpan = document.getElementById('popCount');
  window.woodSpan = document.getElementById('woodCount');
  window.stoneSpan = document.getElementById('stoneCount');
  window.freeSpan = document.getElementById('freeCount');

  generateTerrain();

  window.addEventListener('resize', resize);
  resize();

  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
  canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

  setupUI();

  requestAnimationFrame(gameLoop);
}

function handleTouchStart(e) {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => { touches[t.identifier] = getTouchPos(t); });
  activeTouches = Object.values(touches);
  if (activeTouches.length === 1) {
    isPanning = true; panStart = { ...activeTouches[0] }; hasMoved = false; lastPinchDist = 0;
  } else if (activeTouches.length === 2) {
    isPanning = false;
    lastPinchDist = Math.hypot(activeTouches[1].x - activeTouches[0].x, activeTouches[1].y - activeTouches[0].y);
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => { touches[t.identifier] = getTouchPos(t); });
  activeTouches = Object.values(touches);
  if (activeTouches.length === 2) {
    isPanning = false;
    const p1 = activeTouches[0], p2 = activeTouches[1];
    const newDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    if (lastPinchDist > 0) {
      const scale = newDist / lastPinchDist;
      const before = screenToWorld(mid.x, mid.y);
      camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
      const after = screenToWorld(mid.x, mid.y);
      camera.x += before.x - after.x;
      camera.y += before.y - after.y;
    }
    lastPinchDist = newDist;
  } else if (activeTouches.length === 1 && isPanning) {
    const p = activeTouches[0];
    if (Math.abs(p.x - panStart.x) > MOVE_THRESHOLD || Math.abs(p.y - panStart.y) > MOVE_THRESHOLD) hasMoved = true;
    if (hasMoved) {
      camera.x -= (p.x - panStart.x) / camera.zoom;
      camera.y -= (p.y - panStart.y) / camera.zoom;
      panStart = { ...p };
    }
  }
}

function handleTouchEnd(e) {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => { delete touches[t.identifier]; });
  activeTouches = Object.values(touches);
  
  if (activeTouches.length === 0 && isPanning && !hasMoved) {
    const world = screenToWorld(panStart.x, panStart.y);
    const gx = Math.floor(world.x / CONFIG.CELL_SIZE), gy = Math.floor(world.y / CONFIG.CELL_SIZE);
    if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
      
      if (!gameStarted) {
        if (!isCellOccupied(gx, gy)) {
          if (startPhase === 'lager') {
            pendingStartBuild = { gx, gy };
            document.getElementById('confirmText').textContent = '📦 Lager an dieser Stelle platzieren? (kostenlos)';
            document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
            document.getElementById('effectDisplay').textContent = 'Dein erstes Lager';
            document.getElementById('confirmDialog').style.display = 'block';
            window._pendingStartType = 'lager';
            return;
          } else if (startPhase === 'haus') {
            pendingStartBuild = { gx, gy };
            document.getElementById('confirmText').textContent = '🏠 Haus an dieser Stelle platzieren? (kostenlos)';
            document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
            document.getElementById('effectDisplay').textContent = 'Dein erstes Haus mit 1 Einwohner';
            document.getElementById('confirmDialog').style.display = 'block';
            window._pendingStartType = 'haus';
            return;
          }
        } else {
          showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        }
        return;
      }
      
      if (destroyMode) {
        const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
        if (building) {
          pendingDestroy = { gx, gy };
          document.getElementById('confirmText').textContent = 
            `${building.type.toUpperCase()} (Level ${building.level}) wirklich abreissen?`;
          document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
          document.getElementById('effectDisplay').textContent = '';
          document.getElementById('confirmDialog').style.display = 'block';
          return;
        }
      } else if (upgradeMode) {
        const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
        if (building && building.level <= 3) {
          pendingUpgrade = { building, gx, gy };
          const { cost, effect } = getUpgradeCostAndEffect(building);
          document.getElementById('confirmText').textContent = 
            `${building.type.toUpperCase()} auf Stufe ${building.level + 1} upgraden?`;
          document.getElementById('costDisplay').textContent = 
            `Kosten: ${cost.wood}🪵 ${cost.stone > 0 ? cost.stone + '🪨' : ''}`;
          document.getElementById('effectDisplay').textContent = `Effekt: ${effect.desc}`;
          document.getElementById('confirmDialog').style.display = 'block';
          return;
        } else if (building && building.level > 3) { return; }
        upgradeMode = false;
        document.getElementById('upgradeBtn').classList.remove('active');
      } else if (selectedBuildingType) {
        if (pendingBuild && pendingBuild.gx === gx && pendingBuild.gy === gy) {
          if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
            pendingBuild = null;
            showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966');
          }
        } else {
          pendingBuild = { gx, gy };
        }
      }
    }
  }
  if (activeTouches.length === 0) { isPanning = false; hasMoved = false; lastPinchDist = 0; }
  else if (activeTouches.length === 1) { isPanning = true; panStart = { ...activeTouches[0] }; hasMoved = false; }
}

// =========================================================================
//  GAME LOOP
// =========================================================================
function gameLoop(now) {
  let dt = (now - lastTimestamp) / 1000;
  if (dt > 0.2) dt = 0.016;
  lastTimestamp = now;

  // Speed-Boost
  dt *= gameSpeed;

  if (gameStarted) {
    attackTimer += dt;
    if (attackTimer >= nextAttackDelay) {
      attackTimer = 0;
      nextAttackDelay = 60 + Math.random() * 60;
      spawnEnemies();
    }

    updateEconomy(dt);
    updateVillagers(dt);
    updateConstruction(dt);
    updateNPC(dt);
    updateNPCVillagers(dt);
    updateCombatAndCapture(dt);
    updateTowers(dt);
    updateProjectiles(dt);
    updateHitEffects(dt);
    updateEnemies(dt);
    checkGameOver();
    updateUI();
  }

  draw();
  
  // Temporäre Nachricht oben klein anzeigen
  if (tempMessageTimer > 0) {
    tempMessageTimer -= dt;
    const alpha = Math.min(1, tempMessageTimer);
    ctx.save();
    ctx.globalAlpha = alpha;
    const msgWidth = ctx.measureText(tempMessage).width + 40;
    const msgHeight = 30;
    const msgX = canvas.width/2 - msgWidth/2;
    const msgY = 60;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.fillRect(msgX, msgY, msgWidth, msgHeight);
    ctx.fill();
    ctx.fillStyle = tempMessageColor;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tempMessage, canvas.width/2, msgY + msgHeight/2);
    ctx.restore();
  }
  
  requestAnimationFrame(gameLoop);
}

// =========================================================================
// MODUL 23: SOUND-EFFEKTE (nur bei Sichtbarkeit)
// =========================================================================
const SoundFX = (() => {
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function isVisible(worldX, worldY) {
    const left   = camera.x - (canvas.width / 2) / camera.zoom;
    const right  = camera.x + (canvas.width / 2) / camera.zoom;
    const top    = camera.y - (canvas.height / 2) / camera.zoom;
    const bottom = camera.y + (canvas.height / 2) / camera.zoom;
    return worldX >= left && worldX <= right && worldY >= top && worldY <= bottom;
  }

  function play(freq, duration, type = 'square', vol = 0.1) {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = vol;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  return {
    playIfVisible(worldX, worldY, type) {
      if (!isVisible(worldX, worldY)) return;
      switch(type) {
        case 'build':       play(220, 0.15, 'square', 0.08);   break;
        case 'capture':     play(440, 0.2, 'triangle', 0.1);   break;
        case 'hit':         play(150, 0.1, 'sawtooth', 0.12);  break;
        case 'enemyDeath':  play(80, 0.3, 'sawtooth', 0.15);   break;
        case 'towerShoot':  play(880, 0.08, 'square', 0.06);   break;
        case 'upgrade':     play(660, 0.15, 'triangle', 0.1);  break;
        case 'destroy':     play(100, 0.25, 'sawtooth', 0.15); break;
        case 'villagerDie': play(200, 0.15, 'square', 0.1);    break;
      }
    }
  };
})();

init();
