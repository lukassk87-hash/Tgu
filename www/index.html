// ============================================================
//  KOMPLETTE updateNPC() - MIT WASM-UNTERSTÜTZUNG
// ============================================================
function updateNPC(dt) {
    initNPC();
    if (!npcStarted) return;

    // ===== 1. COOLDOWNS AKTUALISIEREN (WASM) =====
    if (wasmLoaded && wasmExports.npcUpdateCooldowns) {
        const cooldownArray = new Float32Array([
            npcBuildCooldowns.haus || 0,
            npcBuildCooldowns.bauer || 0,
            npcBuildCooldowns.holzfaeller || 0,
            npcBuildCooldowns.steinmetz || 0,
            npcBuildCooldowns.wachturm || 0,
            npcBuildCooldowns.lager || 0,
            npcBuildCooldowns.grenze || 0,
            npcBuildCooldowns.fischerhütte || 0
        ]);
        wasmExports.npcUpdateCooldowns(cooldownArray, 8, dt);
        const typeNames = ['haus', 'bauer', 'holzfaeller', 'steinmetz', 'wachturm', 'lager', 'grenze', 'fischerhütte'];
        for (let i = 0; i < 8; i++) {
            npcBuildCooldowns[typeNames[i]] = cooldownArray[i];
        }
    } else {
        // JS-Fallback
        for (let type in npcBuildCooldowns) {
            if (npcBuildCooldowns[type] > 0) {
                npcBuildCooldowns[type] -= dt;
                if (npcBuildCooldowns[type] < 0) npcBuildCooldowns[type] = 0;
            }
        }
    }

    // ===== 2. COOLDOWNS (BLEIBT IN JS) =====
    if (npcLagerCooldown > 0) {
        npcLagerCooldown -= dt;
        if (npcLagerCooldown < 0) npcLagerCooldown = 0;
    }
    if (npcGrenzeCooldown > 0) {
        npcGrenzeCooldown -= dt;
        if (npcGrenzeCooldown < 0) npcGrenzeCooldown = 0;
    }

    // ===== 3. KRIEG/FRIEDEN (MIT WASM) =====
    let isWar = false;
    if (wasmLoaded && wasmExports.npcCheckWarState) {
        const population = npcVillagers.filter(v => v.alive).length;
        const warState = wasmExports.npcCheckWarState(
            population,
            npcHardMode ? 1 : 0,
            0, 0, // nicht verwendet
            npcPeaceTimer || 0,
            dt
        );
        isWar = warState === 1;
    } else {
        // JS-Fallback
        const npcPopulation = npcVillagers.filter(v => v.alive).length;
        const warThreshold = npcHardMode ? WAR_POPULATION_THRESHOLD : CONFIG.EASY_MODE_WAR_POPULATION_THRESHOLD;
        isWar = (npcPopulation >= warThreshold);
    }

    // ===== 4. KRIEG MODUS =====
    if (isWar) {
        if (!npcWarMode) {
            npcWarMode = true;
            npcWarModeTimer = 60;
            npcWarBuildIndex = 0;
            if (gameMode === 'peace') {
                gameMode = 'war';
                showTemporaryMessage('⚔️ NPC hat den Krieg erklärt!', '#ff4444');
                if (window.updateModeDisplay) window.updateModeDisplay();
            }
        }
    } else {
        if (npcWarMode) {
            npcWarMode = false;
            npcWarModeTimer = 0;
            npcWarBuildIndex = 0;
            if (gameMode === 'war') {
                gameMode = 'peace';
                showTemporaryMessage('🕊️ NPC kehrt in den Frieden zurück', '#44ff44');
                if (window.updateModeDisplay) window.updateModeDisplay();
            }
        }
    }

    // ===== 5. NPC KRIEGSMODUS BAU =====
    if (npcWarMode) {
        npcWarModeTimer -= dt;
        if (npcWarModeTimer <= 0) {
            npcWarMode = false;
            npcWarModeTimer = 0;
            npcWarBuildIndex = 0;
            return;
        }
        
        npcTimer += dt;
        const npcBuildInterval = npcHardMode ? CONFIG.NPC_BUILD_INTERVAL : CONFIG.EASY_MODE_NPC_BUILD_INTERVAL;
        if (npcTimer < npcBuildInterval) {
            if (npcStarted) {
                updateNpcResourceNodes(dt);
            }
            return;
        }
        npcTimer = 0;
        
        const warBuildOrder = ['bauer', 'haus', 'haus', 'wachturm'];
        const nextType = warBuildOrder[npcWarBuildIndex % warBuildOrder.length];
        if (npcCanBuildType(nextType)) {
            // ===== WASM FÜR POSITION =====
            let pos = null;
            if (wasmLoaded) {
                pos = findBuildPositionWithWasm(nextType, false);
            }
            if (!pos) {
                pos = findWarPosition(nextType);
            }
            if (pos) {
                npcDeductCost(nextType);
                const b = new Building(nextBuildingId++, nextType, pos.x, pos.y, true);
                b.isUnderConstruction = true;
                b.constructionTimer = 0;
                b.constructionProgress = 0;
                b.waitingForBuilder = true;
                npcBuildings.push(b);
                assignNpcBuilderToConstruction(b.id);
                npcSetBuildCooldown(nextType);
                updateCacheAfterBuild(pos.x, pos.y, nextType);
                if (nextType === 'bauer' || nextType === 'holzfaeller' || nextType === 'steinmetz' || nextType === 'fischerhütte') {
                    cachedNpcResourceNodesDirty = true;
                }
                npcWarBuildIndex++;
                if (npcWarBuildIndex >= warBuildOrder.length) npcWarBuildIndex = 0;
                markDirty('buildings');
                markDirty('villagers');
            } else {
                npcWarBuildIndex++;
                if (npcWarBuildIndex >= warBuildOrder.length) npcWarBuildIndex = 0;
            }
        }
        if (npcStarted) {
            updateNpcResourceNodes(dt);
        }
        return;
    }

    // ===== 6. FRIEDENSMODUS =====
    npcTimer += dt;
    const npcBuildInterval = npcHardMode ? CONFIG.NPC_BUILD_INTERVAL : CONFIG.EASY_MODE_NPC_BUILD_INTERVAL;
    if (npcTimer < npcBuildInterval) {
        if (npcStarted) {
            updateNpcResourceNodes(dt);
        }
        return;
    }
    npcTimer = 0;

    // ===== 7. ENTSCHEIDUNG (MIT WASM) =====
    let decision = null;
    if (wasmLoaded) {
        decision = npcMakeDecisionWithWasm(isWar);
    }
    
    // FALLBACK: JS-Entscheidung
    if (!decision) {
        const counts = getNPCBuildingCounts();
        const houses = Math.max(1, counts.haus || 0);
        const farms = counts.bauer || 0;
        const woodcutters = counts.holzfaeller || 0;
        const stonemasons = counts.steinmetz || 0;
        const towers = counts.wachturm || 0;
        const lagers = counts.lager || 0;
        const fischerhütten = counts.fischerhütte || 0;
        
        let totalFarmLevels = 0;
        let totalWoodLevels = 0;
        let totalStoneLevels = 0;
        let totalTowerLevels = 0;
        let totalLagerLevels = 0;
        let totalFischerLevels = 0;
        let totalHouseLevels = 0;
        
        for (let b of npcBuildings) {
            if (b.type === 'bauer' && !b.isUnderConstruction) totalFarmLevels += b.level;
            else if (b.type === 'holzfaeller' && !b.isUnderConstruction) totalWoodLevels += b.level;
            else if (b.type === 'steinmetz' && !b.isUnderConstruction) totalStoneLevels += b.level;
            else if (b.type === 'wachturm' && !b.isUnderConstruction) totalTowerLevels += b.level;
            else if (b.type === 'lager' && !b.isUnderConstruction) totalLagerLevels += b.level;
            else if (b.type === 'fischerhütte' && !b.isUnderConstruction) totalFischerLevels += b.level;
            else if (b.type === 'haus' && !b.isUnderConstruction) totalHouseLevels += b.level;
        }
        
        const effectiveHouses = Math.max(1, totalHouseLevels);
        const targetFarms = Math.max(2, Math.ceil(effectiveHouses * 0.5));
        const targetWood = Math.max(2, Math.ceil(effectiveHouses * 1));
        const targetStone = Math.max(1, Math.ceil(effectiveHouses * 1));
        const targetTowers = Math.max(1, Math.ceil(effectiveHouses * 3));
        const targetLagers = Math.max(1, Math.ceil(effectiveHouses * 0.3));
        const targetFischer = Math.ceil(effectiveHouses * 1.5);
        
        let needs = [];
        if (totalFischerLevels < targetFischer && npcCanBuildType('fischerhütte')) needs.push({ type: 'fischerhütte', priority: 100 });
        if (totalLagerLevels < targetLagers && npcCanBuildType('lager') && npcLagerCooldown <= 0) needs.push({ type: 'lager', priority: 80 });
        if (totalTowerLevels < targetTowers && npcCanBuildType('wachturm')) needs.push({ type: 'wachturm', priority: 90 });
        if (totalStoneLevels < targetStone && npcCanBuildType('steinmetz')) needs.push({ type: 'steinmetz', priority: 96 });
        if (totalWoodLevels < targetWood && npcCanBuildType('holzfaeller')) needs.push({ type: 'holzfaeller', priority: 92 });
        if (totalFarmLevels < targetFarms && npcCanBuildType('bauer')) needs.push({ type: 'bauer', priority: 95 });
        
        const hasEnoughFarms = totalFarmLevels >= Math.ceil(effectiveHouses * 0.5);
        if (hasEnoughFarms && !npcHouseBuildCooldown && npcResources.wood >= 3 && npcResources.grain >= 5 && npcCanBuildType('haus')) {
            needs.push({ type: 'haus', priority: 50 });
        }
        
        if (needs.length > 0) {
            needs.sort((a, b) => b.priority - a.priority);
            decision = needs[0];
        }
    }

    // ===== 8. BAU AUSFÜHREN =====
    if (decision) {
        const type = decision.type;
        if (npcCanBuildType(type)) {
            let pos = null;
            if (wasmLoaded && type !== 'grenze') {
                pos = findBuildPositionWithWasm(type, type === 'lager');
            }
            if (!pos) {
                if (type === 'lager') {
                    pos = findLagerPosition ? findLagerPosition() : findStandardPosition(type, true);
                } else if (type === 'haus') {
                    pos = findStandardPosition(type, false);
                } else {
                    pos = findBestNPCPositionCached(type, false);
                }
            }
            
            if (pos) {
                npcDeductCost(type);
                const b = new Building(nextBuildingId++, type, pos.x, pos.y, true);
                b.isUnderConstruction = true;
                b.constructionTimer = 0;
                b.constructionProgress = 0;
                b.waitingForBuilder = true;
                npcBuildings.push(b);
                assignNpcBuilderToConstruction(b.id);
                npcSetBuildCooldown(type);
                
                if (type === 'fischerhütte') {
                    b.fishStorage = 0;
                    b.maxFishStorage = 3;
                    b.fishProductionTimer = 0;
                    b.fishProductionInterval = 30;
                    b.baseFishProductionInterval = 30;
                    b.productionType = 'fish';
                    b.fieldCount = 0;
                    b.harvestProgress = 0;
                    b.isHarvesting = false;
                    b.nodeId = null;
                    b.maxProductionTime = 30;
                    b.baseMaxProductionTime = 30;
                    showTemporaryMessage('🤖 NPC baut Fischerhütte!', '#1abc9c', true);
                }
                
                if (type === 'lager') {
                    npcLagerCooldown = NPC_LAGER_COOLDOWN;
                    showTemporaryMessage('🤖 NPC baut Lager (Cooldown: 20s)', '#6e8cc9', true);
                }
                
                if (type === 'haus') {
                    npcHouseBuildCooldown = true;
                    npcHouseBuildTimer = 0;
                }
                
                updateCacheAfterBuild(pos.x, pos.y, type);
                if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz' || type === 'fischerhütte') {
                    cachedNpcResourceNodesDirty = true;
                }
                markDirty('buildings');
                markNpcCacheDirty();
                if (npcStarted) {
                    updateNpcResourceNodes(dt);
                }
                return;
            }
        }
    }

    // ===== 9. NPC EROBERT GRENZEN =====
    if (!npcPeaceMode && gameMode === 'war') {
        const npcVillagersForCapture = npcVillagers.filter(v =>
            v.alive && v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        for (let g of grenzen) {
            if (g.beingCaptured) continue;
            const centerX = g.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const centerY = g.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const nearbyNpc = npcVillagersForCapture.filter(v =>
                Math.hypot(v.x - centerX, v.y - centerY) < CONFIG.TOWER_RANGE * CONFIG.CELL_SIZE
            );
            if (nearbyNpc.length > 0 && !isGrenzeBeingCaptured(g.id)) {
                const key = getGrenzeCaptureKey(g.id, 'player');
                if (!captureTimers[key]) {
                    captureTimers[key] = { timer: 0, lastOccupiedBy: 'npc' };
                }
            }
        }
    }

    // ===== 10. UPGRADES =====
    const now = performance.now() / 1000;
    if (now - npcLastUpgradeTime >= 600) {
        const upgradeableTypes = ['steinmetz', 'wachturm', 'bauer', 'holzfaeller', 'haus', 'lager', 'fischerhütte'];
        for (let type of upgradeableTypes) {
            const buildingsOfType = npcBuildings.filter(b => b.type === type && !b.isUnderConstruction && b.level < 3);
            for (let b of buildingsOfType) {
                if (npcCanAffordUpgrade(b)) {
                    npcUpgradeBuilding(b);
                    npcLastUpgradeTime = now;
                    break;
                }
            }
        }
    }

    // ===== 11. NODES AKTUALISIEREN =====
    if (npcStarted) {
        updateNpcResourceNodes(dt);
    }
}



// =========================================================================
//  MODUL 17: GAME OVER (für 2 Spieler erweitert)
//  NPC bleibt unverändert - wird im Split-Modus ignoriert
// =========================================================================

function checkGameOver() {
    // Wenn weitergespielt wird, keine Game-Over-Prüfung mehr
    if (continueAfterVictory) return;
    if (gameOver) return;

    if (SPLIT_SCREEN) {
        checkGameOverSplit();
    } else {
        checkGameOverSingle();
    }
}

// ===== EINZELMODUS: Spieler vs NPC (UNVERÄNDERT) =====
function checkGameOverSingle() {
    if (!npcStarted) return;
    if (gameOver && !continueAfterVictory) return;

    // Spieler hat kein Lager mehr
    const playerHasLager = buildings.some(b => b.type === 'lager');
    if (!playerHasLager && buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
        document.getElementById('gameOverSub').textContent = 'Kein Lager - Deine Siedlung ist zusammengebrochen!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // NPC hat kein Lager mehr
    const npcHasLager = npcBuildings.some(b => b.type === 'lager');
    if (!npcHasLager && npcBuildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
        document.getElementById('gameOverSub').textContent = 'NPC hat kein Lager - Du hast gewonnen!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle NPC-Gebäude erobert
    if (npcBuildings.length === 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
        document.getElementById('gameOverSub').textContent = 'Du hast alle NPC-Gebäude erobert!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle Spieler-Gebäude zerstört
    if (buildings.length === 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
        document.getElementById('gameOverSub').textContent = 'Deine Siedlung wurde vollständig zerstört!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }
}

// ===== SPLIT-MODUS: Spieler 1 vs Spieler 2 =====
function checkGameOverSplit() {
    if (gameOver && !continueAfterVictory) return;

    const p1HasLager = buildings.some(b => b.type === 'lager');
    const p2HasLager = player2Buildings.some(b => b.type === 'lager');

    // Spieler 1 hat kein Lager mehr
    if (!p1HasLager && buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 2 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 1 hat kein Lager - Spieler 2 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Spieler 2 hat kein Lager mehr
    if (!p2HasLager && player2Buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 1 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 2 hat kein Lager - Spieler 1 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Beide haben kein Lager mehr (Unentschieden)
    if (!p1HasLager && !p2HasLager) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '⚖️ UNENTSCHIEDEN!';
        document.getElementById('gameOverSub').textContent = 'Beide Spieler haben kein Lager mehr!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle Gebäude von Spieler 1 zerstört
    if (buildings.length === 0 && player2Buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 2 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 1 hat keine Gebäude mehr - Spieler 2 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle Gebäude von Spieler 2 zerstört
    if (player2Buildings.length === 0 && buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 1 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 2 hat keine Gebäude mehr - Spieler 1 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Beide haben keine Gebäude mehr (Unentschieden)
    if (buildings.length === 0 && player2Buildings.length === 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '⚖️ UNENTSCHIEDEN!';
        document.getElementById('gameOverSub').textContent = 'Beide Spieler haben keine Gebäude mehr!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }
}

// ===== RENDER CACHE VARIABLEN =====
let renderDirtyTerrain = true;

let renderDirtyBuildings = true;
let renderDirtyVillagers = true;

// ===== OFFCREEN CANVAS FÜR TERRAIN =====
let terrainCanvas = null;

// ===== GRENZEN ZEICHNEN (NUR ÄUßERE PUNKTE MIT GECACHTEM webp) =====
function drawGrenzen(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    const ICON_SIZE = 10;
    
    // ===== VIEWPORT IN ZELLEN =====
    const startGx = Math.floor(viewLeftPx / CONFIG.CELL_SIZE);
    const endGx = Math.ceil(viewRightPx / CONFIG.CELL_SIZE);
    const startGy = Math.floor(viewTopPx / CONFIG.CELL_SIZE);
    const endGy = Math.ceil(viewBottomPx / CONFIG.CELL_SIZE);
    
    // ===== FÜR JEDE SPIELER-ID ZEICHNEN =====
    const players = [
        { id: 'player', imgKey: 'grenze-rot' },
        { id: null, imgKey: 'grenze-blau' }
    ];
    
    if (SPLIT_SCREEN) {
        players.push({ id: 'player2', imgKey: 'grenze-blau' });
    }
    
    for (let player of players) {
        const img = buildingImages[player.imgKey];
        if (!img || !img.complete || img.naturalWidth === 0) continue;
        
        for (let gy = startGy; gy < endGy; gy++) {
            for (let gx = startGx; gx < endGx; gx++) {
                const status = getGrenzeStatus(gx, gy, player.id);
                if (!status.isBuildable) continue;
                
                // Prüfe die 4 Nachbarn (oben, unten, links, rechts)
                let isEdge = false;
                
                const statusUp = getGrenzeStatus(gx, gy - 1, player.id);
                if (!statusUp.isBuildable) isEdge = true;
                
                if (!isEdge) {
                    const statusDown = getGrenzeStatus(gx, gy + 1, player.id);
                    if (!statusDown.isBuildable) isEdge = true;
                }
                
                if (!isEdge) {
                    const statusLeft = getGrenzeStatus(gx - 1, gy, player.id);
                    if (!statusLeft.isBuildable) isEdge = true;
                }
                
                if (!isEdge) {
                    const statusRight = getGrenzeStatus(gx + 1, gy, player.id);
                    if (!statusRight.isBuildable) isEdge = true;
                }
                
                if (isEdge) {
                    const x = gx * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const y = gy * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    
                    if (x >= viewLeftPx && x <= viewRightPx && 
                        y >= viewTopPx && y <= viewBottomPx) {
                        ctx.drawImage(img, x - ICON_SIZE/2, y - ICON_SIZE/2, ICON_SIZE, ICON_SIZE);
                    }
                }
            }
        }
    }
    
    // ===== FEINDLICHE GRENZLINIEN (ABWECHSLENDE ICONS) =====
    const hasPlayer1 = grenzen.some(g => g.isActive && !g.isUnderConstruction);
    const hasNpc = npcGrenzen.some(g => g.isActive && !g.isUnderConstruction);
    const hasPlayer2 = SPLIT_SCREEN && player2Grenzen.some(g => g.isActive && !g.isUnderConstruction);
    
    if (hasPlayer1 && hasNpc) {
        drawEnemyBorder(ctx, 'player', null, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    }
    
    if (SPLIT_SCREEN && hasPlayer1 && hasPlayer2) {
        drawEnemyBorder(ctx, 'player', 'player2', viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
    }
}

// ===== HILFSFUNKTION: FEINDLICHE GRENZE ZEICHNEN =====
function drawEnemyBorder(ctx, playerA, playerB, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    const ICON_SIZE = 10;
    
    const imgA = buildingImages[playerA === 'player' ? 'grenze-rot' : 'grenze-blau'];
    const imgB = buildingImages[playerB === null ? 'grenze-blau' : 'grenze-rot'];
    
    if (!imgA || !imgA.complete || imgA.naturalWidth === 0) return;
    if (!imgB || !imgB.complete || imgB.naturalWidth === 0) return;
    
    const startGx = Math.floor(viewLeftPx / CONFIG.CELL_SIZE);
    const endGx = Math.ceil(viewRightPx / CONFIG.CELL_SIZE);
    const startGy = Math.floor(viewTopPx / CONFIG.CELL_SIZE);
    const endGy = Math.ceil(viewBottomPx / CONFIG.CELL_SIZE);
    
    let iconCounter = 0;
    
    for (let gy = startGy; gy < endGy; gy++) {
        for (let gx = startGx; gx < endGx; gx++) {
            const statusA = getGrenzeStatus(gx, gy, playerA);
            const statusB = getGrenzeStatus(gx, gy, playerB);
            
            // Nur wenn BEIDE Grenzen sich hier treffen
            if (statusA.inOwnGrenze && statusB.inOwnGrenze) {
                // Prüfe ob es eine Kante ist
                let isEdge = false;
                
                const neighbors = [
                    { dx: 0, dy: -1 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 },
                    { dx: 1, dy: 0 }
                ];
                
                for (let n of neighbors) {
                    const statusA_neighbor = getGrenzeStatus(gx + n.dx, gy + n.dy, playerA);
                    const statusB_neighbor = getGrenzeStatus(gx + n.dx, gy + n.dy, playerB);
                    if (!(statusA_neighbor.inOwnGrenze && statusB_neighbor.inOwnGrenze)) {
                        isEdge = true;
                        break;
                    }
                }
                
                if (isEdge) {
                    const x = gx * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const y = gy * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    
                    if (x >= viewLeftPx && x <= viewRightPx && 
                        y >= viewTopPx && y <= viewBottomPx) {
                        const useA = (iconCounter % 2 === 0);
                        const img = useA ? imgA : imgB;
                        ctx.drawImage(img, x - ICON_SIZE/2, y - ICON_SIZE/2, ICON_SIZE, ICON_SIZE);
                        iconCounter++;
                    }
                }
            }
        }
    }
}

// ============================================================
//  FUNKTION: drawAllBuildings() - KOMPLETT MIT drawTowerStatus()
// ============================================================
function drawAllBuildings(ctx, viewLeft, viewRight, viewTop, viewBottom, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    var allBuildings = [];
    for (var i = 0; i < buildings.length; i++) {
        var b = buildings[i];
        allBuildings.push({ ...b, isGrenze: false, owner: 'player' });
    }
    for (var i = 0; i < grenzen.length; i++) {
        var g = grenzen[i];
        allBuildings.push({ ...g, isGrenze: true, isNPC: false, playerId: 'player', owner: 'player' });
    }
    for (var i = 0; i < npcBuildings.length; i++) {
        var b = npcBuildings[i];
        allBuildings.push({ ...b, isGrenze: false, owner: 'npc' });
    }
    for (var i = 0; i < npcGrenzen.length; i++) {
        var g = npcGrenzen[i];
        allBuildings.push({ ...g, isGrenze: true, isNPC: true, playerId: null, owner: 'npc' });
    }

    var showGrid = selectedBuildingType || upgradeMode || destroyMode || !gameStarted;

    for (var bIdx = 0; bIdx < allBuildings.length; bIdx++) {
        var b = allBuildings[bIdx];
        if (b.gridX < viewLeft || b.gridX >= viewRight || b.gridY < viewTop || b.gridY >= viewBottom) continue;
        var x = b.gridX * CONFIG.CELL_SIZE;
        var y = b.gridY * CONFIG.CELL_SIZE;
        var cellSize = CONFIG.CELL_SIZE;

        // ===== GRENZKONTROLLE =====
        if (b.isGrenze) {
            var ownerKey = b.owner === 'npc' || b.isNPC ? 'blau' : 'rot';
            var imgKey = 'grenze-' + ownerKey;
            var img = buildingImages[imgKey];
            
            if (b.isUnderConstruction) {
                var progress = b.constructionProgress || 0;
                
                ctx.strokeStyle = '#8B6914';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y + cellSize);
                ctx.lineTo(x + cellSize, y + cellSize);
                ctx.stroke();
                
                if (img && img.complete && img.naturalWidth > 0) {
                    var clipHeight = cellSize * progress;
                    var clipY = y + cellSize - clipHeight;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, clipY, cellSize, clipHeight);
                    ctx.clip();
                    
                    ctx.globalAlpha = 0.7 + progress * 0.3;
                    ctx.drawImage(img, x, y, cellSize, cellSize);
                    ctx.globalAlpha = 1;
                    ctx.restore();
                }
            } else {
                if (img && img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, x, y, cellSize, cellSize);
                } else {
                    ctx.font = '20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🏰', x + cellSize / 2, y + cellSize / 2);
                }
                
                if (b.level > 1 && showGrid) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText('Lv' + b.level, x + 4, y + 4);
                }
                
                if (showGrid) {
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = '8px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(b.radius + '🔄', x + cellSize - 4, y + cellSize - 4);
                }
            }
            continue;
        }

        // ===== NORMALE GEBÄUDE =====
        if (b.beingCaptured && b.captureProgress > 0) {
            var flashSpeed = 8;
            var flashValue = Math.sin(performance.now() / 1000 * flashSpeed) * 0.5 + 0.5;
            var progress = b.captureProgress;
            var color;
            if (b.capturedBy === 'player') color = '#ffd966';
            else if (b.capturedBy === 'player2') color = '#ff8a65';
            else color = '#ff4444';
            ctx.strokeStyle = 'rgba(255, 215, 0, ' + (0.5 + flashValue * 0.5) + ')';
            ctx.lineWidth = 2 + flashValue * 2;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(x - 1, y - 1, cellSize + 2, cellSize + 2);
            ctx.setLineDash([]);
            var barX = x, barY = y - 8, barW = cellSize, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = color;
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.globalAlpha = 0.4 + flashValue * 0.4;
        }

        var ownerKey = 'rot';
        if (b.owner === 'npc' || b.isNPC) ownerKey = 'blau';
        else if (b.playerId === 'player2') ownerKey = 'blau';
        
        var imgKey = b.type + '-' + ownerKey;
        var img = buildingImages[imgKey];
        
        // ===== FORTSCHRITT VON UNTEN NACH OBEN (FÜR BAUSTELLEN) =====
        if (b.isUnderConstruction) {
            var progress = b.constructionProgress || 0;
            
            ctx.strokeStyle = '#8B6914';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y + cellSize);
            ctx.lineTo(x + cellSize, y + cellSize);
            ctx.stroke();
            
            if (img && img.complete && img.naturalWidth > 0) {
                var clipHeight = cellSize * progress;
                var clipY = y + cellSize - clipHeight;
                
                ctx.save();
                ctx.beginPath();
                ctx.rect(x, clipY, cellSize, clipHeight);
                ctx.clip();
                
                ctx.globalAlpha = 0.7 + progress * 0.3;
                ctx.drawImage(img, x, y, cellSize, cellSize);
                ctx.globalAlpha = 1;
                ctx.restore();
            }
        } else {
            // ===== FERTIGE GEBÄUDE =====
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, x, y, cellSize, cellSize);
            } else {
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                var emoji = '';
                if (b.type === 'lager') emoji = '';
                else if (b.type === 'bauer') emoji = '';
                else if (b.type === 'holzfaeller') emoji = '';
                else if (b.type === 'steinmetz') emoji = '';
                else if (b.type === 'wachturm') emoji = '';
                else if (b.type === 'fischerhütte') emoji = '';
                ctx.fillText(emoji, x + cellSize / 2, y + cellSize / 2);
            }

            if (b.level > 1 && !b.isUnderConstruction && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.level, x + cellSize / 2, y + cellSize / 2);
            }

            if (!b.isUnderConstruction) {
                // ===== HAUS =====
                if (b.type === 'haus' && showGrid) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(b.residents + '/' + b.maxResidents, x + 4, y + 4);
                }
                // ===== WACHTURM =====
                else if (b.type === 'wachturm' && showGrid) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(b.stoneAmmo + '/' + b.maxStoneAmmo, x + 4, y + 4);
                    if (b.doubleShot) {
                        ctx.fillStyle = '#ff66ff';
                        ctx.font = 'bold 8px sans-serif';
                        ctx.fillText('✧2', x + 28, y + 28);
                    }
                }
                // ===== FISCHERHÜTTE =====
                else if (b.type === 'fischerhütte' && showGrid) {
                    if (b.level > 1) {
                        ctx.fillStyle = '#1abc9c';
                        ctx.font = 'bold 8px sans-serif';
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'top';
                        ctx.fillText('Lv' + b.level, x + cellSize - 4, y + 4);
                    }
                }
                // ===== RESSOURCEN-GEBÄUDE (Bauer, Holzfäller, Steinmetz) =====
                else if ((b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && showGrid) {
                    var fishStorage = b.fishStorage || 0;
                    var maxFishStorage = b.maxFishStorage || 3;
                    ctx.fillStyle = fishStorage >= 3 ? '#2ecc71' : (fishStorage > 0 ? '#f1c40f' : '#e74c3c');
                    ctx.font = 'bold 8px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'top';
                    ctx.fillText('🐠' + fishStorage + '/' + maxFishStorage, x + cellSize - 4, y + 4);
                    
                    if (b.hasFishBonus) {
                        ctx.fillStyle = '#2ecc71';
                        ctx.font = 'bold 8px sans-serif';
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText('⚡+50%', x + 4, y + cellSize - 4);
                    } else if (fishStorage === 0 && b.fishBonusTimer > 60) {
                        ctx.fillStyle = '#e74c3c';
                        ctx.font = 'bold 8px sans-serif';
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText('🐌-25%', x + 4, y + cellSize - 4);
                    }
                }
            }
        }

        // ===== TOWER STATUS ZEICHNEN =====
        if (b.type === 'wachturm' && !b.isUnderConstruction) {
            drawTowerStatus(ctx, b, x, y, cellSize);
        }
    }
}

// ===== RESSOURCEN-FELDER ZEICHNEN =====

// ===== RESSOURCEN-FELDER ZEICHNEN (MIT FISCH ALS NORMALE RESSOURCE) =====
function drawResourceFields(ctx, playerType, viewLeft, viewRight, viewTop, viewBottom) {
    var buildingsList = [];
    var nodesList = [];
    var isNPC = false;
    var isPlayer2 = false;
    
    if (playerType === 'player') {
        buildingsList = buildings;
        nodesList = resourceNodes;
    } else if (playerType === 'npc') {
        buildingsList = npcBuildings;
        nodesList = npcResourceNodes;
        isNPC = true;
    } else if (playerType === 'player2') {
        buildingsList = player2Buildings;
        nodesList = player2ResourceNodes;
        isPlayer2 = true;
    } else {
        return;
    }
    
    var productionBuildings = [];
    for (var i = 0; i < buildingsList.length; i++) {
        var b = buildingsList[i];
        if (!b.isUnderConstruction && 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz' || b.type === 'fischerhütte')) {
            productionBuildings.push(b);
        }
    }
    
    for (var bIdx = 0; bIdx < productionBuildings.length; bIdx++) {
        var building = productionBuildings[bIdx];
        var fields;
        var resourceType;
        
        if (building.type === 'bauer') {
            fields = getBauerFields(building);
            resourceType = 'grain';
        } else if (building.type === 'holzfaeller') {
            fields = getHolzfaellerFields(building);
            resourceType = 'wood';
        } else if (building.type === 'steinmetz') {
            fields = getSteinmetzFields(building);
            resourceType = 'stone';
        } else if (building.type === 'fischerhütte') {
            fields = getFischerhütteFields(building);
            resourceType = 'fish';
        }
        
        if (!fields || fields.length === 0) continue;
        
        var node = null;
        for (var nIdx = 0; nIdx < nodesList.length; nIdx++) {
            if (nodesList[nIdx].buildingId === building.id) {
                node = nodesList[nIdx];
                break;
            }
        }
        
        var progress = 0;
        if (node && node.maxTimer > 0) {
            progress = Math.min(1, node.timer / node.maxTimer);
        }
        
        for (var fIdx = 0; fIdx < fields.length; fIdx++) {
            var field = fields[fIdx];
            if (field.x < viewLeft || field.x >= viewRight || field.y < viewTop || field.y >= viewBottom) continue;
            
            var x = field.x * CONFIG.CELL_SIZE;
            var y = field.y * CONFIG.CELL_SIZE;
            var cellSize = CONFIG.CELL_SIZE;
            
            var isHarvested = false;
            var isBeingHarvested = false;
            if (node && node.fields) {
                for (var nfIdx = 0; nfIdx < node.fields.length; nfIdx++) {
                    var fieldData = node.fields[nfIdx];
                    if (fieldData.x === field.x && fieldData.y === field.y) {
                        isHarvested = fieldData.harvested;
                        isBeingHarvested = fieldData.isBeingHarvested;
                        break;
                    }
                }
            }
            
            if (isHarvested) {
                continue;
            }
            
            var icon = resourceType === 'grain' ? '🌾' : 
                       resourceType === 'wood' ? '🌳' : 
                       resourceType === 'stone' ? '🪨' : '🐠';
            
            // ===== HOLZFÄLLER: 1 GROSSES ICON, WÄCHST =====
            if (building.type === 'holzfaeller') {
                var iconSize = cellSize * 0.7 * progress;
                var centerX = x + cellSize / 2;
                var centerY = y + cellSize - 4;
                
                ctx.font = iconSize + 'px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = '#000000';
                ctx.fillText('🌳', centerX, centerY);
                continue;
            }
            
         // ===== BAUER: 9 ICONS, ALLE GLEICHZEITIG WACHSEND =====
            if (building.type === 'bauer') {
                var iconSize = (cellSize - 6) / 5;
                var startX = x + 3;
                var startY = y + 3;
                
                for (var row = 0; row < 5; row++) {
                    for (var col = 0; col < 5; col++) {
                        var ix = startX + col * iconSize + iconSize / 2;
                        var iy = startY + row * iconSize + iconSize / 2;
                        
                        var currentIconSize = iconSize * 0.7 * progress;
                        var iconBottom = iy + iconSize / 2;
                        
                        ctx.font = currentIconSize + 'px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillStyle = '#000000';
                        ctx.fillText('🌾', ix, iconBottom);
                    }
                }
            }


            
            // ===== STEINMETZ: 9 ICONS, NACHEINANDER =====
            if (building.type === 'steinmetz') {
                var iconSize = (cellSize - 6) / 3;
                var startX = x + 3;
                var startY = y + 3;
                
                var totalIcons = 9;
                var visibleIcons = Math.floor(progress * totalIcons);
                var iconOrder = [0,1,2, 3,4,5, 6,7,8];
                
                for (var idx = 0; idx < totalIcons; idx++) {
                    var pos = iconOrder[idx];
                    var row = Math.floor(pos / 3);
                    var col = pos % 3;
                    var drawIcon = (idx < visibleIcons);
                    
                    var ix = startX + col * iconSize + iconSize / 2;
                    var iy = startY + row * iconSize + iconSize / 2;
                    
                    ctx.font = (iconSize * 0.7) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    if (drawIcon) {
                        ctx.fillStyle = '#000000';
                        ctx.fillText('🪨', ix, iy);
                    }
                }
            }
            
            // ===== FISCHERHÜTTE: 9 ICONS, NACHEINANDER =====
            if (building.type === 'fischerhütte') {
                var iconSize = (cellSize - 6) / 3;
                var startX = x + 3;
                var startY = y + 3;
                
                var totalIcons = 9;
                var visibleIcons = Math.floor(progress * totalIcons);
                var iconOrder = [0,1,2, 3,4,5, 6,7,8];
                
                for (var idx = 0; idx < totalIcons; idx++) {
                    var pos = iconOrder[idx];
                    var row = Math.floor(pos / 3);
                    var col = pos % 3;
                    var drawIcon = (idx < visibleIcons);
                    
                    var ix = startX + col * iconSize + iconSize / 2;
                    var iy = startY + row * iconSize + iconSize / 2;
                    
                    ctx.font = (iconSize * 0.7) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    if (drawIcon) {
                        ctx.fillStyle = '#000000';
                        ctx.fillText('🐠', ix, iy);
                    }
                }
            }
            
            // ===== RAHMEN FÜR AKTIVES FELD =====
            if (isBeingHarvested) {
                ctx.strokeStyle = isNPC ? '#9b59b6' : (isPlayer2 ? '#ff8a65' : '#ffd966');
                ctx.lineWidth = 2;
                ctx.setLineDash([2, 3]);
                ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
                ctx.setLineDash([]);
            }
        }
    }
}



// ===== RESSOURCEN-NODES ZEICHNEN =====
function drawResourceNodes(ctx, nodes, viewLeft, viewRight, viewTop, viewBottom, showGrid, isNPC) {
    for (let node of nodes) {
        if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
        
        const x = node.x * CONFIG.CELL_SIZE;
        const y = node.y * CONFIG.CELL_SIZE;
        
       
        
        
        // ===== FELD-ANZAHL =====
        if (node.fieldCount > 1 && showGrid) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`${node.fieldCount}`, x + CONFIG.CELL_SIZE - 2, y + CONFIG.CELL_SIZE - 10);
        }
    }
}

//  FUNKTION 1: drawTowerStatus()
// ============================================================
// ============================================================
//  FUNKTION: drawTowerStatus() - HAUS-WEBP GETRENNT VON 🚫
// ============================================================
function drawTowerStatus(ctx, tower, x, y, cellSize) {
    if (tower.type !== 'wachturm') return;
    if (tower.isUnderConstruction) return;
    
    // ===== TURM BRAUCHT KEINE STEINE =====
    if (tower.stoneAmmo >= tower.maxStoneAmmo) return;
    
    // ===== PRÜFE OB MINDESTENS 1 HAUS IN REICHWEITE (10 Zellen) =====
    let hasHouseNearby = false;
    const searchRadius = 10;
    let buildingsList = [];
    
    if (tower.playerId === 'player2') {
        buildingsList = player2Buildings;
    } else if (tower.isNPC) {
        buildingsList = npcBuildings;
    } else {
        buildingsList = buildings;
    }
    
    for (let b of buildingsList) {
        if (b.type !== 'haus') continue;
        if (b.isUnderConstruction) continue;
        const dist = Math.hypot(b.gridX - tower.gridX, b.gridY - tower.gridY);
        if (dist <= searchRadius) {
            hasHouseNearby = true;
            break;
        }
    }
    
    if (hasHouseNearby) return;
    
    // ===== HAUS-WEBP (GETRENNT VON 🚫) =====
    const houseImgKey = tower.playerId === 'player2' ? 'haus-blau' : 
                        tower.isNPC ? 'haus-blau' : 'haus-rot';
    const houseImg = buildingImages[houseImgKey];
    const iconSize = cellSize * 0.4;
    const cx = x + cellSize/2;
    const houseCy = y + 6;  // HAUS 8px TIEFER
    
    if (houseImg && houseImg.complete && houseImg.naturalWidth > 0) {
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.drawImage(houseImg, cx - iconSize/2, houseCy - iconSize, iconSize, iconSize);
        ctx.restore();
    }
    
    // ===== 🚫 (BLEIBT OBEN) =====
    ctx.save();
    const radius = iconSize * 0.55;
    const iconCy = y + 2 - iconSize * 0.25;  // 🚫 BLEIBT AUF y + 2
    
    ctx.beginPath();
    ctx.arc(cx, iconCy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(cx - radius * 0.6, iconCy - radius * 0.6);
    ctx.lineTo(cx + radius * 0.6, iconCy + radius * 0.6);
    ctx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.restore();
}

function drawTowerRanges(ctx, viewLeft, viewRight, viewTop, viewBottom) {
    let allTowers = buildings.filter(b => b.type === 'wachturm');
    for (let tower of allTowers) {
        if (tower.isUnderConstruction) continue;
        if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
        const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        ctx.beginPath();
        ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,0,0.08)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    let npcTowers = npcBuildings.filter(b => b.type === 'wachturm');
    for (let tower of npcTowers) {
        if (tower.isUnderConstruction) continue;
        if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
        const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        ctx.beginPath();
        ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(155,89,182,0.08)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(155,89,182,0.3)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawProjectiles(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    for (let p of projectiles) {
        if (p.x < viewLeftPx || p.x > viewRightPx || p.y < viewTopPx || p.y > viewBottomPx) continue;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.targetX, p.targetY);
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function drawHitEffects(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    for (let effect of hitEffects) {
        if (effect.x < viewLeftPx || effect.x > viewRightPx || effect.y < viewTopPx || effect.y > viewBottomPx) continue;
        for (let p of effect.particles) {
            if (p.life <= 0) continue;
            const alpha = Math.max(0, p.life / p.maxLife);
            const size = Math.max(0.5, 2 + (1 - alpha) * 4);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color || `rgb(255,${Math.floor(50 * alpha)},${Math.floor(50 * alpha)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = p.color || '#ff0000';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }
}

function drawVillagers(ctx, villagersList, playerType, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    for (let v of villagersList) {
        if (!v.alive) continue;
        
        // NUR IDLE AUSBLENDEN, WENN ER AM HAUS STEHT
        if (v.state === 'idle') {
            let home = null;
            if (playerType === 'player') {
                home = buildings.find(b => b.id === v.homeId);
            } else if (playerType === 'npc') {
                home = npcBuildings.find(b => b.id === v.homeId);
            }
            if (home) {
                const homeX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const homeY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const distToHome = Math.hypot(v.x - homeX, v.y - homeY);
                if (distToHome < 10) continue;
            }
        }
        
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            drawVillager(ctx, v, playerType === 'player' ? 'player' : 'npc', v.x, v.y, CONFIG.CELL_SIZE);
        }
    }
}

// ===== DRACHEN ZEICHNEN =====
// ===== DRACHEN ZEICHNEN =====
function drawDragons(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    for (let dragon of dragons) {
        if (!dragon.alive) continue;
        if (dragon.x < viewLeftPx || dragon.x > viewRightPx || dragon.y < viewTopPx || dragon.y > viewBottomPx) continue;
        
        const size = dragon.size;
        
        if (dragonImage && dragonImage.complete && dragonImage.naturalWidth > 0) {
            ctx.save();
            ctx.translate(dragon.x, dragon.y);
            // ===== KOPF ZEIGT NACH OBEN =====
            // -PI/2 + PI = PI/2 (weil der Kopf im Bild unten ist)
            // ODER: -PI/2 + dragon.rotation + PI
            ctx.rotate(Math.PI / 2 + dragon.rotation);
            ctx.drawImage(dragonImage, -size/2, -size/2, size, size);
            ctx.restore();
        } else {
            // Fallback
            ctx.beginPath();
            ctx.arc(dragon.x, dragon.y, size/2, 0, Math.PI * 2);
            ctx.fillStyle = '#8B0000';
            ctx.fill();
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐉', dragon.x, dragon.y);
        }
        
        // ===== LEBENSBALKEN =====
        const barWidth = 30;
        const barHeight = 4;
        const barX = dragon.x - barWidth / 2;
        const barY = dragon.y - size / 2 - 10;
        
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        
        const healthPercent = 1 - (dragon.hits / dragon.maxHits);
        ctx.fillStyle = healthPercent > 0.5 ? '#2ecc71' : (healthPercent > 0.25 ? '#f1c40f' : '#e74c3c');
        ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barWidth, barHeight);
        
        // ===== LEBENS-TEXT =====
        ctx.fillStyle = 'white';
        ctx.font = 'bold 8px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`${dragon.maxHits - dragon.hits}/${dragon.maxHits}`, dragon.x, barY - 2);
    }
}

// ===== DRACHEN-PROJEKTILE ZEICHNEN =====
function drawDragonProjectiles(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    const flameImg = document.getElementById('flameImg');
    
    for (let p of dragonProjectiles) {
        if (p.x < viewLeftPx || p.x > viewRightPx || p.y < viewTopPx || p.y > viewBottomPx) continue;
        
        // ===== FEUERKUGEL (flamme.webp 90° gedreht) =====
        if (flameImg && flameImg.complete && flameImg.naturalWidth > 0) {
            const size = 20 + Math.sin(p.life * 10) * 3;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(Math.PI / 2); // 90° drehen
            ctx.drawImage(flameImg, -size/2, -size/2, size, size);
            ctx.restore();
        } else {
            // Fallback
            ctx.beginPath();
            ctx.arc(p.x, p.y, 10 + Math.sin(p.life * 10) * 2, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
            gradient.addColorStop(0, '#ffcc00');
            gradient.addColorStop(0.3, '#ff6600');
            gradient.addColorStop(1, '#ff0000');
            ctx.fillStyle = gradient;
            ctx.fill();
        }
        
        // ===== LEUCHTEFFEKT =====
        ctx.shadowColor = '#ff4400';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 200, 50, 0.5)';
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function drawEnemies(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx) {
    for (let e of enemies) {
        if (!e.alive) continue;
        if (e.x < viewLeftPx || e.x > viewRightPx || e.y < viewTopPx || e.y > viewBottomPx) continue;
        
        const imgKey = e.isSuper ? 'zombie-super' : 'zombie';
        const img = enemyImages[imgKey];
        const size = e.isSuper ? CONFIG.CELL_SIZE * 0.9 : CONFIG.CELL_SIZE * 0.7;
        const offset = (CONFIG.CELL_SIZE - size) / 2;
        
        // ===== OPTIMIERTE GECACHTE ZEICHNUNG =====
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, e.x - size/2, e.y - size/2 + 6, size, size);
        } else {
            // Fallback
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.isSuper ? 8 : 5, 0, Math.PI * 2);
            ctx.fillStyle = e.isSuper ? '#ff00ff' : '#e74c3c';
            ctx.fill();
            ctx.strokeStyle = e.isSuper ? '#880088' : '#922b21';
            ctx.lineWidth = e.isSuper ? 2 : 1;
            ctx.stroke();
        }
        
        if (e.isSuper && e.hits < e.maxHits) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${e.maxHits - e.hits}`, e.x, e.y - 12);
        }
    }
}

// ===== ALLE BILDER VORAB LADEN (FÜR SMOOTHES GAMEPLAY) =====

function preloadimages(callback) {
    // ===== ALLE BENÖTIGTEN BILDTYPEN =====
    const buildingTypes = ['haus', 'lager', 'bauer', 'holzfaeller', 'steinmetz', 'wachturm', 'grenze', 'fischerhütte'];
    const colors = ['rot', 'blau'];
    const villagerTypes = ['idle', 'bauer', 'holzfaeller', 'steinmetz', 'baumeister', 'steintraeger', 'krieger', 'angler'];
    const enemyTypes = ['zombie', 'zombie-super'];
    const dragonTypes = ['drache'];  // ← NEU: Drache
    
    // Alle Images zählen
    let totalImages = buildingTypes.length * colors.length + 
                      villagerTypes.length * colors.length + 
                      enemyTypes.length + 
                      dragonTypes.length +  // ← NEU: Drache
                      2; // +1 für Ghost +1 für Explosion
    
    let loadedImages = 0;
    let hasErrors = false;
    
    function checkComplete() {
        loadedImages++;
        if (loadedImages >= totalImages) {
            console.log(`✅ Alle ${totalImages} Bilder geladen!${hasErrors ? ' (mit Fehlern)' : ''}`);
            if (callback) callback();
            renderDirty = true;
            markDirty('all');
        }
    }
    
    // ===== 1. BUILDING IMAGES =====
    for (let type of buildingTypes) {
        for (let color of colors) {
            const key = `${type}-${color}`;
            const cacheKey = `building_${key}`;
            
            if (buildingImageCache.has(cacheKey)) {
                buildingImages[key] = buildingImageCache.get(cacheKey);
                checkComplete();
                continue;
            }
            
            const img = new Image();
            img.onload = () => {
                buildingImages[key] = img;
                buildingImageCache.set(cacheKey, img);
                checkComplete();
            };
            img.onerror = () => {
                console.warn(`⚠️ Bild nicht gefunden: images/${key}.webp`);
                buildingImages[key] = null;
                hasErrors = true;
                checkComplete();
            };
            img.src = `images/${key}.webp`;
            buildingImages[key] = img;
        }
    }
    
    // ===== 2. VILLAGER IMAGES =====
    for (let type of villagerTypes) {

// ===== DREHT EIN BILD UM 180° (FÜR SPIELER 1) =====
function drawRotatedImage(ctx, img, x, y, width, height, rotate = false) {
    if (!img || !img.complete || img.naturalWidth === 0) {
        ctx.fillStyle = '#888';
        ctx.fillRect(x, y, width, height);
        return;
    }
    
    if (rotate) {
        ctx.save();
        ctx.translate(x + width/2, y + height/2);
        ctx.rotate(Math.PI);
        ctx.drawImage(img, -width/2, -height/2, width, height);
        ctx.restore();
    } else {
        ctx.drawImage(img, x, y, width, height);
    }
}

// ===== DREHT EINEN VILLAGER UM 180° (FÜR SPIELfunction 

function drawRotatedVillager(ctx, v, playerId, x, y, cellSize, rotate = false) {
    if (!v.alive) return;
    
    let color = 'blau';
    if (playerId === 'player' && !v.isNPC) color = 'rot';
    
    let type = 'idle';
    
    if (v.isAttacking || v.state === 'attacking' || v.state === 'movingToCapture') {
        type = 'krieger';
    } else if (v.isBuilding || v.state === 'building') {
        type = 'baumeister';
    } else if (v.state === 'deliveringStoneToTower') {
        if (v.carrying === 'stone') {
            type = 'steintraeger';
        } else {
            type = 'idle';
        }
    } else if (v.state === 'harvestingField' || v.state === 'returningHome') {
        // ===== FISCH-ABFRAGE MUSS VOR DEN ANDEREN KOMMEN! =====
        if (v.carrying === 'fish' || (v.resourceTarget && v.resourceTarget.type === 'fish')) {
            type = 'angler';
        } else if (v.carrying === 'grain' || (v.resourceTarget && v.resourceTarget.type === 'grain')) {
            type = 'bauer';
        } else if (v.carrying === 'wood' || (v.resourceTarget && v.resourceTarget.type === 'wood')) {
            type = 'holzfaeller';
        } else if (v.carrying === 'stone' || (v.resourceTarget && v.resourceTarget.type === 'stone')) {
            type = 'steinmetz';
        }
    } else if (v.state === 'movingToResource') {
        // ===== AUCH BEI movingToResource FISCH ERKENNEN =====
        if (v.resourceTarget && v.resourceTarget.type === 'fish') {
            type = 'angler';
        }
    }
    
    const key = `${type}-${color}`;
    const img = villagerImages[key];
    
    const size = cellSize * 0.7;
    const yOffset = 3;
    
    if (img && img.complete && img.naturalWidth > 0) {
        if (rotate) {
            ctx.save();
            ctx.translate(x + cellSize/2, y + cellSize/2 + yOffset);
            ctx.rotate(Math.PI);
            ctx.drawImage(img, -size/2, -size/2, size, size);
            ctx.restore();
        } else {
            ctx.drawImage(img, x - size/2, y - size/2 + yOffset, size, size);
        }
    } else {
        let fallbackColor = color === 'rot' ? '#c0392b' : '#2980b9';
        ctx.beginPath();
        ctx.arc(x + cellSize/2, y + cellSize/2 + yOffset, 4, 0, Math.PI * 2);
        ctx.fillStyle = fallbackColor;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }
}

// ===== GRENZEN MIT DREHUNG (FÜR SPIELER 1) =====
function drawGrenzenRotated(ctx, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx, playerId, shouldRotate) {
    const ICON_SIZE = 10;
    
    // ===== ALLE GRENZEN SAMMELN =====
    let allGrenzen = [];
    
    // Spieler 1 Grenzen
    for (let g of grenzen) {
        if (!g.isActive) continue;
        if (g.isUnderConstruction) continue;
        allGrenzen.push({ ...g, owner: 'player' });
    }
    
    // Spieler 2 Grenzen (nur im Split-Modus)
    if (SPLIT_SCREEN) {
        for (let g of player2Grenzen) {
            if (!g.isActive) continue;
            if (g.isUnderConstruction) continue;
            allGrenzen.push({ ...g, owner: 'player2' });
        }
    }
    
    // NPC Grenzen (nur im Einzelmodus)
    if (!SPLIT_SCREEN) {
        for (let g of npcGrenzen) {
            if (!g.isActive) continue;
            if (g.isUnderConstruction) continue;
            allGrenzen.push({ ...g, owner: 'npc' });
        }
    }
    
    // ===== FÜR JEDE GRENZE DIE RAND-PUNKTE ZEICHNEN =====
    for (let grenze of allGrenzen) {
        // Bestimme Farbe basierend auf Besitzer
        let imgKey;
        if (grenze.owner === 'player') {
            imgKey = 'grenze-rot';
        } else if (grenze.owner === 'player2') {
            imgKey = 'grenze-blau';
        } else {
            imgKey = 'grenze-blau';
        }
        
        const img = buildingImages[imgKey];
        if (!img || !img.complete || img.naturalWidth === 0) continue;
        
        const radius = Math.floor(grenze.radius);
        const gx0 = grenze.gridX;
        const gy0 = grenze.gridY;
        
        // NUR RAND-PUNKTE (innerhalb des Viewports)
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                if (Math.hypot(dx, dy) > radius) continue;
                
                const gx = gx0 + dx;
                const gy = gy0 + dy;
                
                // Prüfe ob Punkt auf dem Rand liegt
                let isEdge = false;
                const neighbors = [
                    { dx: 0, dy: -1 }, { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 }, { dx: 1, dy: 0 }
                ];
                
                for (let n of neighbors) {
                    const nx = gx + n.dx;
                    const ny = gy + n.dy;
                    const dist = Math.hypot(nx - gx0, ny - gy0);
                    if (dist > radius) {
                        isEdge = true;
                        break;
                    }
                }
                
                if (isEdge) {
                    const x = gx * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const y = gy * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    
                    if (x >= viewLeftPx && x <= viewRightPx && 
                        y >= viewTopPx && y <= viewBottomPx) {
                        
                        if (shouldRotate) {
                            ctx.save();
                            ctx.translate(x, y);
                            ctx.rotate(Math.PI);
                            ctx.drawImage(img, -ICON_SIZE/2, -ICON_SIZE/2, ICON_SIZE, ICON_SIZE);
                            ctx.restore();
                        } else {
                            ctx.drawImage(img, x - ICON_SIZE/2, y - ICON_SIZE/2, ICON_SIZE, ICON_SIZE);
                        }
                    }
                }
            }
        }
    }
}

// ===== RESSOURCEN-NODES MIT DREHUNG (FÜR SPIELER 1) =====
function drawResourceNodesRotated(ctx, nodes, viewLeft, viewRight, viewTop, viewBottom, showGrid, isNPC, shouldRotate) {
    for (let node of nodes) {
        if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
        
        const x = node.x * CONFIG.CELL_SIZE;
        const y = node.y * CONFIG.CELL_SIZE;
        
        // ===== HINTERGRUNDFARBE - Kräftiger wenn ready =====
        let bgColor = 'rgba(255,255,255,0.08)';
        let icon = '';
        let iconSize = '16px';
        
        if (node.type === 'fish') {
            if (node.ready) {
                bgColor = 'rgba(30, 144, 255, 0.4)';
                icon = '🐠';
            } else {
                bgColor = 'rgba(30, 144, 255, 0.12)';
                icon = '🐠';
            }
        } else if (node.type === 'grain') {
            if (node.ready) {
                bgColor = 'rgba(255, 215, 0, 0.4)';
                icon = '🌾';
            } else {
                bgColor = 'rgba(255, 215, 0, 0.12)';
                icon = '🌾';
            }
        } else if (node.type === 'wood') {
            if (node.ready) {
                bgColor = 'rgba(139, 69, 19, 0.4)';
                icon = '🌳';
            } else {
                bgColor = 'rgba(139, 69, 19, 0.12)';
                icon = '🌳';
            }
        } else if (node.type === 'stone') {
            if (node.ready) {
                bgColor = 'rgba(128, 128, 128, 0.4)';
                icon = '🪨';
            } else {
                bgColor = 'rgba(128, 128, 128, 0.12)';
                icon = '🪨';
            }
        }
        
        // ===== HINTERGRUND ZEICHNEN =====
        ctx.fillStyle = bgColor;
        ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE  - 4);
        
        // ===== ICON ZEICHNEN (kräftiger wenn ready) =====
        if (node.ready) {
            ctx.globalAlpha = 1.0;
            iconSize = '20px';
        } else {
            ctx.globalAlpha = 0.5;
            iconSize = '16px';
        }
        
        ctx.font = `bold ${iconSize} sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        if (shouldRotate) {
            ctx.save();
            ctx.translate(x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
            ctx.rotate(Math.PI);
            ctx.fillText(icon, 0, 0);
            ctx.restore();
        } else {
            ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
        }
        ctx.globalAlpha = 1;
        
        // ===== FORTSCHRITTSBALKEN =====
        const barX = x + 4;
        const barY = shouldRotate ? y + 4 : y + CONFIG.CELL_SIZE - 8;
        const barW = CONFIG.CELL_SIZE - 8;
        const barH = 4;
        const progress = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
        
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);
        
        let barColor = node.ready ? '#2ecc71' : '#f39c12';
        if (isNPC) barColor = node.ready ? '#66ff66' : '#ff9966';
        ctx.fillStyle = barColor;
        if (shouldRotate) {
            ctx.fillRect(barX + barW * (1 - progress), barY, barW * progress, barH);
        } else {
            ctx.fillRect(barX, barY, barW * progress, barH);
        }
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barW, barH);
        
        // ===== FELD-ANZAHL =====
        if (node.fieldCount > 1 && showGrid) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '8px sans-serif';
            if (shouldRotate) {
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${node.fieldCount}`, x + 2, y + 2);
            } else {
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`${node.fieldCount}`, x + CONFIG.CELL_SIZE - 2, y + CONFIG.CELL_SIZE - 10);
            }
        }
        
        // ===== CLAIMED STATUS =====
        if (node.claimedBy) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
    }
}

// ===== BRENNENDES GEBÄUDE MIT DREHUNG (FÜR SPIELER 1) =====
function drawBurningBuildingRotated(ctx, fire, x, y, cellSize, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx, shouldRotate) {
    const centerX = x + cellSize / 2;
    const centerY = y + cellSize / 2;
    
    if (centerX < viewLeftPx || centerX > viewRightPx || centerY < viewTopPx || centerY > viewBottomPx) return;
    if (!fire || !fire.particles) return;
    
    // Flammen zeichnen
    const flameImg = document.getElementById('flameImg');
    if (flameImg && flameImg.complete && flameImg.naturalWidth > 0) {
        const scale = 0.8 + Math.sin(performance.now() / 1000 * 3 + fire.burnTimer) * 0.2;
        const size = Math.max(1, cellSize * 0.6 * scale);
        if (shouldRotate) {
            ctx.save();
            ctx.translate(centerX, centerY + cellSize * 0.2);
            ctx.rotate(Math.PI);
            ctx.drawImage(flameImg, -size/2, -size/2, size, size);
            ctx.restore();
        } else {
            ctx.save();
            ctx.translate(centerX, centerY - cellSize * 0.2);
            ctx.drawImage(flameImg, -size/2, -size/2, size, size);
            ctx.restore();
        }
    } else {
        ctx.font = `${Math.max(10, cellSize * 0.6)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (shouldRotate) {
            ctx.save();
            ctx.translate(centerX, centerY + cellSize * 0.2);
            ctx.rotate(Math.PI);
            ctx.fillText('🔥', 0, 0);
            ctx.restore();
        } else {
            ctx.fillText('🔥', centerX, centerY - cellSize * 0.2);
        }
    }
    
    // Rauchpartikel
    const alpha = Math.min(1, Math.max(0, fire.burnTimer / fire.maxBurnTime));
    for (let p of fire.particles) {
        if (!p) continue;
        const lifeRatio = Math.max(0, Math.min(1, p.life / p.maxLife));
        const sizeMultiplier = 1 + (1 - lifeRatio) * 2;
        const size = Math.max(0.5, (p.size || 2) * sizeMultiplier);
        
        let px = centerX + (p.x || 0) + (Math.random() - 0.5) * 2;
        let py = centerY + (p.y || 0) + (1 - lifeRatio) * 30;
        
        if (shouldRotate) {
            // Rauchpartikel um 180° drehen
            const dx = px - centerX;
            const dy = py - centerY;
            px = centerX - dx;
            py = centerY - dy;
        }
        
        const particleAlpha = Math.max(0, lifeRatio * 0.4 * alpha);
        if (particleAlpha > 0.01) {
            ctx.globalAlpha = particleAlpha;
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(px, py, Math.max(0.1, size), 0, Math.PI * 2);
            ctx.fill();
            
            const lightAlpha = Math.max(0, lifeRatio * 0.2 * alpha);
            if (lightAlpha > 0.01) {
                ctx.fillStyle = '#ccc';
                ctx.globalAlpha = lightAlpha;
                ctx.beginPath();
                ctx.arc(px - 2, py - 3, Math.max(0.1, size * 0.7), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
    ctx.globalAlpha = 1;
}
