                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (P2) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingDestroyP2 = true;
                return;
            }
            showTemporaryMessage('❌ Kein Gebäude zum Abreissen gefunden!', '#ff6b6b', true);
            return;
        }

        if (upgradeModeP2) {
            const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
            const grenze = player2Grenzen.find(g => g.gridX === gx && g.gridY === gy);
            if (grenze && grenze.level < 3) {
                pendingUpgradeP2 = { building: grenze, isGrenze: true, gx, gy };
                const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `🟣 Grenzkontrolle (P2) auf Stufe ${grenze.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone}🪨`;
                document.getElementById('effectDisplay').textContent = `Effekt: Radius ${grenze.radius} → ${effect.radius || grenze.radius + 5} Zellen`;
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingUpgradeP2 = true;
                return;
            } else if (building && building.level < 3) {
                pendingUpgradeP2 = { building, isGrenze: false, gx, gy };
                const { cost, effect } = getUpgradeCostAndEffect(building);
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (P2) auf Stufe ${building.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone > 0 ? cost.stone + '🪨' : ''}`;
                document.getElementById('effectDisplay').textContent = `Effekt: ${effect.desc}`;
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingUpgradeP2 = true;
                return;
            }
            showTemporaryMessage('❌ Kein Gebäude zum Upgraden gefunden!', '#ff6b6b', true);
            upgradeModeP2 = false;
            document.getElementById('upgradeBtnSplit2').classList.remove('active');
            return;
        }

        if (selectedBuildingTypeP2) {
            if (pendingBuildP2 && pendingBuildP2.gx === gx && pendingBuildP2.gy === gy) {
                if (startConstructionPlayer2(selectedBuildingTypeP2, pendingBuildP2.gx, pendingBuildP2.gy)) {
                    pendingBuildP2 = null;
                    showTemporaryMessage(`🔨 ${selectedBuildingTypeP2} wird gebaut... (10s)`, '#ffd966', true);
                }
            } else {
                pendingBuildP2 = { gx, gy };
            }
            return;
        }
    }
}

// ===== DIALOG-ROTATION ANWENDEN =====
function applyDialogRotation() {
    const dialog = document.getElementById('confirmDialog');
    if (!dialog) return;

    const confirmText = document.getElementById('confirmText');
    const costDisplay = document.getElementById('costDisplay');
    const effectDisplay = document.getElementById('effectDisplay');

    if (SPLIT_SCREEN && dialogNeedsRotation) {
        if (confirmText) confirmText.style.transform = 'rotate(180deg)';
        if (costDisplay) costDisplay.style.transform = 'rotate(180deg)';
        if (effectDisplay) effectDisplay.style.transform = 'rotate(180deg)';
        dialog.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    } else {
        if (confirmText) confirmText.style.transform = 'rotate(0deg)';
        if (costDisplay) costDisplay.style.transform = 'rotate(0deg)';
        if (effectDisplay) effectDisplay.style.transform = 'rotate(0deg)';
        dialog.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    }
}

            window._pendingGrenzeUpgradeId = grenze.id;
        } else {
            showTemporaryMessage('❌ Nicht genug Ressourcen für Upgrade!', '#ff6b6b');
        }
    }
}

// ===== HANDLE CONFIRM YES =====
function handleConfirmYes() {
    // ===== SPLIT-START / NETZWERK-START =====
    if (window._pendingSplitStart && pendingSplitStart) {
        if (NETWORK_MODE) {
            if (IS_HOST) {
                const isPlayer1Phase = splitStartPhase.startsWith('player1');
                if (isPlayer1Phase) {
                    const success = placeSplitStartBuilding('player1', pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy);
                    if (success) {
                        advanceNetworkStart();
                        sendDeltaSnapshot();
                        const typeName = pendingSplitStart.type === 'grenze' ? 'Grenzkontrolle' : pendingSplitStart.type;
                        showTemporaryMessage(`✅ Host ${typeName} platziert!`, pendingSplitStart.type === 'grenze' ? '#9b59b6' : '#2ecc71', true);
                        markDirty();
                        renderDirty = true;
                    }
                }
            } else {
                const isPlayer1Phase = splitStartPhase.startsWith('player1');
                if (!isPlayer1Phase) {
                    const success = placeSplitStartBuilding('player2', pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy);
                    if (success) {
                        const building = pendingSplitStart.type === 'grenze' ?
                            player2Grenzen.find(b => b.gridX === pendingSplitStart.gx && b.gridY === pendingSplitStart.gy) :
                            player2Buildings.find(b => b.gridX === pendingSplitStart.gx && b.gridY === pendingSplitStart.gy);
                        const action = {
                            type: 'build_start_building',
                            player: 'player2',
                            buildingType: pendingSplitStart.type,
                            gridX: pendingSplitStart.gx,
                            gridY: pendingSplitStart.gy,
                            resources: {
                                grain: player2Resources.grain,
                                wood: player2Resources.wood,
                                stone: player2Resources.stone
                            },
                            buildingId: building ? building.id : null,
                            isGrenze: pendingSplitStart.type === 'grenze'
                        };
                        window.sendNetworkAction(action);
                        const typeName = pendingSplitStart.type === 'grenze' ? 'Grenzkontrolle' : pendingSplitStart.type;
                        showTemporaryMessage(`✅ ${typeName} platziert! Warte auf Host...`, pendingSplitStart.type === 'grenze' ? '#d7bde2' : '#2ecc71', true);
                        markDirty();
                        renderDirty = true;
                    }
                }
            }
            pendingSplitStart = null;
            window._pendingSplitStart = false;
            document.getElementById('confirmDialog').style.display = 'none';
            dialogNeedsRotation = false;
            dialogIsUrgent = false;
            markDirty();
            return;
        }

        if (SPLIT_SCREEN) {
            if (placeSplitStartBuilding(pendingSplitStart.player, pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy)) {
                pendingSplitStart = null;
                window._pendingSplitStart = false;
                advanceSplitStart();
            } else {
                pendingSplitStart = null;
                window._pendingSplitStart = false;
            }
            document.getElementById('confirmDialog').style.display = 'none';
            dialogNeedsRotation = false;
            dialogIsUrgent = false;
            markDirty();
            return;
        }
    }

    // ===== EINZELMODUS START GRENZKONTROLLE =====
    if (window._pendingStartType === 'grenze' && pendingStartBuild) {
        const g = new Grenzkontrolle(nextGrenzeId++, pendingStartBuild.gx, pendingStartBuild.gy, 'player', false);
        g.isUnderConstruction = false;
        g.constructionProgress = 1;
        g.radius = CONFIG.GRENZE_RADIUS;
        grenzen.push(g);
        
        camera.x = g.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        camera.y = g.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        
        startPhase = 'lager';
        pendingStartBuild = null;
        window._pendingStartType = null;
        
        showTemporaryMessage('✅ Grenzkontrolle platziert! Jetzt Lager platzieren (innerhalb des Radius)', '#9b59b6', true);
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== EINZELMODUS START LAGER =====
    if (window._pendingStartType === 'lager' && pendingStartBuild) {
        const isInRadius = isWithinBuildRadius(pendingStartBuild.gx, pendingStartBuild.gy, 'player');
        if (!isInRadius) {
            showTemporaryMessage('❌ Lager muss innerhalb des Grenzkontroll-Radius liegen!', '#ff6b6b', true);
            pendingStartBuild = null;
            window._pendingStartType = null;
            document.getElementById('confirmDialog').style.display = 'none';
            return;
        }
        
        const lager = new Building(nextBuildingId++, 'lager', pendingStartBuild.gx, pendingStartBuild.gy, false);
        lager.isUnderConstruction = false;
        lager.constructionProgress = 1;
        buildings.push(lager);
        startPhase = 'haus';
        pendingStartBuild = null;
        window._pendingStartType = null;
        showTemporaryMessage('✅ Lager platziert! Jetzt Haus platzieren', '#ffd966', true);
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== EINZELMODUS START HAUS =====
    if (window._pendingStartType === 'haus' && pendingStartBuild) {
        const isInRadius = isWithinBuildRadius(pendingStartBuild.gx, pendingStartBuild.gy, 'player');
        if (!isInRadius) {
            showTemporaryMessage('❌ Haus muss innerhalb des Grenzkontroll-Radius liegen!', '#ff6b6b', true);
            pendingStartBuild = null;
            window._pendingStartType = null;
            document.getElementById('confirmDialog').style.display = 'none';
            return;
        }
        
        const haus = new Building(nextBuildingId++, 'haus', pendingStartBuild.gx, pendingStartBuild.gy, false);
        haus.isUnderConstruction = false;
        haus.constructionProgress = 1;
        haus.residents = 6;
        haus.maxResidents = 6;
        haus.maxProductionTime = 30;
        haus.baseMaxProductionTime = 30;
        buildings.push(haus);
        for (let i = 0; i < 6; i++) {
            spawnVillager(haus.id);
        }
        gameStarted = true;
        pendingStartBuild = null;
        window._pendingStartType = null;
        startPhase = 'grenze';
        
        if (!SPLIT_SCREEN) {
            initNPC();
        }
        
        showTemporaryMessage('🎮 Spiel gestartet! 6 Einwohner warten auf Befehle!', '#2ecc71', true);
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== ZERSTÖRUNG SPIELER 1 =====
    if (window._pendingDestroy && pendingDestroy) {
        if (pendingDestroy.isGrenze) {
            if (destroyGrenze(pendingDestroy.gx, pendingDestroy.gy)) {
                pendingDestroy = null;
                destroyMode = false;
                document.getElementById('destroyBtn').classList.remove('active');
                showTemporaryMessage('💀 Grenzkontrolle abgerissen', '#ff6b6b', true);
            }
        } else if (destroyBuilding(pendingDestroy.gx, pendingDestroy.gy)) {
            pendingDestroy = null;
            destroyMode = false;
            document.getElementById('destroyBtn').classList.remove('active');
            showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b', true);
        }
        window._pendingDestroy = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== ZERSTÖRUNG SPIELER 2 =====
    if (window._pendingDestroyP2 && pendingDestroyP2) {
        if (pendingDestroyP2.isGrenze) {
            if (destroyGrenzePlayer2(pendingDestroyP2.gx, pendingDestroyP2.gy)) {
                pendingDestroyP2 = null;
                destroyModeP2 = false;
                document.getElementById('destroyBtnSplit2').classList.remove('active');
                showTemporaryMessage('💀 Grenzkontrolle (P2) abgerissen', '#ff6b6b', true);
            }
        } else if (destroyBuildingPlayer2(pendingDestroyP2.gx, pendingDestroyP2.gy)) {
            pendingDestroyP2 = null;
            destroyModeP2 = false;
            document.getElementById('destroyBtnSplit2').classList.remove('active');
            showTemporaryMessage('💀 Gebäude (P2) abgerissen', '#ff6b6b', true);

        dialogIsUrgent = false;
        markDirty();

    }

    // ===== UPGRADE SPIELER 1 =====
    if (window._pendingUpgrade && pendingUpgrade) {
        if (pendingUpgrade.isGrenze) {
            const grenze = grenzen.find(g => g.id === pendingUpgrade.building.id);
            if (grenze && upgradeGrenze(grenze)) {
                showTemporaryMessage(`⬆️ Grenzkontrolle auf Stufe ${grenze.level} upgrade!`, '#9b59b6', true);

        }
        window._pendingUpgrade = false;

        dialogIsUrgent = false;

    // ===== UPGRADE SPIELER 2 =====

        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== BAU SPIELER 1 =====
    if (pendingBuild && selectedBuildingType) {
        if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
            pendingBuild = null;
            showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== BAU SPIELER 2 =====
    if (pendingBuildP2 && selectedBuildingTypeP2) {
        if (startConstructionPlayer2(selectedBuildingTypeP2, pendingBuildP2.gx, pendingBuildP2.gy)) {
            pendingBuildP2 = null;
            showTemporaryMessage(`🔨 ${selectedBuildingTypeP2} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

// ===== IN handleConfirmYes() EINFÜGEN =====
// ===== NACH DER GEBÄUDE-EROBERUNG =====

// ===== GRENZ-EROBERUNG BESTÄTIGEN =====
if (window._pendingGrenzeCapture) {
    const grenze = window._pendingGrenzeCapture.grenze;
    const fromPlayer = window._pendingGrenzeCapture.fromPlayer;
    const toPlayer = window._pendingGrenzeCapture.toPlayer;
    
    if (transferGrenze(grenze, fromPlayer, toPlayer)) {
        const playerName = toPlayer === 'player' ? 'Spieler 1' : 
                          toPlayer === 'player2' ? 'Spieler 2' : 'NPC';
        showTemporaryMessage(`🟣 Grenzkontrolle wurde von ${playerName} erobert!`, '#9b59b6', true);
        SoundFX.playIfVisible(grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, 
                             grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, 'capture');
        markDirty();
    }
    window._pendingGrenzeCapture = null;
    document.getElementById('confirmDialog').style.display = 'none';
    return;
}

    // ===== HAUPTMENÜ =====
    if (window._pendingMainMenu) {
        window._pendingMainMenu = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;

// Diese Funktion wird in handleTap() aufgerufen, wenn ein Gebäude angetippt wird
function handleBuildingTap(playerId, gx, gy) {
    // ===== SPIELER 1 =====
    if (playerId === 'player') {
        // Prüfe ob Grenzkontrolle
        const grenze = grenzen.find(g => g.gridX === gx && g.gridY === gy);
        if (grenze) {
            if (upgradeMode && grenze.level < 3) {
                const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
                pendingUpgrade = { building: grenze, isGrenze: true, gx: gx, gy: gy };
                document.getElementById('confirmText').textContent = `🟣 Grenzkontrolle auf Stufe ${grenze.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone}🪨`;
                document.getElementById('effectDisplay').textContent = `Effekt: Radius ${grenze.radius} → ${effect.radius || grenze.radius + 5} Zellen`;
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingUpgrade = true;
                return true;
            }
            if (destroyMode) {
                pendingDestroy = { gx, gy, isGrenze: true };
                document.getElementById('confirmText').textContent = `🟣 Grenzkontrolle (Level ${grenze.level}) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingDestroy = true;
                return true;
            }
            // Info anzeigen
            const owner = grenze.isNPC ? 'NPC' : 'Spieler';
            const captureStatus = grenze.beingCaptured ? ` (wird erobert: ${Math.round(grenze.captureProgress * 100)}%)` : '';
            showTemporaryMessage(`🟣 ${owner} Grenzkontrolle (Level ${grenze.level}, Radius: ${grenze.radius} Zellen)${captureStatus}`, '#9b59b6', true);
            return true;
        }
        
        // Normales Gebäude (wie gehabt)
        const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
        if (building) {
            // ... bestehende Logik ...
        }
    }
    
    // ===== SPIELER 2 =====
    if (playerId === 'player2' && SPLIT_SCREEN) {
        const grenze = player2Grenzen.find(g => g.gridX === gx && g.gridY === gy);
        if (grenze) {
            if (upgradeModeP2 && grenze.level < 3) {
                const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
                pendingUpgradeP2 = { building: grenze, isGrenze: true, gx: gx, gy: gy };
                document.getElementById('confirmText').textContent = `🟣 Grenzkontrolle (P2) auf Stufe ${grenze.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone}🪨`;
                document.getElementById('effectDisplay').textContent = `Effekt: Radius ${grenze.radius} → ${effect.radius || grenze.radius + 5} Zellen`;
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingUpgradeP2 = true;
                return true;
            }
            if (destroyModeP2) {
                pendingDestroyP2 = { gx, gy, isGrenze: true };
                document.getElementById('confirmText').textContent = `🟣 Grenzkontrolle (P2) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                window._pendingDestroyP2 = true;
                return true;
            }
            const captureStatus = grenze.beingCaptured ? ` (wird erobert: ${Math.round(grenze.captureProgress * 100)}%)` : '';
            showTemporaryMessage(`🟣 Spieler 2 Grenzkontrolle (Level ${grenze.level}, Radius: ${grenze.radius} Zellen)${captureStatus}`, '#d7bde2', true);
            return true;
        }
        
        // Normales Gebäude (wie gehabt)
        const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
        if (building) {
            // ... bestehende Logik ...
        }
    }
    
    // ===== NPC (nur Einzelmodus) =====
    if (!SPLIT_SCREEN && !NETWORK_MODE) {
        const npcGrenze = npcGrenzen.find(g => g.gridX === gx && g.gridY === gy);
        if (npcGrenze) {
            const captureStatus = npcGrenze.beingCaptured ? ` (wird erobert: ${Math.round(npcGrenze.captureProgress * 100)}%)` : '';
            showTemporaryMessage(`🤖 NPC Grenzkontrolle (Level ${npcGrenze.level}, Radius: ${npcGrenze.radius} Zellen)${captureStatus}`, '#4a235a', true);
            return true;
        }
        
        const npcBuilding = npcBuildings.find(b => b.gridX === gx && b.gridY === gy);
        if (npcBuilding) {
            // ... bestehende Logik ...

    }
    
    return false;

                this.style.color = '#ff6b6b';
                this.style.textShadow = '0 0 12px rgba(255,68,68,0.6)';

            this.click();

let messageRotationTimer = 0;
let messageIsFlipped = false;

function showTemporaryMessage(msg, color = '#fff', urgent = false) {
    if (urgent) {
        messageQueue = [];
        isMessageActive = false;
        if (messageHideTimeout) {
            clearTimeout(messageHideTimeout);
            messageHideTimeout = null;
        }
        tempMessage = msg;
        tempMessageColor = color;
        tempMessageTimer = 3.0;
        if (tempMessageElement) {
            tempMessageElement.textContent = msg;
            tempMessageElement.style.color = color;
            tempMessageElement.style.opacity = '1';
            if (SPLIT_SCREEN) {
                messageIsFlipped = false;
                messageRotationTimer = 0;
                tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
                tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
            }
        }
        isMessageActive = true;
        return;
    }
    messageQueue.push({ msg, color });
    if (!isMessageActive) {
        displayNextMessage();
    }
}

function displayNextMessage() {
    if (messageHideTimeout) {
        clearTimeout(messageHideTimeout);
        messageHideTimeout = null;
    }
    if (messageQueue.length === 0) {
        isMessageActive = false;
        if (tempMessageElement) {
            tempMessageElement.style.opacity = '0';
        }
        return;
    }
    isMessageActive = true;
    const next = messageQueue.shift();
    tempMessage = next.msg;
    tempMessageColor = next.color;
    tempMessageTimer = 3.0;
    if (tempMessageElement) {
        tempMessageElement.textContent = next.msg;
        tempMessageElement.style.color = next.color;
        tempMessageElement.style.opacity = '1';
        if (SPLIT_SCREEN) {
            messageIsFlipped = false;
            messageRotationTimer = 0;
            tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
            tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
        }
    }
}

function updateMessageDisplay(dt) {
    if (!tempMessageElement) return;
    if (tempMessageTimer <= 0 && isMessageActive) {
        tempMessageElement.style.opacity = '0';
        isMessageActive = false;
        if (messageHideTimeout) clearTimeout(messageHideTimeout);
        messageHideTimeout = setTimeout(() => {
            messageHideTimeout = null;
            displayNextMessage();
        }, 300);
        return;
    }
    if (tempMessageTimer <= 0) return;
    if (!SPLIT_SCREEN) return;
    messageRotationTimer += dt;
    if (messageRotationTimer >= 1.5) {
        messageRotationTimer = 0;
        messageIsFlipped = !messageIsFlipped;
        const rotation = messageIsFlipped ? 180 : 0;
        tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg)`;
        tempMessageElement.style.transition = 'transform 0.5s ease';
        tempMessageElement.style.transform += ' scale(1.05)';
        setTimeout(() => {
            if (tempMessageElement && tempMessageTimer > 0) {
                tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg) scale(1)`;
            }
        }, 150);
    }
}

// ===== SPLIT-START: Gebäude platzieren =====
function placeSplitStartBuilding(player, type, gx, gy) {
    const isPlayer1 = (player === 'player1');
    const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);

    if (NETWORK_MODE) {
        if (isPlayer1 && gy > gridLimit) {
            showTemporaryMessage('❌ Host darf nur im oberen Drittel bauen!', '#ff6b6b');
            return false;
        }
        if (!isPlayer1 && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Client darf nur im unteren Drittel bauen!', '#ff6b6b');
            return false;
        }
    } else if (SPLIT_SCREEN) {
        if (isPlayer1 && gy > gridLimit) {
            showTemporaryMessage('❌ Spieler 1 darf nur im oberen Drittel bauen!', '#ff6b6b');
            return false;
        }
        if (!isPlayer1 && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b');
            return false;
        }
    }

    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    // ===== GRENZKONTROLLE =====
    if (type === 'grenze') {
        const g = new Grenzkontrolle(
            isPlayer1 ? nextGrenzeId++ : player2NextGrenzeId++,
            gx, gy,
            isPlayer1 ? 'player' : 'player2',
            false
        );
        g.isUnderConstruction = false;
        g.constructionProgress = 1;
        g.radius = CONFIG.GRENZE_RADIUS;
        
        if (isPlayer1) {
            grenzen.push(g);
            camera.x = g.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            camera.y = g.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        } else {
            player2Grenzen.push(g);
            cameraPlayer2.x = g.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            cameraPlayer2.y = g.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        }
        
        markDirty();
        renderDirty = true;
        return true;
    }

    // ===== LAGER / HAUS =====
    const playerId = isPlayer1 ? 'player' : 'player2';
    if (!isWithinBuildRadius(gx, gy, playerId)) {
        showTemporaryMessage(`❌ ${type} muss innerhalb der Grenzkontrolle liegen!`, '#ff6b6b');
        return false;
    }

    const building = new Building(
        isPlayer1 ? nextBuildingId++ : player2NextBuildingId++,
        type,
        gx, gy,
        false,
        isPlayer1 ? 'player' : 'player2'
    );
    
    building.isUnderConstruction = false;
    building.constructionProgress = 1;
    building.constructionTimer = CONFIG.BUILD_TIME;
    
    if (type === 'haus') {
        building.residents = 6;
        building.maxResidents = 6;
        building.maxProductionTime = 30;
        building.baseMaxProductionTime = 30;
    }

    if (isPlayer1) {
        buildings.push(building);
        camera.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        camera.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
        player2Buildings.push(building);
        cameraPlayer2.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        cameraPlayer2.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    }

    if (type === 'haus') {
        for (let i = 0; i < 6; i++) {
            if (isPlayer1) {
                spawnVillager(building.id);
            } else {
                spawnVillagerPlayer2(building.id);
            }
        }
    }
    
    markDirty();
    renderDirty = true;
    return true;
}

function advanceSplitStart() {
    const phases = [
        'player1_grenze',
        'player1_lager',
        'player1_haus',
        'player2_grenze',
        'player2_lager',
        'player2_haus'
    ];
    const currentIndex = phases.indexOf(splitStartPhase);
    if (currentIndex === phases.length - 1) {
        splitStartPhase = null;
        gameStarted = true;
        gameReady = true;
        showTemporaryMessage('🎮 Spiel gestartet! Beide Spieler sind bereit!', '#2ecc71', true);
        return;
    }
    splitStartPhase = phases[currentIndex + 1];
    const nextPlayer = splitStartPhase.startsWith('player1') ? 'Spieler 1' : 'Spieler 2';
    const nextType = splitStartPhase.includes('grenze') ? 'Grenzkontrolle' :
                     splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const color = splitStartPhase.includes('grenze') ? '#9b59b6' : '#ffd966';
    showTemporaryMessage(`👉 ${nextPlayer} platziere dein ${nextType} (kostenlos)`, color, true);
}

// ===== NETZWERK-START =====
function advanceNetworkStart() {
    if (!IS_HOST) return;

    const phases = [
        'player1_grenze',
        'player1_lager',
        'player1_haus',
        'player2_grenze',
        'player2_lager',
        'player2_haus'
    ];
    const currentIndex = phases.indexOf(splitStartPhase);

    if (currentIndex === -1) {
        splitStartPhase = 'player1_grenze';
        showTemporaryMessage('👉 Host platziere deine Grenzkontrolle (oberes Drittel)', '#9b59b6', true);
        sendStartPhaseToClient();
        return;
    }

    if (currentIndex === phases.length - 1) {
        splitStartPhase = null;
        gameStarted = true;
        gameReady = true;
        sendStartPhaseToClient();
        showTemporaryMessage('🎮 Netzwerk-Spiel gestartet!', '#2ecc71', true);
        return;
    }

    splitStartPhase = phases[currentIndex + 1];
    const nextPlayer = splitStartPhase.startsWith('player1') ? 'Host' : 'Client';
    const nextType = splitStartPhase.includes('grenze') ? 'Grenzkontrolle' :
                     splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const area = splitStartPhase.startsWith('player1') ? 'oberes Drittel' : 'unteres Drittel';
    const color = splitStartPhase.includes('grenze') ? '#9b59b6' : '#ffd966';

    showTemporaryMessage(`👉 ${nextPlayer} platziere dein ${nextType} (${area})`, color, true);
    sendStartPhaseToClient();
}

function sendStartPhaseToClient() {
    if (!IS_HOST || !networkConn) return;
    try {
        networkConn.send(JSON.stringify({
            type: 'start_phase',
            phase: splitStartPhase,
            gameStarted: gameStarted || false
        }));
    } catch(e) {
        console.warn('Fehler beim Senden der Phase:', e);
    }
}

function handleStartPhase(data) {
    if (IS_HOST) return;

    splitStartPhase = data.phase;
    gameStarted = data.gameStarted || false;

    if (splitStartPhase === 'waiting_for_host') {
        showTemporaryMessage('📥 Warte auf Host...', '#ffd966', true);
        return;
    }

    if (splitStartPhase === null && gameStarted) {
        gameReady = true;
        showTemporaryMessage('🎮 Spiel gestartet!', '#2ecc71', true);
        return;
    }

    const isPlayer1Phase = splitStartPhase.startsWith('player1');
    const nextType = splitStartPhase.includes('grenze') ? 'Grenzkontrolle' :
                     splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const area = isPlayer1Phase ? 'oberes Drittel' : 'unteres Drittel';
    const color = splitStartPhase.includes('grenze') ? '#9b59b6' : '#ffd966';

    if (!isPlayer1Phase) {
        showTemporaryMessage(`👉 Du (Client) platziere dein ${nextType} (${area})`, color, true);
        gameReady = true;
    } else {
        showTemporaryMessage(`⏳ Warte auf Host (${nextType})...`, color, true);
        gameReady = false;
    }
}

    }

    if (window.updateModeDisplay) window.updateModeDisplay();

}

// ===== GAME LOOP =====
let gameReady = false;

function gameLoop(now) {
    let dt = (now - lastTimestamp) / 1000;
    if (dt > 0.2) dt = 0.016;
    if (dt < 0.001) dt = 0.001;
    lastTimestamp = now;
    dt *= gameSpeed;

    updateMessageDisplay(dt);

    if (gameStarted) {
        const elapsed = (performance.now() / 1000) - gameStartTime;
        if (elapsed >= BUILD_RESTRICTION_DURATION && buildingRestrictionActive) {
            buildingRestrictionActive = false;
            showTemporaryMessage('🏗️ Baubeschränkung aufgehoben!', '#44ff44');
        }

        if (NETWORK_MODE && !IS_HOST) {
            updateEconomyPlayer2(dt);
            updateVillagersPlayer2(dt);
            updateVillagersClientOnly(dt);
            updateConstructionPlayer2(dt);
            updatePlayer2ResourceNodes(dt);
            updateTowersPlayer2Only(dt);
            updateProjectiles(dt);
            updateHitEffects(dt);
            updateEnemiesClientOnly(dt);
            updateCombatAndCaptureClient(dt);
        } else {
            spawnTimer += dt;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                spawnInterval = 90 + Math.random() * 160;
                if (spawnTimer >= spawnInterval - 5 && spawnTimer < spawnInterval - 4.9) {
                    showTemporaryMessage('⚠️ GROSSE FEINDSWELLE in 5 Sekunden!', '#ff4444', true);
                }
                spawnEnemies();
            }

            updateEconomyPlayer1(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateEconomyPlayer2(dt);
            }
            if (!SPLIT_SCREEN && !NETWORK_MODE && npcStarted) {
                updateEconomyNPC(dt);
            }
            updateResourceNodes(dt);

// ===== 11. IN gameLoop() EINFÜGEN =====
// In der Hauptschleife, nach updateResourceNodes oder updateVillagers:

    // Alle 2 Sekunden prüfen ob Gebäude brennen müssen
    _lastFireCheck += dt;
    if (_lastFireCheck >= 2) {
        _lastFireCheck = 0;
        checkBuildingsForFire();
    }
    
    // Brennende Gebäude aktualisieren
    updateBurningBuildings(dt);

            updateVillagers(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateVillagersPlayer2(dt);
            }
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                updateNPCVillagers(dt);
            }

            updateConstruction(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateConstructionPlayer2(dt);
            }

            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                updateNPC(dt);
            }

            updateCombatAndCapture(dt);
            updateTowers(dt);
            updateProjectiles(dt);
            updateHitEffects(dt);

            if (!NETWORK_MODE || IS_HOST) {
                updateEnemies(dt);
            } else {
                updateEnemiesClientOnly(dt);
            }

            if (NETWORK_MODE && IS_HOST) {
                syncTimer += dt;
                if (syncTimer >= 0.5) {
                    syncTimer = 0;
                    sendDeltaSnapshot();
                }
                if (gameSpeedMultiplier !== window._lastSentSpeed) {
                    window._lastSentSpeed = gameSpeedMultiplier;
                    if (networkConn) {
                        networkConn.send(JSON.stringify({
                            type: 'speed_update',
                            speed: gameSpeedMultiplier
                        }));
                    }
                }
            }
        }

        if (gameReady) {
            checkGameOver();
        }

        updateUI();
        if (window.updateModeDisplay) window.updateModeDisplay();
    }

    draw();

    if (tempMessageTimer > 0) {
        tempMessageTimer -= dt;
    }

    requestAnimationFrame(gameLoop);
}

// ===== INIT =====
function init() {
    const canvas = document.getElementById('gameCanvas');
    window.canvas = canvas;
    window.ctx = canvas.getContext('2d');

    generateTerrain();
    refreshPlayerVillagerCache();
    refreshPlayerResourceCache();
    refreshNpcVillagerCache();
    refreshNpcResourceCache();
    rebuildResourceMaps();

    window.addEventListener('resize', resize);
    resize();

    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    setupMessageDisplay();
    setupUI();

    const startBtn = document.getElementById('startGameBtn');
    const newStartBtn = startBtn.cloneNode(true);
    startBtn.parentNode.replaceChild(newStartBtn, startBtn);

    newStartBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        startGame();
    });
    newStartBtn.addEventListener('touchend', function(e) {
        e.preventDefault();
        e.stopPropagation();
        startGame();
    }, { passive: false });

    requestAnimationFrame(gameLoop);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}


// =========================================================================
//  MODUL 23: SOUND-EFFEKTE – ERWEITERT FÜR GRENZKONTROLLE
// =========================================================================

const SoundFX = (() => {
  let audioCtx = null;
  
  function getCtx() {
    if (!audioCtx) { 
      audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  
  function isVisible(worldX, worldY) {
    const left = camera.x - (canvas.width / 2) / camera.zoom;
    const right = camera.x + (canvas.width / 2) / camera.zoom;
    const top = camera.y - (canvas.height / 2) / camera.zoom;
    const bottom = camera.y + (canvas.height / 2) / camera.zoom;
    return worldX >= left && worldX <= right && worldY >= top && worldY <= bottom;
  }
  
  function play(freq, duration, type = 'square', vol = 0.1) {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type; 
      osc.frequency.value = freq; 
      gain.gain.value = vol;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain); 
      gain.connect(ctx.destination); 
      osc.start(); 
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }
  
  return {
    playIfVisible(worldX, worldY, type) {
      if (!isVisible(worldX, worldY)) return;
      switch(type) {
        case 'build': play(220, 0.15, 'square', 0.08); break;
        case 'capture': play(440, 0.2, 'triangle', 0.1); break;
        case 'hit': play(150, 0.1, 'sawtooth', 0.12); break;
        case 'enemyDeath': play(80, 0.3, 'sawtooth', 0.15); break;
        case 'towerShoot': play(880, 0.08, 'square', 0.06); break;
        case 'upgrade': play(660, 0.15, 'triangle', 0.1); break;
        case 'destroy': play(100, 0.25, 'sawtooth', 0.15); break;
        case 'villagerDie': play(200, 0.15, 'square', 0.1); break;
        // ===== NEU: GRENZKONTROLLE SOUNDS =====
        case 'grenzeBuild': 
          play(180, 0.2, 'sine', 0.08); 
          setTimeout(() => play(280, 0.15, 'sine', 0.06), 150);
          break;
        case 'grenzeUpgrade': 
          play(300, 0.1, 'sine', 0.1);
          setTimeout(() => play(400, 0.1, 'sine', 0.08), 100);
          setTimeout(() => play(500, 0.15, 'sine', 0.06), 200);
          break;
        case 'grenzeDestroy': 
          play(120, 0.3, 'sawtooth', 0.12);
          setTimeout(() => play(80, 0.2, 'sawtooth', 0.1), 150);
          break;
        case 'harvest': 
          play(600, 0.05, 'sine', 0.05);
          setTimeout(() => play(800, 0.05, 'sine', 0.04), 50);
          break;
      }
    }
  };
})();

    if (resourceNodes.length === 0) {
        console.log('❌ KEINE NODES VORHANDEN!');

        const prodBuildings = buildings.filter(b => 
            !b.isUnderConstruction && 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz')
        );
        prodBuildings.forEach(b => {
            console.log(`  ${b.type} id=${b.id} pos=(${b.gridX},${b.gridY}) fieldCount=${b.fieldCount} ${b.isUnderConstruction ? '❌ IM BAU' : '✅ FERTIG'}`);
        });
        console.log('=====================================');
        return;
    }
    
    resourceNodes.forEach((node, i) => {
        const progress = node.maxTimer > 0 ? (node.timer / node.maxTimer * 100) : 0;
        const status = node.ready ? '✅ READY' : '⏳ LÄUFT';
        console.log(`  [${i}] id=${node.id} type=${node.type} pos=(${node.x},${node.y})`);
        console.log(`       timer=${node.timer.toFixed(2)}/${node.maxTimer} (${progress.toFixed(1)}%) ${status}`);
        console.log(`       claimedBy=${node.claimedBy || 'frei'} fields=${node.fields ? node.fields.length : 0}`);
        
        if (node.fields && node.fields.length > 0) {
            const harvested = node.fields.filter(f => f.harvested).length;
            console.log(`       Felder: ${harvested}/${node.fields.length} geerntet`);
            node.fields.forEach((f, fi) => {
                console.log(`         [${fi}] (${f.x},${f.y}) harvested=${f.harvested} isBeingHarvested=${f.isBeingHarvested}`);
            });
        }
    });
    
    console.log('📊 resourceNodeByPosition Größe:', resourceNodeByPosition.size);
    let syncProblems = 0;
    for (let [key, node] of resourceNodeByPosition) {
        const inList = resourceNodes.some(n => n.id === node.id);
        if (!inList) {
            console.log(`  ❌ SYNC-PROBLEM: ${key} → node ${node.id} ist in Map aber NICHT in resourceNodes!`);
            syncProblems++;
        }
    }
    if (syncProblems === 0) console.log('  ✅ Alle Nodes sind synchron');
    
    console.log('=====================================');
}

// ===== TIMER-PRÜFUNG ALLE 2 SEKUNDEN =====
let lastTimerCheck = 0;
function checkTimers() {
    if (!gameStarted) return;
    
    const now = performance.now() / 1000;
    if (now - lastTimerCheck < 2) return;
    lastTimerCheck = now;
    
    if (resourceNodes.length === 0) return;
    
    console.log(`⏱️ TIMER-CHECK (${new Date().toLocaleTimeString()}):`);
    resourceNodes.forEach((node, i) => {
        if (node.maxTimer > 0) {
            const progress = (node.timer / node.maxTimer * 100);
            const status = node.ready ? '✅' : '⏳';
            console.log(`  ${status} Node ${i}: ${node.timer.toFixed(2)}/${node.maxTimer} = ${progress.toFixed(1)}%`);
            
            if (node.timer > node.maxTimer && !node.ready) {
                console.log(`  ⚠️⚠️⚠️ ACHTUNG: Timer ${node.timer} > maxTimer ${node.maxTimer} aber ready=false!`);
                console.log(`  Grund: Felder werden nicht komplett geerntet!`);
                if (node.fields) {
                    const harvested = node.fields.filter(f => f.harvested).length;
                    console.log(`  Felder: ${harvested}/${node.fields.length} geerntet`);
                }
            }
        }
    });
}
