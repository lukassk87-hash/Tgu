            player: 'player',
            buildingType: type,
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Baubefehl an Host gesendet: ${type}`, '#ffd966');
        return true;
    }

    // ---- LOKALE AUSFÜHRUNG ----
    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    // ===== NEU: GRENZKONTROLLE-RADIUS PRÜFEN =====
    if (type !== 'grenze') {
        const isInRadius = isWithinBuildRadius(gx, gy, 'player');
        if (!isInRadius && gameStarted) {
            const radius = getBuildRadius('player');
            showTemporaryMessage(`❌ Außerhalb des Bau-Radius! (Radius: ${radius} Zellen)`, '#ff6b6b');
            return false;
        }
    }

    if (!canAfford(type)) {
        const typeNames = {
            'haus': 'Haus',
            'lager': 'Lager',
            'bauer': 'Bauer',
            'holzfaeller': 'Holzfäller',
            'steinmetz': 'Steinmetz',
            'wachturm': 'Wachturm',
            'grenze': 'Grenzkontrolle'
        };
        const displayName = typeNames[type] || type;
        showTemporaryMessage(`❌ Nicht genug Ressourcen für ${displayName}!`, '#ff6b6b');
        return false;
    }

    // ===== NEU: MAXIMALE GRENZKONTROLLEN PRÜFEN =====
    if (type === 'grenze') {
        const currentGrenzen = grenzen.length;
        if (currentGrenzen >= CONFIG.MAX_GRENZEN) {
            showTemporaryMessage(`❌ Maximale Anzahl Grenzkontrollen erreicht (${CONFIG.MAX_GRENZEN})!`, '#ff6b6b');
            return false;
        }
    }

    if (type === 'wachturm' && gameStarted) {
        const hasResourceBuilding = buildings.some(b => 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && 
            !b.isUnderConstruction
        );
        if (!hasResourceBuilding) {
            showTemporaryMessage('❌ Baue zuerst eine Farm, einen Holzfäller oder einen Steinmetz!', '#ff6b6b');
            return false;
        }
    }

    if (gameStarted) {
        const isInStartPhase = buildingRestrictionActive;
        const isInPeaceMode = (gameMode === 'peace');
        const isRestrictionActive = isInStartPhase || isInPeaceMode;
        if (isRestrictionActive && type !== 'grenze') {
            let tooClose = false;
            let closestDist = Infinity;

            // Prüfe gegen NPC
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                for (let nb of npcBuildings) {
                    const distToNPC = Math.hypot(gx - nb.gridX, gy - nb.gridY);
                    if (distToNPC < closestDist) closestDist = distToNPC;
                    if (distToNPC < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (SPLIT_SCREEN && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (NETWORK_MODE && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (tooClose) {
                if (isInStartPhase) {
                    const elapsed = (performance.now() / 1000) - gameStartTime;
                    const remaining = Math.ceil(BUILD_RESTRICTION_DURATION - elapsed);
                    const target = SPLIT_SCREEN ? 'Spieler 2' : (NETWORK_MODE ? 'Gegner' : 'NPC');
                    showTemporaryMessage(`❌ Startphase! Noch ${remaining}s (10 Raster Abstand zu ${target} nötig)`, '#ff6b6b');
                } else {
                    showTemporaryMessage(`❌ Frieden! (${Math.floor(closestDist)} Raster, mind. 10 nötig)`, '#ff6b6b');
                }
                return false;
            }
        }
    }

    deductCost(type);

    // ===== NEU: GRENZKONTROLLE BAUEN =====
    if (type === 'grenze') {
        const g = new Grenzkontrolle(nextGrenzeId++, gx, gy, 'player', false);
        g.isUnderConstruction = true;
        g.constructionTimer = 0;
        g.constructionProgress = 0;
        g.waitingForBuilder = true;
        grenzen.push(g);
        assignBuilderToGrenze(g.id);
        markDirty();
        
        if (NETWORK_MODE && IS_HOST) {
            sendDeltaSnapshot();
        }
        showTemporaryMessage(`🟣 Grenzkontrolle wird gebaut... (10s)`, '#9b59b6', true);
        return true;
    }

    // ===== NORMALE GEBÄUDE =====
    const b = new Building(nextBuildingId++, type, gx, gy, false);
    b.isUnderConstruction = true;
    b.constructionTimer = 0;
    b.constructionProgress = 0;
    b.waitingForBuilder = true;
    
    // ===== NEU: fieldCount für Produktionsgebäude =====
    if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
        const fields = type === 'bauer' ? getBauerFields(b) :
                      type === 'holzfaeller' ? getHolzfaellerFields(b) :
                      getSteinmetzFields(b);
        b.fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        b.harvestProgress = 0;
        b.isHarvesting = false;
    }
    
    buildings.push(b);
    assignBuilderToConstruction(b.id);
    markDirty();

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== BAUSTELLEN AKTUALISIEREN (MIT GRENZKONTROLLEN) =====
function updateConstruction(dt) {
    // Baumeister zuweisen für Gebäude
    for (let b of buildings) {
        if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
            assignBuilderToConstruction(b.id);
        }
    }
    for (let b of npcBuildings) {
        if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
            assignNpcBuilderToConstruction(b.id);
        }
    }
    
    // ===== NEU: Grenzkontrollen-Baumeister =====
    for (let g of grenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignBuilderToGrenze(g.id);
        }
    }
    for (let g of player2Grenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignBuilderToGrenzePlayer2(g.id);
        }
    }
    for (let g of npcGrenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignNpcBuilderToGrenze(g.id);
        }
    }

    // Baustellen aktualisieren
    for (let key in constructionSites) {
        const site = constructionSites[key];
        
        // ===== GRENZKONTROLLEN-BAUSTELLE =====
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_', ''));
            let grenze = grenzen.find(g => g.id === grenzeId);
            let isNPC = false;
            if (!grenze) {
                grenze = player2Grenzen.find(g => g.id === grenzeId);
                if (!grenze) {
                    grenze = npcGrenzen.find(g => g.id === grenzeId);
                    isNPC = true;
                }
            }
            if (!grenze) {
                delete constructionSites[key];
                continue;
            }

            const builder = isNPC ?
                npcVillagers.find(v => v.id === site.builder && v.alive) :
                villagers.find(v => v.id === site.builder && v.alive);
            
            if (!builder || !builder.alive) {
                delete constructionSites[key];
                grenze.builder = null;
                grenze.waitingForBuilder = true;
                if (isNPC) {
                    assignNpcBuilderToGrenze(grenze.id);
                } else {
                    const isPlayer2 = player2Grenzen.some(g => g.id === grenze.id);
                    if (isPlayer2) {
                        assignBuilderToGrenzePlayer2(grenze.id);
                    } else {
                        assignBuilderToGrenze(grenze.id);
                    }
                }
                continue;
            }

            const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const d = dist(builder, { x: targetX, y: targetY });

            if (d < 5) {
                site.timer += dt;
                grenze.constructionTimer = site.timer;
                grenze.constructionProgress = site.timer / site.maxTimer;
                if (site.timer >= site.maxTimer) {
                    grenze.isUnderConstruction = false;
                    grenze.constructionProgress = 1;
                    grenze.constructionTimer = site.maxTimer;
                    grenze.waitingForBuilder = false;
                    builder.isBuilding = false;
                    builder.buildingTarget = null;
                    builder.state = 'idle';
                    builder.hasTask = false;
                    delete constructionSites[key];
                    markDirty();
                    
                    // Radius-Erweiterung anzeigen
                    const radius = grenze.radius;
                    showTemporaryMessage(`🟣 Grenzkontrolle fertig! Radius: ${radius} Zellen`, '#9b59b6', true);
                }
            } else {
                builder.targetX = targetX;
                builder.targetY = targetY;
            }
            continue;
        }

        // ===== NORMALE BAUSTELLEN =====
        if (site.playerId === 'player2') continue;

        const buildingId = parseInt(key);
        let building = buildings.find(b => b.id === buildingId);
        let isNPC = false;
        if (!building) { 
            building = npcBuildings.find(b => b.id === buildingId); 
            isNPC = true; 
        }
        if (!building) { 
            delete constructionSites[key]; 
            continue; 
        }

        const builder = isNPC ? 
            npcVillagers.find(v => v.id === site.builder && v.alive) : 
            villagers.find(v => v.id === site.builder && v.alive);

        if (!builder || !builder.alive) {
            delete constructionSites[key];
            building.builder = null;
            building.waitingForBuilder = true;
            if (isNPC) { 
                assignNpcBuilderToConstruction(building.id); 
            } else { 
                assignBuilderToConstruction(building.id); 
            }
            continue;
        }

        const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const d = dist(builder, { x: targetX, y: targetY });

        if (d < 5) {
            site.timer += dt;
            building.constructionTimer = site.timer;
            building.constructionProgress = site.timer / site.maxTimer;
            if (site.timer >= site.maxTimer) {
                building.isUnderConstruction = false;
                building.constructionProgress = 1;
                building.constructionTimer = site.maxTimer;
                building.waitingForBuilder = false;
                if (building.type === 'haus') {
                    building.residents = 1;
                    if (isNPC) {
                        const v = new Villager(nextVillagerId++, building.id, true);
                        const cx = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
                        const cy = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
                        v.x = cx; v.y = cy; v.targetX = cx; v.targetY = cy;
                        v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
                        npcVillagers.push(v);
                    } else {
                        spawnVillager(building.id);
                    }
                }
                building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
                building.maxProductionTime = building.baseMaxProductionTime;
                building.baseFireRate = 1.0;
                if (building.type === 'bauer') building.productionType = 'grain';
                else if (building.type === 'holzfaeller') building.productionType = 'wood';
                else if (building.type === 'steinmetz') building.productionType = 'stone';
                builder.isBuilding = false;
                builder.buildingTarget = null;
                builder.state = 'idle';
                builder.hasTask = false;
                delete constructionSites[key];
                markDirty();
            }
        } else {
            builder.targetX = targetX;
            builder.targetY = targetY;
        }
    }
}

// ===== GRENZKONTROLLE UPGRADEN =====
function upgradeGrenze(grenze) {
    const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
    if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
    resources.wood -= cost.wood;
    resources.stone -= cost.stone;
    
    grenze.level += 1;
    grenze.radius = effect.radius || (CONFIG.GRENZE_RADIUS + (grenze.level - 1) * 5);
    
    showTemporaryMessage(`⬆️ Grenzkontrolle Radius: ${grenze.radius} Zellen (Stufe ${grenze.level})`, '#9b59b6', true);
    markDirty();
    
    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }
    return true;
}

// ===== GRENZKONTROLLE ZERSTÖREN =====
function destroyGrenze(gx, gy) {
    const idx = grenzen.findIndex(g => g.gridX === gx && g.gridY === gy);
    if (idx === -1) return false;
    
    const grenze = grenzen[idx];
    // Bauarbeiter freigeben
    if (grenze.builder) {
        const builder = villagers.find(v => v.id === grenze.builder);
        if (builder) {
            builder.isBuilding = false;
            builder.buildingTarget = null;
            builder.state = 'idle';
            builder.hasTask = false;
        }
    }
    grenzen.splice(idx, 1);
    markDirty();
    
    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }
    return true;
}

// ===== UPGRADE BUILDING (Spieler 1) – NETZWERK-FÄHIG =====
function upgradeBuilding(building) {
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'upgrade',
            player: 'player',
            buildingId: building.id
        });
        showTemporaryMessage(`📤 Upgrade-Befehl an Host gesendet (ID: ${building.id})`, '#ffd966');
        return true;
    }

    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
    resources.wood -= cost.wood;
    resources.stone -= cost.stone;

    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) :
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of resourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
            showTemporaryMessage(`⬆️ Turm Reichweite auf ${building.range} erhöht!`, '#ffd966');
        }
        showTemporaryMessage(`⬆️ Turm Kapazität auf ${building.maxStoneAmmo} erhöht!`, '#ffd966');
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    }

    markDirty();

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== ZERSTÖREN (Spieler 1) =====
function destroyBuilding(gx, gy) {
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'destroy',
            player: 'player',
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Abriss-Befehl an Host gesendet (${gx},${gy})`, '#ffd966');
        return true;
    }

    const idx = buildings.findIndex(b => b.gridX === gx && b.gridY === gy);
    if (idx === -1) return false;
    const building = buildings[idx];
    const captureKey = 'capture_' + building.id;
    if (captureTimers[captureKey]) {
        delete captureTimers[captureKey];
    }
    if (building.type === 'wachturm') {
        for (let v of villagers) {
            if (v.alive && v.towerTarget === building) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
                v.isDeliveringStone = false;
                v.carrying = null;
                v.towerTarget = null;
                v.stoneToDeliver = 0;
                v.hasReservedStone = false;
                v.state = 'idle';
                v.hasTask = false;
            }
        }
    }
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  building.type === 'steinmetz' ? getSteinmetzFields(building) : [];
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    resourceNodes = resourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));
    if (building.type === 'haus') {
        const residents = villagers.filter(v => v.alive && v.homeId === building.id);
        for (let v of residents) {
            if (v.hasReservedStone && v.towerTarget) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') { resources.stone += (v.stoneToDeliver || 0); }
                v.hasReservedStone = false;
            }
            v.alive = false;
        }
        villagers = villagers.filter(v => v.alive);
    }
    buildings.splice(idx, 1);
    markDirty();

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}


// =========================================================================
//  MODUL 7: SPIELER-LOGIK – MIT GRENZKONTROLLE & BAU-RADIUS
// =========================================================================

function canAfford(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return true;
  const free = getFreeVillagers();
  switch(type) {
    case 'haus': return resources.wood >= 3;
    case 'lager': return resources.wood >= 10 && resources.stone >= 10;
    case 'bauer': return resources.wood >= 5;
    case 'holzfaeller': return free >= 2;
    case 'steinmetz': return resources.wood >= 5 && free >= 2;
    case 'wachturm': return resources.wood >= 15;
    case 'grenze': return free >= CONFIG.GRENZE_COST_VILLAGERS;
    default: return true;
  }
}

function deductCost(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return;
  switch(type) {
    case 'haus': resources.wood -= 3; break;
    case 'lager': resources.wood -= 10; resources.stone -= 10; break;
    case 'bauer': resources.wood -= 5; break;
    case 'holzfaeller': break;
    case 'steinmetz': resources.wood -= 5; break;
    case 'wachturm': resources.wood -= 15; break;
    case 'grenze': break; // Kosten sind Einwohner, werden separat abgezogen
  }
  let einwohnerKosten = 0;
  if (type === 'holzfaeller') einwohnerKosten = 2;
  else if (type === 'steinmetz') einwohnerKosten = 2;
  else if (type === 'grenze') einwohnerKosten = CONFIG.GRENZE_COST_VILLAGERS;
  if (einwohnerKosten > 0) removeFreeVillagers(einwohnerKosten);
  markDirty();
}

function removeFreeVillagers(count) {
  let removed = 0;
  for (let v of villagers) {
    if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
      v.alive = false;
      const home = buildings.find(b => b.id === v.homeId);
      if (home && home.residents > 0) home.residents -= 1;
      removed++;
    }
  }
  villagers = villagers.filter(v => v.alive);
  markDirty();
}

// ===== BAUMEISTER ZUWEISEN (SPIELER 1) =====
function assignBuilderToConstruction(buildingId) {
    const building = buildings.find(b => b.id === buildingId);
    if (!building) return false;
    if (!building.isUnderConstruction) return false;
    if (building.builder) return true;
    
    const freeVillagers = villagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        building.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = building.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    building.builder = builder.id;
    building.waitingForBuilder = false;
    constructionSites[building.id] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: false,
        isGrenze: false
    };
    markDirty();
    return true;
}

// ===== BAUMEISTER FÜR GRENZKONTROLLE (SPIELER 1) =====
function assignBuilderToGrenze(grenzeId) {
    const grenze = grenzen.find(g => g.id === grenzeId);
    if (!grenze) return false;
    if (!grenze.isUnderConstruction) return false;
    if (grenze.builder) return true;
    
    const freeVillagers = villagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        grenze.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = grenze.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    grenze.builder = builder.id;
    grenze.waitingForBuilder = false;
    constructionSites[`grenze_${grenze.id}`] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: false,
        isGrenze: true,
        playerId: 'player'
    };
    markDirty();
    return true;
}

// ===== START CONSTRUCTION (Spieler 1) – MIT RADIUS-PRÜFUNG =====
function startConstruction(type, gx, gy) {
    // ---- NETZWERK-MODUS: Client sendet Aktion an Host ----
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'build',
            player: 'player',
            buildingType: type,
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Baubefehl an Host gesendet: ${type}`, '#ffd966');
        return true;
    }

    // ---- LOKALE AUSFÜHRUNG ----
    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    // ===== NEU: GRENZKONTROLLE-RADIUS PRÜFEN =====
    if (type !== 'grenze') {
        const isInRadius = isWithinBuildRadius(gx, gy, 'player');
        if (!isInRadius && gameStarted) {
            const radius = getBuildRadius('player');
            showTemporaryMessage(`❌ Außerhalb des Bau-Radius! (Radius: ${radius} Zellen)`, '#ff6b6b');
            return false;
        }
    }

    if (!canAfford(type)) {
        const typeNames = {
            'haus': 'Haus',
            'lager': 'Lager',
            'bauer': 'Bauer',
            'holzfaeller': 'Holzfäller',
            'steinmetz': 'Steinmetz',
            'wachturm': 'Wachturm',
            'grenze': 'Grenzkontrolle'
        };
        const displayName = typeNames[type] || type;
        showTemporaryMessage(`❌ Nicht genug Ressourcen für ${displayName}!`, '#ff6b6b');
        return false;
    }

    // ===== NEU: MAXIMALE GRENZKONTROLLEN PRÜFEN =====
    if (type === 'grenze') {
        const currentGrenzen = grenzen.length;
        if (currentGrenzen >= CONFIG.MAX_GRENZEN) {
            showTemporaryMessage(`❌ Maximale Anzahl Grenzkontrollen erreicht (${CONFIG.MAX_GRENZEN})!`, '#ff6b6b');
            return false;
        }
    }

    if (type === 'wachturm' && gameStarted) {
        const hasResourceBuilding = buildings.some(b => 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && 
            !b.isUnderConstruction
        );
        if (!hasResourceBuilding) {
            showTemporaryMessage('❌ Baue zuerst eine Farm, einen Holzfäller oder einen Steinmetz!', '#ff6b6b');
            return false;
        }
    }

    if (gameStarted) {
        const isInStartPhase = buildingRestrictionActive;
        const isInPeaceMode = (gameMode === 'peace');
        const isRestrictionActive = isInStartPhase || isInPeaceMode;
        if (isRestrictionActive && type !== 'grenze') {
            let tooClose = false;
            let closestDist = Infinity;

            // Prüfe gegen NPC
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                for (let nb of npcBuildings) {
                    const distToNPC = Math.hypot(gx - nb.gridX, gy - nb.gridY);
                    if (distToNPC < closestDist) closestDist = distToNPC;
                    if (distToNPC < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (SPLIT_SCREEN && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (NETWORK_MODE && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (tooClose) {
                if (isInStartPhase) {
                    const elapsed = (performance.now() / 1000) - gameStartTime;
                    const remaining = Math.ceil(BUILD_RESTRICTION_DURATION - elapsed);
                    const target = SPLIT_SCREEN ? 'Spieler 2' : (NETWORK_MODE ? 'Gegner' : 'NPC');
                    showTemporaryMessage(`❌ Startphase! Noch ${remaining}s (10 Raster Abstand zu ${target} nötig)`, '#ff6b6b');
                } else {
                    showTemporaryMessage(`❌ Frieden! (${Math.floor(closestDist)} Raster, mind. 10 nötig)`, '#ff6b6b');
                }
                return false;
            }
        }
    }

    deductCost(type);

    // ===== NEU: GRENZKONTROLLE BAUEN =====
    if (type === 'grenze') {
        const g = new Grenzkontrolle(nextGrenzeId++, gx, gy, 'player', false);
        g.isUnderConstruction = true;
        g.constructionTimer = 0;
        g.constructionProgress = 0;
        g.waitingForBuilder = true;
        grenzen.push(g);
        assignBuilderToGrenze(g.id);
        markDirty();
        
        if (NETWORK_MODE && IS_HOST) {
            sendDeltaSnapshot();
        }
        showTemporaryMessage(`🟣 Grenzkontrolle wird gebaut... (10s)`, '#9b59b6', true);
        return true;
    }

    // ===== NORMALE GEBÄUDE =====
    const b = new Building(nextBuildingId++, type, gx, gy, false);
    b.isUnderConstruction = true;
    b.constructionTimer = 0;
    b.constructionProgress = 0;
    b.waitingForBuilder = true;
    
    // ===== NEU: fieldCount für Produktionsgebäude =====
    if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
        const fields = type === 'bauer' ? getBauerFields(b) :
                      type === 'holzfaeller' ? getHolzfaellerFields(b) :
                      getSteinmetzFields(b);
        b.fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        b.harvestProgress = 0;
        b.isHarvesting = false;
    }
    
    buildings.push(b);
    assignBuilderToConstruction(b.id);
    markDirty();

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== BAUSTELLEN AKTUALISIEREN (MIT GRENZKONTROLLEN) =====
function updateConstruction(dt) {
    // Baumeister zuweisen für Gebäude
    for (let b of buildings) {
        if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
            assignBuilderToConstruction(b.id);
        }
    }
    for (let b of npcBuildings) {
        if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
            assignNpcBuilderToConstruction(b.id);
        }
    }
    
    // ===== NEU: Grenzkontrollen-Baumeister =====
    for (let g of grenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignBuilderToGrenze(g.id);
        }
    }
    for (let g of player2Grenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignBuilderToGrenzePlayer2(g.id);
        }
    }
    for (let g of npcGrenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignNpcBuilderToGrenze(g.id);
        }
    }

    // Baustellen aktualisieren
    for (let key in constructionSites) {
        const site = constructionSites[key];
        
        // ===== GRENZKONTROLLEN-BAUSTELLE =====
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_', ''));
            let grenze = grenzen.find(g => g.id === grenzeId);
            let isNPC = false;
            if (!grenze) {
                grenze = player2Grenzen.find(g => g.id === grenzeId);
                if (!grenze) {
                    grenze = npcGrenzen.find(g => g.id === grenzeId);
                    isNPC = true;
                }
            }
            if (!grenze) {
                delete constructionSites[key];
                continue;
            }

            const builder = isNPC ?
                npcVillagers.find(v => v.id === site.builder && v.alive) :
                villagers.find(v => v.id === site.builder && v.alive);
            
            if (!builder || !builder.alive) {
                delete constructionSites[key];
                grenze.builder = null;
                grenze.waitingForBuilder = true;
                if (isNPC) {
                    assignNpcBuilderToGrenze(grenze.id);
                } else {
                    const isPlayer2 = player2Grenzen.some(g => g.id === grenze.id);
                    if (isPlayer2) {
                        assignBuilderToGrenzePlayer2(grenze.id);
                    } else {
                        assignBuilderToGrenze(grenze.id);
                    }
                }
                continue;
            }

            const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const d = dist(builder, { x: targetX, y: targetY });

            if (d < 5) {
                site.timer += dt;
                grenze.constructionTimer = site.timer;
                grenze.constructionProgress = site.timer / site.maxTimer;
                if (site.timer >= site.maxTimer) {
                    grenze.isUnderConstruction = false;
                    grenze.constructionProgress = 1;
                    grenze.constructionTimer = site.maxTimer;
                    grenze.waitingForBuilder = false;
                    builder.isBuilding = false;
                    builder.buildingTarget = null;
                    builder.state = 'idle';
                    builder.hasTask = false;
                    delete constructionSites[key];
                    markDirty();
                    
                    // Radius-Erweiterung anzeigen
                    const radius = grenze.radius;
                    showTemporaryMessage(`🟣 Grenzkontrolle fertig! Radius: ${radius} Zellen`, '#9b59b6', true);
                }
            } else {
                builder.targetX = targetX;
                builder.targetY = targetY;
            }
            continue;
        }

        // ===== NORMALE BAUSTELLEN =====
        if (site.playerId === 'player2') continue;

        const buildingId = parseInt(key);
        let building = buildings.find(b => b.id === buildingId);
        let isNPC = false;
        if (!building) { 
            building = npcBuildings.find(b => b.id === buildingId); 
            isNPC = true; 
        }
        if (!building) { 
            delete constructionSites[key]; 
            continue; 
        }

        const builder = isNPC ? 
            npcVillagers.find(v => v.id === site.builder && v.alive) : 
            villagers.find(v => v.id === site.builder && v.alive);

        if (!builder || !builder.alive) {
            delete constructionSites[key];
            building.builder = null;
            building.waitingForBuilder = true;
            if (isNPC) { 
                assignNpcBuilderToConstruction(building.id); 
            } else { 
                assignBuilderToConstruction(building.id); 
            }
            continue;
        }

        const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const d = dist(builder, { x: targetX, y: targetY });

        if (d < 5) {
            site.timer += dt;
            building.constructionTimer = site.timer;
            building.constructionProgress = site.timer / site.maxTimer;
            if (site.timer >= site.maxTimer) {
                building.isUnderConstruction = false;
                building.constructionProgress = 1;
                building.constructionTimer = site.maxTimer;
                building.waitingForBuilder = false;
                if (building.type === 'haus') {
                    building.residents = 1;
                    if (isNPC) {
                        const v = new Villager(nextVillagerId++, building.id, true);
                        const cx = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
                        const cy = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
                        v.x = cx; v.y = cy; v.targetX = cx; v.targetY = cy;
                        v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
                        npcVillagers.push(v);
                    } else {
                        spawnVillager(building.id);
                    }
                }
                building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
                building.maxProductionTime = building.baseMaxProductionTime;
                building.baseFireRate = 1.0;
                if (building.type === 'bauer') building.productionType = 'grain';
                else if (building.type === 'holzfaeller') building.productionType = 'wood';
                else if (building.type === 'steinmetz') building.productionType = 'stone';
                builder.isBuilding = false;
                builder.buildingTarget = null;
                builder.state = 'idle';
                builder.hasTask = false;
                delete constructionSites[key];
                markDirty();
            }
        } else {
            builder.targetX = targetX;
            builder.targetY = targetY;
        }
    }
}

// ===== GRENZKONTROLLE UPGRADEN =====
function upgradeGrenze(grenze) {
    const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
    if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
    resources.wood -= cost.wood;
    resources.stone -= cost.stone;
    
    grenze.level += 1;
    grenze.radius = effect.radius || (CONFIG.GRENZE_RADIUS + (grenze.level - 1) * 5);
    
    showTemporaryMessage(`⬆️ Grenzkontrolle Radius: ${grenze.radius} Zellen (Stufe ${grenze.level})`, '#9b59b6', true);
    markDirty();
    
    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }
    return true;
}

// ===== GRENZKONTROLLE ZERSTÖREN =====
function destroyGrenze(gx, gy) {
    const idx = grenzen.findIndex(g => g.gridX === gx && g.gridY === gy);
    if (idx === -1) return false;
    
    const grenze = grenzen[idx];
    // Bauarbeiter freigeben
    if (grenze.builder) {
        const builder = villagers.find(v => v.id === grenze.builder);
        if (builder) {
            builder.isBuilding = false;
            builder.buildingTarget = null;
            builder.state = 'idle';
            builder.hasTask = false;
        }
    }
    grenzen.splice(idx, 1);
    markDirty();
    
    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }
    return true;
}

// ===== UPGRADE BUILDING (Spieler 1) – NETZWERK-FÄHIG =====
function upgradeBuilding(building) {
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'upgrade',
            player: 'player',
            buildingId: building.id
        });
        showTemporaryMessage(`📤 Upgrade-Befehl an Host gesendet (ID: ${building.id})`, '#ffd966');
        return true;
    }

    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
    resources.wood -= cost.wood;
    resources.stone -= cost.stone;

    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) :
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of resourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
            showTemporaryMessage(`⬆️ Turm Reichweite auf ${building.range} erhöht!`, '#ffd966');
        }
        showTemporaryMessage(`⬆️ Turm Kapazität auf ${building.maxStoneAmmo} erhöht!`, '#ffd966');
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    }

    markDirty();

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== ZERSTÖREN (Spieler 1) =====
function destroyBuilding(gx, gy) {
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'destroy',
            player: 'player',
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Abriss-Befehl an Host gesendet (${gx},${gy})`, '#ffd966');
        return true;
    }

    const idx = buildings.findIndex(b => b.gridX === gx && b.gridY === gy);
    if (idx === -1) return false;
    const building = buildings[idx];
    const captureKey = 'capture_' + building.id;
    if (captureTimers[captureKey]) {
        delete captureTimers[captureKey];
    }
    if (building.type === 'wachturm') {
        for (let v of villagers) {
            if (v.alive && v.towerTarget === building) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
                v.isDeliveringStone = false;
                v.carrying = null;
                v.towerTarget = null;
                v.stoneToDeliver = 0;
                v.hasReservedStone = false;
                v.state = 'idle';
                v.hasTask = false;
            }
        }
    }
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  building.type === 'steinmetz' ? getSteinmetzFields(building) : [];
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    resourceNodes = resourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));
    if (building.type === 'haus') {
        const residents = villagers.filter(v => v.alive && v.homeId === building.id);
        for (let v of residents) {
            if (v.hasReservedStone && v.towerTarget) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') { resources.stone += (v.stoneToDeliver || 0); }
                v.hasReservedStone = false;
            }
            v.alive = false;
        }
        villagers = villagers.filter(v => v.alive);
    }
    buildings.splice(idx, 1);
    markDirty();

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== NPC BAUMEISTER FÜR NORMALE GEBÄUDE =====
function assignNpcBuilderToConstruction(buildingId) {
    const building = npcBuildings.find(b => b.id === buildingId);
    if (!building) return false;
    if (!building.isUnderConstruction) return false;
    if (building.builder) return true;
    
    const freeVillagers = npcVillagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        building.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = building.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    building.builder = builder.id;
    building.waitingForBuilder = false;
    constructionSites[building.id] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: true,
        isGrenze: false
    };
    markDirty();
    return true;
}

// ===== NPC BAUMEISTER FÜR GRENZKONTROLLEN =====
function assignNpcBuilderToGrenze(grenzeId) {
    const grenze = npcGrenzen.find(g => g.id === grenzeId);
    if (!grenze) return false;
    if (!grenze.isUnderConstruction) return false;
    if (grenze.builder) return true;
    
    const freeVillagers = npcVillagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        grenze.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = grenze.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    grenze.builder = builder.id;
    grenze.waitingForBuilder = false;
    constructionSites[`grenze_npc_${grenze.id}`] = {

    };

    return true;
}

// ===== NPC CAN AFFORD =====
function npcCanAfford(type) {
    // ===== KORREKTE ZÄHLUNG DER FREIEN EINWOHNER =====
    const free = npcVillagers.filter(v => 
        v.alive && 
        v.state === 'idle' && 
        v.carrying === null && 
        !v.hasTask && 
        !v.isAttacking && 
        !v.isBuilding
    ).length;
    
    switch(type) {
        case 'haus': return npcResources.wood >= 3;
        case 'lager': return npcResources.wood >= 10 && npcResources.stone >= 10;
        case 'bauer': return npcResources.wood >= 5;
        case 'holzfaeller': return free >= 2;
        case 'steinmetz': return npcResources.wood >= 5 && free >= 2;
        case 'wachturm': return npcResources.wood >= 15;
        case 'grenze': return free >= CONFIG.GRENZE_COST_VILLAGERS;
        default: return false;
    }
}

function npcCanAffordUpgrade(building) {
    const { cost } = getUpgradeCostAndEffect(building);
    if (building.type === 'grenze') {
        const { cost } = getUpgradeCostAndEffect({ type: 'grenze', level: building.level });
        return npcResources.wood >= cost.wood && npcResources.stone >= cost.stone;
    }
    return npcResources.wood >= cost.wood && npcResources.stone >= cost.stone;
}

function npcDeductCost(type) {
    switch(type) {
        case 'haus': npcResources.wood -= 3; break;
        case 'lager': npcResources.wood -= 10; npcResources.stone -= 10; break;
        case 'bauer': npcResources.wood -= 5; break;
        case 'holzfaeller': break;
        case 'steinmetz': npcResources.wood -= 5; break;
        case 'wachturm': npcResources.wood -= 15; break;
        case 'grenze': break;
    }
    let einwohnerKosten = 0;
    if (type === 'holzfaeller') einwohnerKosten = 2;
    else if (type === 'steinmetz') einwohnerKosten = 2;
    else if (type === 'grenze') einwohnerKosten = CONFIG.GRENZE_COST_VILLAGERS;
    if (einwohnerKosten > 0) npcRemoveFreeVillagers(einwohnerKosten);
    
    // ===== CACHE INVALIDIEREN (Position wurde belegt) =====
    npcInvalidateBuildCache();
    
    markDirty();
}

function npcInvalidateBuildCache() {
    for (let key in npcBuildCacheByType) {
        npcBuildCacheByType[key].dirty = true;
    }
    npcBuildCache.dirty = true;
}

function npcRemoveFreeVillagers(count) {
    let removed = 0;
    for (let v of npcVillagers) {
        if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
            v.alive = false;
            const home = npcBuildings.find(b => b.id === v.homeId);
            if (home && home.residents > 0) home.residents -= 1;
            removed++;
        }
    }
    npcVillagers = npcVillagers.filter(v => v.alive);
    markDirty();
}

// ===== NPC BUILDING UPGRADE =====
function npcUpgradeBuilding(building) {
    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (npcResources.wood < cost.wood || npcResources.stone < cost.stone) return false;
    npcResources.wood -= cost.wood;
    npcResources.stone -= cost.stone;

    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) : 
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) : 
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of npcResourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
        }
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    } else if (building.type === 'grenze') {
        building.radius = effect.radius || (CONFIG.GRENZE_RADIUS + (building.level - 1) * 5);
    }
    markDirty();
    return true;
}

// ===== NPC GRENZKONTROLLE UPGRADE =====
function npcUpgradeGrenze(grenze) {
    const { cost, effect } = getUpgradeCostAndEffect({ type: 'grenze', level: grenze.level });
    if (npcResources.wood < cost.wood || npcResources.stone < cost.stone) return false;
    npcResources.wood -= cost.wood;
    npcResources.stone -= cost.stone;
    
    grenze.level += 1;
    grenze.radius = effect.radius || (CONFIG.GRENZE_RADIUS + (grenze.level - 1) * 5);
    markDirty();
    return true;
}

// ===== NPC BUILDING ZERSTÖREN =====
function npcDestroyBuilding(gx, gy) {
    const idx = npcBuildings.findIndex(b => b.gridX === gx && b.gridY === gy);
    if (idx === -1) return false;
    
    const building = npcBuildings[idx];
    if (building.builder) {
        const builder = npcVillagers.find(v => v.id === building.builder);
        if (builder) {
            builder.isBuilding = false;
            builder.buildingTarget = null;
            builder.state = 'idle';
            builder.hasTask = false;
        }
    }
    npcBuildings.splice(idx, 1);
    markDirty();
    return true;
}

// ===== NPC GRENZKONTROLLE ZERSTÖREN =====
function npcDestroyGrenze(gx, gy) {

// ===== NPC BAUMEISTER FÜR CONSTRUCTION SITES AKTUALISIEREN =====
function updateNpcConstruction(dt) {
    // Baumeister zuweisen für NPC Gebäude
    for (let b of npcBuildings) {
        if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
            assignNpcBuilderToConstruction(b.id);
        }
    }
    for (let g of npcGrenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignNpcBuilderToGrenze(g.id);
        }
    }

    // Baustellen aktualisieren (nur NPC)
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (!site.isNPC) continue;
        
        // ===== NPC GRENZKONTROLLE =====
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_npc_', ''));
            const grenze = npcGrenzen.find(g => g.id === grenzeId);
            if (!grenze) {
                delete constructionSites[key];
                continue;
            }

            const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
            if (!builder || !builder.alive) {
                delete constructionSites[key];
                grenze.builder = null;
                grenze.waitingForBuilder = true;
                assignNpcBuilderToGrenze(grenze.id);
                continue;
            }

            const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            builder.targetX = targetX;
            builder.targetY = targetY;
            builder.state = 'building';
            builder.hasTask = true;

            const d = Math.hypot(builder.x - targetX, builder.y - targetY);

            if (d < 5) {
                site.timer += dt;
                grenze.constructionTimer = site.timer;
                grenze.constructionProgress = Math.min(1, site.timer / site.maxTimer);

                if (site.timer >= site.maxTimer) {
                    grenze.isUnderConstruction = false;
                    grenze.constructionProgress = 1;
                    grenze.constructionTimer = site.maxTimer;
                    grenze.waitingForBuilder = false;
                    builder.isBuilding = false;
                    builder.buildingTarget = null;
                    builder.state = 'idle';
                    builder.hasTask = false;
                    delete constructionSites[key];
                    markDirty();
                    showTemporaryMessage('🤖 NPC Grenzkontrolle fertig!', '#4a235a', true);
                }
            }
            continue;
        }

        // ===== NPC NORMALE GEBÄUDE =====
        const buildingId = parseInt(key);
        const building = npcBuildings.find(b => b.id === buildingId);
        if (!building) {
            delete constructionSites[key];
            continue;
        }

        const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
        if (!builder || !builder.alive) {
            delete constructionSites[key];
            building.builder = null;
            building.waitingForBuilder = true;
            assignNpcBuilderToConstruction(building.id);
            continue;
        }

        const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        builder.targetX = targetX;
        builder.targetY = targetY;
        builder.state = 'building';
        builder.hasTask = true;

        const d = Math.hypot(builder.x - targetX, builder.y - targetY);

        if (d < 5) {
            site.timer += dt;
            building.constructionTimer = site.timer;
            building.constructionProgress = Math.min(1, site.timer / site.maxTimer);

            if (site.timer >= site.maxTimer) {
                building.isUnderConstruction = false;
                building.constructionProgress = 1;
                building.constructionTimer = site.maxTimer;
                building.waitingForBuilder = false;

                if (building.type === 'haus') {
                    building.residents = 1;
                    const v = new Villager(nextVillagerId++, building.id, true);
                    const cx = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const cy = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.x = cx;
                    v.y = cy;
                    v.targetX = cx;
                    v.targetY = cy;
                    v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
                    npcVillagers.push(v);
                }

                building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
                building.maxProductionTime = building.baseMaxProductionTime;
                building.baseFireRate = 1.0;
                if (building.type === 'bauer') building.productionType = 'grain';
                else if (building.type === 'holzfaeller') building.productionType = 'wood';
                else if (building.type === 'steinmetz') building.productionType = 'stone';

                builder.isBuilding = false;
                builder.buildingTarget = null;
                builder.state = 'idle';
                builder.hasTask = false;
                delete constructionSites[key];
                markDirty();
            }
        }
    }
}

// ===== CACHE-MAPS NEU AUFBAUEN =====
function rebuildResourceMaps() {
    resourceNodeMap = new Map(resourceNodes.map(n => [n.id, n]));
    resourceNodeByPosition = new Map(resourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));
    player2ResourceNodeMap = new Map(player2ResourceNodes.map(n => [n.id, n]));
    player2ResourceNodeByPosition = new Map(player2ResourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));
    npcResourceNodeMap = new Map(npcResourceNodes.map(n => [n.id, n]));
    npcResourceNodeByPosition = new Map(npcResourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));
}

// ===== SPIELER 1 RESSOURCEN-NODES (KOMPLETT KORRIGIERT) =====
function updatePlayerResourceNodes(dt) {
    // ===== 1. TIMER FÜR EXISTIERENDE NODES =====
    for (let i = resourceNodes.length - 1; i >= 0; i--) {
        const node = resourceNodes[i];
        
        // Wenn Node bereits ready ist, überspringen
        if (node.ready) continue;
        
        // Timer hochzählen
        node.timer += dt;
        
        // Wenn Timer abgelaufen ist -> Felder werden reif (ready = true)
        if (node.timer >= node.maxTimer) {
            node.ready = true;
            node.timer = node.maxTimer;
            
            // Alle Felder auf "bereit zum Ernten" setzen (harvested = false)
            if (node.fields && node.fields.length > 0) {
                for (let f of node.fields) {
                    f.harvested = false;      // Felder sind bereit zum Ernten
                    f.harvestTimer = 0;
                    f.isBeingHarvested = false;
                }
                console.log(`🌾 Node ${node.id} ist reif! ${node.fields.length} Felder warten auf Ernte`);
            }
            markDirty();
        }
    }

    // ===== 2. NODES FÜR PRODUKTIONSGEBÄUDE ERSTELLEN =====
    const resourceBuildings = buildings.filter(b => 
        !b.isUnderConstruction && 
        (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz')
    );

    const existingNodeMap = new Map();
    for (let node of resourceNodes) {
        if (node.buildingId !== undefined) {
            existingNodeMap.set(node.buildingId, node);
        }
    }

    for (let b of resourceBuildings) {
        const type = b.productionType;
        const fields = b.type === 'bauer' ? getBauerFields(b) :
                      b.type === 'holzfaeller' ? getHolzfaellerFields(b) :
                      getSteinmetzFields(b);
        const fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        b.fieldCount = fieldCount;
        
        let node = existingNodeMap.get(b.id);
        
        if (node) {
            // Node existiert bereits - nur Felder aktualisieren wenn nötig
            node.fieldCount = fieldCount;
            node.maxTimer = b.maxProductionTime;
            
            if (!node.fields || node.fields.length !== fields.length) {
                node.fields = fields.map(f => ({
                    x: f.x,
                    y: f.y,
                    harvested: false,
                    harvestTimer: 0,
                    isBeingHarvested: false
                }));
                // Node zurücksetzen wenn Felder sich geändert haben
                node.ready = false;
                node.timer = 0;
            }
        } else {
            // ===== NEUEN NODE ERSTELLEN =====
            const centerX = b.gridX;
            const centerY = b.gridY;
            const key = `${centerX},${centerY},${type}`;
            const existing = resourceNodeByPosition.get(key);
            
            if (!existing) {
                node = {
                    id: nextResourceId++,
                    x: centerX,
                    y: centerY,
                    type: type,
                    timer: 0,
                    maxTimer: b.maxProductionTime,
                    ready: false,
                    claimedBy: null,
                    isNPC: false,
                    buildingId: b.id,
                    fieldCount: fieldCount,
                    harvestProgress: 0,
                    fields: fields.map(f => ({
                        x: f.x,
                        y: f.y,
                        harvested: false,
                        harvestTimer: 0,
                        isBeingHarvested: false
                    }))
                };
                resourceNodes.push(node);
                resourceNodeMap.set(node.id, node);
                resourceNodeByPosition.set(key, node);
                b.nodeId = node.id;
                console.log(`✅ NEUER Node erstellt: id=${node.id}, type=${node.type}, fields=${node.fields.length}`);
            } else {
                // Node existiert an dieser Position - aktualisieren
                existing.buildingId = b.id;
                existing.fieldCount = fieldCount;
                existing.maxTimer = b.maxProductionTime;
                b.nodeId = existing.id;
                if (!existing.fields || existing.fields.length !== fields.length) {
                    existing.fields = fields.map(f => ({
                        x: f.x,
                        y: f.y,
                        harvested: false,
                        harvestTimer: 0,
                        isBeingHarvested: false
                    }));
                }
                // Node zurücksetzen
                existing.ready = false;
                existing.timer = 0;
            }
        }
    }

    // ===== 3. NODES OHNE GEBÄUDE ENTFERNEN =====
    const activeBuildingIds = new Set(resourceBuildings.map(b => b.id));
    for (let i = resourceNodes.length - 1; i >= 0; i--) {
        const node = resourceNodes[i];
        if (node.buildingId !== undefined && !activeBuildingIds.has(node.buildingId)) {
            if (node.claimedBy) {
                const villager = villagers.find(v => v.id === node.claimedBy);
                if (villager) {
                    villager.resourceTarget = null;
                    villager.state = 'idle';
                    villager.hasTask = false;
                }
            }
            resourceNodes.splice(i, 1);
        }
    }

    refreshPlayerResourceCache();
    markDirty();
}

function updateResourceNodes(dt) {
    // Spieler 1 (immer aktiv)
    updatePlayerResourceNodes(dt);

    // Spieler 2 (Split-Modus ODER Netzwerk-Modus)
    if (SPLIT_SCREEN || NETWORK_MODE) {
        updatePlayer2ResourceNodes(dt);
    }

    // NPC (nur im Einzelmodus)
    if (!SPLIT_SCREEN && !NETWORK_MODE && npcStarted) {
        updateNpcResourceNodes(dt);
    }

    // Alle Caches neu aufbauen
    rebuildResourceMaps();
}

function spawnVillager(homeId) {
    const home = buildings.find(b => b.id === homeId);
    if (!home) return null;
    const v = new Villager(nextVillagerId++, homeId, false);
    const cx = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const cy = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    v.x = cx;
    v.y = cy;
    v.targetX = cx;
    v.targetY = cy;
    villagers.push(v);
    // === CACHE INVALIDIEREN (Neugeborener Einwohner) ===
    markPlayerCacheDirty();
    markDirty();
    return v;
}

function killVillager(v) {
    v.alive = false;
    if (v.resourceTarget) {
        const node = resourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.claimedBy === v.id) node.claimedBy = null;
    }
    if (v.hasReservedStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        if (v.carrying === 'stone' || v.isDeliveringStone) {
            resources.stone += (v.stoneToDeliver || 0);
        }
        v.hasReservedStone = false;
        v.towerTarget = null;
        v.stoneToDeliver = 0;
    }
    if (v.carrying === 'stone') {
        resources.stone += 1;
        v.carrying = null;
    }
    const home = buildings.find(b => b.id === v.homeId);
    if (home && home.residents > 0) home.residents -= 1;
    villagers = villagers.filter(v => v.alive);
    // === CACHE INVALIDIEREN (Einwohner gestorben) ===
    markPlayerCacheDirty();
    markDirty();
}

// ===== NEUE FUNKTION: Bereinigt einen Spieler 1 Einwohner (bei Eroberung) =====
function clearVillagerTasks(v) {
    if (!v || !v.alive) return;
    
    // Ressourcen-Ziel freigeben
    if (v.resourceTarget) {
        const node = resourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.claimedBy === v.id) node.claimedBy = null;
        v.resourceTarget = null;
    }
    
    // Getragene Ressourcen ins Lager zurückgeben
    if (v.carrying === 'grain') resources.grain += 1;
    else if (v.carrying === 'wood') resources.wood += 1;

function spawnVillagerPlayer2(homeId) {
    const home = player2Buildings.find(b => b.id === homeId);
    if (!home) return null;
    const v = new Villager(player2NextVillagerId++, homeId, false, 'player2');
    const cx = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const cy = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    v.x = cx;
    v.y = cy;
    v.targetX = cx;
    v.targetY = cy;
    player2Villagers.push(v);
    markPlayer2CacheDirty();
    markDirty();
    return v;
}

function killVillagerPlayer2(v) {
    v.alive = false;
    if (v.resourceTarget) {
        const node = player2ResourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.claimedBy === v.id) node.claimedBy = null;
    }
    if (v.hasReservedStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        if (v.carrying === 'stone' || v.isDeliveringStone) {
            player2Resources.stone += (v.stoneToDeliver || 0);
        }
        v.hasReservedStone = false;
        v.towerTarget = null;
        v.stoneToDeliver = 0;
    }
    if (v.carrying === 'stone') {
        player2Resources.stone += 1;
        v.carrying = null;
    }
    const home = player2Buildings.find(b => b.id === v.homeId);
    if (home && home.residents > 0) home.residents -= 1;
    player2Villagers = player2Villagers.filter(v => v.alive);
    markPlayer2CacheDirty();
    markDirty();
}

                                captured.waitingForBuilder = true;
                                assignBuilderToConstruction(captured.id);
                            }

                            // ===== RESSOURCEN-NODES ÜBERTRAGEN =====
                            transferResourceNodesPlayer2ToPlayer(captured);

                            // ===== CAPTURE-STATUS ZURÜCKSETZEN =====
                            for (let v of villagersOnBuilding) {
                                if (v.state === 'movingToCapture') {
                                    clearVillagerTasks(v);
                                    v.captureTargetId = null;
                                }
                            }

                            SoundFX.playIfVisible(buildingCenterX, buildingCenterY, 'capture');
                            showTemporaryMessage('🏰 Spieler 2 Wachturm erobert!', '#ffd966');
                            delete captureTimers[key];
                            markDirty();
                        }
                    }
                }
            } else {
                if (captureTimers[key]) {
                    const ct = captureTimers[key];
                    ct.timer = Math.max(0, ct.timer - dt * 2);
                    if (ct.timer <= 0) {
                        p2b.captureProgress = 0;
                        p2b.beingCaptured = false;
                        p2b.capturedBy = null;
                        delete captureTimers[key];
                    }
                }
            }
        }

        // ===== NUR WACHTÜRME von Spieler 1 durch Spieler 2 erobern =====
        for (let pb of [...buildings]) {
            if (pb.type !== 'wachturm') continue;
            
            const buildingCenterX = pb.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const buildingCenterY = pb.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const key = 'capture_p1_' + pb.id;

            const nearbyP2Villagers = getPlayer2VillagersInRange(buildingCenterX, buildingCenterY, captureRange)
                .filter(v => v.alive && !v.isAttacking);
            
            for (let v of nearbyP2Villagers) {
                if (v.state === 'idle' && !v.hasTask) {
                    const distToBuilding = Math.hypot(v.x - buildingCenterX, v.y - buildingCenterY);
                    if (distToBuilding > 5) {
                        v.targetX = buildingCenterX;
                        v.targetY = buildingCenterY;
                        v.state = 'movingToCapture';
                        v.hasTask = true;
                        v.captureTargetId = pb.id;
                    }
                }
            }

            const p2VillagersOnBuilding = nearbyP2Villagers.filter(v =>
                Math.hypot(v.x - buildingCenterX, v.y - buildingCenterY) < 5
            );
            const enemiesNearby = getEnemiesInRange(buildingCenterX, buildingCenterY, captureRange)
                .some(e => e.alive);

            if (enemiesNearby) {
                if (captureTimers[key]) delete captureTimers[key];
                pb.captureProgress = 0;
                pb.beingCaptured = false;
                pb.capturedBy = null;
                for (let v of p2VillagersOnBuilding) {
                    if (v.state === 'movingToCapture') {
                        clearVillagerPlayer2Tasks(v);
                        v.captureTargetId = null;
                    }
                }
                continue;
            }

            if (p2VillagersOnBuilding.length > 0) {
                if (!captureTimers[key]) {
                    captureTimers[key] = { timer: 0, lastOccupiedBy: 'player2' };
                }
                const ct = captureTimers[key];

                    ct.timer += dt * p2VillagersOnBuilding.length;
                    pb.captureProgress = Math.min(1, ct.timer / CONFIG.CAPTURE_TIME);

                    pb.capturedBy = 'player2';

                        const idx = buildings.indexOf(pb);
                        if (idx !== -1) {
                            const captured = buildings.splice(idx, 1)[0];
                            captured.isNPC = false;
                            captured.playerId = 'player2';
                            captured.id = player2NextBuildingId++;
                            captured.captureProgress = 0;
                            captured.beingCaptured = false;
                            captured.capturedBy = null;

                            // ===== BEREINIGUNG SPIELER 1 =====
                            for (let v of villagers) {
                                if (!v.alive) continue;
                                if (v.state === 'movingToCapture' && v.captureTargetId === pb.id) {
                                    clearVillagerTasks(v);
                                    v.captureTargetId = null;
                                }
                                if (v.isDeliveringStone && v.towerTarget === pb) {
                                    clearVillagerTasks(v);
                                }
                                if (v.isBuilding && v.buildingTarget === pb.id) {
                                    clearVillagerTasks(v);
                                }
                            }

                            // ===== BEREINIGUNG SPIELER 2 =====
                            for (let v of player2Villagers) {
                                if (!v.alive) continue;
                                if (v.state === 'movingToCapture' && v.captureTargetId === pb.id) {
                                    clearVillagerPlayer2Tasks(v);
                                    v.captureTargetId = null;
                                }
                                if (v.isDeliveringStone && v.towerTarget === pb) {
                                    clearVillagerPlayer2Tasks(v);
                                }
                                if (v.isBuilding && v.buildingTarget === pb.id) {
                                    clearVillagerPlayer2Tasks(v);
                                }
                            }

                            // ===== TURM-SPEZIFISCHE BEREINIGUNG =====
                            if (captured.type === 'wachturm') {
                                for (let v of villagers) {
                                    if (v.alive && v.towerTarget === captured) {
                                        clearVillagerTasks(v);
                                    }
                                }
                            }

                            // ===== GEBÄUDE ÜBERTRAGEN =====
                            player2Buildings.push(captured);

                            // ===== SPIELER 1-EINWOHNER ÜBERTRAGEN =====
                            const p1Residents = villagers.filter(v => v.homeId === pb.id && v.alive);
                            for (let v of p1Residents) {
                                v.homeId = captured.id;
                                v.playerId = 'player2';
                                v.isNPC = false;
                                v.carrying = null;
                                v.state = 'idle';
                                v.hasTask = false;
                                v.isAttacking = false;
                                v.attackTarget = null;
                                v.resourceTarget = null;
                                v.isDeliveringStone = false;
                                v.isBuilding = false;
                                v.buildingTarget = null;
                                v.towerTarget = null;
                                v.stoneToDeliver = 0;
                                v.hasReservedStone = false;
                                v.deliveryTarget = null;
                                v.combatCooldown = 0;
                                v.captureTargetId = null;
                            }
                            villagers = villagers.filter(v => v.playerId === 'player');
                            player2Villagers.push(...p1Residents);

                            // ===== BAUSTELLE ÜBERNEHMEN =====
                            if (captured.isUnderConstruction) {

                                captured.waitingForBuilder = true;
                                assignBuilderToConstructionPlayer2(captured.id);

                            // ===== RESSOURCEN-NODES ÜBERTRAGEN =====

                            for (let v of p2VillagersOnBuilding) {

// =========================================================================
//  HILFSFUNKTIONEN FÜR RESSOURCEN-TRANSFER (NPC ↔ SPIELER)
// =========================================================================

function transferResourceNodes(building, fromNPCtoPlayer) {
    if (building.type !== 'bauer' && building.type !== 'holzfaeller' && building.type !== 'steinmetz') return;
    if (building.isUnderConstruction) return;

    const resourceType = building.productionType;
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  getSteinmetzFields(building);

    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));

    // Quell- und Ziel-Nodes bestimmen
    let sourceNodes, targetNodes, targetMap, targetPositionMap, nextIdRef;
    if (fromNPCtoPlayer) {
        sourceNodes = npcResourceNodes;
        targetNodes = resourceNodes;
        targetMap = resourceNodeMap;
        targetPositionMap = resourceNodeByPosition;
        nextIdRef = 'nextResourceId';
    } else {
        sourceNodes = resourceNodes;
        targetNodes = npcResourceNodes;
        targetMap = npcResourceNodeMap;
        targetPositionMap = npcResourceNodeByPosition;
        nextIdRef = 'nextNpcResourceId';
    }

    // Nodes von Quelle entfernen
    for (let i = sourceNodes.length - 1; i >= 0; i--) {
        const node = sourceNodes[i];
        if (fieldSet.has(node.x + ',' + node.y) && node.type === resourceType) {
            if (node.claimedBy) {
                const villager = (fromNPCtoPlayer ? villagers : npcVillagers).find(v => v.id === node.claimedBy);
                if (villager) {
                    villager.resourceTarget = null;
                    villager.state = 'idle';
                    villager.hasTask = false;
                }
            }
            sourceNodes.splice(i, 1);
        }
    }

    // Nodes zum Ziel hinzufügen
    for (let f of fields) {
        const key = `${f.x},${f.y},${resourceType}`;
        const existing = targetPositionMap.get(key);
        if (!existing) {
            const newNode = {
                id: (fromNPCtoPlayer ? nextResourceId++ : nextNpcResourceId++),
                x: f.x,
                y: f.y,
                type: resourceType,
                timer: 0,
                maxTimer: building.maxProductionTime,
                ready: false,
                claimedBy: null,
                isNPC: !fromNPCtoPlayer
            };
            targetNodes.push(newNode);
            targetMap.set(newNode.id, newNode);
            targetPositionMap.set(key, newNode);
        } else {
            existing.timer = 0;
            existing.ready = false;
            existing.maxTimer = building.maxProductionTime;
            existing.claimedBy = null;
        }
    }

    rebuildResourceMaps();
    refreshPlayerResourceCache();
    refreshNpcResourceCache();
    markDirty();
}

//  HILFSFUNKTIONEN FÜR RESSOURCEN-TRANSFER (SPIELER ↔ SPIELER 2)

function transferResourceNodesPlayer2ToPlayer(building) {

    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));

    // Nodes von Spieler 2 entfernen
    for (let i = player2ResourceNodes.length - 1; i >= 0; i--) {

    // Nodes zu Spieler 1 hinzufügen
    for (let f of fields) {
