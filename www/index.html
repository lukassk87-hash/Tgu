let renderDirty = true;

function markDirty() {
    renderDirty = true;
}

function draw() {
    if (!renderDirty) return;

    const now = performance.now();
    if (!draw._lastDrawTime) draw._lastDrawTime = 0;
    if (now - draw._lastDrawTime < 100 && renderDirty) return;
    draw._lastDrawTime = now;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (SPLIT_SCREEN) {
        drawSplitScreen();
    } else {
        drawSingleScreen();
    }

    renderDirty = false;
}

function drawSingleScreen() {
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    const viewLeft = Math.max(0, Math.floor((camera.x - canvas.width / 2 / camera.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewRight = Math.min(CONFIG.GRID_WIDTH, Math.ceil((camera.x + canvas.width / 2 / camera.zoom) / CONFIG.CELL_SIZE) + 2);
    const viewTop = Math.max(0, Math.floor((camera.y - canvas.height / 2 / camera.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewBottom = Math.min(CONFIG.GRID_HEIGHT, Math.ceil((camera.y + canvas.height / 2 / camera.zoom) / CONFIG.CELL_SIZE) + 2);
    
    const viewLeftPx = viewLeft * CONFIG.CELL_SIZE;
    const viewRightPx = viewRight * CONFIG.CELL_SIZE;
    const viewTopPx = viewTop * CONFIG.CELL_SIZE;
    const viewBottomPx = viewBottom * CONFIG.CELL_SIZE;

    // ===== TERRAIN =====
    for (let y = viewTop; y < viewBottom; y++) {
        for (let x = viewLeft; x < viewRight; x++) {
            const type = terrainMap[y][x];
            ctx.fillStyle = getTerrainColor(type);
            ctx.fillRect(x * CONFIG.CELL_SIZE - 0.5, y * CONFIG.CELL_SIZE - 0.5, CONFIG.CELL_SIZE + 1, CONFIG.CELL_SIZE + 1);
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            
        }
    }

    // ===== GITTER + OVERLAY-BEDINGUNG =====
    const showGrid = selectedBuildingType || upgradeMode || destroyMode || !gameStarted;
    
    if (showGrid) {
        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
        ctx.lineWidth = 0.5;
        for (let i = viewLeft; i <= viewRight; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CONFIG.CELL_SIZE, viewTop * CONFIG.CELL_SIZE);
            ctx.lineTo(i * CONFIG.CELL_SIZE, viewBottom * CONFIG.CELL_SIZE);
            ctx.stroke();
        }
        for (let j = viewTop; j <= viewBottom; j++) {
            ctx.beginPath();
            ctx.moveTo(viewLeft * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
            ctx.lineTo(viewRight * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
            ctx.stroke();
        }
    }

// ===== GRENZE (SPIELER 1) =====
const outerGrenze1 = getOuterGrenze(grenzen);
if (outerGrenze1 && outerGrenze1.points && outerGrenze1.points.length > 3) {
    const pulse = Math.sin(performance.now() / 1000 * 2) * 0.3 + 0.7;
    
    // Hauptlinie
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(outerGrenze1.points[0].x, outerGrenze1.points[0].y);
    for (let i = 1; i < outerGrenze1.points.length; i++) {
        ctx.lineTo(outerGrenze1.points[i].x, outerGrenze1.points[i].y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Glow
    ctx.strokeStyle = `rgba(192, 57, 43, ${0.15 * pulse})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(outerGrenze1.points[0].x, outerGrenze1.points[0].y);
    for (let i = 1; i < outerGrenze1.points.length; i++) {
        ctx.lineTo(outerGrenze1.points[i].x, outerGrenze1.points[i].y);
    }
    ctx.closePath();
    ctx.stroke();
}

// ===== GRENZE (NPC) =====
const outerGrenzeNpc = getOuterGrenze(npcGrenzen);
if (outerGrenzeNpc && outerGrenzeNpc.points && outerGrenzeNpc.points.length > 3) {
    const pulse = Math.sin(performance.now() / 1000 * 2 + 1) * 0.3 + 0.7;
    
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(outerGrenzeNpc.points[0].x, outerGrenzeNpc.points[0].y);
    for (let i = 1; i < outerGrenzeNpc.points.length; i++) {
        ctx.lineTo(outerGrenzeNpc.points[i].x, outerGrenzeNpc.points[i].y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.strokeStyle = `rgba(41, 128, 185, ${0.15 * pulse})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(outerGrenzeNpc.points[0].x, outerGrenzeNpc.points[0].y);
    for (let i = 1; i < outerGrenzeNpc.points.length; i++) {
        ctx.lineTo(outerGrenzeNpc.points[i].x, outerGrenzeNpc.points[i].y);
    }
    ctx.closePath();
    ctx.stroke();
}

    // ===== START- / BAU-VORSCHAU =====
    if (!gameStarted) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let phaseText = '';
        if (startPhase === 'grenze') phaseText = '🟣 Grenzkontrolle (kostenlos)';
        else if (startPhase === 'lager') phaseText = '📦 Lager (kostenlos)';
        else phaseText = '🏠 Haus (kostenlos)';
        ctx.fillText(`👉 Platziere dein ${phaseText}`, WORLD_WIDTH / 2, 50);
        ctx.font = '20px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText('Tippe auf eine freie Zelle', WORLD_WIDTH / 2, 90);
        if (pendingStartBuild) {
            const px = pendingStartBuild.gx * CONFIG.CELL_SIZE;
            const py = pendingStartBuild.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,255,0,0.3)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ffd966';
            ctx.lineWidth = 3;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
        }
    }

    // ===== BAU-VORSCHAU =====
    if (gameStarted && pendingBuild && selectedBuildingType) {
        const px = pendingBuild.gx * CONFIG.CELL_SIZE;
        const py = pendingBuild.gy * CONFIG.CELL_SIZE;
        const isInRadius = isWithinBuildRadius(pendingBuild.gx, pendingBuild.gy, 'player');
        const isValid = isInRadius || selectedBuildingType === 'grenze';
        ctx.fillStyle = isValid ? 'rgba(255,255,0,0.2)' : 'rgba(255,0,0,0.2)';
        ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.strokeStyle = isValid ? '#ffd966' : '#ff0000';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.setLineDash([]);
        if (!isValid && selectedBuildingType !== 'grenze') {
            ctx.fillStyle = 'rgba(255,0,0,0.7)';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('⚠️ Außerhalb des Radius!', px + CONFIG.CELL_SIZE/2, py - 4);
        }
        if (selectedBuildingType === 'bauer' || selectedBuildingType === 'holzfaeller' || selectedBuildingType === 'steinmetz') {
            const neighbors = getNeighborCells(pendingBuild.gx, pendingBuild.gy, 1);
            const resourceType = selectedBuildingType === 'bauer' ? 'grain' : selectedBuildingType === 'holzfaeller' ? 'wood' : 'stone';
            for (let n of neighbors) {
                if (!isCellOccupied(n.x, n.y) && isResourceFieldAvailable(n.x, n.y, resourceType)) {
                    ctx.fillStyle = 'rgba(0,255,0,0.25)';
                    ctx.fillRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    ctx.strokeStyle = 'rgba(0,255,0,0.5)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                }
            }
        }
    }

    // ===== UPGRADE-VORSCHAU =====
    if (gameStarted && pendingUpgrade) {
        const px = pendingUpgrade.gx * CONFIG.CELL_SIZE;
        const py = pendingUpgrade.gy * CONFIG.CELL_SIZE;
        ctx.fillStyle = 'rgba(255,0,255,0.25)';
        ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.strokeStyle = '#ff66ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.setLineDash([]);
    }

    // ===== ABRISS-VORSCHAU =====
    if (gameStarted && pendingDestroy) {
        const px = pendingDestroy.gx * CONFIG.CELL_SIZE;
        const py = pendingDestroy.gy * CONFIG.CELL_SIZE;
        ctx.fillStyle = 'rgba(255,0,0,0.25)';
        ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.setLineDash([]);
    }

    // ===== RESSOURCEN-FELDER (SPIELER 1) =====
    if (gameStarted) {
        const resourceBuildings = buildings.filter(b => !b.isUnderConstruction && (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz'));
        for (let building of resourceBuildings) {
            const fields = building.type === 'bauer' ? getBauerFields(building) : building.type === 'holzfaeller' ? getHolzfaellerFields(building) : getSteinmetzFields(building);
            const resourceType = building.productionType || 'grain';
            const node = resourceNodes.find(n => n.buildingId === building.id);
            for (let field of fields) {
                if (field.x < viewLeft || field.x >= viewRight || field.y < viewTop || field.y >= viewBottom) continue;
                const x = field.x * CONFIG.CELL_SIZE;
                const y = field.y * CONFIG.CELL_SIZE;
                let isHarvested = false;
                let isBeingHarvested = false;
                if (node && node.fields) {
                    const fieldData = node.fields.find(f => f.x === field.x && f.y === field.y);
                    if (fieldData) {
                        isHarvested = fieldData.harvested;
                        isBeingHarvested = fieldData.isBeingHarvested;
                    }
                }
                
                let bgColor = 'rgba(255,255,255,0.08)';
                if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.12)';
                else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.12)';
                else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.12)';
                
                if (!isHarvested && node) {
                    if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.35)';
                    else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.35)';
                    else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.35)';
                }
                
                if (isHarvested) bgColor = 'rgba(0,0,0,0.15)';
                
                ctx.fillStyle = bgColor;
                ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                
                let icon = resourceType === 'grain' ? '🌾' : resourceType === 'wood' ? '🌲' : '🪨';
                if (isHarvested) { icon = '⬜'; ctx.globalAlpha = 0.3; } else if (isBeingHarvested) { ctx.globalAlpha = 0.8 + Math.sin(performance.now() / 1000 * 4) * 0.2; }
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
                ctx.globalAlpha = 1;
                
                if (isBeingHarvested) {
                    ctx.strokeStyle = '#ffd966';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([2, 3]);
                    ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    ctx.setLineDash([]);
                }
                if (isHarvested) {
                    ctx.strokeStyle = 'rgba(46, 204, 113, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                }
            }
        }
        
        // ===== RESSOURCEN-FELDER (NPC) =====
        const npcResourceBuildings = npcBuildings.filter(b => !b.isUnderConstruction && (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz'));
        for (let building of npcResourceBuildings) {
            const fields = building.type === 'bauer' ? getBauerFields(building) : building.type === 'holzfaeller' ? getHolzfaellerFields(building) : getSteinmetzFields(building);
            const resourceType = building.productionType || 'grain';
            const node = npcResourceNodes.find(n => n.buildingId === building.id);
            for (let field of fields) {
                if (field.x < viewLeft || field.x >= viewRight || field.y < viewTop || field.y >= viewBottom) continue;
                const x = field.x * CONFIG.CELL_SIZE;
                const y = field.y * CONFIG.CELL_SIZE;
                let isHarvested = false;
                let isBeingHarvested = false;
                if (node && node.fields) {
                    const fieldData = node.fields.find(f => f.x === field.x && f.y === field.y);
                    if (fieldData) {
                        isHarvested = fieldData.harvested;
                        isBeingHarvested = fieldData.isBeingHarvested;
                    }
                }
                
                let bgColor = 'rgba(155, 89, 182, 0.08)';
                if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.12)';
                else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.12)';
                else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.12)';
                
                if (!isHarvested && node) {
                    if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.35)';
                    else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.35)';
                    else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.35)';
                }
                
                if (isHarvested) bgColor = 'rgba(0,0,0,0.15)';
                
                ctx.fillStyle = bgColor;
                ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                
                let icon = resourceType === 'grain' ? '🌾' : resourceType === 'wood' ? '🌲' : '🪨';
                if (isHarvested) { icon = '⬜'; ctx.globalAlpha = 0.3; } else if (isBeingHarvested) { ctx.globalAlpha = 0.8 + Math.sin(performance.now() / 1000 * 4) * 0.2; }
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
                ctx.globalAlpha = 1;
                
                if (isBeingHarvested) {
                    ctx.strokeStyle = '#9b59b6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([2, 3]);
                    ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    ctx.setLineDash([]);
                }
                if (isHarvested) {
                    ctx.strokeStyle = 'rgba(46, 204, 113, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                }
            }
        }
    }

    // ===== GEBÄUDE =====
    let allBuildings = [];
    allBuildings.push(...buildings.map(b => ({...b, isGrenze: false, owner: 'player'})));
    allBuildings.push(...grenzen.map(g => ({...g, isGrenze: true, isNPC: false, playerId: 'player', owner: 'player'})));
    allBuildings.push(...npcBuildings.map(b => ({...b, isGrenze: false, owner: 'npc'})));
    allBuildings.push(...npcGrenzen.map(g => ({...g, isGrenze: true, isNPC: true, playerId: null, owner: 'npc'})));

    for (let b of allBuildings) {
        if (b.gridX < viewLeft || b.gridX >= viewRight || b.gridY < viewTop || b.gridY >= viewBottom) continue;
        const x = b.gridX * CONFIG.CELL_SIZE;
        const y = b.gridY * CONFIG.CELL_SIZE;

        if (b.isGrenze) {
            const ownerKey = b.owner === 'npc' || b.isNPC ? 'blau' : 'rot';
            const imgKey = `grenze-${ownerKey}`;
            const img = buildingImages[imgKey];
            
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            } else {
                let color = b.owner === 'npc' || b.isNPC ? '#2980b9' : '#c0392b';
                ctx.fillStyle = color;
                ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                ctx.strokeStyle = b.owner === 'npc' || b.isNPC ? '#1a5276' : '#7f1d1d';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🟣', x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
            }
            
            if (b.level > 1 && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`Lv${b.level}`, x + 4, y + 4);
            }
            
            if (showGrid) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '8px sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`${b.radius}🔄`, x + CONFIG.CELL_SIZE - 4, y + CONFIG.CELL_SIZE - 4);
            }
            
            if (b.isUnderConstruction) {
                const progress = b.constructionProgress || 0;
                const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX, barY, barW, barH);
                ctx.fillStyle = '#ffd966';
                ctx.fillRect(barX, barY, barW * progress, barH);
            }
            continue;
        }

        if (b.beingCaptured && b.captureProgress > 0) {
            const flashSpeed = 8;
            const flashValue = Math.sin(performance.now() / 1000 * flashSpeed) * 0.5 + 0.5;
            const progress = b.captureProgress;
            let color;
            if (b.capturedBy === 'player') color = '#ffd966';
            else if (b.capturedBy === 'player2') color = '#ff8a65';
            else color = '#ff4444';
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 + flashValue * 0.5})`;
            ctx.lineWidth = 2 + flashValue * 2;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(x - 1, y - 1, CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE + 2);
            ctx.setLineDash([]);
            const barX = x, barY = y - 8, barW = CONFIG.CELL_SIZE, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = color;
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.globalAlpha = 0.4 + flashValue * 0.4;
        }

        let ownerKey = 'rot';
        if (b.owner === 'npc' || b.isNPC) ownerKey = 'blau';
        else if (b.playerId === 'player2') ownerKey = 'blau';
        
        const imgKey = `${b.type}-${ownerKey}`;
        const img = buildingImages[imgKey];
        
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        } else {
            let color = getBuildingColor(b.type, b.owner === 'player' ? 'player' : b.playerId);
            if (b.owner === 'npc' || b.isNPC) color = getNPCBuildingColor(b.type);
            ctx.fillStyle = color;
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            ctx.strokeStyle = b.owner === 'npc' ? '#9b59b6' : '#111';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }

        if (b.level > 1 && !b.isUnderConstruction && showGrid) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.level, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
        }

        if (!b.isUnderConstruction) {
            if (b.type === 'haus' && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.residents}/${b.maxResidents}`, x + 4, y + 4);
            } else if (b.type === 'wachturm' && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.stoneAmmo}/${b.maxStoneAmmo}`, x + 4, y + 4);
                if (b.doubleShot) {
                    ctx.fillStyle = '#ff66ff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.fillText('✧2', x + 28, y + 28);
                }
            } else if (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') {
                let nodes = b.owner === 'npc' ? npcResourceNodes : resourceNodes;
                const node = nodes.find(n => n.buildingId === b.id);
                
                if (node && showGrid) {
                    const progress = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
                    const barX = x + 4;
                    const barY = y + CONFIG.CELL_SIZE - 8;
                    const barW = CONFIG.CELL_SIZE - 8;
                    const barH = 4;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(barX, barY, barW, barH);
                    
                    let barColor = node.ready ? '#2ecc71' : '#f39c12';
                    if (b.owner === 'npc') barColor = node.ready ? '#66ff66' : '#ff9966';
                    ctx.fillStyle = barColor;
                    ctx.fillRect(barX, barY, barW * progress, barH);
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(barX, barY, barW, barH);
                }
            }
        }

        if (b.isUnderConstruction) {
            const progress = b.constructionProgress || 0;
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#ffd966';
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
        }
    }

// ===== 9. IN drawSingleScreen() EINFÜGEN =====
// Nach den Gebäuden, aber vor den Einwohnern:

    // ===== BRENNENDE GEBÄUDE =====
    for (let key in burningBuildings) {
        const fire = burningBuildings[key];
        const parts = key.split('_');
        const type = parts[0];
        const playerId = parts[1];
        const id = parseInt(parts[2]);
        
        let building = null;
        let gridX, gridY, cellSize = CONFIG.CELL_SIZE;
        
        if (type === 'fire') {
            if (playerId === 'player') {
                building = buildings.find(b => b.id === id);
            } else if (playerId === 'player2') {
                building = player2Buildings.find(b => b.id === id);
            } else {
                building = npcBuildings.find(b => b.id === id);
            }
        } else if (type === 'fire_grenze') {
            if (playerId === 'player') {
                building = grenzen.find(g => g.id === id);
            } else if (playerId === 'player2') {
                building = player2Grenzen.find(g => g.id === id);
            } else {
                building = npcGrenzen.find(g => g.id === id);
            }
        }
        
        if (building) {
            gridX = building.gridX;
            gridY = building.gridY;
            const x = gridX * cellSize;
            const y = gridY * cellSize;
            drawBurningBuilding(ctx, fire, x, y, cellSize, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
        }
    }

    // ===== RESSOURCEN-NODES (SPIELER 1) =====
    for (let node of resourceNodes) {
        if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
        const x = node.x * CONFIG.CELL_SIZE;
        const y = node.y * CONFIG.CELL_SIZE;
        
        let bgColor = 'rgba(255,255,255,0.12)';
        if (node.type === 'grain') bgColor = 'rgba(255,215,0,0.15)';
        else if (node.type === 'wood') bgColor = 'rgba(139,69,19,0.15)';
        else if (node.type === 'stone') bgColor = 'rgba(128,128,128,0.15)';
        ctx.fillStyle = bgColor;
        ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        
        let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
        
        const barX = x + 4;
        const barY = y + CONFIG.CELL_SIZE - 8;
        const barW = CONFIG.CELL_SIZE - 8;
        const barH = 4;
        const progress = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = node.ready ? '#2ecc71' : '#f39c12';
        ctx.fillRect(barX, barY, barW * progress, barH);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barW, barH);
        
        if (node.fieldCount > 1 && showGrid) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`${node.fieldCount}`, x + CONFIG.CELL_SIZE - 2, y + CONFIG.CELL_SIZE - 10);
        }
        if (node.ready && showGrid) {
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
        if (node.claimedBy) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
    }

    // ===== RESSOURCEN-NODES (NPC) =====
    for (let node of npcResourceNodes) {
        if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
        const x = node.x * CONFIG.CELL_SIZE;
        const y = node.y * CONFIG.CELL_SIZE;
        
        let bgColor = 'rgba(155, 89, 182, 0.12)';
        if (node.type === 'grain') bgColor = 'rgba(255,215,0,0.12)';
        else if (node.type === 'wood') bgColor = 'rgba(139,69,19,0.12)';
        else if (node.type === 'stone') bgColor = 'rgba(128,128,128,0.12)';
        ctx.fillStyle = bgColor;
        ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        
        let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
        
        const barX = x + 4;
        const barY = y + CONFIG.CELL_SIZE - 8;
        const barW = CONFIG.CELL_SIZE - 8;
        const barH = 4;
        const progress = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = node.ready ? '#66ff66' : '#ff9966';
        ctx.fillRect(barX, barY, barW * progress, barH);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barW, barH);
        
        if (node.fieldCount > 1 && showGrid) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`${node.fieldCount}`, x + CONFIG.CELL_SIZE - 2, y + CONFIG.CELL_SIZE - 10);
        }
        if (node.ready && showGrid) {
            ctx.strokeStyle = '#66ff66';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
        if (node.claimedBy) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
    }

    // ===== TURM-REICHWEITE =====
    if (showTowerRange) {
        let allTowers = buildings.filter(b => b.type === 'wachturm');
        for (let tower of allTowers) {
            if (tower.isUnderConstruction) continue;
            if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
            const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,0,0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,0,0.3)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        let npcTowers = npcBuildings.filter(b => b.type === 'wachturm');
        for (let tower of npcTowers) {
            if (tower.isUnderConstruction) continue;
            if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
            const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(155,89,182,0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(155,89,182,0.3)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // ===== PROJEKTILE =====
    for (let p of projectiles) {
        if (p.x < viewLeftPx || p.x > viewRightPx || p.y < viewTopPx || p.y > viewBottomPx) continue;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.targetX, p.targetY);
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // ===== HIT-EFFEKTE =====
    for (let effect of hitEffects) {
        if (effect.x < viewLeftPx || effect.x > viewRightPx || effect.y < viewTopPx || effect.y > viewBottomPx) continue;
        for (let p of effect.particles) {
            if (p.life <= 0) continue;
            const alpha = Math.max(0, p.life / p.maxLife);
            const size = Math.max(0.5, 2 + (1 - alpha) * 4);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color || `rgb(255,${Math.floor(50 * alpha)},${Math.floor(50 * alpha)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = p.color || '#ff0000';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }

    // ===== EINWOHNER (SPIELER 1) - MIT SVG =====
    for (let v of villagers) {
        if (!v.alive) continue;
        // NUR IDLE AUSBLENDEN, WENN ER AM HAUS STEHT
        if (v.state === 'idle') {
            const home = buildings.find(b => b.id === v.homeId);
            if (home) {
                const homeX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const homeY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const distToHome = Math.hypot(v.x - homeX, v.y - homeY);
                if (distToHome < 10) continue;
            }
        }
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            drawVillager(ctx, v, 'player', v.x, v.y, CONFIG.CELL_SIZE);
        }
    }

    // ===== EINWOHNER (NPC) - MIT SVG =====
    for (let v of npcVillagers) {
        if (!v.alive) continue;
        if (v.state === 'idle') {
            const home = npcBuildings.find(b => b.id === v.homeId);
            if (home) {
                const homeX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const homeY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const distToHome = Math.hypot(v.x - homeX, v.y - homeY);
                if (distToHome < 10) continue;
            }
        }
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            drawVillager(ctx, v, 'npc', v.x, v.y, CONFIG.CELL_SIZE);
        }
    }

// ===== FEINDE =====
for (let e of enemies) {
    if (!e.alive) continue;
    if (e.x < viewLeftPx || e.x > viewRightPx || e.y < viewTopPx || e.y > viewBottomPx) continue;
    
    const imgKey = e.isSuper ? 'zombie-super' : 'zombie';
    const img = enemyImages[imgKey];
    const size = e.isSuper ? CONFIG.CELL_SIZE * 0.9 : CONFIG.CELL_SIZE * 0.7;
    const offset = (CONFIG.CELL_SIZE - size) / 2;
    
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, e.x - size/2, e.y - size/2 + 6, size, size);
    } else {
        // Fallback: Kreis
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.isSuper ? 8 : 5, 0, Math.PI * 2);
        ctx.fillStyle = e.isSuper ? '#ff00ff' : '#e74c3c';
        ctx.fill();
        ctx.strokeStyle = e.isSuper ? '#880088' : '#922b21';
        ctx.lineWidth = e.isSuper ? 2 : 1;
        ctx.stroke();
    }
    
    if (e.isSuper && e.hits < e.maxHits) {
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${e.maxHits - e.hits}`, e.x, e.y - 12);
    }
}

    ctx.restore();
}




function drawWorldSplit(cam, playerId) {
    const c = cam || camera;
    const viewWidth = canvas.width / c.zoom;
    const viewHeight = canvas.height / c.zoom;
    const margin = 0.1;
    
    const viewLeft = Math.max(0, Math.floor((c.x - viewWidth * (0.5 + margin)) / CONFIG.CELL_SIZE) - 2);
    const viewRight = Math.min(CONFIG.GRID_WIDTH, Math.ceil((c.x + viewWidth * (0.5 + margin)) / CONFIG.CELL_SIZE) + 2);
    const viewTop = Math.max(0, Math.floor((c.y - viewHeight * (0.5 + margin)) / CONFIG.CELL_SIZE) - 2);
    const viewBottom = Math.min(CONFIG.GRID_HEIGHT, Math.ceil((c.y + viewHeight * (0.5 + margin)) / CONFIG.CELL_SIZE) + 2);
    
    const viewLeftPx = viewLeft * CONFIG.CELL_SIZE;
    const viewRightPx = viewRight * CONFIG.CELL_SIZE;
    const viewTopPx = viewTop * CONFIG.CELL_SIZE;
    const viewBottomPx = viewBottom * CONFIG.CELL_SIZE;

    // ===== TERRAIN =====
    for (let y = viewTop; y < viewBottom; y++) {
        for (let x = viewLeft; x < viewRight; x++) {
            const type = terrainMap[y][x];
            ctx.fillStyle = getTerrainColor(type);
            ctx.fillRect(x * CONFIG.CELL_SIZE - 0.5, y * CONFIG.CELL_SIZE - 0.5, CONFIG.CELL_SIZE + 1, CONFIG.CELL_SIZE + 1);
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fillText(getTerrainEmoji(type), x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2);
        }
    }

    // ===== GITTER + OVERLAY-BEDINGUNG =====
    const showGrid = (playerId === 'player' && (selectedBuildingType || upgradeMode || destroyMode || !gameStarted)) ||
                     (playerId === 'player2' && (selectedBuildingTypeP2 || upgradeModeP2 || destroyModeP2 || !gameStarted));
    
    if (showGrid) {
        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
        ctx.lineWidth = 0.5;
        for (let i = viewLeft; i <= viewRight; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CONFIG.CELL_SIZE, viewTop * CONFIG.CELL_SIZE);
            ctx.lineTo(i * CONFIG.CELL_SIZE, viewBottom * CONFIG.CELL_SIZE);
            ctx.stroke();
        }
        for (let j = viewTop; j <= viewBottom; j++) {
            ctx.beginPath();
            ctx.moveTo(viewLeft * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
            ctx.lineTo(viewRight * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
            ctx.stroke();
        }
    }

    // ===== ÄUßERSTE GRENZE (SPLIT) =====
    let grenzenList = [];
    if (playerId === 'player') {
        grenzenList = grenzen;
    } else if (playerId === 'player2') {
        grenzenList = player2Grenzen;
    } else {
        grenzenList = npcGrenzen;
    }
    const outerGrenze = getOuterGrenze(grenzenList);
    if (outerGrenze) {
        const pulse = Math.sin(performance.now() / 1000 * 2) * 0.3 + 0.7;
        const color = playerId === 'player' ? '#c0392b' : '#2980b9';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 10]);
        ctx.beginPath();
        ctx.arc(outerGrenze.cx, outerGrenze.cy, outerGrenze.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = `rgba(192, 57, 43, ${0.15 * pulse})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(outerGrenze.cx, outerGrenze.cy, outerGrenze.radius + 4, 0, Math.PI * 2);
        ctx.stroke();
    }

    // ===== BAU-VORSCHAU =====
    if (playerId === 'player') {
        if (gameStarted && pendingBuild && selectedBuildingType) {
            const px = pendingBuild.gx * CONFIG.CELL_SIZE;
            const py = pendingBuild.gy * CONFIG.CELL_SIZE;
            const isInRadius = isWithinBuildRadius(pendingBuild.gx, pendingBuild.gy, 'player');
            const isValid = isInRadius || selectedBuildingType === 'grenze';
            ctx.fillStyle = isValid ? 'rgba(255,255,0,0.2)' : 'rgba(255,0,0,0.2)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = isValid ? '#ffd966' : '#ff0000';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
            if (!isValid && selectedBuildingType !== 'grenze') {
                ctx.fillStyle = 'rgba(255,0,0,0.7)';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⚠️ Außerhalb Radius!', px + CONFIG.CELL_SIZE/2, py - 4);
            }
            if (selectedBuildingType === 'bauer' || selectedBuildingType === 'holzfaeller' || selectedBuildingType === 'steinmetz') {
                const neighbors = getNeighborCells(pendingBuild.gx, pendingBuild.gy, 1);
                const resourceType = selectedBuildingType === 'bauer' ? 'grain' : selectedBuildingType === 'holzfaeller' ? 'wood' : 'stone';
                for (let n of neighbors) {
                    if (!isCellOccupied(n.x, n.y) && isResourceFieldAvailable(n.x, n.y, resourceType)) {
                        ctx.fillStyle = 'rgba(0,255,0,0.25)';
                        ctx.fillRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                        ctx.strokeStyle = 'rgba(0,255,0,0.5)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    }
                }
            }
        }
    } else if (playerId === 'player2') {
        if (gameStarted && pendingBuildP2 && selectedBuildingTypeP2) {
            const px = pendingBuildP2.gx * CONFIG.CELL_SIZE;
            const py = pendingBuildP2.gy * CONFIG.CELL_SIZE;
            const isInRadius = isWithinBuildRadius(pendingBuildP2.gx, pendingBuildP2.gy, 'player2');
            const isValid = isInRadius || selectedBuildingTypeP2 === 'grenze';
            ctx.fillStyle = isValid ? 'rgba(255,165,0,0.2)' : 'rgba(255,0,0,0.2)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = isValid ? '#ff8a65' : '#ff0000';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
            if (!isValid && selectedBuildingTypeP2 !== 'grenze') {
                ctx.fillStyle = 'rgba(255,0,0,0.7)';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⚠️ Außerhalb Radius!', px + CONFIG.CELL_SIZE/2, py - 4);
            }
            if (selectedBuildingTypeP2 === 'bauer' || selectedBuildingTypeP2 === 'holzfaeller' || selectedBuildingTypeP2 === 'steinmetz') {
                const neighbors = getNeighborCells(pendingBuildP2.gx, pendingBuildP2.gy, 1);
                const resourceType = selectedBuildingTypeP2 === 'bauer' ? 'grain' : selectedBuildingTypeP2 === 'holzfaeller' ? 'wood' : 'stone';
                for (let n of neighbors) {
                    if (!isCellOccupied(n.x, n.y) && isResourceFieldAvailable(n.x, n.y, resourceType)) {
                        ctx.fillStyle = 'rgba(0,255,0,0.25)';
                        ctx.fillRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                        ctx.strokeStyle = 'rgba(0,255,0,0.5)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    }
                }
            }
        }
    }

    // ===== RESSOURCEN-FELDER (SPLIT) =====
    if (gameStarted) {
        let resourceBuildings = [];
        let resourceNodesList = [];
        let isNPC = false;
        
        if (playerId === 'player') {
            resourceBuildings = buildings.filter(b => !b.isUnderConstruction && (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz'));
            resourceNodesList = resourceNodes;
        } else if (playerId === 'player2') {
            resourceBuildings = player2Buildings.filter(b => !b.isUnderConstruction && (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz'));
            resourceNodesList = player2ResourceNodes;
        } else {
            resourceBuildings = npcBuildings.filter(b => !b.isUnderConstruction && (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz'));
            resourceNodesList = npcResourceNodes;
            isNPC = true;
        }
        
        for (let building of resourceBuildings) {
            const fields = building.type === 'bauer' ? getBauerFields(building) : building.type === 'holzfaeller' ? getHolzfaellerFields(building) : getSteinmetzFields(building);
            const resourceType = building.productionType || 'grain';
            const node = resourceNodesList.find(n => n.buildingId === building.id);
            
            for (let field of fields) {
                if (field.x < viewLeft || field.x >= viewRight || field.y < viewTop || field.y >= viewBottom) continue;
                const x = field.x * CONFIG.CELL_SIZE;
                const y = field.y * CONFIG.CELL_SIZE;
                
                let isHarvested = false;
                let isBeingHarvested = false;
                if (node && node.fields) {
                    const fieldData = node.fields.find(f => f.x === field.x && f.y === field.y);
                    if (fieldData) {
                        isHarvested = fieldData.harvested;
                        isBeingHarvested = fieldData.isBeingHarvested;
                    }
                }
                
                let bgColor = 'rgba(255,255,255,0.08)';
                if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.12)';
                else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.12)';
                else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.12)';
                
                if (isNPC) {
                    bgColor = 'rgba(155, 89, 182, 0.08)';
                    if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.12)';
                    else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.12)';
                    else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.12)';
                }
                
                if (!isHarvested && node) {
                    if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.35)';
                    else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.35)';
                    else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.35)';
                    
                    if (isNPC) {
                        if (resourceType === 'grain') bgColor = 'rgba(255,215,0,0.35)';
                        else if (resourceType === 'wood') bgColor = 'rgba(139,69,19,0.35)';
                        else if (resourceType === 'stone') bgColor = 'rgba(128,128,128,0.35)';
                    }
                }
                
                if (isHarvested) bgColor = 'rgba(0,0,0,0.15)';
                
                ctx.fillStyle = bgColor;
                ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                
                let icon = resourceType === 'grain' ? '🌾' : resourceType === 'wood' ? '🌲' : '🪨';
                if (isHarvested) { icon = '⬜'; ctx.globalAlpha = 0.3; } else if (isBeingHarvested) { ctx.globalAlpha = 0.8 + Math.sin(performance.now() / 1000 * 4) * 0.2; }
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
                ctx.globalAlpha = 1;
                
                if (isBeingHarvested) {
                    let borderColor = '#ffd966';
                    if (isNPC) borderColor = '#9b59b6';
                    else if (playerId === 'player2') borderColor = '#ff8a65';
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([2, 3]);
                    ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    ctx.setLineDash([]);
                }
                if (isHarvested) {
                    ctx.strokeStyle = 'rgba(46, 204, 113, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                }
            }
        }
    }

    // ===== RESSOURCEN-NODES =====
    let nodesToDraw = [];
    let isNPC = false;
    if (playerId === 'player') {
        nodesToDraw = resourceNodes;
    } else if (playerId === 'player2') {
        nodesToDraw = player2ResourceNodes;
    } else {
        nodesToDraw = npcResourceNodes;
        isNPC = true;
    }
    
    for (let node of nodesToDraw) {
        if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
        const x = node.x * CONFIG.CELL_SIZE;
        const y = node.y * CONFIG.CELL_SIZE;
        
        let bgColor = 'rgba(255,255,255,0.12)';
        if (node.type === 'grain') bgColor = 'rgba(255,215,0,0.15)';
        else if (node.type === 'wood') bgColor = 'rgba(139,69,19,0.15)';
        else if (node.type === 'stone') bgColor = 'rgba(128,128,128,0.15)';
        ctx.fillStyle = bgColor;
        ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        
        let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
        
        const barX = x + 4;
        const barY = y + CONFIG.CELL_SIZE - 8;
        const barW = CONFIG.CELL_SIZE - 8;
        const barH = 4;
        const progress = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);
        let barColor = node.ready ? '#2ecc71' : '#f39c12';
        if (isNPC) barColor = node.ready ? '#66ff66' : '#ff9966';
        else if (playerId === 'player2') barColor = node.ready ? '#2ecc71' : '#ff8a65';
        ctx.fillStyle = barColor;
        ctx.fillRect(barX, barY, barW * progress, barH);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barW, barH);
        
        if (node.fieldCount > 1 && showGrid) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`${node.fieldCount}`, x + CONFIG.CELL_SIZE - 2, y + CONFIG.CELL_SIZE - 10);
        }
        if (node.ready && showGrid) {
            let borderColor = '#2ecc71';
            if (isNPC) borderColor = '#66ff66';
            else if (playerId === 'player2') borderColor = '#2ecc71';
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
        if (node.claimedBy) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.2)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
    }

    // ===== GEBÄUDE =====
    let allBuildings = [];
    if (playerId === 'player') {
        allBuildings.push(...buildings.map(b => ({...b, isGrenze: false})));
        allBuildings.push(...grenzen.map(g => ({...g, isGrenze: true, isNPC: false, playerId: 'player'})));
    } else if (playerId === 'player2') {
        allBuildings.push(...player2Buildings.map(b => ({...b, isGrenze: false})));
        allBuildings.push(...player2Grenzen.map(g => ({...g, isGrenze: true, isNPC: false, playerId: 'player2'})));
    } else {
        allBuildings.push(...npcBuildings.map(b => ({...b, isGrenze: false})));
        allBuildings.push(...npcGrenzen.map(g => ({...g, isGrenze: true, isNPC: true, playerId: null})));
    }

    for (let b of allBuildings) {
        if (b.gridX < viewLeft || b.gridX >= viewRight || b.gridY < viewTop || b.gridY >= viewBottom) continue;
        const x = b.gridX * CONFIG.CELL_SIZE;
        const y = b.gridY * CONFIG.CELL_SIZE;

        if (b.isGrenze) {
            const ownerKey = b.isNPC ? 'blau' : (b.playerId === 'player2' ? 'blau' : 'rot');
            const imgKey = `grenze-${ownerKey}`;
            const img = buildingImages[imgKey];
            
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            } else {
                let color = b.isNPC || b.playerId === 'player2' ? '#2980b9' : '#c0392b';
                ctx.fillStyle = color;
                ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                ctx.strokeStyle = b.isNPC || b.playerId === 'player2' ? '#1a5276' : '#7f1d1d';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🟣', x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
            }
            
            if (b.level > 1 && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`Lv${b.level}`, x + 4, y + 4);
            }
            
            if (showGrid) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '8px sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`${b.radius}🔄`, x + CONFIG.CELL_SIZE - 4, y + CONFIG.CELL_SIZE - 4);
            }
            
            if (b.isUnderConstruction) {
                const progress = b.constructionProgress || 0;
                const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX, barY, barW, barH);
                ctx.fillStyle = '#ffd966';
                ctx.fillRect(barX, barY, barW * progress, barH);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(barX, barY, barW, barH);
            }
            continue;
        }

        if (b.beingCaptured && b.captureProgress > 0) {
            const flashSpeed = 8;
            const flashValue = Math.sin(performance.now() / 1000 * flashSpeed) * 0.5 + 0.5;
            const progress = b.captureProgress;
            let color;
            if (b.capturedBy === 'player') color = '#ffd966';
            else if (b.capturedBy === 'player2') color = '#ff8a65';
            else color = '#ff4444';
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 + flashValue * 0.5})`;
            ctx.lineWidth = 2 + flashValue * 2;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(x - 1, y - 1, CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE + 2);
            ctx.setLineDash([]);
            const barX = x, barY = y - 8, barW = CONFIG.CELL_SIZE, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = color;
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.globalAlpha = 0.4 + flashValue * 0.4;
        }

        let ownerKey = 'rot';
        if (b.isNPC || b.playerId === 'player2') ownerKey = 'blau';
        
        const imgKey = `${b.type}-${ownerKey}`;
        const img = buildingImages[imgKey];
        
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, x, y, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        } else {
            let color = getBuildingColor(b.type, b.playerId || 'player');
            if (b.isNPC) color = getNPCBuildingColor(b.type);
            ctx.fillStyle = color;
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            ctx.strokeStyle = b.isNPC ? '#9b59b6' : (b.playerId === 'player2' ? '#ff8a65' : '#111');
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }

        if (b.level > 1 && !b.isUnderConstruction && showGrid) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.level, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
        }

        if (!b.isUnderConstruction) {
            if (b.type === 'haus' && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.residents}/${b.maxResidents}`, x + 4, y + 4);
            } else if (b.type === 'wachturm' && showGrid) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.stoneAmmo}/${b.maxStoneAmmo}`, x + 4, y + 4);
                if (b.doubleShot) {
                    ctx.fillStyle = '#ff66ff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.fillText('✧2', x + 28, y + 28);
                }
            } else if (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') {
                let nodes = playerId === 'player' ? resourceNodes : playerId === 'player2' ? player2ResourceNodes : npcResourceNodes;
                const node = nodes.find(n => n.buildingId === b.id);
                
                if (node && showGrid) {
                    const progress = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
                    const barX = x + 4;
                    const barY = y + CONFIG.CELL_SIZE - 8;
                    const barW = CONFIG.CELL_SIZE - 8;
                    const barH = 4;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(barX, barY, barW, barH);
                    
                    let barColor = node.ready ? '#2ecc71' : '#f39c12';
                    if (b.isNPC) barColor = node.ready ? '#66ff66' : '#ff9966';
                    else if (b.playerId === 'player2') barColor = node.ready ? '#2ecc71' : '#ff8a65';
                    ctx.fillStyle = barColor;
                    ctx.fillRect(barX, barY, barW * progress, barH);
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(barX, barY, barW, barH);
                }
            }
        }

        if (b.isUnderConstruction) {
            const progress = b.constructionProgress || 0;
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#ffd966';
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
        }
    }

// ===== 10. IN drawWorldSplit() EINFÜGEN =====
// Nach den Gebäuden, aber vor den Einwohnern:

    // ===== BRENNENDE GEBÄUDE =====
    for (let key in burningBuildings) {
        const fire = burningBuildings[key];
        const parts = key.split('_');
        const type = parts[0];
        const playerId = parts[1];
        const id = parseInt(parts[2]);
        
        let building = null;
        let gridX, gridY, cellSize = CONFIG.CELL_SIZE;
        
        if (type === 'fire') {
            if (playerId === 'player') {
                building = buildings.find(b => b.id === id);
            } else if (playerId === 'player2') {
                building = player2Buildings.find(b => b.id === id);
            } else {
                building = npcBuildings.find(b => b.id === id);
            }
        } else if (type === 'fire_grenze') {
            if (playerId === 'player') {
                building = grenzen.find(g => g.id === id);
            } else if (playerId === 'player2') {
                building = player2Grenzen.find(g => g.id === id);
            } else {
                building = npcGrenzen.find(g => g.id === id);
            }
        }
        
        if (building) {
            gridX = building.gridX;
            gridY = building.gridY;
            const x = gridX * cellSize;
            const y = gridY * cellSize;
            drawBurningBuilding(ctx, fire, x, y, cellSize, viewLeftPx, viewRightPx, viewTopPx, viewBottomPx);
        }
    }

    // ===== TURM-REICHWEITE =====
    if (showTowerRange) {
        let towers = [];
        if (playerId === 'player') {
            towers = buildings.filter(b => b.type === 'wachturm');
        } else if (playerId === 'player2') {
            towers = player2Buildings.filter(b => b.type === 'wachturm');
        } else {
            towers = npcBuildings.filter(b => b.type === 'wachturm');
        }
        for (let tower of towers) {
            if (tower.isUnderConstruction) continue;
            if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
            const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,0,0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,0,0.3)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // ===== PROJEKTILE =====
    for (let p of projectiles) {
        if (p.x < viewLeftPx || p.x > viewRightPx || p.y < viewTopPx || p.y > viewBottomPx) continue;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.targetX, p.targetY);
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // ===== HIT-EFFEKTE =====
    for (let effect of hitEffects) {
        if (effect.x < viewLeftPx || effect.x > viewRightPx || effect.y < viewTopPx || effect.y > viewBottomPx) continue;
        for (let p of effect.particles) {
            if (p.life <= 0) continue;
            const alpha = Math.max(0, p.life / p.maxLife);
            const size = Math.max(0.5, 2 + (1 - alpha) * 4);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color || `rgb(255,${Math.floor(50 * alpha)},${Math.floor(50 * alpha)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = p.color || '#ff0000';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }

    // ===== EINWOHNER =====
    let villagersToDraw = [];
    if (playerId === 'player') {
        villagersToDraw = villagers;
    } else if (playerId === 'player2') {
        villagersToDraw = player2Villagers;
    } else {
        villagersToDraw = npcVillagers;
    }

    for (let v of villagersToDraw) {
        if (!v.alive) continue;
        
        // ===== NUR IDLE AUSBLENDEN, WENN ER AM HAUS STEHT =====
        if (v.state === 'idle') {
            let home = null;
            if (playerId === 'player') {
                home = buildings.find(b => b.id === v.homeId);
            } else if (playerId === 'player2') {
                home = player2Buildings.find(b => b.id === v.homeId);
            } else {
                home = npcBuildings.find(b => b.id === v.homeId);
            }
            if (home) {
                const homeX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const homeY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const distToHome = Math.hypot(v.x - homeX, v.y - homeY);
                if (distToHome < 10) continue;
            }
        }
        
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            let color;
            let borderColor = '#fff';
            let borderWidth = 0.6;
            if (playerId === 'player') {
                if (v.carrying === 'grain') color = '#f39c12';
                else if (v.carrying === 'wood') color = '#8b5a2b';
                else if (v.carrying === 'stone') color = '#7f8c8d';
                else if (v.isBuilding) color = '#ffd966';
                else if (v.isAttacking) color = '#ff4444';
                else if (v.isHarvesting) color = '#ffd700';
                else color = '#1a1a1a';
                borderColor = '#fff';
                borderWidth = 0.6;
            } else if (playerId === 'player2') {
                if (v.carrying === 'grain') color = '#f39c12';
                else if (v.carrying === 'wood') color = '#8b5a2b';
                else if (v.carrying === 'stone') color = '#7f8c8d';
                else if (v.isBuilding) color = '#ffd966';
                else if (v.isAttacking) color = '#ff4444';
                else if (v.isHarvesting) color = '#ffd700';
                else color = '#ff8a65';
                borderColor = '#ff8a65';
                borderWidth = 1.5;
            } else {
                if (v.carrying === 'grain') color = '#66ff66';
                else if (v.carrying === 'wood') color = '#ff9966';
                else if (v.carrying === 'stone') color = '#ffcc66';
                else if (v.isBuilding) color = '#ffd966';
                else if (v.isAttacking) color = '#ff4444';
                else if (v.isHarvesting) color = '#ffd700';
                else color = '#66ccff';
                borderColor = '#9b59b6';
                borderWidth = 1.5;
            }
            ctx.beginPath();
            ctx.arc(v.x, v.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = borderWidth;
            ctx.stroke();
        }
    }

    // ===== FEINDE (NUR FÜR SPIELER 1) =====
    if (playerId === 'player' || playerId === null) {
        for (let e of enemies) {
            if (!e.alive) continue;
            if (e.x < viewLeftPx || e.x > viewRightPx || e.y < viewTopPx || e.y > viewBottomPx) continue;
            if (e.isGroupAttack && e.targetX !== undefined) {
                ctx.beginPath();
                ctx.moveTo(e.x, e.y);
                ctx.lineTo(e.targetX, e.targetY);
                ctx.strokeStyle = 'rgba(255,0,0,0.15)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.isSuper ? 8 : 5, 0, Math.PI * 2);
            ctx.fillStyle = e.isSuper ? '#ff00ff' : '#e74c3c';
            ctx.fill();
            ctx.strokeStyle = e.isSuper ? '#880088' : '#922b21';
            ctx.lineWidth = e.isSuper ? 2 : 1;
            ctx.stroke();
            if (e.isSuper && e.hits < e.maxHits) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${e.maxHits - e.hits}`, e.x, e.y - 12);
            }
        }
    }
}

function drawSplitScreen() {
    // ===== OBERE HÄLFTE (SPIELER 1) =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, canvas.height / 2);
    ctx.clip();
    ctx.translate(canvas.width / 2, canvas.height / 4);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);
    drawWorldSplit(camera, 'player');
    ctx.restore();
    
    // Trennlinie
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(0, canvas.height / 2 - 1, canvas.width, 2);
    
    // ===== UNTERE HÄLFTE (SPIELER 2) =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, canvas.height / 2, canvas.width, canvas.height / 2);
    ctx.clip();
    ctx.translate(canvas.width / 2, canvas.height * 3 / 4);
    ctx.scale(cameraPlayer2.zoom, cameraPlayer2.zoom);
    ctx.translate(-cameraPlayer2.x, -cameraPlayer2.y);
    drawWorldSplit(cameraPlayer2, 'player2');
    ctx.restore();
}



// =========================================================================
//  MODUL 19: UI-UPDATE (für 2 Spieler erweitert - VOLLSTÄNDIG)

function updateUI() {

// ===== HILFSFUNKTION: Prüft ob Touch in oberer Hälfte ist =====
function isInTopHalf(y) {
    return y < canvas.height / 2;
}

// ===== SPLIT-SCREEN KOORDINATENUMRECHNUNG =====
function screenToWorldSplit(sx, sy, cam, isTopHalf) {
    const adjustedY = isTopHalf ? sy : sy - canvas.height / 2;
    const adjustedHeight = canvas.height / 2;
    return {
        x: (sx - canvas.width/2) / cam.zoom + cam.x,
        y: (adjustedY - adjustedHeight/2) / cam.zoom + cam.y
    };
}

// ===== EINZELMODUS KOORDINATENUMRECHNUNG =====
function screenToWorld(sx, sy, cam = null) {
    const c = cam || camera;
    return {
        x: (sx - canvas.width/2) / c.zoom + c.x,
        y: (sy - canvas.height/2) / c.zoom + c.y
    };
}

// ===== TOUCH START =====
function handleTouchStart(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        touches[t.identifier] = {
            x: t.clientX - rect.left,
            y: t.clientY - rect.top,
            startX: t.clientX - rect.left,
            startY: t.clientY - rect.top
        };
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 2) {
        isPanning = false;
        lastPinchDist = Math.hypot(
            activeTouches[1].x - activeTouches[0].x,
            activeTouches[1].y - activeTouches[0].y
        );
    }
}

// ===== TOUCH MOVE =====
function handleTouchMove(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        touches[t.identifier] = {
            x: t.clientX - rect.left,
            y: t.clientY - rect.top
        };
    });
    activeTouches = Object.values(touches);

    if (activeTouches.length === 2) {
        isPanning = false;
        const p1 = activeTouches[0];
        const p2 = activeTouches[1];

        if (SPLIT_SCREEN) {
            const p1IsTop = isInTopHalf(p1.y);
            const p2IsTop = isInTopHalf(p2.y);
            if (p1IsTop !== p2IsTop) {
                lastPinchDist = 0;
                markDirty();
                return;
            }
        }

        const newDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

        if (lastPinchDist > 0) {
            const scale = newDist / lastPinchDist;
            if (SPLIT_SCREEN) {
                const isTop = isInTopHalf(mid.y);
                if (isTop) {
                    const before = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.x += before.x - after.x;
                    camera.y += before.y - after.y;
                } else {
                    const before = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.zoom = Math.min(cameraPlayer2.maxZoom, Math.max(cameraPlayer2.minZoom, cameraPlayer2.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.x += before.x - after.x;
                    cameraPlayer2.y += before.y - after.y;
                }
            } else {
                const before = screenToWorld(mid.x, mid.y, camera);
                camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                const after = screenToWorld(mid.x, mid.y, camera);
                camera.x += before.x - after.x;
                camera.y += before.y - after.y;
            }
        }
        lastPinchDist = newDist;
        markDirty();

    } else if (activeTouches.length === 1 && isPanning) {
        const p = activeTouches[0];
        const dx = p.x - panStart.x;
        const dy = p.y - panStart.y;
        if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
            hasMoved = true;
        }
        if (hasMoved) {
            if (SPLIT_SCREEN) {
                const startY = panStart.y;
                if (isInTopHalf(startY)) {
                    camera.x -= (p.x - panStart.x) / camera.zoom;
                    camera.y -= (p.y - panStart.y) / camera.zoom;
                } else {
                    cameraPlayer2.x -= (p.x - panStart.x) / cameraPlayer2.zoom;
                    cameraPlayer2.y -= (p.y - panStart.y) / cameraPlayer2.zoom;
                }
            } else {
                camera.x -= (p.x - panStart.x) / camera.zoom;
                camera.y -= (p.y - panStart.y) / camera.zoom;
            }
            panStart = { ...p };
            markDirty();
        }
    }
}

// ===== TOUCH END =====
function handleTouchEnd(e) {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => {
        delete touches[t.identifier];
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 0 && isPanning && !hasMoved) {
        const touchX = panStart.x;
        const touchY = panStart.y;
        let world;
        let playerId = 'player';
        if (SPLIT_SCREEN) {
            const isTop = isInTopHalf(touchY);
            if (isTop) {
                world = screenToWorldSplit(touchX, touchY, camera, true);
                playerId = 'player';
            } else {
                world = screenToWorldSplit(touchX, touchY, cameraPlayer2, false);
                playerId = 'player2';
            }
        } else {
            world = screenToWorld(touchX, touchY, camera);
            playerId = 'player';
        }
        const gx = Math.floor(world.x / CONFIG.CELL_SIZE);
        const gy = Math.floor(world.y / CONFIG.CELL_SIZE);
        if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
            handleTap(playerId, gx, gy);
        }
    }
    if (activeTouches.length === 0) {
        isPanning = false;
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
    }
}

// ===== TAP VERARBEITUNG (VOLLSTÄNDIG) =====
function handleTap(playerId, gx, gy) {

    // ===== NETZWERK-START =====
    if (NETWORK_MODE && splitStartPhase && !gameStarted) {
        const isPlayer1Phase = splitStartPhase.startsWith('player1');
        const isGrenzePhase = splitStartPhase.includes('grenze');

        if (IS_HOST && !isPlayer1Phase) {
            showTemporaryMessage('❌ Jetzt ist der Client dran!', '#ff6b6b', true);
            return;
        }
        if (!IS_HOST && isPlayer1Phase) {
            showTemporaryMessage('❌ Jetzt ist der Host dran!', '#ff6b6b', true);
            return;
        }

        if (IS_HOST && playerId !== 'player') {
            showTemporaryMessage('❌ Du bist der Host - nutze deine Kamera!', '#ff6b6b', true);
            return;
        }
        if (!IS_HOST && playerId !== 'player') {
            showTemporaryMessage('❌ Du bist der Client - nutze deine Kamera!', '#ff6b6b', true);
            return;
        }

        const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
        if (isPlayer1Phase && gy > gridLimit) {
            showTemporaryMessage('❌ Host darf nur im oberen Drittel bauen!', '#ff6b6b', true);
            return;
        }
        if (!isPlayer1Phase && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Client darf nur im unteren Drittel bauen!', '#ff6b6b', true);
            return;
        }

        if (isCellOccupied(gx, gy)) {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
            return;
        }

        let type = 'grenze';
        if (splitStartPhase.includes('lager')) type = 'lager';
        else if (splitStartPhase.includes('haus')) type = 'haus';

        const typeDisplay = type === 'grenze' ? '🟣 Grenzkontrolle' : type === 'lager' ? '📦 Lager' : '🏠 Haus';
        const playerDisplay = isPlayer1Phase ? 'Host' : 'Client';

        pendingSplitStart = {
            gx, gy,
            player: isPlayer1Phase ? 'player1' : 'player2',
            type: type,
            isNetwork: true
        };

        dialogNeedsRotation = false;
        dialogIsUrgent = true;

        document.getElementById('confirmText').textContent = `${typeDisplay} an dieser Stelle für ${playerDisplay} platzieren?`;
        document.getElementById('costDisplay').textContent = '✅ Startgebäude - kostenlos';

        document.getElementById('confirmDialog').style.display = 'block';
        applyDialogRotation();
        window._pendingSplitStart = true;
        return;
    }


    // ===== SPLIT-START =====

            return;
