function transferResourceNodesPlayerToPlayer2(building) {
    if (building.type !== 'bauer' && building.type !== 'holzfaeller' && building.type !== 'steinmetz') return;
    if (building.isUnderConstruction) return;

    const resourceType = building.productionType;
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  getSteinmetzFields(building);

    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));

    // Nodes von Spieler 1 entfernen
    for (let i = resourceNodes.length - 1; i >= 0; i--) {
        const node = resourceNodes[i];
        if (fieldSet.has(node.x + ',' + node.y) && node.type === resourceType) {
            if (node.claimedBy) {
                const villager = villagers.find(v => v.id === node.claimedBy);
                if (villager) {
                    villager.resourceTarget = null;
                    villager.state = 'idle';
                    villager.hasTask = false;
                }
            }
            resourceNodes.splice(i, 1);
        }
    }

    // Nodes zu Spieler 2 hinzufügen
    for (let f of fields) {
        const key = `${f.x},${f.y},${resourceType}`;
        const existing = player2ResourceNodeByPosition.get(key);
        if (!existing) {
            const newNode = {
                id: player2NextResourceId++,
                x: f.x,
                y: f.y,
                type: resourceType,
                timer: 0,
                maxTimer: building.maxProductionTime,
                ready: false,
                claimedBy: null,
                isNPC: false
            };
            player2ResourceNodes.push(newNode);
            player2ResourceNodeMap.set(newNode.id, newNode);
            player2ResourceNodeByPosition.set(key, newNode);
        } else {
            existing.timer = 0;
            existing.ready = false;
            existing.maxTimer = building.maxProductionTime;
            existing.claimedBy = null;
        }
    }

    rebuildResourceMaps();
    refreshPlayerResourceCache();
    refreshPlayer2ResourceCache();
    markDirty();
}

// ===== HILFSFUNKTION FÜR GRID-KEYS =====
function getCombatGridKey(x, y) {
    const cx = Math.floor(x / COMBAT_GRID_SIZE);
    const cy = Math.floor(y / COMBAT_GRID_SIZE);
    return cx + ',' + cy;
}

// ===== NACHBAR-GRID-KEYS IN REICHWEITE =====
function getNeighborCombatGridKeys(x, y, range) {
    const cx = Math.floor(x / COMBAT_GRID_SIZE);
    const cy = Math.floor(y / COMBAT_GRID_SIZE);
    const radius = Math.ceil(range / COMBAT_GRID_SIZE) + 1;
    const keys = [];
    for (let dx = -radius; dx <= radius; dx++) {
        for (let dy = -radius; dy <= radius; dy++) {
            keys.push((cx + dx) + ',' + (cy + dy));
        }
    }
    return keys;
}

// ===== GRID FÜR SPIELER 1 NEU AUFBAUEN =====
function rebuildCombatGridPlayer() {
    combatGridPlayer.clear();
    for (let v of villagers) {
        if (!v.alive) continue;
        const key = getCombatGridKey(v.x, v.y);
        if (!combatGridPlayer.has(key)) {
            combatGridPlayer.set(key, []);
        }
        combatGridPlayer.get(key).push(v);
    }
    combatGridDirtyPlayer = false;
}

    // Häuser: Getreide verbrauchen und Einwohner wachsen lassen
    buildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {
        h.grainConsumeTimer += dt;
        while (h.grainConsumeTimer >= 15) {
            h.grainConsumeTimer -= 15;
            if (resources.grain > 0) {
                resources.grain -= 1;
            } else {
                h.growthTimer = 0;
            }
        }
        if (resources.grain > 0 && h.residents < h.maxResidents) {
            h.growthTimer += dt;
            if (h.growthTimer >= 30) {
                h.growthTimer -= 30;
                h.residents += 1;
                spawnVillager(h.id);

            h.growthTimer = 0;
        }

}

    const totalNPCAlive = npcVillagers.filter(v => v.alive).length;
    
    npcBuildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {

                const cx = h.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;

                v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');

        } else if (totalNPCAlive === 0 && h.residents < h.maxResidents) {

function refreshPlayerVillagerCache() {
    const aliveVillagers = villagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    // Zusätzlich: Anzahl der aktuell freien Villager berechnen
    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    // Nur neu aufbauen, wenn sich die Anzahl der lebenden oder der freien Villager geändert hat
    if (cachedPlayerAliveIds.size === aliveCount && cachedPlayerFreeCount === freeCount && cacheNeedsRefresh === false) {
        return; // keine Änderung
    }

    try {
        cachedPlayerVillagers = aliveVillagers;
        cachedPlayerAliveIds = aliveIds;
        cachedPlayerFreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedPlayerFreeCount = cachedPlayerFreeVillagers.length;
        cacheNeedsRefresh = false;
    } catch(e) {
        cachedPlayerVillagers = [];
        cachedPlayerFreeVillagers = [];
        cachedPlayerAliveIds = new Set();
        cachedPlayerFreeCount = 0;
    }
}

function refreshPlayerResourceCache() {
    try {
        cachedPlayerResourceNodes = resourceNodes.slice();
        cachedPlayerAvailableNodes = cachedPlayerResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedPlayerResourceNodes = [];
        cachedPlayerAvailableNodes = [];
    }
}

            for (let v of villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    // Bauaufträge bereinigen
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.isNPC) continue;
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_', ''));
            const grenze = grenzen.find(g => g.id === grenzeId);
            if (grenze) {
                const builder = villagers.find(v => v.id === site.builder && v.alive);
                if (!builder) {
                    grenze.builder = null;
                    grenze.waitingForBuilder = true;
                    delete constructionSites[key];
                }
            }
            continue;
        }
        const building = buildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = villagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // ===== Capture-Aufgaben bereinigen - MIT GRENZ-ERKENNUNG =====
    for (let v of villagers) {
        if (v.alive && v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            // Suche in Gebäuden
            if (!SPLIT_SCREEN) {
                targetBuilding = npcBuildings.find(b => b.id === v.captureTargetId);
                if (!targetBuilding) {
                    targetGrenze = npcGrenzen.find(g => g.id === v.captureTargetId);
                }
            }
            if (!targetBuilding && SPLIT_SCREEN) {
                targetBuilding = player2Buildings.find(b => b.id === v.captureTargetId);
                if (!targetBuilding) {
                    targetGrenze = player2Grenzen.find(g => g.id === v.captureTargetId);
                }
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    villagers = cachedPlayerVillagers.slice();

    // Stein-Overflow korrigieren
    for (let building of buildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            resources.stone += overflow;
        }
    }

    const neededBuilders = getNeededBuildersSpieler();
    const freeForTasks = cachedPlayerFreeVillagers.slice(neededBuilders);

    const now = performance.now() / 1000;
    const stonePriority = (now - lastPlayerVillagerHitTime < 10);

    const hasGrainNodes = cachedPlayerResourceNodes.some(n => n.type === 'grain' && !n.claimedBy);
    const grainPriority = (resources.grain < 50 && hasGrainNodes);

    // ============================================================
    // STEINLIEFERUNG
    // ============================================================
    const towersNeedingStone = buildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = cachedPlayerFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const totalFree = freeForStone.length;
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && resources.stone > 0 && totalFree > 0) {
        const currentlyDelivering = cachedPlayerVillagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, resources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || resources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                for (let i = 0; i < canSend; i++) {
                    if (resources.stone <= 0) break;
                    let closestVillager = null, closestDist = Infinity;
                    for (let v of freeForStone) {
                        if (v.hasTask || v.isDeliveringStone) continue;
                        const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
                        if (d < closestDist) { closestDist = d; closestVillager = v; }
                    }
                    if (closestVillager) {
                        tower.reservedStone += 1;
                        resources.stone -= 1;
                        const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE);
                        if (lager) {
                            closestVillager.state = 'movingToLagerForStone';
                            closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.hasTask = true;
                            closestVillager.isDeliveringStone = true;
                            closestVillager.towerTarget = tower;
                            closestVillager.stoneToDeliver = 1;
                            closestVillager.hasReservedStone = true;
                            closestVillager.carrying = 'stone';
                            freeForStone = freeForStone.filter(v => v.id !== closestVillager.id);
                        } else {
                            resources.stone += 1;
                            tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                        }
                    }
                }
            }
        }
    }

    // ============================================================
    // RESSOURCEN SAMMELN - NUR READY NODES!
    // ============================================================
    
    const freeForTasksAfterStone = cachedPlayerFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const readyNodesWithFields = cachedPlayerResourceNodes.filter(node => 
        !node.claimedBy && 
        node.ready &&
        node.fields && 
        node.fields.length > 0
    );

    if (readyNodesWithFields.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            const buildRadius = getBuildRadius('player');
            let nodesInRadius = readyNodesWithFields.filter(node => {
                const nodeWorldX = node.x;
                const nodeWorldY = node.y;
                return isWithinBuildRadius(nodeWorldX, nodeWorldY, 'player');
            });

            if (nodesInRadius.length === 0) {
                nodesInRadius = readyNodesWithFields;
            }

            let sortedNodes = nodesInRadius;
            if (grainPriority) {
                sortedNodes = [...nodesInRadius].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...nodesInRadius].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            }

            for (let node of sortedNodes) {
                if (node.claimedBy) continue;
                
                const hasUnharvestedFields = node.fields.some(f => !f.harvested);
                if (!hasUnharvestedFields) {
                    node.ready = false;
                    node.timer = 0;
                    node.claimedBy = null;
                    for (let f of node.fields) {
                        f.harvested = false;
                        f.harvestTimer = 0;
                        f.isBeingHarvested = false;
                    }
                    markDirty();
                    continue;
                }

                const nextField = node.fields.find(f => !f.harvested);
                if (!nextField) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - nextField.x * CONFIG.CELL_SIZE, v.y - nextField.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'harvestingField';
                    closestVillager.isHarvesting = true;
                    closestVillager.harvestBuildingId = node.buildingId;
                    closestVillager.harvestFieldIndex = node.fields.indexOf(nextField);
                    closestVillager.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                    
                    nextField.isBeingHarvested = true;
                }
            }
        }
    }

    // ============================================================
    // BEWEGUNG FÜR ALLE EINWOHNER
    // ============================================================

    const villagersToUpdate = cachedPlayerVillagers.slice();

    for (let v of villagersToUpdate) {
        const home = buildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // ===== movingToCapture - MIT GRENZ-ERKENNUNG =====
        if (v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            // Suche in Gebäuden
            if (!SPLIT_SCREEN) {
                targetBuilding = npcBuildings.find(b => b.id === v.captureTargetId);
                if (!targetBuilding) {
                    targetGrenze = npcGrenzen.find(g => g.id === v.captureTargetId);
                }
            }
            if (!targetBuilding && SPLIT_SCREEN) {
                targetBuilding = player2Buildings.find(b => b.id === v.captureTargetId);
                if (!targetBuilding) {
                    targetGrenze = player2Grenzen.find(g => g.id === v.captureTargetId);
                }
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // ===== FELD ERNTEN (harvestingField) =====
        if (v.state === 'harvestingField' && v.isHarvesting) {
            const node = resourceNodes.find(n => n.buildingId === v.harvestBuildingId);
            if (!node || !node.fields || node.fields.length === 0) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            if (!node.ready) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                v.resourceTarget = null;
                node.claimedBy = null;
                continue;
            }
            
            const fieldIndex = v.harvestFieldIndex;
            if (fieldIndex === undefined || fieldIndex >= node.fields.length) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            const field = node.fields[fieldIndex];
            const targetX = field.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const targetY = field.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            v.targetX = targetX;
            v.targetY = targetY;
            
            const dx = v.targetX - v.x;
            const dy = v.targetY - v.y;
            const distance = Math.hypot(dx, dy);
            
            if (distance < 5) {
                field.harvestTimer += dt;
                
                if (field.harvestTimer >= 0.25) {
                    field.harvested = true;
                    field.isBeingHarvested = false;
                    field.harvestTimer = 0;
                    createHarvestEffect(targetX, targetY, 1);
                    
                    if (!v.harvestedCount) v.harvestedCount = 0;
                    v.harvestedCount += 1;
                    
                    const allHarvested = node.fields.every(f => f.harvested);
                    
                    if (allHarvested) {
                        v.carrying = node.type;
                        v.carryingCount = v.harvestedCount;
                        v.isHarvesting = false;
                        v.state = 'returningHome';
                        v.hasTask = true;
                        v.resourceTarget = null;
                        v.harvestedCount = 0;
                        
                        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player');
                        if (lager) {
                            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const homeBuilding = buildings.find(b => b.id === v.homeId);
                            if (homeBuilding) {
                                v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                v.state = 'idle';
                                v.hasTask = false;
                                v.carrying = null;
                                v.carryingCount = 0;
                                continue;
                            }
                        }
                        
                        node.ready = false;
                        node.timer = 0;
                        node.claimedBy = null;
                        for (let f of node.fields) {
                            f.harvested = false;
                            f.harvestTimer = 0;
                            f.isBeingHarvested = false;
                        }
                        
                        markDirty();
                        continue;
                    } else {
                        const nextField = node.fields.find(f => !f.harvested);
                        if (nextField) {
                            nextField.isBeingHarvested = true;
                            nextField.harvestTimer = 0;
                            v.harvestFieldIndex = node.fields.indexOf(nextField);
                            v.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                        } else {
                            v.carrying = node.type;
                            v.carryingCount = v.harvestedCount;
                            v.isHarvesting = false;
                            v.state = 'returningHome';
                            v.hasTask = true;
                            v.resourceTarget = null;
                            v.harvestedCount = 0;
                            
                            let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player');
                            if (lager) {
                                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                const homeBuilding = buildings.find(b => b.id === v.homeId);
                                if (homeBuilding) {
                                    v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                    v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                } else {
                                    v.state = 'idle';
                                    v.hasTask = false;
                                    v.carrying = null;
                                    v.carryingCount = 0;
                                    continue;
                                }
                            }
                            
                            node.ready = false;
                            node.timer = 0;
                            node.claimedBy = null;
                            for (let f of node.fields) {
                                f.harvested = false;
                                f.harvestTimer = 0;
                                f.isBeingHarvested = false;
                            }
                            
                            markDirty();
                            continue;
                        }
                    }
                }
            } else {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isBuilding && v.buildingTarget) {
            const building = buildings.find(b => b.id === v.buildingTarget);
            const grenze = grenzen.find(g => g.id === v.buildingTarget);
            
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else if (grenze && grenze.isUnderConstruction) {
                const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        if (v.isAttacking) continue;

        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                if (lager) {
                    const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                    const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && buildings.includes(v.towerTarget) && !v.towerTarget.isUnderConstruction && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            resources.stone += toDeliver;
                            if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                            v.state = 'idle';
                            v.hasTask = false;
                            v.isDeliveringStone = false;
                            v.towerTarget = null;
                            v.stoneToDeliver = 0;
                            v.hasReservedStone = false;
                            v.carrying = null;
                        }
                    } else {
                        const step = Math.min(distance, v.speed * dt);
                        v.x += (dx / distance) * step;
                        v.y += (dy / distance) * step;
                    }
                } else {
                    resources.stone += (v.stoneToDeliver || 0);
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                if (!tower || !buildings.includes(tower) || tower.isUnderConstruction || tower.stoneAmmo >= tower.maxStoneAmmo) {
                    resources.stone += (v.stoneToDeliver || 0);
                    if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    continue;
                }
                const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            resources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        // ===== EINWOHNER KOMMT AM LAGER AN =====
        if (v.state === 'returningHome' && v.carrying) {
            const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player');
            if (lager) {
                const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                
                if (distance < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') resources.grain += count;
                    else if (v.carrying === 'wood') resources.wood += count;
                    else if (v.carrying === 'stone') resources.stone += count;
                    
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                    
                    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                    v.targetX = homePos.x;
                    v.targetY = homePos.y;
                    
                    markDirty();
                    continue;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                    continue;
                }
            } else {
                const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                  y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                v.targetX = homePos.x;
                v.targetY = homePos.y;
                const dx = homePos.x - v.x;
                const dy = homePos.y - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') resources.grain += count;
                    else if (v.carrying === 'wood') resources.wood += count;
                    else if (v.carrying === 'stone') resources.stone += count;
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        if (v.carrying !== null && !v.isDeliveringStone && v.state !== 'returningHome') {
            v.state = 'returningHome';
            const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY);
            if (lager) {
                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            } else {
                v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            }
            v.resourceTarget = null;
        }

        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedPlayerResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { v.targetX = homePos.x;
                v.targetY = homePos.y; }
        }

        if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY);
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
        }
    }

    villagers = villagers.filter(v => v.alive);

    refreshPlayerVillagerCache();
    refreshPlayerResourceCache();
    refreshLagerCache();

    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    markDirty();
}

let player2CacheVersion = 0;
let cachedPlayer2FreeCount = -1;

function markPlayer2CacheDirty() {
    cacheNeedsRefreshP2 = true;
}

function refreshPlayer2VillagerCache() {
    const aliveVillagers = player2Villagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    if (cachedPlayer2AliveIds.size === aliveCount && cachedPlayer2FreeCount === freeCount && cacheNeedsRefreshP2 === false) {
        return;
    }

    try {
        cachedPlayer2Villagers = aliveVillagers;
        cachedPlayer2AliveIds = aliveIds;
        cachedPlayer2FreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedPlayer2FreeCount = cachedPlayer2FreeVillagers.length;
        cacheNeedsRefreshP2 = false;
    } catch(e) {
        cachedPlayer2Villagers = [];
        cachedPlayer2FreeVillagers = [];
        cachedPlayer2AliveIds = new Set();
        cachedPlayer2FreeCount = 0;
    }
}

function refreshPlayer2ResourceCache() {
    try {
        cachedPlayer2ResourceNodes = player2ResourceNodes.slice();
        cachedPlayer2AvailableNodes = cachedPlayer2ResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedPlayer2ResourceNodes = [];
        cachedPlayer2AvailableNodes = [];
    }
}
function markPlayer2CacheDirty() {
    cacheNeedsRefreshP2 = true;
    villagerGridDirtyPlayer2 = true; // ★ NEU
}

function markPlayer2CacheDirty() {
    cacheNeedsRefreshP2 = true;
    villagerGridDirtyPlayer2 = true; // ★ NEU
    combatGridDirtyPlayer2 = true;   // ★ NEU FÜR KAMPF
}

function getNeededBuildersSpieler2() {
  let needed = 0;
  for (let b of player2Buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleArrivalPlayer2(v, home) {
    if (v.state === 'movingToResource' && v.resourceTarget) {
        const node = cachedPlayer2ResourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.ready && node.claimedBy === v.id) {
            // Ressource abholen
            if (node.type === 'grain') player2Resources.grain += 1;
            else if (node.type === 'wood') player2Resources.wood += 1;
            else if (node.type === 'stone') player2Resources.stone += 1;

            // NODE ZURÜCKSETZEN, NICHT LÖSCHEN!
            const originalNode = player2ResourceNodes.find(r => r.id === node.id);
            if (originalNode) {
                originalNode.timer = 0;
                originalNode.ready = false;
                originalNode.claimedBy = null;
            }
            
            v.carrying = node.type;
            v.deliveryTarget = null;
            refreshPlayer2ResourceCache();
            markDirty();
        } else {
            v.state = 'idle';
            v.resourceTarget = null;
            v.hasTask = false;
            if (node && node.claimedBy === v.id) {
                node.claimedBy = null;
            }
            return;
        }
        v.resourceTarget = null;
        v.state = 'returningHome';

        refreshLagerCache();

        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');

        if (!lager) {
            for (let b of player2Buildings) {
                if (b.type === 'lager') {
                    lager = b;
                    break;
                }
            }
        }

        if (lager) {
            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        } else {
            v.alive = false;
            v.carrying = null;
            v.state = 'idle';
            v.hasTask = false;
            showTemporaryMessage('💀 KEIN LAGER FÜR SPIELER 2!', '#ff0000');
            gameOver = true;
            document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
            document.getElementById('gameOverSub').textContent = 'Spieler 2 hat kein Lager - Spieler 1 gewinnt!';
            document.getElementById('gameOverOverlay').style.display = 'flex';
            return;
        }
    } else if (v.state === 'returningHome' && v.carrying) {
        v.carrying = null;
        v.state = 'idle';
        v.resourceTarget = null;
        v.hasTask = false;
        v.deliveryTarget = null;
        const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                          y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
        v.targetX = homePos.x;
        v.targetY = homePos.y;
    }
}

let lastPlayer2VillagerHitTime = 0;

// =========================================================================
//  ENDE MODUL 12.5b
// =========================================================================

// =========================================================================
//  MODUL 12.5c: EINWOHNER-KI (Spieler 2) - HAUPTLOGIK
//  Exakte Kopie von Modul 12c, aber mit player2-Variablen
// =========================================================================

// =========================================================================
//  MODUL 12.5c: EINWOHNER-KI (Spieler 2) - HAUPTLOGIK (KOMPLETT)
// =========================================================================

function updateVillagersPlayer2(dt) {
    refreshPlayer2VillagerCache();
    refreshPlayer2ResourceCache();
    refreshLagerCache();

    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of player2Buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of player2Villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.isNPC) continue;
        if (site.playerId !== 'player2') continue;
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_player2_', ''));
            const grenze = player2Grenzen.find(g => g.id === grenzeId);
            if (grenze) {
                const builder = player2Villagers.find(v => v.id === site.builder && v.alive);
                if (!builder) {
                    grenze.builder = null;
                    grenze.waitingForBuilder = true;
                    delete constructionSites[key];
                }
            }
            continue;
        }
        const building = player2Buildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = player2Villagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // ===== Capture-Aufgaben bereinigen - MIT GRENZ-ERKENNUNG =====
    for (let v of player2Villagers) {
        if (v.alive && v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) node.claimedBy = null;
    }

    player2Villagers = cachedPlayer2Villagers.slice();

    for (let building of player2Buildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            player2Resources.stone += overflow;
        }
    }

    const neededBuilders = getNeededBuildersSpieler2();
    const freeForTasks = cachedPlayer2FreeVillagers.slice(neededBuilders);

    const now = performance.now() / 1000;
    const stonePriority = (now - lastPlayer2VillagerHitTime < 10);
    const hasGrainNodes = cachedPlayer2ResourceNodes.some(n => n.type === 'grain' && !n.claimedBy);
    const grainPriority = (player2Resources.grain < 50 && hasGrainNodes);

    // ============================================================
    // STEINLIEFERUNG (Spieler 2)
    // ============================================================
    const towersNeedingStone = player2Buildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = cachedPlayer2FreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const totalFree = freeForStone.length;
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && player2Resources.stone > 0 && totalFree > 0) {
        const currentlyDelivering = cachedPlayer2Villagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, player2Resources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || player2Resources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                for (let i = 0; i < canSend; i++) {
                    if (player2Resources.stone <= 0) break;
                    let closestVillager = null, closestDist = Infinity;
                    for (let v of freeForStone) {
                        if (v.hasTask || v.isDeliveringStone) continue;
                        const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
                        if (d < closestDist) { closestDist = d; closestVillager = v; }
                    }
                    if (closestVillager) {
                        tower.reservedStone += 1;
                        player2Resources.stone -= 1;
                        const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE, false, 'player2');
                        if (lager) {
                            closestVillager.state = 'movingToLagerForStone';
                            closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.hasTask = true;
                            closestVillager.isDeliveringStone = true;
                            closestVillager.towerTarget = tower;
                            closestVillager.stoneToDeliver = 1;
                            closestVillager.hasReservedStone = true;
                            closestVillager.carrying = 'stone';
                            freeForStone = freeForStone.filter(v => v.id !== closestVillager.id);
                        } else {
                            player2Resources.stone += 1;
                            tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                        }
                    }
                }
            }
        }
    }

    // ============================================================
    // RESSOURCEN SAMMELN - NUR READY NODES! (Spieler 2)
    // ============================================================
    
    const freeForTasksAfterStone = cachedPlayer2FreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const readyNodesWithFields = cachedPlayer2ResourceNodes.filter(node => 
        !node.claimedBy && 
        node.ready &&
        node.fields && 
        node.fields.length > 0
    );

    if (readyNodesWithFields.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            let sortedNodes = readyNodesWithFields;
            if (grainPriority) {
                sortedNodes = [...readyNodesWithFields].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...readyNodesWithFields].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            }

            for (let node of sortedNodes) {
                if (node.claimedBy) continue;
                
                const hasUnharvestedFields = node.fields.some(f => !f.harvested);
                if (!hasUnharvestedFields) {
                    node.ready = false;
                    node.timer = 0;
                    node.claimedBy = null;
                    for (let f of node.fields) {
                        f.harvested = false;
                        f.harvestTimer = 0;
                        f.isBeingHarvested = false;
                    }
                    markDirty();
                    continue;
                }

                const nextField = node.fields.find(f => !f.harvested);
                if (!nextField) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - nextField.x * CONFIG.CELL_SIZE, v.y - nextField.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'harvestingField';
                    closestVillager.isHarvesting = true;
                    closestVillager.harvestBuildingId = node.buildingId;
                    closestVillager.harvestFieldIndex = node.fields.indexOf(nextField);
                    closestVillager.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                    
                    nextField.isBeingHarvested = true;
                }
            }
        }
    }

    // ============================================================
    // BEWEGUNG FÜR ALLE SPIELER 2 EINWOHNER
    // ============================================================

    const villagersToUpdate = cachedPlayer2Villagers.slice();

    for (let v of villagersToUpdate) {
        const home = player2Buildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // ===== movingToCapture - MIT GRENZ-ERKENNUNG =====
        if (v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // ===== FELD ERNTEN (harvestingField) - SPIELER 2 =====
        if (v.state === 'harvestingField' && v.isHarvesting) {
            const node = player2ResourceNodes.find(n => n.buildingId === v.harvestBuildingId);
            if (!node || !node.fields || node.fields.length === 0) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            if (!node.ready) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                v.resourceTarget = null;
                node.claimedBy = null;
                continue;
            }
            
            const fieldIndex = v.harvestFieldIndex;
            if (fieldIndex === undefined || fieldIndex >= node.fields.length) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            const field = node.fields[fieldIndex];
            const targetX = field.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const targetY = field.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            v.targetX = targetX;
            v.targetY = targetY;
            
            const dx = v.targetX - v.x;
            const dy = v.targetY - v.y;
            const distance = Math.hypot(dx, dy);
            
            if (distance < 5) {
                field.harvestTimer += dt;
                
                if (field.harvestTimer >= 0.25) {
                    field.harvested = true;
                    field.isBeingHarvested = false;
                    field.harvestTimer = 0;
                    createHarvestEffect(targetX, targetY, 1);
                    
                    if (!v.harvestedCount) v.harvestedCount = 0;
                    v.harvestedCount += 1;
                    
                    const allHarvested = node.fields.every(f => f.harvested);
                    
                    if (allHarvested) {
                        v.carrying = node.type;
                        v.carryingCount = v.harvestedCount;
                        v.isHarvesting = false;
                        v.state = 'returningHome';
                        v.hasTask = true;
                        v.resourceTarget = null;
                        v.harvestedCount = 0;
                        
                        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
                        if (lager) {
                            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const homeBuilding = player2Buildings.find(b => b.id === v.homeId);
                            if (homeBuilding) {
                                v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                v.state = 'idle';
                                v.hasTask = false;
                                v.carrying = null;
                                v.carryingCount = 0;
                                continue;
                            }
                        }
                        
                        node.ready = false;
                        node.timer = 0;
                        node.claimedBy = null;
                        for (let f of node.fields) {
                            f.harvested = false;
                            f.harvestTimer = 0;
                            f.isBeingHarvested = false;
                        }
                        
                        markDirty();
                        continue;
                    } else {
                        const nextField = node.fields.find(f => !f.harvested);
                        if (nextField) {
                            nextField.isBeingHarvested = true;
                            nextField.harvestTimer = 0;
                            v.harvestFieldIndex = node.fields.indexOf(nextField);
                            v.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                        } else {
                            v.carrying = node.type;
                            v.carryingCount = v.harvestedCount;
                            v.isHarvesting = false;
                            v.state = 'returningHome';
                            v.hasTask = true;
                            v.resourceTarget = null;
                            v.harvestedCount = 0;
                            
                            let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
                            if (lager) {
                                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                const homeBuilding = player2Buildings.find(b => b.id === v.homeId);
                                if (homeBuilding) {
                                    v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                    v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                } else {
                                    v.state = 'idle';
                                    v.hasTask = false;
                                    v.carrying = null;
                                    v.carryingCount = 0;
                                    continue;
                                }
                            }
                            
                            node.ready = false;
                            node.timer = 0;
                            node.claimedBy = null;
                            for (let f of node.fields) {
                                f.harvested = false;
                                f.harvestTimer = 0;
                                f.isBeingHarvested = false;
                            }
                            
                            markDirty();
                            continue;
                        }
                    }
                }
            } else {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isBuilding && v.buildingTarget) {
            const building = player2Buildings.find(b => b.id === v.buildingTarget);
            const grenze = player2Grenzen.find(g => g.id === v.buildingTarget);
            
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else if (grenze && grenze.isUnderConstruction) {
                const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        if (v.isAttacking) continue;

        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
                if (lager) {
                    const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                    const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && player2Buildings.includes(v.towerTarget) && !v.towerTarget.isUnderConstruction && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            player2Resources.stone += toDeliver;
                            if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                            v.state = 'idle';
                            v.hasTask = false;
                            v.isDeliveringStone = false;
                            v.towerTarget = null;
                            v.stoneToDeliver = 0;
                            v.hasReservedStone = false;
                            v.carrying = null;
                        }
                    } else {
                        const step = Math.min(distance, v.speed * dt);
                        v.x += (dx / distance) * step;
                        v.y += (dy / distance) * step;
                    }
                } else {
                    player2Resources.stone += (v.stoneToDeliver || 0);
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                if (!tower || !player2Buildings.includes(tower) || tower.isUnderConstruction || tower.stoneAmmo >= tower.maxStoneAmmo) {
                    player2Resources.stone += (v.stoneToDeliver || 0);
                    if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    continue;
                }
                const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            player2Resources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        // ===== EINWOHNER KOMMT AM LAGER AN - SPIELER 2 =====
        if (v.state === 'returningHome' && v.carrying) {
            const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
            if (lager) {
                const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                
                if (distance < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') player2Resources.grain += count;
                    else if (v.carrying === 'wood') player2Resources.wood += count;
                    else if (v.carrying === 'stone') player2Resources.stone += count;
                    
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                    
                    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                    v.targetX = homePos.x;
                    v.targetY = homePos.y;
                    
                    markDirty();
                    continue;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                    continue;
                }
            } else {
                const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                  y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                v.targetX = homePos.x;
                v.targetY = homePos.y;
                const dx = homePos.x - v.x;
                const dy = homePos.y - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') player2Resources.grain += count;
                    else if (v.carrying === 'wood') player2Resources.wood += count;
                    else if (v.carrying === 'stone') player2Resources.stone += count;
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        if (v.carrying !== null && !v.isDeliveringStone && v.state !== 'returningHome') {
            v.state = 'returningHome';
            const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY, false, 'player2');
            if (lager) {
                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            } else {
                v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            }
            v.resourceTarget = null;
        }

        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedPlayer2ResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { v.targetX = homePos.x;
                v.targetY = homePos.y; }
        }

        if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY, false, 'player2');
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
        }
    }

    player2Villagers = player2Villagers.filter(v => v.alive);

    refreshPlayer2VillagerCache();
    refreshPlayer2ResourceCache();
    refreshLagerCache();

    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of player2Buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of player2Villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    markDirty();
}

const VILLAGER_GRID_SIZE = 100; // Pixel pro Grid-Zelle

// ===== GRIDS FÜR ALLE 3 SPIELERTYPEN =====
let villagerGridPlayer = new Map();      // Spieler 1
let villagerGridPlayer2 = new Map();     // Spieler 2
let villagerGridNpc = new Map();         // NPC

// ===== DIRTY-FLAGS FÜR GRIDS =====
let villagerGridDirtyPlayer = true;
let villagerGridDirtyPlayer2 = true;
let villagerGridDirtyNpc = true;

// ===== HILFSFUNKTION =====
function getGridKey(x, y) {
    const cx = Math.floor(x / VILLAGER_GRID_SIZE);
    const cy = Math.floor(y / VILLAGER_GRID_SIZE);
    return cx + ',' + cy;
}

// ===== GRID FÜR SPIELER 1 NEU AUFBAUEN =====
function rebuildVillagerGridPlayer() {
    villagerGridPlayer.clear();
    for (let v of villagers) {
        if (!v.alive) continue;
        const key = getGridKey(v.x, v.y);
        if (!villagerGridPlayer.has(key)) {
            villagerGridPlayer.set(key, []);
        }
        villagerGridPlayer.get(key).push(v);
    }
    villagerGridDirtyPlayer = false;
}

// ===== GRID FÜR SPIELER 2 NEU AUFBAUEN =====
function rebuildVillagerGridPlayer2() {
    villagerGridPlayer2.clear();
    for (let v of player2Villagers) {

    }

}
