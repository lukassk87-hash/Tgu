// =========================================================================
//  MODUL 20: TOUCH-VERTEILUNG (für 2 Spieler + Netzwerk)
//  KORRIGIERT: startConstruction() für Player 1 korrekt aufgerufen
//  NEU: Split-Start Gebäudeplatzierung für beide Spieler mit Bestätigungsdialog
//  NEU: Netzwerk-Start Gebäudeplatzierung für Host und Client
//  FIX: Client erkennt sich selbst als 'player2' im Netzwerk-Modus
//  FIX: Option A - Client-Erkennung in handleTap() mit NETWORK_MODE && !IS_HOST
// =========================================================================

// ===== TOUCH-VARIABLEN (aus Modul 4) werden verwendet =====
// touches, activeTouches, lastPinchDist, isPanning, panStart, hasMoved, MOVE_THRESHOLD

// ===== HILFSFUNKTION: Prüft ob Touch in oberer Hälfte ist =====
function isInTopHalf(y) {
    return y < canvas.height / 2;
}

// ===== SPLIT-SCREEN KOORDINATENUMRECHNUNG =====
function screenToWorldSplit(sx, sy, cam, isTopHalf) {
    const adjustedY = isTopHalf ? sy : sy - canvas.height / 2;
    const adjustedHeight = canvas.height / 2;
    return {
        x: (sx - canvas.width/2) / cam.zoom + cam.x,
        y: (adjustedY - adjustedHeight/2) / cam.zoom + cam.y
    };
}

// ===== EINZELMODUS KOORDINATENUMRECHNUNG =====
function screenToWorld(sx, sy, cam = null) {
    const c = cam || camera;
    return {
        x: (sx - canvas.width/2) / c.zoom + c.x,
        y: (sy - canvas.height/2) / c.zoom + c.y
    };
}

// ===== TOUCH START =====
function handleTouchStart(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        touches[t.identifier] = {
            x: t.clientX - rect.left,
            y: t.clientY - rect.top,
            startX: t.clientX - rect.left,
            startY: t.clientY - rect.top
        };
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 2) {
        isPanning = false;
        lastPinchDist = Math.hypot(
            activeTouches[1].x - activeTouches[0].x,
            activeTouches[1].y - activeTouches[0].y
        );
    }
}

// ===== TOUCH MOVE =====
function handleTouchMove(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        touches[t.identifier] = {
            x: t.clientX - rect.left,
            y: t.clientY - rect.top
        };
    });
    activeTouches = Object.values(touches);

    if (activeTouches.length === 2) {
        isPanning = false;
        const p1 = activeTouches[0];
        const p2 = activeTouches[1];

        // NUR im Split-Screen prüfen ob BEIDE Touches in der gleichen Hälfte sind
        if (SPLIT_SCREEN) {
            const p1IsTop = isInTopHalf(p1.y);
            const p2IsTop = isInTopHalf(p2.y);

            // Nur zoomen wenn beide in der gleichen Hälfte sind
            if (p1IsTop !== p2IsTop) {
                // Touches sind in unterschiedlichen Hälften - kein Zoom
                lastPinchDist = 0;
                markDirty();
                return;
            }
        }

        const newDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

        if (lastPinchDist > 0) {
            const scale = newDist / lastPinchDist;
            if (SPLIT_SCREEN) {
                const isTop = isInTopHalf(mid.y);
                if (isTop) {
                    // Zoom für Spieler 1
                    const before = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.x += before.x - after.x;
                    camera.y += before.y - after.y;
                } else {
                    // Zoom für Spieler 2
                    const before = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.zoom = Math.min(cameraPlayer2.maxZoom, Math.max(cameraPlayer2.minZoom, cameraPlayer2.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.x += before.x - after.x;
                    cameraPlayer2.y += before.y - after.y;
                }
            } else {
                // Einzelmodus Zoom
                const before = screenToWorld(mid.x, mid.y, camera);
                camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                const after = screenToWorld(mid.x, mid.y, camera);
                camera.x += before.x - after.x;
                camera.y += before.y - after.y;
            }
        }
        lastPinchDist = newDist;
        markDirty();

    } else if (activeTouches.length === 1 && isPanning) {
        const p = activeTouches[0];
        const dx = p.x - panStart.x;
        const dy = p.y - panStart.y;
        if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
            hasMoved = true;
        }
        if (hasMoved) {
            if (SPLIT_SCREEN) {
                const startY = panStart.y;
                if (isInTopHalf(startY)) {
                    camera.x -= (p.x - panStart.x) / camera.zoom;
                    camera.y -= (p.y - panStart.y) / camera.zoom;
                } else {
                    cameraPlayer2.x -= (p.x - panStart.x) / cameraPlayer2.zoom;
                    cameraPlayer2.y -= (p.y - panStart.y) / cameraPlayer2.zoom;
                }
            } else {
                camera.x -= (p.x - panStart.x) / camera.zoom;
                camera.y -= (p.y - panStart.y) / camera.zoom;
            }
            panStart = { ...p };
            markDirty();
        }
    }
}

// ===== TOUCH END =====
function handleTouchEnd(e) {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => {
        delete touches[t.identifier];
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 0 && isPanning && !hasMoved) {
        const touchX = panStart.x;
        const touchY = panStart.y;
        let world;
        let playerId = 'player';
        if (SPLIT_SCREEN) {
            const isTop = isInTopHalf(touchY);
            if (isTop) {
                world = screenToWorldSplit(touchX, touchY, camera, true);
                playerId = 'player';
            } else {
                world = screenToWorldSplit(touchX, touchY, cameraPlayer2, false);
                playerId = 'player2';
            }
        } else {
            world = screenToWorld(touchX, touchY, camera);
            playerId = 'player';
        }
        const gx = Math.floor(world.x / CONFIG.CELL_SIZE);
        const gy = Math.floor(world.y / CONFIG.CELL_SIZE);
        if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
            handleTap(playerId, gx, gy);
        }
    }
    if (activeTouches.length === 0) {
        isPanning = false;
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
    }
}

// ===== TAP VERARBEITUNG (KORRIGIERT - Option A: Client-Erkennung in handleTap) =====
function handleTap(playerId, gx, gy) {

    // ===== NETZWERK-START: Platzierung der Startgebäude =====
    if (NETWORK_MODE && splitStartPhase && !gameStarted) {
        const isPlayer1Phase = splitStartPhase.startsWith('player1');

        // Prüfen ob der richtige Spieler dran ist
        if (IS_HOST && !isPlayer1Phase) {
            showTemporaryMessage('❌ Jetzt ist der Client dran!', '#ff6b6b', true);
            return;
        }
        if (!IS_HOST && isPlayer1Phase) {
            showTemporaryMessage('❌ Jetzt ist der Host dran!', '#ff6b6b', true);
            return;
        }

        // IM NETZWERK-MODUS: Host = player, Client = player (weil er eigene Kamera hat)
        // Aber der Client muss als 'player2' behandelt werden!
        const effectivePlayerId = IS_HOST ? 'player' : 'player2';

        // Prüfen ob der Touch vom richtigen Spieler kommt
        if (IS_HOST && playerId !== 'player') {
            showTemporaryMessage('❌ Du bist der Host - nutze deine Kamera!', '#ff6b6b', true);
            return;
        }
        // Client: playerId ist 'player', aber wir behandeln ihn als 'player2'
        if (!IS_HOST && playerId !== 'player') {
            showTemporaryMessage('❌ Du bist der Client - nutze deine Kamera!', '#ff6b6b', true);
            return;
        }

        const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
        if (isPlayer1Phase && gy > gridLimit) {
            showTemporaryMessage('❌ Host darf nur im oberen Drittel bauen!', '#ff6b6b', true);
            return;
        }
        if (!isPlayer1Phase && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Client darf nur im unteren Drittel bauen!', '#ff6b6b', true);
            return;
        }

        if (isCellOccupied(gx, gy)) {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
            return;
        }

        const type = splitStartPhase.includes('lager') ? 'lager' : 'haus';
        const typeDisplay = type === 'lager' ? '📦 Lager' : '🏠 Haus';
        const playerDisplay = isPlayer1Phase ? 'Host' : 'Client';

        pendingSplitStart = { 
            gx, gy, 
            player: isPlayer1Phase ? 'player1' : 'player2', 
            type: type,
            isNetwork: true 
        };

        dialogNeedsRotation = false;
        dialogIsUrgent = true;

        document.getElementById('confirmText').textContent = `${typeDisplay} an dieser Stelle für ${playerDisplay} platzieren?`;
        document.getElementById('costDisplay').textContent = '✅ Startgebäude - kostenlos';
        document.getElementById('effectDisplay').textContent = `6 Einwohner (beim Haus)`;
        document.getElementById('confirmDialog').style.display = 'block';
        applyDialogRotation();
        window._pendingSplitStart = true;
        return;
    }

    // ===== SPLIT-START: Platzierung der Startgebäude (BEIDE SPIELER) =====
    if (SPLIT_SCREEN && splitStartPhase && !gameStarted) {
        const isPlayer1Phase = splitStartPhase.startsWith('player1');
        const currentPlayer = isPlayer1Phase ? 'player' : 'player2';
        if (playerId !== currentPlayer) {
            showTemporaryMessage(`❌ Jetzt ist ${isPlayer1Phase ? 'Spieler 1' : 'Spieler 2'} dran!`, '#ff6b6b', true);
            return;
        }

        const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
        if (isPlayer1Phase && gy > gridLimit) {
            showTemporaryMessage('❌ Spieler 1 darf nur im oberen Drittel bauen!', '#ff6b6b', true);
            return;
        }
        if (!isPlayer1Phase && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b', true);
            return;
        }

        if (isCellOccupied(gx, gy)) {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
            return;
        }

        const type = splitStartPhase.includes('lager') ? 'lager' : 'haus';
        const typeDisplay = type === 'lager' ? '📦 Lager' : '🏠 Haus';
        const playerDisplay = isPlayer1Phase ? 'Spieler 1' : 'Spieler 2';
        pendingSplitStart = { gx, gy, player: isPlayer1Phase ? 'player1' : 'player2', type: type };

        // === DIALOG ROTATION SETZEN ===
        dialogNeedsRotation = isPlayer1Phase;
        dialogIsUrgent = true;

        document.getElementById('confirmText').textContent = `${typeDisplay} an dieser Stelle für ${playerDisplay} platzieren?`;
        document.getElementById('costDisplay').textContent = '✅ Startgebäude - kostenlos';
        document.getElementById('effectDisplay').textContent = `6 Einwohner (beim Haus)`;
        document.getElementById('confirmDialog').style.display = 'block';

        // Rotation anwenden
        applyDialogRotation();
        window._pendingSplitStart = true;
        return;
    }

    // ===== EINZELMODUS START (Lager/Haus) =====
    if (!gameStarted && !SPLIT_SCREEN) {
        if (!isCellOccupied(gx, gy, null, playerId)) {
            if (startPhase === 'lager') {
                pendingStartBuild = { gx, gy };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = '📦 Lager an dieser Stelle platzieren? (kostenlos)';
                document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
                document.getElementById('effectDisplay').textContent = 'Dein erstes Lager';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingStartType = 'lager';
                return;
            } else if (startPhase === 'haus') {
                pendingStartBuild = { gx, gy };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = '🏠 Haus an dieser Stelle platzieren? (kostenlos)';
                document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
                document.getElementById('effectDisplay').textContent = 'Dein erstes Haus mit 6 Einwohnern';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingStartType = 'haus';
                return;
            }
        } else {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
        }
        return;
    }

    // ===== SPIELER 1 (player) - HIER KOMMT DIE UNTERSCHEIDUNG =====
    if (playerId === 'player') {

        // ===== OPTION A: Client-Erkennung =====
        if (NETWORK_MODE && !IS_HOST) {
            // ===== CLIENT (Spieler 2) im Netzwerk-Modus =====
            // Der Client hat playerId = 'player', aber wir behandeln ihn als 'player2'

            // Abriss-Modus für Client (Spieler 2)
            if (destroyModeP2) {

// ===== DIALOG-ROTATION ANWENDEN =====
function applyDialogRotation() {
    const dialog = document.getElementById('confirmDialog');
    if (!dialog) return;

    // Nur den Text-Container drehen, nicht den ganzen Dialog!
    const confirmText = document.getElementById('confirmText');
    const costDisplay = document.getElementById('costDisplay');
    const effectDisplay = document.getElementById('effectDisplay');

    if (SPLIT_SCREEN && dialogNeedsRotation) {
        // NUR den Text drehen
        if (confirmText) confirmText.style.transform = 'rotate(180deg)';
        if (costDisplay) costDisplay.style.transform = 'rotate(180deg)';
        if (effectDisplay) effectDisplay.style.transform = 'rotate(180deg)';

        // Dialog-Container NICHT drehen!
        dialog.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    } else {
        // Alles zurücksetzen
        if (confirmText) confirmText.style.transform = 'rotate(0deg)';
        if (costDisplay) costDisplay.style.transform = 'rotate(0deg)';
        if (effectDisplay) effectDisplay.style.transform = 'rotate(0deg)';
        dialog.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    }
}

                                isUnderConstruction: building.isUnderConstruction,
                                constructionProgress: building.constructionProgress,
                                level: building.level,
                                residents: building.residents,
                                maxResidents: building.maxResidents,
                                stoneAmmo: building.stoneAmmo || 0,
                                maxStoneAmmo: building.maxStoneAmmo || 15,
                                range: building.range || CONFIG.TOWER_RANGE
                            } : null
                        };
                        console.log('🔍 [CLIENT] Sende build_start_building an Host:', JSON.stringify(action));
                        window.sendNetworkAction(action);
                        showTemporaryMessage('✅ Gebäude platziert! Warte auf Host...', '#2ecc71', true);

                        // ===== RENDERN ERZWINGEN (Client zeigt sein Gebäude sofort an) =====
                        markDirty();
                        renderDirty = true;
                        console.log('🔍 [CLIENT] Rendern erzwungen!');
                    }
                } else {
                    console.warn('🔍 [CLIENT] Nicht Client-Phase, aber Client hat geklickt? Phase:', splitStartPhase);
                }
            }
            pendingSplitStart = null;
            window._pendingSplitStart = false;
            document.getElementById('confirmDialog').style.display = 'none';
            dialogNeedsRotation = false;
            dialogIsUrgent = false;
            markDirty();
            return;
        }

        // ===== SPLIT-MODUS =====
        if (SPLIT_SCREEN) {
            if (placeSplitStartBuilding(pendingSplitStart.player, pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy)) {
                pendingSplitStart = null;
                window._pendingSplitStart = false;
                advanceSplitStart();
            } else {
                pendingSplitStart = null;
                window._pendingSplitStart = false;
            }
            document.getElementById('confirmDialog').style.display = 'none';
            dialogNeedsRotation = false;
            dialogIsUrgent = false;
            markDirty();
            return;
        }
    }

    // ===== EINZELMODUS START LAGER =====
    if (window._pendingStartType === 'lager' && pendingStartBuild) {
        const lager = new Building(nextBuildingId++, 'lager', pendingStartBuild.gx, pendingStartBuild.gy, false);
        lager.isUnderConstruction = false;
        lager.constructionProgress = 1;
        buildings.push(lager);
        startPhase = 'haus';
        pendingStartBuild = null;
        window._pendingStartType = null;
        showTemporaryMessage('✅ Lager platziert! Jetzt Haus platzieren', '#ffd966', true);
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== EINZELMODUS START HAUS =====
    if (window._pendingStartType === 'haus' && pendingStartBuild) {
        const haus = new Building(nextBuildingId++, 'haus', pendingStartBuild.gx, pendingStartBuild.gy, false);
        haus.isUnderConstruction = false;
        haus.constructionProgress = 1;
        haus.residents = 6;
        haus.maxResidents = 6;
        haus.maxProductionTime = 30;
        haus.baseMaxProductionTime = 30;
        buildings.push(haus);
        for (let i = 0; i < 6; i++) {
            spawnVillager(haus.id);
        }
        gameStarted = true;
        pendingStartBuild = null;
        window._pendingStartType = null;
        startPhase = 'lager';
        resources.grain = parseInt(document.getElementById('startGrain').value) || 10;
        resources.wood = parseInt(document.getElementById('startWood').value) || 10;
        resources.stone = parseInt(document.getElementById('startStone').value) || 0;
        if (!SPLIT_SCREEN) {
            initNPC();
        }
        showTemporaryMessage('🎮 Spiel gestartet! 6 Einwohner warten auf Befehle!', '#2ecc71', true);
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== ZERSTÖRUNG SPIELER 1 =====
    if (window._pendingDestroy && pendingDestroy) {
        if (destroyBuilding(pendingDestroy.gx, pendingDestroy.gy)) {
            pendingDestroy = null;
            destroyMode = false;
            document.getElementById('destroyBtn').classList.remove('active');
            showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b', true);
        }
        window._pendingDestroy = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== ZERSTÖRUNG SPIELER 2 =====
    if (window._pendingDestroyP2 && pendingDestroyP2) {
        if (destroyBuildingPlayer2(pendingDestroyP2.gx, pendingDestroyP2.gy)) {
            pendingDestroyP2 = null;
            destroyModeP2 = false;
            document.getElementById('destroyBtnSplit2').classList.remove('active');
            showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b', true);
        }
        window._pendingDestroyP2 = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== UPGRADE SPIELER 1 =====
    if (window._pendingUpgrade && pendingUpgrade) {
        const building = pendingUpgrade.building;
        if (upgradeBuilding(building)) {
            showTemporaryMessage(`⬆️ Upgrade auf Stufe ${building.level} erfolgreich!`, '#ffd966', true);
            pendingUpgrade = null;
        }
        window._pendingUpgrade = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== UPGRADE SPIELER 2 =====
    if (window._pendingUpgradeP2 && pendingUpgradeP2) {
        const building = pendingUpgradeP2.building;
        if (upgradeBuildingPlayer2(building)) {
            showTemporaryMessage(`⬆️ Upgrade auf Stufe ${building.level} erfolgreich!`, '#ffd966', true);
            pendingUpgradeP2 = null;
        }
        window._pendingUpgradeP2 = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== BAU SPIELER 1 (HOST) =====
    if (pendingBuild && selectedBuildingType) {
        if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
            pendingBuild = null;
            showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== BAU SPIELER 2 (CLIENT) =====
    if (pendingBuildP2 && selectedBuildingTypeP2) {
        if (startConstructionPlayer2(selectedBuildingTypeP2, pendingBuildP2.gx, pendingBuildP2.gy)) {
            pendingBuildP2 = null;
            showTemporaryMessage(`🔨 ${selectedBuildingTypeP2} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }

    // ===== HAUPTMENÜ =====
    if (window._pendingMainMenu) {
        window._pendingMainMenu = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        location.reload();
        return;
    }

    // ===== FALLBACK =====
    document.getElementById('confirmDialog').style.display = 'none';
    dialogNeedsRotation = false;
    dialogIsUrgent = false;
}

// ===== HANDLE CONFIRM NO =====
function handleConfirmNo() {

        window._pendingSplitStart = false;

    }
    window._pendingDestroy = false;

    window._pendingUpgrade = false;
    window._pendingUpgradeP2 = false;

    pendingUpgrade = null;

}

let messageRotationTimer = 0;
let messageIsFlipped = false;

function showTemporaryMessage(msg, color = '#fff', urgent = false) {
    if (urgent) {
        messageQueue = [];
        isMessageActive = false;
        if (messageHideTimeout) {
            clearTimeout(messageHideTimeout);
            messageHideTimeout = null;
        }
        tempMessage = msg;
        tempMessageColor = color;
        tempMessageTimer = 3.0;
        if (tempMessageElement) {
            tempMessageElement.textContent = msg;
            tempMessageElement.style.color = color;
            tempMessageElement.style.opacity = '1';
            if (SPLIT_SCREEN) {
                messageIsFlipped = false;
                messageRotationTimer = 0;
                tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
                tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
            }
        }
        isMessageActive = true;
        return;
    }
    messageQueue.push({ msg, color });
    if (!isMessageActive) {
        displayNextMessage();
    }
}

function displayNextMessage() {
    if (messageHideTimeout) {
        clearTimeout(messageHideTimeout);
        messageHideTimeout = null;
    }
    if (messageQueue.length === 0) {
        isMessageActive = false;
        if (tempMessageElement) {
            tempMessageElement.style.opacity = '0';
        }
        return;
    }
    isMessageActive = true;
    const next = messageQueue.shift();
    tempMessage = next.msg;
    tempMessageColor = next.color;
    tempMessageTimer = 3.0;
    if (tempMessageElement) {
        tempMessageElement.textContent = next.msg;
        tempMessageElement.style.color = next.color;
        tempMessageElement.style.opacity = '1';
        if (SPLIT_SCREEN) {
            messageIsFlipped = false;
            messageRotationTimer = 0;
            tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
            tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
        }
    }
}

function updateMessageDisplay(dt) {
    if (!tempMessageElement) return;
    if (tempMessageTimer <= 0 && isMessageActive) {
        tempMessageElement.style.opacity = '0';
        isMessageActive = false;
        if (messageHideTimeout) clearTimeout(messageHideTimeout);
        messageHideTimeout = setTimeout(() => {
            messageHideTimeout = null;
            displayNextMessage();
        }, 300);
        return;
    }
    if (tempMessageTimer <= 0) return;
    if (!SPLIT_SCREEN) return;
    messageRotationTimer += dt;
    if (messageRotationTimer >= 1.5) {
        messageRotationTimer = 0;
        messageIsFlipped = !messageIsFlipped;
        const rotation = messageIsFlipped ? 180 : 0;
        tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg)`;
        tempMessageElement.style.transition = 'transform 0.5s ease';
        tempMessageElement.style.transform += ' scale(1.05)';
        setTimeout(() => {
            if (tempMessageElement && tempMessageTimer > 0) {
                tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg) scale(1)`;
            }
        }, 150);
    }
}

// ===== SPLIT-START: Gebäude platzieren =====
function placeSplitStartBuilding(player, type, gx, gy) {
    const isPlayer1 = (player === 'player1');
    const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);

    if (NETWORK_MODE) {
        if (isPlayer1 && gy > gridLimit) {
            showTemporaryMessage('❌ Host darf nur im oberen Drittel bauen!', '#ff6b6b');
            return false;
        }
        if (!isPlayer1 && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Client darf nur im unteren Drittel bauen!', '#ff6b6b');
            return false;
        }
    } else if (SPLIT_SCREEN) {
        if (isPlayer1 && gy > gridLimit) {
            showTemporaryMessage('❌ Spieler 1 darf nur im oberen Drittel bauen!', '#ff6b6b');
            return false;
        }
        if (!isPlayer1 && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b');
            return false;
        }
    }

    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    // ===== WICHTIG: Gebäude sofort fertigstellen (keine Baustelle!) =====
    const building = new Building(
        isPlayer1 ? nextBuildingId++ : player2NextBuildingId++,
        type,
        gx, gy,
        false,
        isPlayer1 ? 'player' : 'player2'
    );
    
    // ★★★ Startgebäude sind SOFORT FERTIG ★★★
    building.isUnderConstruction = false;
    building.constructionProgress = 1;
    building.constructionTimer = CONFIG.BUILD_TIME; // oder 10
    
    if (type === 'haus') {
        building.residents = 6;
        building.maxResidents = 6;
        building.maxProductionTime = 30;
        building.baseMaxProductionTime = 30;
    }

    if (isPlayer1) {
        buildings.push(building);
        camera.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        camera.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        console.log('🏠 Host Gebäude platziert (sofort fertig):', building);
    } else {
        player2Buildings.push(building);
        cameraPlayer2.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        cameraPlayer2.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        console.log('🏠 Client Gebäude platziert (sofort fertig):', building);
    }

    // ★★★ Einwohner sofort spawnen ★★★
    if (type === 'haus') {
        for (let i = 0; i < 6; i++) {
            if (isPlayer1) {
                spawnVillager(building.id);
            } else {
                spawnVillagerPlayer2(building.id);
            }
        }
    }
    
    markDirty();
    renderDirty = true;
    return true;
}

function advanceSplitStart() {
    const phases = ['player1_lager', 'player1_haus', 'player2_lager', 'player2_haus'];
    const currentIndex = phases.indexOf(splitStartPhase);
    if (currentIndex === phases.length - 1) {
        splitStartPhase = null;
        gameStarted = true;
        gameReady = true;
        showTemporaryMessage('🎮 Spiel gestartet! Beide Spieler sind bereit!', '#2ecc71', true);
        return;
    }
    splitStartPhase = phases[currentIndex + 1];
    const nextPlayer = splitStartPhase.startsWith('player1') ? 'Spieler 1' : 'Spieler 2';
    const nextType = splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    showTemporaryMessage(`👉 ${nextPlayer} platziere dein ${nextType} (kostenlos)`, '#ffd966', true);
}

// ===== NETZWERK-START: Phasen verwalten (OHNE sendSnapshot) =====
function advanceNetworkStart() {
    if (!IS_HOST) return;

    const phases = ['player1_lager', 'player1_haus', 'player2_lager', 'player2_haus'];
    const currentIndex = phases.indexOf(splitStartPhase);

    console.log('📌 advanceNetworkStart - aktuelle Phase:', splitStartPhase, 'Index:', currentIndex);

    if (currentIndex === -1) {
        splitStartPhase = 'player1_lager';
        showTemporaryMessage('👉 Host platziere dein Lager (oberes Drittel)', '#ffd966', true);
        sendStartPhaseToClient();
        return;
    }

    if (currentIndex === phases.length - 1) {
        splitStartPhase = null;
        gameStarted = true;
        gameReady = true;
        // KEIN sendSnapshot() HIER - wird vom Aufrufer gemacht!
        sendStartPhaseToClient();
        showTemporaryMessage('🎮 Netzwerk-Spiel gestartet!', '#2ecc71', true);
        console.log('🎮 Spiel gestartet!');
        return;
    }

    splitStartPhase = phases[currentIndex + 1];
    const nextPlayer = splitStartPhase.startsWith('player1') ? 'Host' : 'Client';
    const nextType = splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const area = splitStartPhase.startsWith('player1') ? 'oberes Drittel' : 'unteres Drittel';

    showTemporaryMessage(`👉 ${nextPlayer} platziere dein ${nextType} (${area})`, '#ffd966', true);
    console.log('👉 Nächste Phase:', splitStartPhase);
    sendStartPhaseToClient();
}

// ===== Phase an Client senden =====
function sendStartPhaseToClient() {
    if (!IS_HOST || !networkConn) return;
    try {
        networkConn.send(JSON.stringify({
            type: 'start_phase',
            phase: splitStartPhase,
            gameStarted: gameStarted || false
        }));
        console.log('📤 Phase an Client gesendet:', splitStartPhase);
    } catch(e) {
        console.warn('Fehler beim Senden der Phase:', e);
    }
}

// ===== Startphase vom Host empfangen (Client) =====
function handleStartPhase(data) {
    if (IS_HOST) return;

    splitStartPhase = data.phase;
    gameStarted = data.gameStarted || false;

    console.log('📌 Client empfängt Phase:', splitStartPhase);

    if (splitStartPhase === 'waiting_for_host') {
        showTemporaryMessage('📥 Warte auf Host...', '#ffd966', true);
        return;
    }

    if (splitStartPhase === null && gameStarted) {
        gameReady = true;
        showTemporaryMessage('🎮 Spiel gestartet!', '#2ecc71', true);
        return;
    }

    const isPlayer1Phase = splitStartPhase.startsWith('player1');
    const type = splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    const area = isPlayer1Phase ? 'oberes Drittel' : 'unteres Drittel';

    if (!isPlayer1Phase) {
        showTemporaryMessage(`👉 Du (Client) platziere dein ${type} (${area})`, '#ffd966', true);
        gameReady = true;
    } else {
        showTemporaryMessage(`⏳ Warte auf Host (${type})...`, '#ffd966', true);
        gameReady = false;
    }
}

        if (NETWORK_MODE) {
            gameOver = true;

// ===== VOLLSTÄNDIGEN SNAPSHOT ANWENDEN (Client) =====
function applyFullSnapshot() {
    // Client akzeptiert nur, wenn keine eigenen Aktionen ausstehen
    if (!IS_HOST && pendingNetworkActions.length > 0) {
        console.log('📨 [applyFullSnapshot] Warte auf eigene Aktionen... (pending:', pendingNetworkActions.length, ')');
        return;
    }

    console.log('📨 [applyFullSnapshot] Wende kompletten Snapshot an...');

    const meta = snapshotParts.meta;
    const res = snapshotParts.resources;
    const nodes = snapshotParts.nodes;
    const construction = snapshotParts.construction;

    // ===== 1. METADATEN & TERRAIN =====
    if (meta) {
        CONFIG.GRID_WIDTH = meta.gridWidth || CONFIG.GRID_WIDTH;
        CONFIG.GRID_HEIGHT = meta.gridHeight || CONFIG.GRID_HEIGHT;
        CONFIG.CELL_SIZE = meta.cellSize || CONFIG.CELL_SIZE;
        WORLD_WIDTH = CONFIG.GRID_WIDTH * CONFIG.CELL_SIZE;
        WORLD_HEIGHT = CONFIG.GRID_HEIGHT * CONFIG.CELL_SIZE;

        if (meta.terrain) {
            terrainMap = meta.terrain;
        }

        gameMode = meta.gameMode;
        gameStarted = meta.gameStarted;
        gameOver = meta.gameOver;
        buildingRestrictionActive = meta.buildingRestrictionActive;

        if (meta.splitStartPhase !== undefined) {
            splitStartPhase = meta.splitStartPhase;
        }

        if (meta.gameReady !== undefined) {
            gameReady = meta.gameReady;
        }

        nextBuildingId = meta.nextBuildingId;
        nextVillagerId = meta.nextVillagerId;
        nextResourceId = meta.nextResourceId;
        nextEnemyId = meta.nextEnemyId;
        player2NextBuildingId = meta.player2NextBuildingId;
        player2NextVillagerId = meta.player2NextVillagerId;
        player2NextResourceId = meta.player2NextResourceId;
    }

    // ===== 2. RESSOURCEN-MENGEN =====
    if (res) {
        resources = { ...res.resources };
        if (IS_HOST || pendingNetworkActions.length === 0) {
            player2Resources = { ...res.player2Resources };
        }
    }

    // ===== 3. RESSOURCEN-NODES =====
    if (nodes) {
        resourceNodes = nodes.resourceNodes.map(n => ({ ...n }));
        if (IS_HOST || pendingNetworkActions.length === 0) {
            player2ResourceNodes = nodes.player2ResourceNodes.map(n => ({ ...n }));
        }
        rebuildResourceMaps();
        refreshPlayerResourceCache();
        refreshPlayer2ResourceCache();
    } else {
        resourceNodes = [];
        player2ResourceNodes = [];
        updatePlayerResourceNodes(0);
        if (SPLIT_SCREEN || NETWORK_MODE) {
            updatePlayer2ResourceNodes(0);
        }
        rebuildResourceMaps();
    }

    // ===== 4. BAUSTELLEN =====
    if (construction) {
        for (let key in constructionSites) {
            if (constructionSites[key].playerId !== undefined) {
                delete constructionSites[key];
            }
        }
        for (let item of construction.sites) {
            if (item.playerId === 'player' || item.playerId === null) {
                constructionSites[item.key] = {
                    timer: item.timer || 0,
                    maxTimer: item.maxTimer || CONFIG.BUILD_TIME,
                    builder: item.builder || null,
                    isNPC: item.isNPC || false,
                    playerId: item.playerId || 'player'
                };
            }
        }
    }

    // ===== 5. GEBÄUDE =====
    const allBuildings = [];
    for (let packet of snapshotParts.buildings) {
        if (packet) allBuildings.push(...packet);
    }
    
    buildings = allBuildings
        .filter(b => b.playerId === 'player' || b.playerId === null)
        .map(b => deserializeBuilding(b));
    
    const hasLocalConstruction = player2Buildings.some(b => b.isUnderConstruction);
    const hasPendingActions = pendingNetworkActions.length > 0;
    
    if (IS_HOST || (!hasPendingActions && !hasLocalConstruction)) {
        player2Buildings = allBuildings
            .filter(b => b.playerId === 'player2')
            .map(b => deserializeBuilding(b));
        console.log('📨 [applyFullSnapshot] Player2 Gebäude vom Snapshot überschrieben:', player2Buildings.length);
    } else {
        const snapshotP2Buildings = allBuildings
            .filter(b => b.playerId === 'player2')
            .map(b => deserializeBuilding(b));
        
        for (let b of snapshotP2Buildings) {
            const exists = player2Buildings.some(local => local.id === b.id);
            if (!exists) {
                player2Buildings.push(b);
                console.log('📨 [applyFullSnapshot] Player2 Gebäude vom Snapshot hinzugefügt:', b.id);
            }
        }
        console.log('📨 [applyFullSnapshot] Player2 Gebäude lokal behalten:', player2Buildings.length);
    }

    // ===== 6. EINWOHNER =====
    const allVillagers = [];
    for (let packet of snapshotParts.villagers) {
        if (packet) allVillagers.push(...packet);
    }
    
    // ★★★ Spieler 1 Einwohner: Ziele vom Snapshot, Positionen erhalten ★★★
    const snapshotVillagers = allVillagers
        .filter(v => v.playerId === 'player' || v.playerId === null)
        .map(v => deserializeVillager(v));

    // Bestehende Einwohner aktualisieren (Positionen erhalten)
    const existingIds = new Set();
    for (let sv of snapshotVillagers) {
        const existing = villagers.find(v => v.id === sv.id);
        if (existing) {
            // ★★★ Position erhalten, Ziele aktualisieren ★★★
            existing.targetX = sv.x;
            existing.targetY = sv.y;
            existing.carrying = sv.carrying;
            existing.state = sv.state;
            existing.alive = sv.alive;
            existing.hasTask = sv.hasTask;
            existing.isAttacking = sv.isAttacking;
            existing.attackTarget = sv.attackTarget;
            existing.isBuilding = sv.isBuilding;
            existing.buildingTarget = sv.buildingTarget;
            existing.isDeliveringStone = sv.isDeliveringStone;
            existing.stoneToDeliver = sv.stoneToDeliver;
            existing.towerTarget = sv.towerTarget;
            existing.hasReservedStone = sv.hasReservedStone;
            existing.combatCooldown = sv.combatCooldown;
            existing.resourceTarget = sv.resourceTarget;
            // Position NICHT überschreiben!
            existingIds.add(sv.id);
        } else {
            // Neuer Einwohner: Position und Ziel setzen
            villagers.push(sv);
            existingIds.add(sv.id);
        }
    }

    // Gelöschte Einwohner entfernen (nur Spieler 1)
    villagers = villagers.filter(v => {
        if (v.playerId === 'player' || v.playerId === null) {
            return existingIds.has(v.id);
        }
        return true; // Player2 Einwohner bleiben erhalten
    });

    console.log('📨 [applyFullSnapshot] Spieler1 Einwohner (Ziele aktualisiert):', snapshotVillagers.length);
    console.log('📨 [applyFullSnapshot] Spieler1 Einwohner lokal:', villagers.filter(v => v.playerId === 'player' || v.playerId === null).length);
    
    // ★★★ Player2 Einwohner: NUR vom Snapshot, wenn Client NICHT lokal baut ★★★
    const hasLocalVillagerActivity = player2Villagers.some(v => v.isBuilding || v.isAttacking || v.hasTask);
    
    if (IS_HOST || (!hasPendingActions && !hasLocalVillagerActivity && !hasLocalConstruction)) {
        const snapshotP2Villagers = allVillagers
            .filter(v => v.playerId === 'player2')
            .map(v => deserializeVillager(v));
        if (snapshotP2Villagers.length > 0) {
            // Für Player2: Positionen behalten, wenn vorhanden
            for (let sv of snapshotP2Villagers) {
                const existing = player2Villagers.find(v => v.id === sv.id);
                if (existing) {
                    existing.targetX = sv.x;
                    existing.targetY = sv.y;
                    existing.carrying = sv.carrying;
                    existing.state = sv.state;
                    existing.alive = sv.alive;
                    existing.hasTask = sv.hasTask;
                    existing.isAttacking = sv.isAttacking;
                    existing.attackTarget = sv.attackTarget;
                    existing.isBuilding = sv.isBuilding;
                    existing.buildingTarget = sv.buildingTarget;
                    existing.isDeliveringStone = sv.isDeliveringStone;
                    existing.stoneToDeliver = sv.stoneToDeliver;
                    existing.towerTarget = sv.towerTarget;
                    existing.hasReservedStone = sv.hasReservedStone;
                    existing.combatCooldown = sv.combatCooldown;
                    existing.resourceTarget = sv.resourceTarget;
                    // Position NICHT überschreiben!
                } else {
                    player2Villagers.push(sv);
                }
            }
            console.log('📨 [applyFullSnapshot] Player2 Einwohner vom Snapshot aktualisiert');
        }
    } else {
        // Client behält seine lokalen Einwohner, aber fügt neue vom Host hinzu
        const snapshotP2Villagers = allVillagers
            .filter(v => v.playerId === 'player2')
            .map(v => deserializeVillager(v));
        
        for (let v of snapshotP2Villagers) {
            const exists = player2Villagers.some(local => local.id === v.id);
            if (!exists) {
                player2Villagers.push(v);
                console.log('📨 [applyFullSnapshot] Player2 Einwohner vom Snapshot hinzugefügt:', v.id);
            }
        }
        console.log('📨 [applyFullSnapshot] Player2 Einwohner lokal behalten:', player2Villagers.length);
    }

    // ===== 7. FEINDE =====
    const allEnemies = [];
    for (let packet of snapshotParts.enemies) {
        if (packet) allEnemies.push(...packet);
    }
    enemies = allEnemies.map(e => ({
        id: e.id,
        x: e.x,
        y: e.y,
        alive: e.alive,
        isSuper: e.isSuper,
        hits: e.hits,
        killCount: e.killCount || 0,
        speed: e.isSuper ? 35 : 45,
        maxHits: e.isSuper ? 3 : 1,
        targetVillager: null
    }));

    // ===== 8. NPC =====
    if (snapshotParts.npc) {
        npcBuildings = snapshotParts.npc.npcBuildings.map(b => deserializeBuilding(b));
        npcResources = { ...snapshotParts.npc.npcResources };
        npcVillagers = snapshotParts.npc.npcVillagers.map(v => deserializeVillager(v));
    }

    // ===== 9. CACHES AKTUALISIEREN =====
    markDirty();
    markPlayerCacheDirty();
    markPlayer2CacheDirty();
    refreshLagerCache();
    renderDirty = true;

    if (!gameReady) {
        gameReady = true;
        showTemporaryMessage('✅ Spiel-Zustand vom Host empfangen!', '#2ecc71', true);
    }

    console.log('📨 [applyFullSnapshot] Snapshot erfolgreich angewendet!');
    resetSnapshotParts();
}

// ===== SNAPSHOT-SPERRE - VERHINDERT REKURSIVE AUFRUFE =====
let snapshotSending = false;
let snapshotPending = false;

function sendSnapshot() {
    if (snapshotSending) {
        snapshotPending = true;
        return;
    }

    if (!IS_HOST || !networkConn) {
        return;
    }

    if (networkConn.peerConnection && networkConn.peerConnection.connectionState !== 'connected') {
        return;
    }

    snapshotSending = true;
    snapshotPending = false;

    try {
        // 1. Metadaten + Terrain
        const metadata = {
            type: 'snapshot_meta',
            timestamp: Date.now(),
            gameMode: gameMode,
            gameStarted: gameStarted,
            gameOver: gameOver,
            buildingRestrictionActive: buildingRestrictionActive,
            gridWidth: CONFIG.GRID_WIDTH,
            gridHeight: CONFIG.GRID_HEIGHT,
            cellSize: CONFIG.CELL_SIZE,
            terrain: terrainMap,
            nextBuildingId: nextBuildingId,
            nextVillagerId: nextVillagerId,
            nextResourceId: nextResourceId,
            nextEnemyId: nextEnemyId,
            player2NextBuildingId: player2NextBuildingId,
            player2NextVillagerId: player2NextVillagerId,
            player2NextResourceId: player2NextResourceId,
            splitStartPhase: splitStartPhase,
            gameReady: gameReady
        };
        networkConn.send(JSON.stringify(metadata));

        // 2. Ressourcen-Mengen
        const resourceData = {
            type: 'snapshot_resources',
            resources: { ...resources },
            player2Resources: { ...player2Resources }
        };
        networkConn.send(JSON.stringify(resourceData));

        // 3. Ressourcen-Nodes
        const nodeData = {
            type: 'snapshot_nodes',
            resourceNodes: resourceNodes.map(n => ({ ...n })),
            player2ResourceNodes: player2ResourceNodes.map(n => ({ ...n }))
        };
        networkConn.send(JSON.stringify(nodeData));

        // 4. Baustellen (constructionSites) – nur für Spieler 1 und 2, nicht NPC
        const constructionData = {
            type: 'snapshot_construction',
            sites: Object.entries(constructionSites)
                .filter(([key, site]) => site.playerId !== undefined)
                .map(([key, site]) => ({ key, ...site }))
        };
        networkConn.send(JSON.stringify(constructionData));

        // 5. Gebäude in Paketen
        const allBuildings = [...buildings, ...player2Buildings];
        const buildingPackets = [];
        const chunkSize = 20;
        for (let i = 0; i < allBuildings.length; i += chunkSize) {
            const chunk = allBuildings.slice(i, i + chunkSize);
            buildingPackets.push({
                type: 'snapshot_buildings',
                buildings: chunk.map(b => serializeBuilding(b)),
                index: Math.floor(i / chunkSize),
                total: Math.ceil(allBuildings.length / chunkSize)
            });
        }
        if (buildingPackets.length === 0) {
            networkConn.send(JSON.stringify({ type: 'snapshot_buildings', buildings: [], index: 0, total: 1 }));
        } else {
            for (let packet of buildingPackets) {
                networkConn.send(JSON.stringify(packet));
            }
        }

        // 6. Einwohner in Paketen
        const allVillagers = [...villagers, ...player2Villagers];
        const villagerPackets = [];
        for (let i = 0; i < allVillagers.length; i += chunkSize) {
            const chunk = allVillagers.slice(i, i + chunkSize);
            villagerPackets.push({
                type: 'snapshot_villagers',
                villagers: chunk.map(v => serializeVillager(v)),
                index: Math.floor(i / chunkSize),
                total: Math.ceil(allVillagers.length / chunkSize)
            });
        }
        if (villagerPackets.length === 0) {
            networkConn.send(JSON.stringify({ type: 'snapshot_villagers', villagers: [], index: 0, total: 1 }));
        } else {
            for (let packet of villagerPackets) {
                networkConn.send(JSON.stringify(packet));
            }
        }

        // 7. Feinde in Paketen
        const enemyPackets = [];
        for (let i = 0; i < enemies.length; i += chunkSize) {
            const chunk = enemies.slice(i, i + chunkSize);
            enemyPackets.push({
                type: 'snapshot_enemies',
                enemies: chunk.map(e => ({ 
                    id: e.id, 
                    x: e.x, 
                    y: e.y, 
                    alive: e.alive, 
                    isSuper: e.isSuper, 
                    hits: e.hits, 
                    killCount: e.killCount || 0 
                })),
                index: Math.floor(i / chunkSize),
                total: Math.ceil(enemies.length / chunkSize)
            });
        }
        if (enemyPackets.length === 0) {
            networkConn.send(JSON.stringify({ type: 'snapshot_enemies', enemies: [], index: 0, total: 1 }));
        } else {
            for (let packet of enemyPackets) {
                networkConn.send(JSON.stringify(packet));
            }
        }

        // 8. NPC-Daten
        if (!SPLIT_SCREEN && npcStarted) {
            const npcData = {
                type: 'snapshot_npc',
                npcBuildings: npcBuildings.map(b => serializeBuilding(b)),
                npcResources: { ...npcResources },
                npcVillagers: npcVillagers.map(v => serializeVillager(v))
            };
            networkConn.send(JSON.stringify(npcData));
        } else {
            networkConn.send(JSON.stringify({ 
                type: 'snapshot_npc', 
                npcBuildings: [], 
                npcResources: {}, 
                npcVillagers: [] 
            }));
        }

    } catch(e) {
        // Fehler still behandeln
    }

    setTimeout(() => {
        snapshotSending = false;
        if (snapshotPending) {
            snapshotPending = false;
            sendDeltaSnapshot();
        }
    }, 500);
}

function applySnapshotPart(data) {
    switch(data.type) {
        case 'snapshot_meta':
            snapshotParts.meta = data;
            break;
        case 'snapshot_resources':
            snapshotParts.resources = data;
            break;
        case 'snapshot_nodes':
            snapshotParts.nodes = data;
            break;
        case 'snapshot_construction':
            snapshotParts.construction = data;
            break;
        case 'snapshot_buildings':
            if (!snapshotParts.buildings[data.index]) {
                snapshotParts.buildings[data.index] = [];
            }
            snapshotParts.buildings[data.index] = data.buildings;
            snapshotParts.expectedBuildings = data.total;
            snapshotParts.receivedBuildings++;
            break;
        case 'snapshot_villagers':
            if (!snapshotParts.villagers[data.index]) {
                snapshotParts.villagers[data.index] = [];
            }
            snapshotParts.villagers[data.index] = data.villagers;
            snapshotParts.expectedVillagers = data.total;
            snapshotParts.receivedVillagers++;
            break;
        case 'snapshot_enemies':
            if (!snapshotParts.enemies[data.index]) {
                snapshotParts.enemies[data.index] = [];
            }
            snapshotParts.enemies[data.index] = data.enemies;
            snapshotParts.expectedEnemies = data.total;
            snapshotParts.receivedEnemies++;
            break;
        case 'snapshot_npc':
            snapshotParts.npc = data;
            break;
    }

    const allReceived = (
        snapshotParts.meta !== null &&
        snapshotParts.resources !== null &&
        snapshotParts.nodes !== null &&
        snapshotParts.construction !== null &&
        snapshotParts.receivedBuildings >= snapshotParts.expectedBuildings &&
        snapshotParts.receivedVillagers >= snapshotParts.expectedVillagers &&
        snapshotParts.receivedEnemies >= snapshotParts.expectedEnemies &&
        snapshotParts.npc !== null
    );

    if (allReceived) {
        applyFullSnapshot();
    }
}

// ===== NETZWERK-NACHRICHTEN VERARBEITEN (Client & Host) =====
function handleNetworkAction(action) {
    if (!IS_HOST) {
        console.warn('🔍 [handleNetworkAction] Aufgerufen von Client! IGNORIERE!');
        return;
    }

    // ---- Client hat Startgebäude platziert (Lager/Haus) ----
    if (action.type === 'build_start_building') {
        if (action.resources) {
            player2Resources = { ...action.resources };
        }
        const existing = player2Buildings.find(b => 
            b.gridX === action.gridX && 
            b.gridY === action.gridY && 
            b.type === action.buildingType
        );
        if (!existing) {
            if (action.buildingId) {
                window._pendingClientBuildingId = action.buildingId;
            }
            // Host führt die Bau-Aktion lokal aus
            startConstructionPlayer2(action.buildingType, action.gridX, action.gridY);
            window._pendingClientBuildingId = null;
        }
        // Nächste Startphase
        advanceNetworkStart();
        sendDeltaSnapshot();
        return;
    }

    // ---- Client baut normales Gebäude (Player2) ----
    if (action.type === 'build_player2') {
        if (action.resources) {
            player2Resources = { ...action.resources };
        }
        const existing = player2Buildings.find(b => 
            b.gridX === action.gridX && 
            b.gridY === action.gridY && 
            b.type === action.buildingType
        );
        if (!existing) {
            if (action.buildingId) {
                window._pendingClientBuildingId = action.buildingId;
            }
            startConstructionPlayer2(action.buildingType, action.gridX, action.gridY);
            window._pendingClientBuildingId = null;
        }
        sendDeltaSnapshot();
        return;
    }

    // ---- Client upgraded Gebäude (Player2) ----
    if (action.type === 'upgrade_player2') {
        if (action.resources) {
            player2Resources = { ...action.resources };
        }
        const upgradeBuilding = player2Buildings.find(b => b.id === action.buildingId);
        if (upgradeBuilding) {
            upgradeBuildingPlayer2(upgradeBuilding);
        }
        sendDeltaSnapshot();
        return;
    }

    // ---- Client zerstört Gebäude (Player2) ----
    if (action.type === 'destroy_player2') {
        if (action.resources) {
            player2Resources = { ...action.resources };
        }
        destroyBuildingPlayer2(action.gridX, action.gridY);
        sendDeltaSnapshot();
        return;
    }

    // ---- Client baut Spieler-1-Gebäude (falls benötigt) ----
    if (action.type === 'build') {
        startConstruction(action.buildingType, action.gridX, action.gridY);
        sendDeltaSnapshot();
        return;
    }

    // ---- Client upgraded Spieler-1-Gebäude ----
    if (action.type === 'upgrade') {
        const b = buildings.find(b => b.id === action.buildingId);
        if (b) upgradeBuilding(b);
        sendDeltaSnapshot();
        return;
    }

    // ---- Client zerstört Spieler-1-Gebäude ----
    if (action.type === 'destroy') {
        destroyBuilding(action.gridX, action.gridY);
        sendDeltaSnapshot();
        return;
    }

    console.warn('Unbekannte Aktion:', action);
}

function handleNetworkMessage(data) {
    try {
        let msg;
        if (typeof data === 'string') {
            msg = JSON.parse(data);
        } else if (typeof data === 'object' && data !== null) {
            msg = data;
        } else {
            console.warn('📨 [handleNetworkMessage] Ungültige Daten:', data);
            return;
        }

        console.log('📨 [handleNetworkMessage] Empfangen:', msg.type);
        console.log('📨 [handleNetworkMessage] IS_HOST:', IS_HOST);

        switch (msg.type) {
            case 'request_snapshot':
                if (IS_HOST) {
                    console.log('📨 [handleNetworkMessage] Client fordert Snapshot an -> sende...');
                    sendSnapshot();
                }
                break;

            case 'delta_snapshot':
                if (!IS_HOST) {
                    console.log('📨 [handleNetworkMessage] Empfange Delta-Snapshot...');
                    applyDeltaSnapshot(msg.data);
                }
                break;

            case 'snapshot_meta':
            case 'snapshot_resources':
            case 'snapshot_nodes':
            case 'snapshot_construction':
            case 'snapshot_buildings':
            case 'snapshot_villagers':
            case 'snapshot_enemies':
            case 'snapshot_npc':
                console.log(`📨 [handleNetworkMessage] Empfange ${msg.type}...`);
                applySnapshotPart(msg);
                break;

            case 'start_phase':
                console.log('📨 [handleNetworkMessage] Empfange start_phase:', msg);
                handleStartPhase(msg);
                break;

            case 'action':
                if (IS_HOST) {
                    console.log('📨 [handleNetworkMessage] Host verarbeitet Action:', msg.action);
                    handleNetworkAction(msg.action);
                } else {
                    console.warn('📨 [handleNetworkMessage] Client ignoriert action (nur Host verarbeitet)');
                }
                break;

            case 'speed_update':
                if (!IS_HOST) {
                    console.log(`📨 [handleNetworkMessage] Geschwindigkeit auf ${msg.speed}x gesetzt (vom Host)`);
                    gameSpeedMultiplier = msg.speed;
                    gameSpeed = msg.speed;
                    
                    // UI-Button aktualisieren
                    const speedBtn = document.querySelector('.speed-btn');
                    if (speedBtn) {
                        if (msg.speed === 1) {
                            speedBtn.textContent = '⏱️';
                            speedBtn.style.color = 'rgba(255,255,255,0.7)';
                            speedBtn.style.textShadow = 'none';
                        } else if (msg.speed === 2) {
                            speedBtn.textContent = '⏩';
                            speedBtn.style.color = '#ffd966';
                            speedBtn.style.textShadow = '0 0 8px rgba(255,215,0,0.5)';
                        } else {
                            speedBtn.textContent = '⏩⏩';
                            speedBtn.style.color = '#ff6b6b';
                            speedBtn.style.textShadow = '0 0 8px rgba(255,68,68,0.5)';
                        }
                    }
                    
                    // Split-Speed-Button aktualisieren
                    const splitSpeedBtn = document.getElementById('splitSpeedBtn');
                    if (splitSpeedBtn) {
                        if (msg.speed === 1) {
                            splitSpeedBtn.textContent = '⏱️';
                            splitSpeedBtn.style.color = 'rgba(255,255,255,0.8)';
                            splitSpeedBtn.style.textShadow = 'none';
                        } else if (msg.speed === 2) {
                            splitSpeedBtn.textContent = '⏩';
                            splitSpeedBtn.style.color = '#ffd966';
                            splitSpeedBtn.style.textShadow = '0 0 12px rgba(255,215,0,0.6)';
                        } else {
                            splitSpeedBtn.textContent = '⏩⏩';
                            splitSpeedBtn.style.color = '#ff6b6b';
                            splitSpeedBtn.style.textShadow = '0 0 12px rgba(255,68,68,0.6)';
                        }
                    }
                }
                break;

            case 'ping':
                if (IS_HOST) {
                    console.log('📨 [handleNetworkMessage] Ping empfangen -> sende Pong');
                    networkConn.send(JSON.stringify({ type: 'pong', time: msg.time }));
                }
                break;

            case 'pong':
                console.log(`📨 [handleNetworkMessage] Pong empfangen (Latenz: ${Date.now() - msg.time}ms)`);
                break;

            default:
                console.warn('📨 [handleNetworkMessage] Unbekannte Nachricht:', msg.type);
        }
    } catch (e) {
        console.error('📨 [handleNetworkMessage] Fehler beim Verarbeiten:', e);
        console.error('📨 [handleNetworkMessage] Daten:', data);
    }
}

// ===== GAME LOOP =====
let gameReady = false;

function gameLoop(now) {
    let dt = (now - lastTimestamp) / 1000;
    if (dt > 0.2) dt = 0.016;
    if (dt < 0.001) dt = 0.001;
    lastTimestamp = now;
    dt *= gameSpeed;

    updateMessageDisplay(dt);

    if (gameStarted) {
        const elapsed = (performance.now() / 1000) - gameStartTime;
        if (elapsed >= BUILD_RESTRICTION_DURATION && buildingRestrictionActive) {
            buildingRestrictionActive = false;
            showTemporaryMessage('🏗️ Baubeschränkung aufgehoben!', '#44ff44');
        }

        // ============================================================
        // NETZWERK: CLIENT führt NUR Player2-Logik aus
        // ============================================================
        if (NETWORK_MODE && !IS_HOST) {
            // ---- CLIENT: NUR SPIELER 2 (eigene Einheiten) ----
            
            // Wirtschaft: nur Player2
            updateEconomyPlayer2(dt);
            
            // Einwohner: Player2 bewegen (lokal)
            updateVillagersPlayer2(dt);
            
            // ★★★ Player1 Einwohner lokal bewegen (NUR für flüssige Anzeige!) ★★★
            updateVillagersClientOnly(dt);
            
            // Baustellen: nur Player2
            updateConstructionPlayer2(dt);
            
            // Ressourcen: nur Player2
            updatePlayer2ResourceNodes(dt);
            
            // Türme: nur Player2
            updateTowersPlayer2Only(dt);
            
            // Projektile & Hit-Effekte (global, auf beiden Seiten)
            updateProjectiles(dt);
            updateHitEffects(dt);
            
            // Feinde: nur bewegen (kein Spawnen, kein Töten)
            updateEnemiesClientOnly(dt);
            
            // Kampf & Eroberung: Client greift nur mit Player2 an
            updateCombatAndCaptureClient(dt);
            
        } else {
            // ---- HOST ODER EINZELMODUS: ALLES ----
            
            // ===== FEINDE SPAWNEN (NUR HOST ODER SINGLEPLAYER) =====
            spawnEnemies();  // ← HIER MUSS DAS HIN!
            
            // Wirtschaft (alle)
            updateEconomyPlayer1(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateEconomyPlayer2(dt);
            }
            if (!SPLIT_SCREEN && !NETWORK_MODE && npcStarted) {
                updateEconomyNPC(dt);
            }
            updateResourceNodes(dt);

            // Einwohner (alle)
            updateVillagers(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateVillagersPlayer2(dt);
            }
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                updateNPCVillagers(dt);
            }

            // Baustellen (alle)
            updateConstruction(dt);
            if (SPLIT_SCREEN || NETWORK_MODE) {
                updateConstructionPlayer2(dt);
            }

            // NPC (nur Einzelmodus)
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                updateNPC(dt);
            }

            // Kampf & Eroberung (global)
            updateCombatAndCapture(dt);
            
            // Türme (global)
            updateTowers(dt);
            
            // Projektile & Hit-Effekte (global)
            updateProjectiles(dt);
            updateHitEffects(dt);

            // Feinde: Host spawnt und steuert, Client bewegt nur
            if (!NETWORK_MODE || IS_HOST) {
                updateEnemies(dt);
            } else {
                updateEnemiesClientOnly(dt);
            }

            // ---- HOST: Regelmäßiger Snapshot ----
            if (NETWORK_MODE && IS_HOST) {
                syncTimer += dt;
                if (syncTimer >= 0.5) {
                    syncTimer = 0;
                    sendDeltaSnapshot();
                }
                
                // ---- HOST: Geschwindigkeit synchronisieren ----
                if (gameSpeedMultiplier !== window._lastSentSpeed) {
                    window._lastSentSpeed = gameSpeedMultiplier;
                    if (networkConn) {
                        networkConn.send(JSON.stringify({
                            type: 'speed_update',
                            speed: gameSpeedMultiplier
                        }));
                    }
                }
            }
        }

        // ============================================================
        // GAME OVER (auf beiden Seiten)
        // ============================================================
        if (gameReady) {
            checkGameOver();
        }

        updateUI();
        if (window.updateModeDisplay) window.updateModeDisplay();
    }

    draw();

    if (tempMessageTimer > 0) {
        tempMessageTimer -= dt;
    }

    requestAnimationFrame(gameLoop);
}

// ===== INIT =====
function init() {
    const canvas = document.getElementById('gameCanvas');
    window.canvas = canvas;
    window.ctx = canvas.getContext('2d');

    generateTerrain();
    refreshPlayerVillagerCache();
    refreshPlayerResourceCache();
    refreshNpcVillagerCache();
    refreshNpcResourceCache();
    rebuildResourceMaps();

    window.addEventListener('resize', resize);
    resize();

    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    setupMessageDisplay();
    setupUI();

    // ===== START BUTTON - KORRIGIERT =====
    const startBtn = document.getElementById('startGameBtn');

    // Alte Event-Listener entfernen
    const newStartBtn = startBtn.cloneNode(true);
    startBtn.parentNode.replaceChild(newStartBtn, startBtn);

    // Neuen Event-Listener hinzufügen
    newStartBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        startGame();
    });
    newStartBtn.addEventListener('touchend', function(e) {
        e.preventDefault();
        e.stopPropagation();
        startGame();
    }, { passive: false });

    requestAnimationFrame(gameLoop);
}

// ===== START GAME - AUSGELAGERTE FUNKTION =====
function startGame() {
    console.log('🎮 StartGame aufgerufen');

    const mode = document.getElementById('modeSelect').value;

    SPLIT_SCREEN = false;
    NETWORK_MODE = false;
    IS_HOST = false;

    if (mode === 'split') {
        SPLIT_SCREEN = true;
    } else if (mode === 'network') {
        NETWORK_MODE = true;
        const role = confirm('Möchtest du als Host starten? (OK = Host, Abbrechen = Client)');
        IS_HOST = role;
        if (IS_HOST) {
            showTemporaryMessage('📡 Starte als Host...', '#ffd966', true);
        } else {
            showTemporaryMessage('📡 Starte als Client...', '#ffd966', true);
        }
    }

    const difficulty = document.getElementById('difficultySelect').value;
    const mapSize = parseInt(document.getElementById('mapSizeSelect').value);
    GRID_SIZE_MULTIPLIER = mapSize;

    CONFIG = getConfig();
    WORLD_WIDTH = CONFIG.GRID_WIDTH * CONFIG.CELL_SIZE;
    WORLD_HEIGHT = CONFIG.GRID_HEIGHT * CONFIG.CELL_SIZE;

    camera.x = WORLD_WIDTH / 2;
    camera.y = WORLD_HEIGHT / 2;
    camera.zoom = 0.3;
    cameraPlayer2.x = WORLD_WIDTH / 2;
    cameraPlayer2.y = WORLD_HEIGHT / 2;
    cameraPlayer2.zoom = 0.3;

    generateTerrain();

    resourceNodes = [];
    player2ResourceNodes = [];
    npcResourceNodes = [];
    rebuildResourceMaps();

    npcHardMode = (difficulty === 'hard');

    const startGrain = parseInt(document.getElementById('startGrain').value) || 10;
    const startWood = parseInt(document.getElementById('startWood').value) || 10;
    const startStone = parseInt(document.getElementById('startStone').value) || 0;

    resources.grain = startGrain;
    resources.wood = startWood;
    resources.stone = startStone;

    if (SPLIT_SCREEN || NETWORK_MODE) {
        player2Resources.grain = startGrain;
        player2Resources.wood = startWood;
        player2Resources.stone = startStone;
    }

    gameStartTime = performance.now() / 1000;
    buildingRestrictionActive = true;
    gameSpeedMultiplier = 1;
    gameSpeed = 1;
    showTowerRange = false;
    gameReady = false;

    if (SPLIT_SCREEN || NETWORK_MODE) {
        gameMode = 'war';
        npcPeaceMode = false;
        npcPeaceTimer = 0;
    } else {
        gameMode = 'peace';
        npcPeaceMode = true;
        npcPeaceTimer = 0;
    }

    document.getElementById('difficultyDialog').style.display = 'none';

    if (SPLIT_SCREEN) {
        document.getElementById('toolbarSplitPlayer').style.display = 'flex';
        document.getElementById('toolbarSplitPlayer2').style.display = 'flex';
        document.getElementById('toolbarRow1').style.display = 'none';
        document.getElementById('toolbarRow2').style.display = 'none';
        document.getElementById('statsSplitPlayer').style.display = 'flex';
        document.getElementById('statsSplitPlayer2').style.display = 'flex';
        document.getElementById('statsDisplay').style.display = 'none';
        document.getElementById('npcStatsDisplay').style.display = 'none';
        document.getElementById('splitExtra').style.display = 'block';
        npcStarted = false;

        initSplitStart();

        if (typeof window.applySplitScreenChangesNow === 'function') {
            window.applySplitScreenChangesNow();
        }
        const msgEl = document.getElementById('tempMessageDisplay');
        if (msgEl) {
            msgEl.style.bottom = '50%';
            msgEl.style.transform = 'translate(-50%, 50%)';
            msgEl.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
        }

        showTemporaryMessage('👥 2-Spieler-Modus - platziert eure Startgebäude!', '#ffd966');

    } else if (NETWORK_MODE) {
        const toolbarP1 = document.getElementById('toolbarSplitPlayer');
        const toolbarP2 = document.getElementById('toolbarSplitPlayer2');
        const statsP1 = document.getElementById('statsSplitPlayer');
        const statsP2 = document.getElementById('statsSplitPlayer2');
        const extraBtns = document.getElementById('splitExtra');
        const toolbarRow1 = document.getElementById('toolbarRow1');
        const toolbarRow2 = document.getElementById('toolbarRow2');

        if (toolbarRow1) toolbarRow1.style.display = 'none';
        if (toolbarRow2) toolbarRow2.style.display = 'none';
        if (extraBtns) extraBtns.style.display = 'none';

        const splitControls = document.getElementById('splitGlobalControls');
        if (splitControls) splitControls.style.display = 'none';

        document.getElementById('statsDisplay').style.display = 'none';
        document.getElementById('npcStatsDisplay').style.display = 'none';

        npcStarted = false;

        if (IS_HOST) {
            if (toolbarP1) {
                toolbarP1.style.display = 'flex';
                toolbarP1.style.top = 'auto';
                toolbarP1.style.bottom = '16px';
                toolbarP1.style.transform = 'translateX(-50%) rotate(0deg)';
                toolbarP1.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.style.transform = 'rotate(0deg)';
                    const span = btn.querySelector('span:not(.cost-badge)');
                    if (span) span.style.transform = 'rotate(0deg)';
                    const badge = btn.querySelector('.cost-badge');
                    if (badge) badge.style.transform = 'rotate(0deg)';
                });
            }
            if (toolbarP2) toolbarP2.style.display = 'none';

            if (statsP1) {
                statsP1.style.display = 'flex';
                statsP1.style.top = 'auto';
                statsP1.style.bottom = '76px';
                statsP1.style.transform = 'rotate(0deg)';
                statsP1.querySelectorAll('span, b').forEach(el => {
                    el.style.transform = 'rotate(0deg)';
                });
            }
            if (statsP2) statsP2.style.display = 'none';

            splitStartPhase = 'player1_lager';
            gameStarted = false;
            gameReady = false;
            showTemporaryMessage('📡 Host-Modus - platziere dein Lager (oberes Drittel)', '#ffd966', true);

        } else {
            if (toolbarP2) {
                toolbarP2.style.display = 'flex';
                toolbarP2.style.bottom = '16px';
                toolbarP2.style.transform = 'translateX(-50%) rotate(0deg)';
                toolbarP2.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.style.transform = 'rotate(0deg)';
                    const span = btn.querySelector('span:not(.cost-badge)');
                    if (span) span.style.transform = 'rotate(0deg)';
                    const badge = btn.querySelector('.cost-badge');
                    if (badge) badge.style.transform = 'rotate(0deg)';
                });
            }
            if (toolbarP1) toolbarP1.style.display = 'none';

            if (statsP2) {
                statsP2.style.display = 'flex';
                statsP2.style.bottom = '76px';
                statsP2.style.top = 'auto';
                statsP2.style.transform = 'rotate(0deg)';
                statsP2.querySelectorAll('span, b').forEach(el => {
                    el.style.transform = 'rotate(0deg)';
                });
            }
            if (statsP1) statsP1.style.display = 'none';

            splitStartPhase = 'waiting_for_host';
            gameStarted = false;
            gameReady = false;
            showTemporaryMessage('📡 Client-Modus - warte auf Host...', '#ffd966', true);
        }

        ['deselectBtnSplit', 'upgradeBtnSplit', 'destroyBtnSplit'].forEach(id => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.style.transform = 'rotate(0deg)';
                const span = btn.querySelector('span');
                if (span) span.style.transform = 'rotate(0deg)';
            }
        });

        const toggleBtn = document.getElementById('toggleToolbarBtn');
        if (toggleBtn) {
            toggleBtn.style.bottom = '76px';
            toggleBtn.style.top = 'auto';
            toggleBtn.style.transform = 'none';
            toggleBtn.style.right = '10px';
            toggleBtn.style.zIndex = '21';
        }

        initNetworkGame(IS_HOST);

    } else {
        document.getElementById('toolbarSplitPlayer').style.display = 'none';
        document.getElementById('toolbarSplitPlayer2').style.display = 'none';
        document.getElementById('toolbarRow1').style.display = 'flex';
        document.getElementById('toolbarRow2').style.display = 'flex';
        document.getElementById('statsSplitPlayer').style.display = 'none';
        document.getElementById('statsSplitPlayer2').style.display = 'none';
        document.getElementById('statsDisplay').style.display = 'flex';
        document.getElementById('npcStatsDisplay').style.display = 'flex';
        document.getElementById('splitExtra').style.display = 'none';
        gameStarted = false;
        startPhase = 'lager';
        gameReady = true;
        initNPC();
        showTemporaryMessage(`🗺️ Karte: ${mapSize === 1 ? 'Normal' : 'Groß'} (${CONFIG.GRID_WIDTH}x${CONFIG.GRID_HEIGHT})`, '#ffd966');
    }

    if (window.updateModeDisplay) window.updateModeDisplay();
    markDirty();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

// =========================================================================
// MODUL 23: SOUND-EFFEKTE
// =========================================================================
const SoundFX = (() => {
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function isVisible(worldX, worldY) {
    const left = camera.x - (canvas.width / 2) / camera.zoom;
    const right = camera.x + (canvas.width / 2) / camera.zoom;
    const top = camera.y - (canvas.height / 2) / camera.zoom;
    const bottom = camera.y + (canvas.height / 2) / camera.zoom;
    return worldX >= left && worldX <= right && worldY >= top && worldY <= bottom;
  }
  function play(freq, duration, type = 'square', vol = 0.1) {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.curreapntTime + duration);
    } catch(e) {}
  }
  return {
    playIfVisible(worldX, worldY, type) {
      if (!isVisible(worldX, worldY)) return;
      switch(type) {
        case 'build': play(220, 0.15, 'square', 0.08); break;
        case 'capture': play(440, 0.2, 'triangle', 0.1); break;
        case 'hit': play(150, 0.1, 'sawtooth', 0.12); break;
        case 'enemyDeath': play(80, 0.3, 'sawtooth', 0.15); break;
        case 'towerShoot': play(880, 0.08, 'square', 0.06); break;
        case 'upgrade': play(660, 0.15, 'triangle', 0.1); break;
        case 'destroy': play(100, 0.25, 'sawtooth', 0.15); break;
        case 'villagerDie': play(200, 0.15, 'square', 0.1); break;
      }
    }
  };
})();
