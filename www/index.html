    .tool-btn.active { border: 3px solid #ffd966; box-shadow: 0 0 22px #f0b323; transform: scale(1.1); background: #3d5035; }

    .tool-btn.deselect { background: #2c3e50; font-size: 20px; }

    .tool-btn.upgrade-btn.active { border-color: #ff66ff; box-shadow: 0 0 22px #ff66ff; }
    .tool-btn.destroy-btn { background: #e74c3c; font-size: 16px; }
    .tool-btn.destroy-btn.active { border-color: #ff0000; box-shadow: 0 0 22px #ff0000; }
    .cost-badge { position: absolute; bottom: -8px; right: -8px; background: #222; color: #ffd966; font-size: 6px; padding: 2px 4px; border-radius: 8px; white-space: nowrap; font-weight: normal; }
    .stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #eee; padding: 6px 10px; border-radius: 20px; font-size: 13px; z-index: 20; display: flex; flex-direction: row; gap: 6px; border: 1px solid #555; align-items: center; white-space: nowrap; }

    .confirm-dialog button.cancel { background: #c0392b; color: white; }

<script>
// =========================================================================
//  MODUL 1: KONFIGURATION & KONSTANTEN – KOMPLETT
// =========================================================================
let GRID_SIZE_MULTIPLIER = 1;

// === NEU: NPC-KRIEGS-COOLDOWN ===
let npcPeaceCooldown = 0;   // Verbleibende Sekunden bis zur Friedensrückkehr (0 = kein Timer aktiv)

function getConfig() {
  const baseSize = 80;
  const size = baseSize * GRID_SIZE_MULTIPLIER;
  return {
    CELL_SIZE: 30,
    GRID_WIDTH: size,
    GRID_HEIGHT: size,
    TOWER_RANGE: 5,
    NPC_BUILD_INTERVAL: 2,
    NPC_MIN_RESOURCES: 3,
    NPC_MIN_LAGER_DIST: 8,
    NPC_BUILD_DIST: 1,
    MAX_ENEMIES: 500,
    MAX_SPAWN_PER_FRAME: 100,
    COMBAT_RANGE: 3,
    CAPTURE_TIME: 10,
    CAPTURE_TIMEOUT: 5,
    NPC_START_DIST: 35,
    BUILD_TIME: 10,
    NPC_HOUSE_INTERVAL: 200,
    NPC_MAX_BUILD_DIST: 6,
    MAX_STONE_DELIVERERS_PER_TOWER: 15,
    PEACE_BUILD_DISTANCE: 10,
    PEACE_DURATION: 60,
    WAR_POPULATION_THRESHOLD: 250,
    BUILD_RESTRICTION_DURATION: 3,
    EASY_MODE_NPC_BUILD_INTERVAL: 4,
    EASY_MODE_WAR_POPULATION_THRESHOLD: 500,
    EASY_MODE_PEACE_DURATION: 120
  };
}
let CONFIG = getConfig();
let WORLD_WIDTH = CONFIG.GRID_WIDTH * CONFIG.CELL_SIZE;
let WORLD_HEIGHT = CONFIG.GRID_HEIGHT * CONFIG.CELL_SIZE;
// ===== DIALOG-FLAGS FÜR SPLIT-SCREEN =====
let dialogNeedsRotation = false;
let dialogIsUrgent = false;  // Überspringt die Nachrichten-Warteschlange


// =========================================================================
//  MODUL 2: TERRAIN-GENERIERUNG
// =========================================================================
let terrainMap = [];
function generateTerrain() {
  terrainMap = [];
  for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
    const row = [];
    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
      const val = Math.random();
      let terrainType;
      if (val < 0.50) terrainType = 0;
      else if (val < 0.75) terrainType = 1;
      else terrainType = 2;
      if (x > 0 && y > 0) {
        const left = row[x-1];
        const up = terrainMap[y-1] ? terrainMap[y-1][x] : -1;
        if (left !== -1 && up !== -1 && left === up && Math.random() < 0.7) {
          terrainType = left;
        }
      }
      row.push(terrainType);
    }
    terrainMap.push(row);
  }
  let counts = [0,0,0];
  for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
      counts[terrainMap[y][x]]++;
    }
  }
  const total = CONFIG.GRID_WIDTH * CONFIG.GRID_HEIGHT;
  if (Math.abs(counts[0]/total - 0.50) > 0.10 ||
      Math.abs(counts[1]/total - 0.25) > 0.10 ||
      Math.abs(counts[2]/total - 0.25) > 0.10) {
    generateTerrain();
  }
}
function getTerrainType(gx, gy) {
  if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
    return terrainMap[gy][gx];
  }
  return -1;
}
function getTerrainColor(type) {
  switch(type) {
    case 0: return '#c9b87a';
    case 1: return '#7a9a5a';
    case 2: return '#9aa8b5';
    default: return '#4a6b3a';
  }
}
function getTerrainEmoji(type) {
  switch(type) {
    case 0: return '🌾';
    case 1: return '🌲';
    case 2: return '🪨';
    default: return '';
  }
}
function isResourceFieldAvailable(gx, gy, type) {
  const terrain = getTerrainType(gx, gy);
  if (terrain === -1) return false;
  if (type === 'grain' && terrain === 0) return true;
  if (type === 'wood' && terrain === 1) return true;
  if (type === 'stone' && terrain === 2) return true;
  return false;
}
function countResourcesAround(gx, gy, type) {
  let count = 0;
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (isResourceFieldAvailable(nx, ny, type)) count++;
    }
  }
  return count;
}

function isCellOccupied(gx, gy, ignoreId = null, playerId = null) {
  // Alle Gebäude durchsuchen: Spieler, Spieler 2, NPC
  const allBuildings = [];
  if (playerId === null || playerId === 'player') {
    allBuildings.push(...buildings);
  }
  if (playerId === null || playerId === 'player2') {
    allBuildings.push(...player2Buildings);
  }
  if (playerId === null) {
    allBuildings.push(...npcBuildings);
  }
  return allBuildings.some(b => b.gridX === gx && b.gridY === gy && b.id !== ignoreId);
}

function isFieldClaimedByResourceNode(gx, gy) {
  for (let node of resourceNodes) { if (node.x === gx && node.y === gy) return true; }
  for (let node of player2ResourceNodes) { if (node.x === gx && node.y === gy) return true; }
  for (let node of npcResourceNodes) { if (node.x === gx && node.y === gy) return true; }
  return false;
}

// ===== NACHBARZELLEN FÜR PRODUKTIONSGEBÄUDE =====
function getNeighborCells(gx, gy, range = 1) {
  const cells = [];
  for (let dx = -range; dx <= range; dx++) {
    for (let dy = -range; dy <= range; dy++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (nx >= 0 && nx < CONFIG.GRID_WIDTH && ny >= 0 && ny < CONFIG.GRID_HEIGHT) {
        cells.push({ x: nx, y: ny });
      }
    }
  }
  return cells;
}

// ===== FELDFUNKTIONEN (unabhängig vom Spieler) =====
function getBauerFields(bauer) {
  return getNeighborCells(bauer.gridX, bauer.gridY, 1)
    .filter(c => !isCellOccupied(c.x, c.y, bauer.id, bauer.playerId) && isResourceFieldAvailable(c.x, c.y, 'grain'));
}

function getHolzfaellerFields(holz) {
  return getNeighborCells(holz.gridX, holz.gridY, 1)
    .filter(c => !isCellOccupied(c.x, c.y, holz.id, holz.playerId) && isResourceFieldAvailable(c.x, c.y, 'wood'));
}

function getSteinmetzFields(stein) {
  return getNeighborCells(stein.gridX, stein.gridY, 1)
    .filter(c => !isCellOccupied(c.x, c.y, stein.id, stein.playerId) && isResourceFieldAvailable(c.x, c.y, 'stone'));
}

    pop = cachedPlayerVillagers.length;
  } else {
    // Im Split-Modus: Durchschnitt der beiden Spielerpopulationen
    const pop1 = cachedPlayerVillagers.length;
    const pop2 = cachedPlayer2Villagers.length;
    pop = Math.floor((pop1 + pop2) / 2);
  }
  let max = 0;
  if (pop <= 24) max = Math.max(pop, 10);
  else if (pop <= 96) max = pop * 2;
  else max = pop * 3;
  return Math.min(max, CONFIG.MAX_ENEMIES);
}

// ===== UPGRADE-KOSTEN & EFFEKTE (unverändert) =====
function getUpgradeCostAndEffect(building) {
  const level = building.level;
  const costs = [{ wood: 10, stone: 10 }, { wood: 20, stone: 20 }, { wood: 40, stone: 40 }];
  const effects = {
    haus: [
      { residents: 8, desc: '8 Einwohner' },
      { residents: 10, desc: '10 Einwohner' },
      { residents: 12, desc: '12 Einwohner' }
    ],
    bauer: [
      { production: 2.0, desc: '200% Produktion' },

      { production: 3.0, desc: '300% Produktion' }
    ],
    holzfaeller: [

      { production: 2.5, desc: '250% Produktion' },
      { production: 3.0, desc: '300% Produktion' }
    ],
    steinmetz: [
      { production: 2.0, desc: '200% Produktion' },
      { production: 2.5, desc: '250% Produktion' },
      { production: 3.0, desc: '300% Produktion' }
    ],
    wachturm: [
      { fireRate: 1.25, desc: '25% erhöhte Feuerrate' },

      { fireRate: 1.5, doubleShot: true, desc: 'Doppelschuss + 50% Feuerrate' }
    ],

      { production: 2.5, desc: '250% Produktion' },
      { production: 3.0, desc: '300% Produktion' }
    ]
  };
  const idx = Math.min(level - 1, 2);
  const cost = costs[idx] || costs[2];

function canAfford(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return true;
  const free = getFreeVillagers();
  switch(type) {
    case 'haus': return resources.wood >= 3;
    case 'lager': return resources.wood >= 10 && resources.stone >= 10;
    case 'bauer': return resources.wood >= 5;
    case 'holzfaeller': return free >= 2;
    case 'steinmetz': return resources.wood >= 5 && free >= 2;
    case 'wachturm': return resources.wood >= 15;
    default: return true;
  }
}

function deductCost(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return;
  switch(type) {
    case 'haus': resources.wood -= 3; break;
    case 'lager': resources.wood -= 10; resources.stone -= 10; break;
    case 'bauer': resources.wood -= 5; break;
    case 'holzfaeller': break;
    case 'steinmetz': resources.wood -= 5; break;
    case 'wachturm': resources.wood -= 15; break;
  }
  let einwohnerKosten = 0;
  if (type === 'holzfaeller') einwohnerKosten = 2;
  else if (type === 'steinmetz') einwohnerKosten = 2;
  if (einwohnerKosten > 0) removeFreeVillagers(einwohnerKosten);
  markDirty();
}

function removeFreeVillagers(count) {
  let removed = 0;
  for (let v of villagers) {
    if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
      v.alive = false;
      const home = buildings.find(b => b.id === v.homeId);
      if (home && home.residents > 0) home.residents -= 1;
      removed++;
    }
  }
  villagers = villagers.filter(v => v.alive);
  markDirty();
}

// ===== START CONSTRUCTION (Spieler 1) – NETZWERK-FÄHIG =====
function startConstruction(type, gx, gy) {
    // ---- NETZWERK-MODUS: Client sendet Aktion an Host ----
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'build',
            player: 'player',
            buildingType: type,
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Baubefehl an Host gesendet: ${type}`, '#ffd966');
        return true;
    }

    // ---- LOKALE AUSFÜHRUNG (Host oder Singleplayer / Split) ----
    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }
    if (!canAfford(type)) {
        const typeNames = {
            'haus': 'Haus',
            'lager': 'Lager',
            'bauer': 'Bauer',
            'holzfaeller': 'Holzfäller',
            'steinmetz': 'Steinmetz',
            'wachturm': 'Wachturm'
        };
        const displayName = typeNames[type] || type;
        showTemporaryMessage(`❌ Nicht genug Ressourcen für ${displayName}!`, '#ff6b6b');
        return false;
    }
    if (type === 'wachturm' && gameStarted) {
        const hasResourceBuilding = buildings.some(b => 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && 
            !b.isUnderConstruction
        );
        if (!hasResourceBuilding) {
            showTemporaryMessage('❌ Baue zuerst eine Farm, einen Holzfäller oder einen Steinmetz!', '#ff6b6b');
            return false;
        }
    }
    if (gameStarted) {
        const isInStartPhase = buildingRestrictionActive;
        const isInPeaceMode = (gameMode === 'peace');
        const isRestrictionActive = isInStartPhase || isInPeaceMode;
        if (isRestrictionActive) {
            let tooClose = false;
            let closestDist = Infinity;

            // Prüfe gegen NPC (nur Einzelmodus)
            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                for (let nb of npcBuildings) {
                    const distToNPC = Math.hypot(gx - nb.gridX, gy - nb.gridY);
                    if (distToNPC < closestDist) closestDist = distToNPC;
                    if (distToNPC < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            // Prüfe gegen Spieler 2 Gebäude (nur Split-Modus)
            if (SPLIT_SCREEN && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            // Prüfe gegen Client-Gebäude (nur Netzwerk-Modus)
            if (NETWORK_MODE && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (tooClose) {
                if (isInStartPhase) {
                    const elapsed = (performance.now() / 1000) - gameStartTime;
                    const remaining = Math.ceil(BUILD_RESTRICTION_DURATION - elapsed);
                    const target = SPLIT_SCREEN ? 'Spieler 2' : (NETWORK_MODE ? 'Gegner' : 'NPC');
                    showTemporaryMessage(`❌ Startphase! Noch ${remaining}s (10 Raster Abstand zu ${target} nötig)`, '#ff6b6b');
                } else {
                    showTemporaryMessage(`❌ Frieden! (${Math.floor(closestDist)} Raster, mind. 10 nötig)`, '#ff6b6b');
                }
                return false;
            }
        }
    }
    deductCost(type);
    const b = new Building(nextBuildingId++, type, gx, gy, false);
    b.isUnderConstruction = true;
    b.constructionTimer = 0;
    b.constructionProgress = 0;
    b.waitingForBuilder = true;
    buildings.push(b);
    assignBuilderToConstruction(b.id);
    markDirty();

    // ---- Host sendet nach lokaler Ausführung den Snapshot ----
    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

function assignBuilderToConstructionPlayer2(buildingId) {
    const building = player2Buildings.find(b => b.id === buildingId);
    if (!building) return false;
    if (!building.isUnderConstruction) return false;
    if (building.builder) return true;

    const freeVillagers = player2Villagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
    if (freeVillagers.length < 1) {
        building.waitingForBuilder = true;
        return false;
    }

    const builder = freeVillagers[0];

    builder.isBuilding = true;
    builder.buildingTarget = building.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.hasTask = true;

function assignNpcBuilderToConstruction(buildingId) {

// ===== KORRIGIERT: updateConstruction ignoriert player2-Baustellen =====
function updateConstruction(dt) {
  // Baumeister zuweisen für Spieler 1 + NPC
  for (let b of buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      assignBuilderToConstruction(b.id);
    }
  }
  for (let b of npcBuildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      assignNpcBuilderToConstruction(b.id);
    }
  }

  // Baustellen aktualisieren (NUR Spieler 1 + NPC, IGNORIERE player2!)
  for (let key in constructionSites) {
    const site = constructionSites[key];

    // ===== WICHTIG: Player2-Baustellen IGNORIEREN =====
    if (site.playerId === 'player2') continue;

    const buildingId = parseInt(key);
    let building = buildings.find(b => b.id === buildingId);
    let isNPC = false;
    if (!building) { 
      building = npcBuildings.find(b => b.id === buildingId); 
      isNPC = true; 
    }
    if (!building) { 
      delete constructionSites[key]; 
      continue; 
    }

    const builder = isNPC ? 
      npcVillagers.find(v => v.id === site.builder && v.alive) : 
      villagers.find(v => v.id === site.builder && v.alive);

    if (!builder || !builder.alive) {
      delete constructionSites[key];
      building.builder = null;
      building.waitingForBuilder = true;
      if (isNPC) { 
        assignNpcBuilderToConstruction(building.id); 
      } else { 
        assignBuilderToConstruction(building.id); 
      }
      continue;
    }

    const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const d = dist(builder, { x: targetX, y: targetY });

    if (d < 5) {
      site.timer += dt;
      building.constructionTimer = site.timer;
      building.constructionProgress = site.timer / site.maxTimer;
      if (site.timer >= site.maxTimer) {
        building.isUnderConstruction = false;
        building.constructionProgress = 1;
        building.constructionTimer = site.maxTimer;
        building.waitingForBuilder = false;
        if (building.type === 'haus') {
          building.residents = 1;
          if (isNPC) {
            const v = new Villager(nextVillagerId++, building.id, true);
            const cx = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const cy = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            v.x = cx; v.y = cy; v.targetX = cx; v.targetY = cy;
            v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
            npcVillagers.push(v);
          } else {
            spawnVillager(building.id);
          }
        }
        building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
        building.maxProductionTime = building.baseMaxProductionTime;
        building.baseFireRate = 1.0;
        if (building.type === 'bauer') building.productionType = 'grain';
        else if (building.type === 'holzfaeller') building.productionType = 'wood';
        else if (building.type === 'steinmetz') building.productionType = 'stone';
        builder.isBuilding = false;
        builder.buildingTarget = null;
        builder.state = 'idle';
        builder.hasTask = false;
        delete constructionSites[key];
        markDirty();
      }
    } else {
      builder.targetX = targetX;
      builder.targetY = targetY;
    }
  }
}

// ===== UPGRADE BUILDING (Spieler 1) – NETZWERK-FÄHIG =====
function upgradeBuilding(building) {
    // ---- NETZWERK-MODUS: Client sendet Aktion an Host ----
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'upgrade',
            player: 'player',
            buildingId: building.id
        });
        showTemporaryMessage(`📤 Upgrade-Befehl an Host gesendet (ID: ${building.id})`, '#ffd966');
        return true;
    }

    // ---- LOKALE AUSFÜHRUNG (Host oder Singleplayer / Split) ----
    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
    resources.wood -= cost.wood;
    resources.stone -= cost.stone;

    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) :
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of resourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
            showTemporaryMessage(`⬆️ Turm Reichweite auf ${building.range} erhöht!`, '#ffd966');
        }
        showTemporaryMessage(`⬆️ Turm Kapazität auf ${building.maxStoneAmmo} erhöht!`, '#ffd966');
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    }

    markDirty();

    // ---- Host sendet nach lokaler Ausführung den Snapshot ----
    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

function destroyBuilding(gx, gy) {
    // ---- NETZWERK-MODUS: Client sendet Aktion an Host ----
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'destroy',
            player: 'player',
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Abriss-Befehl an Host gesendet (${gx},${gy})`, '#ffd966');
        return true;
    }

    // ---- LOKALE AUSFÜHRUNG (Host oder Singleplayer / Split) ----
    const idx = buildings.findIndex(b => b.gridX === gx && b.gridY === gy);
    if (idx === -1) return false;
    const building = buildings[idx];
    const captureKey = 'capture_' + building.id;
    if (captureTimers[captureKey]) {
        delete captureTimers[captureKey];
    }
    if (building.type === 'wachturm') {
        for (let v of villagers) {
            if (v.alive && v.towerTarget === building) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
                v.isDeliveringStone = false;
                v.carrying = null;
                v.towerTarget = null;
                v.stoneToDeliver = 0;
                v.hasReservedStone = false;
                v.state = 'idle';
                v.hasTask = false;
            }
        }
    }
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  building.type === 'steinmetz' ? getSteinmetzFields(building) : [];
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    resourceNodes = resourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));
    if (building.type === 'haus') {
        const residents = villagers.filter(v => v.alive && v.homeId === building.id);
        for (let v of residents) {
            if (v.hasReservedStone && v.towerTarget) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') { resources.stone += (v.stoneToDeliver || 0); }
                v.hasReservedStone = false;
            }
            v.alive = false;
        }
        villagers = villagers.filter(v => v.alive);
    }
    buildings.splice(idx, 1);
    markDirty();

    // ---- Host sendet nach lokaler Ausführung den Snapshot ----
    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== DELTA-SNAPSHOT ERZEUGEN (NUR ÄNDERUNGEN) =====

function createDeltaSnapshot() {
    const now = Date.now();
    const delta = {
        timestamp: now,
        buildings: [],
        resources: null,
        enemies: [],
        removedBuildings: [],
        removedEnemies: []
    };

    // Ressourcen (nur bei Änderung)
    const newRes = {
        grain: Math.floor(resources.grain),
        wood: Math.floor(resources.wood),
        stone: Math.floor(resources.stone),
        player2Grain: Math.floor(player2Resources.grain),
        player2Wood: Math.floor(player2Resources.wood),
        player2Stone: Math.floor(player2Resources.stone)
    };

    if (lastDeltaSnapshot.resources) {
        const old = lastDeltaSnapshot.resources;
        if (newRes.grain !== old.grain || newRes.wood !== old.wood || newRes.stone !== old.stone ||
            newRes.player2Grain !== old.player2Grain || newRes.player2Wood !== old.player2Wood ||
            newRes.player2Stone !== old.player2Stone) {
            delta.resources = newRes;
        }
    } else {
        delta.resources = newRes;
    }

    // Gebäude (Spieler 1 + Spieler 2)
    const allBuildings = [...buildings, ...player2Buildings];
    const lastBuildings = lastDeltaSnapshot.buildings || [];
    const lastMap = new Map(lastBuildings.map(b => [b.id, b]));

    for (let b of allBuildings) {
        const last = lastMap.get(b.id);
        if (!last) {
            delta.buildings.push(serializeBuilding(b));
        } else {
            const ser = serializeBuilding(b);
            // Relevante Felder prüfen
            if (ser.level !== last.level || ser.residents !== last.residents ||
                ser.stoneAmmo !== last.stoneAmmo || ser.isUnderConstruction !== last.isUnderConstruction ||
                ser.constructionProgress !== last.constructionProgress ||
                ser.captureProgress !== last.captureProgress ||
                ser.beingCaptured !== last.beingCaptured || ser.capturedBy !== last.capturedBy) {
                delta.buildings.push(ser);
            }
        }
    }

    // Gelöschte Gebäude
    const currentIds = new Set(allBuildings.map(b => b.id));
    for (let last of lastBuildings) {
        if (!currentIds.has(last.id)) {
            delta.removedBuildings.push(last.id);
        }
    }

    // Feinde
    const aliveEnemies = enemies.filter(e => e.alive);
    const lastEnemies = lastDeltaSnapshot.enemies || [];
    const lastEnemyMap = new Map(lastEnemies.map(e => [e.id, e]));

    for (let e of aliveEnemies) {
        const last = lastEnemyMap.get(e.id);
        if (!last) {
            delta.enemies.push({ id: e.id, x: e.x, y: e.y, alive: e.alive, isSuper: e.isSuper, hits: e.hits, killCount: e.killCount || 0 });
        } else if (last.x !== e.x || last.y !== e.y || last.hits !== e.hits) {
            delta.enemies.push({ id: e.id, x: e.x, y: e.y, alive: e.alive, isSuper: e.isSuper, hits: e.hits, killCount: e.killCount || 0 });
        }
    }

    const currentEnemyIds = new Set(aliveEnemies.map(e => e.id));
    for (let last of lastEnemies) {
        if (!currentEnemyIds.has(last.id)) {
            delta.removedEnemies.push(last.id);
        }
    }

    // Snapshot für nächsten Vergleich speichern
    lastDeltaSnapshot = {
        timestamp: now,
        buildings: allBuildings.map(b => serializeBuilding(b)),
        resources: newRes,
        enemies: aliveEnemies.map(e => ({ id: e.id, x: e.x, y: e.y, alive: e.alive, isSuper: e.isSuper, hits: e.hits, killCount: e.killCount || 0 }))
    };

    return delta;
}


// ===== DELTA-SNAPSHOT (NUR ÄNDERUNGEN) =====
let lastDeltaSnapshot = {
    timestamp: 0,
    buildings: [],
    resources: null,
    enemies: [],
    removedBuildings: [],
    removedEnemies: []
};
let isSending = false;
let sendQueue = [];
let sendDebounceTimer = null;
const SEND_DEBOUNCE_MS = 100;
const MAX_QUEUE_SIZE = 3;

function sendDeltaSnapshot() {
    if (!IS_HOST || !networkConn) return;

    // Debouncing: Bei jedem Aufruf Timer zurücksetzen
    if (sendDebounceTimer) {
        clearTimeout(sendDebounceTimer);
        sendDebounceTimer = null;
    }

    sendDebounceTimer = setTimeout(() => {
        sendDebounceTimer = null;
        doSendDeltaSnapshot();
    }, SEND_DEBOUNCE_MS);
}

function doSendDeltaSnapshot() {
    if (isSending) {
        // Queue begrenzen: nur die neuesten Einträge behalten
        if (sendQueue.length < MAX_QUEUE_SIZE) {
            sendQueue.push(Date.now());
        } else {
            // Ältesten entfernen, neuesten hinzufügen
            sendQueue.shift();
            sendQueue.push(Date.now());
        }
        return;
    }

    isSending = true;

    try {
        const delta = createDeltaSnapshot();

        // Prüfen, ob es überhaupt Änderungen gibt
        const hasChanges = delta.buildings.length > 0 ||
                           delta.removedBuildings.length > 0 ||
                           delta.enemies.length > 0 ||
                           delta.removedEnemies.length > 0 ||
                           delta.resources !== null;

        if (!hasChanges) {
            isSending = false;
            processQueue();
            return;
        }

        networkConn.send(JSON.stringify({ type: 'delta_snapshot', data: delta }));

        // Nach dem Senden kurz warten, dann Queue abarbeiten
        setTimeout(() => {
            isSending = false;
            processQueue();
        }, 200);
    } catch (e) {
        isSending = false;
        processQueue();
        console.warn('Fehler beim Senden des Deltas:', e);
    }
}

function processQueue() {
    if (sendQueue.length === 0) return;
    // Nur den neuesten Eintrag verarbeiten, alte verwerfen
    const latest = sendQueue[sendQueue.length - 1];
    sendQueue = [];
    // Nur wenn der Eintrag nicht älter als 2 Sekunden ist
    if (Date.now() - latest < 2000) {
        doSendDeltaSnapshot();
    }
}


function applyDeltaSnapshot(data) {
    if (IS_HOST) return;
    if (!data) return;

    console.log('📨 [applyDeltaSnapshot] Empfange Delta-Snapshot:', data);

    const hasPendingActions = pendingNetworkActions.length > 0;
    const hasLocalConstruction = player2Buildings.some(b => b.isUnderConstruction);

    // ===== 1. RESSOURCEN =====
    if (data.resources && pendingNetworkActions.length === 0) {
        resources.grain = data.resources.grain;
        resources.wood = data.resources.wood;
        resources.stone = data.resources.stone;
        player2Resources.grain = data.resources.player2Grain;
        player2Resources.wood = data.resources.player2Wood;
        player2Resources.stone = data.resources.player2Stone;
    }

    // ===== 2. NEUE/GEÄNDERTE GEBÄUDE =====
    for (let bData of data.buildings || []) {
        // ---- Spieler 1 Gebäude: IMMER aktualisieren ----
        if (bData.playerId === 'player' || bData.playerId === null) {
            let existing = buildings.find(b => b.id === bData.id);
            if (!existing) {
                buildings.push(deserializeBuilding(bData));
                console.log('📨 [applyDeltaSnapshot] Neues Spieler1 Gebäude:', bData.id);
            } else {
                Object.assign(existing, bData);
                existing.residents = bData.residents;
                existing.level = bData.level;
                existing.stoneAmmo = bData.stoneAmmo;
                existing.isUnderConstruction = bData.isUnderConstruction;
                existing.constructionProgress = bData.constructionProgress;
                existing.captureProgress = bData.captureProgress;
                existing.beingCaptured = bData.beingCaptured;
                existing.capturedBy = bData.capturedBy;
            }
            continue;
        }

        // ---- Player2 Gebäude: NUR aktualisieren, wenn Client NICHT lokal baut ----
        if (bData.playerId === 'player2') {
            if (!hasPendingActions && !hasLocalConstruction) {
                let existing = player2Buildings.find(b => b.id === bData.id);
                if (!existing) {
                    player2Buildings.push(deserializeBuilding(bData));
                    console.log('📨 [applyDeltaSnapshot] Neues Player2 Gebäude vom Host:', bData.id);
                } else {
                    Object.assign(existing, bData);
                    existing.residents = bData.residents;
                    existing.level = bData.level;
                    existing.stoneAmmo = bData.stoneAmmo;
                    existing.isUnderConstruction = bData.isUnderConstruction;
                    existing.constructionProgress = bData.constructionProgress;
                    existing.captureProgress = bData.captureProgress;
                    existing.beingCaptured = bData.beingCaptured;
                    existing.capturedBy = bData.capturedBy;
                    console.log('📨 [applyDeltaSnapshot] Player2 Gebäude aktualisiert:', bData.id);
                }
            } else {
                const exists = player2Buildings.some(local => local.id === bData.id);
                if (!exists) {
                    player2Buildings.push(deserializeBuilding(bData));
                    console.log('📨 [applyDeltaSnapshot] Player2 Gebäude vom Host hinzugefügt (lokal nicht vorhanden):', bData.id);
                }
            }
        }
    }

    // ===== 3. GELÖSCHTE GEBÄUDE =====
    for (let id of data.removedBuildings || []) {
        let idx = buildings.findIndex(b => b.id === id);
        if (idx !== -1) { 
            buildings.splice(idx, 1); 
            console.log('📨 [applyDeltaSnapshot] Spieler1 Gebäude gelöscht:', id);
            continue; 
        }
        
        if (!hasPendingActions && !hasLocalConstruction) {
            idx = player2Buildings.findIndex(b => b.id === id);
            if (idx !== -1) {
                player2Buildings.splice(idx, 1);
                console.log('📨 [applyDeltaSnapshot] Player2 Gebäude gelöscht:', id);
            }
        }
    }

    // ===== 4. EINWOHNER (Spieler 1) =====
    // ★★★ Spieler 1 Einwohner: Ziele vom Snapshot, Positionen erhalten ★★★
    if (data.villagers && data.villagers.length > 0) {
        const snapshotVillagers = data.villagers
            .filter(v => v.playerId === 'player' || v.playerId === null)
            .map(v => deserializeVillager(v));

        const existingIds = new Set();
        for (let sv of snapshotVillagers) {
            const existing = villagers.find(v => v.id === sv.id);
            if (existing) {
                // ★★★ Position erhalten, Ziele aktualisieren ★★★
                existing.targetX = sv.x;
                existing.targetY = sv.y;
                existing.carrying = sv.carrying;
                existing.state = sv.state;
                existing.alive = sv.alive;
                existing.hasTask = sv.hasTask;
                existing.isAttacking = sv.isAttacking;
                existing.attackTarget = sv.attackTarget;
                existing.isBuilding = sv.isBuilding;
                existing.buildingTarget = sv.buildingTarget;
                existing.isDeliveringStone = sv.isDeliveringStone;
                existing.stoneToDeliver = sv.stoneToDeliver;
                existing.towerTarget = sv.towerTarget;
                existing.hasReservedStone = sv.hasReservedStone;
                existing.combatCooldown = sv.combatCooldown;
                existing.resourceTarget = sv.resourceTarget;
                // Position NICHT überschreiben!
                existingIds.add(sv.id);
            } else {
                // Neuer Einwohner: Position und Ziel setzen
                villagers.push(sv);
                existingIds.add(sv.id);
            }
        }

        // Gelöschte Einwohner entfernen (nur Spieler 1)
        villagers = villagers.filter(v => {
            if (v.playerId === 'player' || v.playerId === null) {
                return existingIds.has(v.id);
            }
            return true; // Player2 Einwohner bleiben erhalten
        });

        console.log('📨 [applyDeltaSnapshot] Spieler1 Einwohner aktualisiert:', snapshotVillagers.length);
    }

    // ===== 5. GELÖSCHTE EINWOHNER (Spieler 1) =====
    if (data.removedVillagers && data.removedVillagers.length > 0) {
        const removeSet = new Set(data.removedVillagers);
        villagers = villagers.filter(v => {
            if (v.playerId === 'player' || v.playerId === null) {
                return !removeSet.has(v.id);
            }
            return true;
        });
        console.log('📨 [applyDeltaSnapshot] Spieler1 Einwohner gelöscht:', data.removedVillagers.length);
    }

    // ===== 6. NEUE/GEÄNDERTE FEINDE =====
    for (let eData of data.enemies || []) {
        let existing = enemies.find(e => e.id === eData.id);
        if (!existing) {
            const e = new Enemy(eData.id, eData.x, eData.y, eData.isSuper);
            e.hits = eData.hits || 0;
            e.killCount = eData.killCount || 0;
            enemies.push(e);
        } else {
            existing.x = eData.x;
            existing.y = eData.y;
            existing.hits = eData.hits || 0;
        }
    }

    // ===== 7. GELÖSCHTE FEINDE =====
    for (let id of data.removedEnemies || []) {
        const idx = enemies.findIndex(e => e.id === id);
        if (idx !== -1) enemies.splice(idx, 1);
    }

    // ===== 8. CACHES AKTUALISIEREN =====
    markDirty();
    refreshPlayerVillagerCache();
    refreshPlayer2VillagerCache();
    refreshLagerCache();
    renderDirty = true;

    console.log('📨 [applyDeltaSnapshot] Snapshot erfolgreich angewendet!');
}

function canAffordPlayer2(type) {
    if (!gameStarted && (type === 'lager' || type === 'haus')) return true;
    const free = getFreeVillagers('player2');
    switch(type) {
        case 'haus': return player2Resources.wood >= 3;
        case 'lager': return player2Resources.wood >= 10 && player2Resources.stone >= 10;
        case 'bauer': return player2Resources.wood >= 5;
        case 'holzfaeller': return free >= 2;
        case 'steinmetz': return player2Resources.wood >= 5 && free >= 2;
        case 'wachturm': return player2Resources.wood >= 15;
        default: return true;
    }
}

function deductCostPlayer2(type) {
    if (!gameStarted && (type === 'lager' || type === 'haus')) return;
    switch(type) {
        case 'haus': player2Resources.wood -= 3; break;
        case 'lager': player2Resources.wood -= 10; player2Resources.stone -= 10; break;
        case 'bauer': player2Resources.wood -= 5; break;
        case 'holzfaeller': break;
        case 'steinmetz': player2Resources.wood -= 5; break;
        case 'wachturm': player2Resources.wood -= 15; break;
    }
    let einwohnerKosten = 0;
    if (type === 'holzfaeller') einwohnerKosten = 2;
    else if (type === 'steinmetz') einwohnerKosten = 2;
    if (einwohnerKosten > 0) removeFreeVillagersPlayer2(einwohnerKosten);
    markPlayer2CacheDirty();
    markDirty();
}

function removeFreeVillagersPlayer2(count) {
    let removed = 0;
    for (let v of player2Villagers) {
        if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
            v.alive = false;
            const home = player2Buildings.find(b => b.id === v.homeId);
            if (home && home.residents > 0) home.residents -= 1;
            removed++;
        }
    }
    player2Villagers = player2Villagers.filter(v => v.alive);
    markPlayer2CacheDirty();
    markDirty();
}

function startConstructionPlayer2(type, gx, gy, skipNetwork = false) {
    // ===== 1. PRÜFUNGEN (für alle Modi) =====
    if (gameStarted) {
        const isInStartPhase = buildingRestrictionActive;
        const isInPeaceMode = (gameMode === 'peace');
        const isRestrictionActive = isInStartPhase || isInPeaceMode;
        if (isRestrictionActive) {
            let tooClose = false;
            let closestDist = Infinity;
            for (let b of buildings) {
                const d = Math.hypot(gx - b.gridX, gy - b.gridY);
                if (d < closestDist) closestDist = d;
                if (d < 10) {
                    tooClose = true;
                    break;
                }
            }
            if (tooClose) {
                if (isInStartPhase) {
                    const elapsed = (performance.now() / 1000) - gameStartTime;
                    const remaining = Math.ceil(BUILD_RESTRICTION_DURATION - elapsed);
                    showTemporaryMessage(`❌ Startphase! Noch ${remaining}s (10 Raster Abstand nötig)`, '#ff6b6b');
                } else {
                    showTemporaryMessage(`❌ Frieden! (${Math.floor(closestDist)} Raster, mind. 10 nötig)`, '#ff6b6b');
                }
                return false;
            }
        }
    }

    if (isCellOccupied(gx, gy, null, 'player2')) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    if (!canAffordPlayer2(type)) {
        const typeNames = {
            'haus': 'Haus',
            'lager': 'Lager',
            'bauer': 'Bauer',
            'holzfaeller': 'Holzfäller',
            'steinmetz': 'Steinmetz',
            'wachturm': 'Wachturm'
        };
        const displayName = typeNames[type] || type;
        showTemporaryMessage(`❌ Nicht genug Ressourcen für ${displayName}!`, '#ff6b6b');
        return false;
    }

    if (type === 'wachturm' && gameStarted) {
        const hasResourceBuilding = player2Buildings.some(b => 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && 
            !b.isUnderConstruction
        );
        if (!hasResourceBuilding) {
            showTemporaryMessage('❌ Baue zuerst eine Farm, einen Holzfäller oder einen Steinmetz!', '#ff6b6b');
            return false;
        }
    }

    // ===== 2. NETZWERK: Client baut lokal UND sendet an Host =====
    if (!skipNetwork && NETWORK_MODE && !IS_HOST) {
        // ★★★ ERST lokal bauen (mit skipNetwork = true) ★★★
        startConstructionPlayer2(type, gx, gy, true);
        
        // ★★★ DANN Aktion an Host senden ★★★
        const action = {
            type: 'build_player2',
            player: 'player2',
            buildingType: type,
            gridX: gx,
            gridY: gy,
            resources: { 
                grain: player2Resources.grain,
                wood: player2Resources.wood,
                stone: player2Resources.stone
            },
            buildingId: player2NextBuildingId - 1
        };
        window.sendNetworkAction(action);
        showTemporaryMessage(`📤 Baubefehl (Player2) an Host gesendet: ${type}`, '#ffd966', true);
        return true;
    }

    // ===== 3. LOKALE AUSFÜHRUNG =====
    // Kosten abziehen (NUR bei normalen Gebäuden, Startgebäude sind kostenlos)
    const isActualStartBuilding = !gameStarted && (type === 'lager' || type === 'haus');
    if (!isActualStartBuilding) {
        deductCostPlayer2(type);
    }

    let newId;
    if (NETWORK_MODE && IS_HOST && window._pendingClientBuildingId) {
        newId = window._pendingClientBuildingId;
        window._pendingClientBuildingId = null;
    } else {
        newId = player2NextBuildingId++;
    }

    const b = new Building(newId, type, gx, gy, false, 'player2');
    
    // ===== STARTGEBÄUDE: SOFORT FERTIG (NUR wenn !gameStarted) =====
    if (isActualStartBuilding) {
        b.isUnderConstruction = false;
        b.constructionProgress = 1;
        b.constructionTimer = CONFIG.BUILD_TIME;
        
        if (type === 'haus') {
            b.residents = 6;
            b.maxResidents = 6;
            b.maxProductionTime = 30;
            b.baseMaxProductionTime = 30;
        }
        
        player2Buildings.push(b);
        
        // Einwohner spawnen
        if (type === 'haus') {
            const hasAnyVillager = player2Villagers.some(v => v.alive);
            if (!hasAnyVillager) {
                for (let i = 0; i < 6; i++) {
                    const v = new Villager(player2NextVillagerId++, b.id, false, 'player2');
                    const cx = b.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + (Math.random() - 0.5) * 10;
                    const cy = b.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + (Math.random() - 0.5) * 10;
                    v.x = cx;
                    v.y = cy;
                    v.targetX = cx;
                    v.targetY = cy;
                    player2Villagers.push(v);
                }
            }
        }
        
        markDirty();
        if (NETWORK_MODE && IS_HOST) {
            sendDeltaSnapshot();
        }
        showTemporaryMessage(`✅ ${type} platziert (sofort fertig)!`, '#2ecc71', true);
        return true;
    }
    
    // ===== NORMALE GEBÄUDE: Baustelle =====
    b.isUnderConstruction = true;
    b.constructionTimer = 0;
    b.constructionProgress = 0;
    b.waitingForBuilder = true;
    player2Buildings.push(b);

    // ===== 4. HOST: Player2-Einwohner sicherstellen =====
    if (NETWORK_MODE && IS_HOST) {
        const hasAnyVillager = player2Villagers.some(v => v.alive);
        
        if (!hasAnyVillager && type === 'haus') {
            b.residents = 6;
            for (let i = 0; i < 6; i++) {
                const v = new Villager(player2NextVillagerId++, b.id, false, 'player2');
                const cx = b.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + (Math.random() - 0.5) * 10;
                const cy = b.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 + (Math.random() - 0.5) * 10;
                v.x = cx;
                v.y = cy;
                v.targetX = cx;
                v.targetY = cy;
                player2Villagers.push(v);
            }
            assignBuilderToConstructionPlayer2(b.id);
        } else {
            const assigned = assignBuilderToConstructionPlayer2(b.id);
            if (!assigned) {
                b.waitingForBuilder = true;
            }
        }
    } else {
        assignBuilderToConstructionPlayer2(b.id);
    }

    markDirty();

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    showTemporaryMessage(`🔨 ${type} wird gebaut... (10s)`, '#ffd966', true);
    return true;
}

// ===== upgradeBuildingPlayer2 - LOKAL AUSFÜHREN + SENDEN (NUR NETZWERK) =====
function upgradeBuildingPlayer2(building) {
    // ===== 1. PRÜFUNGEN =====
    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (player2Resources.wood < cost.wood || player2Resources.stone < cost.stone) {
        showTemporaryMessage('❌ Nicht genug Ressourcen für Upgrade!', '#ff6b6b');
        return false;
    }

    // ===== 2. KOSTEN ABZIEHEN (LOKAL) =====
    player2Resources.wood -= cost.wood;
    player2Resources.stone -= cost.stone;

    // ===== 3. UPGRADE DURCHFÜHREN (LOKAL) =====
    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) :
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of player2ResourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
            showTemporaryMessage(`⬆️ Turm Reichweite auf ${building.range} erhöht!`, '#ffd966');
        }
        showTemporaryMessage(`⬆️ Turm Kapazität auf ${building.maxStoneAmmo} erhöht!`, '#ffd966');
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    }

    markDirty();

    // ===== 4. NETZWERK: AKTION AN HOST SENDEN (NUR Client im Netzwerk-Modus) =====
    if (NETWORK_MODE && !IS_HOST) {
        const action = {
            type: 'upgrade_player2',
            player: 'player2',
            buildingId: building.id,
            resources: { ...player2Resources }
        };
        window.sendNetworkAction(action);
        console.log('📤 Client: Upgrade-Befehl (Player2) an Host gesendet:', building.id);
        showTemporaryMessage(`📤 Upgrade-Befehl (Player2) an Host gesendet (ID: ${building.id})`, '#ffd966', true);
    }

    // ===== 5. HOST: SNAPSHOT SENDEN =====
    if (NETWORK_MODE && IS_HOST) {
        window.sendDeltaSnapshot();
    }

    showTemporaryMessage(`⬆️ Upgrade auf Stufe ${building.level} erfolgreich!`, '#ffd966', true);
    return true;
}

// ===== destroyBuildingPlayer2 - LOKAL AUSFÜHREN + SENDEN (NUR NETZWERK) =====
function destroyBuildingPlayer2(gx, gy) {
    // ===== 1. GEBÄUDE FINDEN =====
    const idx = player2Buildings.findIndex(b => b.gridX === gx && b.gridY === gy);
    if (idx === -1) {
        showTemporaryMessage('❌ Kein Gebäude zum Abreissen gefunden!', '#ff6b6b');
        return false;
    }

    const building = player2Buildings[idx];
    const captureKey = 'capture_' + building.id;
    if (captureTimers[captureKey]) {
        delete captureTimers[captureKey];
    }

    // ===== 2. GEBÄUDE ABREISSEN (LOKAL) =====
    // Turm-Steine zurückgeben
    if (building.type === 'wachturm') {
        for (let v of player2Villagers) {
            if (v.alive && v.towerTarget === building) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') player2Resources.stone += (v.stoneToDeliver || 0);
                v.isDeliveringStone = false;
                v.carrying = null;
                v.towerTarget = null;
                v.stoneToDeliver = 0;
                v.hasReservedStone = false;
                v.state = 'idle';
                v.hasTask = false;
            }
        }
    }

    // Ressourcen-Nodes entfernen
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  building.type === 'steinmetz' ? getSteinmetzFields(building) : [];
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    player2ResourceNodes = player2ResourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));

    // Haus-Bewohner töten
    if (building.type === 'haus') {
        const residents = player2Villagers.filter(v => v.alive && v.homeId === building.id);
        for (let v of residents) {
            if (v.hasReservedStone && v.towerTarget) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') { player2Resources.stone += (v.stoneToDeliver || 0); }
                v.hasReservedStone = false;
            }
            v.alive = false;
        }
        player2Villagers = player2Villagers.filter(v => v.alive);
    }

    player2Buildings.splice(idx, 1);
    markPlayer2CacheDirty();
    markDirty();

    // ===== 3. NETZWERK: AKTION AN HOST SENDEN (NUR Client im Netzwerk-Modus) =====
    if (NETWORK_MODE && !IS_HOST) {
        const action = {
            type: 'destroy_player2',
            player: 'player2',
            gridX: gx,
            gridY: gy,
            resources: { ...player2Resources }
        };
        window.sendNetworkAction(action);
        console.log('📤 Client: Abriss-Befehl (Player2) an Host gesendet:', gx, gy);
        showTemporaryMessage(`📤 Abriss-Befehl (Player2) an Host gesendet (${gx},${gy})`, '#ffd966', true);
    }

    // ===== 4. HOST: SNAPSHOT SENDEN =====
    if (NETWORK_MODE && IS_HOST) {
        window.sendDeltaSnapshot();
    }

    showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b', true);
    return true;
}

// ===== assignBuilderToConstructionPlayer2 =====
function assignBuilderToConstructionPlayer2(buildingId) {
    const building = player2Buildings.find(b => b.id === buildingId);
    if (!building) return false;
    if (!building.isUnderConstruction) return false;
    if (building.builder) return true;

    const freeVillagers = player2Villagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
    if (freeVillagers.length < 1) {
        building.waitingForBuilder = true;
        return false;
    }

    const builder = freeVillagers[0];

    builder.isBuilding = true;
    builder.buildingTarget = building.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.hasTask = true;

    const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    builder.targetX = targetX;
    builder.targetY = targetY;

    building.builder = builder.id;
    building.waitingForBuilder = false;
    constructionSites[building.id] = { 
        timer: 0, 
        maxTimer: CONFIG.BUILD_TIME, 
        builder: builder.id, 
        isNPC: false, 
        playerId: 'player2' 
    };

    markDirty();
    return true;
}

// ===== updateConstructionPlayer2 =====
function updateConstructionPlayer2(dt) {
    // Baumeister zuweisen für Player2
    for (let b of player2Buildings) {
        if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
            assignBuilderToConstructionPlayer2(b.id);
        }
    }

    // Baustellen aktualisieren (nur Player2)
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.playerId !== 'player2') continue;

        const buildingId = parseInt(key);
        const building = player2Buildings.find(b => b.id === buildingId);
        if (!building) {
            delete constructionSites[key];
            continue;
        }

        const builder = player2Villagers.find(v => v.id === site.builder && v.alive);
        if (!builder || !builder.alive) {
            delete constructionSites[key];
            building.builder = null;
            building.waitingForBuilder = true;
            assignBuilderToConstructionPlayer2(building.id);
            continue;
        }

        const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;

        builder.targetX = targetX;
        builder.targetY = targetY;
        builder.state = 'building';
        builder.hasTask = true;

        const d = Math.hypot(builder.x - targetX, builder.y - targetY);

        if (d < 5) {
            site.timer += dt;
            building.constructionTimer = site.timer;
            building.constructionProgress = Math.min(1, site.timer / site.maxTimer);

            if (site.timer >= site.maxTimer) {
                // ===== GEBÄUDE FERTIGSTELLEN =====
                building.isUnderConstruction = false;
                building.constructionProgress = 1;
                building.constructionTimer = site.maxTimer;
                building.waitingForBuilder = false;

                if (building.type === 'haus') {
                    building.residents = 1;
                    spawnVillagerPlayer2(building.id);
                }

                building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
                building.maxProductionTime = building.baseMaxProductionTime;
                building.baseFireRate = 1.0;
                if (building.type === 'bauer') {
                    building.productionType = 'grain';
                } else if (building.type === 'holzfaeller') {
                    building.productionType = 'wood';
                } else if (building.type === 'steinmetz') {
                    building.productionType = 'stone';
                }

                builder.isBuilding = false;
                builder.buildingTarget = null;
                builder.state = 'idle';
                builder.hasTask = false;
                delete constructionSites[key];
                markDirty();

                // ===== HOST: Snapshot nach Fertigstellung senden =====
                if (NETWORK_MODE && IS_HOST) {
                    sendDeltaSnapshot();
                }
            }
        }
    }
}

function updateVillagersClientOnly(dt) {
    // ===== NUR FÜR CLIENT: Spieler1 Einwohner lokal bewegen (für flüssige Anzeige) =====
    // Die echte Logik läuft auf dem Host, aber wir bewegen sie hier für flüssige Animation
    
    if (!NETWORK_MODE || IS_HOST) return;
    
    // Nur Einwohner bewegen, die vom Host kommen (playerId === 'player')
    const clientVillagers = villagers.filter(v => v.alive && (v.playerId === 'player' || v.playerId === null));
    
    for (let v of clientVillagers) {
        // Wenn kein Ziel gesetzt ist, nichts tun
        if (!v.targetX && !v.targetY) continue;
        
        // Bewege zum Ziel (interpoliert)
        const dx = v.targetX - v.x;
        const dy = v.targetY - v.y;
        const distance = Math.hypot(dx, dy);
        
        if (distance > 0.5) {
            // Langsamere Geschwindigkeit für flüssige Bewegung (nicht zu schnell)
            const speed = v.speed || 65;
            const step = Math.min(distance, speed * dt * 0.8);
            v.x += (dx / distance) * step;
            v.y += (dy / distance) * step;
        } else {
            // Bei Zielankunft: genau auf Ziel setzen
            v.x = v.targetX;
            v.y = v.targetY;
        }
    }
}

// ===== CACHE-MAPS NEU AUFBAUEN =====
function rebuildResourceMaps() {
    // Spieler 1
    resourceNodeMap = new Map(resourceNodes.map(n => [n.id, n]));
    resourceNodeByPosition = new Map(resourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));

    // Spieler 2
    player2ResourceNodeMap = new Map(player2ResourceNodes.map(n => [n.id, n]));
    player2ResourceNodeByPosition = new Map(player2ResourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));

    // NPC
    npcResourceNodeMap = new Map(npcResourceNodes.map(n => [n.id, n]));
    npcResourceNodeByPosition = new Map(npcResourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));
}

// ===== SPIELER 1 RESSOURCEN-NODES AKTUALISIEREN =====
function updatePlayerResourceNodes(dt) {
    // Timer für existierende Nodes laufen lassen (nur wenn nicht ready)
    for (let i = resourceNodes.length - 1; i >= 0; i--) {
        const node = resourceNodes[i];
        if (node.ready) continue;
        node.timer += dt;
        if (node.timer >= node.maxTimer) {
            node.ready = true;
            node.timer = node.maxTimer;
        }
    }

    // Neue Nodes für Produktionsgebäude erstellen
    const resourceBuildings = buildings.filter(b => !b.isUnderConstruction && 
        (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz'));

    for (let b of resourceBuildings) {
        const fields = b.type === 'bauer' ? getBauerFields(b) :
                      b.type === 'holzfaeller' ? getHolzfaellerFields(b) :
                      getSteinmetzFields(b);
        const type = b.productionType;

        // ===== MAXIMALE NODES = ANZAHL VERFÜGBARER FELDER (max. 8) =====
        const maxNodes = fields.length; // kann 0..8 sein

        // Nur Nodes auf den Feldern dieses Gebäudes zählen
        const fieldSet = new Set(fields.map(f => `${f.x},${f.y}`));
        const existingNodesOnFields = resourceNodes.filter(n => 
            n.type === type && fieldSet.has(`${n.x},${n.y}`)
        );
        const existingCount = existingNodesOnFields.length;

        // Felder ohne Node
        const freeFields = fields.filter(f => 
            !resourceNodes.some(n => n.x === f.x && n.y === f.y && n.type === type)
        );

        // So viele neue Nodes erstellen, bis alle Felder belegt sind
        const nodesToCreate = Math.min(maxNodes - existingCount, freeFields.length);
        for (let i = 0; i < nodesToCreate; i++) {
            const f = freeFields[i];
            const key = `${f.x},${f.y},${type}`;
            const existing = resourceNodeByPosition.get(key);
            if (existing) continue;

            const newNode = {
                id: nextResourceId++,
                x: f.x,
                y: f.y,
                type: type,
                timer: 0,
                maxTimer: b.maxProductionTime,
                ready: false,
                claimedBy: null,
                isNPC: false
            };
            resourceNodes.push(newNode);
            resourceNodeMap.set(newNode.id, newNode);
            resourceNodeByPosition.set(key, newNode);
        }
    }

    refreshPlayerResourceCache();
    markDirty();
}

function spawnVillager(homeId) {
    const home = buildings.find(b => b.id === homeId);
    if (!home) return null;
    const v = new Villager(nextVillagerId++, homeId, false);
    const cx = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const cy = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    v.x = cx;
    v.y = cy;
    v.targetX = cx;
    v.targetY = cy;
    villagers.push(v);
    // === CACHE INVALIDIEREN (Neugeborener Einwohner) ===
    markPlayerCacheDirty();
    markDirty();
    return v;
}

function killVillager(v) {
    v.alive = false;
    if (v.resourceTarget) {
        const node = resourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.claimedBy === v.id) node.claimedBy = null;
    }
    if (v.hasReservedStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        if (v.carrying === 'stone' || v.isDeliveringStone) {
            resources.stone += (v.stoneToDeliver || 0);
        }
        v.hasReservedStone = false;
        v.towerTarget = null;
        v.stoneToDeliver = 0;
    }
    if (v.carrying === 'stone') {
        resources.stone += 1;
        v.carrying = null;
    }
    const home = buildings.find(b => b.id === v.homeId);
    if (home && home.residents > 0) home.residents -= 1;
    villagers = villagers.filter(v => v.alive);
    // === CACHE INVALIDIEREN (Einwohner gestorben) ===
    markPlayerCacheDirty();
    markDirty();
}

// =========================================================================
//  MODUL 10: KAMPF- & EROBERUNGS-LOGIK (für 2 Spieler erweitert)
//  Inklusive transferResourceNodes, transferResourceNodesPlayer2ToPlayer,
//  transferResourceNodesPlayerToPlayer2 und clear-Funktionen
//  NPC bleibt unverändert - wird im Split-Modus nicht verwendet
// =========================================================================

function updateCombatAndCaptureClient(dt) {
    // ===== LOKALE HILFSFUNKTIONEN =====
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    const GRID_CELL_SIZE = 6;

    function getGridKey(x, y) {
        const cx = Math.floor(x / GRID_CELL_SIZE);
        const cy = Math.floor(y / GRID_CELL_SIZE);
        return cx + ',' + cy;
    }

    function getNeighborKeys(x, y, range) {
        const cx = Math.floor(x / GRID_CELL_SIZE);
        const cy = Math.floor(y / GRID_CELL_SIZE);
        const keys = [];
        for (let dx = -range; dx <= range; dx++) {
            for (let dy = -range; dy <= range; dy++) {
                keys.push((cx + dx) + ',' + (cy + dy));
            }
        }
        return keys;
    }

    // ===== GRIDS AUFBAUEN =====
    const playerGrid = new Map();
    const player2Grid = new Map();
    const enemyGrid = new Map();

    // Spieler 1 (vom Snapshot)
    for (let v of villagers) {
        if (!v.alive) continue;
        const key = getGridKey(v.x, v.y);
        if (!playerGrid.has(key)) playerGrid.set(key, []);
        playerGrid.get(key).push(v);
    }

    // Spieler 2 (lokal)
    for (let v of player2Villagers) {
        if (!v.alive) continue;
        const key = getGridKey(v.x, v.y);
        if (!player2Grid.has(key)) player2Grid.set(key, []);
        player2Grid.get(key).push(v);
    }

    // Feinde
    for (let e of enemies) {
        if (!e.alive) continue;
        const key = getGridKey(e.x, e.y);
        if (!enemyGrid.has(key)) enemyGrid.set(key, []);
        enemyGrid.get(key).push(e);
    }

    const allPlayerVillagers = villagers;
    const allPlayer2Villagers = player2Villagers;

    const combatRange = getCurrentCombatRange() * CONFIG.CELL_SIZE;
    const combatRangeSq = combatRange * combatRange;

    if (gameMode === 'war') {
        // ===== SPIELER 2 GREIFT SPIELER 1 AN (Client) =====
        const availablePlayer2 = allPlayer2Villagers.filter(v =>
            v.alive && v.carrying === null && !v.isDeliveringStone && !v.isBuilding
        );

        for (let p2v of availablePlayer2) {
            if (p2v.combatCooldown > 0) continue;
            if (p2v.isAttacking && p2v.attackTarget && p2v.attackTarget.alive) {
                const d2 = dist2(p2v, p2v.attackTarget);
                if (d2 > combatRangeSq * 2.25) {
                    p2v.isAttacking = false;
                    p2v.attackTarget = null;
                    p2v.hasTask = false;
                }
                continue;
            }

            const neighborKeys = getNeighborKeys(p2v.x, p2v.y, 2);
            let closestTarget = null;
            let closestDistSq = Infinity;

            for (let key of neighborKeys) {
                const list = playerGrid.get(key);
                if (list) {
                    for (let pv of list) {
                        if (!pv.alive) continue;
                        const d2 = dist2(p2v, pv);
                        if (d2 < combatRangeSq && d2 < closestDistSq) {
                            closestDistSq = d2;
                            closestTarget = pv;
                        }
                    }
                }
            }

            if (closestTarget) {
                clearPlayer2VillagerTasks(p2v);
                p2v.isAttacking = true;
                p2v.attackTarget = closestTarget;
                p2v.targetX = closestTarget.x;
                p2v.targetY = closestTarget.y;
                p2v.state = 'attacking';
                p2v.hasTask = true;
            }
        }

        // ===== KÄMPFE FÜR SPIELER 2 =====
        for (let p2v of allPlayer2Villagers) {
            if (!p2v.alive || !p2v.isAttacking || !p2v.attackTarget) continue;
            const target = p2v.attackTarget;

            if (!target.alive) {
                let newTarget = null;
                let newDistSq = Infinity;
                const neighborKeys = getNeighborKeys(p2v.x, p2v.y, 2);

                for (let key of neighborKeys) {
                    const list = playerGrid.get(key);
                    if (list) {
                        for (let pv of list) {
                            if (!pv.alive) continue;
                            const d2 = dist2(p2v, pv);
                            if (d2 < combatRangeSq && d2 < newDistSq) {
                                newDistSq = d2;
                                newTarget = pv;
                            }
                        }
                    }
                }

                for (let key of neighborKeys) {
                    const list = enemyGrid.get(key);
                    if (list) {
                        for (let e of list) {
                            if (!e.alive) continue;
                            const d2 = dist2(p2v, e);
                            if (d2 < combatRangeSq && d2 < newDistSq) {
                                newDistSq = d2;
                                newTarget = e;
                            }
                        }
                    }
                }

                if (newTarget) {
                    p2v.attackTarget = newTarget;
                    p2v.targetX = newTarget.x;
                    p2v.targetY = newTarget.y;
                } else {
                    p2v.isAttacking = false;
                    p2v.attackTarget = null;
                    p2v.state = 'idle';
                    p2v.hasTask = false;
                }
                continue;
            }

            const d2 = dist2(p2v, target);
            if (d2 < 64) {
                if (p2v.combatCooldown <= 0) {
                    const isEnemy = target.hits !== undefined;
                    if (Math.random() < 0.5) {
                        if (isEnemy) {
                            target.alive = false;
                            createHitEffect(target.x, target.y, target.isSuper);
                            SoundFX.playIfVisible(target.x, target.y, 'enemyDeath');

                                resources.stone += (target.stoneToDeliver || 0);
                                if (target.towerTarget) {

                            }

                            if (target.carrying === 'wood') resources.wood += 1;
                            if (target.resourceTarget) {
                                const node = resourceNodes.find(r => r.id === target.resourceTarget.id);

                            player2Resources.stone += (p2v.stoneToDeliver || 0);
                            if (p2v.towerTarget) {
                                p2v.towerTarget.reservedStone = Math.max(0, p2v.towerTarget.reservedStone - (p2v.stoneToDeliver || 0));
                            }
                        }
                        if (p2v.carrying === 'grain') player2Resources.grain += 1;
                        if (p2v.carrying === 'wood') player2Resources.wood += 1;
                        if (p2v.resourceTarget) {
                            const node = player2ResourceNodes.find(r => r.id === p2v.resourceTarget.id);
                            if (node && node.claimedBy === p2v.id) node.claimedBy = null;
                            p2v.resourceTarget = null;
                        }
                        if (p2v.isBuilding && p2v.buildingTarget) {
                            const building = player2Buildings.find(b => b.id === p2v.buildingTarget);

                }

                p2v.targetX = target.x;
                p2v.targetY = target.y;
            }
        }

        // ===== COOLDOWNS REDUZIEREN =====
        for (let v of player2Villagers) {
            if (v.combatCooldown > 0) v.combatCooldown -= dt;

    }

    // ===== CACHES AKTUALISIEREN =====
    player2Villagers = player2Villagers.filter(v => v.alive);
    refreshPlayer2VillagerCache();
    refreshPlayer2ResourceCache();
    markDirty();
}

function updateCombatAndCapture(dt) {
    // ===== LOKALE HILFSFUNKTIONEN =====
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    const GRID_CELL_SIZE = 6;

    function getGridKey(x, y) {
        const cx = Math.floor(x / GRID_CELL_SIZE);
        const cy = Math.floor(y / GRID_CELL_SIZE);
        return cx + ',' + cy;
    }

    function getNeighborKeys(x, y, range) {
        const cx = Math.floor(x / GRID_CELL_SIZE);
        const cy = Math.floor(y / GRID_CELL_SIZE);
        const keys = [];
        for (let dx = -range; dx <= range; dx++) {
            for (let dy = -range; dy <= range; dy++) {
                keys.push((cx + dx) + ',' + (cy + dy));
            }
        }
        return keys;
    }

    // ===== GRIDS AUFBAUEN =====
    const playerGrid = new Map();
    const player2Grid = new Map();
    const npcGrid = new Map();
    const enemyGrid = new Map();

    // Spieler 1
    for (let v of cachedPlayerVillagers) {
        if (!v.alive) continue;
        const key = getGridKey(v.x, v.y);
        if (!playerGrid.has(key)) playerGrid.set(key, []);
        playerGrid.get(key).push(v);
    }

    // Spieler 2 (nur im Split-Modus)
    if (SPLIT_SCREEN) {
        for (let v of cachedPlayer2Villagers) {
            if (!v.alive) continue;
            const key = getGridKey(v.x, v.y);
            if (!player2Grid.has(key)) player2Grid.set(key, []);
            player2Grid.get(key).push(v);
        }
    }

    // NPC (nur im Einzelmodus)
    if (!SPLIT_SCREEN) {
        for (let v of cachedNpcVillagers) {
            if (!v.alive) continue;
            const key = getGridKey(v.x, v.y);
            if (!npcGrid.has(key)) npcGrid.set(key, []);
            npcGrid.get(key).push(v);
        }
    }

    // Feinde (immer)
    for (let e of enemies) {
        if (!e.alive) continue;
        const key = getGridKey(e.x, e.y);
        if (!enemyGrid.has(key)) enemyGrid.set(key, []);
        enemyGrid.get(key).push(e);
    }

    const allPlayerVillagers = cachedPlayerVillagers;
    const allPlayer2Villagers = cachedPlayer2Villagers;
    const allNPCVillagers = cachedNpcVillagers;

    const combatRange = getCurrentCombatRange() * CONFIG.CELL_SIZE;
    const combatRangeSq = combatRange * combatRange;

    // ============================================================
    // 1. ANGRIFFSSUCHE (NUR IM KRIEG)
    // ============================================================

    if (gameMode === 'war') {
        // --- Einzelmodus: Spieler vs NPC ---
        if (!SPLIT_SCREEN) {
            // Spieler greift NPC an
            const availablePlayers = allPlayerVillagers.filter(v =>
                v.alive && v.carrying === null && !v.isDeliveringStone && !v.isBuilding
            );

            for (let pv of availablePlayers) {
                if (pv.combatCooldown > 0) continue;
                if (pv.isAttacking && pv.attackTarget && pv.attackTarget.alive) {
                    const d2 = dist2(pv, pv.attackTarget);
                    if (d2 > combatRangeSq * 2.25) {
                        pv.isAttacking = false;
                        pv.attackTarget = null;
                        pv.hasTask = false;
                    }
                    continue;
                }

                const neighborKeys = getNeighborKeys(pv.x, pv.y, 2);
                let closestTarget = null;
                let closestDistSq = Infinity;

                for (let key of neighborKeys) {
                    const list = npcGrid.get(key);
                    if (!list) continue;
                    for (let nv of list) {
                        if (!nv.alive) continue;
                        const d2 = dist2(pv, nv);
                        if (d2 < combatRangeSq && d2 < closestDistSq) {
                            closestDistSq = d2;
                            closestTarget = nv;
                        }
                    }
                }

                if (closestTarget) {
                    clearPlayerVillagerTasks(pv);
                    pv.isAttacking = true;
                    pv.attackTarget = closestTarget;
                    pv.targetX = closestTarget.x;
                    pv.targetY = closestTarget.y;
                    pv.state = 'attacking';
                    pv.hasTask = true;

                    npcWarMode = true;
                    npcWarModeTimer = 300;
                    npcPeaceMode = false;
                    npcPeaceCooldown = 300;
                    showTemporaryMessage('⚔️ Angriff auf NPC - NPC geht in Krieg!', '#ff4444');
                    if (window.updateModeDisplay) window.updateModeDisplay();

            // NPC greift Spieler an

                v.alive && v.carrying === null && !v.isDeliveringStone && !v.isBuilding
            );

                        nv.attackTarget = null;
                        nv.hasTask = false;
                    }
                    continue;

    // ============================================================
    // 2. KÄMPFE AUSFÜHREN

    for (let pv of allPlayerVillagers) {
        if (!pv.alive || !pv.isAttacking || !pv.attackTarget) continue;

        if (!target.alive) {
            let newTarget = null;
