    rebuildVillagerGridPlayer2();
    rebuildVillagerGridNpc();
}

// ===== EINWOHNER IM VIEWPORT FINDEN (SPIELER 1) =====
function getVillagersInViewportPlayer(viewLeft, viewRight, viewTop, viewBottom) {
    if (villagerGridDirtyPlayer) {
        rebuildVillagerGridPlayer();
    }
    
    const result = [];
    const startKey = getGridKey(viewLeft, viewTop);
    const endKey = getGridKey(viewRight, viewBottom);
    const [startCX, startCY] = startKey.split(',').map(Number);
    const [endCX, endCY] = endKey.split(',').map(Number);
    
    for (let cx = startCX - 1; cx <= endCX + 1; cx++) {
        for (let cy = startCY - 1; cy <= endCY + 1; cy++) {
            const key = cx + ',' + cy;
            const cells = villagerGridPlayer.get(key);
            if (cells) {
                for (let v of cells) {
                    if (!v.alive) continue;
                    if (v.x >= viewLeft && v.x <= viewRight && 
                        v.y >= viewTop && v.y <= viewBottom) {
                        result.push(v);
                    }
                }
            }
        }
    }
    return result;
}

// =========================================================================
//  MODUL 13a: NPC-EINWOHNER-KI - CACHE-FUNKTIONEN – MIT INVALIDIERUNG
// =========================================================================

let cachedNpcFreeCount = -1;

function markNpcCacheDirty() {
    npcCacheNeedsRefresh = true;
}

function refreshNpcVillagerCache() {
    const aliveVillagers = npcVillagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    if (cachedNpcAliveIds.size === aliveCount && cachedNpcFreeCount === freeCount && npcCacheNeedsRefresh === false) {
        return;
    }

    try {
        cachedNpcVillagers = aliveVillagers;
        cachedNpcAliveIds = aliveIds;
        cachedNpcFreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedNpcFreeCount = cachedNpcFreeVillagers.length;
        npcCacheNeedsRefresh = false;
    } catch(e) {
        cachedNpcVillagers = [];
        cachedNpcFreeVillagers = [];
        cachedNpcAliveIds = new Set();
        cachedNpcFreeCount = 0;
    }
}

function refreshNpcResourceCache() {
    try {
        cachedNpcResourceNodes = npcResourceNodes.slice();
        cachedNpcAvailableNodes = cachedNpcResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedNpcResourceNodes = [];
        cachedNpcAvailableNodes = [];
    }
}

function markNpcCacheDirty() {
    npcCacheNeedsRefresh = true;
    villagerGridDirtyNpc = true; // ★ NEU
}


function markNpcCacheDirty() {
    npcCacheNeedsRefresh = true;
    villagerGridDirtyNpc = true; // ★ NEU
    combatGridDirtyNpc = true;   // ★ NEU FÜR KAMPF
}

//  MODUL 13b: NPC-EINWOHNER-KI - ANKUNFT & BEWEGUNG (KORRIGIERT)
// =========================================================================

function getNeededBuildersNPC() {
  let needed = 0;
  for (let b of npcBuildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleNpcArrival(v, home) {
  if (v.state === 'movingToResource' && v.resourceTarget) {
    const node = cachedNpcResourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.ready && node.claimedBy === v.id) {
      // Ressource abholen
      if (node.type === 'grain') npcResources.grain += 1;
      else if (node.type === 'wood') npcResources.wood += 1;
      else if (node.type === 'stone') npcResources.stone += 1;

      // NODE ENTFERNEN - jetzt erst wenn abgeholt!
      const idx = npcResourceNodes.indexOf(node);
      if (idx !== -1) { 
        npcResourceNodes.splice(idx, 1);
        refreshNpcResourceCache();
        markDirty();
      }
      v.carrying = node.type; 
      v.deliveryTarget = null;
    } else {
      // Node nicht mehr verfügbar oder nicht ready -> zurücksetzen
      v.state = 'idle';
      v.resourceTarget = null;
      v.hasTask = false;
      // Wenn node existiert aber nicht ready, Claim aufheben
      if (node && node.claimedBy === v.id) {
        node.claimedBy = null;
      }
      return;
    }
    v.resourceTarget = null;
    v.state = 'returningHome';

    // === LAGER SUCHEN - CACHE AKTUALISIEREN ===
    refreshLagerCache();

    // === NUR ZUM LAGER GEHEN ===
    let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);

    // === FALLBACK: DIREKT IN NPCBUILDINGS SUCHEN ===
    if (!lager) {
      // Direkt in npcBuildings nach einem Lager suchen
      for (let b of npcBuildings) {
        if (b.type === 'lager') {
          lager = b;
          break;
        }
      }
    }

    if (lager) {
      v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
      v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
      // === KEIN LAGER = NPC GAME OVER ===
      v.alive = false;
      v.carrying = null;
      v.state = 'idle';
      v.hasTask = false;
      // NPC hat kein Lager mehr - er kann nicht mehr überleben
      // Aber wir geben ihm eine letzte Chance: Er baut ein neues Lager
      showTemporaryMessage('🤖 NPC hat kein Lager mehr! Versucht zu überleben...', '#ff6b6b');
      // Versuche ein neues Lager zu bauen
      const pos = findLagerPosition ? findLagerPosition() : findStandardPosition('lager', true);
      if (pos && npcCanAfford('lager')) {
        npcDeductCost('lager');
        const b = new Building(nextBuildingId++, 'lager', pos.x, pos.y, true);
        b.isUnderConstruction = true; b.constructionTimer = 0; b.constructionProgress = 0; b.waitingForBuilder = true;
        npcBuildings.push(b); assignNpcBuilderToConstruction(b.id);
        showTemporaryMessage('🤖 NPC baut neues Lager!', '#9b59b6');
        markDirty();
      } else {
        // NPC kann kein Lager bauen -> Game Over für NPC (Spieler gewinnt)
        showTemporaryMessage('🤖 NPC SIEDLUNG ZUSAMMENGEBROCHEN!', '#ff0000');
        // Alle NPC-Gebäude werden zu Spieler-Gebäuden (Sieg)
        for (let nb of npcBuildings) {
          nb.isNPC = false;
          nb.id = nextBuildingId++;
          buildings.push(nb);
        }
        npcBuildings = [];
        npcVillagers = [];
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
        document.getElementById('gameOverSub').textContent = 'NPC hat kein Lager - Du hast gewonnen!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
      }
    }
  } else if (v.state === 'returningHome' && v.carrying) {
    v.carrying = null; 
    v.state = 'idle'; 
    v.resourceTarget = null; 
    v.hasTask = false; 
    v.deliveryTarget = null;
    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
    v.targetX = homePos.x; 
    v.targetY = homePos.y;
  }
}


// =========================================================================
//  MODUL 13c: NPC-EINWOHNER-KI – KOMPLETT OPTIMIERT (VOLLSTÄNDIG)
// =========================================================================

// =========================================================================
//  MODUL 13c: NPC-EINWOHNER-KI - HAUPTLOGIK (KOMPLETT)
// =========================================================================

let lastNPCVillagerHitTime = 0;

function updateNPCVillagers(dt) {
    refreshNpcVillagerCache();
    refreshNpcResourceCache();
    refreshLagerCache();

    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of npcBuildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of npcVillagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (!site.isNPC) continue;
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_npc_', ''));
            const grenze = npcGrenzen.find(g => g.id === grenzeId);
            if (grenze) {
                const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
                if (!builder) {
                    grenze.builder = null;
                    grenze.waitingForBuilder = true;
                    delete constructionSites[key];
                }
            }
            continue;
        }
        const building = npcBuildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // ===== Capture-Aufgaben bereinigen - MIT GRENZ-ERKENNUNG =====
    for (let v of npcVillagers) {
        if (v.alive && v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) node.claimedBy = null;
    }

    npcVillagers = cachedNpcVillagers.slice();

    for (let building of npcBuildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            npcResources.stone += overflow;
        }
    }

    const neededBuilders = getNeededBuildersNPC();
    const freeForTasks = cachedNpcFreeVillagers.slice(neededBuilders);

    const now = performance.now() / 1000;
    const stonePriority = (now - lastNPCVillagerHitTime < 10);
    const hasGrainNodes = cachedNpcResourceNodes.some(n => n.type === 'grain' && !n.claimedBy);
    const grainPriority = (npcResources.grain < 50 && hasGrainNodes);

    // ============================================================
    // STEINLIEFERUNG (NPC)
    // ============================================================
    const towersNeedingStone = npcBuildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = cachedNpcFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const totalFree = freeForStone.length;
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && npcResources.stone > 0 && totalFree > 0) {
        const currentlyDelivering = cachedNpcVillagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, npcResources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || npcResources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                for (let i = 0; i < canSend; i++) {
                    if (npcResources.stone <= 0) break;
                    let closestVillager = null, closestDist = Infinity;
                    for (let v of freeForStone) {
                        if (v.hasTask || v.isDeliveringStone) continue;
                        const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
                        if (d < closestDist) { closestDist = d; closestVillager = v; }
                    }
                    if (closestVillager) {
                        tower.reservedStone += 1;
                        npcResources.stone -= 1;
                        const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE, true);
                        if (lager) {
                            closestVillager.state = 'movingToLagerForStone';
                            closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.hasTask = true;
                            closestVillager.isDeliveringStone = true;
                            closestVillager.towerTarget = tower;
                            closestVillager.stoneToDeliver = 1;
                            closestVillager.hasReservedStone = true;
                            closestVillager.carrying = 'stone';
                            freeForStone = freeForStone.filter(v => v.id !== closestVillager.id);
                        } else {
                            npcResources.stone += 1;
                            tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                        }
                    }
                }
            }
        }
    }

    // ============================================================
    // RESSOURCEN SAMMELN - NUR READY NODES! (NPC)
    // ============================================================
    
    const freeForTasksAfterStone = cachedNpcFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const readyNodesWithFields = cachedNpcResourceNodes.filter(node => 
        !node.claimedBy && 
        node.ready &&
        node.fields && 
        node.fields.length > 0
    );

    if (readyNodesWithFields.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            let sortedNodes = readyNodesWithFields;
            if (grainPriority) {
                sortedNodes = [...readyNodesWithFields].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...readyNodesWithFields].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            }

            for (let node of sortedNodes) {
                if (node.claimedBy) continue;
                
                const hasUnharvestedFields = node.fields.some(f => !f.harvested);
                if (!hasUnharvestedFields) {
                    node.ready = false;
                    node.timer = 0;
                    node.claimedBy = null;
                    for (let f of node.fields) {
                        f.harvested = false;
                        f.harvestTimer = 0;
                        f.isBeingHarvested = false;
                    }
                    markDirty();
                    continue;
                }

                const nextField = node.fields.find(f => !f.harvested);
                if (!nextField) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - nextField.x * CONFIG.CELL_SIZE, v.y - nextField.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'harvestingField';
                    closestVillager.isHarvesting = true;
                    closestVillager.harvestBuildingId = node.buildingId;
                    closestVillager.harvestFieldIndex = node.fields.indexOf(nextField);
                    closestVillager.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                    
                    nextField.isBeingHarvested = true;
                }
            }
        }
    }

    // ============================================================
    // BEWEGUNG FÜR ALLE NPC-EINWOHNER
    // ============================================================

    const npcsToUpdate = cachedNpcVillagers.slice();

    for (let v of npcsToUpdate) {
        const home = npcBuildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // ===== movingToCapture - MIT GRENZ-ERKENNUNG =====
        if (v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // ===== FELD ERNTEN (harvestingField) - NPC =====
        if (v.state === 'harvestingField' && v.isHarvesting) {
            const node = npcResourceNodes.find(n => n.buildingId === v.harvestBuildingId);
            if (!node || !node.fields || node.fields.length === 0) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            if (!node.ready) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                v.resourceTarget = null;
                node.claimedBy = null;
                continue;
            }
            
            const fieldIndex = v.harvestFieldIndex;
            if (fieldIndex === undefined || fieldIndex >= node.fields.length) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            const field = node.fields[fieldIndex];
            const targetX = field.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const targetY = field.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            v.targetX = targetX;
            v.targetY = targetY;
            
            const dx = v.targetX - v.x;
            const dy = v.targetY - v.y;
            const distance = Math.hypot(dx, dy);
            
            if (distance < 5) {
                field.harvestTimer += dt;
                
                if (field.harvestTimer >= 0.25) {
                    field.harvested = true;
                    field.isBeingHarvested = false;
                    field.harvestTimer = 0;
                    createHarvestEffect(targetX, targetY, 1);
                    
                    if (!v.harvestedCount) v.harvestedCount = 0;
                    v.harvestedCount += 1;
                    
                    const allHarvested = node.fields.every(f => f.harvested);
                    
                    if (allHarvested) {
                        v.carrying = node.type;
                        v.carryingCount = v.harvestedCount;
                        v.isHarvesting = false;
                        v.state = 'returningHome';
                        v.hasTask = true;
                        v.resourceTarget = null;
                        v.harvestedCount = 0;
                        
                        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
                        if (lager) {
                            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const homeBuilding = npcBuildings.find(b => b.id === v.homeId);
                            if (homeBuilding) {
                                v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                v.state = 'idle';
                                v.hasTask = false;
                                v.carrying = null;
                                v.carryingCount = 0;
                                continue;
                            }
                        }
                        
                        node.ready = false;
                        node.timer = 0;
                        node.claimedBy = null;
                        for (let f of node.fields) {
                            f.harvested = false;
                            f.harvestTimer = 0;
                            f.isBeingHarvested = false;
                        }
                        
                        markDirty();
                        continue;
                    } else {
                        const nextField = node.fields.find(f => !f.harvested);
                        if (nextField) {
                            nextField.isBeingHarvested = true;
                            nextField.harvestTimer = 0;
                            v.harvestFieldIndex = node.fields.indexOf(nextField);
                            v.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                        } else {
                            v.carrying = node.type;
                            v.carryingCount = v.harvestedCount;
                            v.isHarvesting = false;
                            v.state = 'returningHome';
                            v.hasTask = true;
                            v.resourceTarget = null;
                            v.harvestedCount = 0;
                            
                            let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
                            if (lager) {
                                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                const homeBuilding = npcBuildings.find(b => b.id === v.homeId);
                                if (homeBuilding) {
                                    v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                    v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                } else {
                                    v.state = 'idle';
                                    v.hasTask = false;
                                    v.carrying = null;
                                    v.carryingCount = 0;
                                    continue;
                                }
                            }
                            
                            node.ready = false;
                            node.timer = 0;
                            node.claimedBy = null;
                            for (let f of node.fields) {
                                f.harvested = false;
                                f.harvestTimer = 0;
                                f.isBeingHarvested = false;
                            }
                            
                            markDirty();
                            continue;
                        }
                    }
                }
            } else {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isBuilding && v.buildingTarget) {
            const building = npcBuildings.find(b => b.id === v.buildingTarget);
            const grenze = npcGrenzen.find(g => g.id === v.buildingTarget);
            
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else if (grenze && grenze.isUnderConstruction) {
                const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        if (v.isAttacking) continue;

        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
                if (lager) {
                    const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                    const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && npcBuildings.includes(v.towerTarget) && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const altTower = findNearestNPCTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                            if (altTower) {
                                if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                                altTower.reservedStone += toDeliver;
                                v.towerTarget = altTower;
                                v.carrying = 'stone';
                                v.stoneToDeliver = toDeliver;
                                v.state = 'deliveringStoneToTower';
                                v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                npcResources.stone += toDeliver;
                                if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                                v.state = 'idle';
                                v.hasTask = false;
                                v.isDeliveringStone = false;
                                v.towerTarget = null;
                                v.stoneToDeliver = 0;
                                v.hasReservedStone = false;
                                v.carrying = null;
                            }
                        }
                    } else {
                        const step = Math.min(distance, v.speed * dt);
                        v.x += (dx / distance) * step;
                        v.y += (dy / distance) * step;
                    }
                } else {
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                if (!tower || !npcBuildings.includes(tower) || tower.stoneAmmo >= tower.maxStoneAmmo) {
                    const altTower = findNearestNPCTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                    if (altTower) {
                        if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                        altTower.reservedStone += (v.stoneToDeliver || 0);
                        v.towerTarget = altTower;
                        v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    } else {
                        npcResources.stone += (v.stoneToDeliver || 0);
                        if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                        v.carrying = null;
                        v.state = 'idle';
                        v.hasTask = false;
                        v.isDeliveringStone = false;
                        v.towerTarget = null;
                        v.stoneToDeliver = 0;
                        v.hasReservedStone = false;
                    }
                    continue;
                }
                const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            npcResources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        // ===== EINWOHNER KOMMT AM LAGER AN - NPC =====
        if (v.state === 'returningHome' && v.carrying) {
            const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
            if (lager) {
                const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                
                if (distance < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') npcResources.grain += count;
                    else if (v.carrying === 'wood') npcResources.wood += count;
                    else if (v.carrying === 'stone') npcResources.stone += count;
                    
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                    
                    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                    v.targetX = homePos.x;
                    v.targetY = homePos.y;
                    
                    markDirty();
                    continue;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                    continue;
                }
            } else {
                const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                  y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                v.targetX = homePos.x;
                v.targetY = homePos.y;
                const dx = homePos.x - v.x;
                const dy = homePos.y - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') npcResources.grain += count;
                    else if (v.carrying === 'wood') npcResources.wood += count;
                    else if (v.carrying === 'stone') npcResources.stone += count;
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        if (v.carrying !== null && !v.isDeliveringStone && v.state !== 'returningHome') {
            v.state = 'returningHome';
            const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY, true);
            if (lager) {
                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            } else {
                v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            }
            v.resourceTarget = null;
        }

        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedNpcResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { v.targetX = homePos.x;
                v.targetY = homePos.y; }
        }

        if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY, true);
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'movingToResource' || v.state === 'returningHome') handleNpcArrival(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
        }
    }

    npcVillagers = npcVillagers.filter(v => v.alive);

    refreshNpcVillagerCache();
    refreshNpcResourceCache();
    refreshLagerCache();

    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of npcBuildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of npcVillagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    markDirty();
}

// =========================================================================
//  MODUL 14: FEINDE – MIT MITTELPUNKT-ANGRIFF (NEU)
// =========================================================================

let npcAttackProtectionTimer = 0;
let npcAttackProtectionActive = true;
let npcAttackProtectionMessageShown = false;

// ===== FEINDE SPAWNEN (MIT GRUPPENANGRIFF) =====
function spawnEnemies() {
    // ===== ERST BEI 12 EINWOHNERN SPAWNEN =====
    const playerPopulation = villagers.filter(v => v.alive).length;
    if (playerPopulation < 12) return;
    
    const maxEnemies = getMaxEnemies();
    const currentEnemies = enemies.filter(e => e.alive).length;
    const toSpawn = Math.min(maxEnemies - currentEnemies, CONFIG.MAX_SPAWN_PER_FRAME);
    
    if (toSpawn <= 0) return;
    
    // Bestimme Ziel (Mittelpunkt der Siedlung)
    const center = getSettlementCenter('player');
    const centerWorldX = center.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const centerWorldY = center.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    
    for (let i = 0; i < toSpawn; i++) {
        // Feinde spawnen am Rand der Karte
        const side = Math.floor(Math.random() * 4);
        let x, y;
        const margin = 50;
        switch(side) {
            case 0: x = margin + Math.random() * (WORLD_WIDTH - margin * 2); y = margin; break;
            case 1: x = margin + Math.random() * (WORLD_WIDTH - margin * 2); y = WORLD_HEIGHT - margin; break;
            case 2: x = margin; y = margin + Math.random() * (WORLD_HEIGHT - margin * 2); break;
            case 3: x = WORLD_WIDTH - margin; y = margin + Math.random() * (WORLD_HEIGHT - margin * 2); break;
        }
        
        const isSuper = Math.random() < 0.1 && currentEnemies > 10;
        const enemy = new Enemy(nextEnemyId++, x, y, isSuper);
        
        enemy.targetX = centerWorldX;
        enemy.targetY = centerWorldY;
        
        enemies.push(enemy);
    }
    
    // Prüfe ob Großangriff
    const aliveEnemies = enemies.filter(e => e.alive);
    if (aliveEnemies.length >= CONFIG.ENEMY_GROUP_ATTACK_THRESHOLD) {
        for (let e of aliveEnemies) {
            e.isGroupAttack = true;
            e.targetX = centerWorldX;
            e.targetY = centerWorldY;
        }
        showTemporaryMessage(`⚔️ GROSSANGRIFF! ${aliveEnemies.length} Feinde stürmen!`, '#ff4444', true);
        SoundFX.playIfVisible(centerWorldX, centerWorldY, 'enemyDeath');
    }
    
    combatGridDirtyEnemy = true;
}

function updateEnemies(dt) {
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    // ===== NPC-ANGRIFFSSCHUTZ =====
    if (!SPLIT_SCREEN) {
        const npcPopulation = npcVillagers.filter(v => v.alive).length;
        
        if (npcPopulation > 12) {
            npcAttackProtectionTimer += dt;
            const remaining = Math.max(0, Math.ceil(30 - npcAttackProtectionTimer));
            if (remaining > 0 && remaining % 5 === 0) {
                showTemporaryMessage(`🛡️ NPC-Schutz: ${remaining}s verbleibend (${Math.floor(npcPopulation)} Einwohner)`, '#ffd966');
            }
            if (npcAttackProtectionTimer >= 30) {
                npcAttackProtectionActive = false;
                if (!npcAttackProtectionMessageShown) {
                    npcAttackProtectionMessageShown = true;
                    showTemporaryMessage('⚔️ NPC-Schutz aufgehoben! Feinde greifen jetzt an!', '#ff4444');
                }
            }
        } else {
            if (!npcAttackProtectionActive) {
                showTemporaryMessage('🕊️ NPC hat weniger als 12 Einwohner - Schutz aktiviert', '#44ff44');
            }
            npcAttackProtectionTimer = 0;
            npcAttackProtectionActive = true;
            npcAttackProtectionMessageShown = false;
        }
    }

    // ===== ALLE LEBENDEN VILLAGER =====
    const allVillagers = [];
    for (let v of villagers) {
        if (v.alive) allVillagers.push(v);
    }
    if (SPLIT_SCREEN || NETWORK_MODE) {
        for (let v of player2Villagers) {
            if (v.alive) allVillagers.push(v);
        }
    }
    if (!SPLIT_SCREEN) {
        if (!npcAttackProtectionActive) {
            for (let v of npcVillagers) {
                if (v.alive) allVillagers.push(v);
            }
        }
    }

    if (allVillagers.length === 0 && enemies.some(e => e.alive)) {
        enemies = [];
        enemiesHaveCleared = true;
        npcAttackProtectionTimer = 0;
        npcAttackProtectionActive = true;
        npcAttackProtectionMessageShown = false;
        combatGridDirtyEnemy = true;
        return;
    }
    if (allVillagers.length > 0 && enemiesHaveCleared) enemiesHaveCleared = false;

    if (combatGridDirtyEnemy) {
        rebuildCombatGridEnemy();
    }

    // ===== MITTELPUNKT AKTUALISIEREN =====
    const center = getSettlementCenter('player');
    const centerWorldX = center.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    const centerWorldY = center.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;

    for (let enemy of enemies) {
        if (!enemy.alive) continue;

        if (enemy.killCount >= 2) {
            enemy.alive = false;
            continue;
        }

        if (allVillagers.length === 0) {
            enemy.targetVillager = null;
            continue;
        }

        if (enemy.searchCounter === undefined) enemy.searchCounter = 0;
        if (enemy.lastTarget === undefined) enemy.lastTarget = null;

        const searchRange = CONFIG.ENEMY_ATTACK_RADIUS;
        enemy.searchCounter++;

        // ===== NEU: Feinde zielen auf Mittelpunkt =====
        // Alle 5 Frames nach Villagern suchen, sonst zum Mittelpunkt bewegen
        if (enemy.searchCounter % 5 === 0 || !enemy.lastTarget) {
            const nearbyVillagers = [];
            
            const p1Nearby = getPlayerVillagersInRange(enemy.x, enemy.y, searchRange);
            for (let v of p1Nearby) {
                if (v.alive) nearbyVillagers.push(v);
            }
            
            if (SPLIT_SCREEN || NETWORK_MODE) {
                const p2Nearby = getPlayer2VillagersInRange(enemy.x, enemy.y, searchRange);
                for (let v of p2Nearby) {
                    if (v.alive) nearbyVillagers.push(v);
                }
            }
            
            if (!SPLIT_SCREEN && !npcAttackProtectionActive) {
                const npcNearby = getNpcVillagersInRange(enemy.x, enemy.y, searchRange);
                for (let v of npcNearby) {
                    if (v.alive) nearbyVillagers.push(v);
                }
            }

            // Nächsten Villager finden
            if (nearbyVillagers.length > 0) {
                let closestVillager = null;
                let closestDistSq = Infinity;
                for (let v of nearbyVillagers) {
                    if (!v.alive) continue;
                    const d2 = dist2(enemy, v);
                    if (d2 < closestDistSq) {
                        closestDistSq = d2;
                        closestVillager = v;
                    }
                }
                enemy.lastTarget = closestVillager;
            } else {
                enemy.lastTarget = null;
                // Kein Villager in Reichweite → zum Mittelpunkt bewegen
                enemy.targetX = centerWorldX;
                enemy.targetY = centerWorldY;
            }
        }

        // ===== BEWEGUNG ZUM ZIEL =====
        let targetX = enemy.targetX;
        let targetY = enemy.targetY;
        
        // Wenn ein Villager in Reichweite ist, diesen angreifen
        if (enemy.lastTarget && enemy.lastTarget.alive) {
            const target = enemy.lastTarget;
            const d2 = dist2(enemy, target);
            const d = Math.sqrt(d2);

            if (d < 8) {
                // Villager töten (wie gehabt)
                // ... bestehende Kill-Logik ...
                const isNPC = target.isNPC || false;
                const isPlayer2 = (target.playerId === 'player2');

                if (isNPC) {
                    const home = npcBuildings.find(b => b.id === target.homeId);
                    if (home && home.residents > 0) home.residents -= 1;
                    // ... Ressourcen freigeben ...
                    target.alive = false;
                } else if (isPlayer2) {
                    const home = player2Buildings.find(b => b.id === target.homeId);
                    if (home && home.residents > 0) home.residents -= 1;
                    // ... Ressourcen freigeben ...
                    target.alive = false;
                } else {
                    const home = buildings.find(b => b.id === target.homeId);
                    if (home && home.residents > 0) home.residents -= 1;
                    // ... Ressourcen freigeben ...
                    killVillager(target);
                }

                enemy.killCount += 1;
                enemy.lastTarget = null;
                enemy.targetVillager = null;
                markDirty();
                continue;
            } else {
                targetX = target.x;
                targetY = target.y;
            }
        }

        // ===== ZUM MITTELPUNKT ODER VILLAGER BEWEGEN =====
        if (targetX !== undefined && targetY !== undefined) {
            const dx = targetX - enemy.x;
            const dy = targetY - enemy.y;
            const distance = Math.hypot(dx, dy);
            
            if (distance > 2) {
                const speed = enemy.isSuper ? 35 : 45;
                // Bei Gruppenangriff etwas langsamer (koordiniert)
                const speedMultiplier = enemy.isGroupAttack ? 0.9 : 1.0;
                const step = Math.min(distance, speed * speedMultiplier * dt);
                enemy.x += (dx / distance) * step;
                enemy.y += (dy / distance) * step;
            }
        }
    }

    // Tote entfernen
    enemies = enemies.filter(e => e.alive);
    villagers = villagers.filter(v => v.alive);
    if (SPLIT_SCREEN) {
        player2Villagers = player2Villagers.filter(v => v.alive);
    }
    npcVillagers = npcVillagers.filter(v => v.alive);
    
    combatGridDirtyEnemy = true;
}

// ===== CLIENT-SEITIGE FEIND-BEWEGUNG (NUR ANIMATION) =====
function updateEnemiesClientOnly(dt) {
    // Nur für Client: Feinde bewegen sich flüssig zum Ziel
    if (!NETWORK_MODE || IS_HOST) return;
    
    for (let enemy of enemies) {
        if (!enemy.alive) continue;
        if (enemy.targetX === undefined || enemy.targetY === undefined) continue;
        
        const dx = enemy.targetX - enemy.x;
        const dy = enemy.targetY - enemy.y;
        const distance = Math.hypot(dx, dy);
        
        if (distance > 2) {
            const speed = enemy.isSuper ? 35 : 45;
            const step = Math.min(distance, speed * dt * 0.8);
            enemy.x += (dx / distance) * step;
            enemy.y += (dy / distance) * step;
        } else {
            enemy.x = enemy.targetX;
            enemy.y = enemy.targetY;
        }
    }
}

let enemyGrid = new Map();
let enemyGridDirty = true;
const ENEMY_GRID_SIZE = 100;

function rebuildEnemyGrid() {
    enemyGrid.clear();
    for (let e of enemies) {
        if (!e.alive) continue;
        const key = getGridKey(e.x, e.y);
        if (!enemyGrid.has(key)) {
            enemyGrid.set(key, []);
        }
        enemyGrid.get(key).push(e);
    }
    enemyGridDirty = false;
}

function getEnemiesInViewport(viewLeft, viewRight, viewTop, viewBottom) {
    if (enemyGridDirty) {
        rebuildEnemyGrid();
    }
    
    const result = [];
    const startKey = getGridKey(viewLeft, viewTop);
    const endKey = getGridKey(viewRight, viewBottom);
    const [startCX, startCY] = startKey.split(',').map(Number);
    const [endCX, endCY] = endKey.split(',').map(Number);
    
    for (let cx = startCX - 1; cx <= endCX + 1; cx++) {
        for (let cy = startCY - 1; cy <= endCY + 1; cy++) {
            const key = cx + ',' + cy;
            const cells = enemyGrid.get(key);
            if (cells) {
                for (let e of cells) {
                    if (!e.alive) continue;
                    if (e.x >= viewLeft && e.x <= viewRight && 
                        e.y >= viewTop && e.y <= viewBottom) {
                        result.push(e);
                    }
                }
            }
        }
    }
    return result;
}

function markEnemyGridDirty() {
    enemyGridDirty = true;
}

// =========================================================================
//  MODUL 15: TÜRME & SCHÜSSE (für 2 Spieler erweitert)
//  NPC bleibt unverändert - wird im Split-Modus nicht verwendet
// =========================================================================

function updateTowers(dt) {
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    // ===== SPIELER 1 TÜRME =====
    buildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction && b.stoneAmmo > 0).forEach(tower => {
        tower.shootCooldown -= dt;
        if (tower.shootCooldown > 0) return;

        const tx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const ty = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const rangeSq = (tower.range * CONFIG.CELL_SIZE) ** 2;

        let closestTarget = null;
        let closestDistSq = Infinity;
        let closestType = null;

        if (SPLIT_SCREEN) {
            // Split-Modus: Spieler 1 schießt auf Spieler 2
            for (let p2v of player2Villagers) {
                if (!p2v.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: p2v.x, y: p2v.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = p2v;
                    closestType = 'player2';
                }
            }
        } else {
            // Einzelmodus: Spieler 1 schießt auf NPC
            for (let nv of npcVillagers) {
                if (!nv.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: nv.x, y: nv.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = nv;
                    closestType = 'npc';
                }
            }
        }

        // Feinde (immer)
        for (let e of enemies) {
            if (!e.alive) continue;
            const d2 = dist2({ x: tx, y: ty }, { x: e.x, y: e.y });
            if (d2 < rangeSq && d2 < closestDistSq) {
                closestDistSq = d2;
                closestTarget = e;
                closestType = 'enemy';
            }
        }

        if (closestTarget) {
            const isNPCVillager = (closestType === 'npc');
            const isPlayer2 = (closestType === 'player2');
            const isEnemy = (closestType === 'enemy');

            if (isNPCVillager && npcPeaceMode === true) {
                npcPeaceMode = false;
                npcPeaceCooldown = 300;
                showTemporaryMessage('🤖 NPC geht in Krieg (Turm getroffen)!', '#ff4444');
                if (window.updateModeDisplay) window.updateModeDisplay();
            }

            tower.stoneAmmo -= 1;
            tower.shootCooldown = tower.baseFireRate || 1.0;

            projectiles.push({
                x: tx,
                y: ty,
                targetX: closestTarget.x,
                targetY: closestTarget.y,
                speed: 300,
                target: closestTarget,
                isNPCVillager: isNPCVillager,
                isPlayer2: isPlayer2,
                isEnemy: isEnemy,
                isPlayerVillager: false,
                shooter: 'player'
            });

            // Doppelschuss
            if (tower.doubleShot) {
                let secondTarget = null;
                let secondDistSq = Infinity;
                let secondType = null;

                if (SPLIT_SCREEN) {
                    for (let p2v of player2Villagers) {
                        if (!p2v.alive || p2v === closestTarget) continue;
                        const d2 = dist2({ x: tx, y: ty }, { x: p2v.x, y: p2v.y });
                        if (d2 < rangeSq && d2 < secondDistSq) {
                            secondDistSq = d2;
                            secondTarget = p2v;
                            secondType = 'player2';
                        }
                    }
                } else {
                    for (let nv of npcVillagers) {
                        if (!nv.alive || nv === closestTarget) continue;
                        const d2 = dist2({ x: tx, y: ty }, { x: nv.x, y: nv.y });
                        if (d2 < rangeSq && d2 < secondDistSq) {
                            secondDistSq = d2;
                            secondTarget = nv;
                            secondType = 'npc';
                        }
                    }
                }

function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (!p.target || !p.target.alive) {
            projectiles.splice(i, 1);
            continue;
        }
        p.targetX = p.target.x;
        p.targetY = p.target.y;
        const dx = p.targetX - p.x,
            dy = p.targetY - p.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 10) {
            // ===== TREFFER BEHANDELN =====
            if (p.isNPCVillager) {
                // NPC Einwohner getroffen
                const home = npcBuildings.find(b => b.id === p.target.homeId);
                if (home && home.residents > 0) home.residents -= 1;
                if (p.target.carrying === 'stone' || p.target.hasReservedStone) {
                    npcResources.stone += (p.target.stoneToDeliver || 0);
                    if (p.target.towerTarget) {
                        p.target.towerTarget.reservedStone = Math.max(0, p.target.towerTarget.reservedStone - (p.target.stoneToDeliver || 0));
                    }
                }
                p.target.alive = false;
                createHitEffect(p.targetX, p.targetY, false, false);
                showTemporaryMessage('🏹 NPC-Einwohner von Turm getroffen!', '#ff6b6b');
                markDirty();
            } else if (p.isPlayer2) {
                // Spieler 2 Einwohner getroffen
                if (p.target.carrying === 'stone' || p.target.isDeliveringStone) {
                    player2Resources.stone += (p.target.stoneToDeliver || 0);
                    if (p.target.towerTarget) {
                        p.target.towerTarget.reservedStone = Math.max(0, p.target.towerTarget.reservedStone - (p.target.stoneToDeliver || 0));
                    }
                }
                if (p.target.carrying === 'grain') player2Resources.grain += 1;
                if (p.target.carrying === 'wood') player2Resources.wood += 1;
                if (p.target.resourceTarget) {
                    const node = player2ResourceNodes.find(r => r.id === p.target.resourceTarget.id);
                    if (node && node.claimedBy === p.target.id) node.claimedBy = null;
                    p.target.resourceTarget = null;
                }
                if (p.target.isBuilding && p.target.buildingTarget) {
                    const building = player2Buildings.find(b => b.id === p.target.buildingTarget);
                    if (building && building.isUnderConstruction) {
                        building.builder = null;
                        building.waitingForBuilder = true;
                    }
                    p.target.isBuilding = false;
                    p.target.buildingTarget = null;
                }
                const home = player2Buildings.find(b => b.id === p.target.homeId);
                if (home && home.residents > 0) home.residents -= 1;
                p.target.alive = false;
                createHitEffect(p.targetX, p.targetY, false, false);
                showTemporaryMessage('🏹 Spieler 2 Einwohner von Turm getroffen!', '#ff6b6b');
                markDirty();
            } else if (p.isPlayerVillager) {
                // Spieler 1 Einwohner getroffen
                if (p.target.carrying === 'stone' || p.target.isDeliveringStone) {
                    resources.stone += (p.target.stoneToDeliver || 0);
                    if (p.target.towerTarget) {
                        p.target.towerTarget.reservedStone = Math.max(0, p.target.towerTarget.reservedStone - (p.target.stoneToDeliver || 0));
                    }
                }
                if (p.target.carrying === 'grain') resources.grain += 1;
                if (p.target.carrying === 'wood') resources.wood += 1;
                if (p.target.resourceTarget) {
                    const node = resourceNodes.find(r => r.id === p.target.resourceTarget.id);
                    if (node && node.claimedBy === p.target.id) node.claimedBy = null;
                    p.target.resourceTarget = null;
                }
                if (p.target.isBuilding && p.target.buildingTarget) {
                    const building = buildings.find(b => b.id === p.target.buildingTarget);
                    if (building && building.isUnderConstruction) {
                        building.builder = null;
                        building.waitingForBuilder = true;
                    }
                    p.target.isBuilding = false;
                    p.target.buildingTarget = null;
                }
                killVillager(p.target);
                createHitEffect(p.targetX, p.targetY, false, false);
                showTemporaryMessage('🏹 Dein Einwohner wurde von Turm getroffen!', '#ff6b6b');
                markDirty();
            } else if (p.isEnemy) {
                // Feind getroffen
                p.target.hits += 1;
                if (p.target.hits >= p.target.maxHits) {
                    createHitEffect(p.targetX, p.targetY, p.target.isSuper);
                    p.target.alive = false;
                } else {
                    createHitEffect(p.targetX, p.targetY, false, true);
                }
                markDirty();
            } else {
                // Fallback
                if (p.target.hits !== undefined) {
                    p.target.hits += 1;
                    if (p.target.hits >= p.target.maxHits) {
                        createHitEffect(p.targetX, p.targetY, p.target.isSuper);
                        p.target.alive = false;
                    } else {
                        createHitEffect(p.targetX, p.targetY, false, true);
                    }
                    markDirty();
                }
            }
            projectiles.splice(i, 1);
        } else {
            const step = Math.min(distance, p.speed * dt);
            p.x += (dx / distance) * step;
            p.y += (dy / distance) * step;
        }
    }
}

function createHitEffect(x, y, isSuper = false, isPartial = false) {
    const particles = [];
    const count = isSuper ? 60 : (isPartial ? 15 : 30 + Math.floor(Math.random() * 20));
    const colors = isSuper ? ['#ff00ff', '#ff66ff', '#ff99ff'] : ['#ff0000', '#ff4400', '#ff8800'];
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (isSuper ? 60 : 30) + Math.random() * (isSuper ? 100 : 80);
        particles.push({
            x: x + (Math.random() - 0.5) * 6,
            y: y + (Math.random() - 0.5) * 6,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.3 + Math.random() * 0.4,
            maxLife: 0.3 + Math.random() * 0.4,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
    hitEffects.push({ x, y, particles, life: 0.8, maxLife: 0.8 });
    markDirty();
}

function updateHitEffects(dt) {
    for (let i = hitEffects.length - 1; i >= 0; i--) {
        const effect = hitEffects[i];
        effect.life -= dt;
        for (let p of effect.particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.98;
            p.vy *= 0.98;
            p.life -= dt;
        }
        if (effect.life <= 0) hitEffects.splice(i, 1);
    }
}

function npcHasEnoughBuildablePositions() {
    // Wenn keine Grenze existiert → sofort bauen
    if (npcGrenzen.length === 0) {
        return false;
    }
    
    // Suche nach IRGENDEINEM freien Platz
    for (let g of npcGrenzen) {
        if (!g.isActive) continue;
        const radius = Math.floor(g.radius);
        
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                if (Math.hypot(dx, dy) > radius) continue;
                
                const gx = g.gridX + dx;
                const gy = g.gridY + dy;
                
                // Grundprüfungen
                if (gx < 1 || gx >= CONFIG.GRID_WIDTH - 1) continue;
                if (gy < 1 || gy >= CONFIG.GRID_HEIGHT - 1) continue;
                if (isCellOccupied(gx, gy)) continue;
                if (isActiveResourceField(gx, gy)) continue;
                
                const terrain = getTerrainType(gx, gy);
                if (terrain === -1) continue;
                if (terrain === 1 || terrain === 2) continue; // Kein Wald/Stein
                
                // ===== WENN WIR HIER ANKOMMEN: FREIER PLATZ GEFUNDEN! =====
                return true; // Keine Grenze nötig
            }
        }
    }
    
    // Kein freier Platz gefunden → Grenze nötig
    return false;
}


function findGrenzePositionForNPC() {
    // Keine Grenze vorhanden -> baue in der Nähe der Siedlungsmitte
    if (npcGrenzen.length === 0) {
        const center = getSettlementCenter(null);
        // Suche eine freie Position in der Nähe der Mitte
        for (let attempt = 0; attempt < 50; attempt++) {
            const gx = center.x + Math.floor(Math.random() * 10) - 5;
            const gy = center.y + Math.floor(Math.random() * 10) - 5;
            if (gx < 0 || gx >= CONFIG.GRID_WIDTH || gy < 0 || gy >= CONFIG.GRID_HEIGHT) continue;
            if (isCellOccupied(gx, gy)) continue;
            if (isActiveResourceField(gx, gy)) continue;
            const terrain = getTerrainType(gx, gy);
            if (terrain === -1 || terrain === 1 || terrain === 2) continue;
            return { x: gx, y: gy };
        }
        return null;
    }

    // ===== BESTEHENDE GRENZE VORHANDEN =====
    let bestPos = null;
    let bestScore = -Infinity;

    // Gehe alle bestehenden Grenzen durch
    for (let g of npcGrenzen) {
        // Suche am Rand der Grenze (Radius + 1 bis Radius + 5)
        const minDist = g.radius - 1;
        const maxDist = g.radius + 5;

        for (let attempt = 0; attempt < 40; attempt++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = minDist + Math.random() * (maxDist - minDist);
            const gx = Math.round(g.gridX + Math.cos(angle) * dist);
            const gy = Math.round(g.gridY + Math.sin(angle) * dist);

            // Kartenrand-Check
            if (gx < 2 || gx >= CONFIG.GRID_WIDTH - 2 || gy < 2 || gy >= CONFIG.GRID_HEIGHT - 2) continue;

            // Belegt?
            if (isCellOccupied(gx, gy)) continue;

            // Terrain: nicht auf Wald oder Stein (Grenze braucht festen Boden)
            const terrain = getTerrainType(gx, gy);
            if (terrain === -1 || terrain === 1 || terrain === 2) continue;

            // Abstand zu anderen NPC-Grenzen (mindestens 10 Zellen)
            let tooClose = false;
            for (let other of npcGrenzen) {
                if (other.id === g.id) continue;
                if (Math.hypot(gx - other.gridX, gy - other.gridY) < 10) {
                    tooClose = true;
                    break;
                }
            }
            if (tooClose) continue;

            // ===== Prüfe ob Position innerhalb einer fremden Grenze liegt =====
            let insideForeignGrenze = false;

            // Spieler 1 Grenzen
            for (let pg of grenzen) {
                if (Math.hypot(gx - pg.gridX, gy - pg.gridY) <= pg.radius) {
                    insideForeignGrenze = true;
                    break;
                }
            }
            // Spieler 2 Grenzen (wenn Split-Modus)
            if (!insideForeignGrenze && SPLIT_SCREEN) {
                for (let pg of player2Grenzen) {
                    if (Math.hypot(gx - pg.gridX, gy - pg.gridY) <= pg.radius) {
                        insideForeignGrenze = true;
                        break;
                    }
                }
            }
            if (insideForeignGrenze) continue;

            // ===== SCORE-BERECHNUNG =====
            let score = 0;

            // 1. Bevorzugt WEITER WEG vom Zentrum (um den Radius zu erweitern)
            const center = getSettlementCenter(null);
            const distToCenter = Math.hypot(gx - center.x, gy - center.y);
            const oldDistToCenter = Math.hypot(g.gridX - center.x, g.gridY - center.y);
            const expansionGain = distToCenter - oldDistToCenter;
            score += expansionGain * 3;

            // 2. Maximale Abdeckung von Holz- und Stein-Nodes im neuen Radius
            let woodNodesInRange = 0;
            let stoneNodesInRange = 0;
            const checkRadius = CONFIG.GRENZE_RADIUS;

            // Prüfe alle NPC-Ressourcen-Nodes
            for (let node of npcResourceNodes) {
                const d = Math.hypot(gx - node.x, gy - node.y);
                if (d <= checkRadius) {
                    if (node.type === 'wood') woodNodesInRange++;
                    else if (node.type === 'stone') stoneNodesInRange++;
                }
            }

            // Prüfe auch ALLE Ressourcen-Felder auf der Karte (nicht nur NPC-Nodes)
            for (let y = Math.max(0, gy - checkRadius); y < Math.min(CONFIG.GRID_HEIGHT, gy + checkRadius + 1); y++) {
                for (let x = Math.max(0, gx - checkRadius); x < Math.min(CONFIG.GRID_WIDTH, gx + checkRadius + 1); x++) {
                    const d = Math.hypot(gx - x, gy - y);
                    if (d <= checkRadius) {
                        const terrainType = getTerrainType(x, y);
                        if (terrainType === 1) { // Wald
                            const existingNode = npcResourceNodes.some(n => n.x === x && n.y === y && n.type === 'wood');
                            if (!existingNode) woodNodesInRange += 0.3;
                        } else if (terrainType === 2) { // Stein
                            const existingNode = npcResourceNodes.some(n => n.x === x && n.y === y && n.type === 'stone');
                            if (!existingNode) stoneNodesInRange += 0.3;
                        }
                    }
                }
            }

            // Holz-Nodes stark gewichten (wichtigstes Ressource)
            score += woodNodesInRange * 8;
            score += stoneNodesInRange * 6;

            // 3. Bevorzuge Positionen mit vielen freien Feldern im neuen Radius
            let freeCells = 0;
            for (let dy = -checkRadius; dy <= checkRadius; dy++) {
                for (let dx = -checkRadius; dx <= checkRadius; dx++) {
                    const nx = gx + dx;
                    const ny = gy + dy;
                    if (nx < 0 || nx >= CONFIG.GRID_WIDTH || ny < 0 || ny >= CONFIG.GRID_HEIGHT) continue;
                    if (Math.hypot(dx, dy) > checkRadius) continue;
                    if (!isCellOccupied(nx, ny) && !isActiveResourceField(nx, ny)) {
                        freeCells++;
                    }
                }
            }
            score += freeCells * 0.5;

            // 4. Nicht zu nah an Spieler-Gebäuden (Sicherheitsabstand)
            let minDistToPlayer = Infinity;
            for (let pb of buildings) {
                const d = Math.hypot(gx - pb.gridX, gy - pb.gridY);
                if (d < minDistToPlayer) minDistToPlayer = d;
            }
            if (minDistToPlayer < 15) {
                score -= (15 - minDistToPlayer) * 5;
            }

            // 5. Bonus: Verbindet zwei bestehende Grenzen (wenn möglich)
            let connectsToOtherGrenze = false;
            for (let other of npcGrenzen) {
                if (other.id === g.id) continue;
                const d = Math.hypot(gx - other.gridX, gy - other.gridY);
                if (d <= other.radius + CONFIG.GRENZE_RADIUS) {
                    connectsToOtherGrenze = true;
                    break;
                }
            }
            if (connectsToOtherGrenze) score += 30;

            // Speichere beste Position
            if (score > bestScore) {
                bestScore = score;
                bestPos = {
                    x: gx,
                    y: gy,
                    woodNodes: Math.round(woodNodesInRange),
                    stoneNodes: Math.round(stoneNodesInRange),
                    score: Math.round(score)
                };
            }
        }
    }

    if (bestPos) {
        console.log(`🏗️ NPC Grenzposition gefunden: (${bestPos.x},${bestPos.y}) Score: ${bestPos.score} Holz: ${bestPos.woodNodes} Stein: ${bestPos.stoneNodes}`);
    }

    return bestPos;
}

    for (let type of types) {
        const resourceType = type === 'bauer' ? 'grain' : type === 'holzfaeller' ? 'wood' : 'stone';
        let freePlaces = 0;
        let totalChecked = 0;
        
        for (let g of npcGrenzen) {
            const radius = Math.floor(g.radius);
            
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    if (Math.hypot(dx, dy) > radius) continue;
                    
                    const gx = g.gridX + dx;
                    const gy = g.gridY + dy;
                    
                    if (gx < 1 || gx >= CONFIG.GRID_WIDTH - 1 || gy < 1 || gy >= CONFIG.GRID_HEIGHT - 1) continue;
                    if (isCellOccupied(gx, gy)) continue;
                    
                    const terrain = getTerrainType(gx, gy);
                    if (terrain === -1) continue;
                    if (type === 'bauer' && terrain !== 0) continue;
                    if (type === 'holzfaeller' && terrain !== 1) continue;
                    if (type === 'steinmetz' && terrain !== 2) continue;
                    
                    totalChecked++;
                    
                    // Prüfe Nodes
                    let nodeCount = 0;
                    const neighbors = getNeighborCells(gx, gy, 1);
                    
                    for (let n of neighbors) {
                        if (!isResourceFieldAvailable(n.x, n.y, resourceType)) continue;
                        
                        let isUsedByNode = false;
                        for (let node of npcResourceNodes) {
                            if (node.x === n.x && node.y === n.y && node.type === resourceType) {
                                isUsedByNode = true;
                                break;
                            }
                        }
                        if (isUsedByNode) continue;
                        
                        nodeCount++;
                    }
                    
                    if (nodeCount >= 3) {
                        freePlaces++;
                        if (freePlaces >= 1) break;
                    }
                }
                if (freePlaces >= 1) break;
            }
            if (freePlaces >= 1) break;
        }
        
        results[type] = {
            freePlaces: freePlaces,
            totalChecked: totalChecked,
            needsGrenze: freePlaces === 0
        };
        
        console.log(`📊 ${type.toUpperCase()}: ${freePlaces} freie Plätze (geprüft: ${totalChecked} Zellen) ${freePlaces === 0 ? '❌ GRENZE NÖTIG' : '✅ OK'}`);
    }
    
    // ===== GESAMTERGEBNIS =====
    const needsGrenze = results.bauer.needsGrenze || results.holzfaeller.needsGrenze || results.steinmetz.needsGrenze;
    console.log(`🎯 ERGEBNIS: ${needsGrenze ? '❌ GRENZE NÖTIG' : '✅ KEINE GRENZE NÖTIG'}`);
    console.log('=====================================');
    
    return needsGrenze;
}

// In npcBuildGrenze(), am Ende:
function npcBuildGrenze() {
    if (!npcCanAfford('grenze')) return false;

    const pos = findGrenzePositionForNPC();
    if (!pos) {
        console.log('❌ NPC: Keine passende Position für Grenzkontrolle gefunden!');
        return false;
    }

    // Einwohner abziehen
    let removed = 0;
    for (let v of npcVillagers) {
        if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < CONFIG.GRENZE_COST_VILLAGERS) {
            v.alive = false;
            const home = npcBuildings.find(b => b.id === v.homeId);
            if (home && home.residents > 0) home.residents -= 1;
            removed++;
        }
    }
    npcVillagers = npcVillagers.filter(v => v.alive);

    // Grenzkontrolle bauen
    const g = new Grenzkontrolle(nextNpcGrenzeId++, pos.x, pos.y, null, true);
    g.isUnderConstruction = true;
    g.constructionTimer = 0;
    g.constructionProgress = 0;
    g.waitingForBuilder = true;
    npcGrenzen.push(g);
    assignNpcBuilderToGrenze(g.id);

    // ===== COOLDOWN SETZEN (REDUZIERT VON 90 AUF 20 SEKUNDEN) =====
    npcGrenzeCooldown = 20;

    const nodeInfo = pos.woodNodes !== undefined ? ` (Holz:${pos.woodNodes} Stein:${pos.stoneNodes})` : '';
    showTemporaryMessage(`🤖 NPC baut Grenzkontrolle bei (${pos.x},${pos.y})${nodeInfo}`, '#4a235a', true);
    markDirty();
    return true;
}
