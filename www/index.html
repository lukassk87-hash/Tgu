                            }
                        }
                        if (nv.carrying === 'grain') npcResources.grain += 1;
                        if (nv.carrying === 'wood') npcResources.wood += 1;
                        if (nv.resourceTarget) {
                            const node = npcResourceNodes.find(r => r.id === nv.resourceTarget.id);
                            if (node && node.claimedBy === nv.id) node.claimedBy = null;
                            nv.resourceTarget = null;
                        }
                        if (nv.isBuilding && nv.buildingTarget) {
                            const building = npcBuildings.find(b => b.id === nv.buildingTarget);
                            if (building && building.isUnderConstruction) {
                                building.builder = null;
                                building.waitingForBuilder = true;
                            }
                            nv.isBuilding = false;
                            nv.buildingTarget = null;
                        }
                        const home = npcBuildings.find(b => b.id === nv.homeId);
                        if (home && home.residents > 0) home.residents -= 1;
                        nv.alive = false;
                        SoundFX.playIfVisible(nv.x, nv.y, 'villagerDie');
                    }
                    nv.combatCooldown = 2.0;
                    if (target.alive) target.combatCooldown = 2.0;
                    markDirty();
                }
            } else {
                nv.targetX = target.x;
                nv.targetY = target.y;
            }
        }
    }

    // --- Kämpfe für Spieler 2 (nur Split-Modus) ---
    if (SPLIT_SCREEN) {
        for (let p2v of allPlayer2Villagers) {
            if (!p2v.alive || !p2v.isAttacking || !p2v.attackTarget) continue;
            const target = p2v.attackTarget;

            if (!target.alive) {
                let newTarget = null;
                let newDistSq = Infinity;
                const neighborKeys = getNeighborKeys(p2v.x, p2v.y, 2);

                for (let key of neighborKeys) {
                    const list = playerGrid.get(key);
                    if (list) {
                        for (let pv of list) {
                            if (!pv.alive) continue;
                            const d2 = dist2(p2v, pv);
                            if (d2 < combatRangeSq && d2 < newDistSq) {
                                newDistSq = d2;
                                newTarget = pv;
                            }
                        }
                    }
                }

                for (let key of neighborKeys) {
                    const list = enemyGrid.get(key);
                    if (list) {
                        for (let e of list) {
                            if (!e.alive) continue;
                            const d2 = dist2(p2v, e);
                            if (d2 < combatRangeSq && d2 < newDistSq) {
                                newDistSq = d2;
                                newTarget = e;
                            }
                        }
                    }
                }

                if (newTarget) {
                    p2v.attackTarget = newTarget;
                    p2v.targetX = newTarget.x;
                    p2v.targetY = newTarget.y;
                } else {
                    p2v.isAttacking = false;
                    p2v.attackTarget = null;
                    p2v.state = 'idle';
                    p2v.hasTask = false;
                }
                continue;
            }

            const d2 = dist2(p2v, target);
            if (d2 < 64) {
                if (p2v.combatCooldown <= 0) {
                    const isEnemy = target.hits !== undefined;
                    if (Math.random() < 0.5) {
                        if (isEnemy) {
                            target.alive = false;
                            createHitEffect(target.x, target.y, target.isSuper);
                            SoundFX.playIfVisible(target.x, target.y, 'enemyDeath');
                            showTemporaryMessage('⚔️ Feind besiegt!', '#ff6b6b');
                        } else {
                            // Spieler 1 Einwohner töten
                            if (target.carrying === 'stone' || target.isDeliveringStone) {
                                resources.stone += (target.stoneToDeliver || 0);
                                if (target.towerTarget) {
                                    target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                                }
                            }
                            if (target.carrying === 'grain') resources.grain += 1;
                            if (target.carrying === 'wood') resources.wood += 1;
                            if (target.resourceTarget) {
                                const node = resourceNodes.find(r => r.id === target.resourceTarget.id);
                                if (node && node.claimedBy === target.id) node.claimedBy = null;
                                target.resourceTarget = null;
                            }
                            if (target.isBuilding && target.buildingTarget) {
                                const building = buildings.find(b => b.id === target.buildingTarget);
                                if (building && building.isUnderConstruction) {
                                    building.builder = null;
                                    building.waitingForBuilder = true;
                                }
                                target.isBuilding = false;
                                target.buildingTarget = null;
                            }
                            killVillager(target);
                            SoundFX.playIfVisible(target.x, target.y, 'villagerDie');
                            showTemporaryMessage('⚔️ Spieler 1 Einwohner besiegt!', '#ff6b6b');
                        }
                    } else {
                        // Spieler 2 stirbt
                        if (p2v.carrying === 'stone' || p2v.isDeliveringStone) {
                            player2Resources.stone += (p2v.stoneToDeliver || 0);
                            if (p2v.towerTarget) {
                                p2v.towerTarget.reservedStone = Math.max(0, p2v.towerTarget.reservedStone - (p2v.stoneToDeliver || 0));
                            }
                        }
                        if (p2v.carrying === 'grain') player2Resources.grain += 1;
                        if (p2v.carrying === 'wood') player2Resources.wood += 1;
                        if (p2v.resourceTarget) {
                            const node = player2ResourceNodes.find(r => r.id === p2v.resourceTarget.id);
                            if (node && node.claimedBy === p2v.id) node.claimedBy = null;
                            p2v.resourceTarget = null;
                        }
                        if (p2v.isBuilding && p2v.buildingTarget) {
                            const building = player2Buildings.find(b => b.id === p2v.buildingTarget);
                            if (building && building.isUnderConstruction) {
                                building.builder = null;
                                building.waitingForBuilder = true;
                            }
                            p2v.isBuilding = false;
                            p2v.buildingTarget = null;
                        }
                        const home = player2Buildings.find(b => b.id === p2v.homeId);
                        if (home && home.residents > 0) home.residents -= 1;
                        p2v.alive = false;
                        SoundFX.playIfVisible(p2v.x, p2v.y, 'villagerDie');
                        showTemporaryMessage('⚔️ Spieler 2 Einwohner besiegt!', '#ff6b6b');
                    }
                    p2v.combatCooldown = 2.0;
                    if (target.alive) target.combatCooldown = 2.0;

                p2v.targetX = target.x;

    // ===== COOLDOWNS REDUZIEREN =====
    for (let v of villagers) {

    // ============================================================
    // 3. GEBÄUDE-EROBERUNG (NUR IM KRIEG)

    const captureRange = getCurrentCombatRange() * CONFIG.CELL_SIZE;

                if (enemiesNearby) {

                    nb.beingCaptured = false;
                    nb.capturedBy = null;
                    for (let v of villagersOnBuilding) {

                            v.captureTargetId = null;

                        if (v.captureTargetId === nb.id) {

                            v.hasTask = false;

                        nb.captureProgress = Math.min(1, ct.timer / CONFIG.CAPTURE_TIME);

                            const idx = npcBuildings.indexOf(nb);
                            if (idx !== -1) {
                                const captured = npcBuildings.splice(idx, 1)[0];
                                captured.isNPC = false;
                                captured.id = nextBuildingId++;
                                captured.captureProgress = 0;
                                captured.beingCaptured = false;
                                captured.capturedBy = null;

                                    if (v.isDeliveringStone && v.towerTarget === nb) {
                                        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                                        if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
                                        v.isDeliveringStone = false;
                                        v.carrying = null;
                                        v.towerTarget = null;
                                        v.stoneToDeliver = 0;
                                        v.hasReservedStone = false;
                                        v.state = 'idle';
                                        v.hasTask = false;
                                    }
                                    if (v.isBuilding && v.buildingTarget === nb.id) {
                                        v.isBuilding = false;
                                        v.buildingTarget = null;
                                        v.state = 'idle';
                                        v.hasTask = false;
                                        const site = constructionSites[nb.id];
                                        if (site) {

                                            delete constructionSites[nb.id];
                                        }
                                        nb.builder = null;
                                        nb.waitingForBuilder = true;
                                    }
                                }

                                for (let v of npcVillagers) {
                                    if (!v.alive) continue;
                                    if (v.state === 'movingToCapture' && v.captureTargetId === nb.id) {
                                        v.state = 'idle';

                                    }
                                    if (v.isDeliveringStone && v.towerTarget === nb) {
                                        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                                        if (v.carrying === 'stone') npcResources.stone += (v.stoneToDeliver || 0);
                                        v.isDeliveringStone = false;
                                        v.carrying = null;
                                        v.towerTarget = null;
                                        v.stoneToDeliver = 0;
                                        v.hasReservedStone = false;
                                        v.state = 'idle';
                                        v.hasTask = false;
                                    }
                                    if (v.isBuilding && v.buildingTarget === nb.id) {
                                        v.isBuilding = false;
                                        v.buildingTarget = null;
                                        v.state = 'idle';
                                        v.hasTask = false;
                                        const site = constructionSites[nb.id];
                                        if (site) {

                                        nb.waitingForBuilder = true;
                                    }
                                }

                                    for (let v of npcVillagers) {
                                        if (v.alive && v.towerTarget === captured) {
                                            captured.reservedStone = Math.max(0, captured.reservedStone - (v.stoneToDeliver || 0));
                                            if (v.carrying === 'stone') npcResources.stone += (v.stoneToDeliver || 0);
                                            v.isDeliveringStone = false;
                                            v.carrying = null;
                                            v.towerTarget = null;
                                            v.stoneToDeliver = 0;
                                            v.hasReservedStone = false;
                                            v.state = 'idle';
                                            v.hasTask = false;
                                        }
                                    }
                                }

                                buildings.push(captured);

                                const npcResidents = npcVillagers.filter(v => v.homeId === nb.id && v.alive);
                                for (let v of npcResidents) {
                                    v.homeId = captured.id;
                                    v.isNPC = false;
                                    v.carrying = null;
                                    v.state = 'idle';
                                    v.hasTask = false;
                                    v.isAttacking = false;
                                    v.attackTarget = null;
                                    v.resourceTarget = null;
                                    v.isDeliveringStone = false;
                                    v.isBuilding = false;
                                    v.buildingTarget = null;
                                    v.towerTarget = null;
                                    v.stoneToDeliver = 0;
                                    v.hasReservedStone = false;
                                    v.deliveryTarget = null;
                                    v.combatCooldown = 0;
                                    if (v.captureTargetId) v.captureTargetId = null;
                                }
                                npcVillagers = npcVillagers.filter(v => v.isNPC);
                                villagers.push(...npcResidents);

                                if (captured.isUnderConstruction) {
                                    captured.builder = null;
                                    captured.waitingForBuilder = true;
                                    assignBuilderToConstruction(captured.id);
                                }

                                for (let v of villagersOnBuilding) {
                                    if (v.state === 'movingToCapture') {
                                        v.state = 'idle';
                                        v.hasTask = false;
                                        v.captureTargetId = null;
                                    }
                                }

                                transferResourceNodes(captured, true);

                                SoundFX.playIfVisible(buildingCenterX, buildingCenterY, 'capture');
                                showTemporaryMessage('🏰 NPC-Gebäude erobert!', '#ffd966');
                                delete captureTimers[key];
                                markDirty();
                            }
                        }
                    } else {
                        ct.timer = 0;
                        ct.lastOccupiedBy = 'player';
                        ct.occupiedSince = Date.now();
                        nb.captureProgress = 0;
                        nb.capturedBy = 'player';
                    }
                } else {
                    if (captureTimers[key]) {
                        const ct = captureTimers[key];
                        ct.timer = Math.max(0, ct.timer - dt * 2);
                        if (ct.timer <= 0) {
                            nb.captureProgress = 0;
                            nb.beingCaptured = false;
                            nb.capturedBy = null;
                            delete captureTimers[key];
                        }
                    }
                }
            }

            // Spieler-Gebäude von NPC erobern
            for (let pb of [...buildings]) {
                const buildingCenterX = pb.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const buildingCenterY = pb.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const key = 'capture_' + pb.id;

                const nearbyNPCVillagers = cachedNpcVillagers.filter(v =>
                    v.alive && !v.isAttacking && dist(v, { x: buildingCenterX, y: buildingCenterY }) < captureRange
                );
                const npcVillagersOnBuilding = nearbyNPCVillagers.filter(v =>
                    dist(v, { x: buildingCenterX, y: buildingCenterY }) < 5
                );
                const enemiesNearby = enemies.some(e =>
                    e.alive && dist(e, { x: buildingCenterX, y: buildingCenterY }) < captureRange
                );

                if (enemiesNearby) {
                    if (captureTimers[key]) delete captureTimers[key];
                    pb.captureProgress = 0;
                    pb.beingCaptured = false;
                    pb.capturedBy = null;
                    for (let v of npcVillagersOnBuilding) {
                        if (v.state === 'movingToCapture') {
                            v.state = 'idle';
                            v.hasTask = false;
                            v.captureTargetId = null;
                        }
                        if (v.captureTargetId === pb.id) {
                            v.captureTargetId = null;
                            v.hasTask = false;
                        }
                    }
                    continue;
                }

                for (let v of nearbyNPCVillagers) {
                    if (!npcVillagersOnBuilding.includes(v) && v.state === 'idle' && !v.hasTask) {
                        v.targetX = buildingCenterX;
                        v.targetY = buildingCenterY;
                        v.state = 'movingToCapture';
                        v.hasTask = true;
                        v.captureTargetId = pb.id;
                    }
                }

                const numCapturers = npcVillagersOnBuilding.length;
                if (numCapturers > 0) {
                    if (!captureTimers[key]) {
                        captureTimers[key] = { timer: 0, lastOccupiedBy: 'npc', occupiedSince: Date.now() };
                    }
                    const ct = captureTimers[key];
                    if (ct.lastOccupiedBy === 'npc') {
                        ct.timer += dt * numCapturers;
                        pb.captureProgress = Math.min(1, ct.timer / CONFIG.CAPTURE_TIME);
                        pb.beingCaptured = true;
                        pb.capturedBy = 'npc';

                        if (ct.timer >= CONFIG.CAPTURE_TIME) {
                            const idx = buildings.indexOf(pb);
                            if (idx !== -1) {
                                const captured = buildings.splice(idx, 1)[0];
                                captured.isNPC = true;
                                captured.id = nextBuildingId++;
                                captured.captureProgress = 0;
                                captured.beingCaptured = false;
                                captured.capturedBy = null;

                                for (let v of villagers) {
                                    if (!v.alive) continue;
                                    if (v.state === 'movingToCapture' && v.captureTargetId === pb.id) {
                                        v.state = 'idle';
                                        v.hasTask = false;
                                        v.captureTargetId = null;
                                        v.targetX = v.x;
                                        v.targetY = v.y;
                                    }
                                    if (v.isDeliveringStone && v.towerTarget === pb) {
                                        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                                        if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
                                        v.isDeliveringStone = false;
                                        v.carrying = null;
                                        v.towerTarget = null;
                                        v.stoneToDeliver = 0;
                                        v.hasReservedStone = false;
                                        v.state = 'idle';
                                        v.hasTask = false;
                                    }
                                    if (v.isBuilding && v.buildingTarget === pb.id) {
                                        v.isBuilding = false;
                                        v.buildingTarget = null;
                                        v.state = 'idle';
                                        v.hasTask = false;
                                        const site = constructionSites[pb.id];
                                        if (site) {
                                            site.builder = null;
                                            delete constructionSites[pb.id];
                                        }
                                        pb.builder = null;
                                        pb.waitingForBuilder = true;
                                    }
                                }

                                for (let v of npcVillagers) {
                                    if (!v.alive) continue;
                                    if (v.state === 'movingToCapture' && v.captureTargetId === pb.id) {
                                        v.state = 'idle';
                                        v.hasTask = false;
                                        v.captureTargetId = null;
                                        v.targetX = v.x;
                                        v.targetY = v.y;
                                    }
                                    if (v.isDeliveringStone && v.towerTarget === pb) {
                                        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                                        if (v.carrying === 'stone') npcResources.stone += (v.stoneToDeliver || 0);
                                        v.isDeliveringStone = false;

                                npcBuildings.push(captured);

                                const playerResidents = villagers.filter(v => v.homeId === pb.id && v.alive);
                                for (let v of playerResidents) {
                                    v.homeId = captured.id;
                                    v.isNPC = true;
                                    v.carrying = null;
                                    v.state = 'idle';

                                    v.isAttacking = false;
                                    v.attackTarget = null;

                                    v.buildingTarget = null;

                                npcVillagers.push(...playerResidents);

                                delete captureTimers[key];
                                markDirty();
                            }
                        }
                    } else {

                        ct.lastOccupiedBy = 'npc';
                        ct.occupiedSince = Date.now();
                        pb.captureProgress = 0;
                        pb.capturedBy = 'npc';
                    }
                } else {
                    if (captureTimers[key]) {

                        ct.timer = Math.max(0, ct.timer - dt * 2);
                        if (ct.timer <= 0) {

                            pb.beingCaptured = false;
                            pb.capturedBy = null;
                            delete captureTimers[key];

                    }

        }

        // --- Split-Modus: Spieler vs Spieler 2 ---
        if (SPLIT_SCREEN) {
            // Spieler 2 Gebäude von Spieler 1 erobern
            for (let p2b of [...player2Buildings]) {
                const buildingCenterX = p2b.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const buildingCenterY = p2b.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const key = 'capture_p2_' + p2b.id;

                const nearbyPlayerVillagers = cachedPlayerVillagers.filter(v =>

                );
                const villagersOnBuilding = nearbyPlayerVillagers.filter(v =>

// =========================================================================
//  HILFSFUNKTIONEN FÜR RESSOURCEN-TRANSFER (NPC ↔ SPIELER)
// =========================================================================

function transferResourceNodes(building, fromNPCtoPlayer) {
    if (building.type !== 'bauer' && building.type !== 'holzfaeller' && building.type !== 'steinmetz') return;
    if (building.isUnderConstruction) return;

    const resourceType = building.productionType;
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  getSteinmetzFields(building);

    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));

    // Quell- und Ziel-Nodes bestimmen
    let sourceNodes, targetNodes, targetMap, targetPositionMap, nextIdRef;
    if (fromNPCtoPlayer) {
        sourceNodes = npcResourceNodes;
        targetNodes = resourceNodes;
        targetMap = resourceNodeMap;
        targetPositionMap = resourceNodeByPosition;
        nextIdRef = 'nextResourceId';
    } else {
        sourceNodes = resourceNodes;
        targetNodes = npcResourceNodes;
        targetMap = npcResourceNodeMap;
        targetPositionMap = npcResourceNodeByPosition;
        nextIdRef = 'nextNpcResourceId';
    }

    // Nodes von Quelle entfernen
    for (let i = sourceNodes.length - 1; i >= 0; i--) {
        const node = sourceNodes[i];
        if (fieldSet.has(node.x + ',' + node.y) && node.type === resourceType) {
            if (node.claimedBy) {
                const villager = (fromNPCtoPlayer ? villagers : npcVillagers).find(v => v.id === node.claimedBy);
                if (villager) {
                    villager.resourceTarget = null;
                    villager.state = 'idle';
                    villager.hasTask = false;
                }
            }
            sourceNodes.splice(i, 1);
        }
    }

    // Nodes zum Ziel hinzufügen
    for (let f of fields) {
        const key = `${f.x},${f.y},${resourceType}`;
        const existing = targetPositionMap.get(key);
        if (!existing) {
            const newNode = {
                id: (fromNPCtoPlayer ? nextResourceId++ : nextNpcResourceId++),
                x: f.x,
                y: f.y,
                type: resourceType,
                timer: 0,
                maxTimer: building.maxProductionTime,
                ready: false,
                claimedBy: null,
                isNPC: !fromNPCtoPlayer
            };
            targetNodes.push(newNode);
            targetMap.set(newNode.id, newNode);
            targetPositionMap.set(key, newNode);
        } else {
            existing.timer = 0;
            existing.ready = false;
            existing.maxTimer = building.maxProductionTime;
            existing.claimedBy = null;
        }
    }

    rebuildResourceMaps();
    refreshPlayerResourceCache();
    refreshNpcResourceCache();
    markDirty();
}

    // Nodes zu Spieler 2 hinzufügen
    for (let f of fields) {
        const key = `${f.x},${f.y},${resourceType}`;
        const existing = player2ResourceNodeByPosition.get(key);
        if (!existing) {
            const newNode = {
                id: player2NextResourceId++,
                x: f.x,
                y: f.y,
                type: resourceType,
                timer: 0,
                maxTimer: building.maxProductionTime,
                ready: false,
                claimedBy: null,
                isNPC: false
            };
            player2ResourceNodes.push(newNode);
            player2ResourceNodeMap.set(newNode.id, newNode);
            player2ResourceNodeByPosition.set(key, newNode);
        } else {
            existing.timer = 0;
            existing.ready = false;
            existing.maxTimer = building.maxProductionTime;
            existing.claimedBy = null;
        }
    }

    rebuildResourceMaps();
    refreshPlayerResourceCache();
    refreshPlayer2ResourceCache();
    markDirty();
}

function clearPlayerVillagerTasks(v) {

// ===== SPIELER 1 WIRTSCHAFT =====
function updateEconomyPlayer1(dt) {
    // Häuser: Getreide verbrauchen und Einwohner wachsen lassen
    buildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {
        h.grainConsumeTimer += dt;
        while (h.grainConsumeTimer >= 15) {
            h.grainConsumeTimer -= 15;
            if (resources.grain > 0) {
                resources.grain -= 1;
            } else {
                h.growthTimer = 0;
            }
        }
        if (resources.grain > 0 && h.residents < h.maxResidents) {
            h.growthTimer += dt;
            if (h.growthTimer >= 30) {
                h.growthTimer -= 30;
                h.residents += 1;
                spawnVillager(h.id);
            }
        } else if (resources.grain <= 0) {
            h.growthTimer = 0;
        }
    });
}

// ===== SPIELER 2 WIRTSCHAFT =====
function updateEconomyPlayer2(dt) {
    player2Buildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {
        h.grainConsumeTimer += dt;
        while (h.grainConsumeTimer >= 15) {

// ===== NPC WIRTSCHAFT (UNVERÄNDERT) =====
function updateEconomyNPC(dt) {
    const totalNPCAlive = npcVillagers.filter(v => v.alive).length;
    npcBuildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {
        h.grainConsumeTimer += dt;
        while (h.grainConsumeTimer >= 15) {
            h.grainConsumeTimer -= 15;
            if (npcResources.grain > 0) {
                npcResources.grain -= 1;
            } else {
                h.growthTimer = 0;
            }
        }
        if (npcResources.grain > 0 && h.residents < h.maxResidents) {
            h.growthTimer += dt;
            if (h.growthTimer >= 30) {
                h.growthTimer -= 30;
                h.residents += 1;
                const v = new Villager(nextVillagerId++, h.id, true);
                const cx = h.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const cy = h.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.x = cx;
                v.y = cy;
                v.targetX = cx;
                v.targetY = cy;
                v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
                npcVillagers.push(v);
                markNpcCacheDirty();
            }
        } else if (totalNPCAlive === 0 && h.residents < h.maxResidents) {
            // Notfall: wenn alle NPC-Einwohner tot sind, aber Haus noch Platz hat
            h.growthTimer += dt;
            if (h.growthTimer >= 30) {
                h.growthTimer -= 30;
                h.residents += 1;
                const v = new Villager(nextVillagerId++, h.id, true);
                const cx = h.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const cy = h.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.x = cx;
                v.y = cy;
                v.targetX = cx;
                v.targetY = cy;
                v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
                npcVillagers.push(v);
                showTemporaryMessage('🤖 NPC-Notfall-Einwohner erschienen!', '#9b59b6');
                markNpcCacheDirty();
            }
        } else if (npcResources.grain <= 0 && totalNPCAlive > 0) {
            h.growthTimer = 0;
        }
    });
}

let playerCacheVersion = 0;
let npcCacheVersion = 0;
let cachedPlayerFreeCount = -1; // Hilfsvariable zum Vergleich

// Wird aufgerufen, wenn sich die Liste der Villager ändert (Geburt/Tod)
function markPlayerCacheDirty() {
    cacheNeedsRefresh = true;
}

function refreshPlayerVillagerCache() {
    const aliveVillagers = villagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    // Zusätzlich: Anzahl der aktuell freien Villager berechnen
    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    // Nur neu aufbauen, wenn sich die Anzahl der lebenden oder der freien Villager geändert hat
    if (cachedPlayerAliveIds.size === aliveCount && cachedPlayerFreeCount === freeCount && cacheNeedsRefresh === false) {
        return; // keine Änderung
    }

    try {
        cachedPlayerVillagers = aliveVillagers;
        cachedPlayerAliveIds = aliveIds;
        cachedPlayerFreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedPlayerFreeCount = cachedPlayerFreeVillagers.length;
        cacheNeedsRefresh = false;
    } catch(e) {
        cachedPlayerVillagers = [];
        cachedPlayerFreeVillagers = [];
        cachedPlayerAliveIds = new Set();
        cachedPlayerFreeCount = 0;
    }
}

function refreshPlayerResourceCache() {
    try {
        cachedPlayerResourceNodes = resourceNodes.slice();
        cachedPlayerAvailableNodes = cachedPlayerResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedPlayerResourceNodes = [];
        cachedPlayerAvailableNodes = [];
    }
}

function markCacheDirty() {
    cacheNeedsRefresh = true;
}

function getNeededBuildersSpieler() {
  let needed = 0;
  for (let b of buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleArrival(v, home) {
    if (v.state === 'movingToResource' && v.resourceTarget) {
        const node = cachedPlayerResourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.ready && node.claimedBy === v.id) {
            // Ressource abholen
            if (node.type === 'grain') resources.grain += 1;
            else if (node.type === 'wood') resources.wood += 1;
            else if (node.type === 'stone') resources.stone += 1;

            // NODE ZURÜCKSETZEN, NICHT LÖSCHEN!
            const originalNode = resourceNodes.find(r => r.id === node.id);
            if (originalNode) {
                originalNode.timer = 0;
                originalNode.ready = false;
                originalNode.claimedBy = null;
            }
            
            v.carrying = node.type;
            v.deliveryTarget = null;
            refreshPlayerResourceCache();
            markDirty();
        } else {
            v.state = 'idle';
            v.resourceTarget = null;
            v.hasTask = false;
            if (node && node.claimedBy === v.id) {
                node.claimedBy = null;
            }
            return;
        }
        v.resourceTarget = null;
        v.state = 'returningHome';

        refreshLagerCache();

        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);

        if (!lager) {
            for (let b of buildings) {
                if (b.type === 'lager') {
                    lager = b;
                    break;
                }
            }
        }

        if (lager) {
            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        } else {
            v.alive = false;
            v.carrying = null;
            v.state = 'idle';
            v.hasTask = false;
            showTemporaryMessage('💀 KEIN LAGER! DEINE SIEDLUNG IST ZUSAMMENGEBROCHEN!', '#ff0000');
            gameOver = true;
            document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
            document.getElementById('gameOverSub').textContent = 'Kein Lager - Deine Siedlung ist zusammengebrochen!';
            document.getElementById('gameOverOverlay').style.display = 'flex';
            return;
        }
    } else if (v.state === 'returningHome' && v.carrying) {
        v.carrying = null;
        v.state = 'idle';
        v.resourceTarget = null;
        v.hasTask = false;
        v.deliveryTarget = null;
        const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                          y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
        v.targetX = homePos.x;
        v.targetY = homePos.y;
    }
}

let lastPlayerVillagerHitTime = 0;

// =========================================================================
//  MODUL 12c: EINWOHNER-KI (Spieler) - MIT GETREIDE-PRIORITÄT – KORRIGIERT
//  FIX: movingToCapture State wurde nicht behandelt
// =========================================================================

function updateVillagers(dt) {
    // === NEU: Caches VOR der Aufgabenverteilung aktualisieren ===
    refreshPlayerVillagerCache();
    refreshPlayerResourceCache();
    refreshLagerCache();

    // === NEU: Tote Einwohner aus Ressourcen-Nodes entfernen ===
    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // === NEU: Tote Einwohner aus Turm-Reservierungen entfernen ===
    for (let tower of buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    // === NEU: Tote Einwohner aus Bauaufträgen entfernen ===
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.isNPC) continue;
        const building = buildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = villagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // === NEU: Hängengebliebene Capture-Aufgaben bereinigen ===
    for (let v of villagers) {
        if (v.alive && v.state === 'movingToCapture') {
            let targetBuilding = null;
            // Prüfe NPC Gebäude
            if (!SPLIT_SCREEN) {
                targetBuilding = npcBuildings.find(b => b.id === v.captureTargetId);
            }
            // Prüfe Spieler 2 Gebäude (Split-Modus)
            if (!targetBuilding && SPLIT_SCREEN) {
                targetBuilding = player2Buildings.find(b => b.id === v.captureTargetId);
            }
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    // ===== AB HIER DER BESTEHENDE CODE =====
    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) node.claimedBy = null;
    }

    villagers = cachedPlayerVillagers.slice();

    // Stein-Overflow korrigieren
    for (let building of buildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            resources.stone += overflow;
        }
    }

    const neededBuilders = getNeededBuildersSpieler();
    const freeForTasks = cachedPlayerFreeVillagers.slice(neededBuilders);

    const now = performance.now() / 1000;
    const stonePriority = (now - lastPlayerVillagerHitTime < 10);

    // ============================================================
    // 1. GETREIDE-PRIORITÄT: Wenn Getreide < 50, PRIORISIERE GETREIDE
    // ============================================================
    const hasGrainNodes = cachedPlayerAvailableNodes.some(n => n.type === 'grain');
    const grainPriority = (resources.grain < 50 && hasGrainNodes);

    // ============================================================
    // 2. STEINLIEFERUNG - IMMER, aber bei Getreideknappheit auf 20% der Freien begrenzt
    // ============================================================
    const towersNeedingStone = buildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = cachedPlayerFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    // Anzahl der freien Einwohner
    const totalFree = freeForStone.length;

    // Maximal 20% der freien Einwohner für Steinlieferung, bei Getreideknappheit
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && resources.stone > 0 && totalFree > 0) {
        // Bereits unterwegs zählen
        const currentlyDelivering = cachedPlayerVillagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, resources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || resources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                for (let i = 0; i < canSend; i++) {
                    if (resources.stone <= 0) break;
                    let closestVillager = null, closestDist = Infinity;
                    for (let v of freeForStone) {
                        if (v.hasTask || v.isDeliveringStone) continue;
                        const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
                        if (d < closestDist) { closestDist = d; closestVillager = v; }
                    }
                    if (closestVillager) {
                        tower.reservedStone += 1;
                        resources.stone -= 1;
                        const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE);
                        if (lager) {
                            closestVillager.state = 'movingToLagerForStone';
                            closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.hasTask = true;
                            closestVillager.isDeliveringStone = true;
                            closestVillager.towerTarget = tower;
                            closestVillager.stoneToDeliver = 1;
                            closestVillager.hasReservedStone = true;
                            freeForStone = freeForStone.filter(v => v.id !== closestVillager.id);
                        } else {
                            resources.stone += 1;
                            tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                        }
                    }
                }
            }
        }
    }

    // ============================================================
    // 3. RESSOURCEN SAMMELN - GETREIDE HAT PRIORITÄT (aber NICHT ausschließlich!)
    // ============================================================

    const freeForTasksAfterStone = cachedPlayerFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    if (cachedPlayerAvailableNodes.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            let sortedNodes;
            if (grainPriority) {
                sortedNodes = [...cachedPlayerAvailableNodes].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...cachedPlayerAvailableNodes].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            } else {
                sortedNodes = cachedPlayerAvailableNodes;
            }

            for (let node of sortedNodes) {
                if (!node.ready || node.claimedBy) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - node.x * CONFIG.CELL_SIZE, v.y - node.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'movingToResource';
                    closestVillager.targetX = node.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = node.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                }
            }
        }
    }

    // ============================================================
    // 4. BEWEGUNG FÜR ALLE EINWOHNER
    // ============================================================

    const villagersToUpdate = cachedPlayerVillagers.slice();

    for (let v of villagersToUpdate) {
        const home = buildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        // === FIX 1: Attacking-Check mit State-Reset ===
        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // === FIX 2: movingToCapture BEHANDELN (NEU - war der Fehler!) ===
        if (v.state === 'movingToCapture') {
            // Prüfe ob das Ziel-Gebäude noch existiert
            let targetBuilding = null;
            if (!SPLIT_SCREEN) {
                targetBuilding = npcBuildings.find(b => b.id === v.captureTargetId);
            }
            if (!targetBuilding && SPLIT_SCREEN) {
                targetBuilding = player2Buildings.find(b => b.id === v.captureTargetId);
            }
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            // Bewege zum Ziel
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // === FIX 3: Attacking mit State-Reset ===
        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // === FIX 4: Building mit State-Reset ===
        if (v.isBuilding && v.buildingTarget) {
            const building = buildings.find(b => b.id === v.buildingTarget);
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        if (v.isAttacking) continue;

        // === FIX 5: Steinlieferant mit State-Reset ===
        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                if (lager) {
                    const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                    const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && buildings.includes(v.towerTarget) && !v.towerTarget.isUnderConstruction && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            resources.stone += toDeliver;
                            if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                            v.state = 'idle';
                            v.hasTask = false;
                            v.isDeliveringStone = false;
                            v.towerTarget = null;
                            v.stoneToDeliver = 0;
                            v.hasReservedStone = false;
                            v.carrying = null;
                        }
                    } else {
                        const step = Math.min(distance, v.speed * dt);
                        v.x += (dx / distance) * step;
                        v.y += (dy / distance) * step;
                    }
                } else {
                    // Kein Lager - State zurücksetzen
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                if (!tower || !buildings.includes(tower) || tower.isUnderConstruction || tower.stoneAmmo >= tower.maxStoneAmmo) {
                    resources.stone += (v.stoneToDeliver || 0);
                    if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    continue;
                }
                const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            resources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        // === ROHSTOFFTRÄGER ===
        if (v.carrying !== null && !v.isDeliveringStone) {
            if (v.state !== 'returningHome') {
                v.state = 'returningHome';
                const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY);
                if (lager) {
                    v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                } else {
                    v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
                v.resourceTarget = null;
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'returningHome') handleArrival(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedPlayerResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        // === IDLE-BEWEGUNG ===
        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { v.targetX = homePos.x;
                v.targetY = homePos.y; }
        }

        // === BEWEGUNG ===
        if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY);
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'movingToResource' || v.state === 'returningHome') handleArrival(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
        }
    }

    // ===== AM ENDE: CACHES AKTUALISIEREN =====
    villagers = villagers.filter(v => v.alive);

    refreshPlayerVillagerCache();
    refreshPlayerResourceCache();
    refreshLagerCache();

    // === TOTE EINWOHNER AUS RESSOURCEN-NODES ENTFERNEN ===
    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // === TOTE EINWOHNER AUS TURM-RESERVIERUNGEN ENTFERNEN ===
    for (let tower of buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    markDirty();
}

// =========================================================================
//  MODUL 12.5a: CACHE-FUNKTIONEN (Spieler 2)
//  Exakte Kopie von Modul 12a, aber mit player2-Variablen
// =========================================================================

let player2CacheVersion = 0;
let cachedPlayer2FreeCount = -1;

function markPlayer2CacheDirty() {
    cacheNeedsRefreshP2 = true;
}

function refreshPlayer2VillagerCache() {
    const aliveVillagers = player2Villagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    if (cachedPlayer2AliveIds.size === aliveCount && cachedPlayer2FreeCount === freeCount && cacheNeedsRefreshP2 === false) {
        return;
    }

    try {
        cachedPlayer2Villagers = aliveVillagers;
        cachedPlayer2AliveIds = aliveIds;
        cachedPlayer2FreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedPlayer2FreeCount = cachedPlayer2FreeVillagers.length;
        cacheNeedsRefreshP2 = false;
    } catch(e) {
        cachedPlayer2Villagers = [];
        cachedPlayer2FreeVillagers = [];
        cachedPlayer2AliveIds = new Set();
        cachedPlayer2FreeCount = 0;
    }
}

function refreshPlayer2ResourceCache() {
    try {
        cachedPlayer2ResourceNodes = player2ResourceNodes.slice();
        cachedPlayer2AvailableNodes = cachedPlayer2ResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedPlayer2ResourceNodes = [];
        cachedPlayer2AvailableNodes = [];
    }
}
