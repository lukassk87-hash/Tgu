// ===== UPGRADE BUILDING (SPIELER 2) =====
function upgradeBuildingPlayer2(building) {
    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (player2Resources.wood < cost.wood || player2Resources.stone < cost.stone) return false;
    player2Resources.wood -= cost.wood;
    player2Resources.stone -= cost.stone;

    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) :
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of player2ResourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
            showTemporaryMessage(`⬆️ Turm (P2) Reichweite auf ${building.range} erhöht!`, '#ffd966');
        }
        showTemporaryMessage(`⬆️ Turm (P2) Kapazität auf ${building.maxStoneAmmo} erhöht!`, '#ffd966');
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    }

    markDirty('buildings');
    return true;
}

        });
        showTemporaryMessage(`📤 Upgrade-Befehl an Host gesendet (ID: ${building.id})`, '#ffd966');
        return true;
    }

    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
    resources.wood -= cost.wood;
    resources.stone -= cost.stone;

    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) :
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of resourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
            showTemporaryMessage(`⬆️ Turm Reichweite auf ${building.range} erhöht!`, '#ffd966');
        }
        showTemporaryMessage(`⬆️ Turm Kapazität auf ${building.maxStoneAmmo} erhöht!`, '#ffd966');
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    }

    markDirty('buildings');

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== BAUMEISTER ZUWEISEN (SPIELER 1) =====
function assignBuilderToConstruction(buildingId) {
    const building = buildings.find(b => b.id === buildingId);
    if (!building) return false;
    if (!building.isUnderConstruction) return false;
    if (building.builder) return true;
    
    const freeVillagers = villagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        building.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = building.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    // ===== KORRIGIERT: MITTE DER ZELLE =====
 
    builder.hasTask = true;
    building.builder = builder.id;
    building.waitingForBuilder = false;
    constructionSites[building.id] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: false,
        isGrenze: false
    };
    markDirty('buildings');
    return true;
}

// ===== START CONSTRUCTION (Spieler 1) – MIT RADIUS-PRÜFUNG =====
function startConstruction(type, gx, gy) {
    // ---- NETZWERK-MODUS: Client sendet Aktion an Host ----
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'build',
            player: 'player',
            buildingType: type,
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Baubefehl an Host gesendet: ${type}`, '#ffd966');
        return true;
    }

    // ---- LOKALE AUSFÜHRUNG ----
    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    // ===== BAUVERBOT AUF WASSER =====
    if (type !== 'fischerhütte' && isWater(gx, gy)) {
        showTemporaryMessage('❌ Auf Wasser kann nur eine Fischerhütte gebaut werden!', '#ff6b6b');
        return false;
    }
    if (type === 'fischerhütte' && isWater(gx, gy)) {
        showTemporaryMessage('❌ Fischerhütte muss auf festem Boden (Land) gebaut werden!', '#ff6b6b');
        return false;
    }

    // ===== FISCHERHÜTTE: WASSER-FELDER PRÜFEN (OHNE ERREICHBARKEIT) =====
    if (type === 'fischerhütte') {
        const tempBuilding = { gridX: gx, gridY: gy, id: -1, playerId: null };
        const waterFields = getFischerhütteFields(tempBuilding);
        if (waterFields.length === 0) {
            showTemporaryMessage('❌ Keine Wasser-Felder in der Nähe für die Fischerhütte!', '#ff6b6b');
            return false;
        }
    }

    // ===== NUR BEIM BAU EINER GRENZE: MINDESTABSTAND PRÜFEN =====
    if (type === 'grenze') {
        let allGrenzen = [];
        allGrenzen.push(...grenzen);
        if (SPLIT_SCREEN) allGrenzen.push(...player2Grenzen);
        allGrenzen.push(...npcGrenzen);

        for (let g of allGrenzen) {
            const dist = Math.hypot(gx - g.gridX, gy - g.gridY);
            if (dist < 8) {
                showTemporaryMessage(`❌ Zu nah an bestehender Grenze! (mind. 8 Zellen)`, '#ff6b6b');
                return false;
            }
        }
    }

    // ===== FÜR ALLE ANDEREN GEBÄUDE: NUR IN EIGENER GRENZE =====
    if (type !== 'grenze') {
        const isInRadius = isWithinBuildRadius(gx, gy, 'player');
        if (!isInRadius && gameStarted) {
            const radius = getBuildRadius('player');
            showTemporaryMessage(`❌ Außerhalb des Bau-Radius! (Radius: ${radius} Zellen)`, '#ff6b6b');
            return false;
        }
    }

    if (!canAfford(type)) {
        const typeNames = {
            'haus': 'Haus',
            'lager': 'Lager',
            'bauer': 'Bauer',
            'holzfaeller': 'Holzfäller',
            'steinmetz': 'Steinmetz',
            'wachturm': 'Wachturm',
            'grenze': 'Grenzkontrolle',
            'fischerhütte': 'Fischerhütte'
        };
        const displayName = typeNames[type] || type;
        showTemporaryMessage(`❌ Nicht genug Ressourcen für ${displayName}!`, '#ff6b6b');
        return false;
    }

    // ===== MAXIMALE GRENZKONTROLLEN PRÜFEN =====
    if (type === 'grenze') {
        const currentGrenzen = grenzen.length;
        if (currentGrenzen >= CONFIG.MAX_GRENZEN) {
            showTemporaryMessage(`❌ Maximale Anzahl Grenzkontrollen erreicht (${CONFIG.MAX_GRENZEN})!`, '#ff6b6b');
            return false;
        }
    }

    if (type === 'wachturm' && gameStarted) {
        const hasResourceBuilding = buildings.some(b => 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz' || b.type === 'fischerhütte') && 
            !b.isUnderConstruction
        );
        if (!hasResourceBuilding) {
            showTemporaryMessage('❌ Baue zuerst eine Farm, einen Holzfäller, einen Steinmetz oder eine Fischerhütte!', '#ff6b6b');
            return false;
        }
    }

    if (gameStarted) {
        const isInStartPhase = buildingRestrictionActive;
        const isInPeaceMode = (gameMode === 'peace');
        const isRestrictionActive = isInStartPhase || isInPeaceMode;
        if (isRestrictionActive && type !== 'grenze') {
            let tooClose = false;
            let closestDist = Infinity;

            if (!SPLIT_SCREEN && !NETWORK_MODE) {
                for (let nb of npcBuildings) {
                    const distToNPC = Math.hypot(gx - nb.gridX, gy - nb.gridY);
                    if (distToNPC < closestDist) closestDist = distToNPC;
                    if (distToNPC < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (SPLIT_SCREEN && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (NETWORK_MODE && !tooClose) {
                for (let p2b of player2Buildings) {
                    const distToP2 = Math.hypot(gx - p2b.gridX, gy - p2b.gridY);
                    if (distToP2 < closestDist) closestDist = distToP2;
                    if (distToP2 < 10) {
                        tooClose = true;
                        break;
                    }
                }
            }

            if (tooClose) {
                if (isInStartPhase) {
                    const elapsed = (performance.now() / 1000) - gameStartTime;
                    const remaining = Math.ceil(BUILD_RESTRICTION_DURATION - elapsed);
                    const target = SPLIT_SCREEN ? 'Spieler 2' : (NETWORK_MODE ? 'Gegner' : 'NPC');
                    showTemporaryMessage(`❌ Startphase! Noch ${remaining}s (10 Raster Abstand zu ${target} nötig)`, '#ff6b6b');
                } else {
                    showTemporaryMessage(`❌ Frieden! (${Math.floor(closestDist)} Raster, mind. 10 nötig)`, '#ff6b6b');
                }
                return false;
            }
        }
    }

    deductCost(type);

    // ===== GRENZKONTROLLE BAUEN =====
    if (type === 'grenze') {
        const g = new Grenzkontrolle(nextGrenzeId++, gx, gy, 'player', false);
        g.isUnderConstruction = true;
        g.constructionTimer = 0;
        g.constructionProgress = 0;
        g.waitingForBuilder = true;
        grenzen.push(g);
        assignBuilderToGrenze(g.id);
        markDirty('buildings');
        
        checkBuildingsForFire();
        
        if (NETWORK_MODE && IS_HOST) {
            sendDeltaSnapshot();
        }
        showTemporaryMessage(`🚩 Grenzkontrolle wird gebaut... (10s)`, '#9b59b6', true);
        return true;
    }

    // ===== FISCHERHÜTTE BAUEN =====
    if (type === 'fischerhütte') {
        const b = new Building(nextBuildingId++, type, gx, gy, false);
        b.isUnderConstruction = true;
        b.constructionTimer = 0;
        b.constructionProgress = 0;
        b.waitingForBuilder = true;
        
        const fields = getFischerhütteFields(b);
        b.fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        b.harvestProgress = 0;
        b.isHarvesting = false;
        b.productionType = 'fish';
        b.baseMaxProductionTime = 30;
        b.maxProductionTime = 30;
        b.fishStorage = 0;
        b.maxFishStorage = 3;
        b.fishConsumeTimer = 0;
        b.hasFishBonus = false;
        b.fishBonusTimer = 0;
        b.nodeId = null;
        fishCacheDirty = true;
        
        buildings.push(b);
        assignBuilderToConstruction(b.id);
        markDirty('buildings');

        if (NETWORK_MODE && IS_HOST) {
            sendDeltaSnapshot();
        }
        showTemporaryMessage(`🐠 Fischerhütte wird gebaut... (${b.fieldCount} Wasser-Felder)`, '#1a7a5a', true);
        return true;
    }

    // ===== NORMALE GEBÄUDE =====
    const b = new Building(nextBuildingId++, type, gx, gy, false);
    b.isUnderConstruction = true;
    b.constructionTimer = 0;
    b.constructionProgress = 0;
    b.waitingForBuilder = true;
    
    if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
        const fields = type === 'bauer' ? getBauerFields(b) :
                      type === 'holzfaeller' ? getHolzfaellerFields(b) :
                      getSteinmetzFields(b);
        b.fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        b.harvestProgress = 0;
        b.isHarvesting = false;
        cachedResourceNodesDirty = true;
        b.fishStorage = 0;
        b.maxFishStorage = 3;
        b.fishConsumeTimer = 0;
        b.hasFishBonus = false;
        b.fishBonusTimer = 0;
    }
    
    buildings.push(b);
    assignBuilderToConstruction(b.id);
    markDirty('buildings');

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

            building.waitingForBuilder = true;
            assignBuilderToConstruction(building.id);
            continue;
        }

        const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const d = dist(builder, { x: targetX, y: targetY });

        if (d < 5) {
            site.timer += dt;
            building.constructionTimer = site.timer;
            building.constructionProgress = site.timer / site.maxTimer;
            
            if (site.timer >= site.maxTimer) {
                building.isUnderConstruction = false;
                building.constructionProgress = 1;
                building.constructionTimer = site.maxTimer;
                building.waitingForBuilder = false;
                
                if (building.type === 'haus') {
                    building.residents = 1;
                    spawnVillager(building.id);
                }
                
                // ===== FISCHERHÜTTE FERTIG =====
                if (building.type === 'fischerhütte') {
                    const fields = getFischerhütteFields(building);
                    building.fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
                    building.harvestProgress = 0;
                    building.isHarvesting = false;
                    building.productionType = 'fish';
                    building.baseMaxProductionTime = 30;
                    building.maxProductionTime = 30;
                    building.fishStorage = 0;
                    building.maxFishStorage = 3;
                    building.fishConsumeTimer = 0;
                    building.hasFishBonus = false;
                    building.fishBonusTimer = 0;
                    building.nodeId = null;
                    fishCacheDirty = true;
                    showTemporaryMessage(`🐠 Fischerhütte fertig! ${building.fieldCount} Wasser-Felder verfügbar`, '#1a7a5a', true);
                }
                
                // ===== RESSOURCEN-GEBÄUDE FERTIG =====
                if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
                    building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
                    building.maxProductionTime = building.baseMaxProductionTime;
                    building.baseFireRate = 1.0;
                    if (building.type === 'bauer') building.productionType = 'grain';
                    else if (building.type === 'holzfaeller') building.productionType = 'wood';
                    else if (building.type === 'steinmetz') building.productionType = 'stone';
                    
                    building.fishStorage = 0;
                    building.maxFishStorage = 3;
                    building.fishConsumeTimer = 0;
                    building.hasFishBonus = false;
                    building.fishBonusTimer = 0;
                    
                    cachedResourceNodesDirty = true;
                }
                
                builder.isBuilding = false;
                builder.buildingTarget = null;
                builder.state = 'idle';
                builder.hasTask = false;
                delete constructionSites[key];
                markDirty('buildings');
                
                const typeNames = {
                    'haus': 'Haus',
                    'lager': 'Lager',
                    'bauer': 'Bauer',
                    'holzfaeller': 'Holzfäller',
                    'steinmetz': 'Steinmetz',
                    'wachturm': 'Wachturm',
                    'fischerhütte': 'Fischerhütte'
                };
                const displayName = typeNames[building.type] || building.type;
                showTemporaryMessage(`✅ ${displayName} fertig gebaut!`, '#ffd966', true);
                SoundFX.playIfVisible(targetX, targetY, 'build');
            }
        } else {
            builder.targetX = targetX;
            builder.targetY = targetY;
            builder.state = 'building';
            builder.hasTask = true;
        }
    }
} 

// ===== START CONSTRUCTION (Spieler 2) - KOMPLETT =====
function startConstructionPlayer2(type, gx, gy) {
    // ---- 1. PRÜFUNG: Zelle bereits belegt? ----
    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }

    // ===== BAUVERBOT AUF WASSER =====
    if (type !== 'fischerhütte' && isWater(gx, gy)) {
        showTemporaryMessage('❌ Auf Wasser kann nur eine Fischerhütte gebaut werden!', '#ff6b6b');
        return false;
    }
    if (type === 'fischerhütte' && isWater(gx, gy)) {
        showTemporaryMessage('❌ Fischerhütte muss auf festem Boden (Land) gebaut werden!', '#ff6b6b');
        return false;
    }

    // ===== FISCHERHÜTTE: WASSER-FELDER PRÜFEN =====
    if (type === 'fischerhütte') {
        const tempBuilding = { gridX: gx, gridY: gy, id: -1, playerId: 'player2' };
        const waterFields = getFischerhütteFields(tempBuilding);
        if (waterFields.length === 0) {
            showTemporaryMessage('❌ Keine Wasser-Felder in der Nähe für die Fischerhütte (P2)!', '#ff6b6b');
            return false;
        }
    }

    // ---- 2. GRENZ-RADIUS PRÜFUNG (NUR FÜR NORMALE GEBÄUDE) ----
    if (type !== 'grenze') {
        const isInRadius = isWithinBuildRadius(gx, gy, 'player2');
        if (!isInRadius && gameStarted) {
            const radius = getBuildRadius('player2');
            showTemporaryMessage(`❌ Außerhalb des Bau-Radius! (Radius: ${radius} Zellen)`, '#ff6b6b');
            return false;
        }
    }

    // ---- 3. GRENZE: MINDESTABSTAND PRÜFEN ----
    if (type === 'grenze') {
        let allGrenzen = [];
        allGrenzen.push(...grenzen);
        allGrenzen.push(...player2Grenzen);
        allGrenzen.push(...npcGrenzen);

        for (let g of allGrenzen) {
            const dist = Math.hypot(gx - g.gridX, gy - g.gridY);
            if (dist < 8) {
                showTemporaryMessage(`❌ Zu nah an bestehender Grenze! (mind. 8 Zellen)`, '#ff6b6b');
                return false;
            }
        }
    }

    // ---- 4. RESSOURCEN PRÜFEN ----
    if (!canAffordPlayer2(type)) {
        const typeNames = {
            'haus': 'Haus',
            'lager': 'Lager',
            'bauer': 'Bauer',
            'holzfaeller': 'Holzfäller',
            'steinmetz': 'Steinmetz',
            'wachturm': 'Wachturm',
            'grenze': 'Grenzkontrolle',
            'fischerhütte': 'Fischerhütte'
        };
        const displayName = typeNames[type] || type;
        showTemporaryMessage(`❌ Nicht genug Ressourcen für ${displayName}!`, '#ff6b6b');
        return false;
    }

    // ---- 5. MAXIMALE GRENZKONTROLLEN PRÜFEN ----
    if (type === 'grenze') {
        const currentGrenzen = player2Grenzen.length;
        if (currentGrenzen >= CONFIG.MAX_GRENZEN) {
            showTemporaryMessage(`❌ Maximale Anzahl Grenzkontrollen erreicht (${CONFIG.MAX_GRENZEN})!`, '#ff6b6b');
            return false;
        }
    }

    // ---- 6. SPLIT-START PRÜFUNG ----
    if (SPLIT_SCREEN && !gameStarted) {
        if (splitStartPhase && !splitStartPhase.startsWith('player2')) {
            showTemporaryMessage('❌ Jetzt ist Spieler 1 dran!', '#ff6b6b');
            return false;
        }
        const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
        if (gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b');
            return false;
        }
    }

    // ---- 7. KOSTEN ABZIEHEN ----
    deductCostPlayer2(type);

    // ---- 8. GRENZKONTROLLE BAUEN ----
    if (type === 'grenze') {
        const g = new Grenzkontrolle(player2NextGrenzeId++, gx, gy, 'player2', false);
        g.isUnderConstruction = true;
        g.constructionTimer = 0;
        g.constructionProgress = 0;
        g.waitingForBuilder = true;
        player2Grenzen.push(g);
        
        const assigned = assignBuilderToGrenzePlayer2(g.id);
        if (!assigned) {
            g.waitingForBuilder = true;
            showTemporaryMessage(`⏳ Warte auf freien Baumeister für Grenzkontrolle (P2)`, '#d7bde2', true);
        } else {
            showTemporaryMessage(`🚩 Grenzkontrolle (P2) wird gebaut... (10s)`, '#d7bde2', true);
        }
        
        markDirty('buildings');
        return true;
    }

    // ---- 9. FISCHERHÜTTE BAUEN ----
    if (type === 'fischerhütte') {
        const b = new Building(player2NextBuildingId++, type, gx, gy, false, 'player2');
        b.isUnderConstruction = true;
        b.constructionTimer = 0;
        b.constructionProgress = 0;
        b.waitingForBuilder = true;
        
        const fields = getFischerhütteFields(b);
        b.fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        b.harvestProgress = 0;
        b.isHarvesting = false;
        b.productionType = 'fish';  // ← WICHTIG!
        b.baseMaxProductionTime = 30;
        b.maxProductionTime = 30;
        b.fishStorage = 0;
        b.maxFishStorage = 3;
        b.fishConsumeTimer = 0;
        b.hasFishBonus = false;
        b.fishBonusTimer = 0;
        b.nodeId = null;
        player2FishCacheDirty = true;
        
        player2Buildings.push(b);
        assignBuilderToConstructionPlayer2(b.id);
        markDirty('buildings');
        
        showTemporaryMessage(`🐠 Fischerhütte (P2) wird gebaut... (${b.fieldCount} Wasser-Felder)`, '#1abc9c', true);
        return true;
    }

    // ---- 10. NORMALE GEBÄUDE BAUEN ----
    const b = new Building(player2NextBuildingId++, type, gx, gy, false, 'player2');
    b.isUnderConstruction = true;
    b.constructionTimer = 0;
    b.constructionProgress = 0;
    b.waitingForBuilder = true;
    
    if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
        const fields = type === 'bauer' ? getBauerFields(b) :
                      type === 'holzfaeller' ? getHolzfaellerFields(b) :
                      getSteinmetzFields(b);
        b.fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        b.harvestProgress = 0;
        b.isHarvesting = false;
        if (type === 'bauer') b.productionType = 'grain';
        else if (type === 'holzfaeller') b.productionType = 'wood';
        else if (type === 'steinmetz') b.productionType = 'stone';
        cachedPlayer2ResourceNodesDirty = true;
        b.fishStorage = 0;
        b.maxFishStorage = 3;
        b.fishConsumeTimer = 0;
        b.hasFishBonus = false;
        b.fishBonusTimer = 0;
    }
    
    player2Buildings.push(b);
    assignBuilderToConstructionPlayer2(b.id);
    markDirty('buildings');
    
    const typeNames = {
        'haus': 'Haus',
        'lager': 'Lager',
        'bauer': 'Bauer',
        'holzfaeller': 'Holzfäller',
        'steinmetz': 'Steinmetz',
        'wachturm': 'Wachturm',
        'fischerhütte': 'Fischerhütte'
    };
    const displayName = typeNames[type] || type;
    showTemporaryMessage(`🔨 ${displayName} (P2) wird gebaut... (10s)`, '#ff8a65', true);
    return true;
}

// ===== UPGRADE BUILDING (Spieler 1) – NETZWERK-FÄHIG =====
function upgradeBuilding(building) {
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'upgrade',
            player: 'player',
            buildingId: building.id
        });
        showTemporaryMessage(`📤 Upgrade-Befehl an Host gesendet (ID: ${building.id})`, '#ffd966');
        return true;
    }

    const { cost, effect } = getUpgradeCostAndEffect(building);
    if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
    resources.wood -= cost.wood;
    resources.stone -= cost.stone;

    const oldLevel = building.level;
    building.level += 1;

    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        building.maxProductionTime = building.baseMaxProductionTime / building.level;
        const fields = building.type === 'bauer' ? getBauerFields(building) :
                      building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                      getSteinmetzFields(building);
        const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
        for (let node of resourceNodes) {
            const key = node.x + ',' + node.y;
            if (fieldSet.has(key) && node.type === building.productionType) {
                const progress = node.timer / node.maxTimer;
                node.maxTimer = building.maxProductionTime;
                node.timer = progress * node.maxTimer;
            }
        }
    }

    if (building.type === 'wachturm') {
        if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
        if (effect.doubleShot) building.doubleShot = true;
        building.maxStoneAmmo += 3;
        if (oldLevel === 2) {
            building.range += 1;
            showTemporaryMessage(`⬆️ Turm Reichweite auf ${building.range} erhöht!`, '#ffd966');
        }
        showTemporaryMessage(`⬆️ Turm Kapazität auf ${building.maxStoneAmmo} erhöht!`, '#ffd966');
    } else if (building.type === 'haus') {
        building.maxResidents = effect.residents || 8;
    }

    

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== ZERSTÖREN (Spieler 1) =====
function destroyBuilding(gx, gy) {
    if (NETWORK_MODE && !IS_HOST) {
        sendNetworkAction({
            type: 'destroy',
            player: 'player',
            gridX: gx,
            gridY: gy
        });
        showTemporaryMessage(`📤 Abriss-Befehl an Host gesendet (${gx},${gy})`, '#ffd966');
        return true;
    }

    const idx = buildings.findIndex(b => b.gridX === gx && b.gridY === gy);
    if (idx === -1) return false;
    const building = buildings[idx];
    const captureKey = 'capture_' + building.id;
    if (captureTimers[captureKey]) {
        delete captureTimers[captureKey];
    }
    if (building.type === 'wachturm') {
        for (let v of villagers) {
            if (v.alive && v.towerTarget === building) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
                v.isDeliveringStone = false;
                v.carrying = null;
                v.towerTarget = null;
                v.stoneToDeliver = 0;
                v.hasReservedStone = false;
                v.state = 'idle';
                v.hasTask = false;
            }
        }
    }
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  building.type === 'steinmetz' ? getSteinmetzFields(building) : [];
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    resourceNodes = resourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));
    if (building.type === 'haus') {
        const residents = villagers.filter(v => v.alive && v.homeId === building.id);
        for (let v of residents) {
            if (v.hasReservedStone && v.towerTarget) {
                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
                if (v.carrying === 'stone') { resources.stone += (v.stoneToDeliver || 0); }
                v.hasReservedStone = false;
            }
            v.alive = false;
        }
        villagers = villagers.filter(v => v.alive);
    }
    buildings.splice(idx, 1);
    
  
        // ===== NEU: DIRTY FLAG FÜR NODE-CACHE =====
    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        cachedResourceNodesDirty = true;
   
    }
    
    markDirty('buildings');

    if (NETWORK_MODE && IS_HOST) {
        sendDeltaSnapshot();
    }

    return true;
}

// ===== NPC BAUMEISTER FÜR NORMALE GEBÄUDE =====
function assignNpcBuilderToConstruction(buildingId) {
    const building = npcBuildings.find(b => b.id === buildingId);
    if (!building) return false;
    if (!building.isUnderConstruction) return false;
    if (building.builder) return true;
    
    const freeVillagers = npcVillagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        building.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = building.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    building.builder = builder.id;
    building.waitingForBuilder = false;
    constructionSites[building.id] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: true,
        isGrenze: false
    };
    markDirty('villagers');
    return true;
}

function assignNpcBuilderToGrenze(grenzeId) {
    const grenze = npcGrenzen.find(g => g.id === grenzeId);
    if (!grenze) return false;
    if (!grenze.isUnderConstruction) return false;
    if (grenze.builder) return true;
    
    const freeVillagers = npcVillagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    );
    if (freeVillagers.length < 1) {
        grenze.waitingForBuilder = true;
        return false;
    }
    
    const builder = freeVillagers[0];
    builder.isBuilding = true;
    builder.buildingTarget = grenze.id;
    builder.buildingProgress = 0;
    builder.state = 'building';
    builder.targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
    builder.hasTask = true;
    grenze.builder = builder.id;
    grenze.waitingForBuilder = false;
    
    // ===== KEY MUSS EXAKT SO SEIN =====
    constructionSites[`grenze_npc_${grenze.id}`] = {
        timer: 0,
        maxTimer: CONFIG.BUILD_TIME,
        builder: builder.id,
        isNPC: true,
        isGrenze: true,
        playerId: null
    };
    markDirty('buildings');
    return true;
}

// ===== NPC CAN AFFORD =====
function npcCanAfford(type) {
    const free = npcVillagers.filter(v => 
        v.alive && 
        v.state === 'idle' && 
        v.carrying === null && 
        !v.hasTask && 
        !v.isAttacking && 
        !v.isBuilding
    ).length;
    
    switch(type) {
        case 'haus': return npcResources.wood >= 3;
        case 'lager': return npcResources.wood >= 10 && npcResources.stone >= 10;
        case 'bauer': return npcResources.wood >= 5;
        case 'holzfaeller': return free >= 2;
        case 'steinmetz': return npcResources.wood >= 5 && free >= 2;
        case 'wachturm': return npcResources.wood >= 15;
        case 'grenze': return free >= CONFIG.GRENZE_COST_VILLAGERS;
        case 'fischerhütte': return npcResources.wood >= 5 && npcResources.stone >= 5; // ← NEU
        default: return false;
    }
}

function npcCanAffordUpgrade(building) {
    const { cost } = getUpgradeCostAndEffect(building);
    if (building.type === 'grenze') {
        const { cost } = getUpgradeCostAndEffect({ type: 'grenze', level: building.level });
        return npcResources.wood >= cost.wood && npcResources.stone >= cost.stone;
    }
    return npcResources.wood >= cost.wood && npcResources.stone >= cost.stone;
}

function npcDeductCost(type) {
    switch(type) {
        case 'haus': npcResources.wood -= 3; break;
        case 'lager': npcResources.wood -= 10; npcResources.stone -= 10; break;
        case 'bauer': npcResources.wood -= 5; break;
        case 'holzfaeller': break;
        case 'steinmetz': npcResources.wood -= 5; break;
        case 'wachturm': npcResources.wood -= 15; break;
        case 'grenze': break;
        case 'fischerhütte': npcResources.wood -= 5; npcResources.stone -= 5; break; // ← NEU
    }
    let einwohnerKosten = 0;
    if (type === 'holzfaeller') einwohnerKosten = 2;
    else if (type === 'steinmetz') einwohnerKosten = 2;
    else if (type === 'grenze') einwohnerKosten = CONFIG.GRENZE_COST_VILLAGERS;
    if (einwohnerKosten > 0) npcRemoveFreeVillagers(einwohnerKosten);
    
    npcInvalidateBuildCache();
}

function npcInvalidateBuildCache() {
    for (let key in npcBuildCacheByType) {
        npcBuildCacheByType[key].dirty = true;
    }
    npcBuildCache.dirty = true;
}

function npcRemoveFreeVillagers(count) {
    let removed = 0;
    for (let v of npcVillagers) {
        if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
            v.alive = false;
            const home = npcBuildings.find(b => b.id === v.homeId);
            if (home && home.residents > 0) home.residents -= 1;
            removed++;
        }
    }
    npcVillagers = npcVillagers.filter(v => v.alive);
    markDirty('villagers');
}

// ===== NPC BUILDING ZERSTÖREN (KORRIGIERT) =====
function npcDestroyBuilding(gx, gy) {
    const idx = npcBuildings.findIndex(b => b.gridX === gx && b.gridY === gy);
    if (idx === -1) return false;
    
    const building = npcBuildings[idx];
    if (building.builder) {
        const builder = npcVillagers.find(v => v.id === building.builder);
        if (builder) {
            builder.isBuilding = false;
            builder.buildingTarget = null;
            builder.state = 'idle';
            builder.hasTask = false;
        }
    }
    
    // ===== DIRTY FLAG FÜR NODE-CACHE (KORRIGIERT) =====
    if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
        cachedNpcResourceNodesDirty = true;
    }
    
    npcBuildings.splice(idx, 1);
    markDirty('buildings');
    return true;
}

// ===== NPC GRENZKONTROLLE ZERSTÖREN =====
function npcDestroyGrenze(gx, gy) {
    const idx = npcGrenzen.findIndex(g => g.gridX === gx && g.gridY === gy);
    if (idx === -1) return false;
    
    const grenze = npcGrenzen[idx];
    if (grenze.builder) {
        const builder = npcVillagers.find(v => v.id === grenze.builder);
        if (builder) {
            builder.isBuilding = false;
            builder.buildingTarget = null;
            builder.state = 'idle';
            builder.hasTask = false;
        }
    }
    npcGrenzen.splice(idx, 1);
    markDirty('buildings');
    return true;
}

// ===== UPDATE CONSTRUCTION (NUR NPC - MIT GRENZEN) =====
function updateNpcConstruction(dt) {
    // ---- Baumeister zuweisen für NPC Gebäude ----
    for (let b of npcBuildings) {
        if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
            assignNpcBuilderToConstruction(b.id);
        }
    }
    
    // ---- Baumeister zuweisen für NPC Grenzen ----
    for (let g of npcGrenzen) {
        if (g.isUnderConstruction && g.waitingForBuilder && !g.builder) {
            assignNpcBuilderToGrenze(g.id);
        }
    }

    // ---- Baustellen aktualisieren (NUR NPC) ----
    for (let key in constructionSites) {
        const site = constructionSites[key];
        
        // NUR NPC
        if (!site.isNPC) continue;
        
        // === NPC GRENZE ===
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_npc_', ''));
            const grenze = npcGrenzen.find(g => g.id === grenzeId);
            if (!grenze) {
                delete constructionSites[key];
                continue;
            }

            const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
            if (!builder || !builder.alive) {
                delete constructionSites[key];
                grenze.builder = null;
                grenze.waitingForBuilder = true;
                assignNpcBuilderToGrenze(grenze.id);
                continue;
            }

            const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const d = dist(builder, { x: targetX, y: targetY });

            if (d < 5) {
                site.timer += dt;
                grenze.constructionTimer = site.timer;
                grenze.constructionProgress = site.timer / site.maxTimer;
                
                if (site.timer >= site.maxTimer) {
                    grenze.isUnderConstruction = false;
                    grenze.constructionProgress = 1;
                    grenze.constructionTimer = site.maxTimer;
                    grenze.waitingForBuilder = false;
                    
                    builder.isBuilding = false;
                    builder.buildingTarget = null;
                    builder.state = 'idle';
                    builder.hasTask = false;
                    delete constructionSites[key];
                    markDirty('buildings');
                    showTemporaryMessage('🤖 NPC Grenzkontrolle fertig!', '#4a235a', true);
                    SoundFX.playIfVisible(targetX, targetY, 'grenzeBuild');
                }
            } else {
                builder.targetX = targetX;
                builder.targetY = targetY;
                builder.state = 'building';
                builder.hasTask = true;
            }
            continue;
        }

        // === NPC NORMALE GEBÄUDE ===
        const buildingId = parseInt(key);
        const building = npcBuildings.find(b => b.id === buildingId);
        if (!building) {
            delete constructionSites[key];
            continue;
        }

        const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
        if (!builder || !builder.alive) {
            delete constructionSites[key];
            building.builder = null;
            building.waitingForBuilder = true;
            assignNpcBuilderToConstruction(building.id);
            continue;
        }

        const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const d = dist(builder, { x: targetX, y: targetY });

        if (d < 5) {
            site.timer += dt;
            building.constructionTimer = site.timer;
            building.constructionProgress = site.timer / site.maxTimer;
            
            if (site.timer >= site.maxTimer) {
                building.isUnderConstruction = false;
                building.constructionProgress = 1;
                building.constructionTimer = site.maxTimer;
                building.waitingForBuilder = false;

                if (building.type === 'haus') {
                    building.residents = 1;
                    const v = new Villager(nextVillagerId++, building.id, true);
                    const cx = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const cy = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.x = cx;
                    v.y = cy;
                    v.targetX = cx;
                    v.targetY = cy;
                    v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
                    npcVillagers.push(v);
                }

                // ===== FISCHERHÜTTE FERTIG =====
                if (building.type === 'fischerhütte') {
                    building.fishStorage = 0;
                    building.maxFishStorage = 3;
                    building.fishProductionTimer = 0;
                    building.fishProductionInterval = 30;
                    building.baseFishProductionInterval = 30;
                    building.productionType = 'fish';
                    building.fieldCount = 0;
                    building.harvestProgress = 0;
                    building.isHarvesting = false;
                    building.nodeId = null;
                    npcFishCacheDirty = true;
                    showTemporaryMessage('🤖 NPC Fischerhütte fertig!', '#4a235a', true);
                }

                // ===== RESSOURCEN-GEBÄUDE FERTIG =====
                if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
                    building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
                    building.maxProductionTime = building.baseMaxProductionTime;
                    building.baseFireRate = 1.0;
                    if (building.type === 'bauer') building.productionType = 'grain';
                    else if (building.type === 'holzfaeller') building.productionType = 'wood';
                    else if (building.type === 'steinmetz') building.productionType = 'stone';
                    
                    // Fisch-Properties für Ressourcen-Gebäude
                    building.fishStorage = 0;
                    building.maxFishStorage = 3;
                    building.fishConsumeTimer = 0;
                    building.hasFishBonus = false;
                    building.fishBonusTimer = 0;
                    
                    cachedNpcResourceNodesDirty = true;
                }

                builder.isBuilding = false;
                builder.buildingTarget = null;
                builder.state = 'idle';
                builder.hasTask = false;
                delete constructionSites[key];
                markDirty('buildings');
                
                const typeNames = {
                    'haus': 'Haus',
                    'lager': 'Lager',
                    'bauer': 'Bauer',
                    'holzfaeller': 'Holzfäller',
                    'steinmetz': 'Steinmetz',
                    'wachturm': 'Wachturm',
                    'fischerhütte': 'Fischerhütte'
                };
                const displayName = typeNames[building.type] || building.type;
                showTemporaryMessage(`✅ NPC ${displayName} fertig gebaut!`, '#9b59b6', true);
                SoundFX.playIfVisible(targetX, targetY, 'build');
            }
        } else {
            builder.targetX = targetX;
            builder.targetY = targetY;
            builder.state = 'building';
            builder.hasTask = true;
        }
    }
}

// ===== CACHE-MAPS NEU AUFBAUEN =====
function rebuildResourceMaps() {
    resourceNodeMap = new Map(resourceNodes.map(n => [n.id, n]));
    resourceNodeByPosition = new Map(resourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));
    player2ResourceNodeMap = new Map(player2ResourceNodes.map(n => [n.id, n]));
    player2ResourceNodeByPosition = new Map(player2ResourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));
    npcResourceNodeMap = new Map(npcResourceNodes.map(n => [n.id, n]));
    npcResourceNodeByPosition = new Map(npcResourceNodes.map(n => [`${n.x},${n.y},${n.type}`, n]));
}

function updateNpcResourceNodes(dt) {
    // ===== 1. TIMER FÜR EXISTIERENDE NODES =====
    for (let i = npcResourceNodes.length - 1; i >= 0; i--) {
        const node = npcResourceNodes[i];
        if (node.ready) continue;
        node.timer += dt;
        if (node.timer >= node.maxTimer) {
            node.ready = true;
            node.timer = node.maxTimer;
            if (node.fields && node.fields.length > 0) {
                for (let f of node.fields) {
                    f.harvested = false;
                    f.harvestTimer = 0;
                    f.isBeingHarvested = false;
                }
            }
            markDirty('buildings');
        }
    }

    // ===== 2. NODE-STRUKTUR NUR BEI ÄNDERUNGEN =====
    if (!cachedNpcResourceNodesDirty) return;
    cachedNpcResourceNodesDirty = false;

    // ===== 3. NODES FÜR PRODUKTIONSGEBÄUDE AKTUALISIEREN (INKLUSIVE FISCHERHÜTTEN) =====
    const resourceBuildings = npcBuildings.filter(b => 
        !b.isUnderConstruction && 
        (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz' || b.type === 'fischerhütte')
    );

    const existingNodeMap = new Map();
    for (let node of npcResourceNodes) {
        if (node.buildingId !== undefined) {
            existingNodeMap.set(node.buildingId, node);
        }
    }

    const activeBuildingIds = new Set();

    for (let building of resourceBuildings) {
        activeBuildingIds.add(building.id);
        let type, fields;
        
        if (building.type === 'fischerhütte') {
            type = 'fish';
            fields = getFischerhütteFields(building);
        } else {
            type = building.productionType || 'grain';
            fields = building.type === 'bauer' ? getBauerFields(building) :
                    building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                    getSteinmetzFields(building);
        }
        
        // In der Schleife für jedes Gebäude:
const filteredFields = fields.filter(f => !isFieldClaimedByResourceNode(f.x, f.y, building.id));
        const fieldCount = Math.min(fields.length, CONFIG.NODE_FIELD_COUNT);
        building.fieldCount = fieldCount;
        
        let node = existingNodeMap.get(building.id);
        
        if (node) {
            node.fieldCount = fieldCount;
            node.maxTimer = building.maxProductionTime;
            if (!node.fields || node.fields.length !== fields.length) {
                node.fields = fields.map(f => ({
                    x: f.x,
                    y: f.y,
                    harvested: false,
                    harvestTimer: 0,
                    isBeingHarvested: false
                }));
                node.ready = false;
                node.timer = 0;
            }
        } else {
            const key = `${building.gridX},${building.gridY},${type}`;
            const existing = npcResourceNodeByPosition.get(key);
            if (!existing) {
                node = {
                    id: nextNpcResourceId++,
                    x: building.gridX,
                    y: building.gridY,
                    type: type,
                    timer: 0,
                    maxTimer: building.maxProductionTime,
                    ready: false,
                    claimedBy: null,
                    isNPC: true,
                    buildingId: building.id,
                    fieldCount: fieldCount,
                    harvestProgress: 0,
                    fields: fields.map(f => ({
                        x: f.x,
                        y: f.y,
                        harvested: false,
                        harvestTimer: 0,
                        isBeingHarvested: false
                    }))
                };
                npcResourceNodes.push(node);
                npcResourceNodeMap.set(node.id, node);
                npcResourceNodeByPosition.set(key, node);
                building.nodeId = node.id;
            } else {
                existing.buildingId = building.id;
                existing.fieldCount = fieldCount;
                existing.maxTimer = building.maxProductionTime;
                building.nodeId = existing.id;
                if (!existing.fields || existing.fields.length !== fields.length) {
                    existing.fields = fields.map(f => ({
                        x: f.x,
                        y: f.y,
                        harvested: false,
                        harvestTimer: 0,
                        isBeingHarvested: false
                    }));
                }
                existing.ready = false;
                existing.timer = 0;
            }
        }
    }

    // ===== 4. VERALTETE NODES ENTFERNEN =====
    for (let i = npcResourceNodes.length - 1; i >= 0; i--) {
        const node = npcResourceNodes[i];
        if (node.buildingId !== undefined && !activeBuildingIds.has(node.buildingId)) {
            if (node.claimedBy) {
                const villager = npcVillagers.find(v => v.id === node.claimedBy);
                if (villager) {
                    villager.resourceTarget = null;
                    villager.state = 'idle';
                    villager.hasTask = false;
                }
            }
            npcResourceNodes.splice(i, 1);
        }
    }

    refreshNpcResourceCache();
    markDirty('buildings');
}

function updateResourceNodes(dt) {

        existing.fieldCount = fieldCount;

  refreshPlayerResourceCache();
  rebuildResourceMaps();
  markDirty();
}

    const cx = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;

// ============================================================
//  EINWOHNER IN TOTENLISTE VERSCHIEBEN
// ============================================================

function moveToDeadList(v, cause = 'combat') {
    // ===== 1. Grundprüfungen =====
    if (!v) return;
    
    // ===== 2. Prüfen ob bereits in Totenliste =====
    if (deadVillagers.some(d => d.villager === v)) {
        return;
    }
    
    // ===== 3. Aus Arrays entfernen =====
    let removed = false;
    
    const p1Index = villagers.indexOf(v);
    if (p1Index !== -1) {
        villagers.splice(p1Index, 1);
        removed = true;
    }
    
    if (!removed) {
        const p2Index = player2Villagers.indexOf(v);
        if (p2Index !== -1) {
            player2Villagers.splice(p2Index, 1);
            removed = true;
        }
    }
    
    if (!removed) {
        const npcIndex = npcVillagers.indexOf(v);
        if (npcIndex !== -1) {
            npcVillagers.splice(npcIndex, 1);
            removed = true;
        }
    }
    
    if (!removed) {
        return;
    }
    
    // ===== 4. In Totenliste eintragen =====
    deadVillagers.push({
        id: nextDeadId++,
        villager: v,
        deathTime: performance.now() / 1000,
        cause: cause,
        x: v.x,
        y: v.y,
        isNPC: v.isNPC || false,
        playerId: v.playerId || null
    });
    
    // ===== 5. Nach 10 Sekunden entfernen =====
    setTimeout(() => {
        const idx = deadVillagers.findIndex(d => d.villager === v);
        if (idx !== -1) deadVillagers.splice(idx, 1);
    }, 10000);
    
    // ===== 6. Caches invalidieren =====
    if (v.isNPC) {
        npcCacheNeedsRefresh = true;
        cachedFreeVillagersNpcDirty = true;
    } else if (v.playerId === 'player2') {
        cacheNeedsRefreshP2 = true;
        cachedFreeVillagersP2Dirty = true;
    } else {
        cacheNeedsRefresh = true;
        cachedFreeVillagersDirty = true;
    }
    
    markDirty('villagers');
}

function safeKill(target, killFunc, cause) {
    if (!target || !target.alive) return false;
    killFunc(target, cause);
    return true;
}

// ===== NACHBAR-GRID-KEYS IN REICHWEITE =====
function getNeighborCombatGridKeys(x, y, range) {
    const cx = Math.floor(x / COMBAT_GRID_SIZE);
    const cy = Math.floor(y / COMBAT_GRID_SIZE);
    const radius = Math.ceil(range / COMBAT_GRID_SIZE) + 1;
    const keys = [];
    for (let dx = -radius; dx <= radius; dx++) {
        for (let dy = -radius; dy <= radius; dy++) {
            keys.push((cx + dx) + ',' + (cy + dy));
        }
    }
    return keys;
}

// ===== GRID-BASIERTE SUCHE (ERSETZT getVillagersInRange) =====
function getVillagersInRangeFast(x, y, range, playerType) {
    const result = [];
    const rangeSq = range * range;
    
    let grid;
    if (playerType === 'player') grid = combatGridPlayer;
    else if (playerType === 'player2') grid = combatGridPlayer2;
    else if (playerType === 'npc') grid = combatGridNpc;
    else return result;
    
    const neighborKeys = getNeighborCombatGridKeys(x, y, range);
    for (let key of neighborKeys) {
        const cells = grid.get(key);
        if (cells) {
            for (let v of cells) {
                if (!v.alive) continue;
                const dx = v.x - x;
                const dy = v.y - y;
                if (dx*dx + dy*dy < rangeSq) {
                    result.push(v);
                }
            }
        }
    }
    return result;
}

// ============================================================
//  WASM-WRAPPER FÜR COMBAT (MUSS VOR updateCombatAndCapture)
// ============================================================
function updateCombatWithWasm(dt) {
    if (!wasmLoaded || !wasmExports) return false;
    if (typeof wasmExports.updateCombatBatch !== 'function') return false;
    if (gameMode !== 'war') return false;
    
    try {
        // ALLE VILLAGER IN ARRAYS UMWANDELN
        const allUnits = [];
        const allTeams = [];
        
        // Spieler 1 (Team 0)
        for (let v of villagers) {
            if (!v.alive) continue;
            allUnits.push(v);
            allTeams.push(0);
        }
        
        // NPC (Team 1) - nur Einzelmodus
        if (!SPLIT_SCREEN && !NETWORK_MODE) {
            for (let v of npcVillagers) {
                if (!v.alive) continue;
                allUnits.push(v);
                allTeams.push(1);
            }
        }
        
        // Spieler 2 (Team 2) - nur Split-Modus
        if (SPLIT_SCREEN || NETWORK_MODE) {
            for (let v of player2Villagers) {
                if (!v.alive) continue;
                allUnits.push(v);
                allTeams.push(2);
            }
        }
        
        const count = allUnits.length;
        if (count < 2) return true;
        
        // Arrays für C++ vorbereiten
        const x = new Float32Array(count);
        const y = new Float32Array(count);
        const alive = new Uint8Array(count);
        const teams = new Int32Array(count);
        const cooldowns = new Float32Array(count);
        
        for (let i = 0; i < count; i++) {
            const v = allUnits[i];
            x[i] = v.x;
            y[i] = v.y;
            alive[i] = 1;
            teams[i] = allTeams[i];
            cooldowns[i] = v.combatCooldown || 0;
        }
        
        // C++-Funktion aufrufen
        const range = getCurrentCombatRange() * CONFIG.CELL_SIZE;
        wasmExports.updateCombatBatch(
            x, y, alive, teams, cooldowns, count,
            x, y, alive, teams, count,
            range,
            dt
        );
        
        // ERGEBNISSE ZURÜCKSCHREIBEN
        let deadCount = 0;
        for (let i = 0; i < count; i++) {
            if (!alive[i]) {
                const v = allUnits[i];
                if (v.alive) {
                    v.alive = false;
                    deadCount++;
                    // Ressourcen freigeben
                    if (v.carrying === 'stone') resources.stone += 1;
                    else if (v.carrying === 'grain') resources.grain += 1;
                    else if (v.carrying === 'wood') resources.wood += 1;
                    // Tötungseffekt
                    createHitEffect(v.x, v.y, false);
                    SoundFX.playIfVisible(v.x, v.y, 'villagerDie');
                }
            }
            // Cooldown zurückschreiben
            allUnits[i].combatCooldown = cooldowns[i];
        }
        
        if (deadCount > 0) {
            console.log(`⚔️ ${deadCount} Einwohner im Kampf gefallen!`);
            markDirty('villagers');
        }
        
        return true;
    } catch(e) {
        console.warn('⚠️ WASM-Combat Fehler:', e.message);
        return false;
    }
}

// ============================================================
//  KOMPLETTE updateCombatAndCapture() - MIT WASM-UNTERSTÜTZUNG
// ============================================================
function updateCombatAndCapture(dt) {
    // ===== 1. FRAME-SKIPPING FÜR GROSSE KARTEN =====
    combatFrameCounter++;
    const skipFrames = CONFIG.COMBAT_FRAME_SKIP || 1;
    if (combatFrameCounter % skipFrames !== 0) {
        return;
    }
    combatFrameCounter = 0;

    // ===== 2. CACHES NUR BEI ÄNDERUNGEN AKTUALISIEREN =====
    if (villagerCacheDirty) {
        refreshPlayerVillagerCache();
        villagerCacheDirty = false;
    }
    if (npcVillagerCacheDirty) {
        refreshNpcVillagerCache();
        npcVillagerCacheDirty = false;
    }
    if ((SPLIT_SCREEN || NETWORK_MODE) && player2VillagerCacheDirty) {
        refreshPlayer2VillagerCache();
        player2VillagerCacheDirty = false;
    }
    if (resourceCacheDirty) {
        refreshPlayerResourceCache();
        resourceCacheDirty = false;
    }
    if (npcResourceCacheDirty) {
        refreshNpcResourceCache();
        npcResourceCacheDirty = false;
    }
    if ((SPLIT_SCREEN || NETWORK_MODE) && player2ResourceCacheDirty) {
        refreshPlayer2ResourceCache();
        player2ResourceCacheDirty = false;
    }
    if (lagerCacheDirty) {
        refreshLagerCache();
        lagerCacheDirty = false;
    }

    // ===== 3. LOKALE HILFSFUNKTIONEN =====
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    // ===== 4. KAMPFREICHWEITE =====
    const combatRange = getCurrentCombatRange() * CONFIG.CELL_SIZE;
    const combatRangeSq = combatRange * combatRange;
    const searchRadius = CONFIG.MAX_COMBAT_SEARCH_RADIUS || 8;
    const combatSearchRange = combatRange * searchRadius;

    // ===== 5. CACHE-REFERENZEN =====
    const allPlayerVillagers = cachedPlayerVillagers;
    const allNPCVillagers = cachedNpcVillagers;
    const allPlayer2Villagers = cachedPlayer2Villagers;

    // ============================================================
    // 6. NEU: WASM-VERSION FÜR KÄMPFE (NUR IM KRIEG)
    // ============================================================
    let wasmDone = false;
    
    if (gameMode === 'war') {
        wasmDone = updateCombatWithWasm(dt);
    }
    
    // ============================================================
    // 7. JS-FALLBACK: ANGRIFFSSUCHE (NUR WENN WASM NICHT VERFÜGBAR)
    // ============================================================
    
    if (!wasmDone && gameMode === 'war') {
        // --- Einzelmodus: Spieler vs NPC ---
        if (!SPLIT_SCREEN && !NETWORK_MODE) {
            // SPIELER GREIFT NPC AN
            const availablePlayers = allPlayerVillagers.filter(v =>
                v.alive && 
                v.carrying === null && 
                !v.isDeliveringStone && 
                !v.isBuilding &&
                !v.isAttacking &&
                !v.captureTargetId
            );

            for (let pv of availablePlayers) {
                if (pv.combatCooldown > 0) continue;
                
                if (pv.isAttacking && pv.attackTarget && pv.attackTarget.alive) {
                    const d2 = dist2(pv, pv.attackTarget);
                    if (d2 > combatRangeSq * 2.25) {
                        pv.isAttacking = false;
                        pv.attackTarget = null;
                        pv.hasTask = false;
                    }
                    continue;
                }

                const nearbyNpc = getVillagersInRangeFast(pv.x, pv.y, combatSearchRange, 'npc');
                let closestTarget = null;
                let closestDistSq = Infinity;

                for (let nv of nearbyNpc) {
                    if (!nv.alive) continue;
                    const d2 = dist2(pv, nv);
                    if (d2 < combatRangeSq && d2 < closestDistSq) {
                        closestDistSq = d2;
                        closestTarget = nv;
                    }
                }

                if (closestTarget) {
                    clearPlayerVillagerTasks(pv);
                    pv.isAttacking = true;
                    pv.attackTarget = closestTarget;
                    pv.targetX = closestTarget.x;
                    pv.targetY = closestTarget.y;
                    pv.state = 'attacking';
                    pv.hasTask = true;
                }

//  HILFSFUNKtIONEN FÜR RESSOURCEN-TRANSFER (NPC ↔ SPIELER)
// =========================================================================

function transferResourceNodes(building, fromNPCtoPlayer) {
    if (building.type !== 'bauer' && building.type !== 'holzfaeller' && building.type !== 'steinmetz') return;
    if (building.isUnderConstruction) return;

    const resourceType = building.productionType;
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  getSteinmetzFields(building);

    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));

    // Quell- und Ziel-Nodes bestimmen
    let sourceNodes, targetNodes, targetMap, targetPositionMap, nextIdRef;
    if (fromNPCtoPlayer) {
        sourceNodes = npcResourceNodes;
        targetNodes = resourceNodes;
        targetMap = resourceNodeMap;
        targetPositionMap = resourceNodeByPosition;
        nextIdRef = 'nextResourceId';
    } else {
        sourceNodes = resourceNodes;
        targetNodes = npcResourceNodes;
        targetMap = npcResourceNodeMap;
        targetPositionMap = npcResourceNodeByPosition;
        nextIdRef = 'nextNpcResourceId';
    }

    // Nodes von Quelle entfernen
    for (let i = sourceNodes.length - 1; i >= 0; i--) {
        const node = sourceNodes[i];
        if (fieldSet.has(node.x + ',' + node.y) && node.type === resourceType) {
            if (node.claimedBy) {
                const villager = (fromNPCtoPlayer ? villagers : npcVillagers).find(v => v.id === node.claimedBy);
                if (villager) {
                    villager.resourceTarget = null;
                    villager.state = 'idle';
                    villager.hasTask = false;
                }
            }
            sourceNodes.splice(i, 1);
        }
    }

    // Nodes zum Ziel hinzufügen
    for (let f of fields) {
        const key = `${f.x},${f.y},${resourceType}`;
        const existing = targetPositionMap.get(key);
        if (!existing) {
            const newNode = {
                id: (fromNPCtoPlayer ? nextResourceId++ : nextNpcResourceId++),
                x: f.x,
                y: f.y,
                type: resourceType,
                timer: 0,
                maxTimer: building.maxProductionTime,
                ready: false,
                claimedBy: null,
                isNPC: !fromNPCtoPlayer
            };
            targetNodes.push(newNode);
            targetMap.set(newNode.id, newNode);
            targetPositionMap.set(key, newNode);
        } else {
            existing.timer = 0;
            existing.ready = false;
            existing.maxTimer = building.maxProductionTime;
            existing.claimedBy = null;
        }
    }

    rebuildResourceMaps();
    refreshPlayerResourceCache();
    refreshNpcResourceCache();
    cachedResourceNodesDirty = true;
    
}

function clearPlayerVillagerTasks(v) {
    if (!v || !v.alive) return;
    if (v.resourceTarget) {
        const node = resourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.claimedBy === v.id) node.claimedBy = null;
        v.resourceTarget = null;
    }
    if (v.carrying !== null) {
        if (v.carrying === 'grain') resources.grain += 1;
        else if (v.carrying === 'wood') resources.wood += 1;
        else if (v.carrying === 'stone') resources.stone += 1;
        v.carrying = null;
        v.deliveryTarget = null;
    }
    if (v.hasReservedStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        v.hasReservedStone = false;
        v.towerTarget = null;
        v.stoneToDeliver = 0;
    }
    if (v.isBuilding && v.buildingTarget) {
        const building = buildings.find(b => b.id === v.buildingTarget);
        if (building && building.isUnderConstruction) {
            building.builder = null;
            building.waitingForBuilder = true;
        }
        v.isBuilding = false;
        v.buildingTarget = null;
    }
    v.isDeliveringStone = false;
    v.deliveryTarget = null;
    v.hasTask = false;
    v.state = 'idle';
}

    if (v.resourceTarget) {
        const node = npcResourceNodes.find(r => r.id === v.resourceTarget.id);
        if (node && node.claimedBy === v.id) node.claimedBy = null;
        v.resourceTarget = null;
    }
    if (v.carrying !== null) {
        if (v.carrying === 'grain') npcResources.grain += 1;
        else if (v.carrying === 'wood') npcResources.wood += 1;
        else if (v.carrying === 'stone') npcResources.stone += 1;
        v.carrying = null;
        v.deliveryTarget = null;
    }
    if (v.hasReservedStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        v.hasReservedStone = false;
        v.towerTarget = null;
        v.stoneToDeliver = 0;
    }
    if (v.isBuilding && v.buildingTarget) {
        const building = npcBuildings.find(b => b.id === v.buildingTarget);
        if (building && building.isUnderConstruction) {
            building.builder = null;
            building.waitingForBuilder = true;
        }
        v.isBuilding = false;
        v.buildingTarget = null;
    }
    v.isDeliveringStone = false;
    v.deliveryTarget = null;
    v.hasTask = false;
    v.state = 'idle';
}

const COMBAT_GRID_SIZE = 200; // Pixel pro Grid-Zelle

// ===== KAMPF-GRIDS FÜR ALLE 3 SPIELERTYPEN =====

let combatGridDirtyPlayer2 = true;
let combatGridDirtyNpc = true;
let combatGridDirtyEnemy = true;

// ===== HILFSFUNKTION FÜR GRID-KEYS =====
function getCombatGridKey(x, y) {
    const cx = Math.floor(x / COMBAT_GRID_SIZE);
    const cy = Math.floor(y / COMBAT_GRID_SIZE);
    return cx + ',' + cy;
}

// ===== NACHBAR-GRID-KEYS IN REICHWEITE =====
function getNeighborCombatGridKeys(x, y, range) {
    const cx = Math.floor(x / COMBAT_GRID_SIZE);
    const cy = Math.floor(y / COMBAT_GRID_SIZE);
    const radius = Math.ceil(range / COMBAT_GRID_SIZE) + 1;
    const keys = [];
    for (let dx = -radius; dx <= radius; dx++) {
        for (let dy = -radius; dy <= radius; dy++) {
            keys.push((cx + dx) + ',' + (cy + dy));
        }
    }
    return keys;
}

// ===== GRID FÜR SPIELER 1 NEU AUFBAUEN =====
function rebuildCombatGridPlayer() {
    combatGridPlayer.clear();
    for (let v of villagers) {
        if (!v.alive) continue;
        const key = getCombatGridKey(v.x, v.y);
        if (!combatGridPlayer.has(key)) {
            combatGridPlayer.set(key, []);
        }
        combatGridPlayer.get(key).push(v);
    }
    combatGridDirtyPlayer = false;
}

// ===== SPIELER 1 IN REICHWEITE FINDEN =====
function getPlayerVillagersInRange(x, y, range) {
    if (combatGridDirtyPlayer) {
        rebuildCombatGridPlayer();
    }
    
    const keys = getNeighborCombatGridKeys(x, y, range);
    const result = [];
    const rangeSq = range * range;
    
    for (let key of keys) {
        const cells = combatGridPlayer.get(key);
        if (cells) {
            for (let v of cells) {
                if (!v.alive) continue;
                const dx = v.x - x;
                const dy = v.y - y;
                if (dx*dx + dy*dy < rangeSq) {
                    result.push(v);
                }
            }

    return result;

// ===== SPIELER 1 WIRTSCHAFT =====
function updateEconomyPlayer1(dt) {
    // ===== HÄUSER: GETREIDE VERBRAUCHEN UND EINWOHNER WACHSEN LASSEN =====
    buildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {
        h.grainConsumeTimer += dt;
        while (h.grainConsumeTimer >= 15) {
            h.grainConsumeTimer -= 15;
            if (resources.grain > 0) {
                resources.grain -= 1;
            } else {
                h.growthTimer = 0;
            }
        }
        if (resources.grain > 0 && h.residents < h.maxResidents) {
            h.growthTimer += dt;
            if (h.growthTimer >= 30) {
                h.growthTimer -= 30;
                h.residents += 1;
                spawnVillager(h.id);
                markDirty('villagers');
            }
        } else if (resources.grain <= 0) {
            h.growthTimer = 0;
        }
    });

    // ===== FISCHERHÜTTEN PRODUZIEREN FISCH =====
    const fischerhütten = buildings.filter(b => 
        b.type === 'fischerhütte' && !b.isUnderConstruction
    );

    for (let b of fischerhütten) {
        b.fishProductionTimer = (b.fishProductionTimer || 0) + dt;
        const interval = 30 / (b.level || 1);
        if (b.fishProductionTimer >= interval) {
            b.fishProductionTimer -= interval;
            resources.fish = (resources.fish || 0) + 1;
            markDirty('buildings');
        }
    }

    // ===== FISCH-VERBRAUCH FÜR RESSOURCEN-GEBÄUDE =====
    const resourceBuildings = buildings.filter(b => 
        (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && 
        !b.isUnderConstruction
    );

    for (let b of resourceBuildings) {
        if (b.fishStorage === undefined) b.fishStorage = 0;
        if (b.maxFishStorage === undefined) b.maxFishStorage = 3;
        if (b.fishConsumeTimer === undefined) b.fishConsumeTimer = 0;
        if (b.hasFishBonus === undefined) b.hasFishBonus = false;
        if (b.fishBonusTimer === undefined) b.fishBonusTimer = 0;
        if (b.fishConsumeInterval === undefined) b.fishConsumeInterval = 18;

        b.fishConsumeTimer += dt;
        if (b.fishConsumeTimer >= b.fishConsumeInterval) {
            b.fishConsumeTimer -= b.fishConsumeInterval;
            if (b.fishStorage > 0) {
                b.fishStorage--;
                b.hasFishBonus = true;
                b.fishBonusTimer = 0;
            } else {
                b.hasFishBonus = false;
                b.fishBonusTimer += b.fishConsumeInterval;
            }
        }

        if (resources.fish > 0 && b.fishStorage < b.maxFishStorage) {
            const needed = b.maxFishStorage - b.fishStorage;
            const toAdd = Math.min(needed, resources.fish);
            b.fishStorage += toAdd;
            resources.fish -= toAdd;
        }

        let fishMultiplier = 1.0;
        if (b.fishStorage >= 3) {
            fishMultiplier = 1.5;
            b.hasFishBonus = true;
        } else if (b.fishStorage === 0 && b.fishBonusTimer > 60) {
            fishMultiplier = 0.75;
            b.hasFishBonus = false;
        } else {
            fishMultiplier = 1.0;
            b.hasFishBonus = false;
        }
        
        const baseTime = b.baseMaxProductionTime || 30;
        const levelMultiplier = b.level || 1;
        b.maxProductionTime = (baseTime / levelMultiplier) * (1 / fishMultiplier);
        
        const node = resourceNodes.find(n => n.buildingId === b.id);
        if (node) {
            const progress = node.timer / node.maxTimer;
            node.maxTimer = b.maxProductionTime;
            node.timer = progress * node.maxTimer;
        }
    }
}

// ============================================================
//  WASM-WRAPPER FÜR NPC WIRTSCHAFT
// ============================================================
function updateNpcEconomyWithWasm(dt) {
    if (!wasmLoaded || !wasmExports || typeof wasmExports.updateNpcHouses !== 'function') {
        return false;
    }
    
    try {
        // ===== 1. HÄUSER =====
        const houses = npcBuildings.filter(b => b.type === 'haus');
        if (houses.length > 0) {
            // Daten für C++ vorbereiten
            const houseData = houses.map(h => ({
                id: h.id,
                type: 0,
                grainConsumeTimer: h.grainConsumeTimer || 0,
                growthTimer: h.growthTimer || 0,
                residents: h.residents || 0,
                maxResidents: h.maxResidents || 6,
                fishProductionTimer: 0,
                fishProductionInterval: 0,
                fishStorage: 0,
                maxFishStorage: 0,
                fishConsumeTimer: 0,
                fishConsumeInterval: 0,
                hasFishBonus: 0,
                fishBonusTimer: 0,
                baseMaxProductionTime: 0,
                maxProductionTime: 0,
                isUnderConstruction: h.isUnderConstruction ? 1 : 0,
                level: h.level || 1
            }));
            
            // Arrays für C++ vorbereiten
            const houseCount = houses.length;
            const resources = new Float32Array([npcResources.grain, npcResources.wood, npcResources.stone, npcResources.fish || 0]);
            
            wasmExports.updateNpcHouses(
                houseData, houseCount, resources, dt
            );
            
            // Ergebnisse zurückschreiben
            for (let i = 0; i < houseCount; i++) {
                const h = houses[i];
                const d = houseData[i];
                h.grainConsumeTimer = d.grainConsumeTimer;
                h.growthTimer = d.growthTimer;
                h.residents = d.residents;
            }
            npcResources.grain = resources[0];
        }
        
        // ===== 2. FISCHERHÜTTEN =====
        const fischer = npcBuildings.filter(b => b.type === 'fischerhütte');
        if (fischer.length > 0) {
            const fischerData = fischer.map(f => ({
                id: f.id,
                type: 7,
                grainConsumeTimer: 0,
                growthTimer: 0,
                residents: 0,
                maxResidents: 0,
                fishProductionTimer: f.fishProductionTimer || 0,
                fishProductionInterval: f.fishProductionInterval || 30,
                fishStorage: 0,
                maxFishStorage: 0,
                fishConsumeTimer: 0,
                fishConsumeInterval: 0,
                hasFishBonus: 0,
                fishBonusTimer: 0,
                baseMaxProductionTime: 0,
                maxProductionTime: 0,
                isUnderConstruction: f.isUnderConstruction ? 1 : 0,
                level: f.level || 1
            }));
            
            const resources = new Float32Array([0, 0, 0, npcResources.fish || 0]);
            
            wasmExports.updateNpcFischerhütten(
                fischerData, fischer.length, resources, dt
            );
            
            for (let i = 0; i < fischer.length; i++) {
                const f = fischer[i];
                const d = fischerData[i];
                f.fishProductionTimer = d.fishProductionTimer;
            }
            npcResources.fish = resources[3];
        }
        
        // ===== 3. RESSOURCEN-GEBÄUDE (Bauer, Holzfäller, Steinmetz) =====
        const resourceBuildings = npcBuildings.filter(b => 
            (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') &&
            !b.isUnderConstruction
        );
        if (resourceBuildings.length > 0) {
            const resData = resourceBuildings.map(b => ({
                id: b.id,
                type: b.type === 'bauer' ? 2 : (b.type === 'holzfaeller' ? 3 : 4),
                grainConsumeTimer: 0,
                growthTimer: 0,
                residents: 0,
                maxResidents: 0,
                fishProductionTimer: 0,
                fishProductionInterval: 0,
                fishStorage: b.fishStorage || 0,
                maxFishStorage: b.maxFishStorage || 3,
                fishConsumeTimer: b.fishConsumeTimer || 0,
                fishConsumeInterval: 18,
                hasFishBonus: b.hasFishBonus ? 1 : 0,
                fishBonusTimer: b.fishBonusTimer || 0,
                baseMaxProductionTime: b.baseMaxProductionTime || 30,
                maxProductionTime: b.maxProductionTime || 30,
                isUnderConstruction: 0,
                level: b.level || 1
            }));
            
            const resources = new Float32Array([
                npcResources.grain,
                npcResources.wood,
                npcResources.stone,
                npcResources.fish || 0
            ]);
            
            const fishStorageArray = new Float32Array(resData.map(d => d.fishStorage));
            const hasFishBonusArray = new Uint8Array(resData.map(d => d.hasFishBonus));
            const fishBonusTimerArray = new Float32Array(resData.map(d => d.fishBonusTimer));
            const maxProductionTimeArray = new Float32Array(resData.map(d => d.maxProductionTime));
            
            wasmExports.updateNpcResourceBuildings(
                resData, resourceBuildings.length, resources,
                fishStorageArray, hasFishBonusArray, fishBonusTimerArray,
                maxProductionTimeArray, dt
            );
            
            for (let i = 0; i < resourceBuildings.length; i++) {
                const b = resourceBuildings[i];
                b.fishStorage = fishStorageArray[i];
                b.hasFishBonus = hasFishBonusArray[i] === 1;
                b.fishBonusTimer = fishBonusTimerArray[i];
                b.maxProductionTime = maxProductionTimeArray[i];
            }
            npcResources.grain = resources[0];
            npcResources.wood = resources[1];
            npcResources.stone = resources[2];
            npcResources.fish = resources[3];
        }
        
        // ===== 4. GETREIDE-BILANZ =====
        if (typeof npcGrainStart !== 'undefined') {
            const grainNow = npcResources.grain;
            const timer = npcGrainCheckTimer || 0;
            const balance = wasmExports.updateNpcGrainBalance(
                npcGrainStart, grainNow, dt, timer
            );
            npcGrainBalance = balance;
            npcGrainCheckTimer = timer;
            if (npcGrainCheckTimer === 0) {
                npcGrainStart = grainNow;
            }
        }
        
        return true;
    } catch(e) {
        console.warn('⚠️ WASM-NPC-Wirtschaft Fehler:', e.message);
        return false;
    }
}

    const wasmDone = updateNpcEconomyWithWasm(dt);

    if (!wasmDone) {
        // HÄUSER: Getreide verbrauchen und Einwohner wachsen lassen
