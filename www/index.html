<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Siedlungsspiel - Mit NPC Krieg</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    body { background: #1a2a1f; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; position: fixed; touch-action: manipulation; }
    #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #2d3e2b; }
    canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }
    
.toolbar { 
  position: absolute; 
  left: 50%; 
  transform: translateX(-50%); 
  background: transparent; 
  backdrop-filter: none; 
  -webkit-backdrop-filter: none; 
  border-radius: 40px; 
  padding: 8px 10px; 
  display: flex; 
  gap: 8px; 
  z-index: 20; 
  box-shadow: none; 
  border: none; 
  justify-content: space-evenly; 
  width: min(90vw, 600px);
}

.tool-btn { 
  width: 55px; 
  height: 55px; 
  min-width: 0;
  flex: 1 1 0;
  max-width: 66px;
  border-radius: 30px; 
  border: 2px solid rgba(255,255,255,0.3); 
  background: #2c3a2a; 
  color: white; 
  font-weight: bold; 
  font-size: 20px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  cursor: pointer; 
  transition: all 0.2s; 
  box-shadow: 0 4px 8px rgba(0,0,0,0.5); 
  position: relative; 
}

/* Sehr kleine Bildschirme */
@media (max-width: 380px) {
  .tool-btn {
    width: auto;
    height: 50px;
    font-size: 18px;
    max-width: 58px;
  }
  .toolbar {
    padding: 6px 6px;
    gap: 4px;
    width: 95vw;
  }
}

    .tool-btn.active { border: 3px solid #ffd966; box-shadow: 0 0 22px #f0b323; transform: scale(1.1); background: #3d5035; }
    .tool-btn.haus { background: #c0392b; }
    .tool-btn.lager { background: #2980b9; }
    .tool-btn.bauer { background: #27ae60; }
    .tool-btn.holzfaeller { background: #6b4c3b; }
    .tool-btn.steinmetz { background: #5d6d7e; }
    .tool-btn.wachturm { background: #7d6608; }
    .tool-btn.deselect { background: #2c3e50; font-size: 20px; }
    .tool-btn.upgrade-btn { background: #8e44ad; font-size: 16px; }
    .tool-btn.upgrade-btn.active { border-color: #ff66ff; box-shadow: 0 0 22px #ff66ff; }
    .tool-btn.destroy-btn { background: #e74c3c; font-size: 16px; }
    .tool-btn.destroy-btn.active { border-color: #ff0000; box-shadow: 0 0 22px #ff0000; }
    .cost-badge { position: absolute; bottom: -8px; right: -8px; background: #222; color: #ffd966; font-size: 6px; padding: 2px 4px; border-radius: 8px; white-space: nowrap; font-weight: normal; }

 .stats { 
  position: absolute; 
  top: 10px; 
  left: 10px; 
  background: rgba(0,0,0,0.75); 
  backdrop-filter: blur(10px); 
  -webkit-backdrop-filter: blur(10px); 
  color: #eee; 
  padding: 6px 10px; 
  border-radius: 20px; 
  font-size: 13px; 
  z-index: 20; 
  display: flex; 
  flex-direction: row; 
  gap: 6px; 
  border: 1px solid #555; 
  align-items: center;
  white-space: nowrap;
}
.stats span { 
  font-weight: bold; 
  color: #ffd966; 
}

    .confirm-dialog { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: white; padding: 20px; border-radius: 20px; z-index: 30; text-align: center; display: none; border: 2px solid #ffd966; min-width: 200px; }
    .confirm-dialog button { background: #ffd966; color: black; border: none; padding: 10px 20px; margin: 5px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .confirm-dialog button.cancel { background: #c0392b; color: white; }
    .confirm-dialog .cost-display { color: #ffd966; font-size: 14px; margin: 8px 0; }
    .confirm-dialog .effect-display { color: #66ff66; font-size: 13px; margin: 4px 0; }

    .game-over-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; justify-content: center; align-items: center; flex-direction: column; color: white; font-family: 'Segoe UI', system-ui, sans-serif; }
    .game-over-overlay h1 { font-size: 72px; margin-bottom: 20px; text-shadow: 0 0 30px rgba(255,215,0,0.5); }
    .game-over-overlay .sub { font-size: 24px; opacity: 0.8; }
    .game-over-overlay .restart-btn { margin-top: 30px; padding: 15px 40px; font-size: 24px; background: #ffd966; color: black; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
    .game-over-overlay .restart-btn:hover { transform: scale(1.1); }
  </style>
</head>

<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
<div class="game-over-overlay" id="gameOverOverlay">
  <h1 id="gameOverTitle">🎉 SIEG!</h1>
  <div class="sub" id="gameOverSub">Du hast alle NPC-Gebäude erobert!</div>
  <button class="restart-btn" id="restartBtn">🔄 Neues Spiel</button>
  <button class="restart-btn" id="continueBtn" style="background:#2ecc71; margin-top:10px;">▶️ Weiterspielen</button>
</div>

  <!-- Spieler-Status (transparent) -->
  <div class="stats" id="statsDisplay" style="top:8px; left:8px; right:8px; width:auto; background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; border:none; padding:4px 8px;">
    <span style="color:#ffd966;">👤</span>
    <span>🌾<b id="grainCount">0</b></span>
    <span>🪵<b id="woodCount">0</b></span>
    <span>🪨<b id="stoneCount">0</b></span>
    <span>👥<b id="popCount">0</b></span>
    <span>🧑‍🌾<b id="freeCount">0</b></span>
  </div>

  <!-- NPC-Status (transparent) -->
  <div class="stats" id="npcStatsDisplay" style="top:32px; left:8px; right:8px; width:auto; background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; border:none; padding:4px 8px;">
    <span style="color:#9b59b6;">🤖</span>
    <span>🌾<b id="npcGrainCount">0</b></span>
    <span>🪵<b id="npcWoodCount">0</b></span>
    <span>🪨<b id="npcStoneCount">0</b></span>
    <span>👥<b id="npcPopCount">0</b></span>
    <span>🏠<b id="npcBuildingCount">0</b></span>
  </div>

<button id="toggleToolbarBtn" style="position:absolute; bottom:130px; right:10px; z-index:21; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; width:30px; height:30px; font-size:16px;">▲</button>
  <div class="confirm-dialog" id="confirmDialog">
    <div id="confirmText">Aktion bestätigen</div>
    <div class="cost-display" id="costDisplay"></div>
    <div class="effect-display" id="effectDisplay"></div>
    <button id="confirmYes">✅ Ja</button>
    <button id="confirmNo" class="cancel">❌ Nein</button>
  </div>
  
  <!-- Toolbar Zeile 1: Gebäude 1-4 -->
  <div class="toolbar" id="toolbarRow1" style="bottom:76px;">
    <button class="tool-btn haus" data-type="haus"><span>🏠</span><span class="cost-badge">3🪵</span></button>
    <button class="tool-btn lager" data-type="lager"><span>📦</span><span class="cost-badge">10🪵10🪨</span></button>
    <button class="tool-btn bauer" data-type="bauer"><span>🌾</span><span class="cost-badge">1👥5🪵</span></button>
    <button class="tool-btn holzfaeller" data-type="holzfaeller"><span>🪓</span><span class="cost-badge">2👥</span></button>
  </div>
  
  <!-- Toolbar Zeile 2: Gebäude 5-6 + Aktionen -->
  <div class="toolbar" id="toolbarRow2" style="bottom:16px;">
    <button class="tool-btn steinmetz" data-type="steinmetz"><span>⛏️</span><span class="cost-badge">2👥5🪵</span></button>
    <button class="tool-btn wachturm" data-type="wachturm"><span>🏹</span><span class="cost-badge">15🪵</span></button>
    <button class="tool-btn deselect" id="deselectBtn">✖</button>
    <button class="tool-btn upgrade-btn" id="upgradeBtn">⬆️</button>
    <button class="tool-btn destroy-btn" id="destroyBtn">💀</button>
  </div>
</div>
<script>
// =========================================================================
//  MODUL 1: KONFIGURATION & KONSTANTEN
// =========================================================================
const CONFIG = {
  CELL_SIZE: 30,
  GRID_WIDTH: 80,
  GRID_HEIGHT: 80,
  TOWER_RANGE: 5,
  NPC_BUILD_INTERVAL: 2,
  NPC_MIN_RESOURCES: 3,
  NPC_MIN_LAGER_DIST: 8,
  NPC_BUILD_DIST: 1,
  MAX_ENEMIES: 500,
  MAX_SPAWN_PER_FRAME: 100,
  COMBAT_RANGE: 10,
  CAPTURE_TIME: 10,
  CAPTURE_TIMEOUT: 5,
  NPC_START_DIST: 35,
  BUILD_TIME: 10,
  NPC_HOUSE_INTERVAL: 200,
  NPC_MAX_BUILD_DIST: 6,
  MAX_STONE_DELIVERERS_PER_TOWER: 15
};

const WORLD_WIDTH = CONFIG.GRID_WIDTH * CONFIG.CELL_SIZE;
const WORLD_HEIGHT = CONFIG.GRID_HEIGHT * CONFIG.CELL_SIZE;

// =========================================================================
//  MODUL 2: TERRAIN-GENERIERUNG
// =========================================================================
let terrainMap = [];

function generateTerrain() {
  terrainMap = [];
  for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
    const row = [];
    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
      const val = Math.random();
      let terrainType;
      if (val < 0.50) terrainType = 0;
      else if (val < 0.75) terrainType = 1;
      else terrainType = 2;
      
      if (x > 0 && y > 0) {
        const left = row[x-1];
        const up = terrainMap[y-1] ? terrainMap[y-1][x] : -1;
        if (left !== -1 && up !== -1 && left === up && Math.random() < 0.7) {
          terrainType = left;
        }
      }
      row.push(terrainType);
    }
    terrainMap.push(row);
  }
  let counts = [0,0,0];
  for (let y = 0; y < CONFIG.GRID_HEIGHT; y++) {
    for (let x = 0; x < CONFIG.GRID_WIDTH; x++) {
      counts[terrainMap[y][x]]++;
    }
  }
  const total = CONFIG.GRID_WIDTH * CONFIG.GRID_HEIGHT;
  if (Math.abs(counts[0]/total - 0.50) > 0.10 ||
      Math.abs(counts[1]/total - 0.25) > 0.10 ||
      Math.abs(counts[2]/total - 0.25) > 0.10) {
    generateTerrain();
  }
}

function getTerrainType(gx, gy) {
  if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
    return terrainMap[gy][gx];
  }
  return -1;
}

function getTerrainColor(type) {
  switch(type) {
    case 0: return '#c9b87a';
    case 1: return '#7a9a5a';
    case 2: return '#9aa8b5';
    default: return '#4a6b3a';
  }
}

function getTerrainEmoji(type) {
  switch(type) {
    case 0: return '🌾';
    case 1: return '🌲';
    case 2: return '🪨';
    default: return '';
  }
}

function isResourceFieldAvailable(gx, gy, type) {
  const terrain = getTerrainType(gx, gy);
  if (terrain === -1) return false;
  if (type === 'grain' && terrain === 0) return true;
  if (type === 'wood' && terrain === 1) return true;
  if (type === 'stone' && terrain === 2) return true;
  return false;
}

function countResourcesAround(gx, gy, type) {
  let count = 0;
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (isResourceFieldAvailable(nx, ny, type)) count++;
    }
  }
  return count;
}

// =========================================================================
//  MODUL 3: KAMERA
// =========================================================================
let camera = { x: WORLD_WIDTH/2, y: WORLD_HEIGHT/2, zoom: 0.3, minZoom: 0.08, maxZoom: 1.5 };

// =========================================================================
//  MODUL 4: SPIELZUSTAND (erweitert um continueAfterVictory und npcLastUpgradeTime)
// =========================================================================
let gameStarted = false;
let startPhase = 'lager';
let pendingStartBuild = null;
let gameOver = false;
let continueAfterVictory = false;
let gameSpeed = 1;

let buildings = [];
let resources = { grain: 10, wood: 10, stone: 0 };
let resourceNodes = [];
let nextResourceId = 1;
let villagers = [];
let enemies = [];
let nextBuildingId = 1;
let nextVillagerId = 1;
let nextEnemyId = 1;
let lastTimestamp = performance.now();
let enemySpawnCounter = 0;
let attackTimer = 0;
let nextAttackDelay = 60 + Math.random() * 60;
let enemiesHaveCleared = false;

// NPC-Daten
let npcBuildings = [];
let npcTimer = 0;
let npcVillagers = [];
let npcResources = { grain: 10, wood: 10, stone: 0 };
let npcStarted = false;
let npcStartPosition = null;
let npcResourceNodes = [];
let nextNpcResourceId = 1;
let npcHouseTimer = 0;
let npcLastUpgradeTime = 0;

// NPC-Kriegsmodus
let npcWarMode = false;
let npcWarModeTimer = 0;
let npcWarBuildIndex = 0;
const npcWarBuildOrder = ['bauer', 'bauer', 'bauer', 'bauer', 'haus'];

// Eroberungs-Status
let captureTimers = {};

// Bau-Status
let constructionSites = {};

// Visuelle Effekte
let projectiles = [];
let hitEffects = [];

// UI-Zustand
let selectedBuildingType = null;
let pendingBuild = null;
let upgradeMode = false;
let pendingUpgrade = null;
let destroyMode = false;
let pendingDestroy = null;

// Touch
let touches = {};
let activeTouches = [];
let lastPinchDist = 0;
let isPanning = false;
let panStart = { x: 0, y: 0 };
let hasMoved = false;
const MOVE_THRESHOLD = 8;

// Temporäre Nachrichten
let tempMessage = '';
let tempMessageColor = '#fff';
let tempMessageTimer = 0;

// =========================================================================
//  MODUL 5: KLASSEN
// =========================================================================
class Building {
  constructor(id, type, gridX, gridY, isNPC = false) {
    this.id = id;
    this.type = type;
    this.gridX = gridX;
    this.gridY = gridY;
    this.isNPC = isNPC;
    this.residents = 0;
    this.maxResidents = 6;
    this.growthTimer = 0;
    this.grainConsumeTimer = 0;
    this.stoneAmmo = 0;
    this.maxStoneAmmo = 15;
    this.shootCooldown = 0;
    this.level = 1;
    this.baseMaxProductionTime = 0;
    this.maxProductionTime = 0;
    this.baseFireRate = 1.0;
    this.doubleShot = false;
    this.productionType = null;
    this.supplyRequested = false;
    this.isUnderConstruction = false;
    this.constructionProgress = 0;
    this.constructionTimer = 0;
    this.builder = null;
    this.waitingForBuilder = false;
    this.reservedStone = 0;
    this.captureProgress = 0;
    this.beingCaptured = false;
    this.capturedBy = null;
  }
}

class Villager {
  constructor(id, homeId, isNPC = false) {
    this.id = id;
    this.homeId = homeId;
    this.isNPC = isNPC;
    this.x = 0; this.y = 0;
    this.targetX = 0; this.targetY = 0;
    this.speed = isNPC ? 70 : 65;
    this.carrying = null;
    this.state = 'idle';
    this.resourceTarget = null;
    this.alive = true;
    this.hasTask = false;
    this.deliveryTarget = null;
    this.npcHomeLager = null;
    this.isDeliveringStone = false;
    this.towerTarget = null;
    this.stoneToDeliver = 0;
    this.isAttacking = false;
    this.attackTarget = null;
    this.combatCooldown = 0;
    this.capturingBuilding = null;
    this.captureTimer = 0;
    this.lastCaptureTime = 0;
    this.isBuilding = false;
    this.buildingTarget = null;
    this.buildingProgress = 0;
    this.hasReservedStone = false;
  }
}

class Enemy {
  constructor(id, x, y, isSuper = false) {
    this.id = id;
    this.x = x; this.y = y;
    this.speed = isSuper ? 35 : 45;
    this.killCount = 0;
    this.alive = true;
    this.targetVillager = null;
    this.isSuper = isSuper;
    this.hits = 0;
    this.maxHits = isSuper ? 3 : 1;
  }
}


// =========================================================================
//  MODUL 6: HILFSFUNKTIONEN – VOLLSTÄNDIG
// =========================================================================
function isCellOccupied(gx, gy, ignoreId = null) {
  return buildings.some(b => b.gridX === gx && b.gridY === gy && b.id !== ignoreId) ||
         npcBuildings.some(b => b.gridX === gx && b.gridY === gy && b.id !== ignoreId);
}

function isFieldClaimedByResourceNode(gx, gy) {
  for (let node of resourceNodes) { if (node.x === gx && node.y === gy) return true; }
  for (let node of npcResourceNodes) { if (node.x === gx && node.y === gy) return true; }
  return false;
}

function getAllBuildings() {
  return [...buildings, ...npcBuildings];
}

function getNeighborCells(gx, gy, range = 1) {
  const cells = [];
  for (let dx = -range; dx <= range; dx++) {
    for (let dy = -range; dy <= range; dy++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (nx >= 0 && nx < CONFIG.GRID_WIDTH && ny >= 0 && ny < CONFIG.GRID_HEIGHT) {
        cells.push({ x: nx, y: ny });
      }
    }
  }
  return cells;
}

function getBauerFields(bauer) {
  return getNeighborCells(bauer.gridX, bauer.gridY, 1)
    .filter(c => !isCellOccupied(c.x, c.y, bauer.id) && isResourceFieldAvailable(c.x, c.y, 'grain'));
}

function getHolzfaellerFields(holz) {
  return getNeighborCells(holz.gridX, holz.gridY, 1)
    .filter(c => !isCellOccupied(c.x, c.y, holz.id) && isResourceFieldAvailable(c.x, c.y, 'wood'));
}

function getSteinmetzFields(stein) {
  return getNeighborCells(stein.gridX, stein.gridY, 1)
    .filter(c => !isCellOccupied(c.x, c.y, stein.id) && isResourceFieldAvailable(c.x, c.y, 'stone'));
}

function getBuildingColor(type) {
  const colors = {
    haus: '#c0392b', lager: '#2980b9', bauer: '#27ae60',
    holzfaeller: '#6b4c3b', steinmetz: '#5d6d7e', wachturm: '#7d6608'
  };
  return colors[type] || '#888';
}

function getNPCBuildingColor(type) {
  const colors = {
    haus: '#4f8c9e', lager: '#6e8cc9', bauer: '#8c9e6e',
    holzfaeller: '#5c8c7b', steinmetz: '#8a7b6e', wachturm: '#7d6e8c'
  };
  return colors[type] || '#888';
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - canvas.width/2) / camera.zoom + camera.x,
    y: (sy - canvas.height/2) / camera.zoom + camera.y
  };
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function getFreeVillagers() {
  return villagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding).length;
}

function getNPCFreeVillagers() {
  return npcVillagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding).length;
}

function findNearestLager(gx, gy, isNPC = false) {
  const all = isNPC ? npcBuildings : buildings;
  let best = null, bestDist = Infinity;
  for (let b of all) {
    if (b.type !== 'lager') continue;
    const d = Math.hypot(b.gridX - gx, b.gridY - gy);
    if (d < bestDist) { bestDist = d; best = b; }
  }
  return best;
}

function findNearestTower(gx, gy, isNPC = false) {
  const all = isNPC ? npcBuildings : buildings;
  let best = null, bestDist = Infinity;
  for (let b of all) {
    if (b.type !== 'wachturm') continue;
    const d = Math.hypot(b.gridX - gx, b.gridY - gy);
    if (d < bestDist) { bestDist = d; best = b; }
  }
  return best;
}

function findNearestHome(gx, gy, isNPC = false) {
  const all = isNPC ? npcBuildings : buildings;
  let best = null, bestDist = Infinity;
  for (let b of all) {
    if (b.type !== 'haus') continue;
    const d = Math.hypot(b.gridX - gx, b.gridY - gy);
    if (d < bestDist) { bestDist = d; best = b; }
  }
  return best;
}

function findNearestTowerWithSpace(gx, gy) {
  let best = null, bestDist = Infinity;
  for (let b of buildings) {
    if (b.type !== 'wachturm' || b.isUnderConstruction) continue;
    if (b.stoneAmmo >= b.maxStoneAmmo) continue;
    const d = Math.hypot(b.gridX - gx, b.gridY - gy);
    if (d < bestDist) { bestDist = d; best = b; }
  }
  return best;
}

function findNearestNPCTowerWithSpace(gx, gy) {
  let best = null, bestDist = Infinity;
  for (let b of npcBuildings) {
    if (b.type !== 'wachturm' || b.isUnderConstruction) continue;
    if (b.stoneAmmo >= b.maxStoneAmmo) continue;
    const d = Math.hypot(b.gridX - gx, b.gridY - gy);
    if (d < bestDist) { bestDist = d; best = b; }
  }
  return best;
}

function getMaxEnemies() {
  const pop = villagers.filter(v => v.alive).length;
  let max = 0;
  if (pop <= 24) max = Math.max(pop, 10);
  else if (pop <= 96) max = pop * 2;
  else max = pop * 3;
  return Math.min(max, CONFIG.MAX_ENEMIES);
}

function getUpgradeCostAndEffect(building) {
  const level = building.level;
  const costs = [
    { wood: 10, stone: 10 },
    { wood: 20, stone: 20 },
    { wood: 40, stone: 40 }
  ];
  const effects = {
    haus: [
      { residents: 8, desc: '8 Einwohner' },
      { residents: 10, desc: '10 Einwohner' },
      { residents: 12, desc: '12 Einwohner' }
    ],
    bauer: [
      { production: 2.0, desc: '200% Produktion' },
      { production: 2.5, desc: '250% Produktion' },
      { production: 3.0, desc: '300% Produktion' }
    ],
    holzfaeller: [
      { production: 2.0, desc: '200% Produktion' },
      { production: 2.5, desc: '250% Produktion' },
      { production: 3.0, desc: '300% Produktion' }
    ],
    steinmetz: [
      { production: 2.0, desc: '200% Produktion' },
      { production: 2.5, desc: '250% Produktion' },
      { production: 3.0, desc: '300% Produktion' }
    ],
    wachturm: [
      { fireRate: 1.25, desc: '25% erhöhte Feuerrate' },
      { fireRate: 1.5, desc: '50% erhöhte Feuerrate' },
      { fireRate: 1.5, doubleShot: true, desc: 'Doppelschuss + 50% Feuerrate' }
    ],
    lager: [
      { production: 2.0, desc: '200% Produktion' },
      { production: 2.5, desc: '250% Produktion' },
      { production: 3.0, desc: '300% Produktion' }
    ]
  };
  const idx = Math.min(level - 1, 2);
  const cost = costs[idx] || costs[2];
  const effect = effects[building.type] ? effects[building.type][idx] : { desc: 'Verbesserung' };
  return { cost, effect };
}

function countResourcesAround(gx, gy, type) {
  let count = 0;
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (isResourceFieldAvailable(nx, ny, type) && 
          !isCellOccupied(nx, ny) && 
          !isFieldClaimedByResourceNode(nx, ny)) count++;
    }
  }
  return count;
}

// =========================================================================
//  MODUL 7: SPIELER-LOGIK (Bauen mit Rohstoffen + Bauzeit + Einwohner-Kosten)
// =========================================================================
function canAfford(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return true;

  const free = getFreeVillagers();
  switch(type) {
    case 'haus':       return resources.wood >= 3;
    case 'lager':      return resources.wood >= 10 && resources.stone >= 10;
    case 'bauer':      return resources.wood >= 5;
    case 'holzfaeller': return free >= 2;
    case 'steinmetz':  return resources.wood >= 5 && free >= 2;
    case 'wachturm':   return resources.wood >= 15;
    default:           return true;
  }
}

function deductCost(type) {
  if (!gameStarted && (type === 'lager' || type === 'haus')) return;

  switch(type) {
    case 'haus':       resources.wood -= 3; break;
    case 'lager':      resources.wood -= 10; resources.stone -= 10; break;
    case 'bauer':      resources.wood -= 5; break;
    case 'holzfaeller': break;
    case 'steinmetz':  resources.wood -= 5; break;
    case 'wachturm':   resources.wood -= 15; break;
  }

  let einwohnerKosten = 0;
  if (type === 'holzfaeller') einwohnerKosten = 2;
  else if (type === 'steinmetz') einwohnerKosten = 2;
  if (einwohnerKosten > 0) removeFreeVillagers(einwohnerKosten);
}

function removeFreeVillagers(count) {
  let removed = 0;
  for (let v of villagers) {
    if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
      v.alive = false;
      const home = buildings.find(b => b.id === v.homeId);
      if (home && home.residents > 0) home.residents -= 1;
      removed++;
    }
  }
  villagers = villagers.filter(v => v.alive);
}

function getBuildingSupplyCost(type) {
  switch(type) {
    case 'haus':       return { wood: 3, stone: 0 };
    case 'lager':      return { wood: 10, stone: 10 };
    case 'bauer':      return { wood: 5, stone: 0 };
    case 'holzfaeller': return { wood: 0, stone: 0 };
    case 'steinmetz':  return { wood: 5, stone: 0 };
    case 'wachturm':   return { wood: 15, stone: 0 };
    default:           return { wood: 0, stone: 0 };
  }
}

function startConstruction(type, gx, gy) {
  if (isCellOccupied(gx, gy)) return false;
  if (!canAfford(type)) return false;

  deductCost(type);

  const b = new Building(nextBuildingId++, type, gx, gy, false);
  b.isUnderConstruction = true;
  b.constructionTimer = 0;
  b.constructionProgress = 0;
  b.waitingForBuilder = true;
  buildings.push(b);

  assignBuilderToConstruction(b.id);

  return true;
}

function assignBuilderToConstruction(buildingId) {
  const building = buildings.find(b => b.id === buildingId);
  if (!building) return false;
  if (!building.isUnderConstruction) return false;
  if (building.builder) return true;

  const freeVillagers = villagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
  if (freeVillagers.length < 1) {
    building.waitingForBuilder = true;
    return false;
  }

  const builder = freeVillagers[0];
  builder.isBuilding = true;
  builder.buildingTarget = building.id;
  builder.buildingProgress = 0;
  builder.state = 'building';
  builder.targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
  builder.targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
  builder.hasTask = true;
  building.builder = builder.id;
  building.waitingForBuilder = false;

  constructionSites[building.id] = { timer: 0, maxTimer: CONFIG.BUILD_TIME, builder: builder.id, isNPC: false };
  return true;
}

function assignNpcBuilderToConstruction(buildingId) {
  const building = npcBuildings.find(b => b.id === buildingId);
  if (!building) return false;
  if (!building.isUnderConstruction) return false;
  if (building.builder) return true;

  const freeVillagers = npcVillagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
  if (freeVillagers.length < 1) {
    building.waitingForBuilder = true;
    return false;
  }

  const builder = freeVillagers[0];
  builder.isBuilding = true;
  builder.buildingTarget = building.id;
  builder.buildingProgress = 0;
  builder.state = 'building';
  builder.targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
  builder.targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
  builder.hasTask = true;
  building.builder = builder.id;
  building.waitingForBuilder = false;

  constructionSites[building.id] = { timer: 0, maxTimer: CONFIG.BUILD_TIME, builder: builder.id, isNPC: true };
  return true;
}

function updateConstruction(dt) {
  for (let b of buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      assignBuilderToConstruction(b.id);
    }
  }
  for (let b of npcBuildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      assignNpcBuilderToConstruction(b.id);
    }
  }
  
  for (let key in constructionSites) {
    const site = constructionSites[key];
    const buildingId = parseInt(key);
    
    let building = buildings.find(b => b.id === buildingId);
    let isNPC = false;
    if (!building) {
      building = npcBuildings.find(b => b.id === buildingId);
      isNPC = true;
    }
    if (!building) {
      delete constructionSites[key];
      continue;
    }
    
    const builder = isNPC ? 
      npcVillagers.find(v => v.id === site.builder && v.alive) :
      villagers.find(v => v.id === site.builder && v.alive);
    
    if (!builder || !builder.alive) {
      delete constructionSites[key];
      building.builder = null;
      building.waitingForBuilder = true;
      if (isNPC) {
        assignNpcBuilderToConstruction(building.id);
      } else {
        assignBuilderToConstruction(building.id);
      }
      continue;
    }
    
    const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const d = dist(builder, { x: targetX, y: targetY });
    
    if (d < 5) {
      site.timer += dt;
      building.constructionTimer = site.timer;
      building.constructionProgress = site.timer / site.maxTimer;
      
      if (site.timer >= site.maxTimer) {
        building.isUnderConstruction = false;
        building.constructionProgress = 1;
        building.constructionTimer = site.maxTimer;
        building.waitingForBuilder = false;
        if (building.type === 'haus') {
          building.residents = 1;
          if (isNPC) {
            const v = new Villager(nextVillagerId++, building.id, true);
            const cx = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            const cy = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            v.x = cx; v.y = cy; v.targetX = cx; v.targetY = cy;
            v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
            npcVillagers.push(v);
          } else {
            spawnVillager(building.id);
          }
        }
        building.baseMaxProductionTime = building.type === 'holzfaeller' ? 45 : 30;
        building.maxProductionTime = building.baseMaxProductionTime;
        building.baseFireRate = 1.0;
        if (building.type === 'bauer') building.productionType = 'grain';
        else if (building.type === 'holzfaeller') building.productionType = 'wood';
        else if (building.type === 'steinmetz') building.productionType = 'stone';
        
        builder.isBuilding = false;
        builder.buildingTarget = null;
        builder.state = 'idle';
        builder.hasTask = false;
        delete constructionSites[key];
      }
    } else {
      builder.targetX = targetX;
      builder.targetY = targetY;
    }
  }
}

// =========================================================================
//  MODUL 8: RESSOURCEN-NODES
// =========================================================================
function updateResourceNodes(dt) {
  for (let node of resourceNodes) {
    if (!node.ready) {
      node.timer += dt;
      if (node.timer >= node.maxTimer) {
        node.ready = true;
        node.timer = node.maxTimer;
      }
    }
  }
  
  buildings.forEach(b => {
    if (!b.isUnderConstruction && (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz')) {
      const fields = b.type === 'bauer' ? getBauerFields(b) :
                    b.type === 'holzfaeller' ? getHolzfaellerFields(b) :
                    getSteinmetzFields(b);
      const type = b.productionType;
      const maxNodes = 5 * b.level;
      fields.forEach(f => {
        const existing = resourceNodes.filter(n => n.x === f.x && n.y === f.y && n.type === type);
        const readyCount = existing.filter(n => n.ready).length;
        const totalCount = existing.length;
        if (readyCount === 0 && totalCount < maxNodes) {
          const hasGrowing = existing.some(n => !n.ready && n.timer > 0);
          if (!hasGrowing || totalCount === 0) {
            resourceNodes.push({
              id: nextResourceId++,
              x: f.x, y: f.y, type: type,
              timer: 0, maxTimer: b.maxProductionTime,
              ready: false, claimedBy: null,
              isNPC: false
            });
          }
        }
      });
    }
  });
  
  for (let node of npcResourceNodes) {
    if (!node.ready) {
      node.timer += dt;
      if (node.timer >= node.maxTimer) {
        node.ready = true;
        node.timer = node.maxTimer;
      }
    }
  }
  
  npcBuildings.forEach(b => {
    if (!b.isUnderConstruction && (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz')) {
      const fields = b.type === 'bauer' ? getBauerFields(b) :
                    b.type === 'holzfaeller' ? getHolzfaellerFields(b) :
                    getSteinmetzFields(b);
      const type = b.productionType;
      const maxNodes = 5 * b.level;
      fields.forEach(f => {
        const existing = npcResourceNodes.filter(n => n.x === f.x && n.y === f.y && n.type === type);
        const readyCount = existing.filter(n => n.ready).length;
        const totalCount = existing.length;
        if (readyCount === 0 && totalCount < maxNodes) {
          const hasGrowing = existing.some(n => !n.ready && n.timer > 0);
          if (!hasGrowing || totalCount === 0) {
            npcResourceNodes.push({
              id: nextNpcResourceId++,
              x: f.x, y: f.y, type: type,
              timer: 0, maxTimer: b.maxProductionTime,
              ready: false, claimedBy: null,
              isNPC: true
            });
          }
        }
      });
    }
  });
  
  const nodesByField = {};
  for (let node of resourceNodes) {
    const key = node.x + ',' + node.y + ',' + node.type;
    if (!nodesByField[key]) nodesByField[key] = [];
    nodesByField[key].push(node);
  }
  for (let key in nodesByField) {
    const nodes = nodesByField[key];
    if (nodes.length > 10) {
      const notReady = nodes.filter(n => !n.ready);
      const ready = nodes.filter(n => n.ready);
      if (notReady.length > 5) {
        notReady.sort((a,b) => a.timer - b.timer);
        const toRemove = notReady.slice(0, notReady.length - 5);
        for (let node of toRemove) {
          const idx = resourceNodes.indexOf(node);
          if (idx !== -1) resourceNodes.splice(idx, 1);
        }
      }
    }
  }
  
  const npcNodesByField = {};
  for (let node of npcResourceNodes) {
    const key = node.x + ',' + node.y + ',' + node.type;
    if (!npcNodesByField[key]) npcNodesByField[key] = [];
    npcNodesByField[key].push(node);
  }
  for (let key in npcNodesByField) {
    const nodes = npcNodesByField[key];
    if (nodes.length > 10) {
      const notReady = nodes.filter(n => !n.ready);
      const ready = nodes.filter(n => n.ready);
      if (notReady.length > 5) {
        notReady.sort((a,b) => a.timer - b.timer);
        const toRemove = notReady.slice(0, notReady.length - 5);
        for (let node of toRemove) {
          const idx = npcResourceNodes.indexOf(node);
          if (idx !== -1) npcResourceNodes.splice(idx, 1);
        }
      }
    }
  }
}

function getAvailableResourceNodes() {
  const grain = resourceNodes.filter(n => n.ready && !n.claimedBy && n.type === 'grain');
  const wood = resourceNodes.filter(n => n.ready && !n.claimedBy && n.type === 'wood');
  const stone = resourceNodes.filter(n => n.ready && !n.claimedBy && n.type === 'stone');
  return [...grain, ...wood, ...stone];
}

function getAvailableNpcResourceNodes() {
  const grain = npcResourceNodes.filter(n => n.ready && !n.claimedBy && n.type === 'grain');
  const wood = npcResourceNodes.filter(n => n.ready && !n.claimedBy && n.type === 'wood');
  const stone = npcResourceNodes.filter(n => n.ready && !n.claimedBy && n.type === 'stone');
  return [...grain, ...wood, ...stone];
}

// =========================================================================
//  MODUL 9: EINWOHNER-FUNKTIONEN - KOMPLETT (MIT TURM-LIEFERANTEN-RESET BEI ZERSTÖRUNG)
// =========================================================================
function spawnVillager(homeId) {
  const home = buildings.find(b => b.id === homeId);
  if (!home) return null;
  const v = new Villager(nextVillagerId++, homeId, false);
  const cx = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
  const cy = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
  v.x = cx; v.y = cy; v.targetX = cx; v.targetY = cy;
  villagers.push(v);
  return v;
}

function killVillager(v) {
  v.alive = false;
  
  // Ressourcen-Freigabe
  if (v.resourceTarget) {
    const node = resourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.claimedBy === v.id) node.claimedBy = null;
  }
  
  // Stein-Reservierung freigeben
  if (v.hasReservedStone && v.towerTarget) {
    v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
    if (v.carrying === 'stone' || v.isDeliveringStone) {
      resources.stone += (v.stoneToDeliver || 0);
    }
    v.hasReservedStone = false;
    v.towerTarget = null;
    v.stoneToDeliver = 0;
  }
  
  if (v.carrying === 'stone') {
    resources.stone += 1;
    v.carrying = null;
  }
  
  const home = buildings.find(b => b.id === v.homeId);
  if (home && home.residents > 0) home.residents -= 1;
}

function destroyBuilding(gx, gy) {
  const idx = buildings.findIndex(b => b.gridX === gx && b.gridY === gy);
  if (idx === -1) return false;
  const building = buildings[idx];
  
  // Falls ein Turm zerstört wird: alle Lieferanten zurücksetzen, die diesen Turm als Ziel haben
  if (building.type === 'wachturm') {
    for (let v of villagers) {
      if (v.alive && v.towerTarget === building) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
        v.isDeliveringStone = false;
        v.carrying = null;
        v.towerTarget = null;
        v.stoneToDeliver = 0;
        v.hasReservedStone = false;
        v.state = 'idle';
        v.hasTask = false;
      }
    }
  }
  
  const fields = building.type === 'bauer' ? getBauerFields(building) :
                building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                building.type === 'steinmetz' ? getSteinmetzFields(building) : [];
  const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
  resourceNodes = resourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));
  
  if (building.type === 'haus') {
    const residents = villagers.filter(v => v.alive && v.homeId === building.id);
    for (let v of residents) { 
      if (v.hasReservedStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        if (v.carrying === 'stone') {
          resources.stone += (v.stoneToDeliver || 0);
        }
        v.hasReservedStone = false;
      }
      v.alive = false; 
    }
    villagers = villagers.filter(v => v.alive);
  }
  buildings.splice(idx, 1);
  return true;
}

function upgradeBuilding(building) {
  const { cost, effect } = getUpgradeCostAndEffect(building);
  if (resources.wood < cost.wood || resources.stone < cost.stone) return false;
  resources.wood -= cost.wood; resources.stone -= cost.stone;
  building.level += 1;
  if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
    building.maxProductionTime = building.baseMaxProductionTime / building.level;
    const fields = building.type === 'bauer' ? getBauerFields(building) :
                  building.type === 'holzfaeller' ? getHolzfaellerFields(building) :
                  getSteinmetzFields(building);
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    for (let node of resourceNodes) {
      const key = node.x + ',' + node.y;
      if (fieldSet.has(key) && node.type === building.productionType) {
        const progress = node.timer / node.maxTimer;
        node.maxTimer = building.maxProductionTime;
        node.timer = progress * node.maxTimer;
      }
    }
  }
  if (building.type === 'wachturm') {
    if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
    if (effect.doubleShot) building.doubleShot = true;
  } else if (building.type === 'haus') {
    building.maxResidents = effect.residents || 8;
  }
  return true;
}

// =========================================================================
//  MODUL 10: KAMPF- & EROBERUNGS-LOGIK – KOMPLETT (BAUSTELLEN WIEDER BESETZEN)
// =========================================================================
function updateCombatAndCapture(dt) {
  const allPlayerVillagers = villagers.filter(v => v.alive);
  const allNPCVillagers = npcVillagers.filter(v => v.alive);
  
  // === 1. EINWOHNER GREIFEN GEGNERISCHE EINWOHNER AN (KEINE FEINDE ALS INITIALZIEL) ===
  
  const freePlayerVillagers = allPlayerVillagers.filter(v => 
    (v.state === 'idle' || (v.state === 'movingToResource' && v.carrying === null)) &&
    !v.isBuilding && !v.isDeliveringStone && v.state !== 'movingToCapture'
  );
  const freeNPCVillagers = allNPCVillagers.filter(v => 
    (v.state === 'idle' || (v.state === 'movingToResource' && v.carrying === null)) &&
    !v.isBuilding && !v.isDeliveringStone && v.state !== 'movingToCapture'
  );
  
  // Spieler-Einwohner suchen NUR nach NPC-Einwohnern
  for (let pv of freePlayerVillagers) {
    if (pv.combatCooldown > 0) continue;
    if (pv.isAttacking && pv.attackTarget && pv.attackTarget.alive) {
      const d = dist(pv, pv.attackTarget);
      if (d > CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE * 1.5) {
        pv.isAttacking = false; pv.attackTarget = null; pv.hasTask = false;
      }
      continue;
    }
    let closestTarget = null, closestDist = Infinity;
    for (let nv of allNPCVillagers) {
      if (!nv.alive) continue;
      const d = dist(pv, nv);
      if (d < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE && d < closestDist) { closestDist = d; closestTarget = nv; }
    }
    if (closestTarget) {
      pv.resourceTarget = null; pv.isDeliveringStone = false; pv.carrying = null;
      pv.isBuilding = false; pv.buildingTarget = null; pv.towerTarget = null;
      pv.stoneToDeliver = 0; pv.hasReservedStone = false; pv.deliveryTarget = null;
      pv.isAttacking = true; pv.attackTarget = closestTarget;
      pv.targetX = closestTarget.x; pv.targetY = closestTarget.y;
      pv.state = 'attacking'; pv.hasTask = true;
      // Kriegsmodus auslösen, sobald ein Spieler-Einwohner einen NPC angreift
      npcWarMode = true;
      npcWarModeTimer = 300;
    }
  }
  
  // NPC-Einwohner suchen NUR nach Spieler-Einwohnern
  for (let nv of freeNPCVillagers) {
    if (nv.combatCooldown > 0) continue;
    if (nv.isAttacking && nv.attackTarget && nv.attackTarget.alive) {
      const d = dist(nv, nv.attackTarget);
      if (d > CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE * 1.5) {
        nv.isAttacking = false; nv.attackTarget = null; nv.hasTask = false;
      }
      continue;
    }
    let closestTarget = null, closestDist = Infinity;
    for (let pv of allPlayerVillagers) {
      if (!pv.alive) continue;
      const d = dist(nv, pv);
      if (d < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE && d < closestDist) { closestDist = d; closestTarget = pv; }
    }
    if (closestTarget) {
      nv.resourceTarget = null; nv.isDeliveringStone = false; nv.carrying = null;
      nv.isBuilding = false; nv.buildingTarget = null; nv.towerTarget = null;
      nv.stoneToDeliver = 0; nv.hasReservedStone = false; nv.deliveryTarget = null;
      nv.isAttacking = true; nv.attackTarget = closestTarget;
      nv.targetX = closestTarget.x; nv.targetY = closestTarget.y;
      nv.state = 'attacking'; nv.hasTask = true;
    }
  }
  
  // === 2. KÄMPFE AUSFÜHREN ===
  
  for (let pv of allPlayerVillagers) {
    if (!pv.alive || !pv.isAttacking || !pv.attackTarget) continue;
    const target = pv.attackTarget;
    if (!target.alive) {
      let newTarget = null, newDist = Infinity;
      for (let nv of allNPCVillagers) {
        if (!nv.alive) continue;
        const d = dist(pv, nv);
        if (d < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE && d < newDist) { newDist = d; newTarget = nv; }
      }
      for (let enemy of enemies) {
        if (!enemy.alive) continue;
        const d = dist(pv, enemy);
        if (d < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE && d < newDist) { newDist = d; newTarget = enemy; }
      }
      if (newTarget) { pv.attackTarget = newTarget; pv.targetX = newTarget.x; pv.targetY = newTarget.y; }
      else { pv.isAttacking = false; pv.attackTarget = null; pv.state = 'idle'; pv.hasTask = false; }
      continue;
    }
    const d = dist(pv, target);
    if (d < 8) {
      if (pv.combatCooldown <= 0) {
        const isEnemy = target.hits !== undefined;
        if (Math.random() < 0.5) {
          if (isEnemy) {
            target.alive = false;
            createHitEffect(target.x, target.y, target.isSuper);
            SoundFX.playIfVisible(target.x, target.y, 'enemyDeath');
            showTemporaryMessage('⚔️ Feind besiegt!', '#ff6b6b');
          } else {
            createHitEffect(target.x, target.y, false, false);
            if (!target.isNPC) {
              killVillager(target);
            } else {
              const home = npcBuildings.find(b => b.id === target.homeId);
              if (home && home.residents > 0) home.residents -= 1;
              if (target.isDeliveringStone && target.towerTarget) {
                target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                if (target.carrying === 'stone') npcResources.stone += (target.stoneToDeliver || 0);
              }
              target.alive = false;
            }
            SoundFX.playIfVisible(target.x, target.y, 'villagerDie');
            showTemporaryMessage('⚔️ Gegnerischer Einwohner besiegt!', '#ff6b6b');
          }
        } else {
          createHitEffect(pv.x, pv.y, false, false);
          killVillager(pv);
          SoundFX.playIfVisible(pv.x, pv.y, 'villagerDie');
          showTemporaryMessage('⚔️ Dein Einwohner wurde besiegt!', '#ff6b6b');
        }
        pv.combatCooldown = 2.0;
        if (target.alive) target.combatCooldown = 2.0;
      }
    } else { pv.targetX = target.x; pv.targetY = target.y; }
  }
  
  for (let nv of allNPCVillagers) {
    if (!nv.alive || !nv.isAttacking || !nv.attackTarget) continue;
    const target = nv.attackTarget;
    if (!target.alive) {
      let newTarget = null, newDist = Infinity;
      for (let pv of allPlayerVillagers) {
        if (!pv.alive) continue;
        const d = dist(nv, pv);
        if (d < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE && d < newDist) { newDist = d; newTarget = pv; }
      }
      for (let enemy of enemies) {
        if (!enemy.alive) continue;
        const d = dist(nv, enemy);
        if (d < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE && d < newDist) { newDist = d; newTarget = enemy; }
      }
      if (newTarget) { nv.attackTarget = newTarget; nv.targetX = newTarget.x; nv.targetY = newTarget.y; }
      else { nv.isAttacking = false; nv.attackTarget = null; nv.state = 'idle'; nv.hasTask = false; }
      continue;
    }
    const d = dist(nv, target);
    if (d < 8) {
      if (nv.combatCooldown <= 0) {
        const isEnemy = target.hits !== undefined;
        if (Math.random() < 0.5) {
          if (isEnemy) {
            target.alive = false;
            createHitEffect(target.x, target.y, target.isSuper);
            SoundFX.playIfVisible(target.x, target.y, 'enemyDeath');
          } else {
            createHitEffect(target.x, target.y, false, false);
            if (!target.isNPC) {
              killVillager(target);
            } else {
              const home = npcBuildings.find(b => b.id === target.homeId);
              if (home && home.residents > 0) home.residents -= 1;
              if (target.isDeliveringStone && target.towerTarget) {
                target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                if (target.carrying === 'stone') npcResources.stone += (target.stoneToDeliver || 0);
              }
              target.alive = false;
            }
            SoundFX.playIfVisible(target.x, target.y, 'villagerDie');
            showTemporaryMessage('⚔️ Gegnerischer Einwohner besiegt!', '#ff6b6b');
          }
        } else {
          createHitEffect(nv.x, nv.y, false, false);
          const home = npcBuildings.find(b => b.id === nv.homeId);
          if (home && home.residents > 0) home.residents -= 1;
          if (nv.isDeliveringStone && nv.towerTarget) {
            nv.towerTarget.reservedStone = Math.max(0, nv.towerTarget.reservedStone - (nv.stoneToDeliver || 0));
            if (nv.carrying === 'stone') npcResources.stone += (nv.stoneToDeliver || 0);
          }
          nv.alive = false;
          SoundFX.playIfVisible(nv.x, nv.y, 'villagerDie');
        }
        nv.combatCooldown = 2.0;
        if (target.alive) target.combatCooldown = 2.0;
      }
    } else { nv.targetX = target.x; nv.targetY = target.y; }
  }
  
  for (let v of villagers) { if (v.combatCooldown > 0) v.combatCooldown -= dt; }
  for (let v of npcVillagers) { if (v.combatCooldown > 0) v.combatCooldown -= dt; }
  
  // === 3. GEBÄUDE-EROBERUNG (TIMER MULTIPLIZIERT, ABBRUCH BEI FEINDEN, BAUSTELLEN BESETZEN) ===
  
  // Spieler erobert NPC-Gebäude
  for (let nb of [...npcBuildings]) {
    const buildingCenterX = nb.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const buildingCenterY = nb.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const key = 'capture_' + nb.id;
    
    const nearbyPlayerVillagers = villagers.filter(v => v.alive && !v.isAttacking &&

    const villagersOnBuilding = nearbyPlayerVillagers.filter(v => dist(v, { x: buildingCenterX, y: buildingCenterY }) < 5);
    
    const enemiesNearby = enemies.some(e => e.alive && 
      dist(e, { x: buildingCenterX, y: buildingCenterY }) < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE);
    
    if (enemiesNearby) {
      if (captureTimers[key]) {
        delete captureTimers[key];
      }
      nb.captureProgress = 0;
      nb.beingCaptured = false;
      nb.capturedBy = null;
      for (let v of villagersOnBuilding) {
        if (v.state === 'movingToCapture') { v.state = 'idle'; v.hasTask = false; v.captureTargetId = null; }
      }
      continue;
    }
    
    for (let v of nearbyPlayerVillagers) {
      if (!villagersOnBuilding.includes(v) && v.state === 'idle' && !v.hasTask) {

        v.state = 'movingToCapture'; v.hasTask = true;
        v.captureTargetId = nb.id;
      }
    }
    
    const numCapturers = villagersOnBuilding.length;
    if (numCapturers > 0) {
      if (!captureTimers[key]) captureTimers[key] = { timer: 0, lastOccupiedBy: 'player', occupiedSince: Date.now() };
      const ct = captureTimers[key];
      if (ct.lastOccupiedBy === 'player') {
        ct.timer += dt * numCapturers;
        nb.captureProgress = Math.min(1, ct.timer / CONFIG.CAPTURE_TIME);
        nb.beingCaptured = true; nb.capturedBy = 'player';
        if (ct.timer >= CONFIG.CAPTURE_TIME) {
          const idx = npcBuildings.indexOf(nb);
          if (idx !== -1) {
            const captured = npcBuildings.splice(idx, 1)[0];
            captured.isNPC = false; captured.id = nextBuildingId++;
            captured.captureProgress = 0; captured.beingCaptured = false; captured.capturedBy = null;
            buildings.push(captured);
            
            // Turm-Lieferanten zurücksetzen
            if (captured.type === 'wachturm') {
              for (let v of npcVillagers) {
                if (v.alive && v.towerTarget === captured) {
                  captured.reservedStone = Math.max(0, captured.reservedStone - (v.stoneToDeliver || 0));
                  if (v.carrying === 'stone') npcResources.stone += (v.stoneToDeliver || 0);
                  v.isDeliveringStone = false; v.carrying = null; v.towerTarget = null;
                  v.stoneToDeliver = 0; v.hasReservedStone = false; v.state = 'idle'; v.hasTask = false;
                }
              }
            }
            
            // Bewohner konvertieren
            const npcResidents = npcVillagers.filter(v => v.homeId === nb.id && v.alive);
            for (let v of npcResidents) {
              v.homeId = captured.id; v.isNPC = false; v.carrying = null; v.state = 'idle'; v.hasTask = false;
              v.isAttacking = false; v.attackTarget = null; v.resourceTarget = null;
              v.isDeliveringStone = false; v.isBuilding = false; v.buildingTarget = null;
              v.towerTarget = null; v.stoneToDeliver = 0; v.hasReservedStone = false;
              v.deliveryTarget = null; v.combatCooldown = 0;
            }
            npcVillagers = npcVillagers.filter(v => v.isNPC);
            villagers.push(...npcResidents);
            
            // Wichtig: Wenn das Gebäude eine Baustelle war, neuen Bauarbeiter zuweisen
            if (captured.isUnderConstruction) {
              captured.builder = null;
              captured.waitingForBuilder = true;
              assignBuilderToConstruction(captured.id);
            }
            
            for (let v of villagersOnBuilding) {
              if (v.state === 'movingToCapture') { v.state = 'idle'; v.hasTask = false; v.captureTargetId = null; }
            }
            
            const fields = captured.type === 'bauer' ? getBauerFields(captured) :
                          captured.type === 'holzfaeller' ? getHolzfaellerFields(captured) :
                          captured.type === 'steinmetz' ? getSteinmetzFields(captured) : [];
            const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
            npcResourceNodes = npcResourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));

            showTemporaryMessage('🏰 NPC-Gebäude erobert!', '#ffd966');
            delete captureTimers[key];
          }
        }
      } else { ct.timer = 0; ct.lastOccupiedBy = 'player'; ct.occupiedSince = Date.now(); nb.captureProgress = 0; nb.capturedBy = 'player'; }
    } else {
      if (captureTimers[key]) {
        const ct = captureTimers[key]; ct.timer = Math.max(0, ct.timer - dt * 2);
        if (ct.timer <= 0) { nb.captureProgress = 0; nb.beingCaptured = false; nb.capturedBy = null; delete captureTimers[key]; }
      }
    }
  }
  
  // NPC erobert Spieler-Gebäude
  for (let pb of [...buildings]) {
    const buildingCenterX = pb.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const buildingCenterY = pb.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    const key = 'capture_' + pb.id;
    
    const nearbyNPCVillagers = npcVillagers.filter(v => v.alive && !v.isAttacking && 
      dist(v, { x: buildingCenterX, y: buildingCenterY }) < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE);
    const npcVillagersOnBuilding = nearbyNPCVillagers.filter(v => dist(v, { x: buildingCenterX, y: buildingCenterY }) < 5);
    
    const enemiesNearby = enemies.some(e => e.alive && 
      dist(e, { x: buildingCenterX, y: buildingCenterY }) < CONFIG.COMBAT_RANGE * CONFIG.CELL_SIZE);
    
    if (enemiesNearby) {
      if (captureTimers[key]) { delete captureTimers[key]; }
      pb.captureProgress = 0; pb.beingCaptured = false; pb.capturedBy = null;
      for (let v of npcVillagersOnBuilding) {
        if (v.state === 'movingToCapture') { v.state = 'idle'; v.hasTask = false; v.captureTargetId = null; }
      }
      continue;
    }
    
    for (let v of nearbyNPCVillagers) {
      if (!npcVillagersOnBuilding.includes(v) && v.state === 'idle' && !v.hasTask) {
        v.targetX = buildingCenterX; v.targetY = buildingCenterY;
        v.state = 'movingToCapture'; v.hasTask = true;
        v.captureTargetId = pb.id;
      }
    }
    
    const numCapturers = npcVillagersOnBuilding.length;
    if (numCapturers > 0) {
      if (!captureTimers[key]) captureTimers[key] = { timer: 0, lastOccupiedBy: 'npc', occupiedSince: Date.now() };
      const ct = captureTimers[key];
      if (ct.lastOccupiedBy === 'npc') {
        ct.timer += dt * numCapturers;
        pb.captureProgress = Math.min(1, ct.timer / CONFIG.CAPTURE_TIME);
        pb.beingCaptured = true; pb.capturedBy = 'npc';
        if (ct.timer >= CONFIG.CAPTURE_TIME) {

          if (idx !== -1) {

            captured.isNPC = true; captured.id = nextBuildingId++;

            npcBuildings.push(captured);
            
            if (captured.type === 'wachturm') {
              for (let v of villagers) {
                if (v.alive && v.towerTarget === captured) {

                  if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
                  v.isDeliveringStone = false; v.carrying = null; v.towerTarget = null;
                  v.stoneToDeliver = 0; v.hasReservedStone = false; v.state = 'idle'; v.hasTask = false;
                }
              }
            }
            
            const playerResidents = villagers.filter(v => v.homeId === pb.id && v.alive);
            for (let v of playerResidents) {
              v.homeId = captured.id; v.isNPC = true; v.carrying = null; v.state = 'idle'; v.hasTask = false;
              v.isAttacking = false; v.attackTarget = null; v.resourceTarget = null;
              v.isDeliveringStone = false; v.isBuilding = false; v.buildingTarget = null;
              v.towerTarget = null; v.stoneToDeliver = 0; v.hasReservedStone = false;
              v.deliveryTarget = null; v.combatCooldown = 0;
            }
            villagers = villagers.filter(v => !v.isNPC);
            npcVillagers.push(...playerResidents);
            
            // Baustelle wieder mit NPC-Bauarbeiter besetzen
            if (captured.isUnderConstruction) {
              captured.builder = null;
              captured.waitingForBuilder = true;
              assignNpcBuilderToConstruction(captured.id);
            }
            
            for (let v of npcVillagersOnBuilding) {
              if (v.state === 'movingToCapture') { v.state = 'idle'; v.hasTask = false; v.captureTargetId = null; }
            }
            
            const fields = captured.type === 'bauer' ? getBauerFields(captured) :
                          captured.type === 'holzfaeller' ? getHolzfaellerFields(captured) :
                          captured.type === 'steinmetz' ? getSteinmetzFields(captured) : [];
            const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
            resourceNodes = resourceNodes.filter(n => !fieldSet.has(n.x + ',' + n.y));
            
            SoundFX.playIfVisible(buildingCenterX, buildingCenterY, 'capture');
            showTemporaryMessage('🏰 Dein Gebäude wurde erobert!', '#ff6b6b');
            delete captureTimers[key];
          }
        }
      } else { ct.timer = 0; ct.lastOccupiedBy = 'npc'; ct.occupiedSince = Date.now(); pb.captureProgress = 0; pb.capturedBy = 'npc'; }
    } else {
      if (captureTimers[key]) {
        const ct = captureTimers[key]; ct.timer = Math.max(0, ct.timer - dt * 2);
        if (ct.timer <= 0) { pb.captureProgress = 0; pb.beingCaptured = false; pb.capturedBy = null; delete captureTimers[key]; }
      }
    }
  }
  
  villagers = villagers.filter(v => v.alive);
  npcVillagers = npcVillagers.filter(v => v.alive);
}

// =========================================================================
//  MODUL 11: WIRTSCHAFT – KOMPLETT (NPC-NOTFALL-EINWOHNER OHNE GETREIDE)
// =========================================================================
function updateEconomy(dt) {
  // Spieler-Häuser
  buildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {
    h.grainConsumeTimer += dt;
    while (h.grainConsumeTimer >= 15) {
      h.grainConsumeTimer -= 15;
      if (resources.grain > 0) resources.grain -= 1;
      else h.growthTimer = 0;
    }
    if (resources.grain > 0 && h.residents < h.maxResidents) {
      h.growthTimer += dt;
      if (h.growthTimer >= 30) {
        h.growthTimer -= 30;
        h.residents += 1;
        spawnVillager(h.id);
      }
    } else if (resources.grain <= 0) {
      h.growthTimer = 0;
    }
  });
  
  // NPC-Häuser
  const totalNPCAlive = npcVillagers.filter(v => v.alive).length;
  
  npcBuildings.filter(b => b.type === 'haus' && !b.isUnderConstruction).forEach(h => {
    h.grainConsumeTimer += dt;
    while (h.grainConsumeTimer >= 15) {
      h.grainConsumeTimer -= 15;
      if (npcResources.grain > 0) npcResources.grain -= 1;
      else h.growthTimer = 0;
    }
    
    // Normales Wachstum: Getreide vorhanden UND Platz im Haus
    if (npcResources.grain > 0 && h.residents < h.maxResidents) {
      h.growthTimer += dt;
      if (h.growthTimer >= 30) {
        h.growthTimer -= 30;
        h.residents += 1;
        const v = new Villager(nextVillagerId++, h.id, true);
        const cx = h.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const cy = h.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        v.x = cx; v.y = cy; v.targetX = cx; v.targetY = cy;
        v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
        npcVillagers.push(v);
      }
    } 
    // NOTFALL: Keine lebenden NPC-Einwohner mehr → Wachstum auch ohne Getreide
    else if (totalNPCAlive === 0 && h.residents < h.maxResidents) {
      h.growthTimer += dt;
      if (h.growthTimer >= 30) {
        h.growthTimer -= 30;
        h.residents += 1;
        const v = new Villager(nextVillagerId++, h.id, true);
        const cx = h.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const cy = h.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        v.x = cx; v.y = cy; v.targetX = cx; v.targetY = cy;
        v.npcHomeLager = npcBuildings.find(nb => nb.type === 'lager');
        npcVillagers.push(v);
        showTemporaryMessage('🤖 NPC-Notfall-Einwohner erschienen!', '#9b59b6');
      }
    }
    else if (npcResources.grain <= 0 && totalNPCAlive > 0) {
      h.growthTimer = 0;
    }
  });
  
  updateResourceNodes(dt);
}

// =========================================================================
//  MODUL 12: EINWOHNER-KI (Spieler) – KOMPLETT (BAUSTELLEN-PRIORITÄT)
// =========================================================================

function handleArrival(v, home) {
  if (v.state === 'movingToResource' && v.resourceTarget) {
    const node = resourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.ready && node.claimedBy === v.id) {
      if (node.type === 'grain') resources.grain += 1;
      else if (node.type === 'wood') resources.wood += 1;
      else if (node.type === 'stone') resources.stone += 1;
      const idx = resourceNodes.indexOf(node);
      if (idx !== -1) { resourceNodes.splice(idx, 1); }
      v.carrying = node.type; v.deliveryTarget = null;
    }
    v.resourceTarget = null;
    v.state = 'returningHome';
    const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
    if (lager) {
      v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
      v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
      v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    }
  } else if (v.state === 'returningHome' && v.carrying) {
    v.carrying = null; v.state = 'idle'; v.resourceTarget = null; v.hasTask = false; v.deliveryTarget = null;
    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
    v.targetX = homePos.x; v.targetY = homePos.y;
  }
}

// Berechnet, wie viele freie Einwohner für wartende Baustellen benötigt werden
function getNeededBuildersSpieler() {
  let needed = 0;
  for (let b of buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      let req = 1;
      if (b.type === 'holzfaeller') req = 2;
      else if (b.type === 'steinmetz') req = 2;
      needed += req + 1; // permanente Kosten + Bauarbeiter
    }
  }
  return needed;
}

function updateVillagers(dt) {
  const aliveIds = new Set(villagers.filter(v => v.alive).map(v => v.id));
  for (let node of resourceNodes) {
    if (node.claimedBy && !aliveIds.has(node.claimedBy)) node.claimedBy = null;
  }
  
  const allVills = [...villagers];
  for (let v of allVills) {
    if (!v.alive) {
      if (v.resourceTarget) {
        const node = resourceNodes.find(r => r.id === v.resourceTarget?.id);
        if (node && node.claimedBy === v.id) node.claimedBy = null;
      }
      if (v.isDeliveringStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
      }
      if (v.isBuilding && v.buildingTarget) {
        const building = buildings.find(b => b.id === v.buildingTarget);
        if (building) { building.builder = null; building.waitingForBuilder = true; assignBuilderToConstruction(building.id); }
      }
    }
    if (v.alive && v.isAttacking) {
      if (v.isDeliveringStone && v.towerTarget) {
        v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - (v.stoneToDeliver || 0));
        if (v.carrying === 'stone') resources.stone += (v.stoneToDeliver || 0);
        v.isDeliveringStone = false; v.carrying = null; v.towerTarget = null;
        v.stoneToDeliver = 0; v.hasReservedStone = false;
      }
    }
  }
  
  villagers = villagers.filter(v => v.alive);
  villagers.forEach(v => {
    if (v.state === 'idle' && v.carrying === null && !v.isAttacking && !v.isBuilding) v.hasTask = false;
  });
  
  for (let building of buildings) {
    if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
      const overflow = building.stoneAmmo - building.maxStoneAmmo;
      building.stoneAmmo = building.maxStoneAmmo;
      resources.stone += overflow;
    }
  }

  // --- Baustellen-Priorität: benötigte Bauarbeiter reservieren ---
  const neededBuilders = getNeededBuildersSpieler();
  const allFreeVillagers = villagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
  // Freie Einwohner, die für andere Aufgaben verwendet werden dürfen (nach Abzug der benötigten Bauarbeiter)
  const freeForTasks = allFreeVillagers.slice(neededBuilders);

  // Kämpfe: nur mit den übrigen Freien (und bereits Kämpfenden)
  // ... (die Kampflogik verwendet nur Einwohner, die bereits im Kampf sind oder speziell umschalten)
  
  villagers.filter(v => v.alive).forEach(v => {
    const home = buildings.find(b => b.id === v.homeId);
    if (!home) { v.state = 'idle'; return; }
    
    if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
      v.isAttacking = false; v.attackTarget = null; v.state = 'idle'; v.hasTask = false; v.combatCooldown = 0;
    }
    
    if (v.state === 'movingToCapture') {
      const targetBuilding = v.captureTargetId ? npcBuildings.find(b => b.id === v.captureTargetId) : null;
      if (!targetBuilding) { v.state = 'idle'; v.hasTask = false; v.captureTargetId = null; return; }
      const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
      if (distance > 3) { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
      return;
    }
    
    if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
      v.state = 'attacking'; v.targetX = v.attackTarget.x; v.targetY = v.attackTarget.y;
      const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
      if (distance > 3) { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
      return;
    }
    
    if (v.isBuilding && v.buildingTarget) {
      const building = buildings.find(b => b.id === v.buildingTarget);
      if (building && building.isUnderConstruction) {
        const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        v.targetX = targetX; v.targetY = targetY; v.state = 'building';
        const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
        if (distance > 3) { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
        return;
      } else { v.isBuilding = false; v.buildingTarget = null; v.state = 'idle'; v.hasTask = false; }
    }
    
    if (v.isAttacking) return;
    
    // === STEINLIEFERANTEN-LOGIK (nur mit freigegebenen Freien) ===
    if (v.isDeliveringStone) {
      // ... (Logik unverändert)
      if (v.state === 'movingToLagerForStone') {
        const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
        if (lager) {
          const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 - v.x;
          const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 - v.y;
          const distance = Math.hypot(dx, dy);
          if (distance < 3) {
            const toDeliver = v.stoneToDeliver || 1;
            if (v.towerTarget && buildings.includes(v.towerTarget) && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
              v.carrying = 'stone'; v.stoneToDeliver = toDeliver;
              v.state = 'deliveringStoneToTower';
              v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
              v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            } else {
              const altTower = findNearestTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
              if (altTower) {
                if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                altTower.reservedStone += toDeliver;
                v.towerTarget = altTower;
                v.carrying = 'stone'; v.stoneToDeliver = toDeliver;
                v.state = 'deliveringStoneToTower';
                v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
                v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
              } else {
                resources.stone += toDeliver;
                if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                v.state = 'idle'; v.hasTask = false; v.isDeliveringStone = false; v.towerTarget = null;
                v.stoneToDeliver = 0; v.hasReservedStone = false; v.carrying = null;
              }
            }
          } else { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
        }
        return;
      }
      
      if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
        const tower = v.towerTarget;
        if (!tower || !buildings.includes(tower) || tower.stoneAmmo >= tower.maxStoneAmmo) {
          const altTower = findNearestTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
          if (altTower) {
            if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
            altTower.reservedStone += (v.stoneToDeliver || 0);
            v.towerTarget = altTower;
            v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
          } else {
            resources.stone += (v.stoneToDeliver || 0);
            if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
            v.carrying = null; v.state = 'idle'; v.hasTask = false; v.isDeliveringStone = false;
            v.towerTarget = null; v.stoneToDeliver = 0; v.hasReservedStone = false;
          }
          return;
        }
        const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 - v.x;
        const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 - v.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 3) {
          const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
          if (toDeliver > 0) {
            tower.stoneAmmo += toDeliver;
            tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
            if (tower.stoneAmmo > tower.maxStoneAmmo) {
              const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
              tower.stoneAmmo = tower.maxStoneAmmo; resources.stone += overflow;
            }
          }
          v.carrying = null; v.state = 'idle'; v.hasTask = false; v.isDeliveringStone = false;
          v.towerTarget = null; v.stoneToDeliver = 0; v.hasReservedStone = false;
        } else { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
        return;
      }
    }
    
    // Rohstoffträger (nur normale Ressourcen, keine Steinlieferanten)
    if (v.carrying !== null && !v.isDeliveringStone) {
      if (v.state !== 'returningHome') {
        v.state = 'returningHome';
        const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY);
        if (lager) {
          v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
          v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
          v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        } else { v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; }
        v.resourceTarget = null;
      }
      const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
      if (distance < 3) { v.x = v.targetX; v.y = v.targetY; if (v.state === 'returningHome') handleArrival(v, home); }
      else if (distance > 0) { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
      return;
    }
    
    if (v.state === 'movingToResource' && v.resourceTarget) {
      const node = resourceNodes.find(r => r.id === v.resourceTarget.id);
      if (!node || !node.ready || node.claimedBy !== v.id) { v.state = 'idle'; v.resourceTarget = null; v.hasTask = false; }
    }
    
    // Ressourcen einsammeln – NUR mit den freigegebenen Freien (freeForTasks)
    const availableNodes = getAvailableResourceNodes();
    if (availableNodes.length > 0) {
      const freeForResource = freeForTasks.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
      if (freeForResource.length > 0) {
        let assignedVillagers = [];
        for (let node of availableNodes) {
          if (node.claimedBy) continue;
          let closestVillager = null, closestDist = Infinity;
          for (let v of freeForResource) {
            if (assignedVillagers.includes(v)) continue;
            const d = Math.hypot(v.x - node.x * CONFIG.CELL_SIZE, v.y - node.y * CONFIG.CELL_SIZE);
            if (d < closestDist) { closestDist = d; closestVillager = v; }
          }
          if (closestVillager) {
            assignedVillagers.push(closestVillager);
            node.claimedBy = closestVillager.id;
            closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
            closestVillager.state = 'movingToResource';
            closestVillager.targetX = node.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            closestVillager.targetY = node.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
            closestVillager.hasTask = true; closestVillager.deliveryTarget = null; closestVillager.isDeliveringStone = false;
          }
        }
      }
    }
    
    // === SPIELER STEIN-LIEFERAUFTRÄGE (BEDARFSGERECHT) – NUR mit freeForTasks ===
    const deliveringStone = villagers.filter(v => v.isDeliveringStone && v.alive && !v.isAttacking);
    const towersNeedingStone = buildings.filter(b => b.type === 'wachturm' && b.stoneAmmo < b.maxStoneAmmo);
    let freeForStone = freeForTasks.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
    
    if (towersNeedingStone.length > 0 && resources.stone > 0 && freeForStone.length > 0) {
      for (let tower of towersNeedingStone) {
        if (resources.stone <= 0) break;
        
        const alreadyOnTheWay = villagers.filter(v => v.isDeliveringStone && v.towerTarget === tower && v.alive && !v.isAttacking).length;
        const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
        const toSend = Math.min(needed, Math.max(0, needed - alreadyOnTheWay + 2));
        
        if (toSend <= 0) continue;
        
        const canSend = Math.min(toSend, freeForStone.length, resources.stone);
        
        for (let i = 0; i < canSend; i++) {
          if (resources.stone <= 0) break;
          
          let closestVillager = null, closestDist = Infinity;
          for (let v of freeForStone) {
            if (v.hasTask || v.isDeliveringStone) continue;
            const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
            if (d < closestDist) { closestDist = d; closestVillager = v; }
          }
          
          if (closestVillager) {
            tower.reservedStone += 1;
            resources.stone -= 1;
            const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE);
            if (lager) {
              closestVillager.state = 'movingToLagerForStone';
              closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
              closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
              closestVillager.hasTask = true; closestVillager.isDeliveringStone = true;
              closestVillager.towerTarget = tower; closestVillager.stoneToDeliver = 1;
              closestVillager.hasReservedStone = true;
              freeForStone = freeForStone.filter(v => v.id !== closestVillager.id);
            }
          }
        }
        break; // Nur einen Turm pro Frame
      }
    }
    
    if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
      const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
      if (dist(v, homePos) > 5) { v.targetX = homePos.x; v.targetY = homePos.y; }
    }
    
    if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
      if (v.state === 'idle' && v.hasTask) {
        const lager = findNearestLager(home.gridX, home.gridY);
        if (lager) { v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2; }
      }
      const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
      if (distance < 3) { v.x = v.targetX; v.y = v.targetY; if (v.state === 'movingToResource' || v.state === 'returningHome') handleArrival(v, home); }
      else if (distance > 0) { const step = Math.min(distance, v.speed * dt); v.x += (dx/distance) * step; v.y += (dy/distance) * step; }
    }
  });
}
