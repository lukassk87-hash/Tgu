// ============================================================
//  WASM-WRAPPER FÜR SPIELER 2 VILLAGER BEWEGUNG
// ============================================================
function movePlayer2VillagersWithWasm(player2Villagers, dt) {
    if (!wasmLoaded || !wasmExports || typeof wasmExports.movePlayer2VillagersBatch !== 'function') {
        return false;
    }
    
    const count = player2Villagers.length;
    if (count === 0) return true;
    
    try {
        const x = new Float32Array(count);
        const y = new Float32Array(count);
        const targetX = new Float32Array(count);
        const targetY = new Float32Array(count);
        const speeds = new Float32Array(count);
        const alive = new Uint8Array(count);
        
        let aliveCount = 0;
        for (let i = 0; i < count; i++) {
            const v = player2Villagers[i];
            x[i] = v.x || 0;
            y[i] = v.y || 0;
            targetX[i] = v.targetX || 0;
            targetY[i] = v.targetY || 0;
            speeds[i] = v.speed || 65;
            alive[i] = v.alive ? 1 : 0;
            if (v.alive) aliveCount++;
        }
        
        if (aliveCount === 0) return true;
        
        wasmExports.movePlayer2VillagersBatch(x, y, targetX, targetY, speeds, alive, count, dt);
        
        for (let i = 0; i < count; i++) {
            if (alive[i]) {
                const v = player2Villagers[i];
                v.x = x[i];
                v.y = y[i];
            }
        }
        return true;
    } catch(e) {
        console.warn('⚠️ WASM-Player2-Villager Fehler:', e.message);
        return false;
    }
}

// ============================================================
//  KOMPLETTE updateVillagersPlayer2() - MIT WASM-UNTERSTÜTZUNG
// ============================================================
function updateVillagersPlayer2(dt) {
    // ===== NEU: WASM-BEWEGUNG FÜR SPIELER 2 =====
    const wasmMovementDone = movePlayer2VillagersWithWasm(player2Villagers, dt);
    
    // ===== 1. CACHES NUR BEI ÄNDERUNGEN LADEN =====
    if (cacheNeedsRefreshP2) {
        refreshPlayer2VillagerCache();
        cacheNeedsRefreshP2 = false;
    }
    if (cachedPlayer2ResourceNodesDirty) {
        refreshPlayer2ResourceCache();
        cachedPlayer2ResourceNodesDirty = false;
    }
    if (lagerCacheDirty) {
        refreshLagerCache();
        lagerCacheDirty = false;
    }

    // ===== 2. CACHE-REFERENZEN =====
    const cachedVillagers = cachedPlayer2Villagers;
    const cachedNodes = cachedPlayer2ResourceNodes;
    const cachedFree = cachedPlayer2FreeVillagers;

    // ===== 3. NODE-CLAIMS BEREINIGEN =====
    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
            cachedPlayer2ResourceNodesDirty = true;
        }
    }

    // ===== 4. TURM-RESERVIERUNGEN BEREINIGEN =====
    for (let tower of player2Buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of player2Villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    // ===== 5. CONSTRUCTION SITES BEREINIGEN =====
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.isNPC) continue;
        if (site.playerId !== 'player2') continue;
        if (site.isGrenze) {
            const grenzeId = parseInt(key.replace('grenze_player2_', ''));
            const grenze = player2Grenzen.find(g => g.id === grenzeId);
            if (grenze) {
                const builder = player2Villagers.find(v => v.id === site.builder && v.alive);
                if (!builder) {
                    grenze.builder = null;
                    grenze.waitingForBuilder = true;
                    delete constructionSites[key];
                }
            }
            continue;
        }
        const building = player2Buildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = player2Villagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // ===== 6. CAPTURE-TARGETS BEREINIGEN =====
    for (let v of player2Villagers) {
        if (v.alive && v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    // ===== 7. NODE-CLAIMS ERNEUT PRÜFEN =====
    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
            cachedPlayer2ResourceNodesDirty = true;
        }
    }

    // ===== 8. VILLAGER-LISTE AKTUALISIEREN =====
    player2Villagers = cachedVillagers.slice();

    // ===== 9. TURM-ÜBERFÜLLE AUSGLEICHEN =====
    for (let building of player2Buildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            player2Resources.stone += overflow;
        }
    }

    // ===== 10. BENÖTIGTE BAUER =====
    const neededBuilders = getNeededBuildersSpieler2();
    const freeForTasks = cachedPlayer2FreeVillagers.slice(neededBuilders);

    // ===== 11. STEIN-PRIORITÄT =====
    const now = performance.now() / 1000;
    const stonePriority = (now - lastPlayer2VillagerHitTime < 10);
    const hasGrainNodes = cachedPlayer2ResourceNodes.some(n => n.type === 'grain' && !n.claimedBy);
    const grainPriority = (player2Resources.grain < 50 && hasGrainNodes);

    // ===== 12. STEIN-LIEFERUNGEN =====
    const towersNeedingStone = player2Buildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = getCachedFreeVillagers('player2');

    const totalFree = freeForStone.length;
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && player2Resources.stone > 0 && totalFree > 0) {
        const currentlyDelivering = cachedPlayer2Villagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, player2Resources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || player2Resources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                
                const towerX = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const towerY = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const searchRange = Math.max(CONFIG.CELL_SIZE * 10, 300);
                
                const nearestVillagers = findNearestVillagersWithFallback(
                    towerX, towerY, searchRange, canSend, 'player2'
                );
                
                for (let closestVillager of nearestVillagers) {
                    if (player2Resources.stone <= 0) break;
                    if (closestVillager.hasTask || closestVillager.isDeliveringStone) continue;
                    if (!closestVillager.alive) continue;
                    
                    tower.reservedStone += 1;
                    player2Resources.stone -= 1;
                    const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE, false, 'player2');
                    if (lager) {
                        closestVillager.towerTarget = tower;
                        closestVillager.state = 'movingToLagerForStone';
                        closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.hasTask = true;
                        closestVillager.isDeliveringStone = true;
                        closestVillager.stoneToDeliver = 1;
                        closestVillager.hasReservedStone = true;
                        closestVillager.carrying = 'stone';
                    } else {
                        player2Resources.stone += 1;
                        tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                    }
                }
            }
        }
    }

    // ===== 13. FREIE VILLAGER FÜR RESSOURCEN =====
    const freeForTasksAfterStone = cachedPlayer2FreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const readyNodesWithFields = cachedPlayer2ResourceNodes.filter(node => 
        !node.claimedBy && 
        node.ready &&
        node.fields && 
        node.fields.length > 0
    );

    const allReadyNodes = readyNodesWithFields;

    // ===== 14. RESSOURCEN-ZUWEISUNG =====
    if (allReadyNodes.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            let sortedNodes = allReadyNodes;
            if (grainPriority) {
                sortedNodes = [...allReadyNodes].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...allReadyNodes].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            }

            for (let node of sortedNodes) {
                if (node.claimedBy) continue;
                
                const hasUnharvestedFields = node.fields.some(f => !f.harvested);
                if (!hasUnharvestedFields) {
                    node.ready = false;
                    node.timer = 0;
                    node.claimedBy = null;
                    for (let f of node.fields) {
                        f.harvested = false;
                        f.harvestTimer = 0;
                        f.isBeingHarvested = false;
                    }
                    continue;
                }

                const nextField = node.fields.find(f => !f.harvested);
                if (!nextField) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - nextField.x * CONFIG.CELL_SIZE, v.y - nextField.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'harvestingField';
                    closestVillager.isHarvesting = true;
                    closestVillager.harvestBuildingId = node.buildingId;
                    closestVillager.harvestFieldIndex = node.fields.indexOf(nextField);
                    closestVillager.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                    
                    nextField.isBeingHarvested = true;
                }
            }
        }
    }

    // ===== 15. HAUPT-VILLAGER-LOOP =====
    const villagersToUpdate = cachedVillagers.slice();

    for (let v of villagersToUpdate) {
        const home = player2Buildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        // ---- 15a. ATTACK CHECK ----
        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // ---- 15b. CAPTURE MOVEMENT ----
        if (v.state === 'movingToCapture') {
            let targetBuilding = null;
            let targetGrenze = null;
            
            targetBuilding = buildings.find(b => b.id === v.captureTargetId);
            if (!targetBuilding) {
                targetGrenze = grenzen.find(g => g.id === v.captureTargetId);
            }
            
            if (!targetBuilding && !targetGrenze) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            
            // ===== BEWEGUNG NUR WENN KEIN WASM =====
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
            continue;
        }

        // ---- 15c. ATTACK MOVEMENT ----
        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
            continue;
        }

        // ---- 15d. HARVESTING ----
        if (v.state === 'harvestingField' && v.isHarvesting) {
            let node = player2ResourceNodes.find(n => n.buildingId === v.harvestBuildingId);
            
            if (!node || !node.fields || node.fields.length === 0) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            if (!node.ready) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                v.resourceTarget = null;
                node.claimedBy = null;
                continue;
            }
            
            const fieldIndex = v.harvestFieldIndex;
            if (fieldIndex === undefined || fieldIndex >= node.fields.length) {
                v.state = 'idle';
                v.isHarvesting = false;
                v.hasTask = false;
                continue;
            }
            
            const field = node.fields[fieldIndex];
            const targetX = field.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const targetY = field.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            v.targetX = targetX;
            v.targetY = targetY;
            
            if (!wasmMovementDone) {
                moveVillagerInline(v, targetX, targetY, dt);
            }
            
            if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                field.harvestTimer += dt;
                
                if (field.harvestTimer >= 0.25) {
                    field.harvested = true;
                    field.isBeingHarvested = false;
                    field.harvestTimer = 0;
                    createHarvestEffect(targetX, targetY, 1);
                    
                    if (!v.harvestedCount) v.harvestedCount = 0;
                    v.harvestedCount += 1;
                    
                    const allHarvested = node.fields.every(f => f.harvested);
                    
                    if (allHarvested) {
                        v.carrying = node.type;
                        v.carryingCount = v.harvestedCount;
                        v.isHarvesting = false;
                        v.state = 'returningHome';
                        v.hasTask = true;
                        v.resourceTarget = null;
                        v.harvestedCount = 0;
                        
                        let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
                        if (lager) {
                            v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                            v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const homeBuilding = player2Buildings.find(b => b.id === v.homeId);
                            if (homeBuilding) {
                                v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                v.state = 'idle';
                                v.hasTask = false;
                                v.carrying = null;
                                v.carryingCount = 0;
                                continue;
                            }
                        }
                        
                        node.ready = false;
                        node.timer = 0;
                        node.claimedBy = null;
                        for (let f of node.fields) {
                            f.harvested = false;
                            f.harvestTimer = 0;
                            f.isBeingHarvested = false;
                        }
                        
                        continue;
                    } else {
                        const nextField = node.fields.find(f => !f.harvested);
                        if (nextField) {
                            nextField.isBeingHarvested = true;
                            nextField.harvestTimer = 0;
                            v.harvestFieldIndex = node.fields.indexOf(nextField);
                            v.targetX = nextField.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = nextField.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                        } else {
                            v.carrying = node.type;
                            v.carryingCount = v.harvestedCount;
                            v.isHarvesting = false;
                            v.state = 'returningHome';
                            v.hasTask = true;
                            v.resourceTarget = null;
                            v.harvestedCount = 0;
                            
                            let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
                            if (lager) {
                                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                const homeBuilding = player2Buildings.find(b => b.id === v.homeId);
                                if (homeBuilding) {
                                    v.targetX = homeBuilding.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                    v.targetY = homeBuilding.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                } else {
                                    v.state = 'idle';
                                    v.hasTask = false;
                                    v.carrying = null;
                                    v.carryingCount = 0;
                                    continue;
                                }
                            }
                            
                            node.ready = false;
                            node.timer = 0;
                            node.claimedBy = null;
                            for (let f of node.fields) {
                                f.harvested = false;
                                f.harvestTimer = 0;
                                f.isBeingHarvested = false;
                            }
                            
                            continue;
                        }
                    }
                }
            }
            continue;
        }

        // ---- 15e. BUILDING ----
        if (v.isBuilding && v.buildingTarget) {
            const building = player2Buildings.find(b => b.id === v.buildingTarget);
            const grenze = player2Grenzen.find(g => g.id === v.buildingTarget);
            
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                continue;
            } else if (grenze && grenze.isUnderConstruction) {
                const targetX = grenze.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = grenze.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        // ---- 15f. ATTACKING ----
        if (v.isAttacking) continue;

        // ---- 15g. STONE DELIVERY ----
        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
                if (lager) {
                    const targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetX = targetX;
                    v.targetY = targetY;
                    if (!wasmMovementDone) {
                        moveVillagerInline(v, targetX, targetY, dt);
                    }
                    
                    if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && player2Buildings.includes(v.towerTarget) && 
                            !v.towerTarget.isUnderConstruction && 
                            v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            player2Resources.stone += toDeliver;
                            if (v.towerTarget) {
                                v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                            }
                            v.state = 'idle';
                            v.hasTask = false;
                            v.isDeliveringStone = false;
                            v.towerTarget = null;
                            v.stoneToDeliver = 0;
                            v.hasReservedStone = false;
                            v.carrying = null;
                        }
                    }
                } else {
                    player2Resources.stone += (v.stoneToDeliver || 0);
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                
                if (!tower || !player2Buildings.includes(tower) || 
                    tower.isUnderConstruction || 
                    tower.stoneAmmo >= tower.maxStoneAmmo) {
                    player2Resources.stone += (v.stoneToDeliver || 0);
                    if (tower) {
                        tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    continue;
                }
                
                const targetX = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                
                if (Math.abs(v.x - targetX) < 3 && Math.abs(v.y - targetY) < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            player2Resources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                }
                continue;
            }
        }

        // ---- 15h. RETURNING HOME ----
        if (v.state === 'returningHome' && v.carrying) {
            const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
            if (lager) {
                const targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, targetX, targetY, dt);
                }
                
                if (Math.abs(v.x - targetX) < 5 && Math.abs(v.y - targetY) < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') player2Resources.grain += count;
                    else if (v.carrying === 'wood') player2Resources.wood += count;
                    else if (v.carrying === 'stone') player2Resources.stone += count;
                    else if (v.carrying === 'fish') player2Resources.fish = (player2Resources.fish || 0) + count;
                    
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                    
                    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                    v.targetX = homePos.x;
                    v.targetY = homePos.y;
                    
                    continue;
                }
            } else {
                const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                                  y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
                v.targetX = homePos.x;
                v.targetY = homePos.y;
                if (!wasmMovementDone) {
                    moveVillagerInline(v, homePos.x, homePos.y, dt);
                }
                
                if (Math.abs(v.x - homePos.x) < 5 && Math.abs(v.y - homePos.y) < 5) {
                    const count = v.carryingCount || 1;
                    if (v.carrying === 'grain') player2Resources.grain += count;
                    else if (v.carrying === 'wood') player2Resources.wood += count;
                    else if (v.carrying === 'stone') player2Resources.stone += count;
                    else if (v.carrying === 'fish') player2Resources.fish = (player2Resources.fish || 0) + count;
                    v.carrying = null;
                    v.carryingCount = 0;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.resourceTarget = null;
                    v.deliveryTarget = null;
                    v.isHarvesting = false;
                }
                continue;
            }
            continue;
        }

        // ---- 15i. CARRYING CHECK ----
        if (v.carrying !== null && !v.isDeliveringStone && v.state !== 'returningHome') {
            v.state = 'returningHome';
            const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, 
                                          v.resourceTarget ? v.resourceTarget.y : home.gridY, false, 'player2');
            if (lager) {
                v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            } else {
                v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            }
            v.resourceTarget = null;
        }

        // ---- 15j. MOVING TO RESOURCE ----
        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedPlayer2ResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        // ---- 15k. IDLE MOVEMENT ----
        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, 
                             y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { 
                v.targetX = homePos.x;
                v.targetY = homePos.y; 
            }
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
        }

        // ---- 15l. MOVEMENT EXECUTION ----
        if (v.state === 'movingToResource' || v.state === 'returningHome' || 
            v.state === 'idle' || v.state === 'movingToLagerForStone') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY, false, 'player2');
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            if (!wasmMovementDone) {
                moveVillagerInline(v, v.targetX, v.targetY, dt);
            }
        }
    }

    // ===== 16. CACHE BEREINIGEN - NUR BEI ECHTEN ÄNDERUNGEN =====
    const currentFreeCount = player2Villagers.filter(v => 
        v.alive && v.state === 'idle' && v.carrying === null && 
        !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;
    
    if (currentFreeCount !== cachedPlayer2FreeVillagers.length) {
        cachedFreeVillagersP2Dirty = true;
    }
    
    if (player2Villagers.length !== cachedPlayer2Villagers.length) {
        cacheNeedsRefreshP2 = true;
        villagerGridDirtyPlayer2 = true;
    }
}

const VILLAGER_GRID_SIZE = 100; // Pixel pro Grid-Zelle

// ===== GRIDS FÜR ALLE 3 SPIELERTYPEN =====
let villagerGridPlayer = new Map();      // Spieler 1
let villagerGridPlayer2 = new Map();     // Spieler 2
let villagerGridNpc = new Map();         // NPC

// ===== DIRTY-FLAGS FÜR GRIDS =====
let villagerGridDirtyPlayer = true;
let villagerGridDirtyPlayer2 = true;
let villagerGridDirtyNpc = true;

// ===== HILFSFUNKTION =====
function getGridKey(x, y) {
    const cx = Math.floor(x / VILLAGER_GRID_SIZE);
    const cy = Math.floor(y / VILLAGER_GRID_SIZE);
    return cx + ',' + cy;
}

// ===== GRIDS NEU AUFBAUEN (NUR LEBENDE) =====
function rebuildVillagerGridPlayer() {
    villagerGridPlayer.clear();
    for (let v of villagers) {
        if (!v.alive) continue;
        const key = getGridKey(v.x, v.y);
        if (!villagerGridPlayer.has(key)) {
            villagerGridPlayer.set(key, []);
        }
        villagerGridPlayer.get(key).push(v);
    }
    villagerGridDirtyPlayer = false;
}

function rebuildVillagerGridPlayer2() {
    villagerGridPlayer2.clear();
    for (let v of player2Villagers) {
        if (!v.alive) continue;
        const key = getGridKey(v.x, v.y);
        if (!villagerGridPlayer2.has(key)) {
            villagerGridPlayer2.set(key, []);
        }
        villagerGridPlayer2.get(key).push(v);
    }
    villagerGridDirtyPlayer2 = false;
}

function rebuildVillagerGridNpc() {
    villagerGridNpc.clear();
    for (let v of npcVillagers) {
        if (!v.alive) continue;
        const key = getGridKey(v.x, v.y);
        if (!villagerGridNpc.has(key)) {
            villagerGridNpc.set(key, []);
        }
        villagerGridNpc.get(key).push(v);
    }
    villagerGridDirtyNpc = false;
}

// ===== ALLE GRIDS NEU AUFBAUEN =====
function rebuildAllVillagerGrids() {
    rebuildVillagerGridPlayer();
    rebuildVillagerGridPlayer2();
    rebuildVillagerGridNpc();
}

// ===== EINWOHNER IM VIEWPORT FINDEN (SPIELER 1) =====
function getVillagersInViewportPlayer(viewLeft, viewRight, viewTop, viewBottom) {
    if (villagerGridDirtyPlayer) {
        rebuildVillagerGridPlayer();
    }
    
    const result = [];
    const startKey = getGridKey(viewLeft, viewTop);
    const endKey = getGridKey(viewRight, viewBottom);
    const [startCX, startCY] = startKey.split(',').map(Number);
    const [endCX, endCY] = endKey.split(',').map(Number);
    
    for (let cx = startCX - 1; cx <= endCX + 1; cx++) {
        for (let cy = startCY - 1; cy <= endCY + 1; cy++) {
            const key = cx + ',' + cy;
            const cells = villagerGridPlayer.get(key);
            if (cells) {
                for (let v of cells) {
                    if (!v.alive) continue;
                    if (v.x >= viewLeft && v.x <= viewRight && 
                        v.y >= viewTop && v.y <= viewBottom) {
                        result.push(v);
                    }
                }
            }
        }
    }
    return result;
}

function createDeathEffect(x, y, isNPC = false) {
    const particles = [];
    const colors = isNPC ? ['#9b59b6', '#8e44ad'] : ['#e74c3c', '#c0392b'];
    for (let i = 0; i < 12; i++) {

            maxLife: 0.3 + Math.random() * 0.4,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
    hitEffects.push({ x, y, particles, life: 0.6, maxLife: 0.6 });
    markDirty('effects');
}

// =========================================================================

let cachedNpcFreeCount = -1;



function refreshNpcVillagerCache() {
    const aliveVillagers = npcVillagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    if (cachedNpcAliveIds.size === aliveCount && cachedNpcFreeCount === freeCount && npcCacheNeedsRefresh === false) {
        return;
    }

    try {
        cachedNpcVillagers = aliveVillagers;
        cachedNpcAliveIds = aliveIds;
        cachedNpcFreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedNpcFreeCount = cachedNpcFreeVillagers.length;
        npcCacheNeedsRefresh = false;
    } catch(e) {
        cachedNpcVillagers = [];
        cachedNpcFreeVillagers = [];
        cachedNpcAliveIds = new Set();
        cachedNpcFreeCount = 0;
    }
}

function refreshNpcResourceCache() {
    try {
        cachedNpcResourceNodes = npcResourceNodes.slice();
        cachedNpcAvailableNodes = cachedNpcResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedNpcResourceNodes = [];
        cachedNpcAvailableNodes = [];
    }
}


function markNpcCacheDirty() {
    npcCacheNeedsRefresh = true;
    villagerGridDirtyNpc = true;
    combatGridDirtyNpc = true;
    cachedFreeVillagersNpcDirty = true; // NEU
}
