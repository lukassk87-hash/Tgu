<svg viewBox="0 0 20 28" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <!-- Kopf -->
    <rect x="6" y="0" width="8" height="6" fill="#5d6d7e"/>
    <rect x="5" y="1" width="2" height="1" fill="#5d6d7e"/>
    <rect x="13" y="1" width="2" height="1" fill="#5d6d7e"/>
    
    <!-- Augen (rot leuchtend) -->
    <rect x="7" y="2" width="2" height="2" fill="#e74c3c"/>
    <rect x="11" y="2" width="2" height="2" fill="#e74c3c"/>
    <rect x="7" y="2" width="2" height="1" fill="#ff4444"/>
    <rect x="11" y="2" width="2" height="1" fill="#ff4444"/>
    
    <!-- Mund (offen) -->
    <rect x="7" y="5" width="6" height="2" fill="#2c3e50"/>
    <rect x="8" y="4" width="4" height="1" fill="#2c3e50"/>
    
    <!-- Körper (verrottet) -->
    <rect x="5" y="7" width="10" height="8" fill="#4a5454"/>
    <rect x="6" y="8" width="2" height="2" fill="#5d6d7e"/>
    <rect x="12" y="8" width="2" height="2" fill="#5d6d7e"/>
    <rect x="8" y="10" width="4" height="2" fill="#5d6d7e"/>
    
    <!-- Beine (wackelig) -->
    <rect x="6" y="15" width="2" height="9" fill="#3d4a4a"/>
    <rect x="12" y="15" width="2" height="9" fill="#3d4a4a"/>
    
    <!-- Schuhe (kaputt) -->
    <rect x="5" y="24" width="4" height="3" fill="#2c3e50"/>
    <rect x="11" y="24" width="4" height="3" fill="#2c3e50"/>
    
    <!-- Arme (ausgestreckt) -->
    <rect x="2" y="8" width="3" height="4" fill="#4a5454"/>
    <rect x="15" y="8" width="3" height="4" fill="#4a5454"/>
    <rect x="1" y="9" width="1" height="3" fill="#3d4a4a"/>
    <rect x="18" y="9" width="1" height="3" fill="#3d4a4a"/>
    
    <!-- Kleine Wunde auf der Brust -->
    <rect x="9" y="9" width="2" height="2" fill="#5d6d7e"/>
</svg>