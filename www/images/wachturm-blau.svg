<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Linker Turm -->
    <rect x="8" y="25" width="20" height="60" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
    <!-- Zinnen links -->
    <rect x="7" y="20" width="5" height="8" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
    <rect x="15" y="20" width="6" height="8" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
    <rect x="24" y="20" width="5" height="8" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
    
    <!-- Rechter Turm -->
    <rect x="72" y="25" width="20" height="60" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
    <!-- Zinnen rechts -->
    <rect x="71" y="20" width="5" height="8" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
    <rect x="79" y="20" width="6" height="8" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
    <rect x="88" y="20" width="5" height="8" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
    
    <!-- Mittelteil (glatt oben, keine Zinnen) -->
    <rect x="28" y="40" width="44" height="45" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
    
    <!-- Tor -->
    <rect x="42" y="60" width="16" height="25" fill="#4a3c04" stroke="#2a2202" stroke-width="2"/>
    <circle cx="50" cy="72" r="2.5" fill="#f1c40f" stroke="#2a2202" stroke-width="1"/>
    
    <!-- Schießscharten -->
    <rect x="18" y="40" width="3" height="10" fill="#2a2202" stroke="#1a1501" stroke-width="1"/>
    <rect x="36" y="50" width="3" height="10" fill="#2a2202" stroke="#1a1501" stroke-width="1"/>
    <rect x="61" y="50" width="3" height="10" fill="#2a2202" stroke="#1a1501" stroke-width="1"/>
    <rect x="80" y="40" width="3" height="10" fill="#2a2202" stroke="#1a1501" stroke-width="1"/>
</svg>