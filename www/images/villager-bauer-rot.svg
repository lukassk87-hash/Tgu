<svg viewBox="0 0 20 28" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <!-- Strohhut -->
    <rect x="4" y="0" width="12" height="2" fill="#f1c40f"/>
    <rect x="5" y="-1" width="10" height="2" fill="#f1c40f"/>
    <rect x="6" y="-2" width="8" height="1" fill="#f1c40f"/>
    
    <!-- Kopf (Gesicht) -->
    <rect x="6" y="0" width="8" height="6" fill="#f5cba7"/>
    <!-- Augen -->
    <rect x="7" y="2" width="1" height="1" fill="#000"/>
    <rect x="10" y="2" width="1" height="1" fill="#000"/>
    <!-- Mund -->
    <rect x="8" y="4" width="2" height="1" fill="#000"/>
    
    <!-- Shirt (Rot) -->
    <rect x="6" y="6" width="8" height="8" fill="#c0392b"/>
    <!-- Gürtel -->
    <rect x="6" y="11" width="8" height="1" fill="#5d3b1f"/>
    
    <!-- Beine -->
    <rect x="6" y="14" width="3" height="8" fill="#2c3e50"/>
    <rect x="11" y="14" width="3" height="8" fill="#2c3e50"/>
    
    <!-- Schuhe -->
    <rect x="5" y="22" width="5" height="2" fill="#5d3b1f"/>
    <rect x="10" y="22" width="5" height="2" fill="#5d3b1f"/>
    
    <!-- Arme -->
    <rect x="4" y="7" width="2" height="4" fill="#f5cba7"/>
    <rect x="14" y="7" width="2" height="4" fill="#f5cba7"/>
    
    <!-- Sense (Stiel) -->
    <rect x="16" y="2" width="1" height="10" fill="#8d6b4a"/>
    <!-- Sense (Klinge) -->
    <rect x="17" y="2" width="3" height="1" fill="#bdc3c7"/>
    <rect x="18" y="3" width="2" height="1" fill="#bdc3c7"/>
    <rect x="19" y="4" width="1" height="1" fill="#bdc3c7"/>
</svg>