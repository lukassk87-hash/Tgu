<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Schatten -->
  <ellipse cx="24" cy="46" rx="22" ry="3" fill="rgba(0,0,0,0.12)"/>
  
  <!-- Felswand (grau) -->
  <rect x="4" y="12" width="40" height="32" fill="#7f8c8d"/>
  
  <!-- Felsstruktur -->
  <rect x="6" y="14" width="36" height="3" fill="#95a5a6"/>
  <rect x="6" y="20" width="36" height="2" fill="#95a5a6"/>
  <rect x="6" y="26" width="36" height="3" fill="#95a5a6"/>
  <rect x="6" y="34" width="36" height="2" fill="#95a5a6"/>
  
  <!-- Felsrisse -->
  <rect x="10" y="16" width="2" height="6" fill="#5d6d7e"/>
  <rect x="34" y="22" width="2" height="8" fill="#5d6d7e"/>
  <rect x="18" y="30" width="3" height="4" fill="#5d6d7e"/>
  
  <!-- Bergwerk-Eingang (dunkler Stollen) -->
  <rect x="16" y="24" width="16" height="20" fill="#2c3e50"/>
  <rect x="18" y="26" width="12" height="16" fill="#1a252f"/>
  
  <!-- ROTE Stützen (Holz) -->
  <rect x="14" y="24" width="3" height="20" fill="#c0392b"/>
  <rect x="31" y="24" width="3" height="20" fill="#c0392b"/>
  
  <!-- ROTE Querbalken (oben) -->
  <rect x="14" y="24" width="20" height="3" fill="#c0392b"/>
  
  <!-- Spitzhacke (links an der Wand) -->
  <rect x="6" y="28" width="2" height="8" fill="#5d4037"/>
  <rect x="4" y="26" width="6" height="3" fill="#bdc3c7"/>
  
  <!-- Schaufel (rechts an der Wand) -->
  <rect x="40" y="30" width="2" height="10" fill="#5d4037"/>
  <rect x="38" y="28" width="6" height="3" fill="#bdc3c7"/>
  
  <!-- Felsbrocken (vor dem Eingang) -->
  <ellipse cx="12" cy="42" rx="4" ry="3" fill="#95a5a6"/>
  <ellipse cx="36" cy="42" rx="3" ry="2" fill="#95a5a6"/>
  <ellipse cx="24" cy="44" rx="3" ry="2" fill="#aab7b8"/>
  
  <!-- Laterne (links) -->
  <rect x="10" y="22" width="3" height="4" fill="#f1c40f"/>
  <rect x="9" y="20" width="5" height="3" fill="#7f8c8d"/>
  
  <!-- ROTE Laterne (rechts) -->
  <rect x="35" y="22" width="3" height="4" fill="#c0392b"/>
  <rect x="34" y="20" width="5" height="3" fill="#7f8c8d"/>
</svg>