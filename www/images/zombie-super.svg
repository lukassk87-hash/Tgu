<svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <!-- Kopf -->
    <rect x="8" y="0" width="8" height="6" fill="#5d6d7e"/>
    <rect x="7" y="1" width="2" height="1" fill="#5d6d7e"/>
    <rect x="15" y="1" width="2" height="1" fill="#5d6d7e"/>
    
    <!-- Augen (rot leuchtend, größer) -->
    <rect x="9" y="2" width="2" height="2" fill="#e74c3c"/>
    <rect x="13" y="2" width="2" height="2" fill="#e74c3c"/>
    <rect x="9" y="2" width="2" height="1" fill="#ff4444"/>
    <rect x="13" y="2" width="2" height="1" fill="#ff4444"/>
    
    <!-- Mund (offen, größer) -->
    <rect x="8" y="5" width="8" height="2" fill="#2c3e50"/>
    <rect x="9" y="4" width="6" height="1" fill="#2c3e50"/>
    
    <!-- Körper (breiter, verrottet) -->
    <rect x="4" y="7" width="16" height="10" fill="#4a5454"/>
    <rect x="5" y="8" width="3" height="2" fill="#5d6d7e"/>
    <rect x="16" y="8" width="3" height="2" fill="#5d6d7e"/>
    <rect x="8" y="11" width="8" height="3" fill="#5d6d7e"/>
    
    <!-- Beine -->
    <rect x="7" y="17" width="3" height="11" fill="#3d4a4a"/>
    <rect x="14" y="17" width="3" height="11" fill="#3d4a4a"/>
    
    <!-- Schuhe -->
    <rect x="6" y="28" width="5" height="3" fill="#2c3e50"/>
    <rect x="13" y="28" width="5" height="3" fill="#2c3e50"/>
    
    <!-- Arme (breiter) -->
    <rect x="1" y="9" width="3" height="5" fill="#4a5454"/>
    <rect x="20" y="9" width="3" height="5" fill="#4a5454"/>
    <rect x="0" y="10" width="1" height="4" fill="#3d4a4a"/>
    <rect x="23" y="10" width="1" height="4" fill="#3d4a4a"/>
    
    <!-- Wunde auf der Brust -->
    <rect x="10" y="10" width="4" height="3" fill="#5d6d7e"/>
    <rect x="11" y="9" width="2" height="2" fill="#5d6d7e"/>
    
    <!-- Blutspritzer -->
    <rect x="6" y="12" width="1" height="1" fill="#c0392b"/>
    <rect x="17" y="13" width="1" height="1" fill="#c0392b"/>
    <rect x="13" y="15" width="1" height="1" fill="#c0392b"/>
</svg>