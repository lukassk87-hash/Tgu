<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 72" width="60" height="72">
  <!-- Schatten -->
  <ellipse cx="30" cy="69" rx="22" ry="4" fill="rgba(0,0,0,0.12)"/>
  
  <!-- Füße -->
  <rect x="20" y="60" width="7" height="7" fill="#4a3728"/>
  <rect x="33" y="60" width="7" height="7" fill="#4a3728"/>
  
  <!-- Beine (schlank) -->
  <rect x="21" y="48" width="6" height="13" fill="#5d4037"/>
  <rect x="33" y="48" width="6" height="13" fill="#5d4037"/>
  
  <!-- Körper (schlank, tailliert) -->
  <rect x="19" y="28" width="22" height="22" fill="#c0392b"/>
  
  <!-- Kragen -->
  <rect x="22" y="28" width="16" height="4" fill="#e74c3c"/>
  
  <!-- Gürtel -->
  <rect x="18" y="44" width="24" height="3" fill="#7f1d1d"/>
  <rect x="27" y="43" width="6" height="6" fill="#f1c40f"/>
  
  <!-- Arme (schlank) -->
  <rect x="13" y="30" width="7" height="20" fill="#c0392b"/>
  <rect x="40" y="30" width="7" height="20" fill="#c0392b"/>
  
  <!-- Hände -->
  <rect x="12" y="48" width="6" height="6" fill="#f5e6d3"/>
  <rect x="42" y="48" width="6" height="6" fill="#f5e6d3"/>
  
  <!-- Kopf (rundlich gemacht) -->
  <rect x="19" y="10" width="22" height="20" fill="#f5e6d3"/>
  
  <!-- Kopf abrunden (Ecken entfernen) -->
  <rect x="17" y="12" width="4" height="16" fill="#f5e6d3"/>
  <rect x="39" y="12" width="4" height="16" fill="#f5e6d3"/>
  <rect x="19" y="8" width="22" height="4" fill="#f5e6d3"/>
  
  <!-- Haare (sanft, oben) -->
  <rect x="18" y="7" width="24" height="5" fill="#8d6e63"/>
  <rect x="16" y="9" width="5" height="5" fill="#8d6e63"/>
  <rect x="39" y="9" width="5" height="5" fill="#8d6e63"/>
  
  <!-- Augen (klar) -->
  <rect x="21" y="17" width="5" height="5" fill="#3d2b1f"/>
  <rect x="34" y="17" width="5" height="5" fill="#3d2b1f"/>
  
  <!-- Augen-Highlight -->
  <rect x="22" y="17" width="2" height="2" fill="white"/>
  <rect x="35" y="17" width="2" height="2" fill="white"/>
  
  <!-- Augenbrauen -->
  <rect x="21" y="14" width="5" height="2" fill="#8d6e63"/>
  <rect x="34" y="14" width="5" height="2" fill="#8d6e63"/>
  
  <!-- Nase (klein, Stups) -->
  <rect x="28" y="20" width="4" height="3" fill="#e8c9a0"/>
  
  <!-- Mund (klar sichtbar) -->
  <rect x="24" y="26" width="12" height="2" fill="#a93226"/>
  
  <!-- Wangen (zart) -->
  <rect x="19" y="21" width="4" height="4" fill="rgba(192,57,43,0.10)"/>
  <rect x="37" y="21" width="4" height="4" fill="rgba(192,57,43,0.10)"/>
  
  <!-- Hals -->
