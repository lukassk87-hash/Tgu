// ===== NACHRICHTEN-WARTESCHLANGE =====
let messageQueue = [];
let isMessageActive = false;
let messageHideTimeout = null;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function setupMessageDisplay() {
    if (tempMessageElement) {
        tempMessageElement.remove();
        tempMessageElement = null;
    }
    const el = document.createElement('div');
    el.id = 'tempMessageDisplay';
    el.style.cssText = `
        position: absolute;
        bottom: 135px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 25;
        background: rgba(0,0,0,0.75);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        color: #fff;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 500;
        text-align: center;
        max-width: 90vw;
        word-wrap: break-word;
        white-space: normal;
        pointer-events: none;
        transition: opacity 0.3s ease;
        opacity: 0;
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        font-family: 'Segoe UI', system-ui, sans-serif;
    `;
    document.getElementById('game-container').appendChild(el);
    tempMessageElement = el;
    
    if (SPLIT_SCREEN) {
        el.style.bottom = '50%';
        el.style.transform = 'translate(-50%, 50%)';
        el.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
    }
}

let messageRotationTimer = 0;
let messageIsFlipped = false;

function showTemporaryMessage(msg, color = '#fff', urgent = false) {
    if (urgent) {
        // Dringende Nachricht - sofort anzeigen, Warteschlange leeren
        messageQueue = [];
        isMessageActive = false;
        if (messageHideTimeout) {
            clearTimeout(messageHideTimeout);
            messageHideTimeout = null;
        }
        // Sofort anzeigen
        tempMessage = msg;
        tempMessageColor = color;
        tempMessageTimer = 3.0;
        if (tempMessageElement) {
            tempMessageElement.textContent = msg;
            tempMessageElement.style.color = color;
            tempMessageElement.style.opacity = '1';
            if (SPLIT_SCREEN) {
                messageIsFlipped = false;
                messageRotationTimer = 0;
                tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
                tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
            }
        }
        isMessageActive = true;
        return;
    }
    messageQueue.push({ msg, color });
    if (!isMessageActive) {
        displayNextMessage();
    }
}

function displayNextMessage() {
    if (messageHideTimeout) {
        clearTimeout(messageHideTimeout);
        messageHideTimeout = null;
    }
    if (messageQueue.length === 0) {
        isMessageActive = false;
        if (tempMessageElement) {
            tempMessageElement.style.opacity = '0';
        }
        return;
    }
    isMessageActive = true;
    const next = messageQueue.shift();
    tempMessage = next.msg;
    tempMessageColor = next.color;
    tempMessageTimer = 3.0;
    if (tempMessageElement) {
        tempMessageElement.textContent = next.msg;
        tempMessageElement.style.color = next.color;
        tempMessageElement.style.opacity = '1';
        if (SPLIT_SCREEN) {
            messageIsFlipped = false;
            messageRotationTimer = 0;
            tempMessageElement.style.transform = 'translate(-50%, 50%) rotate(0deg)';
            tempMessageElement.style.transition = 'opacity 0.3s ease, transform 0.5s ease';
        }
    }
}

function updateMessageDisplay(dt) {
    if (!tempMessageElement) return;
    if (tempMessageTimer <= 0 && isMessageActive) {
        tempMessageElement.style.opacity = '0';
        isMessageActive = false;
        if (messageHideTimeout) clearTimeout(messageHideTimeout);
        messageHideTimeout = setTimeout(() => {
            messageHideTimeout = null;
            displayNextMessage();
        }, 300);
        return;
    }
    if (tempMessageTimer <= 0) return;
    if (!SPLIT_SCREEN) return;
    messageRotationTimer += dt;
    if (messageRotationTimer >= 1.5) {
        messageRotationTimer = 0;
        messageIsFlipped = !messageIsFlipped;
        const rotation = messageIsFlipped ? 180 : 0;
        tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg)`;
        tempMessageElement.style.transition = 'transform 0.5s ease';
        tempMessageElement.style.transform += ' scale(1.05)';
        setTimeout(() => {
            if (tempMessageElement && tempMessageTimer > 0) {
                tempMessageElement.style.transform = `translate(-50%, 50%) rotate(${rotation}deg) scale(1)`;
            }
        }, 150);
    }
}

// ===== SPLIT-START: Gebäude platzieren =====
function placeSplitStartBuilding(player, type, gx, gy) {
    const isPlayer1 = (player === 'player1');
    const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
    // Spieler 1 nur oberes Drittel, Spieler 2 nur unteres Drittel
    if (isPlayer1 && gy > gridLimit) {
        showTemporaryMessage('❌ Spieler 1 darf nur im oberen Drittel bauen!', '#ff6b6b');
        return false;
    }
    if (!isPlayer1 && gy < CONFIG.GRID_HEIGHT - gridLimit) {
        showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b');
        return false;
    }
    // Prüfen ob Zelle belegt (eigene und gegnerische Gebäude)
    if (isCellOccupied(gx, gy)) {
        showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b');
        return false;
    }
    // Gebäude erstellen
    const building = new Building(
        isPlayer1 ? nextBuildingId++ : player2NextBuildingId++,
        type,
        gx, gy,
        false,
        isPlayer1 ? 'player' : 'player2'
    );
    building.isUnderConstruction = false;
    building.constructionProgress = 1;
    if (type === 'haus') {
        building.residents = 6;
        building.maxResidents = 6;
        building.maxProductionTime = 30;
        building.baseMaxProductionTime = 30;
    }
    if (isPlayer1) {
        buildings.push(building);
        // Kamera auf Gebäude zentrieren
        camera.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        camera.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
        player2Buildings.push(building);
        cameraPlayer2.x = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
        cameraPlayer2.y = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    }
    // Einwohner spawnen (nur beim Haus)
    if (type === 'haus') {
        for (let i = 0; i < 6; i++) {
            if (isPlayer1) {
                spawnVillager(building.id);
            } else {
                spawnVillagerPlayer2(building.id);
            }
        }
    }
    markDirty();
    return true;
}

function advanceSplitStart() {
    const phases = ['player1_lager', 'player1_haus', 'player2_lager', 'player2_haus'];
    const currentIndex = phases.indexOf(splitStartPhase);
    if (currentIndex === phases.length - 1) {
        splitStartPhase = null;
        gameStarted = true;
        gameReady = true;
        showTemporaryMessage('🎮 Spiel gestartet! Beide Spieler sind bereit!', '#2ecc71', true);
        return;
    }
    splitStartPhase = phases[currentIndex + 1];
    const nextPlayer = splitStartPhase.startsWith('player1') ? 'Spieler 1' : 'Spieler 2';
    const nextType = splitStartPhase.includes('lager') ? 'Lager' : 'Haus';
    showTemporaryMessage(`👉 ${nextPlayer} platziere dein ${nextType} (kostenlos)`, '#ffd966', true);
}

// ===== INIT SPLIT START =====
function initSplitStart() {
    splitStartPhase = 'player1_lager';
    splitStartComplete = { player1: false, player2: false };
    gameStarted = false;
    gameReady = false;
    showTemporaryMessage('👉 Spieler 1 platziere dein Lager (oberes Drittel)', '#ffd966', true);
}

// ===== NETZWERK-INIT =====
function initNetworkGame(isHost) {
    NETWORK_MODE = true;
    IS_HOST = isHost;
    networkReady = false;
    gameStarted = false;
    gameReady = false;
    
    if (isHost) {
        // Host startet Peer mit fester ID
        const hostId = 'siedlung_host';
        networkPeer = new Peer(hostId, {
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });
        networkPeer.on('open', () => {
            showTemporaryMessage(`✅ Host gestartet (ID: ${hostId})`, '#2ecc71', true);
            // Warte auf Client
            showTemporaryMessage('📡 Warte auf Client-Verbindung...', '#ffd966', true);
        });
        networkPeer.on('connection', (conn) => {
            networkConn = conn;
            setupNetworkConnection(conn);
            showTemporaryMessage('✅ Client verbunden!', '#2ecc71', true);
            // Starte Spiel, sobald Client bereit ist
            startNetworkGame();
        });
        networkPeer.on('error', (err) => {
            showTemporaryMessage(`❌ Host-Fehler: ${err.message}`, '#ff6b6b', true);
        });
    } else {
        // Client verbindet sich mit Host
        const hostId = 'siedlung_host';
        networkPeer = new Peer({
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });
        networkPeer.on('open', (id) => {
            showTemporaryMessage(`✅ Client gestartet (ID: ${id})`, '#2ecc71', true);
            showTemporaryMessage(`🔗 Verbinde zu Host (${hostId})...`, '#ffd966', true);
            networkConn = networkPeer.connect(hostId, { reliable: true });
            networkConn.on('open', () => {
                setupNetworkConnection(networkConn);
                showTemporaryMessage('✅ Mit Host verbunden!', '#2ecc71', true);
                // Warte auf Initial-Snapshot vom Host
                showTemporaryMessage('📥 Empfange Spiel-Zustand...', '#ffd966', true);
            });
            networkConn.on('error', (err) => {
                showTemporaryMessage(`❌ Verbindungsfehler: ${err.message}`, '#ff6b6b', true);
            });
        });
        networkPeer.on('error', (err) => {
            showTemporaryMessage(`❌ Client-Fehler: ${err.message}`, '#ff6b6b', true);
        });
    }
}

function setupNetworkConnection(conn) {
    conn.on('data', (data) => {
        handleNetworkMessage(data);
    });
    conn.on('close', () => {
        showTemporaryMessage('❌ Netzwerkverbindung getrennt!', '#ff6b6b', true);
        networkReady = false;
        if (NETWORK_MODE) {
            // Spiel pausieren oder beenden?
            gameOver = true;
            document.getElementById('gameOverTitle').textContent = '❌ VERBINDUNG VERLOREN!';
            document.getElementById('gameOverSub').textContent = 'Die Netzwerkverbindung wurde getrennt.';
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }
    });
}

function startNetworkGame() {
    // Host sendet Initial-Snapshot
    if (IS_HOST) {
        // Terrain-Generierung wurde bereits in init() gemacht
        // Sende ersten Snapshot mit kompletter Welt
        sendSnapshot();
        // Spiel starten
        gameStarted = true;
        gameReady = true;
        showTemporaryMessage('🎮 Netzwerk-Spiel gestartet!', '#2ecc71', true);
    } else {
        // Client wartet auf ersten Snapshot
        showTemporaryMessage('📥 Warte auf Spiel-Daten vom Host...', '#ffd966', true);
    }
}

// ===== NETZWERK-NACHRICHTEN =====
function handleNetworkMessage(data) {
    try {
        const msg = JSON.parse(data);
        switch(msg.type) {
            case 'snapshot':
                applySnapshot(msg);
                break;
            case 'action':
                // Aktion vom Client empfangen (nur Host)
                if (IS_HOST) {
                    handleNetworkAction(msg.action);
                }
                break;
            case 'ping':
                // Ping vom Client beantworten
                if (IS_HOST) {
                    networkConn.send(JSON.stringify({ type: 'pong', time: msg.time }));
                }
                break;
            case 'pong':
                // Latenz anzeigen (optional)
                const latency = Date.now() - msg.time;
                // showTemporaryMessage(`📡 Latenz: ${latency}ms`, '#aaa');
                break;
            default:
                console.warn('Unbekannte Nachricht:', msg);
        }
    } catch(e) {
        console.warn('Fehler beim Verarbeiten der Netzwerk-Nachricht:', e);
    }
}

function handleNetworkAction(action) {
    // Nur Host führt Aktionen aus
    if (!IS_HOST) return;
    switch(action.type) {
        case 'build':
            // Aktion von Player2 (Client)
            startConstructionPlayer2(action.buildingType, action.gridX, action.gridY);
            break;
        case 'upgrade':
            // Upgrade von Player2
            const building = player2Buildings.find(b => b.id === action.buildingId);
            if (building) upgradeBuildingPlayer2(building);
            break;
        case 'destroy':
            // Destroy von Player2
            destroyBuildingPlayer2(action.gridX, action.gridY);
            break;
        default:
            console.warn('Unbekannte Aktion:', action);
    }
}

// ===== SNAPSHOT-FUNKTIONEN =====
function sendSnapshot() {
    if (!IS_HOST || !networkConn || networkConn.peerConnection.connectionState !== 'connected') return;
    
    const snapshot = {
        type: 'snapshot',
        timestamp: Date.now(),
        // Terrain-Seed für Client (wird bei init bereits gesetzt)
        // Gebäude
        buildings: buildings.map(b => serializeBuilding(b)),
        player2Buildings: player2Buildings.map(b => serializeBuilding(b)),
        // Ressourcen
        resources: { ...resources },
        player2Resources: { ...player2Resources },
        // Einwohner (nur IDs, da der Client eigene Einwohner hat)
        villagers: villagers.map(v => serializeVillager(v)),
        player2Villagers: player2Villagers.map(v => serializeVillager(v)),
        // NPC (nur im Singleplayer, im Netzwerk nicht verwendet)
        npcBuildings: [],
        npcResources: {},
        npcVillagers: [],
        // Feinde
        enemies: enemies.map(e => ({ id: e.id, x: e.x, y: e.y, alive: e.alive, isSuper: e.isSuper, hits: e.hits })),
        // Spiel-Status
        gameMode: gameMode,
        gameStarted: gameStarted,
        gameOver: gameOver,
        buildingRestrictionActive: buildingRestrictionActive,
        // IDs für nächste Vergabe
        nextBuildingId: nextBuildingId,
        nextVillagerId: nextVillagerId,
        nextResourceId: nextResourceId,
        nextEnemyId: nextEnemyId,
        player2NextBuildingId: player2NextBuildingId,
        player2NextVillagerId: player2NextVillagerId,
        player2NextResourceId: player2NextResourceId
    };
    networkConn.send(JSON.stringify(snapshot));
}

function applySnapshot(snapshot) {
    // Nur Client empfängt Snapshots
    if (IS_HOST) return;
    
    // Gebäude des Clients (player2) werden vom Host gesendet
    // Wir ersetzen unsere player2Buildings durch die des Hosts
    player2Buildings = snapshot.player2Buildings.map(b => deserializeBuilding(b));
    // Gebäude des Hosts (player) werden ebenfalls gesendet (für Konsistenz)
    buildings = snapshot.buildings.map(b => deserializeBuilding(b));
    
    // Ressourcen
    resources = { ...snapshot.resources };
    player2Resources = { ...snapshot.player2Resources };
    
    // Einwohner (nur IDs und Zustände, aber wir behalten unsere eigenen Einwohner bei)
    // Wir aktualisieren nur die Zustände der Einwohner, die der Host auch kennt
    // Da der Client seine eigenen Einwohner simuliert, müssen wir nur die player2-Einwohner synchronisieren
    // Aber besser: Wir ersetzen die gesamten Listen (weil der Host die Hoheit hat)
    villagers = snapshot.villagers.map(v => deserializeVillager(v));
    player2Villagers = snapshot.player2Villagers.map(v => deserializeVillager(v));
    
    // Feinde
    enemies = snapshot.enemies.map(e => ({
        id: e.id,
        x: e.x,
        y: e.y,
        alive: e.alive,
        isSuper: e.isSuper,
        hits: e.hits,
        killCount: 0,
        targetVillager: null,
        speed: e.isSuper ? 35 : 45,
        maxHits: e.isSuper ? 3 : 1
    }));
    
    // Spiel-Status
    gameMode = snapshot.gameMode;
    gameStarted = snapshot.gameStarted;
    gameOver = snapshot.gameOver;
    buildingRestrictionActive = snapshot.buildingRestrictionActive;
    
    // IDs aktualisieren
    nextBuildingId = snapshot.nextBuildingId;
    nextVillagerId = snapshot.nextVillagerId;
    nextResourceId = snapshot.nextResourceId;
    nextEnemyId = snapshot.nextEnemyId;
    player2NextBuildingId = snapshot.player2NextBuildingId;
    player2NextVillagerId = snapshot.player2NextVillagerId;
    player2NextResourceId = snapshot.player2NextResourceId;
    
    // Caches aktualisieren
    markDirty();
    markPlayerCacheDirty();
    markPlayer2CacheDirty();
    
    // Client als bereit markieren
    if (!gameReady) {
        gameReady = true;
        showTemporaryMessage('✅ Spiel-Zustand empfangen!', '#2ecc71', true);
    }
}

// ===== SERIALISIERUNGS-HELPER =====
function serializeBuilding(b) {
    return {
        id: b.id,
        type: b.type,
        gridX: b.gridX,
        gridY: b.gridY,
        isNPC: b.isNPC || false,
        playerId: b.playerId || 'player',
        residents: b.residents || 0,
        maxResidents: b.maxResidents || 6,
        growthTimer: b.growthTimer || 0,
        grainConsumeTimer: b.grainConsumeTimer || 0,
        stoneAmmo: b.stoneAmmo || 0,
        maxStoneAmmo: b.maxStoneAmmo || 15,
        shootCooldown: b.shootCooldown || 0,
        level: b.level || 1,
        baseMaxProductionTime: b.baseMaxProductionTime || 0,
        maxProductionTime: b.maxProductionTime || 0,
        baseFireRate: b.baseFireRate || 1.0,
        doubleShot: b.doubleShot || false,
        productionType: b.productionType || null,
        supplyRequested: b.supplyRequested || false,
        isUnderConstruction: b.isUnderConstruction || false,
        constructionProgress: b.constructionProgress || 0,
        constructionTimer: b.constructionTimer || 0,
        builder: b.builder || null,
        waitingForBuilder: b.waitingForBuilder || false,
        reservedStone: b.reservedStone || 0,
        captureProgress: b.captureProgress || 0,
        beingCaptured: b.beingCaptured || false,
        capturedBy: b.capturedBy || null,
        range: b.range || CONFIG.TOWER_RANGE
    };
}

function deserializeBuilding(data) {
    const b = new Building(data.id, data.type, data.gridX, data.gridY, data.isNPC, data.playerId);
    b.residents = data.residents;
    b.maxResidents = data.maxResidents;
    b.growthTimer = data.growthTimer;
    b.grainConsumeTimer = data.grainConsumeTimer;
    b.stoneAmmo = data.stoneAmmo;
    b.maxStoneAmmo = data.maxStoneAmmo;
    b.shootCooldown = data.shootCooldown;
    b.level = data.level;
    b.baseMaxProductionTime = data.baseMaxProductionTime;
    b.maxProductionTime = data.maxProductionTime;
    b.baseFireRate = data.baseFireRate;
    b.doubleShot = data.doubleShot;
    b.productionType = data.productionType;
    b.supplyRequested = data.supplyRequested;
    b.isUnderConstruction = data.isUnderConstruction;
    b.constructionProgress = data.constructionProgress;
    b.constructionTimer = data.constructionTimer;
    b.builder = data.builder;
    b.waitingForBuilder = data.waitingForBuilder;
    b.reservedStone = data.reservedStone;
    b.captureProgress = data.captureProgress;
    b.beingCaptured = data.beingCaptured;
    b.capturedBy = data.capturedBy;
    b.range = data.range || CONFIG.TOWER_RANGE;
    return b;
}

function serializeVillager(v) {
    return {
        id: v.id,
        homeId: v.homeId,
        isNPC: v.isNPC || false,
        playerId: v.playerId || 'player',
        x: v.x,
        y: v.y,
        targetX: v.targetX || v.x,
        targetY: v.targetY || v.y,
        speed: v.speed || 65,
        carrying: v.carrying || null,
        state: v.state || 'idle',
        resourceTarget: v.resourceTarget ? { id: v.resourceTarget.id, x: v.resourceTarget.x, y: v.resourceTarget.y, type: v.resourceTarget.type } : null,
        alive: v.alive !== undefined ? v.alive : true,
        hasTask: v.hasTask || false,
        deliveryTarget: v.deliveryTarget || null,
        npcHomeLager: v.npcHomeLager || null,
        isDeliveringStone: v.isDeliveringStone || false,
        towerTarget: v.towerTarget ? v.towerTarget.id : null,
        stoneToDeliver: v.stoneToDeliver || 0,
        isAttacking: v.isAttacking || false,
        attackTarget: v.attackTarget ? v.attackTarget.id : null,
        combatCooldown: v.combatCooldown || 0,
        capturingBuilding: v.capturingBuilding || null,
        captureTimer: v.captureTimer || 0,
        lastCaptureTime: v.lastCaptureTime || 0,
        isBuilding: v.isBuilding || false,
        buildingTarget: v.buildingTarget || null,
        buildingProgress: v.buildingProgress || 0,
        hasReservedStone: v.hasReservedStone || false,
        captureTargetId: v.captureTargetId || null
    };
}

function deserializeVillager(data) {
    const v = new Villager(data.id, data.homeId, data.isNPC, data.playerId);
    v.x = data.x;
    v.y = data.y;
    v.targetX = data.targetX;
    v.targetY = data.targetY;
    v.speed = data.speed;
    v.carrying = data.carrying;
    v.state = data.state;
    v.resourceTarget = data.resourceTarget;
    v.alive = data.alive;
    v.hasTask = data.hasTask;
    v.deliveryTarget = data.deliveryTarget;
    v.npcHomeLager = data.npcHomeLager;
    v.isDeliveringStone = data.isDeliveringStone;
    v.towerTarget = data.towerTarget; // muss später aufgelöst werden
    v.stoneToDeliver = data.stoneToDeliver;
    v.isAttacking = data.isAttacking;
    v.attackTarget = data.attackTarget;
    v.combatCooldown = data.combatCooldown;
    v.capturingBuilding = data.capturingBuilding;
    v.captureTimer = data.captureTimer;
    v.lastCaptureTime = data.lastCaptureTime;
    v.isBuilding = data.isBuilding;
    v.buildingTarget = data.buildingTarget;
    v.buildingProgress = data.buildingProgress;
    v.hasReservedStone = data.hasReservedStone;
    v.captureTargetId = data.captureTargetId;
    return v;
}

// ===== GLOBAL EXPOSE für Netzwerk-Funktionen =====
window.sendNetworkAction = function(action) {
    if (!NETWORK_MODE || !networkConn) return;
    if (IS_HOST) {
        // Host führt Aktion sofort aus
        handleNetworkAction(action);
    } else {
        // Client sendet an Host
        networkConn.send(JSON.stringify({ type: 'action', action: action }));
    }
};

window.sendSnapshot = function() {
    if (!NETWORK_MODE || !IS_HOST || !networkConn) return;
    sendSnapshot();
};

// ===== GAME LOOP =====
let gameReady = false;

function gameLoop(now) {
    let dt = (now - lastTimestamp) / 1000;
    if (dt > 0.2) dt = 0.016;
    if (dt < 0.001) dt = 0.001;
    lastTimestamp = now;
    dt *= gameSpeed;

    updateMessageDisplay(dt);

    if (gameStarted) {
        const elapsed = (performance.now() / 1000) - gameStartTime;
        if (elapsed >= BUILD_RESTRICTION_DURATION && buildingRestrictionActive) {
            buildingRestrictionActive = false;
            showTemporaryMessage('🏗️ Baubeschränkung aufgehoben!', '#44ff44');
        }

        attackTimer += dt;
        if (attackTimer >= nextAttackDelay) {
            attackTimer = 0;
            nextAttackDelay = 60 + Math.random() * 60;
            spawnEnemies();
        }

        updateEconomy(dt);
        updateVillagers(dt);
        if (SPLIT_SCREEN || (NETWORK_MODE && !IS_HOST)) {
            // Im Netzwerk-Modus aktualisiert der Client seine eigenen Einwohner (player2)
            // Der Host aktualisiert beide (player und player2) im selben Loop
            if (SPLIT_SCREEN) {
                updateVillagersPlayer2(dt);
            }
        }
        if (NETWORK_MODE && IS_HOST) {
            // Host aktualisiert auch player2
            updateVillagersPlayer2(dt);
        }
        updateConstruction(dt);
        if (SPLIT_SCREEN || (NETWORK_MODE && IS_HOST)) {
            // Host aktualisiert player2-Baustellen
            updateConstructionPlayer2(dt);
        }
        if (!SPLIT_SCREEN && !NETWORK_MODE) {
            // NPC nur im Singleplayer
            updateNPC(dt);
            updateNPCVillagers(dt);
        }
        updateCombatAndCapture(dt);
        updateTowers(dt);
        updateProjectiles(dt);
        updateHitEffects(dt);
        updateEnemies(dt);

        // Netzwerk-Snapshot-Versand (nur Host)
        if (NETWORK_MODE && IS_HOST) {
            syncTimer += dt;
            if (syncTimer >= 2.0) { // alle 2 Sekunden
                syncTimer = 0;
                sendSnapshot();
            }
        }

        if (gameReady) {
            checkGameOver();
        }

        updateUI();
        if (window.updateModeDisplay) window.updateModeDisplay();
    }

    draw();

    if (tempMessageTimer > 0) {
        tempMessageTimer -= dt;
        if (tempMessageTimer <= 0 && tempMessageElement) {
            // wird von updateMessageDisplay behandelt
        }
    }

    requestAnimationFrame(gameLoop);
}

// =========================================================================
//  MODUL 24: P2P-NETZWERK
//  Stellt die Netzwerk-Kommunikation für den Multiplayer-Modus bereit.
//  Wird nur im NETWORK_MODE verwendet.
// =========================================================================


// ===== GLOBALE NETZWERK-VARIABLEN (werden in Modul 4 definiert) =====
// NETWORK_MODE, IS_HOST, networkPeer, networkConn, syncTimer, networkReady, pendingNetworkActions, lastSnapshot, networkPlayerId

// ===== KONFIGURATION =====
const NETWORK_HOST_ID = 'siedlung_host';
const SNAPSHOT_INTERVAL = 2.0; // Sekunden zwischen Snapshots

// ===== INITIALISIERUNG =====
function initNetworkGame(isHost) {
    NETWORK_MODE = true;
    IS_HOST = isHost;
    networkReady = false;
    syncTimer = 0;
    pendingNetworkActions = [];
    lastSnapshot = null;
    networkPlayerId = isHost ? 'player' : 'player2'; // Host steuert player, Client steuert player2

    // PeerJS-Konfiguration
    const peerConfig = {
        debug: 2,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    };

    if (isHost) {
        // Host startet mit fester ID
        networkPeer = new Peer(NETWORK_HOST_ID, peerConfig);
        networkPeer.on('open', () => {
            showTemporaryMessage(`✅ Host gestartet (ID: ${NETWORK_HOST_ID})`, '#2ecc71', true);
            showTemporaryMessage('📡 Warte auf Client-Verbindung...', '#ffd966', true);
        });
        networkPeer.on('connection', (conn) => {
            networkConn = conn;
            setupNetworkConnection(conn);
            showTemporaryMessage('✅ Client verbunden!', '#2ecc71', true);
            // Host startet das Spiel (wird von Modul 22 aufgerufen)
            if (typeof startNetworkGame === 'function') {
                startNetworkGame();
            }
        });
        networkPeer.on('error', (err) => {
            if (err.message.includes('ID')) {
                showTemporaryMessage(`❌ ID "${NETWORK_HOST_ID}" bereits vergeben!`, '#ff6b6b', true);
            } else {
                showTemporaryMessage(`❌ Host-Fehler: ${err.message}`, '#ff6b6b', true);
            }
        });
        networkPeer.on('disconnected', () => {
            showTemporaryMessage('❌ Host-Verbindung unterbrochen', '#ff6b6b', true);
            handleDisconnect();
        });
    } else {
        // Client verbindet sich mit Host
        networkPeer = new Peer(peerConfig);
        networkPeer.on('open', (id) => {
            showTemporaryMessage(`✅ Client gestartet (ID: ${id})`, '#2ecc71', true);
            showTemporaryMessage(`🔗 Verbinde zu Host (${NETWORK_HOST_ID})...`, '#ffd966', true);
            networkConn = networkPeer.connect(NETWORK_HOST_ID, { reliable: true });
            networkConn.on('open', () => {
                setupNetworkConnection(networkConn);
                showTemporaryMessage('✅ Mit Host verbunden!', '#2ecc71', true);
                // Client wartet auf ersten Snapshot
                showTemporaryMessage('📥 Empfange Spiel-Zustand...', '#ffd966', true);
            });
            networkConn.on('error', (err) => {
                if (err.message.includes('ID')) {
                    showTemporaryMessage(`❌ Host mit ID "${NETWORK_HOST_ID}" nicht gefunden!`, '#ff6b6b', true);
                } else {
                    showTemporaryMessage(`❌ Verbindungsfehler: ${err.message}`, '#ff6b6b', true);
                }
            });
        });
        networkPeer.on('error', (err) => {
            showTemporaryMessage(`❌ Client-Fehler: ${err.message}`, '#ff6b6b', true);
        });
        networkPeer.on('disconnected', () => {
            showTemporaryMessage('❌ Client-Verbindung unterbrochen', '#ff6b6b', true);
            handleDisconnect();
        });
    }
}

// ===== VERBINDUNG EINRICHTEN =====
function setupNetworkConnection(conn) {
    conn.on('data', (data) => {
        handleNetworkMessage(data);
    });
    conn.on('close', () => {
        showTemporaryMessage('❌ Netzwerkverbindung getrennt!', '#ff6b6b', true);
        handleDisconnect();
    });
}

// ===== VERBINDUNGSVERLUST BEHANDELN =====
function handleDisconnect() {
    networkReady = false;
    if (NETWORK_MODE && !gameOver) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '❌ VERBINDUNG VERLOREN!';
        document.getElementById('gameOverSub').textContent = 'Die Netzwerkverbindung wurde getrennt.';
        document.getElementById('gameOverOverlay').style.display = 'flex';
    }
}

// ===== NETZWERK-NACHRICHTEN VERARBEITEN =====
function handleNetworkMessage(data) {
    try {
        const msg = JSON.parse(data);
        switch(msg.type) {
            case 'snapshot':
                applySnapshot(msg);
                break;
            case 'action':
                if (IS_HOST) {
                    // Host führt Aktionen von Client aus
                    handleNetworkAction(msg.action);
                }
                break;
            case 'ping':
                if (IS_HOST) {
                    // Ping vom Client beantworten
                    networkConn.send(JSON.stringify({ type: 'pong', time: msg.time }));
                }
                break;
            case 'pong':
                // Latenz anzeigen (optional)
                const latency = Date.now() - msg.time;
                // showTemporaryMessage(`📡 Latenz: ${latency}ms`, '#aaa');
                break;
            default:
                console.warn('Unbekannte Nachricht:', msg);
        }
    } catch(e) {
        console.warn('Fehler beim Verarbeiten der Netzwerk-Nachricht:', e);
    }
}

// ===== NETZWERK-AKTIONEN AUSFÜHREN (NUR HOST) =====
function handleNetworkAction(action) {
    if (!IS_HOST) return;
    switch(action.type) {
        case 'build':
            startConstructionPlayer2(action.buildingType, action.gridX, action.gridY);
            break;
        case 'upgrade':
            const building = player2Buildings.find(b => b.id === action.buildingId);
            if (building) upgradeBuildingPlayer2(building);
            break;
        case 'destroy':
            destroyBuildingPlayer2(action.gridX, action.gridY);
            break;
        default:
            console.warn('Unbekannte Aktion:', action);
    }
}

// ===== AKTIONEN VOM CLIENT SENDEN =====
function sendNetworkAction(action) {
    if (!NETWORK_MODE || !networkConn) return;
    if (IS_HOST) {
        // Host führt Aktion sofort aus (für Player1)
        handleNetworkAction(action);
    } else {
        // Client sendet an Host
        networkConn.send(JSON.stringify({ type: 'action', action: action }));
        // Pending-Aktionen merken (für eventuelle Wiederholung)
        pendingNetworkActions.push(action);
    }
}

// ===== SNAPSHOT ERSTELLEN (NUR HOST) =====
function sendSnapshot() {
    if (!IS_HOST || !networkConn || networkConn.peerConnection.connectionState !== 'connected') return;

    const snapshot = {
        type: 'snapshot',
        timestamp: Date.now(),
        // Gebäude
        buildings: buildings.map(b => serializeBuilding(b)),
        player2Buildings: player2Buildings.map(b => serializeBuilding(b)),
        // Ressourcen
        resources: { ...resources },
        player2Resources: { ...player2Resources },
        // Einwohner
        villagers: villagers.map(v => serializeVillager(v)),
        player2Villagers: player2Villagers.map(v => serializeVillager(v)),
        // Feinde
        enemies: enemies.map(e => ({
            id: e.id,
            x: e.x,
            y: e.y,
            alive: e.alive,
            isSuper: e.isSuper,
            hits: e.hits,
            killCount: e.killCount || 0
        })),
        // Spiel-Status
        gameMode: gameMode,
        gameStarted: gameStarted,
        gameOver: gameOver,
        buildingRestrictionActive: buildingRestrictionActive,
        // IDs für nächste Vergabe
        nextBuildingId: nextBuildingId,
        nextVillagerId: nextVillagerId,
        nextResourceId: nextResourceId,
        nextEnemyId: nextEnemyId,
        player2NextBuildingId: player2NextBuildingId,
        player2NextVillagerId: player2NextVillagerId,
        player2NextResourceId: player2NextResourceId,
        // Konfiguration (damit Client gleiche Einstellungen hat)
        gridWidth: CONFIG.GRID_WIDTH,
        gridHeight: CONFIG.GRID_HEIGHT,
        cellSize: CONFIG.CELL_SIZE
    };
    networkConn.send(JSON.stringify(snapshot));
    lastSnapshot = snapshot;
}

// ===== SNAPSHOT ANWENDEN (NUR CLIENT) =====
function applySnapshot(snapshot) {
    if (IS_HOST) return; // Host ignoriert Snapshots (er sendet sie nur)

    // Konfiguration vom Host übernehmen (falls abweichend)
    if (snapshot.gridWidth && snapshot.gridHeight) {
        // CONFIG anpassen (optional)
    }

    // Gebäude
    buildings = snapshot.buildings.map(b => deserializeBuilding(b));
    player2Buildings = snapshot.player2Buildings.map(b => deserializeBuilding(b));

    // Ressourcen
    resources = { ...snapshot.resources };
    player2Resources = { ...snapshot.player2Resources };

    // Einwohner – ersetzen komplett
    villagers = snapshot.villagers.map(v => deserializeVillager(v));
    player2Villagers = snapshot.player2Villagers.map(v => deserializeVillager(v));

    // Feinde
    enemies = snapshot.enemies.map(e => ({
        id: e.id,
        x: e.x,
        y: e.y,
        alive: e.alive,
        isSuper: e.isSuper,
        hits: e.hits,
        killCount: e.killCount || 0,
        speed: e.isSuper ? 35 : 45,
        maxHits: e.isSuper ? 3 : 1,
        targetVillager: null
    }));

    // Spiel-Status
    gameMode = snapshot.gameMode;
    gameStarted = snapshot.gameStarted;
    gameOver = snapshot.gameOver;
    buildingRestrictionActive = snapshot.buildingRestrictionActive;

    // IDs aktualisieren
    nextBuildingId = snapshot.nextBuildingId;
    nextVillagerId = snapshot.nextVillagerId;
    nextResourceId = snapshot.nextResourceId;
    nextEnemyId = snapshot.nextEnemyId;
    player2NextBuildingId = snapshot.player2NextBuildingId;
    player2NextVillagerId = snapshot.player2NextVillagerId;
    player2NextResourceId = snapshot.player2NextResourceId;

    // Caches aktualisieren
    markDirty();
    markPlayerCacheDirty();
    markPlayer2CacheDirty();

    // Client als bereit markieren
    if (!gameReady) {
        gameReady = true;
        showTemporaryMessage('✅ Spiel-Zustand empfangen!', '#2ecc71', true);
    }

    // Pending-Aktionen zurücksetzen (sie wurden vom Host bereits verarbeitet)
    pendingNetworkActions = [];
}

// ===== SERIALISIERUNGS-HELPER FÜR GEBÄUDE =====
function serializeBuilding(b) {
    return {
        id: b.id,
        type: b.type,
        gridX: b.gridX,
        gridY: b.gridY,
        isNPC: b.isNPC || false,
        playerId: b.playerId || 'player',
        residents: b.residents || 0,
        maxResidents: b.maxResidents || 6,
        growthTimer: b.growthTimer || 0,
        grainConsumeTimer: b.grainConsumeTimer || 0,
        stoneAmmo: b.stoneAmmo || 0,
        maxStoneAmmo: b.maxStoneAmmo || 15,
        shootCooldown: b.shootCooldown || 0,
        level: b.level || 1,
        baseMaxProductionTime: b.baseMaxProductionTime || 0,
        maxProductionTime: b.maxProductionTime || 0,
        baseFireRate: b.baseFireRate || 1.0,
        doubleShot: b.doubleShot || false,
        productionType: b.productionType || null,
        supplyRequested: b.supplyRequested || false,
        isUnderConstruction: b.isUnderConstruction || false,
        constructionProgress: b.constructionProgress || 0,
        constructionTimer: b.constructionTimer || 0,
        builder: b.builder || null,
        waitingForBuilder: b.waitingForBuilder || false,
        reservedStone: b.reservedStone || 0,
        captureProgress: b.captureProgress || 0,
        beingCaptured: b.beingCaptured || false,
        capturedBy: b.capturedBy || null,
        range: b.range || CONFIG.TOWER_RANGE
    };
}

function deserializeBuilding(data) {
    const b = new Building(data.id, data.type, data.gridX, data.gridY, data.isNPC, data.playerId);
    b.residents = data.residents;
    b.maxResidents = data.maxResidents;
    b.growthTimer = data.growthTimer;
    b.grainConsumeTimer = data.grainConsumeTimer;
    b.stoneAmmo = data.stoneAmmo;
    b.maxStoneAmmo = data.maxStoneAmmo;
    b.shootCooldown = data.shootCooldown;
    b.level = data.level;
    b.baseMaxProductionTime = data.baseMaxProductionTime;
    b.maxProductionTime = data.maxProductionTime;
    b.baseFireRate = data.baseFireRate;
    b.doubleShot = data.doubleShot;
    b.productionType = data.productionType;
    b.supplyRequested = data.supplyRequested;
    b.isUnderConstruction = data.isUnderConstruction;
    b.constructionProgress = data.constructionProgress;
    b.constructionTimer = data.constructionTimer;
    b.builder = data.builder;
    b.waitingForBuilder = data.waitingForBuilder;
    b.reservedStone = data.reservedStone;
    b.captureProgress = data.captureProgress;
    b.beingCaptured = data.beingCaptured;
    b.capturedBy = data.capturedBy;
    b.range = data.range || CONFIG.TOWER_RANGE;
    return b;
}

// ===== SERIALISIERUNGS-HELPER FÜR EINWOHNER =====
function serializeVillager(v) {
    return {
        id: v.id,
        homeId: v.homeId,
        isNPC: v.isNPC || false,
        playerId: v.playerId || 'player',
        x: v.x,
        y: v.y,
        targetX: v.targetX || v.x,
        targetY: v.targetY || v.y,
        speed: v.speed || 65,
        carrying: v.carrying || null,
        state: v.state || 'idle',
        resourceTarget: v.resourceTarget ? { id: v.resourceTarget.id, x: v.resourceTarget.x, y: v.resourceTarget.y, type: v.resourceTarget.type } : null,
        alive: v.alive !== undefined ? v.alive : true,
        hasTask: v.hasTask || false,
        deliveryTarget: v.deliveryTarget || null,
        npcHomeLager: v.npcHomeLager || null,
        isDeliveringStone: v.isDeliveringStone || false,
        towerTarget: v.towerTarget ? v.towerTarget.id : null,
        stoneToDeliver: v.stoneToDeliver || 0,
        isAttacking: v.isAttacking || false,
        attackTarget: v.attackTarget ? v.attackTarget.id : null,
        combatCooldown: v.combatCooldown || 0,
        capturingBuilding: v.capturingBuilding || null,
        captureTimer: v.captureTimer || 0,
        lastCaptureTime: v.lastCaptureTime || 0,
        isBuilding: v.isBuilding || false,
        buildingTarget: v.buildingTarget || null,
        buildingProgress: v.buildingProgress || 0,
        hasReservedStone: v.hasReservedStone || false,
        captureTargetId: v.captureTargetId || null
    };
}

function deserializeVillager(data) {
    const v = new Villager(data.id, data.homeId, data.isNPC, data.playerId);
    v.x = data.x;
    v.y = data.y;
    v.targetX = data.targetX;
    v.targetY = data.targetY;
    v.speed = data.speed;
    v.carrying = data.carrying;
    v.state = data.state;
    v.resourceTarget = data.resourceTarget;
    v.alive = data.alive;
    v.hasTask = data.hasTask;
    v.deliveryTarget = data.deliveryTarget;
    v.npcHomeLager = data.npcHomeLager;
    v.isDeliveringStone = data.isDeliveringStone;
    v.towerTarget = data.towerTarget; // wird später aufgelöst
    v.stoneToDeliver = data.stoneToDeliver;
    v.isAttacking = data.isAttacking;
    v.attackTarget = data.attackTarget;
    v.combatCooldown = data.combatCooldown;
    v.capturingBuilding = data.capturingBuilding;
    v.captureTimer = data.captureTimer;
    v.lastCaptureTime = data.lastCaptureTime;
    v.isBuilding = data.isBuilding;
    v.buildingTarget = data.buildingTarget;
    v.buildingProgress = data.buildingProgress;
    v.hasReservedStone = data.hasReservedStone;
    v.captureTargetId = data.captureTargetId;
    return v;
}

// ===== PING (LATENZ-MESSUNG) =====
function sendPing() {
    if (!NETWORK_MODE || !networkConn || networkConn.peerConnection.connectionState !== 'connected') return;
    if (!IS_HOST) {
        // Nur Client sendet Ping (Host antwortet)
        networkConn.send(JSON.stringify({ type: 'ping', time: Date.now() }));
    }
}

// ===== NETZWERK-UPDATE IM GAME-LOOP (wird von Modul 22 aufgerufen) =====
function updateNetwork(dt) {
    if (!NETWORK_MODE || !networkReady) return;

    if (IS_HOST) {
        // Host sendet periodisch Snapshots
        syncTimer += dt;
        if (syncTimer >= SNAPSHOT_INTERVAL) {
            syncTimer = 0;
            sendSnapshot();
        }
    } else {
        // Client sendet regelmäßig Ping
        // (optional: alle 5 Sekunden)
        if (!window._lastPingTime) window._lastPingTime = 0;
        window._lastPingTime += dt;
        if (window._lastPingTime >= 5.0) {
            window._lastPingTime = 0;
            sendPing();
        }
    }
}

// ===== GLOBALE FUNKTIONEN EXPOSEN (für Modul 7 und 22) =====
window.sendNetworkAction = sendNetworkAction;
window.sendSnapshot = sendSnapshot;
window.initNetworkGame = initNetworkGame;
window.updateNetwork = updateNetwork;
window.applySnapshot = applySnapshot;
window.handleNetworkAction = handleNetworkAction;

// =========================================================================
// MODUL 23: SOUND-EFFEKTE
// =========================================================================
const SoundFX = (() => {
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function isVisible(worldX, worldY) {
    const left = camera.x - (canvas.width / 2) / camera.zoom;
    const right = camera.x + (canvas.width / 2) / camera.zoom;
    const top = camera.y - (canvas.height / 2) / camera.zoom;
    const bottom = camera.y + (canvas.height / 2) / camera.zoom;
    return worldX >= left && worldX <= right && worldY >= top && worldY <= bottom;
  }
  function play(freq, duration, type = 'square', vol = 0.1) {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }
  return {
    playIfVisible(worldX, worldY, type) {
      if (!isVisible(worldX, worldY)) return;
      switch(type) {
        case 'build': play(220, 0.15, 'square', 0.08); break;
        case 'capture': play(440, 0.2, 'triangle', 0.1); break;
        case 'hit': play(150, 0.1, 'sawtooth', 0.12); break;
        case 'enemyDeath': play(80, 0.3, 'sawtooth', 0.15); break;
        case 'towerShoot': play(880, 0.08, 'square', 0.06); break;
        case 'upgrade': play(660, 0.15, 'triangle', 0.1); break;
        case 'destroy': play(100, 0.25, 'sawtooth', 0.15); break;
        case 'villagerDie': play(200, 0.15, 'square', 0.1); break;
      }
    }
  };
})();
</script>
