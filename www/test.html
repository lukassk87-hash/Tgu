function spawnEnemies() {
    if (enemiesHaveCleared) return;
    
    // ===== BEVÖLKERUNG FÜR SPAWNING BERECHNEN =====
    let totalPop = 0;
    if (SPLIT_SCREEN) {
        const pop1 = villagers.filter(v => v.alive).length;
        const pop2 = player2Villagers.filter(v => v.alive).length;
        totalPop = Math.floor((pop1 + pop2) / 2);
    } else {
        totalPop = villagers.filter(v => v.alive).length;
    }
    
    if (totalPop < 12) return;
    
    const currentEnemyCount = enemies.filter(e => e.alive).length;
    const maxEnemies = getMaxEnemies();
    const maxSpawn = Math.max(0, maxEnemies - currentEnemyCount);
    if (maxSpawn <= 0) return;
    
    const packSize = Math.min(maxSpawn, CONFIG.MAX_SPAWN_PER_FRAME);
    const eliteChance = totalPop >= 200 ? 0.20 : 0.10;
    
    for (let i = 0; i < packSize; i++) {
        let ex, ey;
        const side = Math.floor(Math.random() * 4);
        switch (side) {
            case 0: ex = Math.random() * WORLD_WIDTH; ey = 0; break;
            case 1: ex = WORLD_WIDTH; ey = Math.random() * WORLD_HEIGHT; break;
            case 2: ex = Math.random() * WORLD_WIDTH; ey = WORLD_HEIGHT; break;
            case 3: ex = 0; ey = Math.random() * WORLD_HEIGHT; break;
        }
        enemySpawnCounter++;
        const isSuper = (Math.random() < eliteChance);
        enemies.push(new Enemy(nextEnemyId++, ex, ey, isSuper));
    }
    markDirty();
}

function updateEnemies(dt) {
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    // ===== ALLE LEBENDEN VILLAGER SAMMELN =====
    const allVillagers = [];
    
    // Spieler 1 (immer)
    for (let v of villagers) {
        if (v.alive) allVillagers.push(v);
    }
    
    // Spieler 2 (nur im Split-Modus)
    if (SPLIT_SCREEN) {
        for (let v of player2Villagers) {
            if (v.alive) allVillagers.push(v);
        }
    }
    
    // NPC (nur im Einzelmodus)
    if (!SPLIT_SCREEN) {
        for (let v of npcVillagers) {
            if (v.alive) allVillagers.push(v);
        }
    }

    // Wenn keine Villager mehr leben, Feinde zurücksetzen
    if (allVillagers.length === 0 && enemies.some(e => e.alive)) {
        enemies = [];
        enemiesHaveCleared = true;
        return;
    }
    if (allVillagers.length > 0 && enemiesHaveCleared) enemiesHaveCleared = false;

    // ===== JEDEN LEBENDEN FEIND VERARBEITEN =====
    for (let enemy of enemies) {
        if (!enemy.alive) continue;

        // Feind hat 2 Villager getötet -> stirbt
        if (enemy.killCount >= 2) {
            enemy.alive = false;
            continue;
        }

        if (allVillagers.length === 0) {
            enemy.targetVillager = null;
            continue;
        }

        // Nächsten Villager finden
        let closestVillager = null;
        let closestDistSq = Infinity;

        for (let v of allVillagers) {
            if (!v.alive) continue;
            const d2 = dist2(enemy, v);
            if (d2 < closestDistSq) {
                closestDistSq = d2;
                closestVillager = v;
            }
        }

        if (!closestVillager) {
            enemy.targetVillager = null;
            continue;
        }

        enemy.targetVillager = closestVillager;
        const target = enemy.targetVillager;

        if (!target || !target.alive) {
            enemy.targetVillager = null;
            continue;
        }

        const d2 = dist2(enemy, target);
        const d = Math.sqrt(d2);

        if (d < 8) {
            // ===== VILLAGER TÖTEN =====
            const isNPC = target.isNPC || false;
            const isPlayer2 = (target.playerId === 'player2');

            if (isNPC) {
                // NPC-Einwohner töten
                const home = npcBuildings.find(b => b.id === target.homeId);
                if (home && home.residents > 0) home.residents -= 1;
                if (target.carrying === 'stone' || target.hasReservedStone) {
                    npcResources.stone += (target.stoneToDeliver || 0);
                    if (target.towerTarget) {
                        target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                    }
                }
                target.alive = false;
            } else if (isPlayer2) {
                // Spieler 2 Einwohner töten
                if (target.carrying === 'stone' || target.hasReservedStone) {
                    player2Resources.stone += (target.stoneToDeliver || 0);
                    if (target.towerTarget) {
                        target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                    }
                }
                if (target.carrying === 'grain') player2Resources.grain += 1;
                if (target.carrying === 'wood') player2Resources.wood += 1;
                if (target.resourceTarget) {
                    const node = player2ResourceNodes.find(r => r.id === target.resourceTarget.id);
                    if (node && node.claimedBy === target.id) node.claimedBy = null;
                    target.resourceTarget = null;
                }
                if (target.isBuilding && target.buildingTarget) {
                    const building = player2Buildings.find(b => b.id === target.buildingTarget);
                    if (building && building.isUnderConstruction) {
                        building.builder = null;
                        building.waitingForBuilder = true;
                    }
                    target.isBuilding = false;
                    target.buildingTarget = null;
                }
                const home = player2Buildings.find(b => b.id === target.homeId);
                if (home && home.residents > 0) home.residents -= 1;
                target.alive = false;
            } else {
                // Spieler 1 Einwohner töten
                if (target.carrying === 'stone' || target.hasReservedStone) {
                    resources.stone += (target.stoneToDeliver || 0);
                    if (target.towerTarget) {
                        target.towerTarget.reservedStone = Math.max(0, target.towerTarget.reservedStone - (target.stoneToDeliver || 0));
                    }
                }
                if (target.carrying === 'grain') resources.grain += 1;
                if (target.carrying === 'wood') resources.wood += 1;
                if (target.resourceTarget) {
                    const node = resourceNodes.find(r => r.id === target.resourceTarget.id);
                    if (node && node.claimedBy === target.id) node.claimedBy = null;
                    target.resourceTarget = null;
                }
                if (target.isBuilding && target.buildingTarget) {
                    const building = buildings.find(b => b.id === target.buildingTarget);
                    if (building && building.isUnderConstruction) {
                        building.builder = null;
                        building.waitingForBuilder = true;
                    }
                    target.isBuilding = false;
                    target.buildingTarget = null;
                }
                const home = buildings.find(b => b.id === target.homeId);
                if (home && home.residents > 0) home.residents -= 1;
                target.alive = false;
            }
            
            enemy.killCount += 1;
            enemy.targetVillager = null;
            markDirty();
        } else {
            // Bewegen
            const step = Math.min(d, enemy.speed * dt);
            enemy.x += (target.x - enemy.x) / d * step;
            enemy.y += (target.y - enemy.y) / d * step;
        }
    }

    // ===== TOTE ENTGFERNEN =====
    enemies = enemies.filter(e => e.alive);
    villagers = villagers.filter(v => v.alive);
    if (SPLIT_SCREEN) {
        player2Villagers = player2Villagers.filter(v => v.alive);
    }
    npcVillagers = npcVillagers.filter(v => v.alive);
}

function updateTowers(dt) {
    function dist2(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
    }

    // ===== SPIELER 1 TÜRME =====
    buildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction && b.stoneAmmo > 0).forEach(tower => {
        tower.shootCooldown -= dt;
        if (tower.shootCooldown > 0) return;

        const tx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const ty = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const rangeSq = (tower.range * CONFIG.CELL_SIZE) ** 2;

        let closestTarget = null;
        let closestDistSq = Infinity;
        let closestType = null;

        if (SPLIT_SCREEN) {
            // Split-Modus: Spieler 1 schießt auf Spieler 2
            for (let p2v of player2Villagers) {
                if (!p2v.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: p2v.x, y: p2v.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = p2v;
                    closestType = 'player2';
                }
            }
        } else {
            // Einzelmodus: Spieler 1 schießt auf NPC
            for (let nv of npcVillagers) {
                if (!nv.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: nv.x, y: nv.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = nv;
                    closestType = 'npc';
                }
            }
        }

        // Feinde (immer)
        for (let e of enemies) {
            if (!e.alive) continue;
            const d2 = dist2({ x: tx, y: ty }, { x: e.x, y: e.y });
            if (d2 < rangeSq && d2 < closestDistSq) {
                closestDistSq = d2;
                closestTarget = e;
                closestType = 'enemy';
            }
        }

        if (closestTarget) {
            const isNPCVillager = (closestType === 'npc');
            const isPlayer2 = (closestType === 'player2');
            const isEnemy = (closestType === 'enemy');

            if (isNPCVillager && npcPeaceMode === true) {
                npcPeaceMode = false;
                npcPeaceCooldown = 300;
                showTemporaryMessage('🤖 NPC geht in Krieg (Turm getroffen)!', '#ff4444');
                if (window.updateModeDisplay) window.updateModeDisplay();
            }

            tower.stoneAmmo -= 1;
            tower.shootCooldown = tower.baseFireRate || 1.0;

            projectiles.push({
                x: tx,
                y: ty,
                targetX: closestTarget.x,
                targetY: closestTarget.y,
                speed: 300,
                target: closestTarget,
                isNPCVillager: isNPCVillager,
                isPlayer2: isPlayer2,
                isEnemy: isEnemy,
                isPlayerVillager: false,
                shooter: 'player'
            });

            // Doppelschuss
            if (tower.doubleShot) {
                let secondTarget = null;
                let secondDistSq = Infinity;
                let secondType = null;

                if (SPLIT_SCREEN) {
                    for (let p2v of player2Villagers) {
                        if (!p2v.alive || p2v === closestTarget) continue;
                        const d2 = dist2({ x: tx, y: ty }, { x: p2v.x, y: p2v.y });
                        if (d2 < rangeSq && d2 < secondDistSq) {
                            secondDistSq = d2;
                            secondTarget = p2v;
                            secondType = 'player2';
                        }
                    }
                } else {
                    for (let nv of npcVillagers) {
                        if (!nv.alive || nv === closestTarget) continue;
                        const d2 = dist2({ x: tx, y: ty }, { x: nv.x, y: nv.y });
                        if (d2 < rangeSq && d2 < secondDistSq) {
                            secondDistSq = d2;
                            secondTarget = nv;
                            secondType = 'npc';
                        }
                    }
                }

                for (let e of enemies) {
                    if (!e.alive || e === closestTarget) continue;
                    const d2 = dist2({ x: tx, y: ty }, { x: e.x, y: e.y });
                    if (d2 < rangeSq && d2 < secondDistSq) {
                        secondDistSq = d2;
                        secondTarget = e;
                        secondType = 'enemy';
                    }
                }

                if (secondTarget && tower.stoneAmmo > 0) {
                    const isNPCVillager2 = (secondType === 'npc');
                    const isPlayer22 = (secondType === 'player2');
                    const isEnemy2 = (secondType === 'enemy');

                    if (isNPCVillager2 && npcPeaceMode === true) {
                        npcPeaceMode = false;
                        npcPeaceCooldown = 300;
                        showTemporaryMessage('🤖 NPC geht in Krieg (Turm Doppelschuss getroffen)!', '#ff4444');
                        if (window.updateModeDisplay) window.updateModeDisplay();
                    }

                    tower.stoneAmmo -= 1;
                    projectiles.push({
                        x: tx,
                        y: ty,
                        targetX: secondTarget.x,
                        targetY: secondTarget.y,
                        speed: 300,
                        target: secondTarget,
                        isNPCVillager: isNPCVillager2,
                        isPlayer2: isPlayer22,
                        isEnemy: isEnemy2,
                        isPlayerVillager: false,
                        shooter: 'player'
                    });
                }
            }
        }
    });

    // ===== SPIELER 2 TÜRME (NUR SPLIT-MODUS) =====
    if (SPLIT_SCREEN) {
        player2Buildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction && b.stoneAmmo > 0).forEach(tower => {
            tower.shootCooldown -= dt;
            if (tower.shootCooldown > 0) return;

            const tx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const ty = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const rangeSq = (tower.range * CONFIG.CELL_SIZE) ** 2;

            let closestTarget = null;
            let closestDistSq = Infinity;
            let closestType = null;

            // Spieler 2 schießt auf Spieler 1
            for (let pv of villagers) {
                if (!pv.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: pv.x, y: pv.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = pv;
                    closestType = 'player';
                }
            }

            // Feinde (immer)
            for (let e of enemies) {
                if (!e.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: e.x, y: e.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = e;
                    closestType = 'enemy';
                }
            }

            if (closestTarget) {
                const isPlayerVillager = (closestType === 'player');
                const isEnemy = (closestType === 'enemy');

                tower.stoneAmmo -= 1;
                tower.shootCooldown = tower.baseFireRate || 1.0;

                projectiles.push({
                    x: tx,
                    y: ty,
                    targetX: closestTarget.x,
                    targetY: closestTarget.y,
                    speed: 300,
                    target: closestTarget,
                    isNPCVillager: false,
                    isPlayer2: false,
                    isEnemy: isEnemy,
                    isPlayerVillager: isPlayerVillager,
                    shooter: 'player2'
                });
            }
        });
    }

    // ===== NPC TÜRME (NUR EINZELMODUS) =====
    if (!SPLIT_SCREEN) {
        npcBuildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction && b.stoneAmmo > 0).forEach(tower => {
            tower.shootCooldown -= dt;
            if (tower.shootCooldown > 0) return;

            const tx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const ty = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const rangeSq = (tower.range * CONFIG.CELL_SIZE) ** 2;

            let closestTarget = null;
            let closestDistSq = Infinity;
            let closestType = null;

            for (let pv of villagers) {
                if (!pv.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: pv.x, y: pv.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = pv;
                    closestType = 'player';
                }
            }

            for (let e of enemies) {
                if (!e.alive) continue;
                const d2 = dist2({ x: tx, y: ty }, { x: e.x, y: e.y });
                if (d2 < rangeSq && d2 < closestDistSq) {
                    closestDistSq = d2;
                    closestTarget = e;
                    closestType = 'enemy';
                }
            }

            if (closestTarget) {
                const isPlayerVillager = (closestType === 'player');
                const isEnemy = (closestType === 'enemy');

                if (isPlayerVillager && npcPeaceMode === true) {
                    npcPeaceMode = false;
                    npcPeaceCooldown = 300;
                    showTemporaryMessage('🤖 NPC geht in Krieg (NPC-Turm trifft Spieler)!', '#ff4444');
                    if (window.updateModeDisplay) window.updateModeDisplay();
                }

                tower.stoneAmmo -= 1;
                tower.shootCooldown = tower.baseFireRate || 1.0;

                projectiles.push({
                    x: tx,
                    y: ty,
                    targetX: closestTarget.x,
                    targetY: closestTarget.y,
                    speed: 300,
                    target: closestTarget,
                    isNPCVillager: false,
                    isPlayer2: false,
                    isEnemy: isEnemy,
                    isPlayerVillager: isPlayerVillager,
                    shooter: 'npc'
                });
            }
        });
    }
}

function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (!p.target || !p.target.alive) {
            projectiles.splice(i, 1);
            continue;
        }
        p.targetX = p.target.x;
        p.targetY = p.target.y;
        const dx = p.targetX - p.x,
            dy = p.targetY - p.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 10) {
            // ===== TREFFER BEHANDELN =====
            if (p.isNPCVillager) {
                // NPC Einwohner getroffen
                const home = npcBuildings.find(b => b.id === p.target.homeId);
                if (home && home.residents > 0) home.residents -= 1;
                if (p.target.carrying === 'stone' || p.target.hasReservedStone) {
                    npcResources.stone += (p.target.stoneToDeliver || 0);
                    if (p.target.towerTarget) {
                        p.target.towerTarget.reservedStone = Math.max(0, p.target.towerTarget.reservedStone - (p.target.stoneToDeliver || 0));
                    }
                }
                p.target.alive = false;
                createHitEffect(p.targetX, p.targetY, false, false);
                showTemporaryMessage('🏹 NPC-Einwohner von Turm getroffen!', '#ff6b6b');
                markDirty();
            } else if (p.isPlayer2) {
                // Spieler 2 Einwohner getroffen
                if (p.target.carrying === 'stone' || p.target.isDeliveringStone) {
                    player2Resources.stone += (p.target.stoneToDeliver || 0);
                    if (p.target.towerTarget) {
                        p.target.towerTarget.reservedStone = Math.max(0, p.target.towerTarget.reservedStone - (p.target.stoneToDeliver || 0));
                    }
                }
                if (p.target.carrying === 'grain') player2Resources.grain += 1;
                if (p.target.carrying === 'wood') player2Resources.wood += 1;
                if (p.target.resourceTarget) {
                    const node = player2ResourceNodes.find(r => r.id === p.target.resourceTarget.id);
                    if (node && node.claimedBy === p.target.id) node.claimedBy = null;
                    p.target.resourceTarget = null;
                }
                if (p.target.isBuilding && p.target.buildingTarget) {
                    const building = player2Buildings.find(b => b.id === p.target.buildingTarget);
                    if (building && building.isUnderConstruction) {
                        building.builder = null;
                        building.waitingForBuilder = true;
                    }
                    p.target.isBuilding = false;
                    p.target.buildingTarget = null;
                }
                const home = player2Buildings.find(b => b.id === p.target.homeId);
                if (home && home.residents > 0) home.residents -= 1;
                p.target.alive = false;
                createHitEffect(p.targetX, p.targetY, false, false);
                showTemporaryMessage('🏹 Spieler 2 Einwohner von Turm getroffen!', '#ff6b6b');
                markDirty();
            } else if (p.isPlayerVillager) {
                // Spieler 1 Einwohner getroffen
                if (p.target.carrying === 'stone' || p.target.isDeliveringStone) {
                    resources.stone += (p.target.stoneToDeliver || 0);
                    if (p.target.towerTarget) {
                        p.target.towerTarget.reservedStone = Math.max(0, p.target.towerTarget.reservedStone - (p.target.stoneToDeliver || 0));
                    }
                }
                if (p.target.carrying === 'grain') resources.grain += 1;
                if (p.target.carrying === 'wood') resources.wood += 1;
                if (p.target.resourceTarget) {
                    const node = resourceNodes.find(r => r.id === p.target.resourceTarget.id);
                    if (node && node.claimedBy === p.target.id) node.claimedBy = null;
                    p.target.resourceTarget = null;
                }
                if (p.target.isBuilding && p.target.buildingTarget) {
                    const building = buildings.find(b => b.id === p.target.buildingTarget);
                    if (building && building.isUnderConstruction) {
                        building.builder = null;
                        building.waitingForBuilder = true;
                    }
                    p.target.isBuilding = false;
                    p.target.buildingTarget = null;
                }
                killVillager(p.target);
                createHitEffect(p.targetX, p.targetY, false, false);
                showTemporaryMessage('🏹 Dein Einwohner wurde von Turm getroffen!', '#ff6b6b');
                markDirty();
            } else if (p.isEnemy) {
                // Feind getroffen
                p.target.hits += 1;
                if (p.target.hits >= p.target.maxHits) {
                    createHitEffect(p.targetX, p.targetY, p.target.isSuper);
                    p.target.alive = false;
                } else {
                    createHitEffect(p.targetX, p.targetY, false, true);
                }
                markDirty();
            } else {
                // Fallback
                if (p.target.hits !== undefined) {
                    p.target.hits += 1;
                    if (p.target.hits >= p.target.maxHits) {
                        createHitEffect(p.targetX, p.targetY, p.target.isSuper);
                        p.target.alive = false;
                    } else {
                        createHitEffect(p.targetX, p.targetY, false, true);
                    }
                    markDirty();
                }
            }
            projectiles.splice(i, 1);
        } else {
            const step = Math.min(distance, p.speed * dt);
            p.x += (dx / distance) * step;
            p.y += (dy / distance) * step;
        }
    }
}

function createHitEffect(x, y, isSuper = false, isPartial = false) {
    const particles = [];
    const count = isSuper ? 60 : (isPartial ? 15 : 30 + Math.floor(Math.random() * 20));
    const colors = isSuper ? ['#ff00ff', '#ff66ff', '#ff99ff'] : ['#ff0000', '#ff4400', '#ff8800'];
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (isSuper ? 60 : 30) + Math.random() * (isSuper ? 100 : 80);
        particles.push({
            x: x + (Math.random() - 0.5) * 6,
            y: y + (Math.random() - 0.5) * 6,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.3 + Math.random() * 0.4,
            maxLife: 0.3 + Math.random() * 0.4,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
    hitEffects.push({ x, y, particles, life: 0.8, maxLife: 0.8 });
    markDirty();
}

function updateHitEffects(dt) {
    for (let i = hitEffects.length - 1; i >= 0; i--) {
        const effect = hitEffects[i];
        effect.life -= dt;
        for (let p of effect.particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.98;
            p.vy *= 0.98;
            p.life -= dt;
        }
        if (effect.life <= 0) hitEffects.splice(i, 1);
    }
}

// Globale Variable für den letzten NPC-Kriegsstatus (nur für Nachrichten-Spam)
let lastNpcWarState = false;

function isActiveResourceField(gx, gy) {
  for (let node of resourceNodes) { if (node.x === gx && node.y === gy) return true; }
  for (let node of npcResourceNodes) { if (node.x === gx && node.y === gy) return true; }
  const terrainHere = getTerrainType(gx, gy);
  if (terrainHere === -1) return false;
  const allBuildings = [...buildings, ...npcBuildings];
  for (let b of allBuildings) {
    if (b.type !== 'bauer' && b.type !== 'holzfaeller' && b.type !== 'steinmetz') continue;
    const d = Math.hypot(gx - b.gridX, gy - b.gridY);
    if (d <= 1.5 && d > 0) {
      const resourceType = b.type === 'bauer' ? 'grain' : b.type === 'holzfaeller' ? 'wood' : 'stone';
      const terrainMatch = (resourceType === 'grain' && terrainHere === 0) || (resourceType === 'wood' && terrainHere === 1) || (resourceType === 'stone' && terrainHere === 2);
      if (terrainMatch) return true;
    }
  }
  return false;
}

function isPositionValidForNPC(gx, gy, type, isLager = false) {
  if (gx < 1 || gx >= CONFIG.GRID_WIDTH - 1 || gy < 1 || gy >= CONFIG.GRID_HEIGHT - 1) return false;
  if (isCellOccupied(gx, gy)) return false;
  if (isActiveResourceField(gx, gy)) return false;
  if (gameStarted) {
    const isInStartPhase = buildingRestrictionActive;
    const isInPeaceMode = (gameMode === 'peace');
    const isRestrictionActive = isInStartPhase || isInPeaceMode;
    if (isRestrictionActive) {
      for (let b of buildings) {
        if (b.isNPC) continue;
        const distToPlayer = Math.hypot(gx - b.gridX, gy - b.gridY);
        if (distToPlayer < 10) {
          return false;
        }
      }
    }
  }
  const terrainHere = getTerrainType(gx, gy);
  if (terrainHere === -1) return false;
  if (type === 'lager' || type === 'haus' || type === 'wachturm') { if (terrainHere === 1 || terrainHere === 2) return false; }
  if (type === 'bauer' && terrainHere !== 0) return false;
  if (type === 'holzfaeller' && terrainHere !== 1) return false;
  if (type === 'steinmetz' && terrainHere !== 2) return false;
  if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
    const resourceType = type === 'bauer' ? 'grain' : type === 'holzfaeller' ? 'wood' : 'stone';
    if (countResourcesAround(gx, gy, resourceType) < CONFIG.NPC_MIN_RESOURCES) return false;
  }
  if (type === 'bauer' || type === 'holzfaeller' || type === 'steinmetz') {
    for (let b of npcBuildings) {
      if (b.type === type && !b.isUnderConstruction) {
        const d = Math.hypot(gx - b.gridX, gy - b.gridY);
        if (d <= 2) return false;
      }
    }
  }
  if (isLager) { for (let b of npcBuildings) { if (b.type === 'lager' && Math.hypot(gx - b.gridX, gy - b.gridY) < CONFIG.NPC_MIN_LAGER_DIST) return false; } }
  return true;
}

function findWarPosition(type) {
  const towers = npcBuildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction);
  if (towers.length > 0) {
    let bestPos = null, bestScore = -Infinity;
    let searchRadius = CONFIG.TOWER_RANGE;
    const maxRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);
    while (searchRadius <= maxRadius) {
      for (let tower of towers) {
        for (let attempt = 0; attempt < 50; attempt++) {
          const gx = tower.gridX - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          const gy = tower.gridY - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          if (gx < 0 || gx >= CONFIG.GRID_WIDTH || gy < 0 || gy >= CONFIG.GRID_HEIGHT) continue;
          if (!isPositionValidForNPC(gx, gy, type, false)) continue;
          const d = Math.hypot(gx - tower.gridX, gy - tower.gridY);
          let score = 50 - d;
          let nearbyTowers = 0;
          for (let t2 of towers) { if (Math.hypot(gx - t2.gridX, gy - t2.gridY) <= CONFIG.TOWER_RANGE) nearbyTowers++; }
          score += nearbyTowers * 10;
          if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
        }
      }
      if (bestPos) return bestPos;
      searchRadius += 5;
    }
  }
  return findBestNPCPosition(type, false);
}

function findStandardPosition(type, isLager) {
  let bestPos = null, bestScore = -Infinity;
  if (npcBuildings.length === 0) return null;
  const npcPositions = npcBuildings.map(b => ({ x: b.gridX, y: b.gridY }));
  const maxSearchRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);
  if (type === 'haus') {
    const resourceBuildings = npcBuildings.filter(b => (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && !b.isUnderConstruction);
    const existingHouses = npcBuildings.filter(b => b.type === 'haus' && !b.isUnderConstruction);
    let searchRadius = CONFIG.NPC_MAX_BUILD_DIST;
    while (searchRadius <= maxSearchRadius) {
      for (let center of npcPositions) {
        for (let attempt = 0; attempt < 50; attempt++) {
          const gx = center.x - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          const gy = center.y - searchRadius + Math.floor(Math.random() * searchRadius * 2);
          if (!isPositionValidForNPC(gx, gy, type, false)) continue;
          let score = 0;
          for (let rb of resourceBuildings) {
            const d = Math.hypot(gx - rb.gridX, gy - rb.gridY);
            if (d <= 1) { score += 30; let houseAdjacent = false; for (let h of existingHouses) { if (Math.hypot(rb.gridX - h.gridX, rb.gridY - h.gridY) <= 1) { houseAdjacent = true; break; } } if (!houseAdjacent) score += 20; }
            else if (d <= 2) { score += 15; } else if (d <= 3) { score += 5; }
          }
          for (let b of npcBuildings) { if (b.type === 'lager' && Math.hypot(gx - b.gridX, gy - b.gridY) <= 3) score += 10; }
          let minDist = Infinity; for (let b of npcBuildings) { const d = Math.hypot(gx - b.gridX, gy - b.gridY); if (d < minDist) minDist = d; }
          if (minDist <= 1) score += 15; if (minDist <= 2) score += 10;
          if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
        }
      }
      if (bestPos) return bestPos;
      searchRadius += 5;
    }
    return null;
  }
  let searchRadius = isLager ? 5 : CONFIG.NPC_MAX_BUILD_DIST;
  while (searchRadius <= maxSearchRadius) {
    for (let center of npcPositions) {
      for (let attempt = 0; attempt < 50; attempt++) {
        const gx = center.x - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        const gy = center.y - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        if (!isPositionValidForNPC(gx, gy, type, isLager)) continue;
        let minDistToNPC = Infinity, totalDist = 0, houseCount = 0;
        for (let b of npcBuildings) { const d = Math.hypot(gx - b.gridX, gy - b.gridY); if (d < minDistToNPC) minDistToNPC = d; if (b.type === 'haus' && d <= 2) houseCount++; totalDist += d; }
        const avgDist = totalDist / npcBuildings.length;
        let score = (10 - avgDist) * 10;
        if (isLager) { score += (15 - avgDist) * 5; }
        else if (type === 'wachturm') { let coveredBuildings = 0; for (let b of npcBuildings) { if (b.type === 'wachturm') continue; if (Math.hypot(gx - b.gridX, gy - b.gridY) <= CONFIG.TOWER_RANGE) coveredBuildings++; } score += coveredBuildings * 12; if (minDistToNPC <= 2) score += 15; if (minDistToNPC <= 3) score += 10; }
        else { const resourceType = type === 'bauer' ? 'grain' : type === 'holzfaeller' ? 'wood' : 'stone'; score += countResourcesAround(gx, gy, resourceType) * 20; if (minDistToNPC <= 1) score += 25; if (minDistToNPC <= 2) score += 15; if (minDistToNPC <= 3) score += 10; }
        if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
      }
    }
    if (bestPos) return bestPos;
    searchRadius += 5;
  }
  return null;
}

function findBestTowerPosition() {
  let bestPos = null; let bestScore = -Infinity;
  if (npcBuildings.length === 0) return null;
  const buildingsToProtect = npcBuildings.filter(b => b.type !== 'wachturm' && !b.isUnderConstruction);
  const resourceNodesToProtect = npcResourceNodes.filter(n => n.ready || n.timer > 0);
  const protectionSet = new Set();
  for (let b of buildingsToProtect) {
    for (let dx = -3; dx <= 3; dx++) { for (let dy = -3; dy <= 3; dy++) { const nx = b.gridX + dx, ny = b.gridY + dy; if (nx >= 0 && nx < CONFIG.GRID_WIDTH && ny >= 0 && ny < CONFIG.GRID_HEIGHT) { protectionSet.add(`${nx},${ny}`); } } }
  }
  for (let n of resourceNodesToProtect) {
    for (let dx = -3; dx <= 3; dx++) { for (let dy = -3; dy <= 3; dy++) { const nx = n.x + dx, ny = n.y + dy; if (nx >= 0 && nx < CONFIG.GRID_WIDTH && ny >= 0 && ny < CONFIG.GRID_HEIGHT) { protectionSet.add(`${nx},${ny}`); } } }
  }
  const allPoints = Array.from(protectionSet).map(s => { const [gx, gy] = s.split(',').map(Number); return { gx, gy }; });
  const existingTowers = npcBuildings.filter(b => b.type === 'wachturm' && !b.isUnderConstruction);
  const coverageMap = new Map();
  for (let pt of allPoints) { let covered = 0; for (let tower of existingTowers) { if (Math.hypot(pt.gx - tower.gridX, pt.gy - tower.gridY) <= CONFIG.TOWER_RANGE) covered++; } coverageMap.set(`${pt.gx},${pt.gy}`, covered); }
  let minCoverage = Infinity; for (let covered of coverageMap.values()) { if (covered < minCoverage) minCoverage = covered; } if (minCoverage === Infinity) minCoverage = 0;
  const npcPositions = npcBuildings.map(b => ({ x: b.gridX, y: b.gridY }));
  const maxSearchRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);
  let searchRadius = CONFIG.NPC_MAX_BUILD_DIST;
  while (searchRadius <= maxSearchRadius) {
    for (let center of npcPositions) {
      for (let attempt = 0; attempt < 80; attempt++) {
        const gx = center.x - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        const gy = center.y - searchRadius + Math.floor(Math.random() * searchRadius * 2);
        if (!isPositionValidForNPC(gx, gy, 'wachturm', false)) continue;
        let newCoveredMin = 0;
        for (let pt of allPoints) { const current = coverageMap.get(`${pt.gx},${pt.gy}`) || 0; if (current === minCoverage && Math.hypot(gx - pt.gx, gy - pt.gy) <= CONFIG.TOWER_RANGE) newCoveredMin++; }
        let totalCovered = 0;
        for (let pt of allPoints) { if (Math.hypot(gx - pt.gx, gy - pt.gy) <= CONFIG.TOWER_RANGE) totalCovered++; }
        let score = newCoveredMin * 100 + totalCovered * 10;
        let minDistToNPC = Infinity;
        for (let b of npcBuildings) { const d = Math.hypot(gx - b.gridX, gy - b.gridY); if (d < minDistToNPC) minDistToNPC = d; }
        if (minDistToNPC <= 2) score += 20;
        if (minDistToNPC <= 3) score += 10;
        if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
      }
    }
    if (bestPos) return bestPos;
    searchRadius += 5;
  }
  return null;
}

function findBestNPCPosition(type, isLager = false) {
  if (type === 'wachturm') return findBestTowerPosition();
  return findStandardPosition(type, isLager);
}

function getNPCBuildingCounts() {
  const counts = { haus: 0, bauer: 0, holzfaeller: 0, steinmetz: 0, wachturm: 0, lager: 0 };
  for (let b of npcBuildings) { if (counts[b.type] !== undefined) counts[b.type]++; }
  return counts;
}

function npcNeedsLager() {
  const resourceBuildings = npcBuildings.filter(b => (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && !b.isUnderConstruction);
  const allLagers = npcBuildings.filter(b => b.type === 'lager' && !b.isUnderConstruction);
  if (allLagers.length === 0) return true;
  for (let res of resourceBuildings) {
    let nearestLagerDist = Infinity;
    for (let lager of allLagers) { const d = Math.hypot(res.gridX - lager.gridX, res.gridY - lager.gridY); if (d < nearestLagerDist) nearestLagerDist = d; }
    if (nearestLagerDist > 25) return true;
  }
  return false;
}

function findLagerPosition() {
  const resourceBuildings = npcBuildings.filter(b => (b.type === 'bauer' || b.type === 'holzfaeller' || b.type === 'steinmetz') && !b.isUnderConstruction);
  const allLagers = npcBuildings.filter(b => b.type === 'lager' && !b.isUnderConstruction);
  if (resourceBuildings.length === 0) return null;
  if (allLagers.length === 0) { return findStandardPositionNear(resourceBuildings[0].gridX, resourceBuildings[0].gridY, 'lager', true); }
  let farthestRes = null; let farthestDist = 0;
  for (let res of resourceBuildings) {
    let nearestDist = Infinity;
    for (let lager of allLagers) { const d = Math.hypot(res.gridX - lager.gridX, res.gridY - lager.gridY); if (d < nearestDist) nearestDist = d; }
    if (nearestDist > farthestDist && nearestDist > 25) { farthestDist = nearestDist; farthestRes = res; }
  }
  if (!farthestRes) return null;
  const startRadius = Math.max(15, Math.floor(farthestDist / 2));
  return findStandardPositionNearWithRadius(farthestRes.gridX, farthestRes.gridY, 'lager', true, startRadius);
}

function findStandardPositionNear(centerX, centerY, type, isLager) {
  return findStandardPositionNearWithRadius(centerX, centerY, type, isLager, 10);
}

function findStandardPositionNearWithRadius(centerX, centerY, type, isLager, startRadius) {
  let bestPos = null; let bestScore = -Infinity;
  const maxSearchRadius = Math.max(CONFIG.GRID_WIDTH, CONFIG.GRID_HEIGHT);
  let searchRadius = startRadius;
  while (searchRadius <= maxSearchRadius) {
    for (let attempt = 0; attempt < 50; attempt++) {
      const gx = centerX - searchRadius + Math.floor(Math.random() * searchRadius * 2);
      const gy = centerY - searchRadius + Math.floor(Math.random() * searchRadius * 2);
      if (!isPositionValidForNPC(gx, gy, type, isLager)) continue;
      const d = Math.hypot(gx - centerX, gy - centerY);
      let score = 50 - d;
      let minDist = Infinity;
      for (let b of npcBuildings) { const bd = Math.hypot(gx - b.gridX, gy - b.gridY); if (bd < minDist) minDist = bd; }
      if (minDist <= 2) score += 20;
      if (minDist <= 4) score += 10;
      if (score > bestScore) { bestScore = score; bestPos = { x: gx, y: gy }; }
    }
    if (bestPos) return bestPos;
    searchRadius += 10;
  }
  return null;
}

function npcCanAfford(type) {
  const free = getNPCFreeVillagers();
  switch(type) {
    case 'haus': return npcResources.wood >= 3;
    case 'lager': return npcResources.wood >= 10 && npcResources.stone >= 10;
    case 'bauer': return npcResources.wood >= 5;
    case 'holzfaeller': return free >= 2;
    case 'steinmetz': return npcResources.wood >= 5 && free >= 2;
    case 'wachturm': return npcResources.wood >= 15;
    default: return false;
  }
}

function npcCanAffordUpgrade(building) {
  const { cost } = getUpgradeCostAndEffect(building);
  return npcResources.wood >= cost.wood && npcResources.stone >= cost.stone;
}

function npcUpgradeBuilding(building) {
  const { cost, effect } = getUpgradeCostAndEffect(building);
  if (npcResources.wood < cost.wood || npcResources.stone < cost.stone) return false;
  npcResources.wood -= cost.wood;
  npcResources.stone -= cost.stone;
  
  const oldLevel = building.level;
  building.level += 1;
  
  if (building.type === 'bauer' || building.type === 'holzfaeller' || building.type === 'steinmetz') {
    building.maxProductionTime = building.baseMaxProductionTime / building.level;
    const fields = building.type === 'bauer' ? getBauerFields(building) : building.type === 'holzfaeller' ? getHolzfaellerFields(building) : getSteinmetzFields(building);
    const fieldSet = new Set(fields.map(f => f.x + ',' + f.y));
    for (let node of npcResourceNodes) {
      const key = node.x + ',' + node.y;
      if (fieldSet.has(key) && node.type === building.productionType) {
        const progress = node.timer / node.maxTimer;
        node.maxTimer = building.maxProductionTime;
        node.timer = progress * node.maxTimer;
      }
    }
  }
  
  if (building.type === 'wachturm') {
    if (effect.fireRate) building.baseFireRate = 1.0 / effect.fireRate;
    if (effect.doubleShot) building.doubleShot = true;
    building.maxStoneAmmo += 3;
    if (oldLevel === 2) {
      building.range += 1;
    }
  } else if (building.type === 'haus') {
    building.maxResidents = effect.residents || 8;
  }
  markDirty();
  return true;
}

function npcDeductCost(type) {
  switch(type) {
    case 'haus': npcResources.wood -= 3; break;
    case 'lager': npcResources.wood -= 10; npcResources.stone -= 10; break;
    case 'bauer': npcResources.wood -= 5; break;
    case 'holzfaeller': break;
    case 'steinmetz': npcResources.wood -= 5; break;
    case 'wachturm': npcResources.wood -= 15; break;
  }
  let einwohnerKosten = 0;
  if (type === 'holzfaeller') einwohnerKosten = 2;
  else if (type === 'steinmetz') einwohnerKosten = 2;
  if (einwohnerKosten > 0) npcRemoveFreeVillagers(einwohnerKosten);
  markDirty();
}

function npcRemoveFreeVillagers(count) {
  let removed = 0;
  for (let v of npcVillagers) {
    if (v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding && removed < count) {
      v.alive = false;
      const home = npcBuildings.find(b => b.id === v.homeId);
      if (home && home.residents > 0) home.residents -= 1;
      removed++;
    }
  }
  npcVillagers = npcVillagers.filter(v => v.alive);
  markDirty();
}

function initNPC() {
  if (npcStarted) return;
  if (!gameStarted) return;
  const playerLager = buildings.find(b => b.type === 'lager');
  const playerHaus = buildings.find(b => b.type === 'haus');
  if (!playerLager || !playerHaus) return;
  
  npcResources.grain = 10; 
  npcResources.wood = 10; 
  npcResources.stone = 0;
  
  let startX, startY; 
  let found = false;
  for (let attempt = 0; attempt < 200; attempt++) {
    const corners = [
      { x: 5 + Math.floor(Math.random() * 15), y: 5 + Math.floor(Math.random() * 15) }, 
      { x: CONFIG.GRID_WIDTH - 5 - Math.floor(Math.random() * 15), y: 5 + Math.floor(Math.random() * 15) }, 
      { x: 5 + Math.floor(Math.random() * 15), y: CONFIG.GRID_HEIGHT - 5 - Math.floor(Math.random() * 15) }, 
      { x: CONFIG.GRID_WIDTH - 5 - Math.floor(Math.random() * 15), y: CONFIG.GRID_HEIGHT - 5 - Math.floor(Math.random() * 15) }
    ];
    const corner = corners[Math.floor(Math.random() * corners.length)]; 
    startX = corner.x; 
    startY = corner.y;
    if (!isCellOccupied(startX, startY) && 
        !isActiveResourceField(startX, startY) && 
        Math.hypot(startX - playerLager.gridX, startY - playerLager.gridY) > CONFIG.NPC_START_DIST) { 
      found = true; 
      break; 
    }
  }
  if (!found) { 
    for (let attempt = 0; attempt < 100; attempt++) { 
      startX = 5 + Math.floor(Math.random() * (CONFIG.GRID_WIDTH - 10)); 
      startY = 5 + Math.floor(Math.random() * (CONFIG.GRID_HEIGHT - 10)); 
      if (!isCellOccupied(startX, startY) && 
          !isActiveResourceField(startX, startY) && 
          Math.hypot(startX - playerLager.gridX, startY - playerLager.gridY) > CONFIG.NPC_START_DIST) { 
        found = true; 
        break; 
      } 
    } 
  }
  if (!found) { 
    startX = 70; 
    startY = 70; 
  }
  
  npcStartPosition = { x: startX, y: startY };
  
  const lager = new Building(nextBuildingId++, 'lager', startX, startY, true); 
  lager.isUnderConstruction = false; 
  lager.constructionProgress = 1; 
  npcBuildings.push(lager);
  
  const haus = new Building(nextBuildingId++, 'haus', startX + 1, startY, true); 
  haus.isUnderConstruction = false; 
  haus.constructionProgress = 1; 
  haus.residents = 6;
  haus.maxResidents = 6; 
  npcBuildings.push(haus);
  
  for (let i = 0; i < 6; i++) {
    const v = new Villager(nextVillagerId++, haus.id, true); 
    const cx = haus.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 + (Math.random() - 0.5) * 10;
    const cy = haus.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 + (Math.random() - 0.5) * 10;
    v.x = cx; 
    v.y = cy; 
    v.targetX = cx; 
    v.targetY = cy; 
    v.npcHomeLager = lager; 
    npcVillagers.push(v);
  }
  
  npcStarted = true; 
  showTemporaryMessage('🤖 NPC-Siedlung mit 6 Einwohnern gestartet!', '#9b59b6');
  markDirty();
}

function npcQuotasMet(houses) {
  const counts = getNPCBuildingCounts();
  const farms = counts.bauer || 0;
  const woodcutters = counts.holzfaeller || 0;
  const stonemasons = counts.steinmetz || 0;
  const towers = counts.wachturm || 0;
  return farms >= Math.ceil(houses * 0.33) && woodcutters >= Math.ceil(houses * 0.83) && stonemasons >= Math.ceil(houses * 0.67) && towers >= Math.ceil(houses * 0.67);
}

function updateNPC(dt) {
  initNPC();
  if (!npcStarted) return;
  
  const isNpcAtWar = !npcPeaceMode || npcPeaceCooldown > 0;
  if (isNpcAtWar && gameMode === 'peace') {
    gameMode = 'war';
    showTemporaryMessage('⚔️ NPC hat den Krieg erklärt!', '#ff4444');
    if (window.updateModeDisplay) window.updateModeDisplay();
  }
  
  const npcPopulation = npcVillagers.filter(v => v.alive).length;
  const warThreshold = npcHardMode ? WAR_POPULATION_THRESHOLD : CONFIG.EASY_MODE_WAR_POPULATION_THRESHOLD;
  const peaceDuration = npcHardMode ? PEACE_DURATION : CONFIG.EASY_MODE_PEACE_DURATION;
  const npcBuildInterval = npcHardMode ? CONFIG.NPC_BUILD_INTERVAL : CONFIG.EASY_MODE_NPC_BUILD_INTERVAL;
  
  if (!npcHardMode && npcHouseBuildCooldown) {
    npcHouseBuildTimer += dt;
    if (npcHouseBuildTimer >= HOUSE_BUILD_COOLDOWN) {
      npcHouseBuildCooldown = false;
      npcHouseBuildTimer = 0;
    }
  }
  
  if (npcPeaceMode) {
    npcPeaceTimer += dt;
    if (npcPeaceTimer >= peaceDuration) {
      npcPeaceMode = true;
    }
  }
  
  // === NUR BEIM ÜBERGANG VON FRIEDEN ZU KRIEG DIE NACHRICHT ANZEIGEN ===
  const currentWarState = (npcPopulation >= warThreshold);
  if (currentWarState && !lastNpcWarState) {
    // Übergang von Frieden zu Krieg
    npcPeaceMode = false;
    if (npcHardMode) {
      showTemporaryMessage('🤖 NPC hat 250 Einwohner - IMMER KRIEG!', '#ff4444');
    } else {
      showTemporaryMessage('🤖 NPC hat 500 Einwohner - IMMER KRIEG!', '#ff4444');
    }
    lastNpcWarState = true;
  } else if (!currentWarState && lastNpcWarState) {
    // Übergang von Krieg zu Frieden (falls die Bevölkerung wieder unter die Schwelle fällt)
    lastNpcWarState = false;
  }
  
  // Wenn die Grenze erreicht ist, Kriegsmodus aktivieren (aber ohne erneute Nachricht)
  if (npcPopulation >= warThreshold) {
    npcPeaceMode = false;
  }
  
  if (npcWarMode) {
    npcWarModeTimer -= dt;
    if (npcWarModeTimer <= 0) { 
      npcWarMode = false; 
      npcWarModeTimer = 0; 
      npcWarBuildIndex = 0; 
    }
  }
  
  if (npcWarMode) {
    npcTimer += dt;
    if (npcTimer < CONFIG.NPC_BUILD_INTERVAL) return;
    npcTimer = 0;
    const nextType = npcWarBuildOrder[npcWarBuildIndex % npcWarBuildOrder.length];
    if (npcCanAfford(nextType)) {
      const pos = findWarPosition(nextType);
      if (pos) {
        npcDeductCost(nextType);
        const b = new Building(nextBuildingId++, nextType, pos.x, pos.y, true);
        b.isUnderConstruction = true; b.constructionTimer = 0; b.constructionProgress = 0; b.waitingForBuilder = true;
        npcBuildings.push(b); assignNpcBuilderToConstruction(b.id);
        npcWarBuildIndex++;
        if (npcWarBuildIndex >= npcWarBuildOrder.length) npcWarBuildIndex = 0;
        markDirty();
      } else {
        // Kein Platz – einfach überspringen, kein Cooldown, kein Friedens-Wechsel
        npcWarBuildIndex++;
        if (npcWarBuildIndex >= npcWarBuildOrder.length) npcWarBuildIndex = 0;
      }
    }
    // KEIN FRIEDENS-WECHSEL BEI FEHLENDEN RESSOURCEN – NPC BLEIBT IM KRIEG
    return;
  }
  
  // ===== FRIEDENSMODUS: NORMALER BAU (unverändert) =====
  npcTimer += dt;
  if (npcTimer < npcBuildInterval) return;
  npcTimer = 0;
  const counts = getNPCBuildingCounts();
  const houses = Math.max(1, counts.haus || 0);
  const farms = counts.bauer || 0;
  const woodcutters = counts.holzfaeller || 0;
  const stonemasons = counts.steinmetz || 0;
  const towers = counts.wachturm || 0;
  const needs = [];
  let builtTower = false;
  const targetWood = Math.max(2, Math.ceil(houses * 0.83));
  const targetStone = Math.max(1, Math.ceil(houses * 0.67));
  const targetTowers = Math.max(1, Math.ceil(houses * 0.67));
  const GRAIN_QUOTA = 0.45;
  const targetFarms = Math.max(1, Math.ceil(houses * GRAIN_QUOTA));
  
  if (npcHardMode) {
    if (npcQuotasMet(houses) && npcCanAfford('haus')) {
      if (npcResources.wood >= 6) { needs.push({ type: 'haus', priority: 10 }); needs.push({ type: 'haus', priority: 9 }); }
    } else {
      if (npcNeedsLager() && npcCanAfford('lager')) needs.push({ type: 'lager', priority: 30 });
      if (farms === 0 && npcCanAfford('bauer')) needs.push({ type: 'bauer', priority: 25 });
      if (woodcutters < 2 && npcCanAfford('holzfaeller')) needs.push({ type: 'holzfaeller', priority: 23 });
      if (woodcutters >= 2 && stonemasons === 0 && npcCanAfford('steinmetz')) needs.push({ type: 'steinmetz', priority: 22 });
      if (woodcutters >= 2 && towers === 0 && npcCanAfford('wachturm')) needs.push({ type: 'wachturm', priority: 21 });
      if (woodcutters < targetWood && npcCanAfford('holzfaeller')) needs.push({ type: 'holzfaeller', priority: 18 });
      if (stonemasons < targetStone && npcCanAfford('steinmetz')) needs.push({ type: 'steinmetz', priority: 17 });
      if (towers < targetTowers && npcCanAfford('wachturm')) needs.push({ type: 'wachturm', priority: 19 });
      if (farms < targetFarms && npcCanAfford('bauer')) {
        const priority = 20;
        needs.push({ type: 'bauer', priority: priority });
      }
    }
  } else {
    if (npcNeedsLager() && npcCanAfford('lager')) needs.push({ type: 'lager', priority: 30 });
    if (farms === 0 && npcCanAfford('bauer')) needs.push({ type: 'bauer', priority: 25 });
    if (woodcutters < 2 && npcCanAfford('holzfaeller')) needs.push({ type: 'holzfaeller', priority: 23 });
    if (woodcutters >= 2 && stonemasons === 0 && npcCanAfford('steinmetz')) needs.push({ type: 'steinmetz', priority: 22 });
    if (woodcutters >= 2 && towers === 0 && npcCanAfford('wachturm')) needs.push({ type: 'wachturm', priority: 21 });
    if (woodcutters < targetWood && npcCanAfford('holzfaeller')) needs.push({ type: 'holzfaeller', priority: 18 });
    if (stonemasons < targetStone && npcCanAfford('steinmetz')) needs.push({ type: 'steinmetz', priority: 17 });
    if (towers < targetTowers && npcCanAfford('wachturm')) needs.push({ type: 'wachturm', priority: 19 });
    if (farms < targetFarms && npcCanAfford('bauer')) needs.push({ type: 'bauer', priority: 16 });
    if (needs.length === 0 && npcQuotasMet(houses) && npcCanAfford('haus')) { 
      if (!npcHouseBuildCooldown) {
        needs.push({ type: 'haus', priority: 10 });
      }
    }
  }
  needs.sort((a, b) => b.priority - a.priority);
  for (let need of needs) {
    if (!npcCanAfford(need.type)) continue;
    let pos;
    if (need.type === 'lager') { pos = findLagerPosition ? findLagerPosition() : findStandardPosition(need.type, true); }
    else { pos = findBestNPCPosition(need.type, false); }
    if (pos) {
      npcDeductCost(need.type);
      const b = new Building(nextBuildingId++, need.type, pos.x, pos.y, true);
      b.isUnderConstruction = true; b.constructionTimer = 0; b.constructionProgress = 0; b.waitingForBuilder = true;
      npcBuildings.push(b); assignNpcBuilderToConstruction(b.id);
      if (need.type === 'wachturm') builtTower = true;
      if (!npcHardMode && need.type === 'haus') {
        npcHouseBuildCooldown = true;
        npcHouseBuildTimer = 0;
      }
      markDirty();
      break;
    }
  }
  if (builtTower) {
    const now = performance.now() / 1000;
    if (now - npcLastUpgradeTime >= 600) {
      const upgradeableTypes = ['steinmetz', 'wachturm', 'bauer', 'holzfaeller', 'haus', 'lager'];
      for (let type of upgradeableTypes) {
        const buildingsOfType = npcBuildings.filter(b => b.type === type && !b.isUnderConstruction && b.level < 3);
        for (let b of buildingsOfType) { if (npcCanAffordUpgrade(b)) { npcUpgradeBuilding(b); npcLastUpgradeTime = now; break; } }
      }
    }
  }
  
  if (npcPeaceCooldown > 0) {
    npcPeaceCooldown -= dt;
    if (npcPeaceCooldown <= 0) {
      npcPeaceCooldown = 0;
      const npcPopulationNow = npcVillagers.filter(v => v.alive).length;
      const warThresholdNow = npcHardMode ? WAR_POPULATION_THRESHOLD : CONFIG.EASY_MODE_WAR_POPULATION_THRESHOLD;
      if (npcPopulationNow < warThresholdNow) {
        npcPeaceMode = true;
        showTemporaryMessage('🕊️ NPC kehrt in den Frieden zurück (5 Min. abgelaufen)', '#44ff44');
        if (gameMode === 'war') {
          gameMode = 'peace';
          showTemporaryMessage('🕊️ Spieler kehrt in den Frieden zurück', '#44ff44');
        }
      } else {
        npcPeaceMode = false;
        showTemporaryMessage('☠️ NPC bleibt im Krieg (Bevölkerung zu hoch)', '#ff4444');
      }
      if (window.updateModeDisplay) window.updateModeDisplay();
    }
  }
}

// =========================================================================
//  MODUL 17: GAME OVER (für 2 Spieler erweitert)
//  NPC bleibt unverändert - wird im Split-Modus ignoriert
// =========================================================================

function checkGameOver() {
    // Wenn weitergespielt wird, keine Game-Over-Prüfung mehr
    if (continueAfterVictory) return;
    if (gameOver) return;

    if (SPLIT_SCREEN) {
        checkGameOverSplit();
    } else {
        checkGameOverSingle();
    }
}

// ===== EINZELMODUS: Spieler vs NPC (UNVERÄNDERT) =====
function checkGameOverSingle() {
    if (!npcStarted) return;
    if (gameOver && !continueAfterVictory) return;

    // Spieler hat kein Lager mehr
    const playerHasLager = buildings.some(b => b.type === 'lager');
    if (!playerHasLager && buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
        document.getElementById('gameOverSub').textContent = 'Kein Lager - Deine Siedlung ist zusammengebrochen!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // NPC hat kein Lager mehr
    const npcHasLager = npcBuildings.some(b => b.type === 'lager');
    if (!npcHasLager && npcBuildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
        document.getElementById('gameOverSub').textContent = 'NPC hat kein Lager - Du hast gewonnen!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle NPC-Gebäude erobert
    if (npcBuildings.length === 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
        document.getElementById('gameOverSub').textContent = 'Du hast alle NPC-Gebäude erobert!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle Spieler-Gebäude zerstört
    if (buildings.length === 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
        document.getElementById('gameOverSub').textContent = 'Deine Siedlung wurde vollständig zerstört!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }
}

// ===== SPLIT-MODUS: Spieler 1 vs Spieler 2 =====
function checkGameOverSplit() {
    if (gameOver && !continueAfterVictory) return;

    const p1HasLager = buildings.some(b => b.type === 'lager');
    const p2HasLager = player2Buildings.some(b => b.type === 'lager');

    // Spieler 1 hat kein Lager mehr
    if (!p1HasLager && buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 2 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 1 hat kein Lager - Spieler 2 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Spieler 2 hat kein Lager mehr
    if (!p2HasLager && player2Buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 1 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 2 hat kein Lager - Spieler 1 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Beide haben kein Lager mehr (Unentschieden)
    if (!p1HasLager && !p2HasLager) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '⚖️ UNENTSCHIEDEN!';
        document.getElementById('gameOverSub').textContent = 'Beide Spieler haben kein Lager mehr!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle Gebäude von Spieler 1 zerstört
    if (buildings.length === 0 && player2Buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 2 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 1 hat keine Gebäude mehr - Spieler 2 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Alle Gebäude von Spieler 2 zerstört
    if (player2Buildings.length === 0 && buildings.length > 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SPIELER 1 GEWINNT!';
        document.getElementById('gameOverSub').textContent = 'Spieler 2 hat keine Gebäude mehr - Spieler 1 siegt!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }

    // Beide haben keine Gebäude mehr (Unentschieden)
    if (buildings.length === 0 && player2Buildings.length === 0) {
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '⚖️ UNENTSCHIEDEN!';
        document.getElementById('gameOverSub').textContent = 'Beide Spieler haben keine Gebäude mehr!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
    }
}
