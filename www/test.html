function getNeededBuildersSpieler() {
  let needed = 0;
  for (let b of buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleArrival(v, home) {
  if (v.state === 'movingToResource' && v.resourceTarget) {
    const node = cachedPlayerResourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.ready && node.claimedBy === v.id) {
      // Ressource abholen
      if (node.type === 'grain') resources.grain += 1;
      else if (node.type === 'wood') resources.wood += 1;
      else if (node.type === 'stone') resources.stone += 1;
      
      // NODE ENTFERNEN - jetzt erst wenn abgeholt!
      const idx = resourceNodes.indexOf(node);
      if (idx !== -1) { 
        resourceNodes.splice(idx, 1); 
        // Cache aktualisieren
        refreshPlayerResourceCache();
        markDirty();
      }
      v.carrying = node.type; 
      v.deliveryTarget = null;
    } else {
      // Node nicht mehr verfügbar oder nicht ready -> zurücksetzen
      v.state = 'idle';
      v.resourceTarget = null;
      v.hasTask = false;
      // Wenn node existiert aber nicht ready, Claim aufheben
      if (node && node.claimedBy === v.id) {
        node.claimedBy = null;
      }
      return;
    }
    v.resourceTarget = null;
    v.state = 'returningHome';
    
    // === LAGER SUCHEN - CACHE AKTUALISIEREN ===
    refreshLagerCache();
    
    // === NUR ZUM LAGER GEHEN ===
    let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
    
    // === FALLBACK: DIREKT IN BUILDINGS SUCHEN ===
    if (!lager) {
      // Direkt in buildings nach einem Lager suchen
      for (let b of buildings) {
        if (b.type === 'lager') {
          lager = b;
          break;
        }
      }
    }
    
    if (lager) {
      v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
      v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
      // === KEIN LAGER = GAME OVER ===
      v.alive = false;
      v.carrying = null;
      v.state = 'idle';
      v.hasTask = false;
      showTemporaryMessage('💀 KEIN LAGER! DEINE SIEDLUNG IST ZUSAMMENGEBROCHEN!', '#ff0000');
      gameOver = true;
      document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
      document.getElementById('gameOverSub').textContent = 'Kein Lager - Deine Siedlung ist zusammengebrochen!';
      document.getElementById('gameOverOverlay').style.display = 'flex';
      return;
    }
  } else if (v.state === 'returningHome' && v.carrying) {
    // Wenn der Einwohner am Lager ankommt, Ressource abgeben
    v.carrying = null; 
    v.state = 'idle'; 
    v.resourceTarget = null; 
    v.hasTask = false; 
    v.deliveryTarget = null;
    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
    v.targetX = homePos.x; 
    v.targetY = homePos.y;
  }
}

let lastPlayerVillagerHitTime = 0;

// =========================================================================
//  MODUL 12c: EINWOHNER-KI (Spieler) - MIT GETREIDE-PRIORITÄT – KORRIGIERT
//  FIX: movingToCapture State wurde nicht behandelt
// =========================================================================

function updateVillagers(dt) {
    // === NEU: Caches VOR der Aufgabenverteilung aktualisieren ===
    refreshPlayerVillagerCache();
    refreshPlayerResourceCache();
    refreshLagerCache();

    // === NEU: Tote Einwohner aus Ressourcen-Nodes entfernen ===
    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // === NEU: Tote Einwohner aus Turm-Reservierungen entfernen ===
    for (let tower of buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    // === NEU: Tote Einwohner aus Bauaufträgen entfernen ===
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.isNPC) continue;
        const building = buildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = villagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // === NEU: Hängengebliebene Capture-Aufgaben bereinigen ===
    for (let v of villagers) {
        if (v.alive && v.state === 'movingToCapture') {
            let targetBuilding = null;
            // Prüfe NPC Gebäude
            if (!SPLIT_SCREEN) {
                targetBuilding = npcBuildings.find(b => b.id === v.captureTargetId);
            }
            // Prüfe Spieler 2 Gebäude (Split-Modus)
            if (!targetBuilding && SPLIT_SCREEN) {
                targetBuilding = player2Buildings.find(b => b.id === v.captureTargetId);
            }
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    // ===== AB HIER DER BESTEHENDE CODE =====
    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) node.claimedBy = null;
    }

    villagers = cachedPlayerVillagers.slice();

    // Stein-Overflow korrigieren
    for (let building of buildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            resources.stone += overflow;
        }
    }

    const neededBuilders = getNeededBuildersSpieler();
    const freeForTasks = cachedPlayerFreeVillagers.slice(neededBuilders);

    const now = performance.now() / 1000;
    const stonePriority = (now - lastPlayerVillagerHitTime < 10);

    // ============================================================
    // 1. GETREIDE-PRIORITÄT: Wenn Getreide < 50, PRIORISIERE GETREIDE
    // ============================================================
    const hasGrainNodes = cachedPlayerAvailableNodes.some(n => n.type === 'grain');
    const grainPriority = (resources.grain < 50 && hasGrainNodes);

    // ============================================================
    // 2. STEINLIEFERUNG - IMMER, aber bei Getreideknappheit auf 20% der Freien begrenzt
    // ============================================================
    const towersNeedingStone = buildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = cachedPlayerFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    // Anzahl der freien Einwohner
    const totalFree = freeForStone.length;

    // Maximal 20% der freien Einwohner für Steinlieferung, bei Getreideknappheit
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && resources.stone > 0 && totalFree > 0) {
        // Bereits unterwegs zählen
        const currentlyDelivering = cachedPlayerVillagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, resources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || resources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                for (let i = 0; i < canSend; i++) {
                    if (resources.stone <= 0) break;
                    let closestVillager = null, closestDist = Infinity;
                    for (let v of freeForStone) {
                        if (v.hasTask || v.isDeliveringStone) continue;
                        const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
                        if (d < closestDist) { closestDist = d; closestVillager = v; }
                    }
                    if (closestVillager) {
                        tower.reservedStone += 1;
                        resources.stone -= 1;
                        const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE);
                        if (lager) {
                            closestVillager.state = 'movingToLagerForStone';
                            closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.hasTask = true;
                            closestVillager.isDeliveringStone = true;
                            closestVillager.towerTarget = tower;
                            closestVillager.stoneToDeliver = 1;
                            closestVillager.hasReservedStone = true;
                            freeForStone = freeForStone.filter(v => v.id !== closestVillager.id);
                        } else {
                            resources.stone += 1;
                            tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                        }
                    }
                }
            }
        }
    }

    // ============================================================
    // 3. RESSOURCEN SAMMELN - GETREIDE HAT PRIORITÄT (aber NICHT ausschließlich!)
    // ============================================================

    const freeForTasksAfterStone = cachedPlayerFreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    if (cachedPlayerAvailableNodes.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            let sortedNodes;
            if (grainPriority) {
                sortedNodes = [...cachedPlayerAvailableNodes].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...cachedPlayerAvailableNodes].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            } else {
                sortedNodes = cachedPlayerAvailableNodes;
            }

            for (let node of sortedNodes) {
                if (!node.ready || node.claimedBy) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - node.x * CONFIG.CELL_SIZE, v.y - node.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'movingToResource';
                    closestVillager.targetX = node.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = node.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                }
            }
        }
    }

    // ============================================================
    // 4. BEWEGUNG FÜR ALLE EINWOHNER
    // ============================================================

    const villagersToUpdate = cachedPlayerVillagers.slice();

    for (let v of villagersToUpdate) {
        const home = buildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        // === FIX 1: Attacking-Check mit State-Reset ===
        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // === FIX 2: movingToCapture BEHANDELN (NEU - war der Fehler!) ===
        if (v.state === 'movingToCapture') {
            // Prüfe ob das Ziel-Gebäude noch existiert
            let targetBuilding = null;
            if (!SPLIT_SCREEN) {
                targetBuilding = npcBuildings.find(b => b.id === v.captureTargetId);
            }
            if (!targetBuilding && SPLIT_SCREEN) {
                targetBuilding = player2Buildings.find(b => b.id === v.captureTargetId);
            }
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            // Bewege zum Ziel
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // === FIX 3: Attacking mit State-Reset ===
        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // === FIX 4: Building mit State-Reset ===
        if (v.isBuilding && v.buildingTarget) {
            const building = buildings.find(b => b.id === v.buildingTarget);
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        if (v.isAttacking) continue;

        // === FIX 5: Steinlieferant mit State-Reset ===
        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                if (lager) {
                    const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                    const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && buildings.includes(v.towerTarget) && !v.towerTarget.isUnderConstruction && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            resources.stone += toDeliver;
                            if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                            v.state = 'idle';
                            v.hasTask = false;
                            v.isDeliveringStone = false;
                            v.towerTarget = null;
                            v.stoneToDeliver = 0;
                            v.hasReservedStone = false;
                            v.carrying = null;
                        }
                    } else {
                        const step = Math.min(distance, v.speed * dt);
                        v.x += (dx / distance) * step;
                        v.y += (dy / distance) * step;
                    }
                } else {
                    // Kein Lager - State zurücksetzen
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                if (!tower || !buildings.includes(tower) || tower.isUnderConstruction || tower.stoneAmmo >= tower.maxStoneAmmo) {
                    resources.stone += (v.stoneToDeliver || 0);
                    if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    continue;
                }
                const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            resources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        // === ROHSTOFFTRÄGER ===
        if (v.carrying !== null && !v.isDeliveringStone) {
            if (v.state !== 'returningHome') {
                v.state = 'returningHome';
                const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY);
                if (lager) {
                    v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                } else {
                    v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
                v.resourceTarget = null;
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'returningHome') handleArrival(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedPlayerResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        // === IDLE-BEWEGUNG ===
        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { v.targetX = homePos.x;
                v.targetY = homePos.y; }
        }

        // === BEWEGUNG ===
        if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY);
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'movingToResource' || v.state === 'returningHome') handleArrival(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
        }
    }

    // ===== AM ENDE: CACHES AKTUALISIEREN =====
    villagers = villagers.filter(v => v.alive);

    refreshPlayerVillagerCache();
    refreshPlayerResourceCache();
    refreshLagerCache();

    // === TOTE EINWOHNER AUS RESSOURCEN-NODES ENTFERNEN ===
    for (let node of resourceNodes) {
        if (node.claimedBy && !cachedPlayerAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // === TOTE EINWOHNER AUS TURM-RESERVIERUNGEN ENTFERNEN ===
    for (let tower of buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    markDirty();
}

// =========================================================================
//  MODUL 12.5a: CACHE-FUNKTIONEN (Spieler 2)
//  Exakte Kopie von Modul 12a, aber mit player2-Variablen
// =========================================================================

let player2CacheVersion = 0;
let cachedPlayer2FreeCount = -1;

function markPlayer2CacheDirty() {
    cacheNeedsRefreshP2 = true;
}

function refreshPlayer2VillagerCache() {
    const aliveVillagers = player2Villagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    if (cachedPlayer2AliveIds.size === aliveCount && cachedPlayer2FreeCount === freeCount && cacheNeedsRefreshP2 === false) {
        return;
    }

    try {
        cachedPlayer2Villagers = aliveVillagers;
        cachedPlayer2AliveIds = aliveIds;
        cachedPlayer2FreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedPlayer2FreeCount = cachedPlayer2FreeVillagers.length;
        cacheNeedsRefreshP2 = false;
    } catch(e) {
        cachedPlayer2Villagers = [];
        cachedPlayer2FreeVillagers = [];
        cachedPlayer2AliveIds = new Set();
        cachedPlayer2FreeCount = 0;
    }
}

function refreshPlayer2ResourceCache() {
    try {
        cachedPlayer2ResourceNodes = player2ResourceNodes.slice();
        cachedPlayer2AvailableNodes = cachedPlayer2ResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedPlayer2ResourceNodes = [];
        cachedPlayer2AvailableNodes = [];
    }
}

//  ENDE MODUL 12.5a

// =========================================================================
//  MODUL 12.5b: EINWOHNER-KI (Spieler 2) - ANKUNFT & BEWEGUNG
//  Exakte Kopie von Modul 12b, aber mit player2-Variablen
// =========================================================================

function getNeededBuildersSpieler2() {
  let needed = 0;
  for (let b of player2Buildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleArrivalPlayer2(v, home) {
  if (v.state === 'movingToResource' && v.resourceTarget) {
    const node = cachedPlayer2ResourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.ready && node.claimedBy === v.id) {
      // Ressource abholen
      if (node.type === 'grain') player2Resources.grain += 1;
      else if (node.type === 'wood') player2Resources.wood += 1;
      else if (node.type === 'stone') player2Resources.stone += 1;
      
      // NODE ENTFERNEN
      const idx = player2ResourceNodes.indexOf(node);
      if (idx !== -1) { 
        player2ResourceNodes.splice(idx, 1); 
        refreshPlayer2ResourceCache();
        markDirty();
      }
      v.carrying = node.type; 
      v.deliveryTarget = null;
    } else {
      v.state = 'idle';
      v.resourceTarget = null;
      v.hasTask = false;
      if (node && node.claimedBy === v.id) {
        node.claimedBy = null;
      }
      return;
    }
    v.resourceTarget = null;
    v.state = 'returningHome';
    
    refreshLagerCache();
    
    let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
    
    if (!lager) {
      for (let b of player2Buildings) {
        if (b.type === 'lager') {
          lager = b;
          break;
        }
      }
    }
    
    if (lager) {
      v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
      v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
      v.alive = false;
      v.carrying = null;
      v.state = 'idle';
      v.hasTask = false;
      showTemporaryMessage('💀 KEIN LAGER FÜR SPIELER 2!', '#ff0000');
      gameOver = true;
      document.getElementById('gameOverTitle').textContent = '💀 NIEDERLAGE!';
      document.getElementById('gameOverSub').textContent = 'Spieler 2 hat kein Lager - Spieler 1 gewinnt!';
      document.getElementById('gameOverOverlay').style.display = 'flex';
      return;
    }
  } else if (v.state === 'returningHome' && v.carrying) {
    v.carrying = null; 
    v.state = 'idle'; 
    v.resourceTarget = null; 
    v.hasTask = false; 
    v.deliveryTarget = null;
    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
    v.targetX = homePos.x; 
    v.targetY = homePos.y;
  }
}

let lastPlayer2VillagerHitTime = 0;

// =========================================================================
//  ENDE MODUL 12.5b
// =========================================================================

// =========================================================================
//  MODUL 12.5c: EINWOHNER-KI (Spieler 2) - HAUPTLOGIK
//  Exakte Kopie von Modul 12c, aber mit player2-Variablen
// =========================================================================

function updateVillagersPlayer2(dt) {
    refreshPlayer2VillagerCache();
    refreshPlayer2ResourceCache();
    refreshLagerCache();

    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of player2Buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of player2Villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (site.isNPC) continue;
        if (site.playerId !== 'player2') continue;
        const building = player2Buildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = player2Villagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    for (let v of player2Villagers) {
        if (v.alive && v.state === 'movingToCapture') {
            const targetBuilding = v.captureTargetId ? buildings.find(b => b.id === v.captureTargetId) : null;
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) node.claimedBy = null;
    }

    player2Villagers = cachedPlayer2Villagers.slice();

    for (let building of player2Buildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            player2Resources.stone += overflow;
        }
    }

    const neededBuilders = getNeededBuildersSpieler2();
    const freeForTasks = cachedPlayer2FreeVillagers.slice(neededBuilders);

    const now = performance.now() / 1000;
    const stonePriority = (now - lastPlayer2VillagerHitTime < 10);

    const hasGrainNodes = cachedPlayer2AvailableNodes.some(n => n.type === 'grain');
    const grainPriority = (player2Resources.grain < 50 && hasGrainNodes);

    const towersNeedingStone = player2Buildings.filter(b =>
        b.type === 'wachturm' &&
        !b.isUnderConstruction &&
        b.stoneAmmo < b.maxStoneAmmo
    );

    let freeForStone = cachedPlayer2FreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    const totalFree = freeForStone.length;
    const maxStoneDeliverers = grainPriority ? Math.max(1, Math.floor(totalFree * 0.2)) : Infinity;

    if (towersNeedingStone.length > 0 && player2Resources.stone > 0 && totalFree > 0) {
        const currentlyDelivering = cachedPlayer2Villagers.filter(v => v.isDeliveringStone && v.alive).length;
        const slots = Math.max(0, maxStoneDeliverers - currentlyDelivering);
        const toSend = Math.min(slots, freeForStone.length, player2Resources.stone);

        if (toSend > 0) {
            for (let tower of towersNeedingStone) {
                if (toSend <= 0 || player2Resources.stone <= 0) break;
                const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                if (needed <= 0) continue;
                const canSend = Math.min(toSend, needed);
                for (let i = 0; i < canSend; i++) {
                    if (player2Resources.stone <= 0) break;
                    let closestVillager = null, closestDist = Infinity;
                    for (let v of freeForStone) {
                        if (v.hasTask || v.isDeliveringStone) continue;
                        const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
                        if (d < closestDist) { closestDist = d; closestVillager = v; }
                    }
                    if (closestVillager) {
                        tower.reservedStone += 1;
                        player2Resources.stone -= 1;
                        const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE, false, 'player2');
                        if (lager) {
                            closestVillager.state = 'movingToLagerForStone';
                            closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            closestVillager.hasTask = true;
                            closestVillager.isDeliveringStone = true;
                            closestVillager.towerTarget = tower;
                            closestVillager.stoneToDeliver = 1;
                            closestVillager.hasReservedStone = true;
                            freeForStone = freeForStone.filter(v => v.id !== closestVillager.id);
                        } else {
                            player2Resources.stone += 1;
                            tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                        }
                    }
                }
            }
        }
    }

    const freeForTasksAfterStone = cachedPlayer2FreeVillagers.filter(v =>
        v.alive &&
        v.state === 'idle' &&
        v.carrying === null &&
        !v.hasTask &&
        !v.isAttacking &&
        !v.isBuilding
    );

    if (cachedPlayer2AvailableNodes.length > 0 && freeForTasksAfterStone.length > 0) {
        const freeForResource = freeForTasksAfterStone.filter(v =>
            v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        if (freeForResource.length > 0) {
            let assignedVillagers = [];

            let sortedNodes;
            if (grainPriority) {
                sortedNodes = [...cachedPlayer2AvailableNodes].sort((a, b) => {
                    if (a.type === 'grain' && b.type !== 'grain') return -1;
                    if (b.type === 'grain' && a.type !== 'grain') return 1;
                    return 0;
                });
            } else if (stonePriority) {
                sortedNodes = [...cachedPlayer2AvailableNodes].sort((a, b) => {
                    if (a.type === 'stone' && b.type !== 'stone') return -1;
                    if (b.type === 'stone' && a.type !== 'stone') return 1;
                    return 0;
                });
            } else {
                sortedNodes = cachedPlayer2AvailableNodes;
            }

            for (let node of sortedNodes) {
                if (!node.ready || node.claimedBy) continue;

                let closestVillager = null, closestDist = Infinity;
                for (let v of freeForResource) {
                    if (assignedVillagers.includes(v)) continue;
                    const d = Math.hypot(v.x - node.x * CONFIG.CELL_SIZE, v.y - node.y * CONFIG.CELL_SIZE);
                    if (d < closestDist) { closestDist = d; closestVillager = v; }
                }
                if (closestVillager) {
                    assignedVillagers.push(closestVillager);
                    node.claimedBy = closestVillager.id;
                    closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                    closestVillager.state = 'movingToResource';
                    closestVillager.targetX = node.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.targetY = node.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    closestVillager.hasTask = true;
                    closestVillager.deliveryTarget = null;
                    closestVillager.isDeliveringStone = false;
                }
            }
        }
    }

    const villagersToUpdate = cachedPlayer2Villagers.slice();

    for (let v of villagersToUpdate) {
        const home = player2Buildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        if (v.state === 'movingToCapture') {
            const targetBuilding = v.captureTargetId ? buildings.find(b => b.id === v.captureTargetId) : null;
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.isBuilding && v.buildingTarget) {
            const building = player2Buildings.find(b => b.id === v.buildingTarget);
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        if (v.isAttacking) continue;

        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, false, 'player2');
                if (lager) {
                    const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                    const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && player2Buildings.includes(v.towerTarget) && !v.towerTarget.isUnderConstruction && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            player2Resources.stone += toDeliver;
                            if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                            v.state = 'idle';
                            v.hasTask = false;
                            v.isDeliveringStone = false;
                            v.towerTarget = null;
                            v.stoneToDeliver = 0;
                            v.hasReservedStone = false;
                            v.carrying = null;
                        }
                    } else {
                        const step = Math.min(distance, v.speed * dt);
                        v.x += (dx / distance) * step;
                        v.y += (dy / distance) * step;
                    }
                } else {
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                if (!tower || !player2Buildings.includes(tower) || tower.isUnderConstruction || tower.stoneAmmo >= tower.maxStoneAmmo) {
                    player2Resources.stone += (v.stoneToDeliver || 0);
                    if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    continue;
                }
                const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            player2Resources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        if (v.carrying !== null && !v.isDeliveringStone) {
            if (v.state !== 'returningHome') {
                v.state = 'returningHome';
                const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY, false, 'player2');
                if (lager) {
                    v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                } else {
                    v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
                v.resourceTarget = null;
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'returningHome') handleArrivalPlayer2(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedPlayer2ResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { v.targetX = homePos.x;
                v.targetY = homePos.y; }
        }

        if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY, false, 'player2');
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'movingToResource' || v.state === 'returningHome') handleArrivalPlayer2(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
        }
    }

    player2Villagers = player2Villagers.filter(v => v.alive);

    refreshPlayer2VillagerCache();
    refreshPlayer2ResourceCache();
    refreshLagerCache();

    for (let node of player2ResourceNodes) {
        if (node.claimedBy && !cachedPlayer2AliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    for (let tower of player2Buildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of player2Villagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    markDirty();
}

let cachedNpcFreeCount = -1;

function markNpcCacheDirty() {
    npcCacheNeedsRefresh = true;
}

function refreshNpcVillagerCache() {
    const aliveVillagers = npcVillagers.filter(v => v.alive);
    const aliveIds = new Set(aliveVillagers.map(v => v.id));
    const aliveCount = aliveIds.size;

    const freeCount = aliveVillagers.filter(v =>
        v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
    ).length;

    if (cachedNpcAliveIds.size === aliveCount && cachedNpcFreeCount === freeCount && npcCacheNeedsRefresh === false) {
        return;
    }

    try {
        cachedNpcVillagers = aliveVillagers;
        cachedNpcAliveIds = aliveIds;
        cachedNpcFreeVillagers = aliveVillagers.filter(v =>
            v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding
        );
        cachedNpcFreeCount = cachedNpcFreeVillagers.length;
        npcCacheNeedsRefresh = false;
    } catch(e) {
        cachedNpcVillagers = [];
        cachedNpcFreeVillagers = [];
        cachedNpcAliveIds = new Set();
        cachedNpcFreeCount = 0;
    }
}

function refreshNpcResourceCache() {
    try {
        cachedNpcResourceNodes = npcResourceNodes.slice();
        cachedNpcAvailableNodes = cachedNpcResourceNodes.filter(n => n.ready && !n.claimedBy);
    } catch(e) {
        cachedNpcResourceNodes = [];
        cachedNpcAvailableNodes = [];
    }
}

function getNeededBuildersNPC() {
  let needed = 0;
  for (let b of npcBuildings) {
    if (b.isUnderConstruction && b.waitingForBuilder && !b.builder) {
      needed += 1;
    }
  }
  return needed;
}

function handleNpcArrival(v, home) {
  if (v.state === 'movingToResource' && v.resourceTarget) {
    const node = cachedNpcResourceNodes.find(r => r.id === v.resourceTarget.id);
    if (node && node.ready && node.claimedBy === v.id) {
      // Ressource abholen
      if (node.type === 'grain') npcResources.grain += 1;
      else if (node.type === 'wood') npcResources.wood += 1;
      else if (node.type === 'stone') npcResources.stone += 1;
      
      // NODE ENTFERNEN - jetzt erst wenn abgeholt!
      const idx = npcResourceNodes.indexOf(node);
      if (idx !== -1) { 
        npcResourceNodes.splice(idx, 1);
        refreshNpcResourceCache();
        markDirty();
      }
      v.carrying = node.type; 
      v.deliveryTarget = null;
    } else {
      // Node nicht mehr verfügbar oder nicht ready -> zurücksetzen
      v.state = 'idle';
      v.resourceTarget = null;
      v.hasTask = false;
      // Wenn node existiert aber nicht ready, Claim aufheben
      if (node && node.claimedBy === v.id) {
        node.claimedBy = null;
      }
      return;
    }
    v.resourceTarget = null;
    v.state = 'returningHome';
    
    // === LAGER SUCHEN - CACHE AKTUALISIEREN ===
    refreshLagerCache();
    
    // === NUR ZUM LAGER GEHEN ===
    let lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
    
    // === FALLBACK: DIREKT IN NPCBUILDINGS SUCHEN ===
    if (!lager) {
      // Direkt in npcBuildings nach einem Lager suchen
      for (let b of npcBuildings) {
        if (b.type === 'lager') {
          lager = b;
          break;
        }
      }
    }
    
    if (lager) {
      v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
      v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
      v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2;
    } else {
      // === KEIN LAGER = NPC GAME OVER ===
      v.alive = false;
      v.carrying = null;
      v.state = 'idle';
      v.hasTask = false;
      // NPC hat kein Lager mehr - er kann nicht mehr überleben
      // Aber wir geben ihm eine letzte Chance: Er baut ein neues Lager
      showTemporaryMessage('🤖 NPC hat kein Lager mehr! Versucht zu überleben...', '#ff6b6b');
      // Versuche ein neues Lager zu bauen
      const pos = findLagerPosition ? findLagerPosition() : findStandardPosition('lager', true);
      if (pos && npcCanAfford('lager')) {
        npcDeductCost('lager');
        const b = new Building(nextBuildingId++, 'lager', pos.x, pos.y, true);
        b.isUnderConstruction = true; b.constructionTimer = 0; b.constructionProgress = 0; b.waitingForBuilder = true;
        npcBuildings.push(b); assignNpcBuilderToConstruction(b.id);
        showTemporaryMessage('🤖 NPC baut neues Lager!', '#9b59b6');
        markDirty();
      } else {
        // NPC kann kein Lager bauen -> Game Over für NPC (Spieler gewinnt)
        showTemporaryMessage('🤖 NPC SIEDLUNG ZUSAMMENGEBROCHEN!', '#ff0000');
        // Alle NPC-Gebäude werden zu Spieler-Gebäuden (Sieg)
        for (let nb of npcBuildings) {
          nb.isNPC = false;
          nb.id = nextBuildingId++;
          buildings.push(nb);
        }
        npcBuildings = [];
        npcVillagers = [];
        gameOver = true;
        document.getElementById('gameOverTitle').textContent = '🎉 SIEG!';
        document.getElementById('gameOverSub').textContent = 'NPC hat kein Lager - Du hast gewonnen!';
        document.getElementById('gameOverOverlay').style.display = 'flex';
        return;
      }
    }
  } else if (v.state === 'returningHome' && v.carrying) {
    v.carrying = null; 
    v.state = 'idle'; 
    v.resourceTarget = null; 
    v.hasTask = false; 
    v.deliveryTarget = null;
    const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2,
                      y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE/2 };
    v.targetX = homePos.x; 
    v.targetY = homePos.y;
  }
}

let lastNPCVillagerHitTime = 0;

// =========================================================================
//  MODUL 13c: NPC-EINWOHNER-KI – KOMPLETT OPTIMIERT (VOLLSTÄNDIG)
// =========================================================================

function updateNPCVillagers(dt) {
    // === NEU: Caches VOR der Aufgabenverteilung aktualisieren ===
    refreshNpcVillagerCache();
    refreshNpcResourceCache();
    refreshLagerCache();

    // === NEU: Tote NPC-Einwohner aus Ressourcen-Nodes entfernen ===
    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // === NEU: Tote NPC-Einwohner aus Turm-Reservierungen entfernen ===
    for (let tower of npcBuildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of npcVillagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    // === NEU: Tote NPC-Einwohner aus Bauaufträgen entfernen ===
    for (let key in constructionSites) {
        const site = constructionSites[key];
        if (!site.isNPC) continue;
        const building = npcBuildings.find(b => b.id === parseInt(key));
        if (building) {
            const builder = npcVillagers.find(v => v.id === site.builder && v.alive);
            if (!builder) {
                building.builder = null;
                building.waitingForBuilder = true;
                delete constructionSites[key];
            }
        }
    }

    // === NEU: Hängengebliebene Capture-Aufgaben bereinigen ===
    for (let v of npcVillagers) {
        if (v.alive && v.state === 'movingToCapture') {
            const targetBuilding = v.captureTargetId ? buildings.find(b => b.id === v.captureTargetId) : null;
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
            }
        }
    }

    // ===== AB HIER DER BESTEHENDE CODE =====
    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) node.claimedBy = null;
    }

    npcVillagers = cachedNpcVillagers.slice();

    // Stein-Overflow korrigieren
    for (let building of npcBuildings) {
        if (building.type === 'wachturm' && !building.isUnderConstruction && building.stoneAmmo > building.maxStoneAmmo) {
            const overflow = building.stoneAmmo - building.maxStoneAmmo;
            building.stoneAmmo = building.maxStoneAmmo;
            npcResources.stone += overflow;
        }
    }

    const neededBuilders = getNeededBuildersNPC();
    const freeForTasks = cachedNpcFreeVillagers.slice(neededBuilders);

    const now = performance.now() / 1000;
    const stonePriority = (now - lastNPCVillagerHitTime < 10);
    const hasGrainNodes = cachedNpcAvailableNodes.some(n => n.type === 'grain');
    const grainPriority = (npcResources.grain < 50 && hasGrainNodes);

    const npcsToUpdate = cachedNpcVillagers.slice();

    for (let v of npcsToUpdate) {
        const home = npcBuildings.find(b => b.id === v.homeId);
        if (!home) {
            v.state = 'idle';
            v.hasTask = false;
            continue;
        }

        // === FIX 1: Attacking-Check mit State-Reset ===
        if (v.isAttacking && (!v.attackTarget || !v.attackTarget.alive)) {
            v.isAttacking = false;
            v.attackTarget = null;
            v.state = 'idle';
            v.hasTask = false;
            v.combatCooldown = 0;
            continue;
        }

        // === FIX 2: MovingToCapture mit Timeout ===
        if (v.state === 'movingToCapture') {
            const targetBuilding = v.captureTargetId ? buildings.find(b => b.id === v.captureTargetId) : null;
            if (!targetBuilding) {
                v.state = 'idle';
                v.hasTask = false;
                v.captureTargetId = null;
                continue;
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // === FIX 3: Attacking mit State-Reset ===
        if (v.isAttacking && v.attackTarget && v.attackTarget.alive) {
            v.state = 'attacking';
            v.targetX = v.attackTarget.x;
            v.targetY = v.attackTarget.y;
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance > 3) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        // === FIX 4: Building mit State-Reset ===
        if (v.isBuilding && v.buildingTarget) {
            const building = npcBuildings.find(b => b.id === v.buildingTarget);
            if (building && building.isUnderConstruction) {
                const targetX = building.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = building.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                v.targetX = targetX;
                v.targetY = targetY;
                v.state = 'building';
                const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
                if (distance > 3) {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            } else {
                v.isBuilding = false;
                v.buildingTarget = null;
                v.state = 'idle';
                v.hasTask = false;
            }
        }

        if (v.isAttacking) continue;

        // === STEINLIEFERANT MIT STATE-RESET ===
        if (v.isDeliveringStone) {
            if (v.state === 'movingToLagerForStone') {
                const lager = findNearestLager(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE, true);
                if (lager) {
                    const dx = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                    const dy = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 3) {
                        const toDeliver = v.stoneToDeliver || 1;
                        if (v.towerTarget && npcBuildings.includes(v.towerTarget) && v.towerTarget.stoneAmmo < v.towerTarget.maxStoneAmmo) {
                            v.carrying = 'stone';
                            v.stoneToDeliver = toDeliver;
                            v.state = 'deliveringStoneToTower';
                            v.targetX = v.towerTarget.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            v.targetY = v.towerTarget.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        } else {
                            const altTower = findNearestNPCTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                            if (altTower) {
                                if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                                altTower.reservedStone += toDeliver;
                                v.towerTarget = altTower;
                                v.carrying = 'stone';
                                v.stoneToDeliver = toDeliver;
                                v.state = 'deliveringStoneToTower';
                                v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            } else {
                                npcResources.stone += toDeliver;
                                if (v.towerTarget) v.towerTarget.reservedStone = Math.max(0, v.towerTarget.reservedStone - toDeliver);
                                v.state = 'idle';
                                v.hasTask = false;
                                v.isDeliveringStone = false;
                                v.towerTarget = null;
                                v.stoneToDeliver = 0;
                                v.hasReservedStone = false;
                                v.carrying = null;
                            }
                        }
                    } else {
                        const step = Math.min(distance, v.speed * dt);
                        v.x += (dx / distance) * step;
                        v.y += (dy / distance) * step;
                    }
                } else {
                    // Kein Lager - State zurücksetzen
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                    v.carrying = null;
                }
                continue;
            }

            if (v.state === 'deliveringStoneToTower' && v.carrying === 'stone') {
                const tower = v.towerTarget;
                if (!tower || !npcBuildings.includes(tower) || tower.stoneAmmo >= tower.maxStoneAmmo) {
                    const altTower = findNearestNPCTowerWithSpace(v.x / CONFIG.CELL_SIZE, v.y / CONFIG.CELL_SIZE);
                    if (altTower) {
                        if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                        altTower.reservedStone += (v.stoneToDeliver || 0);
                        v.towerTarget = altTower;
                        v.targetX = altTower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        v.targetY = altTower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    } else {
                        npcResources.stone += (v.stoneToDeliver || 0);
                        if (tower) tower.reservedStone = Math.max(0, tower.reservedStone - (v.stoneToDeliver || 0));
                        v.carrying = null;
                        v.state = 'idle';
                        v.hasTask = false;
                        v.isDeliveringStone = false;
                        v.towerTarget = null;
                        v.stoneToDeliver = 0;
                        v.hasReservedStone = false;
                    }
                    continue;
                }
                const dx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.x;
                const dy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 - v.y;
                const distance = Math.hypot(dx, dy);
                if (distance < 3) {
                    const toDeliver = Math.min(v.stoneToDeliver || 1, tower.maxStoneAmmo - tower.stoneAmmo);
                    if (toDeliver > 0) {
                        tower.stoneAmmo += toDeliver;
                        tower.reservedStone = Math.max(0, tower.reservedStone - toDeliver);
                        if (tower.stoneAmmo > tower.maxStoneAmmo) {
                            const overflow = tower.stoneAmmo - tower.maxStoneAmmo;
                            tower.stoneAmmo = tower.maxStoneAmmo;
                            npcResources.stone += overflow;
                        }
                    }
                    v.carrying = null;
                    v.state = 'idle';
                    v.hasTask = false;
                    v.isDeliveringStone = false;
                    v.towerTarget = null;
                    v.stoneToDeliver = 0;
                    v.hasReservedStone = false;
                } else {
                    const step = Math.min(distance, v.speed * dt);
                    v.x += (dx / distance) * step;
                    v.y += (dy / distance) * step;
                }
                continue;
            }
        }

        // === ROHSTOFFTRÄGER (NPC) ===
        if (v.carrying !== null && !v.isDeliveringStone) {
            if (v.state !== 'returningHome') {
                v.state = 'returningHome';
                const lager = findNearestLager(v.resourceTarget ? v.resourceTarget.x : home.gridX, v.resourceTarget ? v.resourceTarget.y : home.gridY, true);
                if (lager) {
                    v.deliveryTarget = { x: lager.gridX, y: lager.gridY, type: 'lager' };
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                } else {
                    v.targetX = home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
                v.resourceTarget = null;
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'returningHome') handleNpcArrival(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
            continue;
        }

        if (v.state === 'movingToResource' && v.resourceTarget) {
            const node = cachedNpcResourceNodes.find(r => r.id === v.resourceTarget.id);
            if (!node || !node.ready || node.claimedBy !== v.id) {
                v.state = 'idle';
                v.resourceTarget = null;
                v.hasTask = false;
                if (node && node.claimedBy === v.id) node.claimedBy = null;
            }
        }

        // === RESSOURCEN EINSAMMELN ===
        if (cachedNpcAvailableNodes.length > 0 && freeForTasks.length > 0) {
            const freeForResource = freeForTasks.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);
            if (freeForResource.length > 0) {
                let assignedVillagers = [];

                let sortedNodes;
                if (grainPriority) {
                    sortedNodes = [...cachedNpcAvailableNodes].sort((a, b) => {
                        if (a.type === 'grain' && b.type !== 'grain') return -1;
                        if (b.type === 'grain' && a.type !== 'grain') return 1;
                        if (stonePriority) {
                            if (a.type === 'stone' && b.type !== 'stone') return -1;
                            if (b.type === 'stone' && a.type !== 'stone') return 1;
                        }
                        return 0;
                    });
                    // KEIN filter(n => n.type === 'grain') mehr!
                } else if (stonePriority) {
                    sortedNodes = [...cachedNpcAvailableNodes].sort((a, b) => {
                        if (a.type === 'stone' && b.type !== 'stone') return -1;
                        if (b.type === 'stone' && a.type !== 'stone') return 1;
                        return 0;
                    });
                } else {
                    sortedNodes = cachedNpcAvailableNodes;
                }

                for (let node of sortedNodes) {
                    if (!node.ready || node.claimedBy) continue;

                    let closestVillager = null, closestDist = Infinity;
                    for (let v of freeForResource) {
                        if (assignedVillagers.includes(v)) continue;
                        const d = Math.hypot(v.x - node.x * CONFIG.CELL_SIZE, v.y - node.y * CONFIG.CELL_SIZE);
                        if (d < closestDist) { closestDist = d;
                            closestVillager = v; }
                    }
                    if (closestVillager) {
                        assignedVillagers.push(closestVillager);
                        node.claimedBy = closestVillager.id;
                        closestVillager.resourceTarget = { id: node.id, x: node.x, y: node.y, type: node.type };
                        closestVillager.state = 'movingToResource';
                        closestVillager.targetX = node.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.targetY = node.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        closestVillager.hasTask = true;
                        closestVillager.deliveryTarget = null;
                        closestVillager.isDeliveringStone = false;
                    }
                }
            }
        }

        // === NPC STEIN-LIEFERAUFTRÄGE ===
        const npcTowersNeedingStone = npcBuildings.filter(b => b.type === 'wachturm' && b.stoneAmmo < b.maxStoneAmmo);
        let npcFreeForStone = cachedNpcFreeVillagers.filter(v => v.alive && v.state === 'idle' && v.carrying === null && !v.hasTask && !v.isAttacking && !v.isBuilding);

        const totalFreeNPC = npcFreeForStone.length;
        const maxStoneDeliverersNPC = grainPriority ? Math.max(1, Math.floor(totalFreeNPC * 0.2)) : Infinity;

        if (npcTowersNeedingStone.length > 0 && npcResources.stone > 0 && totalFreeNPC > 0) {
            const currentlyDelivering = cachedNpcVillagers.filter(v => v.isDeliveringStone && v.alive).length;
            const slots = Math.max(0, maxStoneDeliverersNPC - currentlyDelivering);
            const toSend = Math.min(slots, npcFreeForStone.length, npcResources.stone);

            if (toSend > 0) {
                for (let tower of npcTowersNeedingStone) {
                    if (toSend <= 0 || npcResources.stone <= 0) break;
                    const needed = tower.maxStoneAmmo - tower.stoneAmmo - tower.reservedStone;
                    if (needed <= 0) continue;
                    const canSend = Math.min(toSend, needed);
                    for (let i = 0; i < canSend; i++) {
                        if (npcResources.stone <= 0) break;
                        let closestVillager = null, closestDist = Infinity;
                        for (let v of npcFreeForStone) {
                            if (v.hasTask || v.isDeliveringStone) continue;
                            const d = Math.hypot(v.x - tower.gridX * CONFIG.CELL_SIZE, v.y - tower.gridY * CONFIG.CELL_SIZE);
                            if (d < closestDist) { closestDist = d;
                                closestVillager = v; }
                        }
                        if (closestVillager) {
                            tower.reservedStone += 1;
                            npcResources.stone -= 1;
                            const lager = findNearestLager(closestVillager.x / CONFIG.CELL_SIZE, closestVillager.y / CONFIG.CELL_SIZE, true);
                            if (lager) {
                                closestVillager.state = 'movingToLagerForStone';
                                closestVillager.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                closestVillager.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                                closestVillager.hasTask = true;
                                closestVillager.isDeliveringStone = true;
                                closestVillager.towerTarget = tower;
                                closestVillager.stoneToDeliver = 1;
                                closestVillager.hasReservedStone = true;
                                npcFreeForStone = npcFreeForStone.filter(v => v.id !== closestVillager.id);
                            } else {
                                npcResources.stone += 1;
                                tower.reservedStone = Math.max(0, tower.reservedStone - 1);
                            }
                        }
                    }
                }
            }
        }

        // === IDLE-BEWEGUNG ===
        if (v.state === 'idle' && !v.hasTask && !v.isAttacking && !v.isBuilding && v.carrying === null) {
            const homePos = { x: home.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y: home.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2 };
            if (dist(v, homePos) > 5) { v.targetX = homePos.x;
                v.targetY = homePos.y; }
        }

        // === BEWEGUNG ===
        if (v.state === 'movingToResource' || v.state === 'returningHome' || v.state === 'idle') {
            if (v.state === 'idle' && v.hasTask) {
                const lager = findNearestLager(home.gridX, home.gridY, true);
                if (lager) {
                    v.targetX = lager.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    v.targetY = lager.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                }
            }
            const dx = v.targetX - v.x, dy = v.targetY - v.y, distance = Math.hypot(dx, dy);
            if (distance < 3) {
                v.x = v.targetX;
                v.y = v.targetY;
                if (v.state === 'movingToResource' || v.state === 'returningHome') handleNpcArrival(v, home);
            } else if (distance > 0) {
                const step = Math.min(distance, v.speed * dt);
                v.x += (dx / distance) * step;
                v.y += (dy / distance) * step;
            }
        }
    }

    // ===== AM ENDE: CACHES AKTUALISIEREN =====
    npcVillagers = npcVillagers.filter(v => v.alive);

    refreshNpcVillagerCache();
    refreshNpcResourceCache();
    refreshLagerCache();

    // === TOTE NPC-EINWOHNER AUS RESSOURCEN-NODES ENTFERNEN ===
    for (let node of npcResourceNodes) {
        if (node.claimedBy && !cachedNpcAliveIds.has(node.claimedBy)) {
            node.claimedBy = null;
        }
    }

    // === TOTE NPC-EINWOHNER AUS TURM-RESERVIERUNGEN ENTFERNEN ===
    for (let tower of npcBuildings) {
        if (tower.type === 'wachturm') {
            let totalReserved = 0;
            for (let v of npcVillagers) {
                if (v.alive && v.towerTarget === tower && v.hasReservedStone) {
                    totalReserved += v.stoneToDeliver || 0;
                }
            }
            tower.reservedStone = totalReserved;
        }
    }

    markDirty();
}

//  MODUL 14: FEINDE (für 2 Spieler erweitert)
