// =========================================================================
//  MODUL 18: RENDERER (für 2 Spieler erweitert - Split-Screen)
//  KORRIGIERT: Bau-Vorschau, Upgrade-Vorschau, Abriss-Vorschau für Split
// =========================================================================

let renderDirty = true;

function markDirty() {
    renderDirty = true;
}

function draw() {
    if (!renderDirty) {
        return;
    }

    const now = performance.now();
    if (!draw._lastDrawTime) draw._lastDrawTime = 0;
    if (now - draw._lastDrawTime < 100 && renderDirty) {
        return;
    }
    draw._lastDrawTime = now;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (SPLIT_SCREEN) {
        drawSplitScreen();
    } else {
        drawSingleScreen();
    }

    renderDirty = false;
}

// ===== EINZELMODUS: Original-Renderer (UNVERÄNDERT) =====
function drawSingleScreen() {
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    const viewLeft = Math.max(0, Math.floor((camera.x - canvas.width / 2 / camera.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewRight = Math.min(CONFIG.GRID_WIDTH, Math.ceil((camera.x + canvas.width / 2 / camera.zoom) / CONFIG.CELL_SIZE) + 2);
    const viewTop = Math.max(0, Math.floor((camera.y - canvas.height / 2 / camera.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewBottom = Math.min(CONFIG.GRID_HEIGHT, Math.ceil((camera.y + canvas.height / 2 / camera.zoom) / CONFIG.CELL_SIZE) + 2);

    // Terrain
    for (let y = viewTop; y < viewBottom; y++) {
        for (let x = viewLeft; x < viewRight; x++) {
            const type = terrainMap[y][x];
            ctx.fillStyle = getTerrainColor(type);
            ctx.fillRect(x * CONFIG.CELL_SIZE, y * CONFIG.CELL_SIZE, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fillText(getTerrainEmoji(type), x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2);
        }
    }

    // Gitter
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 0.5;
    for (let i = viewLeft; i <= viewRight; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CONFIG.CELL_SIZE, viewTop * CONFIG.CELL_SIZE);
        ctx.lineTo(i * CONFIG.CELL_SIZE, viewBottom * CONFIG.CELL_SIZE);
        ctx.stroke();
    }
    for (let j = viewTop; j <= viewBottom; j++) {
        ctx.beginPath();
        ctx.moveTo(viewLeft * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
        ctx.lineTo(viewRight * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
        ctx.stroke();
    }

    // Startphase
    if (!gameStarted) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const phaseText = startPhase === 'lager' ? '📦 Lager (kostenlos)' : '🏠 Haus (kostenlos)';
        ctx.fillText(`👉 Platziere dein ${phaseText}`, WORLD_WIDTH / 2, 50);
        ctx.font = '20px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText('Tippe auf eine freie Zelle', WORLD_WIDTH / 2, 90);
        if (pendingStartBuild) {
            const px = pendingStartBuild.gx * CONFIG.CELL_SIZE;
            const py = pendingStartBuild.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,255,0,0.3)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ffd966';
            ctx.lineWidth = 3;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
        }
    }

    // Bau-Vorschau (Einzelmodus)
    if (gameStarted && pendingBuild && selectedBuildingType) {
        const px = pendingBuild.gx * CONFIG.CELL_SIZE;
        const py = pendingBuild.gy * CONFIG.CELL_SIZE;
        ctx.fillStyle = 'rgba(255,255,0,0.2)';
        ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.strokeStyle = '#ffd966';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.setLineDash([]);
        if (selectedBuildingType === 'bauer' || selectedBuildingType === 'holzfaeller' || selectedBuildingType === 'steinmetz') {
            const neighbors = getNeighborCells(pendingBuild.gx, pendingBuild.gy, 1);
            const resourceType = selectedBuildingType === 'bauer' ? 'grain' : selectedBuildingType === 'holzfaeller' ? 'wood' : 'stone';
            for (let n of neighbors) {
                if (!isCellOccupied(n.x, n.y) && isResourceFieldAvailable(n.x, n.y, resourceType)) {
                    ctx.fillStyle = 'rgba(0,255,0,0.25)';
                    ctx.fillRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    ctx.strokeStyle = 'rgba(0,255,0,0.5)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                }
            }
        }
    }

    // Upgrade-Vorschau (Einzelmodus)
    if (gameStarted && pendingUpgrade) {
        const px = pendingUpgrade.gx * CONFIG.CELL_SIZE;
        const py = pendingUpgrade.gy * CONFIG.CELL_SIZE;
        ctx.fillStyle = 'rgba(255,0,255,0.25)';
        ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.strokeStyle = '#ff66ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.setLineDash([]);
    }

    // Abriss-Vorschau (Einzelmodus)
    if (gameStarted && pendingDestroy) {
        const px = pendingDestroy.gx * CONFIG.CELL_SIZE;
        const py = pendingDestroy.gy * CONFIG.CELL_SIZE;
        ctx.fillStyle = 'rgba(255,0,0,0.25)';
        ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
        ctx.setLineDash([]);
    }

    // Ressourcen-Nodes (Spieler)
    if (gameStarted) {
        for (let node of resourceNodes) {
            if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
            const x = node.x * CONFIG.CELL_SIZE;
            const y = node.y * CONFIG.CELL_SIZE;
            let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            const ratio = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = node.ready ? '#2ecc71' : '#f39c12';
            ctx.fillRect(barX, barY, barW * ratio, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
            if (node.ready) {
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            }
        }
    }

    // NPC-Ressourcen-Nodes
    if (gameStarted) {
        for (let node of npcResourceNodes) {
            if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
            const x = node.x * CONFIG.CELL_SIZE;
            const y = node.y * CONFIG.CELL_SIZE;
            let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
            ctx.fillStyle = 'rgba(155, 89, 182, 0.15)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            const ratio = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = node.ready ? '#66ff66' : '#f39c12';
            ctx.fillRect(barX, barY, barW * ratio, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
            if (node.ready) {
                ctx.strokeStyle = '#9b59b6';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            }
        }
    }

    // Gebäude
    const allBuildings = [...buildings, ...npcBuildings];
    for (let b of allBuildings) {
        if (b.gridX < viewLeft || b.gridX >= viewRight || b.gridY < viewTop || b.gridY >= viewBottom) continue;
        const x = b.gridX * CONFIG.CELL_SIZE;
        const y = b.gridY * CONFIG.CELL_SIZE;

        if (b.beingCaptured && b.captureProgress > 0) {
            const flashSpeed = 8;
            const flashValue = Math.sin(performance.now() / 1000 * flashSpeed) * 0.5 + 0.5;
            const progress = b.captureProgress;
            ctx.strokeStyle = b.capturedBy === 'player' ?
                `rgba(255, 215, 0, ${0.5 + flashValue * 0.5})` :
                `rgba(255, 0, 0, ${0.5 + flashValue * 0.5})`;
            ctx.lineWidth = 2 + flashValue * 2;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(x - 1, y - 1, CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE + 2);
            ctx.setLineDash([]);
            const barX = x, barY = y - 8, barW = CONFIG.CELL_SIZE, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = b.capturedBy === 'player' ? '#ffd966' : '#ff4444';
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.globalAlpha = 0.4 + flashValue * 0.4;
        }

        let alpha = ctx.globalAlpha;
        let color = b.isNPC ? getNPCBuildingColor(b.type) : getBuildingColor(b.type);
        if (b.isUnderConstruction) {
            const progress = b.constructionProgress || 0;
            alpha = 0.2 + progress * 0.8;
        }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = b.isNPC ? '#9b59b6' : '#111';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);

        if (b.level > 1 && !b.isUnderConstruction) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.level, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
        }

        if (!b.isUnderConstruction) {
            if (b.type === 'haus') {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.residents}/${b.maxResidents}`, x + 4, y + 4);
            } else if (b.type === 'wachturm') {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.stoneAmmo}/${b.maxStoneAmmo}`, x + 4, y + 4);
                if (b.doubleShot) {
                    ctx.fillStyle = '#ff66ff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.fillText('✧2', x + 28, y + 28);
                }
            }
        }

        if (b.isUnderConstruction) {
            const progress = b.constructionProgress || 0;
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#ffd966';
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
        }
    }

    // Turm-Reichweite
    if (showTowerRange) {
        for (let tower of buildings) {
            if (tower.type !== 'wachturm' || tower.isUnderConstruction) continue;
            if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
            const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,0,0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,0,0.3)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // Projektile
    for (let p of projectiles) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.targetX, p.targetY);
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Hit-Effekte
    for (let effect of hitEffects) {
        for (let p of effect.particles) {
            if (p.life <= 0) continue;
            const alpha = Math.max(0, p.life / p.maxLife);
            const size = Math.max(0.5, 2 + (1 - alpha) * 4);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color || `rgb(255,${Math.floor(50 * alpha)},${Math.floor(50 * alpha)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = p.color || '#ff0000';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }

    // Einwohner
    const viewLeftPx = viewLeft * CONFIG.CELL_SIZE;
    const viewRightPx = viewRight * CONFIG.CELL_SIZE;
    const viewTopPx = viewTop * CONFIG.CELL_SIZE;
    const viewBottomPx = viewBottom * CONFIG.CELL_SIZE;

    for (let v of villagers) {
        if (!v.alive) continue;
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            let color = '#1a1a1a';
            if (v.carrying === 'grain') color = '#f39c12';
            else if (v.carrying === 'wood') color = '#8b5a2b';
            else if (v.carrying === 'stone') color = '#7f8c8d';
            else if (v.isBuilding) color = '#ffd966';
            else if (v.isAttacking) color = '#ff4444';
            ctx.beginPath();
            ctx.arc(v.x, v.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 0.6;
            ctx.stroke();
        }
    }

    for (let v of npcVillagers) {
        if (!v.alive) continue;
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            let color = '#66ccff';
            if (v.carrying === 'grain') color = '#66ff66';
            else if (v.carrying === 'wood') color = '#ff9966';
            else if (v.carrying === 'stone') color = '#ffcc66';
            else if (v.isBuilding) color = '#ffd966';
            else if (v.isAttacking) color = '#ff4444';
            ctx.beginPath();
            ctx.arc(v.x, v.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#9b59b6';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }

    // Feinde
    for (let e of enemies) {
        if (!e.alive) continue;
        if (e.x < viewLeftPx || e.x > viewRightPx || e.y < viewTopPx || e.y > viewBottomPx) continue;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.isSuper ? 8 : 5, 0, Math.PI * 2);
        ctx.fillStyle = e.isSuper ? '#ff00ff' : '#e74c3c';
        ctx.fill();
        ctx.strokeStyle = e.isSuper ? '#880088' : '#922b21';
        ctx.lineWidth = e.isSuper ? 2 : 1;
        ctx.stroke();
        if (e.isSuper && e.hits < e.maxHits) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${e.maxHits - e.hits}`, e.x, e.y - 12);
        }
    }

    ctx.restore();
}

// ===== SPLIT-MODUS: Zwei Kameras übereinander =====
function drawSplitScreen() {
    const halfHeight = canvas.height / 2;

    // ===== OBERE HÄLFTE: Spieler 1 =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, halfHeight);
    ctx.clip();
    ctx.translate(canvas.width / 2, halfHeight / 2);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    drawWorld(camera, 'player');

    ctx.restore();

    // ===== TRENNLINIE =====
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, halfHeight - 1, canvas.width, 2);

    // ===== UNTERE HÄLFTE: Spieler 2 =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, halfHeight, canvas.width, halfHeight);
    ctx.clip();
    ctx.translate(canvas.width / 2, halfHeight + halfHeight / 2);
    ctx.scale(cameraPlayer2.zoom, cameraPlayer2.zoom);
    ctx.translate(-cameraPlayer2.x, -cameraPlayer2.y);

    drawWorld(cameraPlayer2, 'player2');

    ctx.restore();

    // ===== SPIELER-NAMEN ÜBER DEN HÄLFTEN =====
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('👤 Spieler 1', 8, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('👤 Spieler 2', 8, canvas.height - 4);
}

// ===== WELT ZEICHNEN (wird von beiden Kameras verwendet) =====
function drawWorld(cam, playerId) {
    const c = cam || camera;

    const viewLeft = Math.max(0, Math.floor((c.x - canvas.width / 2 / c.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewRight = Math.min(CONFIG.GRID_WIDTH, Math.ceil((c.x + canvas.width / 2 / c.zoom) / CONFIG.CELL_SIZE) + 2);
    const viewTop = Math.max(0, Math.floor((c.y - canvas.height / 2 / c.zoom) / CONFIG.CELL_SIZE) - 2);
    const viewBottom = Math.min(CONFIG.GRID_HEIGHT, Math.ceil((c.y + canvas.height / 2 / c.zoom) / CONFIG.CELL_SIZE) + 2);

    // Terrain
    for (let y = viewTop; y < viewBottom; y++) {
        for (let x = viewLeft; x < viewRight; x++) {
            const type = terrainMap[y][x];
            ctx.fillStyle = getTerrainColor(type);
            ctx.fillRect(x * CONFIG.CELL_SIZE, y * CONFIG.CELL_SIZE, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fillText(getTerrainEmoji(type), x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2, y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2);
        }
    }

    // Gitter
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 0.5;
    for (let i = viewLeft; i <= viewRight; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CONFIG.CELL_SIZE, viewTop * CONFIG.CELL_SIZE);
        ctx.lineTo(i * CONFIG.CELL_SIZE, viewBottom * CONFIG.CELL_SIZE);
        ctx.stroke();
    }
    for (let j = viewTop; j <= viewBottom; j++) {
        ctx.beginPath();
        ctx.moveTo(viewLeft * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
        ctx.lineTo(viewRight * CONFIG.CELL_SIZE, j * CONFIG.CELL_SIZE);
        ctx.stroke();
    }

    // ===== START- / BAU-VORSCHAU (NUR FÜR DEN AKTIVEN SPIELER) =====
    if (playerId === 'player') {
        // Startphase (nur wenn Spieler 1 im Einzelmodus)
        if (!SPLIT_SCREEN && !gameStarted) {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const phaseText = startPhase === 'lager' ? '📦 Lager (kostenlos)' : '🏠 Haus (kostenlos)';
            ctx.fillText(`👉 Platziere dein ${phaseText}`, WORLD_WIDTH / 2, 50);
            ctx.font = '20px sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fillText('Tippe auf eine freie Zelle', WORLD_WIDTH / 2, 90);
            if (pendingStartBuild) {
                const px = pendingStartBuild.gx * CONFIG.CELL_SIZE;
                const py = pendingStartBuild.gy * CONFIG.CELL_SIZE;
                ctx.fillStyle = 'rgba(255,255,0,0.3)';
                ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                ctx.strokeStyle = '#ffd966';
                ctx.lineWidth = 3;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                ctx.setLineDash([]);
            }
        }

        // Bau-Vorschau (Spieler 1)
        if (gameStarted && pendingBuild && selectedBuildingType) {
            const px = pendingBuild.gx * CONFIG.CELL_SIZE;
            const py = pendingBuild.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,255,0,0.2)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ffd966';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
            if (selectedBuildingType === 'bauer' || selectedBuildingType === 'holzfaeller' || selectedBuildingType === 'steinmetz') {
                const neighbors = getNeighborCells(pendingBuild.gx, pendingBuild.gy, 1);
                const resourceType = selectedBuildingType === 'bauer' ? 'grain' : selectedBuildingType === 'holzfaeller' ? 'wood' : 'stone';
                for (let n of neighbors) {
                    if (!isCellOccupied(n.x, n.y) && isResourceFieldAvailable(n.x, n.y, resourceType)) {
                        ctx.fillStyle = 'rgba(0,255,0,0.25)';
                        ctx.fillRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                        ctx.strokeStyle = 'rgba(0,255,0,0.5)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    }
                }
            }
        }

        // Upgrade-Vorschau (Spieler 1)
        if (gameStarted && pendingUpgrade) {
            const px = pendingUpgrade.gx * CONFIG.CELL_SIZE;
            const py = pendingUpgrade.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,0,255,0.25)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ff66ff';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
        }

        // Abriss-Vorschau (Spieler 1)
        if (gameStarted && pendingDestroy) {
            const px = pendingDestroy.gx * CONFIG.CELL_SIZE;
            const py = pendingDestroy.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,0,0,0.25)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
        }
    }

    // ===== BAU-VORSCHAU FÜR SPIELER 2 (SPLIT-MODUS) =====
    if (SPLIT_SCREEN && playerId === 'player2') {
        // Bau-Vorschau (Spieler 2)
        if (gameStarted && pendingBuildP2 && selectedBuildingTypeP2) {
            const px = pendingBuildP2.gx * CONFIG.CELL_SIZE;
            const py = pendingBuildP2.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,165,0,0.2)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ff8a65';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
            if (selectedBuildingTypeP2 === 'bauer' || selectedBuildingTypeP2 === 'holzfaeller' || selectedBuildingTypeP2 === 'steinmetz') {
                const neighbors = getNeighborCells(pendingBuildP2.gx, pendingBuildP2.gy, 1);
                const resourceType = selectedBuildingTypeP2 === 'bauer' ? 'grain' : selectedBuildingTypeP2 === 'holzfaeller' ? 'wood' : 'stone';
                for (let n of neighbors) {
                    if (!isCellOccupied(n.x, n.y, null, 'player2') && isResourceFieldAvailable(n.x, n.y, resourceType)) {
                        ctx.fillStyle = 'rgba(255,165,0,0.25)';
                        ctx.fillRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                        ctx.strokeStyle = 'rgba(255,165,0,0.5)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(n.x * CONFIG.CELL_SIZE + 2, n.y * CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
                    }
                }
            }
        }

        // Upgrade-Vorschau (Spieler 2)
        if (gameStarted && pendingUpgradeP2) {
            const px = pendingUpgradeP2.gx * CONFIG.CELL_SIZE;
            const py = pendingUpgradeP2.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,0,255,0.25)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ff66ff';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
        }

        // Abriss-Vorschau (Spieler 2)
        if (gameStarted && pendingDestroyP2) {
            const px = pendingDestroyP2.gx * CONFIG.CELL_SIZE;
            const py = pendingDestroyP2.gy * CONFIG.CELL_SIZE;
            ctx.fillStyle = 'rgba(255,0,0,0.25)';
            ctx.fillRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(px, py, CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
            ctx.setLineDash([]);
        }
    }

    // ===== RESSOURCEN-NODES =====
    // Spieler 1 Nodes
    for (let node of resourceNodes) {
        if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
        const x = node.x * CONFIG.CELL_SIZE;
        const y = node.y * CONFIG.CELL_SIZE;
        let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
        const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
        const ratio = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = node.ready ? '#2ecc71' : '#f39c12';
        ctx.fillRect(barX, barY, barW * ratio, barH);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barW, barH);
        if (node.ready) {
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        }
    }

    // Spieler 2 Nodes (nur im Split-Modus)
    if (SPLIT_SCREEN) {
        for (let node of player2ResourceNodes) {
            if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
            const x = node.x * CONFIG.CELL_SIZE;
            const y = node.y * CONFIG.CELL_SIZE;
            let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
            ctx.fillStyle = 'rgba(255, 165, 0, 0.12)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            const ratio = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = node.ready ? '#ff8a65' : '#f39c12';
            ctx.fillRect(barX, barY, barW * ratio, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
            if (node.ready) {
                ctx.strokeStyle = '#ff8a65';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            }
        }
    }

    // NPC Nodes (nur im Einzelmodus)
    if (!SPLIT_SCREEN) {
        for (let node of npcResourceNodes) {
            if (node.x < viewLeft || node.x >= viewRight || node.y < viewTop || node.y >= viewBottom) continue;
            const x = node.x * CONFIG.CELL_SIZE;
            const y = node.y * CONFIG.CELL_SIZE;
            let icon = node.type === 'grain' ? '🌾' : node.type === 'wood' ? '🌲' : '🪨';
            ctx.fillStyle = 'rgba(155, 89, 182, 0.15)';
            ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2 - 2);
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            const ratio = node.maxTimer > 0 ? Math.min(1, node.timer / node.maxTimer) : 0;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = node.ready ? '#66ff66' : '#f39c12';
            ctx.fillRect(barX, barY, barW * ratio, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
            if (node.ready) {
                ctx.strokeStyle = '#9b59b6';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
            }
        }
    }

    // ===== GEBÄUDE =====
    let allBuildings;
    if (SPLIT_SCREEN) {
        allBuildings = [...buildings, ...player2Buildings];
    } else {
        allBuildings = [...buildings, ...npcBuildings];
    }

    for (let b of allBuildings) {
        if (b.gridX < viewLeft || b.gridX >= viewRight || b.gridY < viewTop || b.gridY >= viewBottom) continue;
        const x = b.gridX * CONFIG.CELL_SIZE;
        const y = b.gridY * CONFIG.CELL_SIZE;

        if (b.beingCaptured && b.captureProgress > 0) {
            const flashSpeed = 8;
            const flashValue = Math.sin(performance.now() / 1000 * flashSpeed) * 0.5 + 0.5;
            const progress = b.captureProgress;
            let color;
            if (b.capturedBy === 'player') color = '#ffd966';
            else if (b.capturedBy === 'player2') color = '#ff8a65';
            else color = '#ff4444';
            ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 + flashValue * 0.5})`;
            ctx.lineWidth = 2 + flashValue * 2;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(x - 1, y - 1, CONFIG.CELL_SIZE + 2, CONFIG.CELL_SIZE + 2);
            ctx.setLineDash([]);
            const barX = x, barY = y - 8, barW = CONFIG.CELL_SIZE, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = color;
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.globalAlpha = 0.4 + flashValue * 0.4;
        }

        let alpha = ctx.globalAlpha;
        let color;
        if (b.isNPC) {
            color = getNPCBuildingColor(b.type);
        } else if (b.playerId === 'player2') {
    color = getBuildingColor(b.type, 'player2');
        } else {
            color = getBuildingColor(b.type);
        }
        if (b.isUnderConstruction) {
            const progress = b.constructionProgress || 0;
            alpha = 0.2 + progress * 0.8;
        }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.fillRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = b.isNPC ? '#9b59b6' : (b.playerId === 'player2' ? '#ff8a65' : '#111');
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x + 2, y + 2, CONFIG.CELL_SIZE - 4, CONFIG.CELL_SIZE - 4);

        if (b.level > 1 && !b.isUnderConstruction) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.level, x + CONFIG.CELL_SIZE / 2, y + CONFIG.CELL_SIZE / 2);
        }

        if (!b.isUnderConstruction) {
            if (b.type === 'haus') {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.residents}/${b.maxResidents}`, x + 4, y + 4);
            } else if (b.type === 'wachturm') {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${b.stoneAmmo}/${b.maxStoneAmmo}`, x + 4, y + 4);
                if (b.doubleShot) {
                    ctx.fillStyle = '#ff66ff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.fillText('✧2', x + 28, y + 28);
                }
            }
        }

        if (b.isUnderConstruction) {
            const progress = b.constructionProgress || 0;
            const barX = x + 4, barY = y + CONFIG.CELL_SIZE - 8, barW = CONFIG.CELL_SIZE - 8, barH = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#ffd966';
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(barX, barY, barW, barH);
        }
    }

    // ===== TURM-REICHWEITE =====
    if (showTowerRange) {
        let allTowers;
        if (SPLIT_SCREEN) {
            allTowers = [...buildings.filter(b => b.type === 'wachturm'), ...player2Buildings.filter(b => b.type === 'wachturm')];
        } else {
            allTowers = buildings.filter(b => b.type === 'wachturm');
        }
        for (let tower of allTowers) {
            if (tower.isUnderConstruction) continue;
            if (tower.gridX < viewLeft || tower.gridX >= viewRight || tower.gridY < viewTop || tower.gridY >= viewBottom) continue;
            const cx = tower.gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            const cy = tower.gridY * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, tower.range * CONFIG.CELL_SIZE, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,0,0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,0,0.3)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // ===== PROJEKTILE =====
    for (let p of projectiles) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.targetX, p.targetY);
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // ===== HIT-EFFEKTE =====
    for (let effect of hitEffects) {
        for (let p of effect.particles) {
            if (p.life <= 0) continue;
            const alpha = Math.max(0, p.life / p.maxLife);
            const size = Math.max(0.5, 2 + (1 - alpha) * 4);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color || `rgb(255,${Math.floor(50 * alpha)},${Math.floor(50 * alpha)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = p.color || '#ff0000';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }

    // ===== EINWOHNER =====
    const viewLeftPx = viewLeft * CONFIG.CELL_SIZE;
    const viewRightPx = viewRight * CONFIG.CELL_SIZE;
    const viewTopPx = viewTop * CONFIG.CELL_SIZE;
    const viewBottomPx = viewBottom * CONFIG.CELL_SIZE;

    // Spieler 1
    for (let v of villagers) {
        if (!v.alive) continue;
        if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
            let color = '#4fc3f7';
            if (v.carrying === 'grain') color = '#f39c12';
            else if (v.carrying === 'wood') color = '#8b5a2b';
            else if (v.carrying === 'stone') color = '#7f8c8d';
            else if (v.isBuilding) color = '#ffd966';
            else if (v.isAttacking) color = '#ff4444';
            ctx.beginPath();
            ctx.arc(v.x, v.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#4fc3f7';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }

    // Spieler 2 (nur im Split-Modus)
    if (SPLIT_SCREEN) {
        for (let v of player2Villagers) {
            if (!v.alive) continue;
            if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
                let color = '#ff8a65';
                if (v.carrying === 'grain') color = '#f39c12';
                else if (v.carrying === 'wood') color = '#8b5a2b';
                else if (v.carrying === 'stone') color = '#7f8c8d';
                else if (v.isBuilding) color = '#ffd966';
                else if (v.isAttacking) color = '#ff4444';
                ctx.beginPath();
                ctx.arc(v.x, v.y, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#ff8a65';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }
    }

    // NPC (nur im Einzelmodus)
    if (!SPLIT_SCREEN) {
        for (let v of npcVillagers) {
            if (!v.alive) continue;
            if (v.x >= viewLeftPx && v.x <= viewRightPx && v.y >= viewTopPx && v.y <= viewBottomPx) {
                let color = '#66ccff';
                if (v.carrying === 'grain') color = '#66ff66';
                else if (v.carrying === 'wood') color = '#ff9966';
                else if (v.carrying === 'stone') color = '#ffcc66';
                else if (v.isBuilding) color = '#ffd966';
                else if (v.isAttacking) color = '#ff4444';
                ctx.beginPath();
                ctx.arc(v.x, v.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#9b59b6';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }
    }

    // ===== FEINDE =====
    for (let e of enemies) {
        if (!e.alive) continue;
        if (e.x < viewLeftPx || e.x > viewRightPx || e.y < viewTopPx || e.y > viewBottomPx) continue;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.isSuper ? 8 : 5, 0, Math.PI * 2);
        ctx.fillStyle = e.isSuper ? '#ff00ff' : '#e74c3c';
        ctx.fill();
        ctx.strokeStyle = e.isSuper ? '#880088' : '#922b21';
        ctx.lineWidth = e.isSuper ? 2 : 1;
        ctx.stroke();
        if (e.isSuper && e.hits < e.maxHits) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${e.maxHits - e.hits}`, e.x, e.y - 12);
        }
    }
}

// =========================================================================
//  MODUL 20: TOUCH-VERTEILUNG (für 2 Spieler)
//  KORRIGIERT: startConstruction() für Player 1 korrekt aufgerufen
//  NEU: Split-Start Gebäudeplatzierung für beide Spieler mit Bestätigungsdialog
// =========================================================================

// ===== TOUCH-VARIABLEN (aus Modul 4) werden verwendet =====
// touches, activeTouches, lastPinchDist, isPanning, panStart, hasMoved, MOVE_THRESHOLD

// ===== HILFSFUNKTION: Prüft ob Touch in oberer Hälfte ist =====
function isInTopHalf(y) {
    return y < canvas.height / 2;
}

// ===== SPLIT-SCREEN KOORDINATENUMRECHNUNG =====
function screenToWorldSplit(sx, sy, cam, isTopHalf) {
    const adjustedY = isTopHalf ? sy : sy - canvas.height / 2;
    const adjustedHeight = canvas.height / 2;
    return {
        x: (sx - canvas.width/2) / cam.zoom + cam.x,
        y: (adjustedY - adjustedHeight/2) / cam.zoom + cam.y
    };
}

// ===== EINZELMODUS KOORDINATENUMRECHNUNG =====
function screenToWorld(sx, sy, cam = null) {
    const c = cam || camera;
    return {
        x: (sx - canvas.width/2) / c.zoom + c.x,
        y: (sy - canvas.height/2) / c.zoom + c.y
    };
}

// ===== TOUCH START =====
function handleTouchStart(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        const touchX = t.clientX - rect.left;
        const touchY = t.clientY - rect.top;
        touches[t.identifier] = {
            x: touchX,
            y: touchY,
            startX: touchX,
            startY: touchY
        };
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 2) {
        isPanning = false;
        lastPinchDist = Math.hypot(
            activeTouches[1].x - activeTouches[0].x,
            activeTouches[1].y - activeTouches[0].y
        );
    }
}

// ===== TOUCH MOVE =====
function handleTouchMove(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    Array.from(e.changedTouches).forEach(t => {
        touches[t.identifier] = {
            x: t.clientX - rect.left,
            y: t.clientY - rect.top
        };
    });
    activeTouches = Object.values(touches);
    
    if (activeTouches.length === 2) {
        isPanning = false;
        const p1 = activeTouches[0];
        const p2 = activeTouches[1];
        
        // NUR im Split-Screen prüfen ob BEIDE Touches in der gleichen Hälfte sind
        if (SPLIT_SCREEN) {
            const p1IsTop = isInTopHalf(p1.y);
            const p2IsTop = isInTopHalf(p2.y);
            
            // Nur zoomen wenn beide in der gleichen Hälfte sind
            if (p1IsTop !== p2IsTop) {
                // Touches sind in unterschiedlichen Hälften - kein Zoom
                lastPinchDist = 0;
                markDirty();
                return;
            }
        }
        
        const newDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        
        if (lastPinchDist > 0) {
            const scale = newDist / lastPinchDist;
            if (SPLIT_SCREEN) {
                const isTop = isInTopHalf(mid.y);
                if (isTop) {
                    // Zoom für Spieler 1
                    const before = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, camera, true);
                    camera.x += before.x - after.x;
                    camera.y += before.y - after.y;
                } else {
                    // Zoom für Spieler 2
                    const before = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.zoom = Math.min(cameraPlayer2.maxZoom, Math.max(cameraPlayer2.minZoom, cameraPlayer2.zoom * scale));
                    const after = screenToWorldSplit(mid.x, mid.y, cameraPlayer2, false);
                    cameraPlayer2.x += before.x - after.x;
                    cameraPlayer2.y += before.y - after.y;
                }
            } else {
                // Einzelmodus Zoom
                const before = screenToWorld(mid.x, mid.y, camera);
                camera.zoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
                const after = screenToWorld(mid.x, mid.y, camera);
                camera.x += before.x - after.x;
                camera.y += before.y - after.y;
            }
        }
        lastPinchDist = newDist;
        markDirty();
        
    } else if (activeTouches.length === 1 && isPanning) {
        const p = activeTouches[0];
        const dx = p.x - panStart.x;
        const dy = p.y - panStart.y;
        if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
            hasMoved = true;
        }
        if (hasMoved) {
            if (SPLIT_SCREEN) {
                const startY = panStart.y;
                if (isInTopHalf(startY)) {
                    camera.x -= (p.x - panStart.x) / camera.zoom;
                    camera.y -= (p.y - panStart.y) / camera.zoom;
                } else {
                    cameraPlayer2.x -= (p.x - panStart.x) / cameraPlayer2.zoom;
                    cameraPlayer2.y -= (p.y - panStart.y) / cameraPlayer2.zoom;
                }
            } else {
                camera.x -= (p.x - panStart.x) / camera.zoom;
                camera.y -= (p.y - panStart.y) / camera.zoom;
            }
            panStart = { ...p };
            markDirty();
        }
    }
}


// ===== TOUCH END =====
function handleTouchEnd(e) {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => {
        delete touches[t.identifier];
    });
    activeTouches = Object.values(touches);
    if (activeTouches.length === 0 && isPanning && !hasMoved) {
        const touchX = panStart.x;
        const touchY = panStart.y;
        let world;
        let playerId = 'player';
        if (SPLIT_SCREEN) {
            const isTop = isInTopHalf(touchY);
            if (isTop) {
                world = screenToWorldSplit(touchX, touchY, camera, true);
                playerId = 'player';
            } else {
                world = screenToWorldSplit(touchX, touchY, cameraPlayer2, false);
                playerId = 'player2';
            }
        } else {
            world = screenToWorld(touchX, touchY, camera);
            playerId = 'player';
        }
        const gx = Math.floor(world.x / CONFIG.CELL_SIZE);
        const gy = Math.floor(world.y / CONFIG.CELL_SIZE);
        if (gx >= 0 && gx < CONFIG.GRID_WIDTH && gy >= 0 && gy < CONFIG.GRID_HEIGHT) {
            handleTap(playerId, gx, gy);
        }
    }
    if (activeTouches.length === 0) {
        isPanning = false;
        hasMoved = false;
        lastPinchDist = 0;
    } else if (activeTouches.length === 1) {
        isPanning = true;
        panStart = { ...activeTouches[0] };
        hasMoved = false;
    }
}

// ===== TAP VERARBEITUNG (KORRIGIERT) =====
// ===== TAP VERARBEITUNG (KORRIGIERT mit Dialog-Rotation) =====
function handleTap(playerId, gx, gy) {

    // ===== SPLIT-START: Platzierung der Startgebäude (BEIDE SPIELER) =====
    if (SPLIT_SCREEN && splitStartPhase && !gameStarted) {
        const isPlayer1Phase = splitStartPhase.startsWith('player1');
        const currentPlayer = isPlayer1Phase ? 'player' : 'player2';
        if (playerId !== currentPlayer) {
            showTemporaryMessage(`❌ Jetzt ist ${isPlayer1Phase ? 'Spieler 1' : 'Spieler 2'} dran!`, '#ff6b6b', true);
            return;
        }

        const gridLimit = Math.floor(CONFIG.GRID_HEIGHT / 3);
        if (isPlayer1Phase && gy > gridLimit) {
            showTemporaryMessage('❌ Spieler 1 darf nur im oberen Drittel bauen!', '#ff6b6b', true);
            return;
        }
        if (!isPlayer1Phase && gy < CONFIG.GRID_HEIGHT - gridLimit) {
            showTemporaryMessage('❌ Spieler 2 darf nur im unteren Drittel bauen!', '#ff6b6b', true);
            return;
        }

        if (isCellOccupied(gx, gy)) {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
            return;
        }

        const type = splitStartPhase.includes('lager') ? 'lager' : 'haus';
        const typeDisplay = type === 'lager' ? '📦 Lager' : '🏠 Haus';
        const playerDisplay = isPlayer1Phase ? 'Spieler 1' : 'Spieler 2';
        pendingSplitStart = { gx, gy, player: isPlayer1Phase ? 'player1' : 'player2', type: type };
        
        // === DIALOG ROTATION SETZEN ===
        dialogNeedsRotation = isPlayer1Phase;
        dialogIsUrgent = true;
        
        document.getElementById('confirmText').textContent = `${typeDisplay} an dieser Stelle für ${playerDisplay} platzieren?`;
        document.getElementById('costDisplay').textContent = '✅ Startgebäude - kostenlos';
        document.getElementById('effectDisplay').textContent = `6 Einwohner (beim Haus)`;
        document.getElementById('confirmDialog').style.display = 'block';
        
        // Rotation anwenden
        applyDialogRotation();
        window._pendingSplitStart = true;
        return;
    }

    // ===== EINZELMODUS START (Lager/Haus) =====
    if (!gameStarted && !SPLIT_SCREEN) {
        if (!isCellOccupied(gx, gy, null, playerId)) {
            if (startPhase === 'lager') {
                pendingStartBuild = { gx, gy };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = '📦 Lager an dieser Stelle platzieren? (kostenlos)';
                document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
                document.getElementById('effectDisplay').textContent = 'Dein erstes Lager';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingStartType = 'lager';
                return;
            } else if (startPhase === 'haus') {
                pendingStartBuild = { gx, gy };
                dialogNeedsRotation = false;
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = '🏠 Haus an dieser Stelle platzieren? (kostenlos)';
                document.getElementById('costDisplay').textContent = '✅ Startgebäude - keine Kosten';
                document.getElementById('effectDisplay').textContent = 'Dein erstes Haus mit 6 Einwohnern';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingStartType = 'haus';
                return;
            }
        } else {
            showTemporaryMessage('❌ Diese Zelle ist bereits belegt!', '#ff6b6b', true);
        }
        return;
    }

    // ===== SPIELER (player) =====
    if (playerId === 'player') {
        // Abriss-Modus
        if (destroyMode) {
            const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
            if (building) {
                pendingDestroy = { gx, gy };
                dialogNeedsRotation = SPLIT_SCREEN;  // Im Split-Modus drehen
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (Level ${building.level}) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingDestroy = true;
                return;
            }
            showTemporaryMessage('❌ Kein Gebäude zum Abreissen gefunden!', '#ff6b6b', true);
            return;
        }
        
        // Upgrade-Modus
        if (upgradeMode) {
            const building = buildings.find(b => b.gridX === gx && b.gridY === gy);
            if (building && building.level < 3) {
                pendingUpgrade = { building, gx, gy };
                const { cost, effect } = getUpgradeCostAndEffect(building);
                dialogNeedsRotation = SPLIT_SCREEN;  // Im Split-Modus drehen
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} auf Stufe ${building.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone > 0 ? cost.stone + '🪨' : ''}`;
                document.getElementById('effectDisplay').textContent = `Effekt: ${effect.desc}`;
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingUpgrade = true;
                return;
            } else if (building && building.level >= 3) {
                showTemporaryMessage('⚠️ Maximale Stufe (3) erreicht!', '#ff6b6b', true);
                upgradeMode = false;
                document.getElementById('upgradeBtn').classList.remove('active');
                return;
            } else {
                showTemporaryMessage('❌ Kein Gebäude zum Upgraden gefunden!', '#ff6b6b', true);
                upgradeMode = false;
                document.getElementById('upgradeBtn').classList.remove('active');
                return;
            }
        }
        
        // Bau-Modus
        if (selectedBuildingType) {
            if (pendingBuild && pendingBuild.gx === gx && pendingBuild.gy === gy) {
                if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
                    pendingBuild = null;
                    showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966', true);
                }
            } else {
                pendingBuild = { gx, gy };
            }
            return;
        }
    }
    
    // ===== SPIELER 2 (player2) =====
    if (playerId === 'player2' && SPLIT_SCREEN) {
        // Abriss-Modus Spieler 2
        if (destroyModeP2) {
            const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
            if (building) {
                pendingDestroyP2 = { gx, gy };
                dialogNeedsRotation = false;  // Spieler 2 ist unten, keine Drehung
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} (Level ${building.level}) wirklich abreissen?`;
                document.getElementById('costDisplay').textContent = 'Keine Rückerstattung!';
                document.getElementById('effectDisplay').textContent = '';
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingDestroyP2 = true;
                return;
            }
            showTemporaryMessage('❌ Kein Gebäude zum Abreissen gefunden!', '#ff6b6b', true);
            return;
        }
        
        // Upgrade-Modus Spieler 2
        if (upgradeModeP2) {
            const building = player2Buildings.find(b => b.gridX === gx && b.gridY === gy);
            if (building && building.level < 3) {
                pendingUpgradeP2 = { building, gx, gy };
                const { cost, effect } = getUpgradeCostAndEffect(building);
                dialogNeedsRotation = false;  // Spieler 2 ist unten, keine Drehung
                dialogIsUrgent = true;
                document.getElementById('confirmText').textContent = `${building.type.toUpperCase()} auf Stufe ${building.level + 1} upgraden?`;
                document.getElementById('costDisplay').textContent = `Kosten: ${cost.wood}🪵 ${cost.stone > 0 ? cost.stone + '🪨' : ''}`;
                document.getElementById('effectDisplay').textContent = `Effekt: ${effect.desc}`;
                document.getElementById('confirmDialog').style.display = 'block';
                applyDialogRotation();
                window._pendingUpgradeP2 = true;
                return;
            } else if (building && building.level >= 3) {
                showTemporaryMessage('⚠️ Maximale Stufe (3) erreicht!', '#ff6b6b', true);
                upgradeModeP2 = false;
                document.getElementById('upgradeBtnSplit2').classList.remove('active');
                return;
            } else {
                showTemporaryMessage('❌ Kein Gebäude zum Upgraden gefunden!', '#ff6b6b', true);
                upgradeModeP2 = false;
                document.getElementById('upgradeBtnSplit2').classList.remove('active');
                return;
            }
        }
        
        // Bau-Modus Spieler 2
        if (selectedBuildingTypeP2) {
            if (pendingBuildP2 && pendingBuildP2.gx === gx && pendingBuildP2.gy === gy) {
                if (startConstructionPlayer2(selectedBuildingTypeP2, pendingBuildP2.gx, pendingBuildP2.gy)) {
                    pendingBuildP2 = null;
                    showTemporaryMessage(`🔨 ${selectedBuildingTypeP2} wird gebaut... (10s)`, '#ffd966', true);
                }
            } else {
                pendingBuildP2 = { gx, gy };
            }
            return;
        }
    }
}

// ===== DIALOG-ROTATION ANWENDEN =====
function applyDialogRotation() {
    const dialog = document.getElementById('confirmDialog');
    if (!dialog) return;
    
    // Nur den Text-Container drehen, nicht den ganzen Dialog!
    const confirmText = document.getElementById('confirmText');
    const costDisplay = document.getElementById('costDisplay');
    const effectDisplay = document.getElementById('effectDisplay');
    
    if (SPLIT_SCREEN && dialogNeedsRotation) {
        // NUR den Text drehen
        if (confirmText) confirmText.style.transform = 'rotate(180deg)';
        if (costDisplay) costDisplay.style.transform = 'rotate(180deg)';
        if (effectDisplay) effectDisplay.style.transform = 'rotate(180deg)';
        
        // Dialog-Container NICHT drehen!
        dialog.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    } else {
        // Alles zurücksetzen
        if (confirmText) confirmText.style.transform = 'rotate(0deg)';
        if (costDisplay) costDisplay.style.transform = 'rotate(0deg)';
        if (effectDisplay) effectDisplay.style.transform = 'rotate(0deg)';
        dialog.style.transform = 'translate(-50%, -50%) rotate(0deg)';
    }
}

function handleConfirmYes() {

    if (window._pendingSplitStart && pendingSplitStart) {
        if (placeSplitStartBuilding(pendingSplitStart.player, pendingSplitStart.type, pendingSplitStart.gx, pendingSplitStart.gy)) {

            advanceSplitStart();
        } else {

        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;

    }

    // ===== EINZELMODUS START LAGER =====
    if (window._pendingStartType === 'lager' && pendingStartBuild) {
        const lager = new Building(nextBuildingId++, 'lager', pendingStartBuild.gx, pendingStartBuild.gy, false);
        lager.isUnderConstruction = false;
        lager.constructionProgress = 1;
        buildings.push(lager);
        startPhase = 'haus';
        pendingStartBuild = null;
        window._pendingStartType = null;
        showTemporaryMessage('✅ Lager platziert! Jetzt Haus platzieren', '#ffd966', true);
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== EINZELMODUS START HAUS =====
    if (window._pendingStartType === 'haus' && pendingStartBuild) {
        const haus = new Building(nextBuildingId++, 'haus', pendingStartBuild.gx, pendingStartBuild.gy, false);
        haus.isUnderConstruction = false;
        haus.constructionProgress = 1;
        haus.residents = 6;
        haus.maxResidents = 6;
        haus.maxProductionTime = 30;
        haus.baseMaxProductionTime = 30;
        buildings.push(haus);
        for (let i = 0; i < 6; i++) {
            spawnVillager(haus.id);
        }
        gameStarted = true;
        pendingStartBuild = null;
        window._pendingStartType = null;
        startPhase = 'lager';
        resources.grain = parseInt(document.getElementById('startGrain').value) || 10;
        resources.wood = parseInt(document.getElementById('startWood').value) || 10;
        resources.stone = parseInt(document.getElementById('startStone').value) || 0;
        if (!SPLIT_SCREEN) {
            initNPC();
        }
        showTemporaryMessage('🎮 Spiel gestartet! 6 Einwohner warten auf Befehle!', '#2ecc71', true);
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== ZERSTÖRUNG SPIELER 1 =====
    if (window._pendingDestroy && pendingDestroy) {
        if (destroyBuilding(pendingDestroy.gx, pendingDestroy.gy)) {
            pendingDestroy = null;
            destroyMode = false;
            document.getElementById('destroyBtn').classList.remove('active');
            showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b', true);
        }
        window._pendingDestroy = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== ZERSTÖRUNG SPIELER 2 =====
    if (window._pendingDestroyP2 && pendingDestroyP2) {
        if (destroyBuildingPlayer2(pendingDestroyP2.gx, pendingDestroyP2.gy)) {
            pendingDestroyP2 = null;
            destroyModeP2 = false;
            document.getElementById('destroyBtnSplit2').classList.remove('active');
            showTemporaryMessage('💀 Gebäude abgerissen', '#ff6b6b', true);
        }
        window._pendingDestroyP2 = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== UPGRADE SPIELER 1 =====
    if (window._pendingUpgrade && pendingUpgrade) {
        const building = pendingUpgrade.building;
        if (upgradeBuilding(building)) {
            showTemporaryMessage(`⬆️ Upgrade auf Stufe ${building.level} erfolgreich!`, '#ffd966', true);
            pendingUpgrade = null;
        }
        window._pendingUpgrade = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== UPGRADE SPIELER 2 =====
    if (window._pendingUpgradeP2 && pendingUpgradeP2) {
        const building = pendingUpgradeP2.building;
        if (upgradeBuildingPlayer2(building)) {
            showTemporaryMessage(`⬆️ Upgrade auf Stufe ${building.level} erfolgreich!`, '#ffd966', true);
            pendingUpgradeP2 = null;
        }
        window._pendingUpgradeP2 = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== BAU SPIELER 1 (HOST) =====
    if (pendingBuild && selectedBuildingType) {
        if (startConstruction(selectedBuildingType, pendingBuild.gx, pendingBuild.gy)) {
            pendingBuild = null;
            showTemporaryMessage(`🔨 ${selectedBuildingType} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== BAU SPIELER 2 (CLIENT) =====
    if (pendingBuildP2 && selectedBuildingTypeP2) {
        if (startConstructionPlayer2(selectedBuildingTypeP2, pendingBuildP2.gx, pendingBuildP2.gy)) {
            pendingBuildP2 = null;
            showTemporaryMessage(`🔨 ${selectedBuildingTypeP2} wird gebaut... (10s)`, '#ffd966', true);
        }
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        markDirty();
        return;
    }
    
    // ===== HAUPTMENÜ =====
    if (window._pendingMainMenu) {
        window._pendingMainMenu = false;
        document.getElementById('confirmDialog').style.display = 'none';
        dialogNeedsRotation = false;
        dialogIsUrgent = false;
        location.reload();
        return;
    }
    
    // ===== FALLBACK =====
    document.getElementById('confirmDialog').style.display = 'none';
    dialogNeedsRotation = false;
    dialogIsUrgent = false;
}

// ===== DIALOG-ROTATION ANWENDEN =====
function applyDialogRotation() {
    const dialog = document.getElementById('confirmDialog');
    if (!dialog) return;
    
    if (SPLIT_SCREEN && dialogNeedsRotation) {
        dialog.style.transform = 'translate(-50%, -50%) rotate(180deg)';
        const buttonContainer = dialog.querySelector('div:last-child');
        if (buttonContainer) {
            buttonContainer.style.transform = 'rotate(0deg)';
        }
    } else {
        dialog.style.transform = 'translate(-50%, -50%) rotate(0deg)';
        const buttonContainer = dialog.querySelector('div:last-child');
        if (buttonContainer) {
            buttonContainer.style.transform = 'rotate(0deg)';
        }
    }
}

function handleConfirmNo() {
    if (window._pendingStartType) {
        window._pendingStartType = null;
        pendingStartBuild = null;
    }
    if (window._pendingSplitStart) {
        window._pendingSplitStart = false;
        pendingSplitStart = null;
    }
    if (window._pendingMainMenu) {
        window._pendingMainMenu = false;
    }
    window._pendingDestroy = false;
    window._pendingDestroyP2 = false;
    window._pendingUpgrade = false;
    window._pendingUpgradeP2 = false;
    pendingDestroy = null;
    pendingDestroyP2 = null;
    pendingUpgrade = null;
    pendingUpgradeP2 = null;
    pendingBuild = null;
    pendingBuildP2 = null;
    document.getElementById('confirmDialog').style.display = 'none';
}

    if (rangeBtn) {
        rangeBtn.addEventListener('click', function() {

                this.style.textShadow = 'none';

        });

            this.click();
        }, { passive: false });

            modeDisplay.textContent = `${role} ☠️ 5R`;
            modeDisplay.style.borderLeft = IS_HOST ? '2px solid rgba(79,195,247,0.4)' : '2px solid rgba(255,138,101,0.4)';
            modeDisplay.style.borderRight = '2px solid rgba(255,68,68,0.4)';
            modeDisplay.style.background = 'rgba(60,10,10,0.3)';
        } else {
            const npcStatus = typeof isNpcPeaceMode === 'function' ? isNpcPeaceMode() : true;
            const playerStatus = gameMode === 'peace' ? '🕊️' : '☠️';
            const rangeText = gameMode === 'peace' ? '3R' : '5R';
            const npcPop = npcVillagers ? npcVillagers.filter(v => v.alive).length : 0;
            const popStatus = npcPop >= WAR_POPULATION_THRESHOLD ? '💀' : '';
            modeDisplay.textContent = `${playerStatus} ${rangeText} ${npcStatus ? '🕊️' : '☠️'}${popStatus}`;

            modeDisplay.style.background = gameMode === 'war' ? 'rgba(60,10,10,0.3)' : 'rgba(10,60,10,0.3)';

    window.updateModeDisplay();
}
