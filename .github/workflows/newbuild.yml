name: Build Android APK with WASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean workspace
        run: |
          rm -rf android
          rm -rf node_modules
          rm -rf package-lock.json

      # ============================================================
      # 🔥 WASM BUILD
      # ============================================================
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Compile WASM from C++
        run: |
          emcc villager_optimized.cpp \
            -o villager_optimized.wasm \
            -O3 \
            --no-entry \
            -s EXPORTED_FUNCTIONS='[
              "_moveVillagersBatch", 
              "_findNearestEnemy", 
              "_updateCombatBatch", 
              "_findBestBuildPosition", 
              "_isPositionValidForNPC", 
              "_countResourcesAround",
              "_moveNpcVillagersBatch",
              "_findNearestNpcVillager",
              "_updateNpcHarvestBatch",
              "_movePlayer2VillagersBatch",
              "_findNearestPlayer2Villager",
              "_updatePlayer2HarvestBatch"
            ]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall", "cwrap"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=16777216

      - name: Convert WASM to Base64
        run: |
          WASM_B64=$(base64 -w 0 villager_optimized.wasm)
          echo "WASM_BASE64=$WASM_B64" >> $GITHUB_ENV
          cd www
          sed -i "s|// WASM_BASE64_PLACEHOLDER|const WASM_BASE64 = \"$WASM_B64\";|g" index.html
          cd ..
          echo "✅ WASM Base64 in www/index.html eingebettet!"

      # ============================================================
      # 📱 ANDROID APK BUILD
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android
        run: npm install @capacitor/android

      - name: Install Capacitor Assets
        run: npm install --save-dev @capacitor/assets

      - name: Dummy build
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Copy WASM to assets
        run: |
          mkdir -p android/app/src/main/assets/
          cp villager_optimized.wasm android/app/src/main/assets/
          echo "✅ WASM in assets kopiert!"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android Icons
        run: npx capacitor-assets generate --android

      #######################################################################
      # 🔥 KOMPLETTE build.gradle ERSETZEN
      #######################################################################

      - name: Replace build.gradle with working version
        run: |
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.tgu.shopapp"
              compileSdk 34

              defaultConfig {
                  applicationId "com.tgu.shopapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "tgu123"
                      keyAlias "tgu"
                      keyPassword "tgu123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          repositories {
              flatDir {
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation project(':capacitor-android')
              implementation "androidx.browser:browser:1.8.0"
              testImplementation "junit:junit:4.13.2"
              androidTestImplementation "androidx.test.ext:junit:1.1.5"
              androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
          }

          apply from: 'capacitor.build.gradle'
          EOF

      - name: Create No-UI Browser Activity
        run: |
          mkdir -p android/app/src/main/java/com/tgu/shopapp
          cat > android/app/src/main/java/com/tgu/shopapp/NoUiBrowserActivity.java << 'EOF'
          package com.tgu.shopapp;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import androidx.browser.customtabs.CustomTabsIntent;

          public class NoUiBrowserActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  CustomTabsIntent.Builder builder = new CustomTabsIntent.Builder();
                  builder.setShowTitle(false);
                  builder.setUrlBarHidingEnabled(true);

                  CustomTabsIntent customTabsIntent = builder.build();
                  customTabsIntent.intent.addFlags(Intent.FLAG_ACTIVITY_NO_HISTORY);
                  customTabsIntent.intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                  customTabsIntent.launchUrl(this, Uri.parse("https://www.tgu-shop.com"));
              }
          }
          EOF

      - name: Patch AndroidManifest for No-UI Browser
        run: |
          sed -i '/<\/application>/i \    <activity android:name="com.tgu.shopapp.NoUiBrowserActivity" android:theme="@android:style/Theme.NoDisplay" android:excludeFromRecents="true" android:launchMode="singleTask" />' android/app/src/main/AndroidManifest.xml

      - name: Patch MainActivity to launch No-UI Browser
        run: |
          sed -i '/package com.tgu.shopapp;/a import android.content.Intent;' android/app/src/main/java/com/tgu/shopapp/MainActivity.java
          sed -i '/super.onCreate(savedInstanceState);/a Intent intent = new Intent(this, NoUiBrowserActivity.class); startActivity(intent);' android/app/src/main/java/com/tgu/shopapp/MainActivity.java

      #######################################################################
      # 🔥 SIGNIERUNG
      #######################################################################

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -alias tgu \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore release.keystore \
            -storepass tgu123 \
            -keypass tgu123 \
            -dname "CN=TGU, OU=IT, O=TGU, L=Greven, S=NRW, C=DE" || echo "Keystore exists"

      - name: Copy keystore into android app
        run: cp release.keystore android/app/release.keystore

      #######################################################################
      # 🔥 RELEASE BUILD
      #######################################################################

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --quiet

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tgu-release.apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: villager_optimized.wasm
          path: villager_optimized.wasm