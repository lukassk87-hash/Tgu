
name: Delete artifacts older than 2 days

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup-old-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Delete artifacts older than 2 days
        uses: actions/github-script@v7
        with:
          script: |
            const days = 2;
            const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
            const cutoffDate = new Date(cutoff);
            console.log(`Cutoff: ${cutoffDate.toISOString()} (älter als ${days} Tage wird gelöscht)`);

            let page = 1;
            let deleted = 0;
            let seen = 0;

            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page
              });

              if (data.artifacts.length === 0) {
                console.log("Keine weiteren Artefakte gefunden.");
                break;
              }

              for (const artifact of data.artifacts) {
                const created = new Date(artifact.created_at);
                const ageMs = Date.now() - created.getTime();
                const ageHours = ageMs / (1000 * 60 * 60);

                console.log(
                  `Artifact: ${artifact.name} | created_at: ${artifact.created_at} | Alter: ${ageHours.toFixed(2)}h`
                );

                seen++;

                if (created.getTime() < cutoff) {
                  console.log(`→ Löschen: ${artifact.name}`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  deleted++;
                } else {
                  console.log(`→ Behalten (jünger als ${days} Tage): ${artifact.name}`);
                }
              }

              page++;
            }

            console.log(`Fertig. Insgesamt gesehen: ${seen}, gelöscht: ${deleted}, behalten: ${seen - deleted}.`);