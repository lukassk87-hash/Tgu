name: Delete artifacts older than 2 days

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup-old-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Delete artifacts older than 2 days
        uses: actions/github-script@v7
        with:
          script: |
            const days = 2;
            const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;

            let page = 1;
            let deleted = 0;

            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page
              });

              if (data.artifacts.length === 0) break;

              for (const artifact of data.artifacts) {
                const created = new Date(artifact.created_at).getTime();
                if (created < cutoff) {
                  console.log(`Deleting: ${artifact.name}`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  deleted++;
                }
              }

              page++;
            }

            console.log(`Done. Deleted ${deleted} artifacts older than ${days} days.`);